# Workbook of lesson 0.4 — direct proof, proof by contradiction, counterexample, "if and only if".
# Objectives (src/course.ts):
#   OBJ-0.4-1  prove a simple claim directly and by contradiction
#   OBJ-0.4-2  disprove a general claim with one counterexample; explain why supporting examples are not a proof
#   OBJ-0.4-3  prove an "if and only if" claim in both directions
# Every number and every counterexample below was recomputed with src/math/numbertheory.ts (isPrime, factorize)
# and brute-force probes over a range; the probes are evidence, the proofs are in the solutions.
lesson: '0.4'
practice:
  - id: W-0.4-01
    level: basic
    objectives: [OBJ-0.4-1]
    prompt: >-
      הוכיחו בהוכחה ישירה: אם $a$ ו-$b$ שלמים אי-זוגיים, אז $a+b$ זוגי.
    answer: >-
      $a=2k+1$, $b=2l+1$, ולכן $a+b=2(k+l+1)$ זוגי.
    solution:
      - kind: given
        text: '$a$ ו-$b$ שלמים אי-זוגיים.'
      - kind: goal
        text: 'להראות ש-$a+b=2m$ עבור $m$ שלם כלשהו.'
      - kind: idea
        text: >-
          לתרגם את ההנחה לנוסחאות לפי ההגדרה, לחבר, ולהוציא 2 כגורם משותף.
      - kind: definition
        text: >-
          $a$ אי-זוגי, ולכן $a=2k+1$ עבור $k$ שלם; $b$ אי-זוגי, ולכן $b=2l+1$ עבור $l$ שלם. שימו לב: שתי אותיות
          שונות, $k$ ו-$l$. אם נכתוב את שניהם עם אותו $k$, נוכיח רק את המקרה $a=b$.
      - kind: computation
        text: '$a+b=(2k+1)+(2l+1)=2k+2l+2=2(k+l+1)$.'
      - kind: step
        text: '$m=k+l+1$ שלם, כי סכום של שלמים הוא שלם. לפי ההגדרה, $a+b$ זוגי.'
      - kind: check
        text: '$3+7=10=2\cdot5$, ואכן $k=1$, $l=3$ נותנים $m=1+3+1=5$.'
      - kind: result
        text: 'הסכום של שני שלמים אי-זוגיים הוא זוגי.'

  - id: W-0.4-02
    level: basic
    qualitative: true
    objectives: [OBJ-0.4-2]
    prompt: >-
      הפריכו כל טענה בדוגמה נגדית אחת, והראו שהיא באמת דוגמה נגדית.

      (א) לכל $n$ טבעי, $n^2\ge 2n$.

      (ב) לכל $a,b$ ממשיים, $(a+b)^2=a^2+b^2$.

      (ג) לכל $x$ ממשי, אם $x^2=4$ אז $x=2$.
    answer: >-
      (א) $n=1$: $1\ge2$ שקרי. (ב) $a=b=1$: $4\ne2$. (ג) $x=-2$: $x^2=4$ אבל $x\ne2$.
    solution:
      - kind: idea
        text: >-
          כל טענה היא טענת "לכל", ולכן מספיק מקרה אחד שבו היא נכשלת. בגרירה (ג) המקרה צריך לקיים את ההנחה ולא
          לקיים את המסקנה.
      - kind: computation
        text: >-
          (א) $n=1$: אגף שמאל $1^2=1$, אגף ימין $2\cdot1=2$, ו-$1\ge2$ שקרי. (לכל $n\ge2$ דווקא $n^2=n\cdot n\ge 2n$,
          ולכן זו הדוגמה הנגדית היחידה; אבל להפרכה מספיק שהיא קיימת.)
      - kind: computation
        text: '(ב) $a=b=1$: $(1+1)^2=4$, ואילו $1^2+1^2=2$. $4\ne2$.'
      - kind: computation
        text: >-
          (ג) $x=-2$: ההנחה מתקיימת, כי $(-2)^2=4$; המסקנה $x=2$ לא מתקיימת. לעומת זאת $x=3$ אינו דוגמה נגדית:
          $3^2=9\ne4$, ההנחה לא מתקיימת, ושם הגרירה נכונה.
      - kind: check
        text: >-
          בכל סעיף יש הרבה דוגמאות תומכות: $n=5$ ב-(א), $a=0$ ב-(ב), $x=2$ ב-(ג). הן לא משנות את התשובה: מקרה אחד
          רע מספיק.
      - kind: result
        text: '(א) $n=1$. (ב) $a=b=1$. (ג) $x=-2$.'

  - id: W-0.4-03
    level: basic
    qualitative: true
    objectives: [OBJ-0.4-3]
    prompt: >-
      הטענה: לכל $n$ שלם, $n$ אי-זוגי אם ורק אם $n+1$ זוגי.

      (א) כתבו במפורש את שתי הטענות שצריך להוכיח: הכיוון הראשון והכיוון השני.

      (ב) הוכיחו את שתיהן.
    answer: >-
      (א) הכיוון הראשון: אם $n$ אי-זוגי אז $n+1$ זוגי. הכיוון השני: אם $n+1$ זוגי אז $n$ אי-זוגי. (ב) $n=2k+1$ נותן
      $n+1=2(k+1)$; ו-$n+1=2m$ נותן $n=2(m-1)+1$.
    solution:
      - kind: idea
        text: >-
          "אם ורק אם" הוא שתי גרירות. בכל אחת מתרגמים את ההנחה לנוסחה לפי ההגדרה, ומסדרים את התוצאה בצורה שההגדרה
          של המסקנה דורשת.
      - kind: goal
        text: >-
          (א) הכיוון הראשון: לכל $n$ שלם, אם $n$ אי-זוגי אז $n+1$ זוגי. הכיוון השני: לכל $n$ שלם, אם $n+1$ זוגי אז
          $n$ אי-זוגי.
      - kind: step
        text: '(ב) הכיוון הראשון: נניח $n=2k+1$. אז $n+1=2k+2=2(k+1)$, ו-$k+1$ שלם, ולכן $n+1$ זוגי.'
      - kind: step
        text: >-
          הכיוון השני: נניח $n+1=2m$ עבור $m$ שלם. אז $n=2m-1=2(m-1)+1$, ו-$m-1$ שלם, ולכן $n$ אי-זוגי.
      - kind: check
        text: >-
          הטענה "אם $n+1$ אי-זוגי אז $n$ זוגי" היא הקונטרפוזיטיב של הכיוון הראשון: היא שקולה לו, ולכן הוכחה שלה לא
          הייתה מחליפה את הכיוון השני.
      - kind: result
        text: 'שני הכיוונים הוכחו: $n$ אי-זוגי אם ורק אם $n+1$ זוגי.'

  - id: W-0.4-04
    level: mid
    objectives: [OBJ-0.4-1]
    prompt: >-
      הוכיחו: לכל $n$ שלם, אם $5n+3$ זוגי אז $n$ אי-זוגי.
    answer: >-
      דרך הקונטרפוזיטיב: אם $n=2k$ אז $5n+3=2(5k+1)+1$ אי-זוגי.
    solution:
      - kind: idea
        text: >-
          ההנחה היא על $5n+3$ והמסקנה על $n$. קל יותר להתחיל מ-$n$, ולכן נוכיח את הקונטרפוזיטיב: אם $n$ אינו אי-זוגי
          (כלומר זוגי), אז $5n+3$ אינו זוגי (כלומר אי-זוגי).
      - kind: theorem
        text: '"אם $P$ אז $Q$" שקולה ל"אם לא $Q$ אז לא $P$" (שיעור 0.2), ולכן הוכחת הקונטרפוזיטיב מוכיחה את הטענה.'
      - kind: step
        text: 'נניח ש-$n$ זוגי: $n=2k$ עבור $k$ שלם.'
      - kind: computation
        text: '$5n+3=10k+3=10k+2+1=2(5k+1)+1$, ו-$5k+1$ שלם.'
      - kind: step
        text: 'לכן $5n+3$ אי-זוגי, כלומר אינו זוגי (שלם אינו זוגי ואי-זוגי יחד). זה הקונטרפוזיטיב.'
      - kind: check
        text: '$n=1$: $5+3=8$ זוגי, ו-$n$ אי-זוגי. $n=2$: $13$ אי-זוגי, וההנחה לא מתקיימת. מתאים.'
      - kind: result
        text: 'לכל $n$ שלם, אם $5n+3$ זוגי אז $n$ אי-זוגי.'

  - id: W-0.4-05
    level: mid
    objectives: [OBJ-0.4-1]
    prompt: >-
      יהי $x$ מספר ממשי אי-רציונלי. הוכיחו בדרך השלילה ש-$\frac1x$ אי-רציונלי.
    answer: >-
      אם $\frac1x=\frac pq$ אז $p\ne0$ ו-$x=\frac qp$ רציונלי: סתירה.
    solution:
      - kind: given
        text: '$x$ ממשי ואינו רציונלי. בפרט $x\ne0$, כי $0=\frac01$ רציונלי, ולכן $\frac1x$ מוגדר.'
      - kind: idea
        text: 'אם $\frac1x$ היה שבר של שלמים, אפשר היה להפוך אותו ולקבל את $x$ כשבר של שלמים.'
      - kind: step
        text: 'נניח בשלילה ש-$\frac1x$ רציונלי: $\frac1x=\frac pq$ עם $p,q$ שלמים ו-$q\ne0$.'
      - kind: step
        text: >-
          $p\ne0$: אילו $p=0$, היה $\frac1x=0$, אבל $\frac1x\cdot x=1\ne0$. זה הצעד שקל לשכוח: בלעדיו אי אפשר
          להפוך את השבר.
      - kind: computation
        text: 'נהפוך את שני האגפים: $x=\frac qp$, עם $q,p$ שלמים ו-$p\ne0$.'
      - kind: step
        text: 'לכן $x$ רציונלי, בסתירה לנתון. ההנחה שגויה.'
      - kind: result
        text: 'אם $x$ אי-רציונלי, גם $\frac1x$ אי-רציונלי.'

  - id: W-0.4-06
    level: mid
    qualitative: true
    objectives: [OBJ-0.4-2]
    prompt: >-
      סטודנט בדק את הטענה "לכל $n$ טבעי, $n^2+n+11$ ראשוני" עבור $n=1,\dots,9$, קיבל בכל פעם ראשוני, וכתב "הוכח".

      (א) האם הטענה נכונה? אם לא, מצאו את הדוגמה הנגדית הקטנה ביותר.

      (ב) מה הייתה הטעות בטיעון שלו?
    answer: >-
      (א) לא. $n=10$: $100+10+11=121=11^2$. (ב) תשעה מקרים הם דוגמאות תומכות; הם לא אומרים דבר על $n=10$.
    solution:
      - kind: computation
        text: >-
          עבור $n=1,\dots,9$ מקבלים $13, 17, 23, 31, 41, 53, 67, 83, 101$, וכולם ראשוניים: הבדיקה של הסטודנט נכונה.
      - kind: idea
        text: >-
          כמו בטענה של אוילר, מחפשים $n$ שהופך את הביטוי לכפולה של 11: $n^2+n+11=n(n+1)+11$, ולכן כש-11 מחלק את
          $n$ או את $n+1$, גם הסכום מתחלק ב-11.
      - kind: computation
        text: '(א) $n=10$: $n(n+1)+11=10\cdot11+11=11\cdot11=121$, שאינו ראשוני.'
      - kind: check
        text: '$n=10$ הוא הקטן ביותר, כי $n=1,\dots,9$ נתנו ראשוניים. גם $n=11$ נכשל: $121+11+11=143=11\cdot13$.'
      - kind: step
        text: >-
          (ב) הטענה מדברת על אינסוף מקרים, והבדיקה כיסתה תשעה. דוגמאות תומכות לא מוכיחות טענת "לכל"; הן רק
          מראות שעוד לא נמצאה דוגמה נגדית. ובמקרה הזה היא חיכתה בדיוק במקרה הבא.
      - kind: result
        text: 'הטענה שקרית; הדוגמה הנגדית הקטנה ביותר היא $n=10$.'

  - id: W-0.4-07
    level: mid
    objectives: [OBJ-0.4-3]
    prompt: >-
      הוכיחו: לכל $n$ שלם, $3\mid n^2$ אם ורק אם $3\mid n$. מותר להשתמש בכך שכל שלם הוא מאחת הצורות $3k$, $3k+1$,
      $3k+2$ ($k$ שלם), ובדיוק מאחת מהן.
    answer: >-
      הכיוון השני: $n=3k$ נותן $n^2=3\cdot3k^2$. הכיוון הראשון, דרך הקונטרפוזיטיב: אם $n$ מהצורה $3k+1$ או $3k+2$,
      אז $n^2$ מהצורה $3m+1$, ולכן אינו מהצורה $3j$.
    solution:
      - kind: goal
        text: 'הכיוון הראשון: אם $3\mid n^2$ אז $3\mid n$. הכיוון השני: אם $3\mid n$ אז $3\mid n^2$.'
      - kind: idea
        text: >-
          את הכיוון השני מוכיחים ישירות. בכיוון הראשון ההנחה היא על $n^2$ והמסקנה על $n$, ולכן מוכיחים את
          הקונטרפוזיטיב שלו: אם $3$ אינו מחלק את $n$, אז $3$ אינו מחלק את $n^2$.
      - kind: step
        text: 'הכיוון השני: נניח $n=3k$. אז $n^2=9k^2=3\cdot(3k^2)$, ולכן $3\mid n^2$.'
      - kind: computation
        text: >-
          הכיוון הראשון: נניח ש-$3$ אינו מחלק את $n$, כלומר $n$ אינו מהצורה $3k$, ולכן $n=3k+1$ או $n=3k+2$. אם
          $n=3k+1$: $n^2=9k^2+6k+1=3(3k^2+2k)+1$. אם $n=3k+2$: $n^2=9k^2+12k+4=3(3k^2+4k+1)+1$.
      - kind: step
        text: >-
          בשני המקרים $n^2$ מהצורה $3m+1$. כל שלם הוא מאחת שלוש הצורות בלבד, ולכן $n^2$ אינו מהצורה $3j$, כלומר $3$
          אינו מחלק את $n^2$. הוכחנו את הקונטרפוזיטיב, ששקול לכיוון הראשון.
      - kind: check
        text: '$n=6$: $36=3\cdot12$. $n=5$: $25=3\cdot8+1$. $n=7$: $49=3\cdot16+1$.'
      - kind: result
        text: 'לכל $n$ שלם, $3\mid n^2$ אם ורק אם $3\mid n$.'

  - id: W-0.4-08
    level: exam
    qualitative: true
    objectives: [OBJ-0.4-1, OBJ-0.4-2, OBJ-0.4-3]
    prompt: >-
      (א) הוכיחו: לכל $n$ טבעי, אם $2^n-1$ ראשוני אז $n$ ראשוני. היעזרו בזהות
      $x^b-1=(x-1)(x^{b-1}+x^{b-2}+\dots+x+1)$, שנכונה לכל $x$ ממשי ו-$b$ טבעי.

      (ב) נכון או לא נכון: לכל $n$ טבעי, $n$ ראשוני אם ורק אם $2^n-1$ ראשוני. נמקו.
    answer: >-
      (א) בקונטרפוזיטיב: $n=1$ נותן $1$, ואם $n=ab$ עם $1<a<n$ אז $2^a-1$ מחלק את $2^n-1$ ונמצא בין 1 ל-$2^n-1$.
      (ב) לא נכון: $n=11$ ראשוני, ו-$2^{11}-1=2047=23\cdot89$.
    solution:
      - kind: idea
        text: >-
          (א) ההנחה "$2^n-1$ ראשוני" קשה לעבודה, וקל להתחיל מ-"$n$ אינו ראשוני", שנותן פירוק $n=ab$. לכן
          קונטרפוזיטיב: אם $n$ אינו ראשוני אז $2^n-1$ אינו ראשוני. הזהות עם $x=2^a$ מפרקת את $2^{ab}-1$.
      - kind: step
        text: >-
          נניח ש-$n$ אינו ראשוני. אם $n=1$: $2^1-1=1$, ו-1 אינו ראשוני. אחרת $n\ge2$ פריק (אינו ראשוני), ולכן $n=ab$ עם $a,b$
          טבעיים ו-$1<a<n$, ומכאן גם $b=\frac na>1$.
      - kind: computation
        text: >-
          נציב $x=2^a$ בזהות: $2^n-1=(2^a)^b-1=(2^a-1)\big(2^{a(b-1)}+\dots+2^a+1\big)$, ושני הגורמים שלמים. לכן
          $2^a-1$ מחלק את $2^n-1$.
      - kind: step
        text: >-
          $a\ge2$ נותן $2^a-1\ge3>1$, ו-$a<n$ נותן $2^a-1<2^n-1$. כלומר ל-$2^n-1$ יש מחלק שאינו 1 ואינו הוא עצמו,
          ולכן הוא אינו ראשוני. זה הקונטרפוזיטיב, ולכן (א) הוכחה.
      - kind: check
        text: '$n=6$, $a=2$: $2^6-1=63$ ו-$2^2-1=3$ מחלק אותו ($63=3\cdot21$). $n=9$, $a=3$: $511=7\cdot73$.'
      - kind: step
        text: >-
          (ב) "אם ורק אם" נכונה רק כששני הכיוונים נכונים. הכיוון "אם $2^n-1$ ראשוני אז $n$ ראשוני" הוא (א). הכיוון
          השני, "אם $n$ ראשוני אז $2^n-1$ ראשוני", נכשל: $n=11$ ראשוני, אבל $2^{11}-1=2047=23\cdot89$. דוגמה נגדית
          אחת לכיוון אחד מפריכה את ה"אם ורק אם".
      - kind: check
        text: >-
          עבור הראשוניים $2,3,5,7$ מקבלים $3,7,31,127$, כולם ראשוניים: ארבע דוגמאות תומכות לכיוון השקרי (איור 0.4א).
      - kind: result
        text: '(א) אם $2^n-1$ ראשוני אז $n$ ראשוני. (ב) לא נכון: $n=11$.'

  - id: W-0.4-09
    level: exam
    objectives: [OBJ-0.4-1]
    prompt: >-
      הוכיחו בדרך השלילה שאין שלמים $m$ ו-$n$ כך ש-$m^2-n^2=2$.
    answer: >-
      $m^2-n^2=(m-n)(m+n)$, ולשני הגורמים אותה זוגיות. אם שניהם אי-זוגיים המכפלה אי-זוגית; אם שניהם זוגיים היא
      מתחלקת ב-4. אף אחד מהם אינו 2.
    solution:
      - kind: idea
        text: >-
          לפרק $m^2-n^2=(m-n)(m+n)$. סכום שני הגורמים, $2m$, זוגי, ולכן הם זוגיים יחד או אי-זוגיים יחד, ובשני
          המקרים המכפלה לא יכולה להיות 2.
      - kind: step
        text: 'נניח בשלילה שקיימים שלמים $m,n$ עם $m^2-n^2=2$, כלומר $(m-n)(m+n)=2$.'
      - kind: step
        text: >-
          נסמן $u=m-n$ ו-$v=m+n$. אז $u+v=2m$ זוגי. אם $u$ זוגי ו-$v$ אי-זוגי (או להפך), הסכום שלהם היה אי-זוגי
          (זוגי ועוד אי-זוגי: $2k+(2l+1)=2(k+l)+1$). לכן $u,v$ שניהם זוגיים או שניהם אי-זוגיים.
      - kind: computation
        text: >-
          אם שניהם אי-זוגיים: $uv=(2k+1)(2l+1)=2(2kl+k+l)+1$ אי-זוגי, ואילו $2$ זוגי. סתירה.
      - kind: computation
        text: >-
          אם שניהם זוגיים: $uv=(2k)(2l)=4kl$. אז $4kl=2$, כלומר $2kl=1$: מספר זוגי שווה ל-1, אי-זוגי. סתירה.
      - kind: check
        text: >-
          בדיקה (עדות, לא הוכחה): אף זוג $m,n$ בין $-200$ ל-$200$ לא נותן $m^2-n^2=2$. וההוכחה מסבירה גם למה $3$
          כן מתקבל: $2^2-1^2=3$, ושם הגורמים $1$ ו-$3$ אי-זוגיים.
      - kind: result
        text: 'בכל המקרים הגענו לסתירה, ולכן אין שלמים $m,n$ עם $m^2-n^2=2$.'

  - id: W-0.4-10
    level: exam
    qualitative: true
    objectives: [OBJ-0.4-1, OBJ-0.4-2]
    prompt: >-
      לכל טענה קבעו אם היא נכונה. אם כן הוכיחו, ואם לא הציגו דוגמה נגדית.

      (א) לכל $n$ טבעי, $6\mid n^3-n$. מותר להשתמש בכך שכל שלם הוא מהצורה $3k$, $3k+1$ או $3k+2$.

      (ב) לכל $n$ טבעי, $6\mid n^2-n$.
    answer: >-
      (א) נכון: $n^3-n=(n-1)n(n+1)$, מכפלה של שלושה עוקבים, שבה גורם זוגי וגורם שמתחלק ב-3. (ב) לא נכון: $n=2$
      נותן $2$.
    solution:
      - kind: idea
        text: >-
          (א) לפרק: $n^3-n=n(n^2-1)=(n-1)n(n+1)$. מכפלה מתחלקת ב-6 אם היא מתחלקת ב-2 וגם ב-3; בין שלושה עוקבים יש
          זוגי, ויש אחד שמתחלק ב-3.
      - kind: step
        text: >-
          (א) גורם זוגי: לפי ההוכחה מהשיעור, $n(n+1)=n^2+n$ זוגי, כלומר $n(n+1)=2j$. לכן $n^3-n=2j(n-1)$.
      - kind: step
        text: >-
          גורם שמתחלק ב-3: אם $n=3k$, הגורם $n$. אם $n=3k+1$, הגורם $n-1=3k$. אם $n=3k+2$, הגורם $n+1=3(k+1)$. בכל
          מקרה אחד משלושת הגורמים הוא $3i$, ולכן $n^3-n=3\cdot i\cdot c$, עם $c$ מכפלת שני הגורמים האחרים.
      - kind: step
        text: >-
          מתחלק ב-2 וב-3, ולכן ב-6: נכתוב $n^3-n=3t$ עם $t$ שלם. $3t$ זוגי, ולכן $t$ זוגי (אילו $t=2s+1$, היה
          $3t=2(3s+1)+1$ אי-זוגי). אז $t=2s$ ו-$n^3-n=6s$.
      - kind: check
        text: '$n=2$: $8-2=6$. $n=3$: $24$. $n=5$: $120=6\cdot20$. ובדיקה עד $n=200$ לא מצאה דוגמה נגדית (עדות בלבד).'
      - kind: computation
        text: >-
          (ב) $n=1$ נותן $0=6\cdot0$, מתחלק. $n=2$ נותן $4-2=2$, ו-6 אינו מחלק את 2. זו דוגמה נגדית.
      - kind: check
        text: >-
          שימו לב ש-$n=3$ ו-$n=4$ דווקא מקיימים את (ב) ($6$ ו-$12$): דוגמאות תומכות לא מצילות טענה שנכשלה פעם אחת.
          ההבדל מ-(א): $n^2-n=(n-1)n$ הוא מכפלה של שני עוקבים בלבד, ואין מה שיבטיח גורם שמתחלק ב-3.
      - kind: result
        text: '(א) נכון. (ב) לא נכון: $n=2$.'

challenge:
  - id: W-0.4-c1
    stars: 1
    objectives: [OBJ-0.4-1]
    prompt: >-
      יהיו $a,b,c$ שלמים כך ש-$a^2+b^2=c^2$ (למשל $3,4,5$ או $5,12,13$). הוכיחו בדרך השלילה שלפחות אחד מבין $a$
      ו-$b$ זוגי.
    answer: >-
      אם שניהם אי-זוגיים, $a^2+b^2=4j+2$. אז $c^2$ זוגי, ולכן $c=2m$ ו-$c^2=4m^2$, ומ-$4m^2=4j+2$ נובע $2(m^2-j)=1$:
      סתירה.
    solution:
      - kind: idea
        text: >-
          ריבוע של אי-זוגי הוא מהצורה $4j+1$, ולכן סכום של שני ריבועים כאלה הוא מהצורה $4j+2$: זוגי, אבל לא כפולה
          של 4. ריבוע זוגי, לעומת זאת, הוא תמיד כפולה של 4 (דוגמה 3 בשיעור).
      - kind: step
        text: 'נניח בשלילה ש-$a$ ו-$b$ שניהם אי-זוגיים: $a=2k+1$ ו-$b=2l+1$.'
      - kind: computation
        text: >-
          $a^2+b^2=(4k^2+4k+1)+(4l^2+4l+1)=4(k^2+k+l^2+l)+2$. נסמן $j=k^2+k+l^2+l$; אז $c^2=4j+2=2(2j+1)$.
      - kind: step
        text: >-
          לכן $c^2$ זוגי, ולפי מה שהוכחנו בשיעור (אם $n^2$ זוגי אז $n$ זוגי), $c=2m$ עבור $m$ שלם, ו-$c^2=4m^2$.
      - kind: computation
        text: '$4m^2=4j+2$ נותן $4(m^2-j)=2$, כלומר $2(m^2-j)=1$: מספר זוגי שווה ל-1, שהוא אי-זוגי.'
      - kind: check
        text: >-
          בשלשות $3,4,5$ ו-$5,12,13$ באמת אחד מ-$a,b$ זוגי. וחיפוש בכל הזוגות האי-זוגיים $a,b<300$ לא מצא $a^2+b^2$
          שהוא ריבוע (עדות שמתאימה להוכחה).
      - kind: result
        text: 'ההנחה ששניהם אי-זוגיים מובילה לסתירה, ולכן לפחות אחד מ-$a,b$ זוגי.'
    source:
      name: 'Richard Hammack, Book of Proof, Third Edition (edition 3.4)'
      year: 2018
      problem: 'Chapter 6, Exercise 8'
      url: 'https://richardhammack.github.io/BookOfProof/Main.pdf'
      verified: '2026-11-09'
      adapted: true

  - id: W-0.4-c2
    stars: 1
    objectives: [OBJ-0.4-1]
    prompt: >-
      הוכיחו שכל פתרון ממשי של המשוואה $x^3+x+3=0$ הוא מספר אי-רציונלי. (למשוואה יש פתרון ממשי, בערך
      $-1.2134$; אין צורך להוכיח זאת.)
    answer: >-
      אם $x=\frac pq$ עם $p,q$ לא שניהם זוגיים, אז $p^3+pq^2+3q^3=0$. בכל אחד משלושת המקרים של זוגיות $p,q$ אגף
      שמאל אי-זוגי, ו-0 זוגי.
    solution:
      - kind: idea
        text: >-
          להניח פתרון רציונלי $\frac pq$ ולכפול במכנים. מתקבל שוויון $p^3+pq^2+3q^3=0$, ואגף ימין, 0, הוא מספר זוגי.
          נראה שאגף שמאל אי-זוגי בכל מקרה. כדי שיהיו רק שלושה מקרים, מצמצמים קודם את השבר עד ש-$p,q$ לא שניהם
          זוגיים.
      - kind: step
        text: >-
          נניח בשלילה ש-$x$ רציונלי ומקיים $x^3+x+3=0$: $x=\frac pq$ עם $p,q$ שלמים, $q\ne0$. אם $p$ ו-$q$ שניהם
          זוגיים, נחלק את שניהם ב-2; הערך $|q|$ קטן בכל צעד ואינו מגיע ל-0, ולכן אחרי מספר סופי של צעדים $p,q$ כבר
          לא שניהם זוגיים.
      - kind: computation
        text: 'נציב ונכפול ב-$q^3$: $\frac{p^3}{q^3}+\frac pq+3=0$ נותן $p^3+pq^2+3q^3=0$.'
      - kind: step
        text: >-
          נשתמש בכך שמכפלה של אי-זוגיים היא אי-זוגית, ומכפלה עם גורם זוגי היא זוגית. אם $p,q$ אי-זוגיים: $p^3$,
          $pq^2$ ו-$3q^3$ כולם אי-זוגיים, וסכום של שלושה אי-זוגיים הוא אי-זוגי.
      - kind: step
        text: >-
          אם $p$ זוגי ו-$q$ אי-זוגי: $p^3$ ו-$pq^2$ זוגיים, $3q^3$ אי-זוגי, והסכום אי-זוגי. אם $p$ אי-זוגי ו-$q$
          זוגי: $p^3$ אי-זוגי, $pq^2$ ו-$3q^3$ זוגיים, והסכום אי-זוגי.
      - kind: step
        text: 'בכל מקרה אגף שמאל אי-זוגי, ואגף ימין, $0=2\cdot0$, זוגי: סתירה.'
      - kind: check
        text: >-
          כמה ערכים של $p^3+pq^2+3q^3$: $(p,q)=(1,1)$ נותן $5$, $(2,1)$ נותן $13$, $(1,2)$ נותן $29$, $(-3,2)$ נותן
          $-15$: כולם אי-זוגיים, כמו שההוכחה אומרת. ובדיקה מספרית מוצאת את הפתרון $x\approx-1.2134$.
      - kind: result
        text: 'אין פתרון רציונלי, ולכן כל פתרון ממשי של $x^3+x+3=0$ אי-רציונלי.'
    source:
      name: 'Richard Hammack, Book of Proof, Third Edition (edition 3.4)'
      year: 2018
      problem: 'Chapter 7, Exercise 21'
      url: 'https://richardhammack.github.io/BookOfProof/Main.pdf'
      verified: '2026-11-09'
      adapted: true
