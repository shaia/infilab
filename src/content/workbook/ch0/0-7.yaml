# Workbook of lesson 0.7 — inequalities and absolute value.
# Objectives (src/course.ts):
#   OBJ-0.7-1  solve inequalities with absolute values and describe the solution as an interval or a union of intervals
#   OBJ-0.7-2  prove and use the triangle inequality and its reverse form
#   OBJ-0.7-3  use the AM-GM inequality and simple estimates to bound an expression from above and from below
# Every solution set below was recomputed with src/math/absval.ts (solveAbs, solveSumDist) and checked against a direct
# evaluation on a grid; every bound was checked on n ≤ 200000 or on a grid of x; W-07 on random positive tuples.
# Solutions cite the numbered results of the lesson (0.7.1–0.7.19) by number.
lesson: '0.7'
practice:
  - id: W-0.7-01
    level: basic
    objectives: [OBJ-0.7-1]
    prompt: >-
      פתרו את אי-השוויון $|4x-1|\le 7$, וכתבו את הפתרון כקטע. מהם המרכז והרדיוס של הקטע?
    answer: '$\left[-\frac32,\ 2\right]$, עם מרכז $\frac14$ ורדיוס $\frac74$.'
    solution:
      - kind: idea
        text: >-
          לפי טענה 0.7.5(ב), $|t|\le r$ שקול ל-$-r\le t\le r$. פותחים את הערך המוחלט לשרשרת אחת ומבודדים את $x$ בכל
          שלושת האגפים יחד; כל מעבר הוא שקילות.
      - kind: computation
        text: >-
          $$|4x-1|\le 7 \iff -7\le 4x-1\le 7 \iff -6\le 4x\le 8 \iff -\frac32\le x\le 2$$

          הוספנו 1 לכל האגפים, ואחר כך כפלנו ב-$\frac14$. המספר $\frac14$ חיובי, ולכן כיווני אי-השוויונות נשמרים
          (עובדה מקובלת (ב)).
      - kind: computation
        text: >-
          לפי מסקנה 0.7.6(ד), המרכז הוא האמצע: $\frac{-\frac32+2}{2}=\frac14$, והרדיוס הוא חצי האורך:
          $\frac{2-\left(-\frac32\right)}{2}=\frac74$.
      - kind: check
        text: >-
          לפי למה 0.7.2(ו), $|4x-1|=\left|4\left(x-\frac14\right)\right|=4\left|x-\frac14\right|$, ולכן אי-השוויון הוא
          $\left|x-\frac14\right|\le\frac74$: לפי מסקנה 0.7.6(ב) זה בדיוק הקטע שמרכזו $\frac14$ ורדיוסו $\frac74$.
          נקודות קצה: $x=2$ נותן $|7|=7\le 7$, ו-$x=-\frac32$ נותן $|-7|=7$. שתיהן שייכות, ולכן הסוגריים מרובעים.
      - kind: result
        text: '$\left[-\frac32,\ 2\right]$, המרכז $\frac14$ והרדיוס $\frac74$.'

  - id: W-0.7-02
    level: basic
    qualitative: true
    objectives: [OBJ-0.7-1]
    prompt: >-
      תארו במילים, בעזרת מרחק, ואחר כך כקטע, כאיחוד של קטעים או כקבוצה אחרת, את קבוצת הפתרונות של:

      (א) $|x-5|>0$.

      (ב) $|x+3|\le 0$.

      (ג) $|x-1|<-2$.
    answer: >-
      (א) $(-\infty,5)\cup(5,\infty)$, כל המספרים חוץ מ-5. (ב) $\{-3\}$. (ג) הקבוצה הריקה.
    solution:
      - kind: idea
        text: >-
          טענה 0.7.5 נכונה לכל $r$ ממשי, גם כש-$r\le 0$, ולכן אפשר להפעיל אותה כאן כרגיל. במילים, הכול נובע מלמה
          0.7.2(א): מרחק אינו שלילי, ושווה לאפס רק כשהנקודות שוות.
      - kind: step
        text: >-
          (א) לפי טענה 0.7.5(ג) עם $r=0$: $|x-5|>0$ אם ורק אם $x-5>0$ או $x-5<0$, כלומר $x\ne 5$. הקבוצה היא כל הישר
          בלי הנקודה 5: $(-\infty,5)\cup(5,\infty)$. במילים: המרחק של $x$ מ-5 חיובי בדיוק כש-$x\ne 5$.
      - kind: step
        text: >-
          (ב) לפי טענה 0.7.5(ב) עם $r=0$: $|x+3|\le 0$ אם ורק אם $0\le x+3\le 0$, כלומר $x+3=0$, כלומר $x=-3$. הקבוצה
          היא $\{-3\}=[-3,-3]$: "קטע" ברדיוס 0.
      - kind: step
        text: >-
          (ג) לפי טענה 0.7.5(א) עם $r=-2$: $|x-1|<-2$ אם ורק אם $2<x-1<-2$, ואז $2<-2$, שקר. אין פתרון: הקבוצה
          ריקה. במילים: מרחק אינו שלילי, ולכן אף פעם אינו קטן מ-$-2$.
      - kind: check
        text: >-
          ב-(ב) ההנחה $r>0$ של מסקנה 0.7.6 אינה מתקיימת, ולכן משתמשים ישירות בטענה 0.7.5, שאין בה הנחה על $r$.
          בדיקת נקודות: $x=5$ נותן $0>0$, שקר; $x=-3$ נותן $0\le 0$, אמת; $x=1$ נותן $0<-2$, שקר.
      - kind: result
        text: >-
          (א) $\mathbb{R}$ בלי 5, כלומר $(-\infty,5)\cup(5,\infty)$. (ב) $\{-3\}$. (ג) $\emptyset$.

  - id: W-0.7-03
    level: basic
    objectives: [OBJ-0.7-2]
    prompt: >-
      ידוע ש-$|x-3|<0.5$ ו-$|y-1|<0.2$.

      (א) חסמו מלמעלה את $|x-y-2|$.

      (ב) חסמו את $|x|$ מלמטה וגם מלמעלה.
    answer: '(א) $|x-y-2|<0.7$. (ב) $2.5<|x|<3.5$.'
    solution:
      - kind: idea
        text: >-
          כותבים את הביטוי בעזרת הכמויות שיודעים לחסום, $x-3$ ו-$y-1$ (הוספה והחסרה), ומפעילים את משפט 0.7.7 לחסם
          מלמעלה ואת טענה 0.7.11 לשני הכיוונים.
      - kind: computation
        text: >-
          (א) $x-y-2=(x-3)-(y-1)$. לפי משפט 0.7.7 עם $x-3$ ו-$-(y-1)$, ולפי למה 0.7.2(ה):

          $$|x-y-2|\le|x-3|+|y-1|<0.5+0.2=0.7$$
      - kind: computation
        text: >-
          (ב) לפי טענה 0.7.11 עם $a=3$ ו-$r=0.5$: $|3|-0.5<|x|<|3|+0.5$, כלומר $2.5<|x|<3.5$.
      - kind: check
        text: >-
          ישירות: לפי מסקנה 0.7.6(א), $|x-3|<0.5$ פירושו $2.5<x<3.5$, ולכן $x$ חיובי ו-$|x|=x$ באותו קטע. ב-(א) שימו
          לב שהחסמים **מתחברים** גם כשבביטוי יש חיסור: $x=3.45$, $y=0.85$ מקיימים את ההנחות ($0.45<0.5$,
          $0.15<0.2$), ונותנים $|3.45-0.85-2|=0.6$, יותר מכל אחד משני החסמים $0.5$ ו-$0.2$.
      - kind: result
        text: '(א) $|x-y-2|<0.7$. (ב) $2.5<|x|<3.5$.'

  - id: W-0.7-04
    level: mid
    objectives: [OBJ-0.7-1]
    prompt: >-
      פתרו את אי-השוויון $|x-1|+|x-4|\ge 5$.
    answer: '$(-\infty,0]\cup[5,\infty)$.'
    solution:
      - kind: idea
        text: >-
          שני ערכים מוחלטים מחליפים סימן ב-$x=1$ וב-$x=4$. מפצלים את הישר לשלושה חלקים, ובכל אחד כותבים את הסכום בלי
          ערך מוחלט (הגדרה 0.7.1). כל $x$ נמצא בדיוק בחלק אחד, ולכן הפתרון הוא האיחוד.
      - kind: step
        text: >-
          $x\ge 4$: הסכום הוא $(x-1)+(x-4)=2x-5$. התנאי $2x-5\ge 5$ נותן $x\ge 5$. בחלק הזה: $[5,\infty)$.
      - kind: step
        text: >-
          $1\le x<4$: הסכום הוא $(x-1)+(4-x)=3$, ו-$3\ge 5$ אף פעם. אין פתרונות בחלק הזה.
      - kind: step
        text: >-
          $x<1$: הסכום הוא $(1-x)+(4-x)=5-2x$. התנאי $5-2x\ge 5$ נותן $x\le 0$. בחלק הזה: $(-\infty,0]$.
      - kind: check
        text: >-
          לפי מסקנה 0.7.8(ב), הסכום הוא לפחות $|1-4|=3$, ושווה ל-3 בדיוק בין הנקודות, כמו שיצא בחלק האמצעי. מחוץ להן
          הוא גדל ב-2 על כל יחידה שמתרחקים, ולכן כדי להגיע ל-5 צריך להתרחק יחידה אחת מעבר לכל קצה: עד 0 או מ-5. בדיקת
          נקודה: $x=0$ נותן $1+4=5$ (שייך), $x=0.5$ נותן $0.5+3.5=4$ (לא שייך).
      - kind: result
        text: '$(-\infty,0]\cup[5,\infty)$.'

  - id: W-0.7-05
    level: mid
    qualitative: true
    objectives: [OBJ-0.7-1]
    prompt: >-
      (א) פתרו את $|x-1|<|x-3|$, ותארו את התשובה במילים בעזרת מרחקים.

      (ב) הוכיחו או הפריכו: לכל $x,y$ ממשיים, אם $|x|<|y|$ אז $x<y$.
    answer: '(א) $(-\infty,2)$: המספרים שקרובים ל-1 יותר מאשר ל-3. (ב) הטענה שקרית: $x=1$, $y=-2$.'
    solution:
      - kind: idea
        text: >-
          לפי למה 0.7.3 ("בפרט"), $|u|<|v|\iff u^2<v^2$: הערכים המוחלטים מבטיחים שהאגפים אי-שליליים, ולכן מותר
          להעלות בריבוע. בלי ערכים מוחלטים, כמו ב-(ב), השוואה של גדלים לא אומרת כלום על הסדר.
      - kind: computation
        text: >-
          (א) $$|x-1|<|x-3| \iff (x-1)^2<(x-3)^2 \iff x^2-2x+1<x^2-6x+9 \iff 4x<8 \iff x<2$$
      - kind: step
        text: >-
          במילים: $x$ קרוב יותר ל-1 מאשר ל-3 בדיוק כשהוא משמאל לאמצע ביניהם, 2. הנקודה 2 עצמה במרחק 1 משתיהן, ולכן לא
          שייכת.
      - kind: step
        text: >-
          (ב) נפריך. דוגמה נגדית: $x=1$, $y=-2$. אז $|x|=1<2=|y|$, אבל $x=1>-2=y$. הערך המוחלט מודד גודל, לא מקום על
          הישר.
      - kind: check
        text: >-
          ב-(א), $x=0$: $|{-1}|=1<3=|{-3}|$ (שייך); $x=2.5$: $1.5<0.5$ שקר (לא שייך). ב-(ב), מה שכן נכון הוא
          $x\le|x|<|y|$ (למה 0.7.2(ג)), כלומר $x<|y|$.
      - kind: result
        text: '(א) $(-\infty,2)$. (ב) הטענה שקרית; $x=1$, $y=-2$.'

  - id: W-0.7-06
    level: mid
    objectives: [OBJ-0.7-2]
    prompt: >-
      הוכיחו שלכל $a,b$ ממשיים $|a|+|b|\le|a+b|+|a-b|$.
    answer: '$2|a|\le|a+b|+|a-b|$ ו-$2|b|\le|a+b|+|a-b|$; מחברים ומחלקים ב-2.'
    solution:
      - kind: goal
        text: '$|a|+|b|\le|a+b|+|a-b|$ לכל $a,b$.'
      - kind: idea
        text: >-
          את $2a$ ואת $2b$ אפשר לכתוב בעזרת $a+b$ ו-$a-b$: $2a=(a+b)+(a-b)$ ו-$2b=(a+b)-(a-b)$. משפט 0.7.7 על כל אחד
          מהם נותן חסם, ומחברים.
      - kind: theorem
        text: >-
          לפי למה 0.7.2(ו) ומשפט 0.7.7: $2|a|=|2a|=|(a+b)+(a-b)|\le|a+b|+|a-b|$.
      - kind: theorem
        text: >-
          לפי משפט 0.7.7 עם $a+b$ ו-$-(a-b)$, ולפי למה 0.7.2(ה): $2|b|=|(a+b)-(a-b)|\le|a+b|+|a-b|$.
      - kind: step
        text: >-
          מחברים את שני אי-השוויונות: $2|a|+2|b|\le 2\big(|a+b|+|a-b|\big)$, וכופלים ב-$\frac12$, שהוא חיובי.
      - kind: check
        text: >-
          $a=3$, $b=-1$: אגף שמאל $4$, אגף ימין $|2|+|4|=6$. ו-$a=b=1$: אגף שמאל $2$, אגף ימין $2+0=2$, שוויון.
      - kind: result
        text: '$|a|+|b|\le|a+b|+|a-b|$ לכל $a,b$ ממשיים.'

  - id: W-0.7-07
    level: exam
    objectives: [OBJ-0.7-3]
    prompt: >-
      (א) הוכיחו שלכל $n\in\mathbb{N}$ ולכל $a_1,\dots,a_n>0$ מתקיים
      $\left(\sum_{k=1}^n a_k\right)\left(\sum_{k=1}^n\frac{1}{a_k}\right)\ge n^2$, ושוויון מתקיים אם ורק אם כל
      ה-$a_k$ שווים.

      (ב) הסיקו שלכל $a,b,c>0$ מתקיים $(a+b+c)\left(\frac1a+\frac1b+\frac1c\right)\ge 9$, וחשבו את אגף שמאל עבור
      $a=1$, $b=2$, $c=4$.
    answer: '(א) קושי-שוורץ עם $\sqrt{a_k}$ ו-$\frac{1}{\sqrt{a_k}}$. (ב) $n=3$; עבור $1,2,4$ אגף שמאל $\frac{49}{4}=12.25$.'
    solution:
      - kind: idea
        text: >-
          המכפלה $\sqrt{a_k}\cdot\frac{1}{\sqrt{a_k}}=1$ לא תלויה ב-$k$. במשפט 0.7.16 עם $x_k=\sqrt{a_k}$ ו-$y_k=\frac{1}{\sqrt{a_k}}$
          אגף שמאל הוא $n^2$, ואגף ימין הוא בדיוק המכפלה שלנו.
      - kind: step
        text: >-
          לכל $k$, $a_k>0$, ולכן $\sqrt{a_k}$ מוגדר (עובדה מקובלת (ה)) ושונה מאפס (אחרת $a_k=(\sqrt{a_k})^2=0$), כלומר
          $\sqrt{a_k}>0$. נגדיר $x_k=\sqrt{a_k}$ ו-$y_k=\frac{1}{\sqrt{a_k}}$. אז $x_ky_k=1$, $x_k^2=a_k$, ו-$y_k^2=\frac{1}{(\sqrt{a_k})^2}=\frac{1}{a_k}$.
      - kind: theorem
        text: >-
          לפי משפט 0.7.16:

          $$n^2=\Big(\sum_{k=1}^n x_ky_k\Big)^2\le\Big(\sum_{k=1}^n x_k^2\Big)\Big(\sum_{k=1}^n y_k^2\Big)=\Big(\sum_{k=1}^n a_k\Big)\Big(\sum_{k=1}^n\frac1{a_k}\Big)$$
      - kind: step
        text: >-
          שוויון. לפי משפט 0.7.16, יש שוויון אם ורק אם כל $x_k=0$ (בלתי אפשרי, כי $x_k>0$), או שיש $\lambda$ עם
          $y_k=\lambda x_k$ לכל $k$, כלומר $\frac{1}{\sqrt{a_k}}=\lambda\sqrt{a_k}$, כלומר $1=\lambda a_k$. אז
          $\lambda\ne 0$ ו-$a_k=\frac1\lambda$ לכל $k$: כולם שווים. ולהפך, אם כל $a_k=c$, אגף שמאל הוא
          $nc\cdot\frac nc=n^2$.
      - kind: computation
        text: >-
          (ב) זה (א) עם $n=3$. עבור $a=1$, $b=2$, $c=4$: $7\cdot\left(1+\frac12+\frac14\right)=7\cdot\frac74=\frac{49}{4}=12.25\ge 9$.
      - kind: check
        text: >-
          $a=b=c=5$: $15\cdot\frac35=9$, שוויון, כמו ש-(א) מבטיח. ל-$n=2$ זו מסקנה 0.7.15 בתחפושת:
          $(a+b)\left(\frac1a+\frac1b\right)=2+\frac ab+\frac ba\ge 2+2=4$.
      - kind: result
        text: >-
          (א) $\left(\sum a_k\right)\left(\sum\frac1{a_k}\right)\ge n^2$, ושוויון בדיוק כשכל ה-$a_k$ שווים. (ב)
          $(a+b+c)\left(\frac1a+\frac1b+\frac1c\right)\ge 9$; עבור $1,2,4$ הערך $12.25$.

  - id: W-0.7-08
    level: exam
    qualitative: true
    objectives: [OBJ-0.7-2, OBJ-0.7-3]
    prompt: >-
      נניח $|x-1|<1$. הוכיחו או הפריכו כל טענה:

      (א) $|x^3-1|\le 7|x-1|$.

      (ב) $|x^3-1|\le 3|x-1|$.
    answer: '(א) נכון. (ב) לא נכון: $x=1.9$ נותן $|x^3-1|=5.859>2.7=3|x-1|$.'
    solution:
      - kind: idea
        text: >-
          מפרקים $x^3-1=(x-1)(x^2+x+1)$, ואז צריך לחסום את $|x^2+x+1|$ מלמעלה. לשם כך חוסמים קודם את $|x|$ בעזרת
          ההנחה וטענה 0.7.11.
      - kind: computation
        text: '$|x^3-1|=|x-1|\cdot|x^2+x+1|$, לפי למה 0.7.2(ו).'
      - kind: theorem
        text: >-
          לפי טענה 0.7.11 עם $a=1$ ו-$r=1$: $|x|<|1|+1=2$. לפי טענה 0.7.10 לשלושה מחוברים ולפי למה 0.7.2(ו):
          $|x^2+x+1|\le|x|^2+|x|+1<4+2+1=7$.
      - kind: step
        text: >-
          (א) $|x-1|\ge 0$, ולכן מותר לכפול בו את $|x^2+x+1|<7$: $|x^3-1|=|x-1|\cdot|x^2+x+1|\le 7|x-1|$ (עם $\le$,
          כי כש-$x=1$ שני האגפים אפס). הטענה נכונה.
      - kind: step
        text: >-
          (ב) נפריך. דוגמה נגדית: $x=1.9$, ואכן $|x-1|=0.9<1$. אז $x^3-1=6.859-1=5.859$, ואילו $3|x-1|=2.7$.
      - kind: check
        text: >-
          למה 3 לא מספיק? $|x^3-1|=|x-1|\cdot(x^2+x+1)$, ו-$x^2+x+1-3=(x-1)(x+2)$. לכן בקטע $(0,2)$ הגורם
          $x^2+x+1$ לכל היותר 3 בדיוק כש-$x\le 1$, וגדול מ-3 לכל $1<x<2$; ליד $x=2$ הוא כמעט 7. החסם 3 נכון בחלק
          $(0,1]$ ונכשל בכל נקודה של $(1,2)$, גם קרוב מאוד ל-1.
      - kind: result
        text: '(א) נכון. (ב) לא נכון, למשל $x=1.9$.'

  - id: W-0.7-09
    level: mid
    objectives: [OBJ-0.7-3]
    prompt: >-
      (א) הוכיחו שלכל $n$ טבעי $\frac{1}{2n}\le\frac{3n^2-n}{n^3+2n+1}\le\frac3n$.

      (ב) מצאו בעזרת (א) מספר $N$ כך שלכל $n>N$ מתקיים $\frac{3n^2-n}{n^3+2n+1}<0.01$.
    answer: '(א) למה 0.7.18 וטענה 0.7.19. (ב) $N=300$.'
    solution:
      - kind: idea
        text: >-
          החזקה הגבוהה ביותר של $n$ במונה היא $n^2$ ובמכנה $n^3$; מחליפים כל מחובר בכפולה שלה, בעזרת טענה 0.7.19
          ($1\le n\le n^2\le n^3$ לכל $n\in\mathbb{N}$). חסם מלמעלה: מגדילים את המונה ומקטינים את המכנה; חסם מלמטה:
          להפך. ההנחות של למה 0.7.18 מתקיימות: המונה $3n^2-n=n(3n-1)$ אי-שלילי, וכל המכנים חיוביים.
      - kind: step
        text: >-
          מלמעלה: $3n^2-n\le 3n^2$ (הורדנו מחובר שלילי), ו-$n^3+2n+1\ge n^3>0$. לפי למה 0.7.18 עם $p=3n^2-n$, $P=3n^2$,
          $q=n^3+2n+1$ ו-$Q=n^3$: $\frac{3n^2-n}{n^3+2n+1}\le\frac{3n^2}{n^3}=\frac3n$.
      - kind: step
        text: >-
          מלמטה: לפי טענה 0.7.19, $n\le n^2$, ולכן $3n^2-n\ge 3n^2-n^2=2n^2$. וגם $2n\le 2n^3$ ו-$1\le n^3$, ולכן
          $n^3+2n+1\le n^3+2n^3+n^3=4n^3$. לפי למה 0.7.18 עם $p=2n^2$, $P=3n^2-n$, $q=4n^3$ ו-$Q=n^3+2n+1$:
          $\frac{2n^2}{4n^3}\le\frac{3n^2-n}{n^3+2n+1}$, ו-$\frac{2n^2}{4n^3}=\frac{1}{2n}$.
      - kind: computation
        text: >-
          (ב) מספיק ש-$\frac3n<0.01$, כלומר $n>300$. לכן $N=300$ מתאים: אם $n>300$, אז
          $\frac{3n^2-n}{n^3+2n+1}\le\frac3n<0.01$.
      - kind: check
        text: >-
          $n=1$: $\frac12\le\frac24=\frac12\le 3$, והחסם התחתון מתקבל. $n=2$: $\frac14\le\frac{10}{13}\le\frac32$. ב-(ב)
          החסם כמעט הדוק: עבור $n=299$ השבר הוא בערך $0.01002$, עדיין לא קטן מ-$0.01$, ועבור $n=300$ הוא בערך
          $0.00999$.
      - kind: result
        text: '(א) $\frac{1}{2n}\le\frac{3n^2-n}{n^3+2n+1}\le\frac3n$. (ב) $N=300$.'

  - id: W-0.7-10
    level: exam
    qualitative: true
    objectives: [OBJ-0.7-1, OBJ-0.7-2]
    prompt: >-
      לכל $c$ ממשי נסמן $A_c=\{x\in\mathbb{R}:\ |x+1|+|x-3|<c\}$.

      (א) הוכיחו בעזרת אי-שוויון המשולש שלכל $x$ מתקיים $|x+1|+|x-3|\ge 4$, ומצאו את כל ה-$x$ שבהם יש שוויון.

      (ב) לאילו $c$ הקבוצה $A_c$ ריקה?

      (ג) מצאו $c$ שעבורו $A_c$ הוא קטע באורך $10$, ומצאו את הקטע.
    answer: '(א) שוויון בדיוק ב-$[-1,3]$. (ב) $c\le 4$. (ג) $c=10$, והקטע $(-4,6)$.'
    solution:
      - kind: idea
        text: >-
          $|x+1|+|x-3|$ הוא סכום המרחקים של $x$ מ-$-1$ ומ-3. לפי מסקנה 0.7.8 הוא לא קטן מהמרחק בין שתי הנקודות, 4.
          מעבר לזה, פיצול למקרים נותן את $A_c$ במפורש.
      - kind: theorem
        text: >-
          (א) לפי משפט 0.7.7 ולמה 0.7.2(ה): $|x+1|+|x-3|=|x+1|+|3-x|\ge|(x+1)+(3-x)|=4$. לפי מקרה השוויון במשפט, יש
          שוויון בדיוק כש-$(x+1)(3-x)\ge 0$, כלומר (מסקנה 0.7.8(א), שלב 2) כש-$x+1$ ו-$3-x$ שניהם אי-שליליים או שניהם
          אי-חיוביים. השני בלתי אפשרי ($x\le-1$ וגם $x\ge 3$), והראשון הוא $-1\le x\le 3$.
      - kind: step
        text: >-
          (ב) לפי מסקנה 0.7.8(ג) עם $a=-1$, $b=3$: $A_c$ ריקה אם ורק אם $c\le|-1-3|=4$. ישירות: אם $c\le 4$, לכל $x$
          הסכום לפחות $4\ge c$; אם $c>4$, $x=0$ נותן סכום $4<c$.
      - kind: step
        text: >-
          (ג) נניח $c>4$ ונפצל. עבור $x\ge 3$ הסכום $2x-2$, והתנאי $2x-2<c$ נותן $x<\frac{c+2}{2}$. עבור $-1\le x<3$ הסכום
          $4<c$, תמיד. עבור $x<-1$ הסכום $2-2x$, והתנאי נותן $x>\frac{2-c}{2}$. ביחד
          $A_c=\left(\frac{2-c}{2},\ \frac{2+c}{2}\right)$, קטע באורך $c$.
      - kind: computation
        text: '(ג) האורך $c=10$, והקטע $\left(\frac{2-10}{2},\ \frac{2+10}{2}\right)=(-4,6)$.'
      - kind: check
        text: >-
          $x=-4$: $3+7=10$, לא קטן מ-10, ולכן הקצה לא שייך. $x=5.9$: $6.9+2.9=9.8<10$, שייך. ובמקרה הגבולי $c=4$: הקבוצה
          $\{x:\ |x+1|+|x-3|\le 4\}$ היא $[-1,3]$, אבל עם $<$ היא ריקה, כמו ב-(ב).
      - kind: result
        text: '(א) הסכום לפחות 4, ושוויון בדיוק ב-$[-1,3]$. (ב) $c\le 4$. (ג) $c=10$, והקטע $(-4,6)$.'

challenge:
  - id: W-0.7-c1
    stars: 1
    objectives: [OBJ-0.7-2]
    prompt: >-
      $\max\{x,y\}$ הוא הגדול מבין שני המספרים, ו-$\min\{x,y\}$ הוא הקטן מביניהם (כש-$x=y$ שניהם שווים ל-$x$).

      (א) הוכיחו שלכל $x,y$ ממשיים

      $$\max\{x,y\}=\frac{x+y+|x-y|}{2},\qquad \min\{x,y\}=\frac{x+y-|x-y|}{2}.$$

      (ב) הסיקו שלכל $a,b,c,d$ ממשיים $\big|\max\{a,b\}-\max\{c,d\}\big|\le|a-c|+|b-d|$.
    answer: >-
      (א) בשני מקרים, $x\ge y$ ו-$x<y$. (ב) מציבים את הנוסחה של (א), ומפעילים את טענה 0.7.10 ואת מסקנה 0.7.9.
    solution:
      - kind: idea
        text: >-
          (א) הממוצע $\frac{x+y}{2}$ נמצא באמצע בין $x$ ל-$y$, וחצי המרחק ביניהם, $\frac{|x-y|}{2}$, מביא ממנו אל הגדול
          (בהוספה) או אל הקטן (בהחסרה). (ב) הנוסחה הופכת הפרש של מקסימומים לסכום של הפרשים ושל הפרש של ערכים מוחלטים,
          ואת האחרון חוסמת הצורה ההפוכה.
      - kind: step
        text: >-
          (א) אם $x\ge y$, אז $|x-y|=x-y$, ו-$\frac{x+y+(x-y)}{2}=x=\max\{x,y\}$, ו-$\frac{x+y-(x-y)}{2}=y=\min\{x,y\}$.
          אם $x<y$, אז $|x-y|=y-x$, ו-$\frac{x+y+(y-x)}{2}=y=\max\{x,y\}$, ו-$\frac{x+y-(y-x)}{2}=x=\min\{x,y\}$.
      - kind: computation
        text: >-
          (ב) לפי (א):

          $$\max\{a,b\}-\max\{c,d\}=\frac{(a-c)+(b-d)+\big(|a-b|-|c-d|\big)}{2}$$
      - kind: theorem
        text: >-
          לפי טענה 0.7.10 לשלושה מחוברים, ואז לפי מסקנה 0.7.9:

          $$\big|\max\{a,b\}-\max\{c,d\}\big|\le\frac{|a-c|+|b-d|+\big||a-b|-|c-d|\big|}{2}\le\frac{|a-c|+|b-d|+|(a-b)-(c-d)|}{2}$$
      - kind: theorem
        text: >-
          $(a-b)-(c-d)=(a-c)-(b-d)$, ולכן לפי משפט 0.7.7 (עם $a-c$ ו-$-(b-d)$) $|(a-b)-(c-d)|\le|a-c|+|b-d|$. מציבים:
          $\big|\max\{a,b\}-\max\{c,d\}\big|\le\frac{2|a-c|+2|b-d|}{2}=|a-c|+|b-d|$.
      - kind: check
        text: >-
          $a=3$, $b=0$, $c=1$, $d=0$: אגף שמאל $|3-1|=2$, אגף ימין $2+0=2$: שוויון, ולכן החסם אינו ניתן לשיפור באופן
          כללי. ובמשמעות: אם מזיזים כל אחד משני מספרים במעט, המקסימום שלהם זז לכל היותר בסכום ההזזות.
      - kind: result
        text: >-
          (א) $\max\{x,y\}=\frac{x+y+|x-y|}{2}$ ו-$\min\{x,y\}=\frac{x+y-|x-y|}{2}$. (ב)
          $\big|\max\{a,b\}-\max\{c,d\}\big|\le|a-c|+|b-d|$.
    source:
      name: 'Jiří Lebl, Basic Analysis I: Introduction to Real Analysis, Volume I (version 6.3)'
      year: 2026
      problem: 'Section 1.3, Exercise 1.3.2'
      url: 'https://www.jirka.org/ra/realanal.pdf'
      verified: '2026-11-09'
      adapted: true

  - id: W-0.7-c2
    stars: 1
    objectives: [OBJ-0.7-2, OBJ-0.7-3]
    prompt: >-
      (א) מצאו מספר $M$ כך ש-$|x^3-x^2+8x|\le M$ לכל $-2\le x\le 10$. השתמשו באי-שוויון המשולש בלבד.

      (ב) הוכיחו, בלי נגזרות, שהמספר הקטן ביותר $M$ שמתאים הוא $980$.
    answer: >-
      (א) למשל $M=1180$. (ב) נסמן $f(x)=x^3-x^2+8x$. אז $f(10)=980$, ולכן $M$ קטן מ-980 לא מתאים. ו-980 מתאים: עבור
      $0\le x\le 10$ מתקיים $0\le f(x)\le f(10)=980$, ועבור $-2\le x<0$ מתקיים $|f(x)|\le 28$.
    solution:
      - kind: idea
        text: >-
          (א) טענה 0.7.10 מחליפה כל מחובר בערך המוחלט שלו, ואז מספיק לחסום את $|x|$, שהוא לכל היותר 10 בקטע. (ב) חסם
          שמתקבל בנקודה מסוימת הוא הקטן ביותר; כאן החשוד הוא $x=10$, ומראים שהביטוי אף פעם לא עובר את ערכו שם, בעזרת
          פירוק לגורמים.
      - kind: theorem
        text: >-
          (א) לפי טענה 0.7.10 לשלושה מחוברים ולמה 0.7.2(ו): $|x^3-x^2+8x|\le|x|^3+|x|^2+8|x|$. בקטע $[-2,10]$ מתקיים
          $|x|\le 10$, ולכן הסכום לכל היותר $1000+100+80=1180$.
      - kind: computation
        text: >-
          (ב) נסמן $f(x)=x^3-x^2+8x$. אז $f(10)=1000-100+80=980$, ולכן אף $M$ קטן מ-980 לא מתאים. נותר להראות
          ש-$|f(x)|\le 980$ בכל הקטע.
      - kind: step
        text: >-
          עבור $0\le x\le 10$: $f(x)=x\left(x^2-x+8\right)\ge 0$, כי $x^2-x+8=\left(x-\frac12\right)^2+\frac{31}{4}>0$. נותר
          להראות ש-$f(10)-f(x)\ge 0$. ההפרש מתאפס ב-$x=10$, ולכן כדאי לחפש בו את הגורם $10-x$. כל אחד משלושת החלקים
          מתפרק כך: $1000-x^3=(10-x)\left(100+10x+x^2\right)$, $100-x^2=(10-x)(10+x)$, ו-$80-8x=8(10-x)$. לכן

          $$f(10)-f(x)=(1000-x^3)-(100-x^2)+(80-8x)=(10-x)\left[\left(x^2+10x+100\right)-(10+x)+8\right]=(10-x)\left(x^2+9x+98\right)$$

          שני הגורמים אי-שליליים ($x\le 10$, ו-$x^2+9x+98>0$ כש-$x\ge 0$), ולכן $0\le f(x)\le 980$.
      - kind: step
        text: >-
          עבור $-2\le x<0$: $|f(x)|=|x|\cdot\left(x^2-x+8\right)$, ו-$|x|\le 2$, $x^2\le 4$, $-x\le 2$, ולכן
          $|f(x)|\le 2\cdot(4+2+8)=28\le 980$.
      - kind: check
        text: >-
          בדיקת הפירוק ב-$x=0$: $f(10)-f(0)=980$, ו-$(10-0)(0+0+98)=980$. ו-$f(-2)=-8-4-16=-28$, בדיוק החסם של המקרה
          השלילי. ההערכה הגסה של (א), 1180, נכונה לגמרי; היא רק לא הקטנה ביותר, כי אי-שוויון המשולש "מבזבז" כשהמחוברים
          בסימנים שונים ($-x^2$ שלילי).
      - kind: result
        text: '(א) $M=1180$ מתאים. (ב) הקטן ביותר הוא $980=f(10)$.'
    source:
      name: 'Jiří Lebl, Basic Analysis I: Introduction to Real Analysis, Volume I (version 6.3)'
      year: 2026
      problem: 'Section 1.3, Exercise 1.3.3'
      url: 'https://www.jirka.org/ra/realanal.pdf'
      verified: '2026-11-09'
      adapted: true
