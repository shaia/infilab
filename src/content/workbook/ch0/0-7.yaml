# Workbook of lesson 0.7 — sets.
# Objectives (src/course.ts):
#   OBJ-0.7-1  operate on sets; prove set equality by double inclusion
#   OBJ-0.7-2  prove the laws of the operations and De Morgan's laws, also for a family of sets
#   OBJ-0.7-3  work with the power set and the Cartesian product, and prove claims about them
# W-01, W-04 and W-05 come from the old lesson 0.6 (sets and functions, split on 2026-11-10); the rest are new.
# Every finite claim is checked in tests/math/sets.test.ts (W-03, W-08, W-09, c2 on every triple of subsets of a
# 4-element set); the interval endpoints of W-01 and W-10 by a scratch script on a grid of rationals.
lesson: '0.7'
practice:
  - id: W-0.7-01
    level: basic
    objectives: [OBJ-0.7-1]
    prompt: >-
      יהיו $A=(-2,4]$ ו-$B=[0,6)$, תת-קבוצות של $\mathbb{R}$, והמשלים נלקח ב-$\mathbb{R}$.

      (א) מצאו את $A\cap B$, $A\cup B$, $A\setminus B$ ו-$B\setminus A$.

      (ב) מצאו את $(A\cup B)^c$ ואת $A^c\cap B^c$, והשוו.
    answer: >-
      (א) $A\cap B=[0,4]$, $A\cup B=(-2,6)$, $A\setminus B=(-2,0)$, $B\setminus A=(4,6)$.

      (ב) שתיהן $(-\infty,-2]\cup[6,\infty)$, כמו שכלל דה-מורגן אומר.
    solution:
      - kind: idea
        text: >-
          מסמנים את שני הקטעים על ציר המספרים ובודקים כל קצה בנפרד: $-2\notin A$, $4\in A$, $0\in B$, $6\notin B$.
      - kind: computation
        text: >-
          (א) בחיתוך צריך $x\ge0$ (בגלל $B$) וגם $x\le4$ (בגלל $A$): $A\cap B=[0,4]$. באיחוד כל $x$ עם $-2<x<6$ נמצא
          באחד הקטעים, והקצוות $-2$ ו-$6$ אינם באף אחד: $A\cup B=(-2,6)$.
      - kind: computation
        text: >-
          $A\setminus B$: ב-$A$ ולא ב-$B$, כלומר $-2<x<0$; הנקודה $0$ ב-$B$, ולכן בחוץ: $A\setminus B=(-2,0)$.
          $B\setminus A$: ב-$B$ ולא ב-$A$, כלומר $4<x<6$; הנקודה $4$ ב-$A$: $B\setminus A=(4,6)$.
      - kind: computation
        text: >-
          (ב) $(A\cup B)^c=\mathbb{R}\setminus(-2,6)=(-\infty,-2]\cup[6,\infty)$. מצד שני
          $A^c=(-\infty,-2]\cup(4,\infty)$ ו-$B^c=(-\infty,0)\cup[6,\infty)$. מספר נמצא בשתיהן אם הוא $\le-2$ (אז הוא
          גם קטן מ-0), או $\ge6$ (אז הוא גם גדול מ-4). מספר בין $-2$ ל-$6$ אינו באחת מהן.
      - kind: check
        text: >-
          הנקודות $-2$ ו-$6$ שייכות ל-$(A\cup B)^c$, ולכן הסוגריים שם מרובעים. ו-$-2$ אכן ב-$A^c$ (כי $-2\notin A$) וגם
          ב-$B^c$ (כי $-2<0$).
      - kind: result
        text: >-
          $A\cap B=[0,4]$, $A\cup B=(-2,6)$, $A\setminus B=(-2,0)$, $B\setminus A=(4,6)$, ו-$(A\cup B)^c=A^c\cap
          B^c=(-\infty,-2]\cup[6,\infty)$.

  - id: W-0.7-02
    level: basic
    qualitative: true
    objectives: [OBJ-0.7-3]
    prompt: >-
      יהיו $A=\{a,b\}$ ו-$B=\{1,2,3\}$.

      (א) רשמו את $\mathcal{P}(A)$ ואת $A\times B$.

      (ב) רשמו את $\mathcal{P}(B)$ בעזרת טענה 0.7.11: קודם תת-הקבוצות של $\{1,2\}$, ואחר כך אותן קבוצות עם $3$.

      (ג) נכון או לא נכון, ולמה: $(1,a)\in A\times B$; $\{a\}\in\mathcal{P}(A)$; $\{a\}\subseteq A\times B$;
      $\emptyset\in\mathcal{P}(A\times B)$.
    answer: >-
      (א) $\mathcal{P}(A)=\{\emptyset,\{a\},\{b\},\{a,b\}\}$, ו-$A\times B$ היא ששת הזוגות $(a,1),(a,2),(a,3),(b,1),(b,2),(b,3)$.
      (ב) $\mathcal{P}(B)=\{\emptyset,\{1\},\{2\},\{1,2\},\{3\},\{1,3\},\{2,3\},\{1,2,3\}\}$. (ג) לא; נכון; לא; נכון.
    solution:
      - kind: definition
        text: >-
          $\mathcal{P}(A)$ היא קבוצת כל התת-קבוצות של $A$, ו-$A\times B$ קבוצת כל הזוגות $(x,y)$ עם $x\in A$ ו-$y\in B$
          (הגדרה 0.7.7).
      - kind: computation
        text: >-
          (א) תת-הקבוצות של $\{a,b\}$: בלי אף איבר, עם אחד מהם, ועם שניהם: $\emptyset,\{a\},\{b\},\{a,b\}$. ובמכפלה,
          לכל אחד משני האיברים של $A$ שלוש אפשרויות מ-$B$: $(a,1),(a,2),(a,3),(b,1),(b,2),(b,3)$.
      - kind: theorem
        text: >-
          (ב) $B=\{1,2,3\}=[3]$, ולפי טענה 0.7.11(א) עם $n=2$,
          $\mathcal{P}([3])=\mathcal{P}([2])\cup\{X\cup\{3\}:\ X\in\mathcal{P}([2])\}$. תת-הקבוצות של $[2]=\{1,2\}$ הן
          $\emptyset,\{1\},\{2\},\{1,2\}$, ובהוספת $3$ לכל אחת מקבלים $\{3\},\{1,3\},\{2,3\},\{1,2,3\}$. לפי 0.7.11(ב)
          אף קבוצה לא נרשמה פעמיים.
      - kind: step
        text: >-
          (ג) $(1,a)\notin A\times B$: האיבר הראשון של זוג ב-$A\times B$ שייך ל-$A$, ו-$1\notin A$. $\{a\}\in\mathcal{P}(A)$,
          כי $\{a\}\subseteq A$. $\{a\}\not\subseteq A\times B$: האיבר $a$ אינו זוג, ולכן אינו איבר של $A\times B$.
          $\emptyset\in\mathcal{P}(A\times B)$, כי $\emptyset$ מוכלת בכל קבוצה (טענה 0.7.3(ב)).
      - kind: check
        text: >-
          ב-$\mathcal{P}(B)$ שמונה קבוצות, פי שניים מארבע תת-הקבוצות של $\{1,2\}$, כמו בהערה 0.7.12. ושימו לב ל-$(a,1)\in A\times B$: הזוג עם
          אותם שני איברים בסדר ההפוך כן נמצא שם.
      - kind: result
        text: >-
          $\mathcal{P}(A)=\{\emptyset,\{a\},\{b\},\{a,b\}\}$, ב-$A\times B$ שישה זוגות, ל-$\mathcal{P}(B)$ שמונה איברים
          (רשומים בסעיף (ב)); בסעיף (ג) הטענות השנייה והרביעית נכונות.

  - id: W-0.7-03
    level: basic
    objectives: [OBJ-0.7-1, OBJ-0.7-2]
    prompt: >-
      יהיו $U=\{1,2,\dots,10\}$, $A$ קבוצת המספרים הזוגיים ב-$U$ ו-$B$ קבוצת הכפולות של $3$ ב-$U$; המשלים ב-$U$.

      (א) מצאו את $A\cup B$, $A\cap B$, $A\setminus B$ ו-$B\setminus A$.

      (ב) חשבו את $(A\cup B)^c$ ואת $A^c\cap B^c$, ואחר כך את $(A\cap B)^c$ ואת $A^c\cup B^c$. איזה משפט צופה את
      התוצאה?
    answer: >-
      (א) $A\cup B=\{2,3,4,6,8,9,10\}$, $A\cap B=\{6\}$, $A\setminus B=\{2,4,8,10\}$, $B\setminus A=\{3,9\}$.
      (ב) $(A\cup B)^c=A^c\cap B^c=\{1,5,7\}$, $(A\cap B)^c=A^c\cup B^c=U\setminus\{6\}$; משפט 0.7.6.
    solution:
      - kind: computation
        text: >-
          $A=\{2,4,6,8,10\}$ ו-$B=\{3,6,9\}$.
      - kind: computation
        text: >-
          (א) באיחוד כל מספר שבאחת מהן: $\{2,3,4,6,8,9,10\}$. בחיתוך רק $6$, שהוא זוגי וכפולה של $3$. $A\setminus B$
          מוציא מ-$A$ את $6$: $\{2,4,8,10\}$. $B\setminus A$ מוציא מ-$B$ את $6$: $\{3,9\}$.
      - kind: computation
        text: >-
          (ב) $(A\cup B)^c=\{1,5,7\}$. $A^c=\{1,3,5,7,9\}$ ו-$B^c=\{1,2,4,5,7,8,10\}$, והחיתוך שלהן $\{1,5,7\}$.
      - kind: computation
        text: >-
          $(A\cap B)^c=U\setminus\{6\}=\{1,2,3,4,5,7,8,9,10\}$, ו-$A^c\cup B^c$: כל מספר שאינו זוגי או אינו כפולה
          של $3$, כלומר כל מספר חוץ מ-$6$. שוב אותה קבוצה.
      - kind: theorem
        text: >-
          משפט 0.7.6(א)(ב) (דה-מורגן) אומר ששני השוויונות נכונים לכל שתי קבוצות; כאן ראינו אותם בדוגמה אחת.
      - kind: check
        text: >-
          $A\cup B$ ו-$(A\cup B)^c$ זרות ויחד הן $U$: שבעה מספרים ועוד שלושה, עשרה.
      - kind: result
        text: >-
          $A\cup B=\{2,3,4,6,8,9,10\}$, $A\cap B=\{6\}$, $A\setminus B=\{2,4,8,10\}$, $B\setminus A=\{3,9\}$;
          $(A\cup B)^c=A^c\cap B^c=\{1,5,7\}$ ו-$(A\cap B)^c=A^c\cup B^c=U\setminus\{6\}$.

  - id: W-0.7-04
    level: mid
    objectives: [OBJ-0.7-2]
    prompt: >-
      לכל $n\in\mathbb{N}$ תהי $A_n=\{k\in\mathbb{Z}:\ -n\le k\le n\}$, והמשלים נלקח ב-$U=\mathbb{Z}$.

      (א) הוכיחו: $\bigcup_{n=1}^{\infty}A_n=\mathbb{Z}$.

      (ב) הוכיחו: $\bigcap_{n=1}^{\infty}A_n=\{-1,0,1\}$.

      (ג) מצאו, בעזרת משפט 0.7.10, את $\bigcap_{n=1}^{\infty}A_n^c$ ואת $\bigcup_{n=1}^{\infty}A_n^c$.
    answer: >-
      (א) לכל $k\ge0$, $k\in A_{k+1}$; לכל $k<0$, $k\in A_{-k}$. (ב) החיתוך הוא $A_1=\{-1,0,1\}$, כי $A_1\subseteq A_n$
      לכל $n$. (ג) $\bigcap_n A_n^c=\emptyset$ ו-$\bigcup_n A_n^c=\mathbb{Z}\setminus\{-1,0,1\}$.
    solution:
      - kind: definition
        text: >-
          לפי הגדרה 0.7.9, $k\in\bigcup_n A_n$ אם $k\in\mathbb{Z}$ ו**קיים** $n\in\mathbb{N}$ עם $k\in A_n$, ו-$k\in\bigcap_n
          A_n$ אם $k\in\mathbb{Z}$ ו-$k\in A_n$ **לכל** $n\in\mathbb{N}$.
      - kind: idea
        text: >-
          באיחוד מוצאים לכל $k$ קטע אחד גדול מספיק. בחיתוך, הקבוצה הקטנה ביותר, $A_1$, מכריעה, כי היא מוכלת בכולן.
          את (ג) לא מחשבים מחדש: משפט 0.7.10 מעביר את התשובות של (א) ו-(ב) למשלימים.
      - kind: step
        text: >-
          (א) (⊆) כל $A_n$ מוכלת ב-$\mathbb{Z}$, ולכן גם האיחוד. (⊇) יהי $k\in\mathbb{Z}$. אם $k\ge0$, נבחר
          $n=k+1\in\mathbb{N}$: $-n<0\le k$ ו-$k<k+1=n$, ולכן $k\in A_n$. אם $k<0$, נבחר $n=-k$: זה שלם חיובי, ולכן
          $n\ge1$ (אין שלם בין $0$ ל-$1$, עובדה מקובלת (ג)), כלומר $n\in\mathbb{N}$; ו-$-n=k\le k$, $k<0<n$, ולכן
          $k\in A_n$.
      - kind: step
        text: >-
          (ב) קודם $A_1=\{k\in\mathbb{Z}:\ -1\le k\le1\}=\{-1,0,1\}$, כי אין שלם בין $-1$ ל-$0$ ואין שלם בין $0$ ל-$1$
          (עובדה מקובלת (ג)). (⊆) אם $k$ בחיתוך, אז בפרט $k\in A_1$. (⊇) יהי $k\in\{-1,0,1\}$ ויהי $n\in\mathbb{N}$.
          אז $n\ge1$, ולכן $-n\le-1\le k\le1\le n$, כלומר $k\in A_n$. זה לכל $n$, ולכן $k$ בחיתוך.
      - kind: theorem
        text: >-
          (ג) לפי משפט 0.7.10 (דה-מורגן למשפחה), $\bigcap_n A_n^c=\big(\bigcup_n A_n\big)^c=\mathbb{Z}\setminus\mathbb{Z}=\emptyset$,
          ו-$\bigcup_n A_n^c=\big(\bigcap_n A_n\big)^c=\mathbb{Z}\setminus\{-1,0,1\}$.
      - kind: check
        text: >-
          ישירות: $A_n^c$ היא קבוצת השלמים עם $k<-n$ או $k>n$. המספר $5$ נמצא ב-$A_1^c$, ולכן באיחוד המשלימים;
          אבל $5\in A_5$, כלומר $5\notin A_5^c$, ולכן אינו בחיתוך המשלימים. כך לכל שלם $k$: הוא ב-$A_n$ לכל
          $n$ גדול מספיק, ולכן לא בכל המשלימים.
      - kind: result
        text: >-
          $\bigcup_n A_n=\mathbb{Z}$, $\bigcap_n A_n=\{-1,0,1\}$, $\bigcap_n A_n^c=\emptyset$,
          $\bigcup_n A_n^c=\mathbb{Z}\setminus\{-1,0,1\}$.

  - id: W-0.7-05
    level: mid
    qualitative: true
    objectives: [OBJ-0.7-1]
    prompt: >-
      נכון או לא נכון לכל שלוש קבוצות $A$, $B$, $C$? הוכיחו, או הביאו דוגמה נגדית.

      (א) $A\setminus(A\setminus B)=A\cap B$.

      (ב) $(A\cup B)\setminus C=A\cup(B\setminus C)$.
    answer: >-
      (א) נכון. (ב) לא נכון: $A=C=\{1\}$, $B=\emptyset$ נותנות $\emptyset$ באגף שמאל ו-$\{1\}$ באגף ימין.
    solution:
      - kind: idea
        text: >-
          לתרגם כל צד לתנאי ש-$x$ מקיים. ב-(א) התנאים מתבררים כשקולים, ולכן מוכיחים שתי הכלות. ב-(ב) באגף ימין $C$ לא
          מוציאה כלום מ-$A$, ולכן מחפשים איבר של $A$ שנמצא ב-$C$.
      - kind: step
        text: >-
          (א) $x\in A\setminus(A\setminus B)$ פירושו $x\in A$ ו-$x\notin A\setminus B$. איבר של $A$ אינו ב-$A\setminus
          B$ בדיוק כשהוא ב-$B$ (אחרת הוא היה ב-$A$ ולא ב-$B$).
      - kind: step
        text: >-
          (⊆) יהי $x\in A\setminus(A\setminus B)$. אז $x\in A$, ולפי הצעד הקודם $x\in B$, כלומר $x\in A\cap B$. (⊇)
          יהי $x\in A\cap B$. אז $x\in A$, ו-$x\notin A\setminus B$ כי $x\in B$. לכן $x\in A\setminus(A\setminus B)$.
      - kind: computation
        text: >-
          (ב) $A=C=\{1\}$, $B=\emptyset$: אגף שמאל $(\{1\}\cup\emptyset)\setminus\{1\}=\emptyset$. אגף ימין
          $\{1\}\cup(\emptyset\setminus\{1\})=\{1\}$. הקבוצות שונות.
      - kind: check
        text: >-
          מה כן נכון ב-(ב): $(A\cup B)\setminus C\subseteq A\cup(B\setminus C)$ תמיד, ושוויון מתקיים כש-$A$ ו-$C$ זרות
          (אין להן איבר משותף). דוגמה שבה האגפים יוצאים שווים, למשל כש-$C=\emptyset$, אינה הוכחה של (ב).
      - kind: result
        text: >-
          (א) נכון, בהכלה דו-כיוונית. (ב) לא נכון: $A=C=\{1\}$, $B=\emptyset$.

  - id: W-0.7-06
    level: mid
    objectives: [OBJ-0.7-1]
    prompt: >-
      יהיו $A$ ו-$B$ קבוצות. הוכיחו שארבע הטענות הבאות שקולות: (1) $A\subseteq B$; (2) $A\cup B=B$; (3)
      $A\cap B=A$; (4) $A\setminus B=\emptyset$.
    answer: >-
      מוכיחים שרשרת סגורה של גרירות: (1)⇒(2)⇒(3)⇒(4)⇒(1). כל גרירה היא הכלה דו-כיוונית קצרה או הוכחה בשלילה.
    solution:
      - kind: idea
        text: >-
          במקום להוכיח שש שקילויות, מוכיחים ארבע גרירות במעגל: כל טענה גוררת את הבאה, והאחרונה את הראשונה. אז כל
          אחת גוררת כל אחת אחרת, בהליכה על המעגל.
      - kind: step
        text: >-
          (1)⇒(2). (⊆) יהי $x\in A\cup B$. אם $x\in B$, סיימנו; אם $x\in A$, אז $x\in B$ לפי (1). (⊇) $B\subseteq
          A\cup B$, כי כל $x\in B$ מקיים "$x\in A$ או $x\in B$".
      - kind: step
        text: >-
          (2)⇒(3). (⊆) כל איבר של $A\cap B$ נמצא ב-$A$. (⊇) יהי $x\in A$. אז $x\in A\cup B=B$ לפי (2), ולכן
          $x\in A\cap B$.
      - kind: step
        text: >-
          (3)⇒(4). נניח בשלילה ש-$x\in A\setminus B$. אז $x\in A=A\cap B$ לפי (3), ולכן $x\in B$, בסתירה ל-$x\notin
          B$. לכן ל-$A\setminus B$ אין איברים, ולפי טענה 0.7.3(ב) $A\setminus B=\emptyset$.
      - kind: step
        text: >-
          (4)⇒(1). יהי $x\in A$. אילו $x\notin B$, היה $x\in A\setminus B=\emptyset$, ואין בה איברים. לכן $x\in B$.
      - kind: check
        text: >-
          עם $A=\{1\}$, $B=\{1,2\}$ כל ארבע הטענות נכונות; עם $A=\{1,3\}$, $B=\{1,2\}$ כולן לא נכונות: $A\cup
          B=\{1,2,3\}\ne B$, $A\cap B=\{1\}\ne A$, ו-$A\setminus B=\{3\}$.
      - kind: result
        text: >-
          $A\subseteq B$ אם ורק אם $A\cup B=B$, אם ורק אם $A\cap B=A$, אם ורק אם $A\setminus B=\emptyset$.

  - id: W-0.7-07
    level: mid
    qualitative: true
    objectives: [OBJ-0.7-3]
    prompt: >-
      הוכיחו או הפריכו, לכל קבוצות $A$, $B$, $C$:

      (א) אם $A\times B=A\times C$, אז $B=C$.

      (ב) אם $A\ne\emptyset$ ו-$A\times B=A\times C$, אז $B=C$.
    answer: >-
      (א) לא נכון: $A=\emptyset$, $B=\{1\}$, $C=\{2\}$, ושתי המכפלות ריקות. (ב) נכון: עם $a\in A$, כל $b\in B$ נותן
      $(a,b)\in A\times C$, ולכן $b\in C$; ולהפך.
    solution:
      - kind: idea
        text: >-
          מ-$(a,b)\in A\times C$ אפשר לקרוא את $b\in C$, אבל רק אם יש בכלל זוג כזה: צריך איבר $a\in A$. כש-$A$ ריקה,
          כל המכפלות שלה ריקות (טענה 0.7.14(ד)), והן לא "זוכרות" את $B$.
      - kind: computation
        text: >-
          (א) $A=\emptyset$, $B=\{1\}$, $C=\{2\}$. לפי טענה 0.7.14(ד), $A\times B=\emptyset=A\times C$, אבל $B\ne C$.
      - kind: step
        text: >-
          (ב) כיוון ש-$A\ne\emptyset$, יש $a\in A$. (⊆) יהי $b\in B$. אז $(a,b)\in A\times B=A\times C$, כלומר
          $(a,b)=(a',c)$ עם $a'\in A$ ו-$c\in C$. לפי תכונת הזוג הסדור $b=c\in C$.
      - kind: step
        text: >-
          (⊇) יהי $c\in C$. אז $(a,c)\in A\times C=A\times B$, ולפי אותו נימוק $c\in B$. לכן $B=C$ (טענה 0.7.3(ד)).
      - kind: check
        text: >-
          ההנחה $A\ne\emptyset$ שימשה בשורה הראשונה של (ב), וזו בדיוק ההנחה שהדוגמה הנגדית של (א) מפרה.
      - kind: result
        text: >-
          (א) לא נכון. (ב) נכון: מכפלה בקבוצה לא ריקה אפשר "לצמצם".

  - id: W-0.7-08
    level: exam
    qualitative: true
    objectives: [OBJ-0.7-2]
    prompt: >-
      ההפרש הסימטרי של שתי קבוצות הוא $X\triangle Y=(X\setminus Y)\cup(Y\setminus X)$. לכל שלוש קבוצות $A$, $B$, $C$:

      (א) הוכיחו: $A\cap(B\triangle C)=(A\cap B)\triangle(A\cap C)$.

      (ב) הפריכו: $A\cup(B\triangle C)=(A\cup B)\triangle(A\cup C)$.
    answer: >-
      (א) לכל $x$ שני האגפים אומרים "$x\in A$, ו-$x$ נמצא בדיוק באחת מ-$B$, $C$". (ב) $A=B=C=\{1\}$: אגף שמאל $\{1\}$,
      אגף ימין $\emptyset$.
    solution:
      - kind: definition
        text: >-
          $x\in X\triangle Y$ אם ורק אם $x$ נמצא בדיוק באחת מהקבוצות $X$, $Y$: ב-$X$ ולא ב-$Y$, או ב-$Y$ ולא ב-$X$.
      - kind: idea
        text: >-
          חלוקה למקרים לפי "$x\in A$?", כמו בטבלת שייכות. כש-$x\notin A$, שני האגפים של (א) לא מכילים אותו; כש-$x\in A$,
          החיתוך עם $A$ לא משנה דבר. ב-(ב), איבר של $A$ נמצא באגף שמאל תמיד, אבל ב-$A\cup B$ וגם ב-$A\cup C$, ולכן
          לא בהפרש הסימטרי שלהן.
      - kind: step
        text: >-
          (א) מקרה $x\notin A$: אז $x\notin A\cap(B\triangle C)$, וגם $x\notin A\cap B$ ו-$x\notin A\cap C$, ולכן $x$
          אינו באף אחת מהן ואינו ב-$(A\cap B)\triangle(A\cap C)$.
      - kind: step
        text: >-
          מקרה $x\in A$: אז $x\in A\cap B$ אם ורק אם $x\in B$, ו-$x\in A\cap C$ אם ורק אם $x\in C$. לכן $x$ נמצא
          בדיוק באחת מ-$A\cap B$, $A\cap C$ אם ורק אם הוא נמצא בדיוק באחת מ-$B$, $C$, כלומר אם ורק אם $x\in
          A\cap(B\triangle C)$.
      - kind: step
        text: >-
          בשני המקרים $x$ שייך לאגף שמאל אם ורק אם הוא שייך לאגף ימין, ולפי הגדרה 0.7.1 האגפים שווים.
      - kind: computation
        text: >-
          (ב) $A=B=C=\{1\}$. אגף שמאל: $B\triangle C=\emptyset$, ו-$A\cup\emptyset=\{1\}$. אגף ימין: $A\cup B=A\cup
          C=\{1\}$, ו-$\{1\}\triangle\{1\}=\emptyset$. ו-$\{1\}\ne\emptyset$.
      - kind: check
        text: >-
          בטבלת שייכות של $A$, $B$, $C$, (א) נבדק בכל שמונת האזורים, ו-(ב) נכשל בדיוק באזורים שבתוך $A$: שם אגף שמאל
          מכיל את $x$ ואגף ימין לא.
      - kind: result
        text: >-
          (א) חיתוך מתפלג על הפרש סימטרי. (ב) איחוד לא: $A=B=C=\{1\}$ היא דוגמה נגדית.

  - id: W-0.7-09
    level: exam
    objectives: [OBJ-0.7-3]
    prompt: >-
      הוכיחו: לכל שתי קבוצות $A$ ו-$B$, $A\times B=B\times A$ אם ורק אם $A=B$ או $A=\emptyset$ או $B=\emptyset$.
    answer: >-
      ($\Leftarrow$) כש-$A=B$ אין מה להוכיח, וכשאחת ריקה שתי המכפלות ריקות. ($\Rightarrow$) אם שתיהן לא ריקות,
      $(a,b)\in A\times B=B\times A$ נותן $a\in B$, ו-$b\in A$.
    solution:
      - kind: goal
        text: >-
          גרירה בכל כיוון. בכיוון ($\Rightarrow$) נניח $A\times B=B\times A$, וגם ש-$A$ ו-$B$ לא ריקות (אחרת סיימנו),
          ונוכיח $A=B$ בהכלה דו-כיוונית.
      - kind: idea
        text: >-
          איבר של $A$ שעומד **ראשון** בזוג של $A\times B$ חייב, בגלל השוויון, להיות ראשון בזוג של $B\times A$, כלומר
          איבר של $B$. כדי לבנות זוג צריך איבר כלשהו בקבוצה השנייה, ולכן צריך שתיהן לא ריקות.
      - kind: step
        text: >-
          ($\Leftarrow$) אם $A=B$, שני האגפים הם $A\times A$. אם $A=\emptyset$ או $B=\emptyset$, אז לפי טענה 0.7.14(ד)
          גם $A\times B=\emptyset$ וגם $B\times A=\emptyset$.
      - kind: step
        text: >-
          ($\Rightarrow$), (⊆): יהי $a\in A$, ונבחר $b\in B$ כלשהו ($B\ne\emptyset$). אז $(a,b)\in A\times B=B\times A$,
          כלומר $(a,b)=(b',a')$ עם $b'\in B$ ו-$a'\in A$. לפי תכונת הזוג הסדור $a=b'\in B$.
      - kind: step
        text: >-
          ($\Rightarrow$), (⊇): יהי $b\in B$, ונבחר $a\in A$ ($A\ne\emptyset$). אז $(a,b)\in A\times B=B\times A$, כלומר
          $(a,b)=(b'',a'')$ עם $a''\in A$, ולכן $b=a''\in A$. לפי טענה 0.7.3(ד), $A=B$.
      - kind: check
        text: >-
          כל אחת משלוש האפשרויות נחוצה: $A=\{1\}$, $B=\{2\}$ נותנות $\{(1,2)\}\ne\{(2,1)\}$; ו-$A=\emptyset$, $B=\{2\}$
          נותנות שוויון ($\emptyset=\emptyset$) אף ש-$A\ne B$. הטענה נבדקה גם על כל זוג תת-קבוצות של קבוצה בת ארבעה
          איברים.
      - kind: result
        text: >-
          $A\times B=B\times A$ בדיוק כש-$A=B$ או כשאחת הקבוצות ריקה.

  - id: W-0.7-10
    level: exam
    objectives: [OBJ-0.7-2]
    prompt: >-
      לכל $t\in[0,1]$ יהי $A_t=[t,t+1]$, תת-קבוצה של $U=\mathbb{R}$ (קבוצת האינדקסים היא $I=[0,1]$).

      (א) הוכיחו: $\bigcup_{t\in[0,1]}A_t=[0,2]$.

      (ב) הוכיחו: $\bigcap_{t\in[0,1]}A_t=\{1\}$.

      (ג) מצאו בעזרת משפט 0.7.10 את $\bigcap_{t\in[0,1]}A_t^c$ ואת $\bigcup_{t\in[0,1]}A_t^c$.
    answer: >-
      (א) $y\in[0,2]$ נמצא ב-$A_y$ כש-$y\le1$ וב-$A_1$ כש-$y>1$. (ב) $1\in A_t$ לכל $t$, ו-$A_0\cap A_1=\{1\}$. (ג)
      $\bigcap_t A_t^c=(-\infty,0)\cup(2,\infty)$ ו-$\bigcup_t A_t^c=\mathbb{R}\setminus\{1\}$.
    solution:
      - kind: definition
        text: >-
          לפי הגדרה 0.7.9, $y\in\bigcup_t A_t$ אם **קיים** $t\in[0,1]$ עם $t\le y\le t+1$, ו-$y\in\bigcap_t A_t$ אם
          $t\le y\le t+1$ **לכל** $t\in[0,1]$. כאן קבוצת האינדקסים אינה $\mathbb{N}$ אלא קטע, וההגדרה לא משתנה.
      - kind: idea
        text: >-
          באיחוד מוצאים לכל $y$ אינדקס מתאים. בחיתוך, שתי קבוצות במשפחה, $A_0=[0,1]$ ו-$A_1=[1,2]$, כבר נחתכות רק ב-$1$.
      - kind: step
        text: >-
          (א) (⊆) אם $y\in A_t$ עם $0\le t\le1$, אז $0\le t\le y$ ו-$y\le t+1\le2$, ולכן $y\in[0,2]$. (⊇) יהי
          $y\in[0,2]$. אם $y\le1$, נבחר $t=y\in[0,1]$, ו-$y\in[y,y+1]=A_y$. אם $y>1$, נבחר $t=1$: $1<y\le2$, ולכן
          $y\in[1,2]=A_1$.
      - kind: step
        text: >-
          (ב) (⊇) לכל $t\in[0,1]$: $t\le1$ ו-$1\le t+1$ (כי $t\ge0$), ולכן $1\in A_t$. (⊆) יהי $y$ בחיתוך. בפרט
          $y\in A_0=[0,1]$, ולכן $y\le1$, וגם $y\in A_1=[1,2]$, ולכן $y\ge1$. לפי עובדה מקובלת (ב), $y=1$.
      - kind: theorem
        text: >-
          (ג) לפי משפט 0.7.10, $\bigcap_t A_t^c=\big(\bigcup_t A_t\big)^c=\mathbb{R}\setminus[0,2]=(-\infty,0)\cup(2,\infty)$,
          ו-$\bigcup_t A_t^c=\big(\bigcap_t A_t\big)^c=\mathbb{R}\setminus\{1\}$.
      - kind: check
        text: >-
          ישירות: $2.5$ אינו באף $A_t$ (כי $t+1\le2$), ולכן הוא בכל המשלימים. ו-$0.5\in A_1^c$, כי $0.5\notin[1,2]$,
          ולכן הוא באיחוד המשלימים; כך כל $y\ne1$: אם $y<1$, אז $y\in A_1^c$, ואם $y>1$, אז $y\in A_0^c$.
      - kind: result
        text: >-
          $\bigcup_t A_t=[0,2]$, $\bigcap_t A_t=\{1\}$, $\bigcap_t A_t^c=(-\infty,0)\cup(2,\infty)$,
          $\bigcup_t A_t^c=\mathbb{R}\setminus\{1\}$.

challenge:
  - id: W-0.7-c1
    stars: 1
    objectives: [OBJ-0.7-2, OBJ-0.7-3]
    prompt: >-
      לכל $a\in\mathbb{R}$ תהי $A_a=\{(x,\,a(x^2-1)):\ x\in\mathbb{R}\}$, תת-קבוצה של $\mathbb{R}\times\mathbb{R}$ (הגרף של
      הפרבולה $y=a(x^2-1)$). הוכיחו: $\bigcap_{a\in\mathbb{R}}A_a=\{(-1,0),(1,0)\}$.
    answer: >-
      שתי הנקודות נמצאות בכל $A_a$, כי $a(1-1)=0$. ולהפך, נקודה בחיתוך נמצאת ב-$A_0$, ולכן היא $(x,0)$, וגם ב-$A_1$,
      ולכן $0=x^2-1$, כלומר $x=\pm1$.
    solution:
      - kind: definition
        text: >-
          המשפחה היא $A_a$, $a\in I=\mathbb{R}$, בתוך $U=\mathbb{R}\times\mathbb{R}$. נקודה $p$ נמצאת בחיתוך אם לכל
          $a\in\mathbb{R}$ יש $x\in\mathbb{R}$ עם $p=(x,a(x^2-1))$.
      - kind: idea
        text: >-
          כדי להראות שנקודה בחיתוך, בודקים אותה מול **כל** $a$. כדי להגביל את החיתוך מספיקות שתי קבוצות במשפחה:
          $A_0$ (ציר ה-$x$) ו-$A_1$ (הפרבולה $y=x^2-1$); לפי הגדרה 0.7.9 החיתוך של כל המשפחה מוכל בחיתוך שלהן (כל איבר שלו נמצא בכל $A_a$, ובפרט בשתיהן).
      - kind: step
        text: >-
          (⊇) יהי $a\in\mathbb{R}$. עם $x=1$: $(1,a(1^2-1))=(1,0)$, ולכן $(1,0)\in A_a$; עם $x=-1$: $(-1,a((-1)^2-1))=(-1,0)\in
          A_a$. זה לכל $a$, ולכן שתי הנקודות בחיתוך.
      - kind: step
        text: >-
          (⊆) תהי $p$ בחיתוך. מ-$p\in A_0$: $p=(x,0\cdot(x^2-1))=(x,0)$ עבור $x\in\mathbb{R}$ כלשהו. מ-$p\in A_1$:
          $p=(x',x'^2-1)$ עבור $x'$ כלשהו. לפי תכונת הזוג הסדור $x=x'$ ו-$0=x^2-1$.
      - kind: step
        text: >-
          $x^2-1=(x-1)(x+1)=0$, ומכפלה של שני מספרים היא אפס רק כשאחד מהם אפס (אם $x-1\ne0$ כופלים בהופכי שלו, עובדה
          מקובלת (א)). לכן $x=1$ או $x=-1$, ו-$p\in\{(-1,0),(1,0)\}$.
      - kind: check
        text: >-
          גיאומטרית: כל הפרבולות $y=a(x^2-1)$ עוברות דרך שתי הנקודות שבהן $x^2-1=0$, וזה כל מה שמשותף להן. ונקודה כמו
          $(0,0)$ נמצאת ב-$A_0$ ואינה ב-$A_1$, כי $0\ne0^2-1$.
      - kind: result
        text: >-
          $\bigcap_{a\in\mathbb{R}}A_a=\{(-1,0),(1,0)\}$.
    source:
      name: 'Richard Hammack, Book of Proof (third edition, edition 3.4)'
      year: 2018
      problem: 'Chapter 8, Exercise 23'
      url: 'https://richardhammack.github.io/BookOfProof/Main.pdf'
      verified: '2026-11-10'
      adapted: true

  - id: W-0.7-c2
    stars: 1
    objectives: [OBJ-0.7-3]
    prompt: >-
      יהיו $A$, $B$, $C$ קבוצות, $B\ne\emptyset$, ונניח ש-$A\times B\subseteq B\times C$. הוכיחו ש-$A\subseteq C$, והראו
      שבלי ההנחה $B\ne\emptyset$ המסקנה עלולה להיכשל.
    answer: >-
      יהי $a\in A$ ו-$b\in B$. מ-$(a,b)\in B\times C$ נובע $a\in B$; ואז $(a,a)\in A\times B\subseteq B\times C$ נותן
      $a\in C$. בלי ההנחה: $A=\{1\}$, $B=C=\emptyset$.
    solution:
      - kind: goal
        text: >-
          יהי $a\in A$; צריך להראות $a\in C$. מה שאנחנו יודעים על $C$ מגיע רק מהמקום **השני** בזוגות של $B\times C$.
      - kind: idea
        text: >-
          כדי ש-$a$ יעמוד במקום השני בזוג של $A\times B$, צריך ש-$a\in B$. לכן מראים קודם ש-$a\in B$, בעזרת זוג
          שבו $a$ עומד ראשון, ואז משתמשים בזוג $(a,a)$.
      - kind: step
        text: >-
          כיוון ש-$B\ne\emptyset$, יש $b\in B$. אז $(a,b)\in A\times B\subseteq B\times C$, כלומר $(a,b)=(b',c)$ עם $b'\in B$
          ו-$c\in C$. לפי תכונת הזוג הסדור $a=b'\in B$.
      - kind: step
        text: >-
          עכשיו $a\in A$ ו-$a\in B$, ולכן $(a,a)\in A\times B\subseteq B\times C$: $(a,a)=(b'',c'')$ עם $c''\in C$, ולפי תכונת
          הזוג הסדור $a=c''\in C$. זה לכל $a\in A$, ולכן $A\subseteq C$.
      - kind: check
        text: >-
          ההנחה $B\ne\emptyset$ שימשה רק בבחירת $b$. בלעדיה: $A=\{1\}$, $B=C=\emptyset$. אז $A\times B=\emptyset$ (טענה
          0.7.14(ד)), והיא מוכלת בכל קבוצה, אבל $A=\{1\}\not\subseteq\emptyset=C$. הטענה נבדקה גם על כל שלשה של תת-קבוצות
          של קבוצה בת ארבעה איברים.
      - kind: result
        text: >-
          אם $B\ne\emptyset$ ו-$A\times B\subseteq B\times C$, אז $A\subseteq C$; בלי $B\ne\emptyset$ זה לא נכון.
    source:
      name: 'Richard Hammack, Book of Proof (third edition, edition 3.4)'
      year: 2018
      problem: 'Chapter 8, Exercise 31'
      url: 'https://richardhammack.github.io/BookOfProof/Main.pdf'
      verified: '2026-11-10'
      adapted: true
