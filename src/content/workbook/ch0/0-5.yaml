# Workbook of lesson 0.5 — mathematical induction.
# Objectives (src/course.ts):
#   OBJ-0.5-1  state and carry out a proof by induction: base, induction hypothesis, step
#   OBJ-0.5-2  prove sum formulas and inequalities by induction; define sums, products and powers by recursion
#   OBJ-0.5-3  spot a flawed induction proof (a missing base, or a step that does not work for every n)
# Every number below was recomputed (tests/math/induction.test.ts and npx tsx one-liners).
# Numbered results (מסקנה 0.5.2, משפט 0.5.11, …) are the lesson's. The old W-0.5-05, 07 and 09 (Bernoulli,
# strong induction) moved to lesson 0.6 as W-0.6-01, 04 and 08 on 2026-11-10.
lesson: '0.5'
practice:
  - id: W-0.5-01
    level: basic
    objectives: [OBJ-0.5-1, OBJ-0.5-2]
    prompt: >-
      הוכיחו באינדוקציה: לכל $n$ טבעי, $1\cdot2+2\cdot3+\dots+n(n+1)=\frac{n(n+1)(n+2)}{3}$.
    answer: >-
      בסיס: $1\cdot2=2=\frac{1\cdot2\cdot3}{3}$. צעד: $\frac{n(n+1)(n+2)}{3}+(n+1)(n+2)=\frac{(n+1)(n+2)(n+3)}{3}$.
    solution:
      - kind: goal
        text: '$P(n)$: $\sum_{k=1}^{n}k(k+1)=\frac{n(n+1)(n+2)}{3}$, לכל $n\in\mathbb{N}$.'
      - kind: idea
        text: >-
          לפי הגדרת הסכום ברקורסיה (הגדרה 0.5.5(א)), הסכום עד $n+1$ הוא הסכום עד $n$ ועוד המחובר הבא,
          $(n+1)(n+2)$. את הסכום עד $n$ מחליפים לפי ההנחה, ומוציאים גורם משותף $(n+1)(n+2)$.
      - kind: step
        text: 'בסיס: עבור $n=1$ אגף שמאל הוא $\sum_{k=1}^{1}k(k+1)=1\cdot2=2$, ואגף ימין $\frac{1\cdot2\cdot3}{3}=2$.'
      - kind: step
        text: 'הנחת האינדוקציה: יהי $n\in\mathbb{N}$, ונניח ש-$\sum_{k=1}^{n}k(k+1)=\frac{n(n+1)(n+2)}{3}$.'
      - kind: computation
        text: >-
          המטרה: $\sum_{k=1}^{n+1}k(k+1)=\frac{(n+1)(n+2)(n+3)}{3}$. לפי ההגדרה ואחר כך ההנחה:

          $$\sum_{k=1}^{n+1}k(k+1)=\frac{n(n+1)(n+2)}{3}+\frac{3(n+1)(n+2)}{3}=\frac{(n+1)(n+2)(n+3)}{3}.$$
      - kind: check
        text: 'עבור $n=3$: $2+6+12=20$, ו-$\frac{3\cdot4\cdot5}{3}=20$.'
      - kind: result
        text: 'לפי מסקנה 0.5.2, $\sum_{k=1}^{n}k(k+1)=\frac{n(n+1)(n+2)}{3}$ לכל $n$ טבעי.'

  - id: W-0.5-02
    level: basic
    objectives: [OBJ-0.5-1, OBJ-0.5-2]
    prompt: >-
      הוכיחו באינדוקציה: לכל $n$ טבעי, $1^3+2^3+\dots+n^3=\left(\frac{n(n+1)}{2}\right)^2$.
    answer: >-
      בסיס: $1=1^2$. בצעד מוציאים גורם משותף $(n+1)^2$ ומקבלים $\left(\frac{(n+1)(n+2)}{2}\right)^2$.
    solution:
      - kind: goal
        text: '$P(n)$: $\sum_{k=1}^{n}k^3=\frac{n^2(n+1)^2}{4}$.'
      - kind: idea
        text: >-
          מוסיפים את $(n+1)^3$ לנוסחה של $n$ (הגדרה 0.5.5(א)), ומוציאים את הגורם המשותף $(n+1)^2$, שמופיע בשני
          המחוברים.
      - kind: step
        text: 'בסיס: עבור $n=1$: $1^3=1$ ו-$\left(\frac{1\cdot2}{2}\right)^2=1$.'
      - kind: step
        text: 'הנחת האינדוקציה: נניח ש-$\sum_{k=1}^{n}k^3=\frac{n^2(n+1)^2}{4}$ עבור $n$ מסוים.'
      - kind: computation
        text: >-
          צריך להוכיח ש-$\sum_{k=1}^{n+1}k^3=\frac{(n+1)^2(n+2)^2}{4}$. לפי ההגדרה וההנחה:

          $$\sum_{k=1}^{n+1}k^3=\frac{n^2(n+1)^2}{4}+(n+1)^3=\frac{(n+1)^2\left(n^2+4(n+1)\right)}{4}=\frac{(n+1)^2(n+2)^2}{4},$$

          כי $n^2+4n+4=(n+2)^2$.
      - kind: check
        text: 'עבור $n=3$: $1+8+27=36$, ו-$\left(\frac{3\cdot4}{2}\right)^2=6^2=36$.'
      - kind: result
        text: >-
          לפי מסקנה 0.5.2 הנוסחה נכונה לכל $n$. (כלומר $1^3+\dots+n^3=(1+\dots+n)^2$, לפי טענה 0.5.8(א).)

  - id: W-0.5-03
    level: mid
    qualitative: true
    objectives: [OBJ-0.5-1, OBJ-0.5-3]
    prompt: >-
      על טענות $P(1),P(2),P(3),\dots$ ידוע ש-$P(1)$ נכונה, ושלכל $n$ טבעי $P(n)$ גוררת את $P(n+2)$.

      (א) עבור אילו $n$ אפשר להסיק ש-$P(n)$ נכונה?

      (ב) נכון או לא נכון: מזה נובע ש-$P(n)$ נכונה לכל $n$. אם לא, תנו דוגמה נגדית.

      (ג) מה מספיק להוסיף להנחות כדי להסיק ש-$P(n)$ נכונה לכל $n$?
    answer: >-
      (א) לכל $n$ אי-זוגי. (ב) לא נכון: $P(n)$ = "$n$ אי-זוגי". (ג) מספיק להוסיף ש-$P(2)$ נכונה. (תשובה
      נכונה נוספת: להוסיף שלכל $n$, $P(n)$ גוררת את $P(n+1)$; אז זו אינדוקציה רגילה מ-$P(1)$.)
    solution:
      - kind: idea
        text: >-
          אבני דומינו שכל אחת מפילה את זו שנמצאת **שתי** אבנים אחריה: מהאבן הראשונה נופלות רק האבנים במקומות
          האי-זוגיים. כדי להשתמש במסקנה 0.5.2 ממספרים מחדש את המקומות האלה.
      - kind: step
        text: >-
          (א) המקום ה-$m$ ברשימה $1,3,5,\dots$ הוא $2m-1$. נגדיר לכל $m\in\mathbb{N}$ טענה חדשה $Q(m)$ = "$P(2m-1)$
          נכונה". $Q(1)$ היא $P(1)$, נכונה. ו-$Q(m)\Rightarrow Q(m+1)$, כי $P(2m-1)$ גוררת את $P(2m+1)$ (הגרירה
          הנתונה עם $n=2m-1$), ו-$2m+1=2(m+1)-1$. לפי מסקנה 0.5.2 $Q(m)$ נכונה לכל $m$, כלומר $P(n)$ נכונה לכל $n$
          אי-זוגי (כל אי-זוגי טבעי הוא $2m-1$ עם $m\in\mathbb{N}$).
      - kind: step
        text: >-
          (ב) לא נכון. דוגמה נגדית: $P(n)$ = "$n$ אי-זוגי". $P(1)$ נכונה. אם $n$ אי-זוגי, $n=2j+1$, אז גם
          $n+2=2(j+1)+1$ אי-זוגי; ואם $n$ זוגי, ההנחה של הגרירה שקרית והגרירה נכונה. אבל $P(2)$ שקרית.
      - kind: step
        text: >-
          (ג) אם מוסיפים ש-$P(2)$ נכונה, אותו טיעון עם $R(m)$ = "$P(2m)$ נכונה" נותן את $P(n)$ לכל $n$ זוגי, ויחד
          עם (א) לכל $n$ (כל טבעי זוגי או אי-זוגי). תוספת אחרת שמספיקה: שלכל $n$, $P(n)$ גוררת את $P(n+1)$. אז עם
          $P(1)$ זו אינדוקציה רגילה, ואין צורך בגרירה הנתונה בכלל.
      - kind: result
        text: >-
          (א) כל $n$ אי-זוגי. (ב) לא נכון; $P(n)$ = "$n$ אי-זוגי" היא דוגמה נגדית. (ג) מספיק להוסיף את $P(2)$ (צעד
          של 2 צריך שני בסיסים), או לחלופין את הגרירה $P(n)\Rightarrow P(n+1)$ לכל $n$.

  - id: W-0.5-04
    level: mid
    objectives: [OBJ-0.5-1, OBJ-0.5-2]
    prompt: >-
      לכל $n$ טבעי נסמן $H_n=\frac1{n+1}+\frac1{n+2}+\dots+\frac1{2n}$ (סכום של $n$ מחוברים).

      (א) חשבו את $H_1$ ואת $H_2$.

      (ב) הוכיחו באינדוקציה ש-$H_n\ge\frac7{12}$ לכל $n\ge2$.
    answer: >-
      (א) $H_1=\frac12$, $H_2=\frac7{12}$. (ב) בסיס $n=2$; בצעד $H_{n+1}-H_n=\frac1{2n+1}-\frac1{2n+2}>0$.
    solution:
      - kind: computation
        text: '(א) $H_1=\frac12$, ו-$H_2=\frac13+\frac14=\frac7{12}$.'
      - kind: idea
        text: >-
          בשונה מסכום רגיל, במעבר מ-$H_n$ ל-$H_{n+1}$ המחובר הראשון **יוצא** ושני מחוברים **נכנסים**. נחשב את
          ההפרש $H_{n+1}-H_n$ ונראה שהוא חיובי. הבסיס הוא $n_0=2$ (משפט 0.5.11), כי $H_1=\frac12<\frac7{12}$.
      - kind: step
        text: 'בסיס: $H_2=\frac7{12}\ge\frac7{12}$.'
      - kind: step
        text: 'הנחת האינדוקציה: נניח ש-$H_n\ge\frac7{12}$ עבור $n\ge2$ מסוים.'
      - kind: computation
        text: >-
          נסמן $R=\sum_{k=n+2}^{2n}\frac1k$ (יש בו $n-1\ge1$ מחוברים, כי $n\ge2$). לפי הגדרה 0.5.5(ג) ולמה 0.5.6(ג)
          עם $m=1$ ו-$l=n-1$ (מפרידים את המחובר הראשון), $H_n=\sum_{k=n+1}^{2n}\frac1k=\frac1{n+1}+R$. ולפי הגדרה
          0.5.5(א) פעמיים (מפרידים את שני המחוברים האחרונים), $H_{n+1}=\sum_{k=n+2}^{2n+2}\frac1k=R+\frac1{2n+1}+\frac1{2n+2}$.
          כלומר לעומת $H_n$ חסר המחובר $\frac1{n+1}$ ונוספו $\frac1{2n+1}$ ו-$\frac1{2n+2}$. כיוון
          ש-$\frac1{n+1}=\frac2{2n+2}$:

          $$H_{n+1}-H_n=\frac1{2n+1}+\frac1{2n+2}-\frac2{2n+2}=\frac1{2n+1}-\frac1{2n+2}=\frac{1}{(2n+1)(2n+2)}>0.$$
      - kind: step
        text: 'לכן $H_{n+1}>H_n\ge\frac7{12}$, לפי הנחת האינדוקציה.'
      - kind: check
        text: >-
          $H_3=\frac14+\frac15+\frac16=\frac{37}{60}\approx0.617\ge\frac7{12}\approx0.583$. והבסיס חייב להיות 2:
          $H_1=\frac12$ קטן מ-$\frac7{12}$.
      - kind: result
        text: 'לפי משפט 0.5.11 עם $n_0=2$, $H_n\ge\frac7{12}$ לכל $n\ge2$.'

  - id: W-0.5-05
    level: basic
    objectives: [OBJ-0.5-1, OBJ-0.5-2]
    prompt: >-
      הוכיחו באינדוקציה: לכל $n$ טבעי, $\prod_{k=1}^{n}\left(1+\frac1k\right)=\left(1+\frac11\right)\left(1+\frac12\right)\cdots\left(1+\frac1n\right)=n+1$.
    answer: >-
      בסיס: $1+\frac11=2$. צעד: $(n+1)\left(1+\frac1{n+1}\right)=(n+1)+1=n+2$.
    solution:
      - kind: goal
        text: '$P(n)$: $\prod_{k=1}^{n}\left(1+\frac1k\right)=n+1$, לכל $n\in\mathbb{N}$.'
      - kind: idea
        text: >-
          לפי הגדרת המכפלה ברקורסיה (הגדרה 0.5.5(ב)), המכפלה עד $n+1$ היא המכפלה עד $n$ כפול הגורם הבא,
          $1+\frac1{n+1}$. את המכפלה עד $n$ מחליפים לפי ההנחה.
      - kind: step
        text: 'בסיס: עבור $n=1$, $\prod_{k=1}^{1}\left(1+\frac1k\right)=1+\frac11=2=1+1$.'
      - kind: step
        text: 'הנחת האינדוקציה: יהי $n\in\mathbb{N}$, ונניח ש-$\prod_{k=1}^{n}\left(1+\frac1k\right)=n+1$.'
      - kind: computation
        text: >-
          המטרה: $\prod_{k=1}^{n+1}\left(1+\frac1k\right)=n+2$. לפי ההגדרה, ההנחה וחוק הפילוג:

          $$\prod_{k=1}^{n+1}\left(1+\frac1k\right)=(n+1)\left(1+\frac1{n+1}\right)=(n+1)+\frac{n+1}{n+1}=n+2 .$$
      - kind: check
        text: 'עבור $n=3$: $2\cdot\frac32\cdot\frac43=4$. המכפלה "מתקפלת": כל מכנה מבטל את המונה שלפניו.'
      - kind: result
        text: 'לפי מסקנה 0.5.2, $\prod_{k=1}^{n}\left(1+\frac1k\right)=n+1$ לכל $n$ טבעי.'

  - id: W-0.5-06
    level: mid
    qualitative: true
    objectives: [OBJ-0.5-3]
    prompt: >-
      סטודנט "מוכיח" באינדוקציה ש-$1+2+\dots+n=\frac{(2n+1)^2}{8}$ לכל $n$ טבעי. בצעד הוא כותב: נניח את הטענה
      עבור $n$; אז

      $$1+\dots+n+(n+1)=\frac{(2n+1)^2}{8}+(n+1)=\frac{4n^2+12n+9}{8}=\frac{(2n+3)^2}{8},$$

      וזו הטענה עבור $n+1$.

      (א) האם הצעד נכון?

      (ב) האם הטענה נכונה? מה חסר בהוכחה?
    answer: >-
      (א) כן, הצעד נכון. (ב) הטענה שקרית לכל $n$: חסר בסיס, ועבור $n=1$ מקבלים $1\ne\frac98$.
    solution:
      - kind: idea
        text: >-
          בודקים בנפרד את הצעד ואת הבסיס. צעד נכון בלי בסיס לא מוכיח כלום, כמו הטענה $\frac{n(n+1)}{2}+1$
          בהערה 0.5.15.
      - kind: computation
        text: >-
          (א) $\frac{(2n+1)^2}{8}+(n+1)=\frac{4n^2+4n+1+8n+8}{8}=\frac{4n^2+12n+9}{8}=\frac{(2n+3)^2}{8}$, ו-$2n+3=2(n+1)+1$.
          הצעד נכון.
      - kind: step
        text: '(ב) בסיס: עבור $n=1$ אגף שמאל $1$ ואגף ימין $\frac{9}{8}$. הבסיס נכשל.'
      - kind: computation
        text: >-
          יותר מזה, הטענה שקרית לכל $n$. לפי טענה 0.5.8(א),

          $$\frac{(2n+1)^2}{8}-\frac{n(n+1)}{2}=\frac{4n^2+4n+1-4n^2-4n}{8}=\frac18,$$

          כלומר אגף ימין גדול מהסכום האמיתי ב-$\frac18$ בדיוק, לכל $n$.
      - kind: result
        text: >-
          הצעד נכון והטענה שקרית לכל $n$: חסר בסיס. בלי $n$ אחד שבו הטענה נכונה, הגרירה $P(n)\Rightarrow P(n+1)$
          לא מעבירה כלום.

  - id: W-0.5-07
    level: mid
    objectives: [OBJ-0.5-1, OBJ-0.5-2]
    prompt: >-
      הסדרה $a_1,a_2,a_3,\dots$ מוגדרת ברקורסיה: $a_1=1$, ולכל $n$ טבעי $a_{n+1}=2a_n+1$.

      (א) חשבו את $a_2,a_3,a_4,a_5$, ונחשו נוסחה ל-$a_n$.

      (ב) הוכיחו באינדוקציה את הנוסחה שניחשתם.

      (ג) הסבירו למה הסדרה מוגדרת היטב, כלומר יש סדרה אחת ויחידה כזו.
    answer: >-
      (א) $3,7,15,31$; $a_n=2^n-1$. (ב) $a_{n+1}=2(2^n-1)+1=2^{n+1}-1$. (ג) משפט 0.5.4 עם $c=1$ ו-$g_n(x)=2x+1$.
    solution:
      - kind: computation
        text: '(א) $a_2=2\cdot1+1=3$, $a_3=7$, $a_4=15$, $a_5=31$. כל אחד קטן באחד מחזקה של 2, ולכן ננחש $a_n=2^n-1$.'
      - kind: idea
        text: >-
          הכלל מחשב כל איבר מהקודם לו, ולכן ההוכחה היא אינדוקציה רגילה: מציבים את הנוסחה עבור $a_n$ בכלל, ומקבלים
          את הנוסחה עבור $a_{n+1}$. ניחוש מארבע דוגמאות אינו הוכחה (שיעור 0.4); ההוכחה באה ב-(ב).
      - kind: step
        text: '(ב) $P(n)$: $a_n=2^n-1$. בסיס: $a_1=1=2^1-1$.'
      - kind: computation
        text: >-
          הנחה: $a_n=2^n-1$ עבור $n$ מסוים. לפי הכלל, ההנחה, ו-$2\cdot2^n=2^{n+1}$ (הגדרה 0.5.5(ד)):

          $$a_{n+1}=2a_n+1=2(2^n-1)+1=2^{n+1}-2+1=2^{n+1}-1 .$$
      - kind: theorem
        text: >-
          (ג) משפט 0.5.4 (הגדרה ברקורסיה) עם $c=1$ ו-$g_n(x)=2x+1$ לכל $n$: זה כלל שמתאים לכל ממשי $x$ ממשי אחד,
          ולכן יש סדרה אחת ויחידה עם $a_1=1$ ו-$a_{n+1}=2a_n+1$.
      - kind: check
        text: '$a_5=2a_4+1=31=2^5-1$, ו-$a_6=63=2^6-1$.'
      - kind: result
        text: >-
          (א) $a_2,\dots,a_5=3,7,15,31$. (ב) לפי מסקנה 0.5.2, $a_n=2^n-1$ לכל $n$. (ג) לפי משפט 0.5.4 הסדרה קיימת
          ויחידה.

  - id: W-0.5-08
    level: exam
    qualitative: true
    objectives: [OBJ-0.5-2, OBJ-0.5-3]
    prompt: >-
      לכל $n$ טבעי נסמן $T_n=\frac12+\frac24+\frac38+\dots+\frac{n}{2^n}=\sum_{k=1}^{n}\frac{k}{2^k}$.

      (א) סטודנטית מנסה להוכיח באינדוקציה ש-$T_n<2$. היא מניחה $T_n<2$ ורוצה להסיק $T_{n+1}<2$. למה הצעד
      נתקע?

      (ב) הוכיחו באינדוקציה ש-$T_n=2-\frac{n+2}{2^n}$ לכל $n$ טבעי.

      (ג) הסיקו ש-$T_n<2$ לכל $n$.
    answer: >-
      (א) מ-$T_n<2$ נובע רק $T_{n+1}<2+\frac{n+1}{2^{n+1}}$. (ב) בצעד
      $2-\frac{n+2}{2^n}+\frac{n+1}{2^{n+1}}=2-\frac{n+3}{2^{n+1}}$. (ג) $\frac{n+2}{2^n}>0$.
    solution:
      - kind: idea
        text: >-
          ההנחה $T_n<2$ לא אומרת כמה מקום נשאר עד 2. שוויון מדויק אומר בדיוק כמה, ולכן נוח יותר להוכיח אותו,
          אף שהוא טענה חזקה יותר (הערה 0.5.14).
      - kind: step
        text: >-
          (א) $T_{n+1}=T_n+\frac{n+1}{2^{n+1}}$, ומ-$T_n<2$ נובע רק $T_{n+1}<2+\frac{n+1}{2^{n+1}}$, מספר גדול
          מ-2. אם, למשל, $T_n$ היה $1.999$, הוספה של $\frac{n+1}{2^{n+1}}$ יכלה לעבור את 2; ההנחה לבדה לא שוללת
          את זה.
      - kind: step
        text: '(ב) בסיס: $T_1=\frac12$ ו-$2-\frac{3}{2}=\frac12$.'
      - kind: step
        text: 'הנחת האינדוקציה: נניח ש-$T_n=2-\frac{n+2}{2^n}$ עבור $n$ מסוים.'
      - kind: computation
        text: >-
          לפי הגדרה 0.5.5(א), ההנחה, ו-$2^{n+1}=2\cdot2^n$:

          $$T_{n+1}=2-\frac{n+2}{2^n}+\frac{n+1}{2^{n+1}}=2-\frac{2n+4-(n+1)}{2^{n+1}}=2-\frac{n+3}{2^{n+1}},$$

          וזו בדיוק הנוסחה עבור $n+1$, כי $(n+1)+2=n+3$.
      - kind: step
        text: '(ג) $n+2>0$, ו-$2^n>0$ לפי מסקנה 0.5.7(ג), ולכן $\frac{n+2}{2^n}>0$ ו-$T_n=2-\frac{n+2}{2^n}<2$.'
      - kind: check
        text: '$T_3=\frac12+\frac24+\frac38=\frac{11}{8}$, ו-$2-\frac{5}{8}=\frac{11}{8}$.'
      - kind: result
        text: >-
          (א) ההנחה $T_n<2$ חלשה מדי. (ב) $T_n=2-\frac{n+2}{2^n}$ לכל $n$, לפי מסקנה 0.5.2. (ג) לכן $T_n<2$ לכל $n$:
          טענה חזקה יותר הייתה קלה יותר להוכחה.

  - id: W-0.5-09
    level: exam
    qualitative: true
    objectives: [OBJ-0.5-1, OBJ-0.5-2, OBJ-0.5-3]
    prompt: >-
      הסדרה מוגדרת ברקורסיה: $a_1=1$, ולכל $n$ טבעי $a_{n+1}=a_n+\frac1{a_n}$.

      (א) הוכיחו באינדוקציה ש-$a_n>0$ לכל $n$ (ובפרט שהכלל תמיד מוגדר).

      (ב) הוכיחו באינדוקציה ש-$a_n\ge\sqrt{2n-1}$ לכל $n$ טבעי, והסיקו ש-$a_{5000}>99$.

      (ג) הוכיחו או הפריכו: $a_n\ge\sqrt{2n}$ לכל $n$ טבעי.
    answer: >-
      (א) אם $a_n>0$ אז $a_n+\frac1{a_n}>0$. (ב) $a_{n+1}^2=a_n^2+2+\frac1{a_n^2}\ge2n+1$; $a_{5000}\ge\sqrt{9999}>99$.
      (ג) הפרכה: $a_1=1<\sqrt2$ (מ-$n=2$ זה כן נכון).
    solution:
      - kind: definition
        text: >-
          משפט 0.5.4 דורש כלל שמוגדר לכל ממשי $x$. נגדיר $g(x)=x+\frac1x$ כש-$x\ne0$, ו-$g(0)=0$ (הערך השני רק משלים
          את הכלל). לפי המשפט יש סדרה יחידה עם $a_1=1$ ו-$a_{n+1}=g(a_n)$. ב-(א) נראה ש-$a_n>0$ לכל $n$, ולכן תמיד
          $a_{n+1}=a_n+\frac1{a_n}$: זו הסדרה שבשאלה.
      - kind: idea
        text: >-
          את $a_n$ קשה לחשב, אבל את $a_n^2$ קל לעקוב: בכל צעד הריבוע גדל ביותר מ-2, ולכן $a_n^2\ge1+2(n-1)=2n-1$.
          מוכיחים את אי-השוויון על הריבועים, ואז מוציאים שורש.
      - kind: step
        text: >-
          (א) בסיס: $a_1=1>0$. צעד: אם $a_n>0$, אז $\frac1{a_n}>0$ (מסקנה 0.1.9(2)), ולכן
          $a_{n+1}=a_n+\frac1{a_n}>0$. לפי מסקנה 0.5.2, $a_n>0$ לכל $n$.
      - kind: step
        text: >-
          (ב) נוכיח את $Q(n)$: $a_n^2\ge2n-1$. בסיס: $a_1^2=1=2\cdot1-1$.
      - kind: computation
        text: >-
          הנחה: $a_n^2\ge2n-1$ עבור $n$ מסוים. לפי הכלל, $a_{n+1}^2=\left(a_n+\frac1{a_n}\right)^2=a_n^2+2+\frac1{a_n^2}$,
          ו-$\frac1{a_n^2}>0$ (מסקנה 0.1.9(2), כי $a_n^2>0$). לכן

          $$a_{n+1}^2\ >\ a_n^2+2\ \ge\ (2n-1)+2=2(n+1)-1 ,$$

          וזו $Q(n+1)$. לפי מסקנה 0.5.2, $Q(n)$ נכונה לכל $n$.
      - kind: step
        text: >-
          מהריבועים לשורש: לממשיים $u,v\ge0$, אם $u^2\ge v^2$ אז $u\ge v$ (הקונטרפוזיטיב של "$u<v$ גורר
          $u^2<v^2$", כמו בדוגמה 4). עם $u=a_n>0$ ו-$v=\sqrt{2n-1}\ge0$: $a_n\ge\sqrt{2n-1}$. עבור $n=5000$:
          $a_{5000}^2\ge9999>9801=99^2$, ולכן $a_{5000}>99$: אחרת $a_{5000}\le99$, וכפל ב-$a_{5000}>0$ וב-$99>0$
          (עובדה (ב)) נותן $a_{5000}^2\le99\,a_{5000}\le99^2$, בסתירה.
      - kind: step
        text: >-
          (ג) הטענה שקרית: עבור $n=1$, $a_1=1$, ואילו $\sqrt2>1$ (כי $1^2=1<2$). דוגמה נגדית אחת מספיקה. שימו לב
          שהצעד של (ב) עובד גם כאן: אם $a_n^2\ge2n$ אז $a_{n+1}^2>2n+2$. רק הבסיס $n=1$ נכשל; מבסיס $n_0=2$
          ($a_2=2=\sqrt4$) משפט 0.5.11 נותן $a_n\ge\sqrt{2n}$ לכל $n\ge2$.
      - kind: check
        text: '$a_2=2$, $a_3=2.5$, $a_4=2.9$: וגם $a_4^2=8.41\ge7$. ובחישוב, $a_n^2\ge2n-1$ לכל $n\le5000$.'
      - kind: result
        text: >-
          (א) $a_n>0$. (ב) $a_n\ge\sqrt{2n-1}$ לכל $n$, ובפרט $a_{5000}>99$. (ג) שקרית: $a_1=1<\sqrt2$; היא נכונה רק
          מ-$n=2$.

  - id: W-0.5-10
    level: exam
    objectives: [OBJ-0.5-1, OBJ-0.5-2]
    prompt: >-
      המספרים $a_1,a_2,a_3,\dots$ מוגדרים ברקורסיה: $a_1=1$, ולכל $n$ טבעי $a_{n+1}=\sqrt{2+a_n}$.

      (א) הוכיחו באינדוקציה ש-$0<a_n<2$ לכל $n$ (ובפרט שהשורש תמיד מוגדר).

      (ב) הוכיחו באינדוקציה ש-$a_n<a_{n+1}$ לכל $n$.
    answer: >-
      (א) אם $0<a_n<2$ אז $2<2+a_n<4$, ולכן $0<a_{n+1}<2$. (ב) $a_1=1<\sqrt3=a_2$, ואם $a_n<a_{n+1}$ אז
      $\sqrt{2+a_n}<\sqrt{2+a_{n+1}}$.
    solution:
      - kind: idea
        text: >-
          הכלל "מוסיפים 2 ולוקחים שורש" מוגדר רק למספרים $x\ge-2$, ולכן מוכיחים ש-$a_n>0$: אז $2+a_n>0$
          והשורש מוגדר. כל תכונה של $a_n$ עוברת ל-$a_{n+1}$ דרך הכלל, ששומר על הסדר.
      - kind: definition
        text: >-
          שורש שומר על הסדר: לממשיים $u,v\ge0$, אם $u<v$ אז $\sqrt u<\sqrt v$. אחרת, לפי עובדה מקובלת (ב),
          $\sqrt v\le\sqrt u$. כופלים את אי-השוויון הזה פעמיים, כל פעם במספר אי-שלילי אחד (עובדה (ב) למספר חיובי;
          במספר 0 שני האגפים הופכים ל-0): ב-$\sqrt v\ge0$ מקבלים $v=\sqrt v\sqrt v\le\sqrt v\sqrt u$, וב-$\sqrt u\ge0$
          מקבלים $\sqrt v\sqrt u\le\sqrt u\sqrt u=u$. לפי המעבר (עובדה (ב)), $v\le u$, בסתירה ל-$u<v$. (עובדה (ה):
          $\sqrt u$ מוגדר, $\sqrt u\ge0$ ו-$(\sqrt u)^2=u$.)
      - kind: definition
        text: >-
          משפט 0.5.4 דורש כלל שמוגדר לכל ממשי $x$. נגדיר $g(x)=\sqrt{2+x}$ כש-$x\ge-2$, ו-$g(x)=0$ כש-$x<-2$ (הערך
          השני רק משלים את הכלל). לפי המשפט יש סדרה יחידה עם $a_1=1$ ו-$a_{n+1}=g(a_n)$. ב-(א) נראה ש-$a_n>0$ לכל
          $n$, ולכן תמיד $a_{n+1}=\sqrt{2+a_n}$: זו הסדרה שבשאלה, והענף השני אף פעם לא בשימוש.
      - kind: step
        text: >-
          (א) $P(n)$: $0<a_n<2$. בסיס: $a_1=1$, ו-$0<1<2$.
      - kind: computation
        text: >-
          הנחה: $P(n)$ עבור $n$ מסוים. אז $a_n>0>-2$, ולכן $a_{n+1}=g(a_n)=\sqrt{2+a_n}$, ו-$2<2+a_n<4$. לפי שמירת
          הסדר, $\sqrt2<\sqrt{2+a_n}<\sqrt4=2$, ו-$\sqrt2>\sqrt0=0$. כלומר $0<a_{n+1}<2$. לפי מסקנה 0.5.2, $P(n)$
          נכונה לכל $n$.
      - kind: step
        text: '(ב) הטענה היא $Q(n)$: $a_n<a_{n+1}$. בסיס: $a_2=\sqrt{2+1}=\sqrt3>\sqrt1=1=a_1$.'
      - kind: computation
        text: >-
          הנחה: $a_n<a_{n+1}$ עבור $n$ מסוים. המטרה: $a_{n+1}<a_{n+2}$. מההנחה $2+a_n<2+a_{n+1}$, ושני האגפים
          חיוביים לפי (א), ולכן לפי שמירת הסדר $\sqrt{2+a_n}<\sqrt{2+a_{n+1}}$, כלומר $a_{n+1}<a_{n+2}$.
      - kind: check
        text: '$a_3=\sqrt{2+\sqrt3}\approx1.932$, $a_4\approx1.983$, $a_5\approx1.996$: עולים, ומתחת ל-2.'
      - kind: result
        text: 'לפי מסקנה 0.5.2: $0<a_n<2$ ו-$a_n<a_{n+1}$ לכל $n$ טבעי.'

challenge:
  - id: W-0.5-c1
    stars: 1
    objectives: [OBJ-0.5-2]
    prompt: >-
      (א) הוכיחו באינדוקציה שלכל $n$ טבעי

      $$\sum_{k=1}^{2^n}\frac1k=1+\frac12+\frac13+\dots+\frac1{2^n}\ge1+\frac n2 .$$

      (הסכום הוא על כל $k$ מ-1 עד $2^n$; למשל עבור $n=1$ הוא $1+\frac12$, ועבור $n=2$ הוא $1+\frac12+\frac13+\frac14$.)

      (ב) הסיקו שיש מספר טבעי $m$ כך ש-$1+\frac12+\dots+\frac1m\ge 11$, ומצאו $m$ כזה.
    answer: >-
      (א) בצעד מוסיפים $2^n$ מחוברים, כל אחד לפחות $\frac1{2^{n+1}}$, ולכן לפחות $\frac12$. (ב) $n=20$:
      $m=2^{20}=1048576$.
    solution:
      - kind: idea
        text: >-
          במעבר מ-$2^n$ ל-$2^{n+1}$ נוספים המחוברים $\frac1{2^n+1},\dots,\frac1{2^{n+1}}$: יש $2^n$ כאלה, והקטן
          שבהם הוא $\frac1{2^{n+1}}$. לכן הם מוסיפים יחד לפחות $2^n\cdot\frac1{2^{n+1}}=\frac12$.
      - kind: step
        text: 'בסיס: עבור $n=1$ אגף שמאל הוא $1+\frac12=\frac32$, ואגף ימין $1+\frac12=\frac32$.'
      - kind: step
        text: 'הנחת האינדוקציה: נניח ש-$\sum_{k=1}^{2^n}\frac1k\ge1+\frac n2$ עבור $n$ מסוים.'
      - kind: computation
        text: >-
          לפי למה 0.5.6(ג) עם $m=2^n$ ו-$l=2^n$ (כי $2^{n+1}=2^n+2^n$):

          $$\sum_{k=1}^{2^{n+1}}\frac1k=\sum_{k=1}^{2^n}\frac1k+\sum_{k=2^n+1}^{2^{n+1}}\frac1k\ \ge\ 1+\frac n2+2^n\cdot\frac1{2^{n+1}}=1+\frac{n+1}2 .$$

          בסכום השני יש $2^{n+1}-2^n=2^n$ מחוברים, וכל אחד מהם לפחות $\frac1{2^{n+1}}$, כי $0<k\le2^{n+1}$ (כופלים את
          $k\le2^{n+1}$ במספר החיובי $\frac1{k\cdot2^{n+1}}$, לפי מסקנה 0.1.9(2) ועובדה מקובלת (ב)).
      - kind: step
        text: >-
          למה הסכום השני לפחות $2^n\cdot\frac1{2^{n+1}}$: סכום של $N$ מחוברים $b_1,\dots,b_N$ שכל אחד מהם לפחות $c$
          הוא לפחות $N\cdot c$. באינדוקציה על $N$: עבור $N=1$, $b_1\ge c$. ואם $\sum_{j=1}^{N}b_j\ge Nc$, אז לפי הגדרה
          0.5.5(א) $\sum_{j=1}^{N+1}b_j=\sum_{j=1}^{N}b_j+b_{N+1}\ge Nc+b_{N+1}\ge Nc+c=(N+1)c$ (מוסיפים לשני האגפים,
          עובדה (ב), פעמיים, ואז המעבר). כאן, לפי הגדרה 0.5.5(ג), הסכום השני הוא $\sum_{j=1}^{2^n}\frac1{2^n+j}$, עם
          $N=2^n$ ו-$c=\frac1{2^{n+1}}$.
      - kind: step
        text: >-
          (ב) עם $n=20$: $1+\frac{20}2=11$, ולכן $m=2^{20}=1048576$ מתאים. (כלומר הסכומים $1+\frac12+\dots+\frac1m$
          עוברים כל מספר שבוחרים מראש, אם רק לוקחים מספיק מחוברים; בפרק 2 נראה את המשמעות של זה.)
      - kind: check
        text: '$n=2$: $1+\frac12+\frac13+\frac14=\frac{25}{12}\approx2.083\ge2$.'
      - kind: result
        text: >-
          (א) $\sum_{k=1}^{2^n}\frac1k\ge1+\frac n2$ לכל $n$. (ב) $m=2^{20}$ נותן סכום של לפחות 11.
    source:
      name: 'Richard Hammack, Book of Proof, third edition (edition 3.4)'
      year: 2018
      problem: 'Chapter 10, Exercise 21'
      url: 'https://richardhammack.github.io/BookOfProof/Main.pdf'
      verified: '2026-11-09'
      adapted: true

  - id: W-0.5-c2
    stars: 1
    objectives: [OBJ-0.5-2]
    prompt: >-
      (א) הוכיחו באינדוקציה שלכל $n$ טבעי

      $$\left(1-\frac12\right)\left(1-\frac14\right)\left(1-\frac18\right)\cdots\left(1-\frac1{2^n}\right)\ \ge\ \frac14+\frac1{2^{n+1}} .$$

      (ב) הסיקו שהמכפלה גדולה מ-$\frac14$ לכל $n$. למה נוח יותר להוכיח את (א) מאשר להוכיח באינדוקציה ישירות
      שהמכפלה גדולה מ-$\frac14$?
    answer: >-
      (א) בצעד: $\left(\frac14+\frac1{2^{n+1}}\right)\left(1-\frac1{2^{n+1}}\right)-\left(\frac14+\frac1{2^{n+2}}\right)=\frac1{2^{n+3}}-\frac1{2^{2n+2}}\ge0$.
      (ב) $\frac1{2^{n+1}}>0$; מההנחה "גדולה מ-$\frac14$" לבד, כפל ב-$1-\frac1{2^{n+1}}<1$ מקטין, והצעד נתקע.
    solution:
      - kind: idea
        text: >-
          נסמן $q_n$ את המכפלה. לפי הגדרה 0.5.5(ב), $q_{n+1}=q_n\left(1-\frac1{2^{n+1}}\right)$, והגורם החדש קטן
          מ-1, ולכן המכפלה קטנה בכל צעד. החסם $\frac14+\frac1{2^{n+1}}$ קטן גם הוא, ושומר מרווח שמספיק לגורם הבא.
      - kind: step
        text: 'בסיס: $q_1=\frac12$ ו-$\frac14+\frac14=\frac12$.'
      - kind: step
        text: 'הנחת האינדוקציה: נניח ש-$q_n\ge\frac14+\frac1{2^{n+1}}$ עבור $n$ מסוים.'
      - kind: computation
        text: >-
          $1-\frac1{2^{n+1}}>0$, ולכן הכפל שומר על הכיוון:

          $$q_{n+1}\ge\left(\frac14+\frac1{2^{n+1}}\right)\left(1-\frac1{2^{n+1}}\right)=\frac14+\frac1{2^{n+1}}-\frac1{2^{n+3}}-\frac1{2^{2n+2}} .$$
      - kind: computation
        text: >-
          צריך שזה יהיה לפחות $\frac14+\frac1{2^{n+2}}$. נחסר: נשאר
          $\frac1{2^{n+1}}-\frac1{2^{n+2}}-\frac1{2^{n+3}}-\frac1{2^{2n+2}}=\frac{4-2-1}{2^{n+3}}-\frac1{2^{2n+2}}=\frac1{2^{n+3}}-\frac1{2^{2n+2}}$,
          וזה אי-שלילי. ראשית, $2^m\ge1$ לכל שלם $m\ge0$, באינדוקציה מבסיס 0 (משפט 0.5.11): $2^0=1$, ואם $2^m\ge1$
          אז $2^{m+1}=2\cdot2^m\ge2>1$. לכן, עם $m=n-1\ge0$ ו-$2^{n+3}>0$ (מסקנה 0.5.7(ג)), לפי מסקנה 0.5.7(א)
          $2^{2n+2}=2^{n+3}\cdot2^{n-1}\ge2^{n+3}\cdot1=2^{n+3}$. כופלים את $2^{2n+2}\ge2^{n+3}$ במספר החיובי
          $\frac1{2^{2n+2}\cdot2^{n+3}}$ (מסקנה 0.1.9(2) ועובדה מקובלת (ב)) ומקבלים $\frac1{2^{n+3}}\ge\frac1{2^{2n+2}}$.
      - kind: step
        text: >-
          (ב) $\frac1{2^{n+1}}>0$, ולכן $q_n>\frac14$. מההנחה $q_n>\frac14$ לבד אי אפשר להסיק $q_{n+1}>\frac14$: הכפל
          ב-$1-\frac1{2^{n+1}}$ מקטין, ו-$\frac14\left(1-\frac1{2^{n+1}}\right)<\frac14$. הטענה החזקה שומרת מרווח
          $\frac1{2^{n+1}}$ מעל $\frac14$.
      - kind: check
        text: '$q_3=\frac12\cdot\frac34\cdot\frac78=\frac{21}{64}\approx0.328$, ו-$\frac14+\frac1{16}=0.3125$.'
      - kind: result
        text: >-
          (א) $q_n\ge\frac14+\frac1{2^{n+1}}$ לכל $n$. (ב) לכן $q_n>\frac14$; את הטענה החלשה קשה להוכיח ישירות כי
          ההנחה שלה לא שומרת מרווח.
    source:
      name: 'Richard Hammack, Book of Proof, third edition (edition 3.4)'
      year: 2018
      problem: 'Chapter 10, Exercise 22'
      url: 'https://richardhammack.github.io/BookOfProof/Main.pdf'
      verified: '2026-11-09'
      adapted: true
