# Workbook of lesson 0.6 — strong induction, well-ordering, Bernoulli's inequality, the binomial theorem.
# Objectives (src/course.ts):
#   OBJ-0.6-1  prove by strong induction; use the well-ordering principle and its equivalence to induction
#   OBJ-0.6-2  prove and use Bernoulli's inequality; show by a counterexample that the hypothesis on x is needed
#   OBJ-0.6-3  prove Pascal's identity and the binomial theorem, and use them
# W-0.6-01, 04 and 08 came from lesson 0.5's workbook (W-0.5-05, 07, 09). Every number below was recomputed
# (tests/math/induction.test.ts and npx tsx one-liners). Numbered results 0.5.x and 0.6.x are those of lessons 0.5 and 0.6.
lesson: '0.6'
practice:
  - id: W-0.6-01
    level: basic
    objectives: [OBJ-0.6-2]
    prompt: >-
      (א) הוכיחו בעזרת אי-שוויון ברנולי: לכל $n$ טבעי, $\left(1-\frac1{2n}\right)^n\ge\frac12$.

      (ב) הסיקו ש-$(0.99)^{50}\ge\frac12$, בלי לחשב את החזקה.
    answer: >-
      (א) ברנולי עם $x=-\frac1{2n}\ge-1$ נותן $\ge1-\frac n{2n}=\frac12$. (ב) $n=50$ נותן $1-\frac1{100}=0.99$.
    solution:
      - kind: theorem
        text: 'משפט 0.6.6 (ברנולי): לכל $x\ge-1$ ולכל $n$ טבעי, $(1+x)^n\ge1+nx$.'
      - kind: idea
        text: >-
          הביטוי הוא $(1+x)^n$ עם $x=-\frac1{2n}$. המשפט נכון לכל זוג של $x\ge-1$ ו-$n$ טבעי, ולכן מותר לבחור
          $x$ שתלוי ב-$n$: לכל $n$ מציבים את ה-$x$ שלו. צריך רק לוודא את התנאי $x\ge-1$.
      - kind: step
        text: >-
          (א) יהי $n$ טבעי ו-$x=-\frac1{2n}$. כיוון ש-$2n\ge2$, מתקיים $\frac1{2n}\le\frac12$, ולכן $x\ge-\frac12\ge-1$.
          התנאי של ברנולי מתקיים.
      - kind: computation
        text: '$$\left(1-\frac1{2n}\right)^n=(1+x)^n\ge1+nx=1-\frac{n}{2n}=\frac12.$$'
      - kind: step
        text: '(ב) עבור $n=50$: $1-\frac1{100}=0.99$, ולכן לפי (א) $(0.99)^{50}\ge\frac12$.'
      - kind: check
        text: >-
          הערך האמיתי $(0.99)^{50}\approx0.605$, גדול מ-$\frac12$ כמו שצריך. ועבור $n=1$ יש שוויון:
          $\left(1-\frac12\right)^1=\frac12$, כצפוי מתנאי השוויון במשפט ($n=1$).
      - kind: result
        text: '(א) $\left(1-\frac1{2n}\right)^n\ge\frac12$ לכל $n$. (ב) $(0.99)^{50}\ge\frac12$.'

  - id: W-0.6-02
    level: basic
    objectives: [OBJ-0.6-3]
    prompt: >-
      (א) הוכיחו בעזרת הבינום של ניוטון: לכל $n$ טבעי, $\sum_{k=0}^{n}(-1)^k\binom nk=0$.

      (ב) חשבו את $\sum_{k=0}^{n}\binom nk2^k$ לכל $n$ טבעי.
    answer: >-
      (א) $a=1$, $b=-1$: $(1-1)^n=0^n=0$. (ב) $a=1$, $b=2$: $3^n$.
    solution:
      - kind: theorem
        text: 'משפט 0.6.11: לכל $a,b$ ממשיים ולכל $n\in\mathbb{N}$, $(a+b)^n=\sum_{k=0}^{n}\binom nk a^{n-k}b^k$.'
      - kind: idea
        text: >-
          כל סכום כזה הוא פיתוח של חזקה של סכום, אם רק בוחרים נכון את $a$ ואת $b$. כש-$a=1$, כל החזקות של $a$ הן 1,
          ונשארות רק החזקות של $b$.
      - kind: step
        text: >-
          (א) יהי $n\in\mathbb{N}$. נציב $a=1$ ו-$b=-1$. לפי מסקנה 0.5.7(ד), $1^{n-k}=1$, ולכן אגף ימין הוא
          $\sum_{k=0}^{n}\binom nk(-1)^k$. אגף שמאל הוא $(1+(-1))^n=0^n$.
      - kind: step
        text: >-
          $0^n=0$ לכל $n\in\mathbb{N}$, באינדוקציה: $0^1=0$, ואם $0^n=0$ אז $0^{n+1}=0^n\cdot0=0$ (הגדרה 0.5.5(ד)).
          כאן משתמשים ב-$n\ge1$: עבור $n=0$, $0^0=1$, והסכום הוא $\binom00=1$.
      - kind: step
        text: '(ב) נציב $a=1$ ו-$b=2$: $\sum_{k=0}^{n}\binom nk2^k=(1+2)^n=3^n$.'
      - kind: check
        text: >-
          עבור $n=2$: $1-2+1=0$, ו-$1+2\cdot2+1\cdot4=9=3^2$. עבור $n=3$: $1-3+3-1=0$, ו-$1+6+12+8=27$.
      - kind: result
        text: '(א) $\sum_{k=0}^{n}(-1)^k\binom nk=0$ לכל $n\in\mathbb{N}$. (ב) $\sum_{k=0}^{n}\binom nk2^k=3^n$.'

  - id: W-0.6-03
    level: basic
    objectives: [OBJ-0.6-1]
    prompt: >-
      הוכיחו באינדוקציה שלמה: כל מספר טבעי $n$ אפשר לכתוב בצורה $n=2^m\cdot q$, כאשר $m\ge0$ שלם ו-$q$ מספר טבעי
      אי-זוגי.
    answer: >-
      אם $n$ אי-זוגי, $m=0$ ו-$q=n$. אם $n$ זוגי, $n=2k$ עם $1\le k<n$, ולפי ההנחה $k=2^mq$, ולכן $n=2^{m+1}q$.
    solution:
      - kind: theorem
        text: >-
          משפט 0.6.1 (אינדוקציה שלמה) עם $n_0=1$: אם לכל $n\in\mathbb{N}$, מכך ש-$P(k)$ נכונה לכל טבעי $k<n$ נובעת
          $P(n)$, אז $P(n)$ נכונה לכל $n$.
      - kind: idea
        text: >-
          מספר זוגי הוא פעמיים מספר **קטן ממנו**, אבל לא בהכרח $n-1$; לכן צריך את ההנחה על כל המספרים הקטנים מ-$n$.
          מספר אי-זוגי כבר בצורה הרצויה, עם $m=0$.
      - kind: step
        text: >-
          $P(n)$: יש שלם $m\ge0$ וטבעי אי-זוגי $q$ עם $n=2^mq$. יהי $n\in\mathbb{N}$, ונניח ש-$P(k)$ נכונה לכל
          $k\in\mathbb{N}$ עם $k<n$. לפי החלוקה עם שארית (עובדה מקובלת (ג)), $n$ זוגי או אי-זוגי.
      - kind: step
        text: '**$n$ אי-זוגי:** $m=0$ ו-$q=n$: $2^0\cdot n=n$ (הגדרה 0.5.5(ד)). ההנחה לא נדרשה; כך גם עבור $n=1$.'
      - kind: step
        text: >-
          **$n$ זוגי:** $n=2k$ עם $k$ שלם. $k>0$, כי אחרת $2k\le0$ (עובדה מקובלת (ב)); לכן $k\in\mathbb{N}$, ו-$k<k+k=n$.
          לפי ההנחה, $k=2^mq$ עם $m\ge0$ ו-$q$ אי-זוגי. אז $n=2\cdot2^mq=2^{m+1}q$ (הגדרה 0.5.5(ד)), עם $m+1\ge0$.
      - kind: check
        text: '$12=2^2\cdot3$, $40=2^3\cdot5$, $7=2^0\cdot7$, $64=2^6\cdot1$.'
      - kind: result
        text: 'לפי משפט 0.6.1, כל $n\in\mathbb{N}$ הוא $2^mq$ עם $m\ge0$ שלם ו-$q$ אי-זוגי.'

  - id: W-0.6-04
    level: mid
    objectives: [OBJ-0.6-1]
    prompt: >-
      (א) הוכיחו באינדוקציה שלמה: כל שלם $n\ge8$ אפשר לכתוב בצורה $n=3a+5b$ עם שלמים $a,b\ge0$.

      (ב) הראו שאת $7$ אי אפשר לכתוב כך.

      (ג) סטודנטית כתבה בצעד: "לפי ההנחה $n-3=3a+5b$, ולכן $n=3(a+1)+5b$", ולא בדקה אף מקרה בנפרד. לאילו $n$
      הנימוק הזה אינו תקף, ולמה?
    answer: >-
      (א) $8=3+5$, $9=3\cdot3$, $10=5\cdot2$; ולכל $n\ge11$, $n-3\ge8$ ו-$n=3(a+1)+5b$. (ב) $7-5b$ הוא $7$ או $2$, ואף
      אחד מהם אינו כפולה של 3. (ג) עבור $n=8,9,10$: שם $n-3<8$, וההנחה לא חלה עליו.
    solution:
      - kind: theorem
        text: >-
          משפט 0.6.1 (אינדוקציה שלמה) עם $n_0=8$: אם לכל $n\ge8$, מכך ש-$P(k)$ נכונה לכל $8\le k<n$ נובעת $P(n)$, אז
          $P(n)$ נכונה לכל $n\ge8$.
      - kind: idea
        text: >-
          מוסיפים 3 לייצוג של $n-3$. זה דורש את הטענה עבור $n-3$, לא עבור $n-1$: לכן אינדוקציה שלמה. והנימוק עובד רק
          כש-$n-3$ הוא עצמו לפחות 8, כלומר מ-$n=11$; את 8, 9 ו-10 מוכיחים ישירות.
      - kind: step
        text: >-
          (א) $P(n)$: יש שלמים $a,b\ge0$ עם $n=3a+5b$. יהי $n\ge8$ שלם, ונניח ש-$P(k)$ נכונה לכל שלם $8\le k<n$.
      - kind: step
        text: >-
          מקרה $n\in\{8,9,10\}$: $8=3\cdot1+5\cdot1$, $9=3\cdot3+5\cdot0$, $10=3\cdot0+5\cdot2$. כאן לא נדרשה ההנחה.
      - kind: step
        text: >-
          מקרה $n\ge11$: $k=n-3$ שלם עם $8\le k<n$, ולכן לפי ההנחה $n-3=3a+5b$ עם $a,b\ge0$ שלמים. אז
          $n=3(a+1)+5b$, ו-$a+1\ge0$, $b\ge0$ שלמים (עובדה מקובלת (א)). זו $P(n)$.
      - kind: step
        text: >-
          (ב) אם $7=3a+5b$ עם $a,b\ge0$, אז $5b\le7$, ולכן $b\in\{0,1\}$. עם $b=0$: $3a=7$, אבל $7=3\cdot2+1$, ולפי
          יחידות החלוקה עם שארית (עובדה מקובלת (ג)) 7 אינו כפולה של 3. עם $b=1$: $3a=2$, ו-$2=3\cdot0+2$, שוב שארית
          שאינה 0. סתירה.
      - kind: step
        text: >-
          (ג) עבור $n=8,9,10$ המספר $n-3$ הוא $5,6,7$, קטן מ-8, וההנחה של משפט 0.6.1 (עם $n_0=8$) לא אומרת עליו
          דבר. ואכן, לפי (ב), 7 אינו מהצורה הזו, ולכן עבור $n=10$ הנימוק נשען על טענה שקרית. לכן חייבים להוכיח את
          8, 9 ו-10 בנפרד: שלושה "בסיסים", כי הצעד קופץ ב-3.
      - kind: check
        text: '$11=3\cdot2+5\cdot1$, $12=3\cdot4$, $13=3\cdot1+5\cdot2$; ולפי חישוב, כל $8\le n\le500$ מהצורה הזו.'
      - kind: result
        text: >-
          (א) לפי משפט 0.6.1, כל $n\ge8$ הוא $3a+5b$ עם $a,b\ge0$ שלמים. (ב) 7 אינו כזה, ולכן 8 הוא הקטן ביותר שממנו
          הטענה נכונה. (ג) הנימוק אינו תקף ל-$n=8,9,10$, שם $n-3<8$.

  - id: W-0.6-05
    level: mid
    qualitative: true
    objectives: [OBJ-0.6-1]
    prompt: >-
      (א) יהי $c$ שלם, ותהי $A$ קבוצה לא ריקה של מספרים שלמים, שכל איבר שלה גדול מ-$c$ או שווה לו. הוכיחו שיש ל-$A$
      איבר קטן ביותר.

      (ב) הפריכו: "לכל קבוצה לא ריקה של מספרים ממשיים חיוביים יש איבר קטן ביותר."

      (ג) לכל אחד מהתנאים "שלמים" ו"חסומים מלרע על ידי $c$" שב-(א), תנו קבוצה לא ריקה שמקיימת רק את התנאי האחר ואין
      לה איבר קטן ביותר.
    answer: >-
      (א) מזיזים: הקבוצה $B$ של המספרים $a-c+1$, $a\in A$, היא קבוצה לא ריקה של טבעיים; האיבר הקטן ביותר שלה
      מגיע מהאיבר הקטן ביותר של $A$. (ב) לכל $x>0$ גם $\frac x2>0$ וקטן ממנו. (ג) $\mathbb{Z}$ (שלמים, לא חסומים);
      המספרים $\frac1n$ (חסומים מלרע על ידי 0, לא שלמים).
    solution:
      - kind: idea
        text: >-
          עקרון הסדר הטוב (משפט 0.6.3) הוא על קבוצות של טבעיים. מזיזים את $A$ כך שהיא תתחיל ב-1 לכל המוקדם, מפעילים
          את המשפט, ומזיזים בחזרה. ההזזה שומרת על הסדר, ולכן האיבר הקטן ביותר עובר לאיבר הקטן ביותר.
      - kind: step
        text: >-
          (א) תהי $B$ קבוצת המספרים $a-c+1$, עבור $a\in A$. כל איבר כזה שלם (עובדה מקובלת (א)), ו-$a-c+1\ge1$ כי
          $a\ge c$. לכן $B\subseteq\mathbb{N}$, ו-$B$ לא ריקה כי $A$ לא ריקה.
      - kind: step
        text: >-
          לפי משפט 0.6.3 יש ל-$B$ איבר קטן ביותר, $b_0=a_0-c+1$ עם $a_0\in A$. יהי $a\in A$. אז $a-c+1\in B$, ולכן
          $a-c+1\ge a_0-c+1$; נוסיף $c-1$ לשני האגפים (עובדה (ב)): $a\ge a_0$. לכן $a_0$ איבר קטן ביותר של $A$.
      - kind: step
        text: >-
          (ב) תהי $P$ קבוצת כל הממשיים החיוביים; היא לא ריקה ($1\in P$). יהי $x\in P$. אז $\frac x2>0$, כלומר
          $\frac x2\in P$, ו-$\frac x2<x$ (כי $x-\frac x2=\frac x2>0$). לכן אף $x\in P$ אינו איבר קטן ביותר.
      - kind: step
        text: >-
          (ג) $\mathbb{Z}$ היא קבוצה של שלמים בלי חסם מלרע, ואין לה איבר קטן ביותר ($m-1<m$). קבוצת המספרים $\frac1n$,
          $n\in\mathbb{N}$, חסומה מלרע על ידי $c=0$ אבל אינה קבוצה של שלמים, ואין לה איבר קטן ביותר (הערה 0.6.4).
      - kind: check
        text: >-
          $A=\{-3,0,7\}$ עם $c=-5$: $B=\{3,6,13\}$, האיבר הקטן ביותר 3 מגיע מ-$a_0=-3$, והוא אכן האיבר הקטן ביותר
          של $A$.
      - kind: result
        text: >-
          (א) לכל קבוצה לא ריקה של שלמים החסומה מלרע על ידי שלם יש איבר קטן ביותר. (ב) שקרית: לממשיים החיוביים אין
          איבר קטן ביותר. (ג) שני התנאים דרושים: $\mathbb{Z}$, והמספרים $\frac1n$.

  - id: W-0.6-06
    level: mid
    qualitative: true
    objectives: [OBJ-0.6-2]
    prompt: >-
      (א) הוכיחו: לכל $n$ טבעי, $\left(1+\frac1n\right)^n\ge2$.

      (ב) הוכיחו: לכל שלם $n\ge2$, $\left(1-\frac1{n^2}\right)^n>1-\frac1n$.

      (ג) הוכיחו או הפריכו: לכל שלם $n\ge2$, $\left(1+\frac1n\right)^n\ge3$.
    answer: >-
      (א) ברנולי עם $x=\frac1n$. (ב) ברנולי החזק עם $x=-\frac1{n^2}$. (ג) הפרכה: $n=2$ נותן $\frac94<3$.
    solution:
      - kind: theorem
        text: >-
          משפט 0.6.6: לכל $x\ge-1$ ולכל $n$ טבעי $(1+x)^n\ge1+nx$; ואם $x\ne0$ ו-$n\ge2$, אז $(1+x)^n>1+nx$.
      - kind: idea
        text: >-
          המשפט נכון לכל זוג של $x\ge-1$ ו-$n$, ולכן מותר לבחור $x$ שתלוי ב-$n$. בכל חלק בודקים את התנאי על $x$,
          ומציבים.
      - kind: step
        text: >-
          (א) יהי $n\in\mathbb{N}$ ו-$x=\frac1n>0\ge-1$. לפי משפט 0.6.6(א),
          $\left(1+\frac1n\right)^n\ge1+n\cdot\frac1n=2$.
      - kind: step
        text: >-
          (ב) יהי $n\ge2$ ו-$x=-\frac1{n^2}$. $n^2\ge1$, ולכן $\frac1{n^2}\le1$ ו-$x\ge-1$; וגם $x\ne0$. לפי משפט 0.6.6(ב),
          $\left(1-\frac1{n^2}\right)^n>1-\frac{n}{n^2}=1-\frac1n$.
      - kind: computation
        text: >-
          (ג) הטענה שקרית: עבור $n=2$, $\left(1+\frac12\right)^2=\frac94=2.25<3$. ברנולי נותן חסם **מלמטה**, ו-(א)
          לא אומר דבר על כמה גדול הביטוי יכול להיות. (בתרגיל W-0.6-09 תוכיחו שהוא תמיד קטן מ-3.)
      - kind: check
        text: >-
          $n=3$: $\left(\frac43\right)^3\approx2.370\ge2$, ו-$\left(\frac89\right)^3\approx0.702>\frac23$.
      - kind: result
        text: >-
          (א) $\left(1+\frac1n\right)^n\ge2$. (ב) $\left(1-\frac1{n^2}\right)^n>1-\frac1n$ לכל $n\ge2$. (ג) שקרית: עם
          $n=2$ הערך $2.25$.

  - id: W-0.6-07
    level: mid
    objectives: [OBJ-0.6-3]
    prompt: >-
      (א) הוכיחו בעזרת הבינום: לכל שלם $n\ge2$ ולכל $x\ge0$, $(1+x)^n\ge\frac{n(n-1)}{2}x^2$.

      (ב) הסיקו: לכל שלם $n\ge2$, $2^n\ge\frac{n^2}{4}$.
    answer: >-
      (א) משמיטים מהפיתוח את כל המחוברים פרט ל-$k=2$, כולם אי-שליליים. (ב) $x=1$, ו-$\frac{n(n-1)}{2}\ge\frac{n^2}4$
      כש-$n\ge2$.
    solution:
      - kind: idea
        text: >-
          כשכל המחוברים של סכום אי-שליליים, הסכום גדול מכל אחד מהם או שווה לו. בפיתוח של $(1+x)^n$ עם $x\ge0$ כל
          המחוברים אי-שליליים, ולכן כל אחד מהם הוא חסם מלמטה.
      - kind: step
        text: >-
          (א) יהי $n\ge2$ ו-$x\ge0$. לפי משפט 0.6.11 עם $a=1$, $b=x$:
          $(1+x)^n=\sum_{k=0}^{n}\binom nk x^k$. לפי מסקנה 0.6.10 $\binom nk\ge1$, ו-$x^k\ge0$ (מסקנה 0.5.7(ג) כש-$x>0$;
          כש-$x=0$, $x^0=1$ ו-$x^k=0$ ל-$k\ge1$). לכן כל המחוברים אי-שליליים.
      - kind: step
        text: >-
          כמו בהערה 0.6.12, נפריד את הסכום למחובר עם $k=2$ ולסכום של שאר המחוברים (כלל העזר בהוכחת משפט 0.6.11 ולמה
          0.5.6(ג)). סכום של מספרים אי-שליליים אי-שלילי, ולכן $(1+x)^n\ge\binom n2x^2=\frac{n(n-1)}{2}x^2$.
      - kind: computation
        text: >-
          (ב) עם $x=1$: $2^n\ge\frac{n(n-1)}{2}$. ו-$\frac{n(n-1)}{2}-\frac{n^2}{4}=\frac{2n^2-2n-n^2}{4}=\frac{n(n-2)}{4}\ge0$
          כש-$n\ge2$. לפי המעבר, $2^n\ge\frac{n^2}4$.
      - kind: check
        text: '$n=4$: $16\ge6$ ו-$16\ge4$. $n=10$: $1024\ge45\ge25$.'
      - kind: result
        text: >-
          (א) $(1+x)^n\ge\frac{n(n-1)}{2}x^2$ לכל $n\ge2$, $x\ge0$. (ב) $2^n\ge\frac{n^2}4$ לכל $n\ge2$.

  - id: W-0.6-08
    level: exam
    qualitative: true
    objectives: [OBJ-0.6-2]
    prompt: >-
      במשפט 0.6.6 (ברנולי) ההנחה היא $x\ge-1$.

      (א) הוכיחו: אם $-2\le x<-1$, אז $-1\le(1+x)^n\le1$ לכל $n$ טבעי.

      (ב) הוכיחו שאי-שוויון ברנולי, $(1+x)^n\ge1+nx$, נכון לכל $n$ טבעי גם כש-$-2\le x<-1$. הסיקו שהוא נכון לכל
      $x\ge-2$.

      (ג) הפריכו: "אי-שוויון ברנולי נכון לכל $x$ ממשי ולכל $n$ טבעי." מצאו דוגמה נגדית עם $x=-3$.
    answer: >-
      (א) עם $y=1+x\in[-1,0)$: אינדוקציה, כפל ב-$y<0$ הופך את $-1\le y^n\le1$ ל-$y\le y^{n+1}\le-y$. (ב) ל-$n\ge2$:
      $1+nx<1-n\le-1\le(1+x)^n$. (ג) $x=-3$, $n=5$: $(-2)^5=-32<-14$.
    solution:
      - kind: given
        text: '$-2\le x<-1$. נסמן $y=1+x$; אז $-1\le y<0$.'
      - kind: idea
        text: >-
          כש-$1+x$ שלילי, הכפל בצעד של משפט 0.6.6 הופך את הכיוון, וההוכחה שם לא עובדת. במקומה: $(1+x)^n$ נשאר בין
          $-1$ ל-1, ואילו $1+nx$ יורד מתחת ל-$-1$ כבר מ-$n=2$.
      - kind: step
        text: '(א) $A(n)$: $-1\le y^n\le1$. בסיס: $y^1=y$, ו-$-1\le y<0\le1$.'
      - kind: computation
        text: >-
          צעד: נניח $-1\le y^n\le1$ עבור $n$ מסוים. כפל במספר השלילי $y$ הופך את שני אי-השוויונות (עובדה מקובלת (ב)):
          מ-$-1\le y^n$ מקבלים $y^{n+1}=y^n\cdot y\le(-1)\cdot y=-y$, ומ-$y^n\le1$ מקבלים $y^{n+1}\ge y$. לכן
          $y\le y^{n+1}\le-y$. ומ-$-1\le y<0$: $-1\le y$ ו-$-y\le1$. לכן $-1\le y^{n+1}\le1$, וזו $A(n+1)$. לפי מסקנה
          0.5.2, $A(n)$ נכונה לכל $n$.
      - kind: step
        text: >-
          (ב) עבור $n=1$ שני האגפים $1+x$. יהי $n\ge2$. כיוון ש-$x<-1$ ו-$n>0$, $nx<-n$ (עובדה (ב)), ולכן
          $1+nx<1-n\le-1$, כי $n\ge2$. לפי (א), $(1+x)^n\ge-1$. לכן $(1+x)^n\ge-1>1+nx$.
      - kind: step
        text: >-
          המסקנה: לכל $x\ge-1$ האי-שוויון נכון לפי משפט 0.6.6(א), ולכל $x$ עם $-2\le x<-1$ לפי מה שהוכחנו עכשיו. לכן
          הוא נכון לכל $x\ge-2$ ולכל $n$ טבעי. ההנחה $x\ge-1$ במשפט **מספיקה** אבל אינה הכרחית.
      - kind: computation
        text: >-
          (ג) עם $x=-3$ ו-$n=5$: $(1+x)^5=(-2)^5=-32$, ואילו $1+5x=1-15=-14$. $-32<-14$, ולכן הטענה "לכל $x$ ולכל
          $n$" שקרית. שימו לב: עם $x=-3$ ו-$n=3$ יש שוויון, $(-2)^3=-8=1+3\cdot(-3)$, ולכן $n=3$ אינו דוגמה נגדית; ועם
          $n=2$ האי-שוויון נכון לכל $x$, כי $(1+x)^2-(1+2x)=x^2\ge0$.
      - kind: check
        text: >-
          $x=-2$, $n=3$: $(-1)^3=-1\ge-5=1+3\cdot(-2)$. ובחישוב על רשת של $x$ ב-$[-2,-1)$ ו-$n\le60$, ההפרש
          $(1+x)^n-(1+nx)$ אף פעם אינו שלילי.
      - kind: result
        text: >-
          (א) $-1\le(1+x)^n\le1$. (ב) ברנולי נכון לכל $x\ge-2$. (ג) עם $x=-3$, $n=5$: $(-2)^5=-32<-14=1+5\cdot(-3)$.

  - id: W-0.6-09
    level: exam
    objectives: [OBJ-0.6-3]
    prompt: >-
      (א) הוכיחו: לכל שלם $k\ge1$, $k!\ge2^{k-1}$.

      (ב) הוכיחו: לכל $n\in\mathbb{N}$ ולכל שלם $1\le k\le n$, $\binom nk\frac1{n^k}\le\frac1{k!}$.

      (ג) הוכיחו בעזרת הבינום: לכל $n\in\mathbb{N}$, $\left(1+\frac1n\right)^n<3$.
    answer: >-
      (א) $(k+1)!=(k+1)k!\ge2\cdot2^{k-1}$. (ב) $\binom nk\frac1{n^k}=\frac1{k!}\prod_{j=1}^{k}\frac{n-k+j}{n}$ וכל גורם
      לכל היותר 1. (ג) $\left(1+\frac1n\right)^n\le1+\sum_{k=1}^{n}\frac1{2^{k-1}}=3-\frac2{2^n}<3$.
    solution:
      - kind: idea
        text: >-
          פותחים את $\left(1+\frac1n\right)^n$ לפי הבינום. כל מחובר חסום על ידי $\frac1{k!}$, וזה חסום על ידי
          $\frac1{2^{k-1}}$; ואת הסכום של אלה מחשבים בסכום ההנדסי. כל חסם מקטין את הבעיה לשלב אחד.
      - kind: step
        text: >-
          (א) אינדוקציה על $k$. בסיס: $1!=1=2^0$. צעד: אם $k!\ge2^{k-1}$, אז $(k+1)!=(k+1)\cdot k!\ge2\cdot k!\ge2\cdot2^{k-1}=2^k$,
          כי $k+1\ge2$ ו-$k!>0$, ואז כפל ההנחה ב-$2>0$.
      - kind: computation
        text: >-
          (ב) לפי הגדרה 0.5.5(ה), למה 0.5.6(ג) עם $m=n-k$ ו-$l=k$, והגדרה 0.5.5(ג),
          $n!=(n-k)!\cdot\prod_{j=1}^{k}(n-k+j)$ (המכפלה של $n-k+1,\dots,n$; כש-$k=n$ זו ההגדרה של $n!$, ו-$0!=1$),
          ולכן $\binom nk=\frac{1}{k!}\prod_{j=1}^{k}(n-k+j)$. ו-$n^k=\prod_{j=1}^{k}n$, ולפי למה 0.5.6(ד):

          $$\binom nk\frac1{n^k}=\frac1{k!}\prod_{j=1}^{k}\frac{n-k+j}{n} .$$
      - kind: step
        text: >-
          לכל $1\le j\le k$: $0<n-k+1\le n-k+j\le n$ (כי $k\le n$), ולכן $0<\frac{n-k+j}{n}\le1$. מכפלה של מספרים בין 0 ל-1 נשארת בין 0
          ל-1, באינדוקציה על מספר הגורמים: אם $0<P\le1$ ו-$0<t\le1$, אז $0<Pt\le1\cdot t\le1$. לכן
          $\binom nk\frac1{n^k}\le\frac1{k!}$.
      - kind: step
        text: >-
          (ג) לפי משפט 0.6.11 עם $a=1$, $b=\frac1n$, ולפי כלל העזר בהוכחתו:
          $\left(1+\frac1n\right)^n=1+\sum_{k=1}^{n}\binom nk\frac1{n^k}$. לפי (ב) ו-(א), כל מחובר לכל היותר
          $\frac1{k!}\le\frac1{2^{k-1}}$ (כפל של $k!\ge2^{k-1}$ במספר $\frac1{k!\,2^{k-1}}$, שהוא חיובי לפי מסקנה 0.1.9(2)).
      - kind: computation
        text: >-
          סכום של אי-שוויונות לפי איברים נשמר (באינדוקציה על מספר המחוברים, לפי הגדרה 0.5.5(א)). לפי טענה 0.5.8(ב) עם
          $q=\frac12$:

          $$\left(1+\frac1n\right)^n\le1+\sum_{k=1}^{n}\frac1{2^{k-1}}=1+\frac{1-\frac1{2^n}}{1-\frac12}=3-\frac{2}{2^n}<3 .$$
      - kind: check
        text: >-
          $n=1$: $2<3$; $n=2$: $2.25$; $n=10$: $\approx2.594$; ובחישוב, $\left(1+\frac1n\right)^n<3$ לכל $n\le5000$.
      - kind: result
        text: >-
          (א) $k!\ge2^{k-1}$. (ב) $\binom nk\frac1{n^k}\le\frac1{k!}$. (ג) $\left(1+\frac1n\right)^n<3$ לכל $n\in\mathbb{N}$;
          יחד עם תרגיל W-0.6-06(א), $2\le\left(1+\frac1n\right)^n<3$.

  - id: W-0.6-10
    level: exam
    qualitative: true
    objectives: [OBJ-0.6-1]
    prompt: >-
      (א) הוכיחו באינדוקציה שלמה: כל $n\in\mathbb{N}$ הוא סכום של חזקות **שונות** של 2, כלומר
      $n=2^{m_1}+2^{m_2}+\dots+2^{m_r}$ עם $r\in\mathbb{N}$ ושלמים $m_1>m_2>\dots>m_r\ge0$.

      (ב) הפריכו: כל $n\in\mathbb{N}$ הוא סכום של חזקות שונות של 3.
    answer: >-
      (א) לוקחים את החזקה הגדולה ביותר $2^t\le n$ (מעקרון הסדר הטוב), ומפעילים את ההנחה על $n-2^t<2^t$. (ב) 2 אינו
      סכום כזה.
    solution:
      - kind: idea
        text: >-
          מורידים מ-$n$ את החזקה הגדולה ביותר של 2 שאינה עולה עליו. מה שנשאר קטן מ-$n$, ולכן לפי ההנחה הוא סכום של
          חזקות שונות; וכיוון שהוא גם קטן מהחזקה שהורדנו, כל החזקות שלו קטנות ממנה, ואין כפילות.
      - kind: step
        text: >-
          עזר: $2^n>n$ לכל $n\in\mathbb{N}$, באינדוקציה: $2>1$, ואם $2^n>n$ אז $2^{n+1}=2\cdot2^n>2n\ge n+1$.
          ולשלמים $0\le s\le m$: $2^m=2^s\cdot2^{m-s}\ge2^s$ (מסקנה 0.5.7(א), ו-$2^{m-s}\ge1$ באינדוקציה).
      - kind: step
        text: >-
          (א) יהי $n\in\mathbb{N}$, ונניח שכל טבעי $k<n$ הוא סכום של חזקות שונות של 2. תהי $A$ קבוצת הטבעיים $m$
          עם $2^m>n$. לפי העזר $n\in A$, ולכן לפי משפט 0.6.3 יש ל-$A$ איבר קטן ביותר $M$. נסמן $t=M-1\ge0$.
      - kind: step
        text: >-
          $2^t\le n$: אם $t=0$, $2^0=1\le n$. אם $t\ge1$, אז $t\in\mathbb{N}$ ו-$t<M$, ולכן $t\notin A$, כלומר
          $2^t\le n$. מצד שני $2^{t+1}=2^M>n$. נסמן $r=n-2^t$; אז $0\le r<2^{t+1}-2^t=2^t$.
      - kind: step
        text: >-
          אם $r=0$, אז $n=2^t$, סכום של חזקה אחת. אם $r\ge1$, אז $r\in\mathbb{N}$ ו-$r=n-2^t<n$, ולפי ההנחה
          $r=2^{m_1}+\dots+2^{m_s}$ עם $m_1>\dots>m_s\ge0$. כל מחובר לכל היותר הסכום (שאר המחוברים אי-שליליים), ולכן
          $2^{m_1}\le r<2^t$, ולפי העזר $m_1<t$. לכן $n=2^t+2^{m_1}+\dots+2^{m_s}$ עם $t>m_1>\dots>m_s$.
      - kind: step
        text: 'לפי משפט 0.6.1 עם $n_0=1$, כל $n\in\mathbb{N}$ הוא סכום של חזקות שונות של 2.'
      - kind: step
        text: >-
          (ב) נניח ש-$2$ הוא סכום של חזקות שונות של 3. כל מחובר לכל היותר 2, ו-$3^m\ge3$ לכל $m\ge1$; לכן כל מחובר
          הוא $3^0=1$. החזקות שונות, ולכן יש מחובר אחד לכל היותר, והסכום הוא 1, לא 2. סתירה.
      - kind: check
        text: >-
          $13=8+4+1$: $t=3$, $r=5=4+1$. $100=64+32+4$. ובשלוש החזקות 1, 3, 9 מתקבלים רק הסכומים 1, 3, 4, 9, 10, 12, 13.
      - kind: result
        text: >-
          (א) כל $n\in\mathbb{N}$ הוא סכום של חזקות שונות של 2 (הייצוג הבינארי). (ב) שקרית: 2 אינו סכום של חזקות שונות
          של 3; הצעד של (א) נשען על כך שהשארית קטנה מהחזקה שהורדנו, ועם 3 זה לא כך.

challenge:
  - id: W-0.6-c1
    stars: 1
    objectives: [OBJ-0.6-3]
    prompt: >-
      (א) הוכיחו: לכל שלמים $r,n$ עם $0\le r\le n$,

      $$\sum_{k=r}^{n}\binom kr=\binom rr+\binom{r+1}r+\dots+\binom nr=\binom{n+1}{r+1} .$$

      (ב) מה אומר (א) עבור $r=1$? ועבור $r=2$, מה הוא נותן על $\sum_{k=2}^{n}\frac{k(k-1)}{2}$?
    answer: >-
      (א) אינדוקציה על $n$ מבסיס $n_0=r$; בצעד זהות פסקל: $\binom{n+1}{r+1}+\binom{n+1}{r}=\binom{n+2}{r+1}$.
      (ב) $r=1$: $1+2+\dots+n=\binom{n+1}2=\frac{n(n+1)}2$. $r=2$: $\binom{n+1}3=\frac{(n+1)n(n-1)}{6}$.
    solution:
      - kind: idea
        text: >-
          נקבע את $r$ ונוכיח באינדוקציה על $n$, מבסיס $n_0=r$ (משפט 0.5.11). בצעד מוסיפים לסכום את המחובר הבא,
          $\binom{n+1}{r}$, וזהות פסקל מצרפת אותו לתוצאה עבור $n$. במשולש פסקל: סכום של עמודה, מראשה ועד שורה
          $n$, הוא המספר שבשורה הבאה, עמודה אחת ימינה.
      - kind: step
        text: >-
          (א) יהי $r\ge0$ שלם. $P(n)$: $\sum_{k=r}^{n}\binom kr=\binom{n+1}{r+1}$. בסיס $n=r$: הסכום הוא $\binom rr=1$,
          ו-$\binom{r+1}{r+1}=1$.
      - kind: step
        text: 'הנחת האינדוקציה: נניח את $P(n)$ עבור שלם $n\ge r$ מסוים.'
      - kind: computation
        text: >-
          לפי הגדרה 0.5.5(ג) ו-(א) (מפרידים את המחובר האחרון), ההנחה, ולמה 0.6.9 עם $n+1$ במקום $n$ ו-$r+1$ במקום $k$
          (מותר: $n+1\in\mathbb{N}$, ו-$1\le r+1\le n+1$ כי $0\le r\le n$):

          $$\sum_{k=r}^{n+1}\binom kr=\binom{n+1}{r+1}+\binom{n+1}{r}=\binom{n+2}{r+1} ,$$

          וזו $P(n+1)$. לפי משפט 0.5.11 עם $n_0=r$, $P(n)$ נכונה לכל $n\ge r$.
      - kind: step
        text: >-
          (ב) עם $r=1$, $\binom k1=k$, ולכן $\sum_{k=1}^{n}k=\binom{n+1}2=\frac{(n+1)n}{2}$: הסכום של גאוס, טענה 0.5.8(א).
          עם $r=2$ ו-$n\ge2$, $\binom k2=\frac{k(k-1)}2$, ולכן
          $\sum_{k=2}^{n}\frac{k(k-1)}{2}=\binom{n+1}{3}=\frac{(n+1)n(n-1)}{6}$.
      - kind: check
        text: >-
          $r=2$, $n=5$: $1+3+6+10=20=\binom63$. ובחישוב, השוויון נכון לכל $0\le r\le n\le17$.
      - kind: result
        text: >-
          (א) $\sum_{k=r}^{n}\binom kr=\binom{n+1}{r+1}$ לכל $0\le r\le n$. (ב) $r=1$ נותן את הסכום של גאוס, ו-$r=2$
          נותן $\sum_{k=2}^{n}\frac{k(k-1)}{2}=\frac{(n+1)n(n-1)}{6}$.
    source:
      name: 'Richard Hammack, Book of Proof, third edition (edition 3.4)'
      year: 2018
      problem: 'Chapter 10, Exercise 31'
      url: 'https://richardhammack.github.io/BookOfProof/Main.pdf'
      verified: '2026-11-10'
      adapted: true

  - id: W-0.6-c2
    stars: 1
    objectives: [OBJ-0.6-3]
    prompt: >-
      (א) הוכיחו: לכל $n\in\mathbb{N}$ ולכל שלם $1\le k\le n$, $k\binom nk=n\binom{n-1}{k-1}$.

      (ב) הוכיחו: לכל $n\in\mathbb{N}$, $\sum_{k=1}^{n}k\binom nk=1\cdot\binom n1+2\binom n2+\dots+n\binom nn=n\,2^{n-1}$.
    answer: >-
      (א) $k\cdot\frac{n!}{k!(n-k)!}=\frac{n!}{(k-1)!(n-k)!}=n\cdot\frac{(n-1)!}{(k-1)!((n-1)-(k-1))!}$.
      (ב) $\sum_{k=1}^{n}k\binom nk=n\sum_{j=0}^{n-1}\binom{n-1}{j}=n\,2^{n-1}$.
    solution:
      - kind: idea
        text: >-
          המקדם $k$ מפריע לבינום. הזהות של (א) מחליפה אותו במקדם $n$, שאינו תלוי ב-$k$ ויוצא מהסכום; מה שנשאר הוא
          סכום של שורה במשולש פסקל, שהבינום מחשב.
      - kind: computation
        text: >-
          (א) $k\ge1$ ו-$n\ge1$, ולכן $k!=k\,(k-1)!$ ו-$n!=n\,(n-1)!$ (הגדרה 0.5.5(ה)). ו-$(n-1)-(k-1)=n-k$. לכן

          $$k\binom nk=\frac{k\cdot n!}{k\,(k-1)!\,(n-k)!}=n\cdot\frac{(n-1)!}{(k-1)!\,\big((n-1)-(k-1)\big)!}=n\binom{n-1}{k-1},$$

          כאשר $0\le k-1\le n-1$, כך שהמקדם מוגדר.
      - kind: step
        text: >-
          (ב) לפי (א) ולפי למה 0.5.6(ב): $\sum_{k=1}^{n}k\binom nk=n\sum_{k=1}^{n}\binom{n-1}{k-1}$, ולפי הגדרה 0.5.5(ג)
          זה $n\sum_{j=0}^{n-1}\binom{n-1}{j}$.
      - kind: step
        text: >-
          אם $n\ge2$, אז $n-1\in\mathbb{N}$, ולפי הערה 0.6.12 (הבינום עם $a=b=1$) $\sum_{j=0}^{n-1}\binom{n-1}{j}=2^{n-1}$.
          אם $n=1$, הסכום הוא $\binom00=1=2^0$. בשני המקרים הסכום המבוקש הוא $n\,2^{n-1}$.
      - kind: check
        text: >-
          $n=4$: $4+2\cdot6+3\cdot4+4\cdot1=32=4\cdot2^3$. ובחישוב, השוויון נכון לכל $n\le17$.
      - kind: result
        text: '(א) $k\binom nk=n\binom{n-1}{k-1}$. (ב) $\sum_{k=1}^{n}k\binom nk=n\,2^{n-1}$ לכל $n\in\mathbb{N}$.'
