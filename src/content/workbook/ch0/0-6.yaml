# Workbook of lesson 0.6 — sets and functions.
# Objectives (src/course.ts):
#   OBJ-0.6-1  operate on sets; prove set equality by double inclusion
#   OBJ-0.6-2  function, domain, codomain, image; injective and onto
#   OBJ-0.6-3  compose functions, find an inverse, know when it exists
# Every number and every finite claim below was recomputed with src/math/finitefunctions.ts (scratch script
# wb06.ts in the writing session): interval endpoints on a grid, identities on every subset of a 3-element set,
# the theorems of W-09 and W-10 on every pair of functions between small sets.
lesson: '0.6'
practice:
  - id: W-0.6-01
    level: basic
    objectives: [OBJ-0.6-1]
    prompt: >-
      יהיו $A=(-2,4]$ ו-$B=[0,6)$, תת-קבוצות של $\mathbb{R}$, והמשלים נלקח ב-$\mathbb{R}$.

      (א) מצאו את $A\cap B$, $A\cup B$, $A\setminus B$ ו-$B\setminus A$.

      (ב) מצאו את $(A\cup B)^c$ ואת $A^c\cap B^c$, והשוו.
    answer: >-
      (א) $A\cap B=[0,4]$, $A\cup B=(-2,6)$, $A\setminus B=(-2,0)$, $B\setminus A=(4,6)$.

      (ב) שתיהן $(-\infty,-2]\cup[6,\infty)$, כמו שכלל דה-מורגן אומר.
    solution:
      - kind: idea
        text: >-
          מסמנים את שני הקטעים על ציר המספרים ובודקים כל קצה בנפרד: $-2\notin A$, $4\in A$, $0\in B$, $6\notin B$.
      - kind: computation
        text: >-
          (א) בחיתוך צריך $x\ge0$ (בגלל $B$) וגם $x\le4$ (בגלל $A$): $A\cap B=[0,4]$. באיחוד כל $x$ עם $-2<x<6$ נמצא
          באחד הקטעים, והקצוות $-2$ ו-$6$ אינם באף אחד: $A\cup B=(-2,6)$.
      - kind: computation
        text: >-
          $A\setminus B$: ב-$A$ ולא ב-$B$, כלומר $-2<x<0$; הנקודה $0$ ב-$B$, ולכן בחוץ: $A\setminus B=(-2,0)$.
          $B\setminus A$: ב-$B$ ולא ב-$A$, כלומר $4<x<6$; הנקודה $4$ ב-$A$: $B\setminus A=(4,6)$.
      - kind: computation
        text: >-
          (ב) $(A\cup B)^c=\mathbb{R}\setminus(-2,6)=(-\infty,-2]\cup[6,\infty)$. מצד שני
          $A^c=(-\infty,-2]\cup(4,\infty)$ ו-$B^c=(-\infty,0)\cup[6,\infty)$. מספר נמצא בשתיהן אם הוא $\le-2$ (אז הוא
          גם קטן מ-0), או $\ge6$ (אז הוא גם גדול מ-4). מספר בין $-2$ ל-$6$ אינו באחת מהן.
      - kind: check
        text: >-
          הנקודות $-2$ ו-$6$ שייכות ל-$(A\cup B)^c$, ולכן הסוגריים שם מרובעים. ו-$-2$ אכן ב-$A^c$ (כי $-2\notin A$) וגם
          ב-$B^c$ (כי $-2<0$).
      - kind: result
        text: >-
          $A\cap B=[0,4]$, $A\cup B=(-2,6)$, $A\setminus B=(-2,0)$, $B\setminus A=(4,6)$, ו-$(A\cup B)^c=A^c\cap
          B^c=(-\infty,-2]\cup[6,\infty)$.

  - id: W-0.6-02
    level: basic
    qualitative: true
    objectives: [OBJ-0.6-2]
    prompt: >-
      תהי $f:\{1,2,3,4\}\to\{a,b,c,d\}$ הפונקציה $f(1)=b$, $f(2)=d$, $f(3)=b$, $f(4)=a$.

      (א) מהם התחום, הטווח והתמונה של $f$?

      (ב) מהם המקורות של $b$? ושל $c$?

      (ג) האם $f$ חד-חד-ערכית? האם היא על? נמקו.

      (ד) שנו ערך אחד בלבד של $f$ כך שתתקבל פונקציה חד-חד-ערכית ועל.
    answer: >-
      (א) תחום $\{1,2,3,4\}$, טווח $\{a,b,c,d\}$, תמונה $\{a,b,d\}$. (ב) ל-$b$ שני מקורות, $1$ ו-$3$; ל-$c$ אין
      מקור. (ג) לא ולא. (ד) למשל $f(3)=c$ (או $f(1)=c$).
    solution:
      - kind: definition
        text: >-
          התחום הוא הקבוצה שלפני החץ, הטווח היא הקבוצה שאחרי החץ, והתמונה היא קבוצת הערכים שמתקבלים בפועל. מקור של
          $y$ הוא $x$ עם $f(x)=y$.
      - kind: step
        text: >-
          (א) הערכים הם $b,d,b,a$, ולכן התמונה היא $\{a,b,d\}$. היא קטנה מהטווח: $c$ חסר.
      - kind: step
        text: >-
          (ב) $f(1)=f(3)=b$, ולכן ל-$b$ שני מקורות. אף איבר אינו נשלח אל $c$, ולכן אין לו מקור.
      - kind: step
        text: >-
          (ג) לא חד-חד-ערכית: $1\ne3$ ו-$f(1)=f(3)$. לא "על": $c$ בטווח ואין לו מקור. שתי הבעיות מאותו מקור: ארבעה
          ערכים ממלאים רק שלושה מקומות.
      - kind: step
        text: >-
          (ד) צריך שאל $c$ יגיע חץ, ושאל $b$ יגיע רק אחד. משנים את $f(3)$ ל-$c$: הערכים הם $b,d,c,a$, כל איבר של הטווח
          מתקבל פעם אחת בדיוק.
      - kind: check
        text: >-
          גם $f(1)=c$ עובד: $c,d,b,a$. אבל שינוי של $f(2)$ או של $f(4)$ לא יעזור, כי $b$ ימשיך לקבל שני חצים.
      - kind: result
        text: >-
          התמונה $\{a,b,d\}$; ל-$b$ המקורות $1,3$ ול-$c$ אין מקור; $f$ אינה חד-חד-ערכית ואינה על; $f(3)=c$ (או
          $f(1)=c$) הופך אותה לחד-חד-ערכית ועל.

  - id: W-0.6-03
    level: basic
    objectives: [OBJ-0.6-3]
    prompt: >-
      יהיו $f(x)=x+2$, $g(x)=3x$ ו-$h(x)=x^2$, כולן מ-$\mathbb{R}$ אל $\mathbb{R}$.

      (א) מצאו נוסחה ל-$f\circ g$ ול-$g\circ f$.

      (ב) חשבו את $h\big(f(g(1))\big)$.

      (ג) מצאו את $(g\circ f)^{-1}$, והשוו אותה ל-$f^{-1}\circ g^{-1}$ ול-$g^{-1}\circ f^{-1}$.
    answer: >-
      (א) $(f\circ g)(x)=3x+2$, $(g\circ f)(x)=3x+6$. (ב) $25$. (ג) $(g\circ f)^{-1}(y)=\frac y3-2$, שווה ל-$f^{-1}\circ
      g^{-1}$ ולא ל-$g^{-1}\circ f^{-1}$.
    solution:
      - kind: computation
        text: >-
          (א) $(f\circ g)(x)=f(3x)=3x+2$, ו-$(g\circ f)(x)=g(x+2)=3(x+2)=3x+6$. בכל הרכבה מציבים את הפונקציה הימנית
          בתוך השמאלית.
      - kind: computation
        text: >-
          (ב) מבפנים החוצה: $g(1)=3$, $f(3)=5$, $h(5)=25$.
      - kind: computation
        text: >-
          (ג) מ-$y=3x+6$ מקבלים $x=\frac{y-6}{3}=\frac y3-2$, ולכן $(g\circ f)^{-1}(y)=\frac y3-2$.
      - kind: computation
        text: >-
          $f^{-1}(y)=y-2$ ו-$g^{-1}(y)=\frac y3$. לכן $f^{-1}(g^{-1}(y))=\frac y3-2$, שווה ל-$(g\circ f)^{-1}$, ואילו
          $g^{-1}(f^{-1}(y))=\frac{y-2}{3}$, פונקציה אחרת. למשל ב-$y=12$: $\frac{12}{3}-2=2$, אבל $\frac{10}{3}\ne2$.
      - kind: check
        text: >-
          $(g\circ f)(2)=3\cdot2+6=12$, ואכן $(g\circ f)^{-1}(12)=2$. ההיגיון: כדי לבטל "קודם $f$, אחר כך $g$" מבטלים
          קודם את $g$, ואחר כך את $f$, כמו שחולצים נעליים לפני גרביים.
      - kind: result
        text: >-
          $f\circ g=3x+2$, $g\circ f=3x+6$, $h(f(g(1)))=25$, ו-$(g\circ f)^{-1}=f^{-1}\circ g^{-1}$, כלומר
          $y\mapsto\frac y3-2$.

  - id: W-0.6-04
    level: mid
    objectives: [OBJ-0.6-1]
    prompt: >-
      הוכיחו שלכל שתי קבוצות $A$ ו-$B$: $A\cup B=B$ אם ורק אם $A\subseteq B$.
    answer: >-
      כיוון ראשון (אם $A\cup B=B$ אז $A\subseteq B$): כל $x\in A$ נמצא ב-$A\cup B=B$. כיוון שני (אם $A\subseteq B$
      אז $A\cup B=B$): $B\subseteq A\cup B$ תמיד, ו-$A\cup B\subseteq B$ כי כל איבר של האיחוד נמצא ב-$A\subseteq B$
      או ב-$B$.
    solution:
      - kind: goal
        text: >-
          שני כיוונים. בכיוון השני (אם $A\subseteq B$ אז $A\cup B=B$) המסקנה היא שוויון קבוצות, ולכן מוכיחים בו שתי הכלות.
      - kind: idea
        text: >-
          איחוד עם $B$ מוסיף ל-$B$ רק את האיברים של $A$ שאינם בה. הוא לא משנה את $B$ בדיוק כשאין כאלה.
      - kind: step
        text: >-
          כיוון ראשון (אם $A\cup B=B$ אז $A\subseteq B$): נניח $A\cup B=B$. יהי $x\in A$. אז $x\in A\cup B$, וזו הקבוצה $B$. לכן $x\in B$, ומכאן $A\subseteq B$.
      - kind: step
        text: >-
          כיוון שני (אם $A\subseteq B$ אז $A\cup B=B$): נניח $A\subseteq B$. הכלה ראשונה, $B\subseteq A\cup B$: כל איבר של $B$ נמצא באיחוד לפי ההגדרה. זה נכון
          לכל שתי קבוצות.
      - kind: step
        text: >-
          הכלה שנייה, $A\cup B\subseteq B$: יהי $x\in A\cup B$. אם $x\in B$, סיימנו. אם $x\in A$, אז $x\in B$ לפי
          ההנחה $A\subseteq B$. בשני המקרים $x\in B$.
      - kind: check
        text: >-
          איפה השתמשנו בהנחה? רק בהכלה השנייה של הכיוון השני. ובלעדיה הטענה נכשלת: $A=\{1\}$, $B=\{2\}$ נותנות
          $A\cup B=\{1,2\}\ne B$.
      - kind: result
        text: >-
          $A\cup B=B\iff A\subseteq B$.

  - id: W-0.6-05
    level: mid
    qualitative: true
    objectives: [OBJ-0.6-1]
    prompt: >-
      נכון או לא נכון לכל שלוש קבוצות $A$, $B$, $C$? הוכיחו, או הביאו דוגמה נגדית.

      (א) $A\setminus(A\setminus B)=A\cap B$.

      (ב) $(A\cup B)\setminus C=A\cup(B\setminus C)$.
    answer: >-
      (א) נכון. (ב) לא נכון: $A=C=\{1\}$, $B=\emptyset$ נותנות $\emptyset$ באגף שמאל ו-$\{1\}$ באגף ימין.
    solution:
      - kind: idea
        text: >-
          לתרגם כל צד לתנאי ש-$x$ מקיים. ב-(א) התנאים מתבררים כשקולים, ולכן מוכיחים שתי הכלות. ב-(ב) באגף ימין $C$ לא
          מוציאה כלום מ-$A$, ולכן מחפשים איבר של $A$ שנמצא ב-$C$.
      - kind: step
        text: >-
          (א) $x\in A\setminus(A\setminus B)$ פירושו $x\in A$ ו-$x\notin A\setminus B$. איבר של $A$ אינו ב-$A\setminus
          B$ בדיוק כשהוא ב-$B$ (אחרת הוא היה ב-$A$ ולא ב-$B$).
      - kind: step
        text: >-
          (⊆) יהי $x\in A\setminus(A\setminus B)$. אז $x\in A$, ולפי הצעד הקודם $x\in B$, כלומר $x\in A\cap B$. (⊇)
          יהי $x\in A\cap B$. אז $x\in A$, ו-$x\notin A\setminus B$ כי $x\in B$. לכן $x\in A\setminus(A\setminus B)$.
      - kind: computation
        text: >-
          (ב) $A=C=\{1\}$, $B=\emptyset$: אגף שמאל $(\{1\}\cup\emptyset)\setminus\{1\}=\emptyset$. אגף ימין
          $\{1\}\cup(\emptyset\setminus\{1\})=\{1\}$. הקבוצות שונות.
      - kind: check
        text: >-
          מה כן נכון ב-(ב): $(A\cup B)\setminus C\subseteq A\cup(B\setminus C)$ תמיד, ושוויון מתקיים כש-$A$ ו-$C$ זרות
          (אין להן איבר משותף). דוגמה שבה האגפים יוצאים שווים, למשל כש-$C=\emptyset$, אינה הוכחה של (ב).
      - kind: result
        text: >-
          (א) נכון, בהכלה דו-כיוונית. (ב) לא נכון: $A=C=\{1\}$, $B=\emptyset$.

  - id: W-0.6-06
    level: mid
    objectives: [OBJ-0.6-2, OBJ-0.6-3]
    prompt: >-
      תהי $f:\mathbb{R}\to\mathbb{R}$, $f(x)=x^3+1$. הוכיחו ש-$f$ חד-חד-ערכית ועל, מצאו את $f^{-1}$, וחשבו את
      $f^{-1}(9)$ ואת $f^{-1}(0)$. (מותר להשתמש בעובדה מבית הספר שלכל מספר ממשי יש שורש שלישי ממשי; היא תוכח
      בשיעור 1.7.)
    answer: >-
      $f^{-1}(y)=\sqrt[3]{y-1}$, $f^{-1}(9)=2$, $f^{-1}(0)=-1$.
    solution:
      - kind: idea
        text: >-
          חד-חד-ערכיות: מ-$x_1^3=x_2^3$ צריך להסיק $x_1=x_2$, בעזרת הפירוק של הפרש חזקות שלישיות. "על": פותרים את
          $x^3+1=y$.
      - kind: step
        text: >-
          חד-חד-ערכית: נניח $x_1^3+1=x_2^3+1$, כלומר $x_1^3-x_2^3=0$. לפי הפירוק
          $x_1^3-x_2^3=(x_1-x_2)(x_1^2+x_1x_2+x_2^2)$, אחד הגורמים אפס.
      - kind: step
        text: >-
          נראה שהגורם השני אינו שלילי, בהשלמה לריבוע כמו בתיכון. מסתכלים עליו כעל ביטוי ריבועי ב-$x_1$:
          $x_1^2+x_2x_1=\left(x_1+\frac{x_2}{2}\right)^2-\frac{x_2^2}{4}$, ולכן
          $x_1^2+x_1x_2+x_2^2=\left(x_1+\frac{x_2}{2}\right)^2-\frac{x_2^2}{4}+x_2^2=\left(x_1+\frac{x_2}{2}\right)^2+\frac34x_2^2$,
          סכום של שני מספרים אי-שליליים.
          הוא אפס רק כששניהם אפס, כלומר $x_2=0$ ואז גם $x_1=0$; וגם אז $x_1=x_2$. אחרת הגורם הראשון אפס, ו-$x_1=x_2$.
      - kind: step
        text: >-
          "על": יהי $y\in\mathbb{R}$. נבחר $x=\sqrt[3]{y-1}$, מספר ממשי. אז $f(x)=(y-1)+1=y$.
      - kind: computation
        text: >-
          ה-$x$ הזה הוא המקור היחיד של $y$, ולכן $f^{-1}(y)=\sqrt[3]{y-1}$. $f^{-1}(9)=\sqrt[3]{8}=2$ ו-$f^{-1}(0)=\sqrt[3]{-1}=-1$.
      - kind: check
        text: >-
          $f(2)=8+1=9$ ו-$f(-1)=-1+1=0$. ו-$f^{-1}(f(x))=\sqrt[3]{x^3}=x$ לכל $x$ ממשי, כי לשורש השלישי, בניגוד
          לשורש הריבועי, אין בעיית סימן.
      - kind: result
        text: >-
          $f$ חד-חד-ערכית ועל, $f^{-1}(y)=\sqrt[3]{y-1}$, $f^{-1}(9)=2$, $f^{-1}(0)=-1$.

  - id: W-0.6-07
    level: mid
    qualitative: true
    objectives: [OBJ-0.6-2]
    prompt: >-
      (א) תנו דוגמה לפונקציה $f:\mathbb{N}\to\mathbb{N}$ שהיא חד-חד-ערכית ואינה על.

      (ב) תנו דוגמה לפונקציה $f:\mathbb{N}\to\mathbb{N}$ שהיא על ואינה חד-חד-ערכית.

      (ג) תנו דוגמה לפונקציה $f:\mathbb{N}\to\mathbb{N}$ חד-חד-ערכית ועל שאינה הזהות.

      (ד) הסבירו למה כל פונקציה חד-חד-ערכית $f:\{1,2,3,4,5\}\to\{1,2,3,4,5\}$ היא גם על. למה ההסבר לא עובד
      ב-$\mathbb{N}$?
    answer: >-
      (א) $f(n)=n+1$. (ב) $f(1)=1$ ו-$f(n)=n-1$ לכל $n\ge2$. (ג) מחליפים כל זוג: $f(n)=n+1$ ל-$n$ אי-זוגי ו-$f(n)=n-1$
      ל-$n$ זוגי. (ד) חמישה ערכים שונים בקבוצה של חמישה איברים ממלאים את כולה; ב-$\mathbb{N}$ אין "את כולה" לספור.
    solution:
      - kind: step
        text: >-
          (א) $f(n)=n+1$: אם $n+1=m+1$ אז $n=m$, ולכן חד-חד-ערכית. ל-$1$ אין מקור, כי $n+1\ge2$, ולכן אינה על. זה
          המעבר בין החדרים במלון של השיעור.
      - kind: step
        text: >-
          (ב) $f(1)=1$, ו-$f(n)=n-1$ לכל $n\ge2$. על: לכל $m\in\mathbb{N}$ מתקיים $f(m+1)=m$. לא חד-חד-ערכית:
          $f(1)=f(2)=1$.
      - kind: step
        text: >-
          (ג) $f(n)=n+1$ כש-$n$ אי-זוגי, ו-$f(n)=n-1$ כש-$n$ זוגי: $1\leftrightarrow2$, $3\leftrightarrow4$, … . הפעלה
          פעמיים מחזירה כל מספר למקומו, $f(f(n))=n$, ולכן $f$ היא ההפוכה של עצמה. פונקציה שיש לה הפוכה היא
          חד-חד-ערכית ועל, והיא אינה הזהות כי $f(1)=2$.
      - kind: step
        text: >-
          (ד) אם $f$ חד-חד-ערכית, חמשת הערכים $f(1),\dots,f(5)$ שונים זה מזה, כלומר התמונה היא קבוצה של חמישה איברים
          בתוך $\{1,2,3,4,5\}$. אילו היה מספר $k$ שאינו מתקבל, כל חמשת הערכים השונים היו בתוך $\{1,2,3,4,5\}\setminus\{k\}$,
          שיש בה רק ארבעה איברים, וחמישה מספרים שונים לא נכנסים בין ארבעה. לכן כל מספר מתקבל, ו-$f$ היא "על".
      - kind: check
        text: >-
          ב-$\mathbb{N}$ הנימוק נשבר כי אין "מספר האיברים" שמשווים אליו: $\{2,4,6,\dots\}$ היא תת-קבוצה של
          $\mathbb{N}$ שאינה כל $\mathbb{N}$, ובכל זאת $n\mapsto2n$ מזווגת אותה עם $\mathbb{N}$. דוגמה (א) מראה
          שהמסקנה עצמה נכשלת.
      - kind: result
        text: >-
          (א) $n+1$. (ב) $1\mapsto1$, $n\mapsto n-1$. (ג) החלפת זוגות $1\leftrightarrow2,\ 3\leftrightarrow4,\dots$
          (ד) נכון בקבוצה סופית, ונכשל ב-$\mathbb{N}$.

  - id: W-0.6-08
    level: exam
    objectives: [OBJ-0.6-2, OBJ-0.6-3]
    prompt: >-
      תהי $f:\mathbb{R}\setminus\{-2\}\to\mathbb{R}$, $f(x)=\frac{x-1}{x+2}$.

      (א) הוכיחו ש-$f$ חד-חד-ערכית.

      (ב) הוכיחו שהתמונה של $f$ היא $\mathbb{R}\setminus\{1\}$. האם $f$ על?

      (ג) נתייחס ל-$f$ כפונקציה מ-$\mathbb{R}\setminus\{-2\}$ אל $\mathbb{R}\setminus\{1\}$. מצאו את ההפוכה שלה,
      וחשבו את $f^{-1}(0)$ ואת $f^{-1}(2)$.
    answer: >-
      (א) $f(x)=1-\frac{3}{x+2}$. (ב) $f$ אינה "על": $1$ נמצא בטווח ואינו מתקבל. (ג) $f^{-1}(y)=\frac{1+2y}{1-y}$,
      $f^{-1}(0)=1$, $f^{-1}(2)=-5$.
    solution:
      - kind: idea
        text: >-
          חילוק עם שארית: $\frac{x-1}{x+2}=\frac{(x+2)-3}{x+2}=1-\frac{3}{x+2}$. מהצורה הזו רואים גם חד-חד-ערכיות
          וגם שהערך $1$ חסר, כי $\frac{3}{x+2}$ אינו אפס אף פעם.
      - kind: step
        text: >-
          (א) נניח $f(x_1)=f(x_2)$, כלומר $1-\frac{3}{x_1+2}=1-\frac{3}{x_2+2}$. אז $\frac{3}{x_1+2}=\frac{3}{x_2+2}$,
          ולכן $x_1+2=x_2+2$ (שני מספרים שונים מאפס עם אותו הופכי שווים), כלומר $x_1=x_2$.
      - kind: step
        text: >-
          (ב) (⊆) לכל $x$ בתחום $\frac{3}{x+2}\ne0$, ולכן $f(x)\ne1$: התמונה מוכלת ב-$\mathbb{R}\setminus\{1\}$.
      - kind: step
        text: >-
          (⊇) יהי $y\ne1$. מחפשים $x\ne-2$ עם $\frac{x-1}{x+2}=y$. כופלים ב-$x+2$: $x-1=yx+2y$, כלומר $x(1-y)=1+2y$,
          ומכיוון ש-$y\ne1$, $x=\frac{1+2y}{1-y}$. נבדוק ש-$x\ne-2$: אילו $\frac{1+2y}{1-y}=-2$, היה $1+2y=-2+2y$,
          כלומר $1=-2$, סתירה. לכן $x$ בתחום ו-$f(x)=y$.
      - kind: step
        text: >-
          לכן התמונה היא $\mathbb{R}\setminus\{1\}$. הטווח הוא $\mathbb{R}$, ו-$1$ בטווח ואין לו מקור: $f$ אינה על.
      - kind: computation
        text: >-
          (ג) עם הטווח $\mathbb{R}\setminus\{1\}$ הפונקציה חד-חד-ערכית (א) ועל (ב), ולכן יש לה הפוכה. ה-$x$ שמצאנו
          ב-(ב) הוא המקור היחיד של $y$: $f^{-1}(y)=\frac{1+2y}{1-y}$. לכן $f^{-1}(0)=1$ ו-$f^{-1}(2)=\frac{5}{-1}=-5$.
      - kind: check
        text: >-
          $f(1)=\frac{0}{3}=0$ ו-$f(-5)=\frac{-6}{-3}=2$. וזו דוגמה למה שהשיעור אמר: אותו כלל עם טווח אחר הוא פונקציה
          אחרת, וכאן הטווח הוא שמכריע אם יש הפוכה.
      - kind: result
        text: >-
          (א) חד-חד-ערכית. (ב) התמונה $\mathbb{R}\setminus\{1\}$, ולכן $f$ אינה "על" (הטווח הוא $\mathbb{R}$). (ג)
          $f^{-1}(y)=\frac{1+2y}{1-y}$, $f^{-1}(0)=1$, $f^{-1}(2)=-5$.

  - id: W-0.6-09
    level: exam
    qualitative: true
    objectives: [OBJ-0.6-3, OBJ-0.6-2]
    prompt: >-
      יהיו $f:A\to B$ ו-$g:B\to A$, ונניח ש-$g\circ f=\mathrm{id}_A$, כלומר $g(f(x))=x$ לכל $x\in A$.

      (א) הוכיחו ש-$f$ חד-חד-ערכית.

      (ב) הוכיחו ש-$g$ היא "על".

      (ג) הראו בדוגמה ש-$f$ לא חייבת להיות "על", ו-$g$ לא חייבת להיות חד-חד-ערכית. האם $g$ היא בהכרח $f^{-1}$?
    answer: >-
      (א) $f(x_1)=f(x_2)\Rightarrow x_1=g(f(x_1))=g(f(x_2))=x_2$. (ב) לכל $x\in A$, $x=g(f(x))$. (ג) $A=B=\mathbb{N}$,
      $f(n)=n+1$, $g(1)=1$ ו-$g(n)=n-1$ לכל $n\ge2$: $g$ אינה $f^{-1}$, ול-$f$ אין הפוכה בכלל.
    solution:
      - kind: idea
        text: >-
          $g$ "מבטלת" את $f$ מצד אחד בלבד. זה מספיק כדי שלא יאבד מידע בדרך מ-$A$ ל-$B$ (חד-חד-ערכיות של $f$), ולא
          מספיק כדי ש-$f$ תכסה את כל $B$.
      - kind: step
        text: >-
          (א) נניח $f(x_1)=f(x_2)$. נפעיל $g$ על שני האגפים: $g(f(x_1))=g(f(x_2))$. לפי ההנחה האגף השמאלי הוא $x_1$
          והימני $x_2$, ולכן $x_1=x_2$.
      - kind: step
        text: >-
          (ב) יהי $x\in A$, איבר כלשהו של הטווח של $g$. נבחר $y=f(x)\in B$. אז $g(y)=g(f(x))=x$. לכן ל-$x$ יש מקור,
          ו-$g$ היא "על".
      - kind: step
        text: >-
          (ג) המלון של השיעור: $A=B=\mathbb{N}$, $f(n)=n+1$, ו-$g(1)=1$, $g(n)=n-1$ לכל $n\ge2$. לכל $n$,
          $n+1\ge2$, ולכן $g(f(n))=g(n+1)=n$: $g\circ f=\mathrm{id}_{\mathbb{N}}$. אבל ל-$1$ אין מקור ב-$f$, כי
          $n+1\ge2$; ו-$g(1)=g(2)=1$ עם $1\ne2$.
      - kind: step
        text: >-
          $g$ אינה $f^{-1}$: ההפוכה צריכה לקיים גם $f(g(y))=y$ לכל $y$, וכאן $f(g(1))=f(1)=2\ne1$. ול-$f$ אין הפוכה
          בכלל, כי היא אינה "על".
      - kind: check
        text: >-
          (א) ו-(ב) מתיישבים עם המשפט של השיעור: אילו היה גם $f\circ g=\mathrm{id}_B$, אותו נימוק בסדר הפוך היה נותן
          ש-$f$ היא "על" ו-$g$ חד-חד-ערכית, ואז $g=f^{-1}$.
      - kind: result
        text: >-
          $g\circ f=\mathrm{id}_A$ גורר: $f$ חד-חד-ערכית ו-$g$ היא "על". לא יותר: $f$ לא בהכרח "על", $g$ לא בהכרח
          חד-חד-ערכית, ו-$g$ לא בהכרח $f^{-1}$.

  - id: W-0.6-10
    level: exam
    objectives: [OBJ-0.6-1, OBJ-0.6-2]
    prompt: >-
      תהי $f:A\to B$, ויהיו $S,T\subseteq A$. (כמו בשיעור, $f(S)=\{f(x):x\in S\}$.)

      (א) הוכיחו: $f(S)\setminus f(T)\subseteq f(S\setminus T)$.

      (ב) הראו בדוגמה שבסעיף (א) לא תמיד יש שוויון.

      (ג) הוכיחו שאם $f$ חד-חד-ערכית, יש שוויון.
    answer: >-
      (א) איבר של $f(S)\setminus f(T)$ הוא $f(x)$ עם $x\in S$, ו-$x\notin T$ (אחרת הוא היה ב-$f(T)$). (ב) $f:\{1,2\}\to\{0\}$
      הקבועה, $S=\{1\}$, $T=\{2\}$: $\emptyset\ne\{0\}$. (ג) ההכלה ההפוכה: מ-$f(x)=f(t)$ עם $t\in T$ נובע $x=t\in T$, סתירה.
    solution:
      - kind: idea
        text: >-
          כל איבר של תמונה הוא $f(x)$ ל-$x$ כלשהו. הכיוון ההפוך של (א) נכשל כשאיבר של $S\setminus T$ ואיבר של $T$
          נשלחים לאותו ערך, וחד-חד-ערכיות מונעת בדיוק את זה.
      - kind: step
        text: >-
          (א) יהי $y\in f(S)\setminus f(T)$. כיוון ש-$y\in f(S)$, יש $x\in S$ עם $f(x)=y$. אילו $x\in T$, היה
          $y=f(x)\in f(T)$, בסתירה ל-$y\notin f(T)$. לכן $x\in S\setminus T$, ו-$y=f(x)\in f(S\setminus T)$.
      - kind: computation
        text: >-
          (ב) הפונקציה הקבועה $f:\{1,2\}\to\{0\}$, $f(1)=f(2)=0$, עם $S=\{1\}$ ו-$T=\{2\}$. אז $f(S)=f(T)=\{0\}$,
          ולכן $f(S)\setminus f(T)=\emptyset$. אבל $S\setminus T=\{1\}$, ו-$f(S\setminus T)=\{0\}\ne\emptyset$.
      - kind: step
        text: >-
          (ג) נניח ש-$f$ חד-חד-ערכית ונוכיח $f(S\setminus T)\subseteq f(S)\setminus f(T)$. יהי $y\in f(S\setminus T)$,
          כלומר $y=f(x)$ עם $x\in S$, $x\notin T$. אז $y\in f(S)$. נניח בשלילה ש-$y\in f(T)$: אז $y=f(t)$ עם $t\in T$,
          ו-$f(x)=f(t)$ נותן $x=t$ לפי חד-חד-ערכיות, כלומר $x\in T$. סתירה. לכן $y\notin f(T)$.
      - kind: check
        text: >-
          שתי ההכלות יחד, (א) ו-(ג), נותנות שוויון. בדוגמה של (ב) $f$ אינה חד-חד-ערכית ($f(1)=f(2)$), כמו שצריך.
      - kind: result
        text: >-
          תמיד $f(S)\setminus f(T)\subseteq f(S\setminus T)$; השוויון יכול להיכשל (פונקציה קבועה, $S=\{1\}$, $T=\{2\}$), ומתקיים
          כש-$f$ חד-חד-ערכית.

challenge:
  - id: W-0.6-c1
    stars: 1
    objectives: [OBJ-0.6-2, OBJ-0.6-3]
    prompt: >-
      הוכיחו שהפונקציה $f:\mathbb{R}\setminus\{1\}\to\mathbb{R}\setminus\{1\}$,
      $f(x)=\left(\frac{x+1}{x-1}\right)^3$, חד-חד-ערכית ועל, ומצאו את ההפוכה שלה. (רמז: כתבו את $f$ כהרכבה של שתי
      פונקציות פשוטות.)
    answer: >-
      $f=c\circ h$ עם $h(x)=\frac{x+1}{x-1}$ ו-$c(t)=t^3$, שתיהן חד-חד-ערכיות ועל מ-$\mathbb{R}\setminus\{1\}$ אל
      עצמה. $f^{-1}(y)=\frac{\sqrt[3]{y}+1}{\sqrt[3]{y}-1}$.
    solution:
      - kind: idea
        text: >-
          $f=c\circ h$, כאשר $h(x)=\frac{x+1}{x-1}$ ו-$c(t)=t^3$. לפי המשפט של השיעור, הרכבה של שתי פונקציות
          חד-חד-ערכיות היא חד-חד-ערכית, והרכבה של שתי פונקציות "על" היא "על". לכן מספיק לטפל בכל אחת לחוד, כפונקציה
          מ-$\mathbb{R}\setminus\{1\}$ אל $\mathbb{R}\setminus\{1\}$.
      - kind: step
        text: >-
          $h:\mathbb{R}\setminus\{1\}\to\mathbb{R}\setminus\{1\}$ מוגדרת היטב: $h(x)=1+\frac{2}{x-1}$, ו-$\frac{2}{x-1}\ne0$,
          ולכן $h(x)\ne1$. חד-חד-ערכית: $1+\frac{2}{x_1-1}=1+\frac{2}{x_2-1}$ גורר $x_1-1=x_2-1$.
      - kind: step
        text: >-
          $h$ היא "על": יהי $y\ne1$. מ-$\frac{x+1}{x-1}=y$ מקבלים $x+1=yx-y$, כלומר $x(y-1)=y+1$, ו-$x=\frac{y+1}{y-1}$. זה
          מוגדר כי $y\ne1$, ו-$x\ne1$ כי $\frac{y+1}{y-1}=1$ היה נותן $1=-1$. לכן $h^{-1}(y)=\frac{y+1}{y-1}$: באופן
          מפתיע, $h$ היא ההפוכה של עצמה.
      - kind: step
        text: >-
          הצמצום של $c$ ל-$\mathbb{R}\setminus\{1\}$: $c(t)=t^3$ חד-חד-ערכית ועל מ-$\mathbb{R}$ אל $\mathbb{R}$ (כמו ב-W-0.6-06,
          עם השורש השלישי). המקור היחיד של $1$ הוא $1$, ולכן $c$ שולחת את $\mathbb{R}\setminus\{1\}$ אל
          $\mathbb{R}\setminus\{1\}$, ושם היא עדיין חד-חד-ערכית ועל: לכל $s\ne1$ המקור $\sqrt[3]{s}$ שונה מ-$1$.
      - kind: step
        text: >-
          לכן $f=c\circ h$ חד-חד-ערכית ועל, וההפוכה מבטלת קודם את $c$ ואחר כך את $h$:
          $f^{-1}(y)=h^{-1}\big(c^{-1}(y)\big)=\frac{\sqrt[3]{y}+1}{\sqrt[3]{y}-1}$.
      - kind: check
        text: >-
          $f(3)=\left(\frac42\right)^3=8$, ו-$f^{-1}(8)=\frac{2+1}{2-1}=3$. $f(0)=(-1)^3=-1$, ו-$f^{-1}(-1)=\frac{-1+1}{-1-1}=0$.
      - kind: result
        text: >-
          $f$ חד-חד-ערכית ועל, ו-$f^{-1}(y)=\frac{\sqrt[3]{y}+1}{\sqrt[3]{y}-1}$.
    source:
      name: 'Richard Hammack, Book of Proof (third edition, edition 3.4)'
      year: 2018
      problem: 'Chapter 12, Section 12.2, Exercise 10'
      url: 'https://richardhammack.github.io/BookOfProof/Main.pdf'
      verified: '2026-11-09'
      adapted: true

  - id: W-0.6-c2
    stars: 1
    objectives: [OBJ-0.6-1, OBJ-0.6-2]
    prompt: >-
      תהי $f:A\to B$. לכל $Y\subseteq B$ נגדיר את **המקור של הקבוצה** $Y$:
      $f^{-1}(Y)=\{x\in A: f(x)\in Y\}$. (זה מוגדר לכל פונקציה, גם כשאין לה פונקציה הפוכה; הסימון דומה, אבל זה מושג
      אחר.)

      (א) הוכיחו שלכל $X\subseteq A$ מתקיים $X\subseteq f^{-1}(f(X))$.

      (ב) הוכיחו: $f$ חד-חד-ערכית אם ורק אם $X=f^{-1}(f(X))$ לכל $X\subseteq A$.
    answer: >-
      (א) כל $x\in X$ מקיים $f(x)\in f(X)$. (ב) כיוון ראשון (אם $f$ חד-חד-ערכית אז יש שוויון): אם $f(x)=f(x')$ עם $x'\in X$, אז $x=x'\in X$. כיוון שני (אם
      יש שוויון לכל $X$ אז $f$ חד-חד-ערכית): אם $f(x_1)=f(x_2)$
      עם $x_1\ne x_2$, אז עבור $X=\{x_1\}$ האיבר $x_2$ נמצא ב-$f^{-1}(f(X))$ ולא ב-$X$.
    solution:
      - kind: idea
        text: >-
          $f^{-1}(f(X))$ הם כל האיברים ש-$f$ שולחת לאותם ערכים שאליהם הולכים איברי $X$. הוא גדול מ-$X$ בדיוק כשאיבר
          מחוץ ל-$X$ "מתחזה" לאיבר של $X$, כלומר כש-$f$ אינה חד-חד-ערכית.
      - kind: step
        text: >-
          (א) יהי $x\in X$. אז $f(x)\in f(X)$ לפי הגדרת התמונה, ולכן $x\in f^{-1}(f(X))$ לפי הגדרת המקור.
      - kind: step
        text: >-
          (ב), כיוון ראשון: אם $f$ חד-חד-ערכית, יש שוויון לכל $X$. נניח ש-$f$ חד-חד-ערכית. לפי (א) מספיקה ההכלה $f^{-1}(f(X))\subseteq X$. יהי $x\in f^{-1}(f(X))$. אז
          $f(x)\in f(X)$, כלומר $f(x)=f(x')$ עבור $x'\in X$. מחד-חד-ערכיות $x=x'$, ולכן $x\in X$.
      - kind: step
        text: >-
          (ב), כיוון שני: אם יש שוויון לכל $X$, אז $f$ חד-חד-ערכית. נוכיח בקונטרפוזיטיב: נניח ש-$f$ אינה חד-חד-ערכית, כלומר יש $x_1\ne x_2$ עם $f(x_1)=f(x_2)$. ניקח
          $X=\{x_1\}$. אז $f(X)=\{f(x_1)\}$, ו-$f(x_2)=f(x_1)\in f(X)$, ולכן $x_2\in f^{-1}(f(X))$. אבל $x_2\notin X$,
          ולכן $X\ne f^{-1}(f(X))$.
      - kind: check
        text: >-
          דוגמה: $f(x)=x^2$ מ-$\{-1,0,1\}$ אל $\{0,1\}$, ו-$X=\{1\}$. אז $f(X)=\{1\}$ ו-$f^{-1}(\{1\})=\{-1,1\}\ne X$, כמו שהכיוון השני
          צופה.
      - kind: result
        text: >-
          תמיד $X\subseteq f^{-1}(f(X))$, והשוויון לכל $X$ שקול לחד-חד-ערכיות של $f$.
    source:
      name: 'Richard Hammack, Book of Proof (third edition, edition 3.4)'
      year: 2018
      problem: 'Chapter 12, Section 12.6, Exercise 12'
      url: 'https://richardhammack.github.io/BookOfProof/Main.pdf'
      verified: '2026-11-09'
      adapted: true
