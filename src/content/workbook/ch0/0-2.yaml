# Workbook of lesson 0.2 — statements, connectives and implication.
# Objectives (src/course.ts):
#   OBJ-0.2-1  truth tables of implication, equivalence, "and", "or"; why an implication with a false hypothesis is true
#   OBJ-0.2-2  a statement, its converse, its inverse and its contrapositive; which of them are equivalent
#   OBJ-0.2-3  "necessary condition" and "sufficient condition" in words and in symbols
# Every truth table and equivalence below was recomputed with src/math/logic.ts (column, equivalent,
# differingRows, falsifying); every numerical counterexample with npx tsx.
lesson: '0.2'
practice:
  - id: W-0.2-01
    level: basic
    objectives: [OBJ-0.2-1]
    prompt: >-
      בנו את טבלת האמת של הנוסחה $(P\Rightarrow Q)\lor(Q\Rightarrow P)$, והוכיחו שהיא טאוטולוגיה.
    answer: >-
      העמודה היא $\mathrm{T},\mathrm{T},\mathrm{T},\mathrm{T}$: הנוסחה אמת בכל ארבע ההשמות, ולכן היא טאוטולוגיה.
    solution:
      - kind: definition
        text: >-
          טאוטולוגיה היא נוסחה שאמת בכל השמה לאותיות שלה (הגדרה 0.2.5); לשתי אותיות יש ארבע השמות, ובדיקה של
          כולן היא הוכחה.
      - kind: idea
        text: >-
          בונים עמודה לכל גרירה, ואז את ה"או" שלהן. גרירה שקר רק בשורה שבה ההנחה אמת והמסקנה שקר, ו"או" שקר רק
          כששני חלקיו שקר.
      - kind: computation
        text: >-
          $P\Rightarrow Q$ שקר רק בשורה $P=\mathrm{T},Q=\mathrm{F}$, ולכן העמודה שלה היא
          $\mathrm{T},\mathrm{F},\mathrm{T},\mathrm{T}$. $Q\Rightarrow P$ שקר רק בשורה $Q=\mathrm{T},P=\mathrm{F}$,
          ולכן העמודה שלה היא $\mathrm{T},\mathrm{T},\mathrm{F},\mathrm{T}$.
      - kind: computation
        text: >-
          "או" שקר רק בשורה שבה שתי העמודות $\mathrm{F}$. אין שורה כזו: בשורה 2 רק הראשונה $\mathrm{F}$, ובשורה 3 רק
          השנייה. לכן העמודה של הפסוק היא $\mathrm{T},\mathrm{T},\mathrm{T},\mathrm{T}$.
      - kind: check
        text: >-
          במילים: אם $P$ שקר, הגרירה $P\Rightarrow Q$ אמת ריקה; ואם $P$ אמת, הגרירה $Q\Rightarrow P$ אמת כי
          המסקנה שלה אמת. בכל מקרה לפחות אחת מהן אמת.
      - kind: result
        text: >-
          הנוסחה אמת בכל ארבע ההשמות, ולכן לפי הגדרה 0.2.5 היא טאוטולוגיה: מכל שני פסוקים, לפחות אחת משתי
          הגרירות ביניהם נכונה.

  - id: W-0.2-02
    level: basic
    qualitative: true
    objectives: [OBJ-0.2-1]
    prompt: >-
      קבעו אם כל פסוק אמת או שקר, ונמקו לפי טבלת האמת של הקשר.

      (א) אם $\pi>4$ אז $\pi<0$.

      (ב) $\sqrt2<2$ וגם $2^{10}>1000$.

      (ג) אם $3^2=9$ אז $2^3=9$.

      (ד) $5<3$ או $5\ne5$.
    answer: >-
      (א) אמת. (ב) אמת. (ג) שקר. (ד) שקר.
    solution:
      - kind: idea
        text: >-
          קובעים את ערך האמת של כל חלק, ואז קוראים את השורה המתאימה בטבלת האמת של הקשר. התוכן לא משנה.
      - kind: step
        text: >-
          (א) $\pi\approx3.14$, ולכן ההנחה $\pi>4$ שקר. גרירה עם הנחה שקרית היא אמת ריקה: הפסוק **אמת**, אף שגם
          המסקנה שקר.
      - kind: computation
        text: >-
          (ב) $\sqrt2<2$ אמת: $\sqrt2\ge0$, $2\ge0$ ו-$(\sqrt2)^2=2<4=2^2$, ולכן לפי טענה 0.1.10 $\sqrt2<2$.
          וגם $2^{10}=1024>1000$ אמת. "וגם" של שני פסוקי אמת הוא **אמת**.
      - kind: step
        text: >-
          (ג) ההנחה $3^2=9$ אמת, והמסקנה שקר, כי $2^3=8$. זו השורה היחידה שבה גרירה שקר: הפסוק **שקר**.
      - kind: step
        text: >-
          (ד) $5<3$ שקר ו-$5\ne5$ שקר. "או" של שני פסוקי שקר הוא **שקר**.
      - kind: result
        text: >-
          (א) אמת, (ב) אמת, (ג) שקר, (ד) שקר. רק (ג) נמצא בשורה $\mathrm{T},\mathrm{F}$ של גרירה.

  - id: W-0.2-03
    level: basic
    objectives: [OBJ-0.2-2]
    prompt: >-
      עבור $x$ ממשי נתונה הטענה "אם $x=2$ אז $x^2=4$". כתבו את ההפוכה, את הנגדית ואת הקונטרפוזיטיב שלה, והוכיחו
      או הפריכו כל אחת מארבע הטענות (לכל $x$ ממשי).
    answer: >-
      ההפוכה: אם $x^2=4$ אז $x=2$ (לא נכונה). הנגדית: אם $x\ne2$ אז $x^2\ne4$ (לא נכונה). הקונטרפוזיטיב: אם
      $x^2\ne4$ אז $x\ne2$ (נכונה, כמו הטענה). דוגמה נגדית לשתיים: $x=-2$.
    solution:
      - kind: definition
        text: >-
          לטענה $P\Rightarrow Q$: ההפוכה $Q\Rightarrow P$, הנגדית $\neg P\Rightarrow\neg Q$, הקונטרפוזיטיב
          $\neg Q\Rightarrow\neg P$. כאן $P$ הוא "$x=2$" ו-$Q$ הוא "$x^2=4$".
      - kind: step
        text: >-
          הטענה נכונה: אם $x=2$ אז $x^2=2\cdot2=4$.
      - kind: step
        text: >-
          ההפוכה, "אם $x^2=4$ אז $x=2$", לא נכונה. דוגמה נגדית: $x=-2$, שעבורו $x^2=4$, אבל $x\ne2$.
      - kind: step
        text: >-
          הנגדית, "אם $x\ne2$ אז $x^2\ne4$", לא נכונה מאותה סיבה: $x=-2$ מקיים $x\ne2$ ו-$x^2=4$.
      - kind: theorem
        text: >-
          הקונטרפוזיטיב, "אם $x^2\ne4$ אז $x\ne2$", שקול לטענה לפי משפט 0.2.15, ולכן לפי טענה 0.2.19(ב) הוא נכון
          לכל $x$, כמוה.
      - kind: result
        text: >-
          נכונות: הטענה והקונטרפוזיטיב. לא נכונות: ההפוכה והנגדית, ואותה דוגמה נגדית, $x=-2$, מפריכה את שתיהן.

  - id: W-0.2-04
    level: mid
    qualitative: true
    objectives: [OBJ-0.2-1]
    prompt: >-
      כתבו את השלילה של כל פסוק בלי המילים "לא נכון ש", כך שאין שלילה לפני סוגריים.

      (א) עבור מספר טבעי $n$ מסוים: אם $n$ מתחלק ב-4 אז $n$ מתחלק ב-8.

      (ב) עבור מספר ממשי $x$ מסוים: $x>0$ וגם $x<1$.

      (ג) עבור מספרים ממשיים $x,y$ מסוימים: $x=0$ או $y=0$.

      (ד) הטענה "לכל $n$ טבעי, אם $n$ מתחלק ב-4 אז $n$ מתחלק ב-8" אינה נכונה. מצאו $n$ שמקיים את השלילה
      שכתבתם ב-(א), והראו שהוא מקיים אותה.
    answer: >-
      (א) $n$ מתחלק ב-4 וגם $n$ אינו מתחלק ב-8. (ב) $x\le0$ או $x\ge1$. (ג) $x\ne0$ וגם $y\ne0$. (ד) למשל
      $n=4$.
    solution:
      - kind: theorem
        text: >-
          לפי משפט 0.2.13(ב), $\neg(P\Rightarrow Q)\equiv P\land\neg Q$, ולפי כללי דה-מורגן (משפט 0.2.9)
          $\neg(P\land Q)\equiv\neg P\lor\neg Q$ ו-$\neg(P\lor Q)\equiv\neg P\land\neg Q$. לפי טענה 0.2.19(ב),
          פסוקים שמתקבלים מנוסחאות שקולות מקבלים אותו ערך אמת, ולכן השלילות שנכתוב הן אכן השלילות.
      - kind: step
        text: >-
          (א) השלילה של גרירה היא "וגם": "$n$ מתחלק ב-4 **וגם** $n$ אינו מתחלק ב-8". לא "אם $n$ מתחלק ב-4 אז $n$
          אינו מתחלק ב-8": זו שוב גרירה, והיא אמת ריקה לכל $n$ שאינו מתחלק ב-4, למשל $n=3$, שבו גם הפסוק
          המקורי אמת ריקה.
      - kind: step
        text: >-
          (ב) השלילה של "וגם" היא "או" של השלילות. השלילה של $x>0$ היא $x\le0$, ושל $x<1$ היא $x\ge1$. לכן:
          $x\le0$ או $x\ge1$.
      - kind: step
        text: >-
          (ג) השלילה של "או" היא "וגם" של השלילות: $x\ne0$ וגם $y\ne0$.
      - kind: check
        text: >-
          (ד) $n=4$: $4=4\cdot1$, ולכן 4 מחלק את $n$. ואם 8 היה מחלק את 4, אז לפי טענה 0.1.5(4) (שני מספרים
          טבעיים) היה $8\le4$, שזה שקר; לכן 8 אינו מחלק את 4. ב-(ב), בדיקה עם $x=\frac12$: הפסוק אמת והשלילה
          שקר; עם $x=3$: הפסוק שקר והשלילה אמת.
      - kind: result
        text: >-
          (א) $n$ מתחלק ב-4 וגם $n$ אינו מתחלק ב-8. (ב) $x\le0$ או $x\ge1$. (ג) $x\ne0$ וגם $y\ne0$. (ד) למשל
          $n=4$.

  - id: W-0.2-05
    level: mid
    objectives: [OBJ-0.2-1]
    prompt: >-
      (א) הוכיחו ש-$P\Rightarrow(Q\Rightarrow R)$ שקול ל-$(P\land Q)\Rightarrow R$.

      (ב) האם $P\Rightarrow(Q\Rightarrow R)$ שקול ל-$(P\Rightarrow Q)\Rightarrow R$? אם לא, מצאו שורה שמפרידה
      ביניהם.
    answer: >-
      (א) שניהם שקר בדיוק כש-$P$ ו-$Q$ אמת ו-$R$ שקר. (ב) לא: בשורה $P=Q=R=\mathrm{F}$ הראשון אמת והשני שקר.
    solution:
      - kind: idea
        text: >-
          בטבלה של שלושה פסוקים יש שמונה שורות. במקום לבנות את כולן, מוצאים באילו שורות כל צד שקר: גרירה שקר רק
          כשההנחה אמת והמסקנה שקר.
      - kind: step
        text: >-
          (א) $P\Rightarrow(Q\Rightarrow R)$ שקר בדיוק כש-$P$ אמת ו-$Q\Rightarrow R$ שקר, כלומר כש-$P$ אמת, $Q$ אמת
          ו-$R$ שקר.
      - kind: step
        text: >-
          $(P\land Q)\Rightarrow R$ שקר בדיוק כש-$P\land Q$ אמת ו-$R$ שקר: שוב $P$ אמת, $Q$ אמת, $R$ שקר. שני
          הצדדים שקר באותה השמה יחידה ואמת בשבע האחרות, ולכן לפי טענה 0.2.6(ב) הם שקולים.
      - kind: computation
        text: >-
          (ב) נבדוק את השורה $P=Q=R=\mathrm{F}$. ב-$P\Rightarrow(Q\Rightarrow R)$ ההנחה $P$ שקר, ולכן הוא אמת.
          ב-$(P\Rightarrow Q)\Rightarrow R$: $P\Rightarrow Q$ אמת (הנחה שקרית) ו-$R$ שקר, ולכן הוא שקר.
      - kind: check
        text: >-
          גם השורה $P=\mathrm{F}$, $Q=\mathrm{T}$, $R=\mathrm{F}$ מפרידה, מאותה סיבה. בשתי השורות $P$ שקר: הסוגריים
          משנים את המשמעות.
      - kind: result
        text: >-
          (א) שקולים. (ב) לא שקולים (הגדרה 0.2.5(ב)): בשורה $P=Q=R=\mathrm{F}$ הראשון אמת והשני שקר. לכן
          הגרירה אינה מקיימת קיבוץ, בניגוד ל"וגם" ול"או" (משפט 0.2.10(ב)).

  - id: W-0.2-06
    level: mid
    qualitative: true
    objectives: [OBJ-0.2-2]
    prompt: >-
      ידוע שהטענה "אם $n$ מתחלק ב-6 אז $n$ זוגי" נכונה לכל $n$ טבעי.

      (א) ידוע ש-$n=35$ אי-זוגי. מה אפשר להסיק על חלוקתו ב-6? איזו טענה שקולה הצדיקה את המסקנה?

      (ב) ידוע ש-$n$ זוגי. האם אפשר להסיק ש-$n$ מתחלק ב-6? האם אפשר להסיק שאינו מתחלק ב-6?
    answer: >-
      (א) $35$ אינו מתחלק ב-6, לפי הקונטרפוזיטיב "אם $n$ אינו זוגי אז $n$ אינו מתחלק ב-6". (ב) אף אחד מהשניים:
      $n=12$ זוגי ומתחלק ב-6, ו-$n=4$ זוגי ולא מתחלק ב-6.
    solution:
      - kind: theorem
        text: >-
          טענה $P\Rightarrow Q$ שקולה לקונטרפוזיטיב $\neg Q\Rightarrow\neg P$ (משפט 0.2.15), ואינה קובעת את ערך
          ההפוכה $Q\Rightarrow P$ (טענה 0.2.16(ג)).
      - kind: step
        text: >-
          (א) הקונטרפוזיטיב הוא "אם $n$ אינו זוגי אז $n$ אינו מתחלק ב-6", והוא נכון לכל $n$ כי הוא שקול לטענה
          (טענה 0.2.19(ב)). $35=2\cdot17+1$ אי-זוגי, ולכן לפי למה 0.1.3 אינו זוגי. לפי כלל הניתוק (משפט
          0.2.17(א) וטענה 0.2.19(א)), $35$ אינו מתחלק ב-6.
      - kind: step
        text: >-
          (ב) "זוגי, ולכן מתחלק ב-6" הוא שימוש בהפוכה, "אם $n$ זוגי אז $n$ מתחלק ב-6", והיא לא נובעת מהטענה. היא גם
          לא נכונה: $4=2\cdot2$ זוגי, ו-6 אינו מחלק את 4, כי לפי טענה 0.1.5(4) זה היה נותן $6\le4$.
      - kind: check
        text: >-
          גם המסקנה ההפוכה לא נובעת: $n=12$ זוגי ומתחלק ב-6. בטבלת האמת, $Q$ אמת מתאים לשתי שורות, $\mathrm{T},\mathrm{T}$
          ו-$\mathrm{F},\mathrm{T}$, ובשתיהן הגרירה אמת. לכן ידיעה ש-$Q$ אמת לא קובעת את $P$.
      - kind: result
        text: >-
          (א) $35$ אינו מתחלק ב-6 (קונטרפוזיטיב). (ב) אי אפשר להסיק דבר על $n$ זוגי: $12$ מתחלק ב-6 ו-$4$ לא.

  - id: W-0.2-07
    level: mid
    objectives: [OBJ-0.2-3]
    prompt: >-
      כתבו כל משפט כגרירה בסימנים, בצורה $A\Rightarrow B$, והוכיחו או הפריכו אותו לכל המספרים שהוא מדבר
      עליהם.

      (א) כדי ש-$n^2$ יהיה אי-זוגי, מספיק ש-$n$ יהיה אי-זוגי ($n$ טבעי).

      (ב) תנאי הכרחי לכך ש-$x>5$ הוא ש-$x>2$ ($x$ ממשי).

      (ג) $ab=0$ רק אם $a=0$ ($a,b$ ממשיים).
    answer: >-
      (א) $n$ אי-זוגי $\Rightarrow$ $n^2$ אי-זוגי: נכון. (ב) $x>5\Rightarrow x>2$: נכון. (ג) $ab=0\Rightarrow a=0$:
      לא נכון ($a=1$, $b=0$).
    solution:
      - kind: definition
        text: >-
          לפי הגדרה 0.2.20: "$A$ מספיק ל-$B$" הוא $A\Rightarrow B$, ו"$A$ הכרחי ל-$B$" הוא $B\Rightarrow A$. לפי
          טענה 0.2.21(א), "$B$ רק אם $A$" אמת בדיוק כש-$B\Rightarrow A$ אמת.
      - kind: step
        text: >-
          (א) התנאי המספיק הוא "$n$ אי-זוגי", ולכן הגרירה היא "אם $n$ אי-זוגי אז $n^2$ אי-זוגי". היא נכונה: אם
          $n=2k+1$ עם $k$ שלם, אז $n^2=4k^2+4k+1=2(2k^2+2k)+1$, ו-$2k^2+2k$ שלם (עובדה מקובלת (א)). זו גם טענה
          0.1.4(5) עם $a=b=n$.
      - kind: step
        text: >-
          (ב) "$x>2$" הוא התנאי ההכרחי ל-"$x>5$", ולכן הגרירה היא $x>5\Rightarrow x>2$: בלי $x>2$ אין $x>5$. היא
          נכונה: מ-$x>5$ ו-$5>2$ נובע $x>2$ (טרנזיטיביות, עובדה מקובלת (ב)).
      - kind: step
        text: >-
          (ג) "$ab=0$ רק אם $a=0$" היא $ab=0\Rightarrow a=0$. היא לא נכונה: $a=1$, $b=0$ נותנים $ab=1\cdot0=0$, כלומר
          ההנחה אמת, ו-$a\ne0$, כלומר המסקנה שקר.
      - kind: check
        text: >-
          ב-(ג) הנכון הוא "$ab=0$ רק אם $a=0$ **או** $b=0$" (טענה 0.1.8). וב-(ב) שימו לב לכיוון: החץ הולך
          מהמספיק ($x>5$) אל ההכרחי ($x>2$).
      - kind: result
        text: >-
          (א) נכון. (ב) נכון. (ג) לא נכון.

  - id: W-0.2-08
    level: exam
    objectives: [OBJ-0.2-1]
    prompt: >-
      (א) הוכיחו, בעזרת המשפטים של השיעור ובלי טבלת אמת:
      $(P\Rightarrow Q)\land(P\Rightarrow R)\equiv P\Rightarrow(Q\land R)$.

      (ב) הוכיחו או הפריכו: $(P\Rightarrow R)\lor(Q\Rightarrow R)\equiv(P\land Q)\Rightarrow R$.

      (ג) הוכיחו בעזרת (א): לכל $x$ ממשי, אם $x>1$ אז $x^2>x$ וגם $x^3>x^2$.
    answer: >-
      (א) בשרשרת: גרירה כ"או" (משפט 0.2.13(א)), פילוג (משפט 0.2.10(ג)), וחזרה לגרירה. (ב) נכון: שני הצדדים שקר
      רק בהשמה $P=Q=\mathrm{T}$, $R=\mathrm{F}$. (ג) לפי (א) מספיק להוכיח שתי גרירות, וכל אחת היא כפל של $1<x$
      במספר חיובי.
    solution:
      - kind: goal
        text: >-
          (א) שרשרת של שקילויות, כל אחת מצוטטת. (ב) להכריע אם יש השמה שבה הערכים שונים. (ג) טענה לכל $x$ ממשי.
      - kind: idea
        text: >-
          ב-(א) כותבים כל גרירה כ"או" ומוציאים את $\neg P$ המשותף בחוק הפילוג. ב-(ב) מוצאים באילו השמות כל צד שקר
          (טענה 0.2.6(ב)). ב-(ג), לפי (א), "אם $x>1$ אז (שני דברים)" נכון בדיוק כששתי הגרירות נכונות.
      - kind: step
        text: >-
          (א) לפי משפט 0.2.13(א) פעמיים, ולמה 0.2.8 לכל אחד משני החלקים:
          $(P\Rightarrow Q)\land(P\Rightarrow R)\equiv(\neg P\lor Q)\land(\neg P\lor R)$.
      - kind: step
        text: >-
          לפי משפט 0.2.10(ג), חוק הפילוג השני עם $\neg P$, $Q$, $R$ במקום $P$, $Q$, $R$ (למה 0.2.7), ובכיוון
          ההפוך (טענה 0.2.6(ג), סימטריה): $(\neg P\lor Q)\land(\neg P\lor R)\equiv\neg P\lor(Q\land R)$.
      - kind: step
        text: >-
          לפי משפט 0.2.13(א) עם $Q\land R$ במקום $Q$ (למה 0.2.7), בכיוון ההפוך:
          $\neg P\lor(Q\land R)\equiv P\Rightarrow(Q\land R)$. לפי טענה 0.2.6(ג), שלושת הצעדים נותנים את (א).
      - kind: step
        text: >-
          (ב) הצד השמאלי הוא "או", ולכן הוא שקר בדיוק כששתי הגרירות שקר: $P\Rightarrow R$ שקר כש-$P=\mathrm{T}$,
          $R=\mathrm{F}$, ו-$Q\Rightarrow R$ שקר כש-$Q=\mathrm{T}$, $R=\mathrm{F}$. יחד: רק בהשמה $P=Q=\mathrm{T}$,
          $R=\mathrm{F}$.
      - kind: step
        text: >-
          הצד הימני שקר בדיוק כש-$P\land Q$ אמת ו-$R$ שקר, כלומר רק בהשמה $P=Q=\mathrm{T}$, $R=\mathrm{F}$. אותה
          השמה, ולכן לפי טענה 0.2.6(ב) השקילות **נכונה**.
      - kind: step
        text: >-
          (ג) נקבע $x$ ממשי, ונסמן $P$: "$x>1$", $Q$: "$x^2>x$", $R$: "$x^3>x^2$". לפי (א) וטענה 0.2.19(ב),
          $P\Rightarrow(Q\land R)$ אמת אם ורק אם $(P\Rightarrow Q)\land(P\Rightarrow R)$ אמת, ולכן מספיק להוכיח את
          שתי הגרירות.
      - kind: step
        text: >-
          $P\Rightarrow Q$: אם $x>1$ אז $x>0$ (טרנזיטיביות, $1>0$), ולפי עובדה מקובלת (ב) כפל של $1<x$ ב-$x>0$ נותן
          $x<x^2$.
      - kind: step
        text: >-
          $P\Rightarrow R$: אם $x>1$ אז $x>0$, ולכן $x^2=x\cdot x>0\cdot x=0$ (כפל של $0<x$ ב-$x>0$). כפל של $1<x$
          במספר החיובי $x^2$ נותן $x^2<x^3$.
      - kind: check
        text: >-
          $x=2$: $4>2$ ו-$8>4$. בלי ההנחה: $x=\frac12$ נותן $\frac14<\frac12$. וב-(ב), בדיקה של כל שמונה ההשמות
          נותנת שתי עמודות זהות, עם $\mathrm{F}$ אחד בלבד, בשורה $\mathrm{T},\mathrm{T},\mathrm{F}$.
      - kind: result
        text: >-
          (א) הוכח. (ב) נכון: $(P\Rightarrow R)\lor(Q\Rightarrow R)\equiv(P\land Q)\Rightarrow R$, בניגוד ל"וגם" של
          שתי הגרירות (דוגמה 5(ב) בשיעור). (ג) לכל $x>1$: $x^2>x$ וגם $x^3>x^2$.

  - id: W-0.2-09
    level: exam
    qualitative: true
    objectives: [OBJ-0.2-3]
    prompt: >-
      עבור $x$ ממשי שונה מ-0 קבעו, והוכיחו, איזה תנאי (מספיק ולא הכרחי, הכרחי ולא מספיק, הכרחי ומספיק, או אף
      אחד מהם) הוא:

      (א) "$x^2<x$" לכך ש-$x<1$.

      (ב) "$x>0$" לכך ש-$\frac1x<1$.

      (ג) "$x>1$" לכך ש-$\frac1x<1$.
    answer: >-
      (א) מספיק ולא הכרחי. (ב) לא הכרחי ולא מספיק. (ג) מספיק ולא הכרחי.
    solution:
      - kind: idea
        text: >-
          לפי הגדרה 0.2.20, בכל סעיף בודקים שני כיוונים: מספיק פירושו "התנאי גורר את המטרה", הכרחי פירושו "המטרה
          גוררת את התנאי", לכל $x\ne0$. כיוון נכון מוכיחים, כיוון לא נכון מפריכים בדוגמה נגדית אחת.
      - kind: step
        text: >-
          (א) מספיק: נניח $x^2<x$. מחסירים $x$ (עובדה מקובלת (ב)): $x(x-1)<0$. לפי עובדה מקובלת (ב) מתקיים בדיוק
          אחד מ-$x-1<0$, $x-1=0$, $x-1>0$. אם $x-1=0$ אז $x(x-1)=0$, ולא $x(x-1)<0$. אם $x-1>0$ אז $x>1>0$, וכפל
          של $0<x-1$ ב-$x>0$ נותן $x(x-1)>0$, ושוב לא $x(x-1)<0$. נשאר $x-1<0$, כלומר $x<1$.
      - kind: step
        text: >-
          לא הכרחי: $x=-1$ מקיים $x<1$, אבל $x^2=1>-1=x$, ולכן $x^2<x$ שקר.
      - kind: step
        text: >-
          עובדת עזר על הופכי, מסקנה 0.1.9: אם $x>0$ אז $\frac1x>0$, ואם $x<0$ אז $\frac1x<0$.
      - kind: step
        text: >-
          (ב) לא מספיק: $x=\frac12>0$, אבל $\frac1x=2$, ו-$2<1$ שקר. לא הכרחי: $x=-1$ מקיים $\frac1x=-1<1$, אבל
          $x>0$ שקר.
      - kind: step
        text: >-
          (ג) מספיק: אם $x>1$ אז $x>0$, ולפי עובדת העזר $\frac1x>0$. כפל של $1<x$ ב-$\frac1x>0$ נותן $\frac1x<1$. לא
          הכרחי: שוב $x=-1$, שעבורו $\frac1x=-1<1$ ו-$x>1$ שקר.
      - kind: step
        text: >-
          מה התנאי ההכרחי והמספיק ל-$\frac1x<1$? לפי עובדה מקובלת (ב), $x<0$ או $x>0$ (כי $x\ne0$). אם $x<0$, לפי
          עובדת העזר $\frac1x<0<1$. אם $x>0$, כפל ב-$x>0$ וכפל ב-$\frac1x>0$ נותנים: $\frac1x<1$ אם ורק אם $1<x$.
          לכן $\frac1x<1$ אם ורק אם $x<0$ או $x>1$.
      - kind: check
        text: >-
          זה מסביר את שלושת הסעיפים: "$x>1$" הוא רק חלק מ"$x<0$ או $x>1$" (מספיק ולא הכרחי), ו-"$x>0$" לא מוכל בו
          ולא מכיל אותו (לא זה ולא זה). בדיקה מספרית: $x=-2,-\frac12,2$ מקיימים $\frac1x<1$, ו-$x=\frac12,1$ לא.
      - kind: result
        text: >-
          (א) מספיק ולא הכרחי. (ב) לא הכרחי ולא מספיק. (ג) מספיק ולא הכרחי.

  - id: W-0.2-10
    level: exam
    objectives: [OBJ-0.2-2, OBJ-0.2-3]
    prompt: >-
      הוכיחו: עבור $n$ טבעי, "$n$ אי-זוגי" הוא תנאי הכרחי ומספיק לכך ש-$n^2-1$ מתחלק ב-8. בכיוון אחד היעזרו
      בקונטרפוזיטיב, ואמרו איזו טענה הוכחתם בפועל ולמה זה מספיק.
    answer: >-
      מספיק: $n=2k+1$ נותן $n^2-1=4k(k+1)$, ו-$k(k+1)$ זוגי. הכרחי: הקונטרפוזיטיב "אם $n$ זוגי אז $n^2-1$ אינו
      מתחלק ב-8" נכון, כי אז $n^2-1$ אי-זוגי.
    solution:
      - kind: goal
        text: >-
          שני כיוונים. מספיק: $n$ אי-זוגי $\Rightarrow$ $n^2-1$ מתחלק ב-8. הכרחי: $n^2-1$ מתחלק ב-8 $\Rightarrow$
          $n$ אי-זוגי.
      - kind: idea
        text: >-
          את הכיוון הראשון מחשבים ישירות. בכיוון השני קשה להתחיל מ"מתחלק ב-8", ולכן מוכיחים את הקונטרפוזיטיב שלו,
          שמתחיל מ"$n$ אינו אי-זוגי", כלומר מ"$n$ זוגי" (למה 0.1.3).
      - kind: computation
        text: >-
          מספיק: אם $n=2k+1$ עם $k$ שלם, אז $n^2-1=4k^2+4k=4k(k+1)$. לפי טענה 0.1.6(2), $k(k+1)$ זוגי:
          $k(k+1)=2m$ עם $m$ שלם. לכן $n^2-1=8m$, ו-8 מחלק את $n^2-1$. גם המקרה $n=1$ ($k=0$) נכלל:
          $n^2-1=0=8\cdot0$.
      - kind: step
        text: >-
          הכרחי: הקונטרפוזיטיב של "אם $n^2-1$ מתחלק ב-8 אז $n$ אי-זוגי" הוא "אם $n$ אינו אי-זוגי אז $n^2-1$ אינו
          מתחלק ב-8". נניח ש-$n$ אינו אי-זוגי; לפי למה 0.1.3, $n$ זוגי, $n=2k$. אז $n^2-1=4k^2-1=2(2k^2-1)+1$, ו-$n^2-1$
          אי-זוגי.
      - kind: step
        text: >-
          מספר אי-זוגי $t$ אינו מתחלק ב-8: אם $t=8j$ עם $j$ שלם, אז $t=2(4j)$ זוגי; כלומר הגרירה "אם 8 מחלק את
          $t$ אז $t$ זוגי" נכונה. $t$ אי-זוגי, ולכן לפי למה 0.1.3 אינו זוגי: המסקנה שקר, ולפי טבלת הגרירה (הגדרה
          0.2.3, השורה היחידה שבה הגרירה אמת והמסקנה שקר היא $\mathrm{F},\mathrm{F}$) גם ההנחה שקר.
      - kind: theorem
        text: >-
          לפי משפט 0.2.15 וטענה 0.2.19(ב), הגרירה שקולה לקונטרפוזיטיב שלה ומקבלת את ערכו, ולכן הוכחת הקונטרפוזיטיב
          היא הוכחה של הכיוון השני. לפי טענה 0.2.21(ג), שני הכיוונים יחד הם "הכרחי ומספיק".
      - kind: check
        text: >-
          $n=1,3,5,7$: $n^2-1=0,8,24,48$, כולם מתחלקים ב-8. $n=2,4,6$: $3,15,35$, אי-זוגיים. (נבדק בחישוב עד
          $n=20$; הבדיקה אינה ההוכחה.)
      - kind: result
        text: >-
          $n^2-1$ מתחלק ב-8 אם ורק אם $n$ אי-זוגי: "$n$ אי-זוגי" הוא תנאי הכרחי ומספיק.

challenge:
  - id: W-0.2-c1
    stars: 1
    objectives: [OBJ-0.2-1]
    prompt: >-
      ידוע שהפסוק $\bigl((P\land Q)\lor R\bigr)\Rightarrow(R\lor S)$ **שקר**. מצאו את ערכי האמת של $P$, $Q$, $R$
      ו-$S$, בלי לבנות טבלת אמת (יש לה 16 שורות). הסבירו למה התשובה יחידה.
    answer: >-
      $P$ אמת, $Q$ אמת, $R$ שקר, $S$ שקר, וזו האפשרות היחידה.
    solution:
      - kind: idea
        text: >-
          גרירה שקר רק כשההנחה שלה אמת והמסקנה שלה שקר. משתי העובדות האלה קובעים את הפסוקים אחד אחרי השני.
      - kind: step
        text: >-
          הגרירה שקר, ולכן המסקנה $R\lor S$ שקר וההנחה $(P\land Q)\lor R$ אמת.
      - kind: step
        text: >-
          "או" שקר רק כששני חלקיו שקר: $R$ שקר ו-$S$ שקר.
      - kind: step
        text: >-
          ההנחה $(P\land Q)\lor R$ אמת ו-$R$ שקר, ולכן $P\land Q$ אמת, כלומר $P$ אמת ו-$Q$ אמת.
      - kind: check
        text: >-
          הצבה: $(P\land Q)\lor R=\mathrm{T}\lor\mathrm{F}=\mathrm{T}$ ו-$R\lor S=\mathrm{F}$, ולכן הגרירה
          $\mathrm{T}\Rightarrow\mathrm{F}$ שקר. כל צעד היה מאולץ, ולכן אין אפשרות אחרת; גם בדיקה של כל 16 השורות
          נותנת שורה שקרית אחת בלבד.
      - kind: result
        text: >-
          $P=\mathrm{T}$, $Q=\mathrm{T}$, $R=\mathrm{F}$, $S=\mathrm{F}$, באופן יחיד.
    source:
      name: Richard Hammack, Book of Proof (3rd edition, version 3.4)
      year: 2018
      problem: Chapter 2, Exercise 2.5.10
      url: https://richardhammack.github.io/BookOfProof/Main.pdf
      verified: '2026-11-09'
      adapted: true

  - id: W-0.2-c2
    stars: 1
    objectives: [OBJ-0.2-1, OBJ-0.2-2]
    prompt: >-
      (א) הוכיחו ש-$P\Rightarrow Q$ שקול ל-$(P\land\neg Q)\Rightarrow(Q\land\neg Q)$.

      (ב) הפסוק $Q\land\neg Q$ שקר תמיד: זו **סתירה**. הסבירו בעזרת (א) למה מותר להוכיח "אם $P$ אז $Q$" כך: מניחים
      $P$, מניחים בנוסף ש-$Q$ שקר, ומגיעים לסתירה.
    answer: >-
      (א) $Q\land\neg Q$ שקר תמיד, ולכן הצד הימני אמת בדיוק כש-$P\land\neg Q$ שקר, כלומר כשהגרירה $P\Rightarrow Q$
      אמת. (ב) מי שהגיע מ-$P\land\neg Q$ לסתירה הוכיח את הצד הימני, ששקול ל-$P\Rightarrow Q$.
    solution:
      - kind: idea
        text: >-
          המסקנה של הצד הימני שקר תמיד, וגרירה שהמסקנה שלה שקר היא אמת בדיוק כשההנחה שלה שקר.
      - kind: step
        text: >-
          (א) בכל שורה, $Q\land\neg Q$ שקר: $Q$ ו-$\neg Q$ לא יכולים להיות אמת יחד.
      - kind: step
        text: >-
          לכן $(P\land\neg Q)\Rightarrow(Q\land\neg Q)$ אמת בדיוק כשההנחה $P\land\neg Q$ שקר, כלומר בכל השורות
          חוץ מ-$P=\mathrm{T}$, $Q=\mathrm{F}$.
      - kind: theorem
        text: >-
          גם $P\Rightarrow Q$ שקר רק בשורה $P=\mathrm{T}$, $Q=\mathrm{F}$. שתי הנוסחאות שקר באותה השמה בדיוק, ולכן
          לפי טענה 0.2.6(ב) הן שקולות.
      - kind: step
        text: >-
          (ב) ההוכחה המתוארת מראה: מההנחה $P\land\neg Q$ נובעת הסתירה $Q\land\neg Q$. כלומר היא מוכיחה את
          $(P\land\neg Q)\Rightarrow(Q\land\neg Q)$, ולפי (א) וטענה 0.2.19(ב) זה נותן את $P\Rightarrow Q$. זו
          ההצדקה הלוגית של הוכחה בדרך השלילה של גרירה (שיעור 0.4), גרסה של משפט 0.2.17(ד).
      - kind: check
        text: >-
          העמודה של הצד הימני היא $\mathrm{T},\mathrm{F},\mathrm{T},\mathrm{T}$, בדיוק העמודה של $P\Rightarrow Q$.
      - kind: result
        text: >-
          (א) שני הפסוקים שקולים. (ב) לכן "להניח $P$ ו-$\neg Q$ ולהגיע לסתירה" מוכיח את $P\Rightarrow Q$.
    source:
      name: Richard Hammack, Book of Proof (3rd edition, version 3.4)
      year: 2018
      problem: Chapter 2, Exercise 2.6.7
      url: https://richardhammack.github.io/BookOfProof/Main.pdf
      verified: '2026-11-09'
      adapted: true
