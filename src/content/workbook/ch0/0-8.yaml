# Workbook of lesson 0.8 — functions.
# Objectives (src/course.ts):
#   OBJ-0.8-1  function, domain, codomain, image; injective and onto
#   OBJ-0.8-2  compose functions, find an inverse, know when it exists
#   OBJ-0.8-3  images and preimages of sets and their properties; the pigeonhole principle for finite sets
# Split on 2026-11-10 from the old lesson 0.6 (sets and functions): W-01, 02, 04, 05, 08, 09, 10 and both challenges
# are its function problems (old W-0.6-02, 03, 06, 07, 08, 09, 10, c1, c2), W-03, 06, 07 are new. Every finite claim
# is checked with src/math/finitefunctions.ts (tests/math/finitefunctions.test.ts for W-09, W-10, c2); the numbers of
# W-03, W-04, W-07 and W-08 by a scratch script.
lesson: '0.8'
practice:
  - id: W-0.8-01
    level: basic
    qualitative: true
    objectives: [OBJ-0.8-1]
    prompt: >-
      תהי $f:\{1,2,3,4\}\to\{a,b,c,d\}$ הפונקציה $f(1)=b$, $f(2)=d$, $f(3)=b$, $f(4)=a$.

      (א) מהם התחום, הטווח והתמונה של $f$?

      (ב) מהם המקורות של $b$? ושל $c$?

      (ג) האם $f$ חד-חד-ערכית? האם היא על? נמקו.

      (ד) שנו ערך אחד בלבד של $f$ כך שתתקבל פונקציה חד-חד-ערכית ועל.
    answer: >-
      (א) תחום $\{1,2,3,4\}$, טווח $\{a,b,c,d\}$, תמונה $\{a,b,d\}$. (ב) ל-$b$ שני מקורות, $1$ ו-$3$; ל-$c$ אין
      מקור. (ג) לא ולא. (ד) למשל $f(3)=c$ (או $f(1)=c$).
    solution:
      - kind: definition
        text: >-
          התחום הוא הקבוצה שלפני החץ, הטווח היא הקבוצה שאחרי החץ, והתמונה היא קבוצת הערכים שמתקבלים בפועל. מקור של
          $y$ הוא $x$ עם $f(x)=y$.
      - kind: step
        text: >-
          (א) הערכים הם $b,d,b,a$, ולכן התמונה היא $\{a,b,d\}$. היא קטנה מהטווח: $c$ חסר.
      - kind: step
        text: >-
          (ב) $f(1)=f(3)=b$, ולכן ל-$b$ שני מקורות. אף איבר אינו נשלח אל $c$, ולכן אין לו מקור.
      - kind: step
        text: >-
          (ג) לא חד-חד-ערכית: $1\ne3$ ו-$f(1)=f(3)$. לא "על": $c$ בטווח ואין לו מקור. שתי הבעיות מאותו מקור: ארבעה
          ערכים ממלאים רק שלושה מקומות.
      - kind: step
        text: >-
          (ד) צריך שאל $c$ יגיע חץ, ושאל $b$ יגיע רק אחד. משנים את $f(3)$ ל-$c$: הערכים הם $b,d,c,a$, כל איבר של הטווח
          מתקבל פעם אחת בדיוק.
      - kind: check
        text: >-
          גם $f(1)=c$ עובד: $c,d,b,a$. אבל שינוי של $f(2)$ או של $f(4)$ לא יעזור, כי $b$ ימשיך לקבל שני חצים.
      - kind: result
        text: >-
          התמונה $\{a,b,d\}$; ל-$b$ המקורות $1,3$ ול-$c$ אין מקור; $f$ אינה חד-חד-ערכית ואינה על; $f(3)=c$ (או
          $f(1)=c$) הופך אותה לחד-חד-ערכית ועל.

  - id: W-0.8-02
    level: basic
    objectives: [OBJ-0.8-2]
    prompt: >-
      יהיו $f(x)=x+2$, $g(x)=3x$ ו-$h(x)=x^2$, כולן מ-$\mathbb{R}$ אל $\mathbb{R}$.

      (א) מצאו נוסחה ל-$f\circ g$ ול-$g\circ f$.

      (ב) חשבו את $h\big(f(g(1))\big)$.

      (ג) מצאו את $(g\circ f)^{-1}$, והשוו אותה ל-$f^{-1}\circ g^{-1}$ ול-$g^{-1}\circ f^{-1}$.
    answer: >-
      (א) $(f\circ g)(x)=3x+2$, $(g\circ f)(x)=3x+6$. (ב) $25$. (ג) $(g\circ f)^{-1}(y)=\frac y3-2$, שווה ל-$f^{-1}\circ
      g^{-1}$ ולא ל-$g^{-1}\circ f^{-1}$.
    solution:
      - kind: computation
        text: >-
          (א) $(f\circ g)(x)=f(3x)=3x+2$, ו-$(g\circ f)(x)=g(x+2)=3(x+2)=3x+6$. בכל הרכבה מציבים את הפונקציה הימנית
          בתוך השמאלית.
      - kind: computation
        text: >-
          (ב) מבפנים החוצה: $g(1)=3$, $f(3)=5$, $h(5)=25$.
      - kind: computation
        text: >-
          (ג) מ-$y=3x+6$ מקבלים $x=\frac{y-6}{3}=\frac y3-2$, ולכן $(g\circ f)^{-1}(y)=\frac y3-2$.
      - kind: computation
        text: >-
          $f^{-1}(y)=y-2$ ו-$g^{-1}(y)=\frac y3$. לכן $f^{-1}(g^{-1}(y))=\frac y3-2$, שווה ל-$(g\circ f)^{-1}$, ואילו
          $g^{-1}(f^{-1}(y))=\frac{y-2}{3}$, פונקציה אחרת. למשל ב-$y=12$: $\frac{12}{3}-2=2$, אבל $\frac{10}{3}\ne2$.
      - kind: check
        text: >-
          $(g\circ f)(2)=3\cdot2+6=12$, ואכן $(g\circ f)^{-1}(12)=2$. ההיגיון: כדי לבטל "קודם $f$, אחר כך $g$" מבטלים
          קודם את $g$, ואחר כך את $f$, כמו שחולצים נעליים לפני גרביים.
      - kind: result
        text: >-
          $f\circ g=3x+2$, $g\circ f=3x+6$, $h(f(g(1)))=25$, ו-$(g\circ f)^{-1}=f^{-1}\circ g^{-1}$, כלומר
          $y\mapsto\frac y3-2$.

  - id: W-0.8-03
    level: basic
    objectives: [OBJ-0.8-3, OBJ-0.8-1]
    prompt: >-
      תהי $f:\mathbb{Z}\to\mathbb{Z}$, $f(n)=n^2-n$.

      (א) חשבו את $f(\{0,1,2,3\})$, $f^{-1}(\{0\})$, $f^{-1}(\{2\})$ ו-$f^{-1}(\{1,3\})$.

      (ב) עם $C=\{2,3\}$, חשבו את $f^{-1}(f(C))$. האם $f$ חד-חד-ערכית?
    answer: >-
      (א) $f(\{0,1,2,3\})=\{0,2,6\}$, $f^{-1}(\{0\})=\{0,1\}$, $f^{-1}(\{2\})=\{-1,2\}$, $f^{-1}(\{1,3\})=\emptyset$.
      (ב) $f^{-1}(f(C))=f^{-1}(\{2,6\})=\{-2,-1,2,3\}$; $f$ אינה חד-חד-ערכית.
    solution:
      - kind: definition
        text: >-
          לפי הגדרה 0.8.2, $f(C)=\{f(n):\ n\in C\}$ ו-$f^{-1}(D)=\{n\in\mathbb{Z}:\ f(n)\in D\}$.
      - kind: computation
        text: >-
          (א) $f(0)=0$, $f(1)=0$, $f(2)=2$, $f(3)=6$, ולכן $f(\{0,1,2,3\})=\{0,2,6\}$.
      - kind: computation
        text: >-
          $n^2-n=0$ אם ורק אם $n(n-1)=0$, כלומר $n=0$ או $n=1$: $f^{-1}(\{0\})=\{0,1\}$. $n^2-n=2$ אם ורק אם
          $n^2-n-2=(n-2)(n+1)=0$, כלומר $n=2$ או $n=-1$: $f^{-1}(\{2\})=\{-1,2\}$.
      - kind: step
        text: >-
          $f(n)=n(n-1)=(n-1)\big((n-1)+1\big)$ זוגי לכל $n$, לפי טענה 0.1.6(2) עם $n-1$ במקום $n$. מספר זוגי אינו
          אי-זוגי (למה 0.1.3), ולכן $f(n)\ne1$ ו-$f(n)\ne3$: $f^{-1}(\{1,3\})=\emptyset$.
      - kind: computation
        text: >-
          (ב) $f(C)=\{2,6\}$. $n^2-n=6$ אם ורק אם $(n-3)(n+2)=0$, כלומר $n=3$ או $n=-2$. לכן
          $f^{-1}(\{2,6\})=\{-1,2\}\cup\{-2,3\}=\{-2,-1,2,3\}$, גדולה מ-$C$. ו-$f$ אינה חד-חד-ערכית: $f(0)=f(1)$.
      - kind: check
        text: >-
          $f(-1)=1+1=2$, $f(-2)=4+2=6$. ו-$C\subseteq f^{-1}(f(C))$, כמו בטענה 0.8.5(א); השוויון נכשל כי $f$ אינה
          חד-חד-ערכית (משפט 0.8.7(ג)).
      - kind: result
        text: >-
          $f(\{0,1,2,3\})=\{0,2,6\}$, $f^{-1}(\{0\})=\{0,1\}$, $f^{-1}(\{2\})=\{-1,2\}$, $f^{-1}(\{1,3\})=\emptyset$,
          $f^{-1}(f(C))=\{-2,-1,2,3\}$; $f$ אינה חד-חד-ערכית.

  - id: W-0.8-04
    level: mid
    objectives: [OBJ-0.8-1, OBJ-0.8-2]
    prompt: >-
      תהי $f:\mathbb{R}\to\mathbb{R}$, $f(x)=x^3+1$. הוכיחו ש-$f$ חד-חד-ערכית ועל, מצאו את $f^{-1}$, וחשבו את
      $f^{-1}(9)$ ואת $f^{-1}(0)$. (מותר להשתמש בעובדה המקובלת (ה) משיעור 0.1: לכל מספר ממשי יש שורש שלישי ממשי
      יחיד.)
    answer: >-
      $f^{-1}(y)=\sqrt[3]{y-1}$, $f^{-1}(9)=2$, $f^{-1}(0)=-1$.
    solution:
      - kind: idea
        text: >-
          חד-חד-ערכיות: מ-$x_1^3=x_2^3$ צריך להסיק $x_1=x_2$, בעזרת הפירוק של הפרש חזקות שלישיות. "על": פותרים את
          $x^3+1=y$.
      - kind: step
        text: >-
          חד-חד-ערכית: נניח $x_1^3+1=x_2^3+1$, כלומר $x_1^3-x_2^3=0$. לפי הפירוק
          $x_1^3-x_2^3=(x_1-x_2)(x_1^2+x_1x_2+x_2^2)$, אחד הגורמים אפס.
      - kind: step
        text: >-
          נראה שהגורם השני אינו שלילי, בהשלמה לריבוע כמו בתיכון. מסתכלים עליו כעל ביטוי ריבועי ב-$x_1$:
          $x_1^2+x_2x_1=\left(x_1+\frac{x_2}{2}\right)^2-\frac{x_2^2}{4}$, ולכן
          $x_1^2+x_1x_2+x_2^2=\left(x_1+\frac{x_2}{2}\right)^2-\frac{x_2^2}{4}+x_2^2=\left(x_1+\frac{x_2}{2}\right)^2+\frac34x_2^2$,
          סכום של שני מספרים אי-שליליים.
          הוא אפס רק כששניהם אפס, כלומר $x_2=0$ ואז גם $x_1=0$; וגם אז $x_1=x_2$. אחרת הגורם הראשון אפס, ו-$x_1=x_2$.
      - kind: step
        text: >-
          "על": יהי $y\in\mathbb{R}$. נבחר $x=\sqrt[3]{y-1}$, מספר ממשי. אז $f(x)=(y-1)+1=y$.
      - kind: computation
        text: >-
          ה-$x$ הזה הוא המקור היחיד של $y$, ולכן $f^{-1}(y)=\sqrt[3]{y-1}$. $f^{-1}(9)=\sqrt[3]{8}=2$ ו-$f^{-1}(0)=\sqrt[3]{-1}=-1$.
      - kind: check
        text: >-
          $f(2)=8+1=9$ ו-$f(-1)=-1+1=0$. ו-$f^{-1}(f(x))=\sqrt[3]{x^3}=x$ לכל $x$ ממשי, כי לשורש השלישי, בניגוד
          לשורש הריבועי, אין בעיית סימן.
      - kind: result
        text: >-
          $f$ חד-חד-ערכית ועל, $f^{-1}(y)=\sqrt[3]{y-1}$, $f^{-1}(9)=2$, $f^{-1}(0)=-1$.

  - id: W-0.8-05
    level: mid
    qualitative: true
    objectives: [OBJ-0.8-1]
    prompt: >-
      בכל אחד מהסעיפים (א)–(ג) תנו דוגמה, והוכיחו שהיא מקיימת את הנדרש.

      (א) פונקציה $f:\mathbb{N}\to\mathbb{N}$ שהיא חד-חד-ערכית ואינה על.

      (ב) פונקציה $f:\mathbb{N}\to\mathbb{N}$ שהיא על ואינה חד-חד-ערכית.

      (ג) פונקציה $f:\mathbb{N}\to\mathbb{N}$ חד-חד-ערכית ועל שאינה הזהות.

      (ד) תהי $A$ קבוצה עם $n$ איברים ($n\in\mathbb{N}$), ויהי $a\in A$. הוכיחו שאין פונקציה חד-חד-ערכית מ-$A$
      אל $A\setminus\{a\}$, והראו שהטענה נכשלת עבור $A=\mathbb{N}$ ו-$a=1$.
    answer: >-
      (א) $f(n)=n+1$. (ב) $f(1)=1$ ו-$f(n)=n-1$ לכל $n\ge2$. (ג) מחליפים כל זוג: $f(n)=n+1$ ל-$n$ אי-זוגי ו-$f(n)=n-1$
      ל-$n$ זוגי. (ד) אילו הייתה כזו $f$, ההרכבה עם ההכלה $A\setminus\{a\}\to A$ הייתה חד-חד-ערכית מ-$A$ אל $A$
      שאינה מקבלת את $a$, בסתירה למשפט 0.8.18; ב-$\mathbb{N}$, $n\mapsto n+1$ היא פונקציה כזו.
    solution:
      - kind: step
        text: >-
          (א) $f(n)=n+1$: אם $n+1=m+1$ אז $n=m$, ולכן חד-חד-ערכית. ל-$1$ אין מקור, כי $n+1\ge2$, ולכן אינה על. זה
          המעבר בין החדרים במלון של השיעור.
      - kind: step
        text: >-
          (ב) $f(1)=1$, ו-$f(n)=n-1$ לכל $n\ge2$; הערכים טבעיים, כי $n-1\ge1$ כש-$n\ge2$. על: לכל $m\in\mathbb{N}$
          מתקיים $m+1\ge2$ ו-$f(m+1)=m$. לא חד-חד-ערכית: $f(1)=f(2)=1$ ו-$1\ne2$.
      - kind: step
        text: >-
          (ג) $f(n)=n+1$ כש-$n$ אי-זוגי, ו-$f(n)=n-1$ כש-$n$ זוגי ($1\leftrightarrow2$, $3\leftrightarrow4$, …). כל
          $n\in\mathbb{N}$ זוגי או אי-זוגי (חלוקה עם שארית ב-$2$, עובדה מקובלת (ג)), וזוגי טבעי הוא לפחות $2$, ולכן
          $f(n)\in\mathbb{N}$. אם $n$ אי-זוגי, $n+1$ זוגי ו-$f(f(n))=(n+1)-1=n$; אם $n$ זוגי, $n-1$ אי-זוגי
          ו-$f(f(n))=(n-1)+1=n$. לכן $f\circ f=\mathrm{id}_{\mathbb{N}}$: $f$ היא הפוכה של עצמה, ולפי משפט 0.8.13
          היא חד-חד-ערכית ועל. והיא אינה הזהות, כי $f(1)=2$.
      - kind: step
        text: >-
          (ד) נניח בשלילה ש-$f:A\to A\setminus\{a\}$ חד-חד-ערכית, ותהי $\iota:A\setminus\{a\}\to A$, $\iota(x)=x$,
          שהיא חד-חד-ערכית. לפי משפט 0.8.10(א), $\iota\circ f:A\to A$ חד-חד-ערכית. ל-$A$ יש $n$ איברים, ולפי משפט
          0.8.18 (עם $B=A$) $\iota\circ f$ היא על. לכן יש $x\in A$ עם $a=\iota(f(x))=f(x)$; אבל $f(x)\in
          A\setminus\{a\}$, כלומר $f(x)\ne a$. סתירה.
      - kind: check
        text: >-
          ב-$\mathbb{N}$ ההוכחה של (ד) נעצרת בדיוק במשפט 0.8.18, שדורש קבוצה סופית; ואכן הפונקציה של (א) היא פונקציה
          חד-חד-ערכית מ-$\mathbb{N}$ אל $\mathbb{N}\setminus\{1\}$, כי $n+1\ge2$. לפי מסקנה 0.8.19, $\mathbb{N}$
          אינסופית, ולכן אין כאן סתירה.
      - kind: result
        text: >-
          (א) $n+1$. (ב) $1\mapsto1$, $n\mapsto n-1$. (ג) החלפת זוגות $1\leftrightarrow2,\ 3\leftrightarrow4,\dots$
          (ד) אין פונקציה חד-חד-ערכית מקבוצה סופית אל עצמה פחות איבר; ב-$\mathbb{N}$ יש: $n\mapsto n+1$.

  - id: W-0.8-06
    level: mid
    objectives: [OBJ-0.8-3]
    prompt: >-
      תהי $f:A\to B$, ויהיו $C\subseteq A$ ו-$D\subseteq B$. הוכיחו: $f(C)\subseteq D$ אם ורק אם $C\subseteq f^{-1}(D)$.
    answer: >-
      שני הצדדים אומרים אותו דבר: לכל $x\in C$, $f(x)\in D$.
    solution:
      - kind: idea
        text: >-
          מתרגמים כל צד לפי ההגדרות: "$f(C)\subseteq D$" אומר שכל ערך של נקודה של $C$ נמצא ב-$D$; "$C\subseteq f^{-1}(D)$"
          אומר שכל נקודה של $C$ נשלחת לתוך $D$. אלה שתי דרכים לומר את אותו משפט.
      - kind: step
        text: >-
          ($\Rightarrow$) נניח $f(C)\subseteq D$, ויהי $x\in C$. אז $f(x)\in f(C)$ (הגדרה 0.8.2), ולכן $f(x)\in D$. לפי
          הגדרת המקור, $x\in f^{-1}(D)$.
      - kind: step
        text: >-
          ($\Leftarrow$) נניח $C\subseteq f^{-1}(D)$, ויהי $y\in f(C)$: $y=f(x)$ עבור $x\in C$. אז $x\in f^{-1}(D)$,
          כלומר $f(x)\in D$, ולכן $y\in D$.
      - kind: check
        text: >-
          עם $D=f(C)$ הטענה נותנת את טענה 0.8.5(א), $C\subseteq f^{-1}(f(C))$; ועם $C=f^{-1}(D)$ היא נותנת את
          0.8.5(ב), $f(f^{-1}(D))\subseteq D$.
      - kind: result
        text: >-
          $f(C)\subseteq D$ אם ורק אם $C\subseteq f^{-1}(D)$.

  - id: W-0.8-07
    level: mid
    qualitative: true
    objectives: [OBJ-0.8-3]
    prompt: >-
      (א) הוכיחו: בכל קבוצה של שישה מספרים מתוך $\{1,2,\dots,10\}$ יש שני מספרים שסכומם $11$.

      (ב) הראו שעם חמישה מספרים הטענה אינה נכונה.
    answer: >-
      (א) מחלקים את $\{1,\dots,10\}$ לחמישה זוגות שסכום כל אחד $11$; פונקציה מקבוצה עם $6$ איברים אל $5$ זוגות אינה
      חד-חד-ערכית. (ב) $\{1,2,3,4,5\}$.
    solution:
      - kind: idea
        text: >-
          השובכים הם חמשת הזוגות $\{1,10\},\{2,9\},\{3,8\},\{4,7\},\{5,6\}$, והיונים הם ששת המספרים. שני מספרים באותו
          שובך הם שני האיברים של אותו זוג, וסכומם $11$.
      - kind: step
        text: >-
          (א) תהי $S\subseteq\{1,\dots,10\}$ עם $6$ איברים. כל $k\in\{1,\dots,10\}$ נמצא בזוג אחד בדיוק מהחמישה: בזוג
          $\{k,11-k\}$. נגדיר $\pi:S\to\{1,2,3,4,5\}$, $\pi(k)=\min(k,11-k)$, מספר הזוג של $k$. זו פונקציה אל
          $\{1,\dots,5\}$: אם $k\le5$, אז $11-k\ge6>k$, ולכן $\pi(k)=k\in\{1,\dots,5\}$; ואם $k\ge6$ (אין שלם בין $5$
          ל-$6$, עובדה מקובלת (ג)), אז $11-k\le5<k$ ו-$11-k\ge1$ (כי $k\le10$), ולכן $\pi(k)=11-k\in\{1,\dots,5\}$.
      - kind: theorem
        text: >-
          $6>5$, ולפי מסקנה 0.8.18א(ג) $\pi$ אינה חד-חד-ערכית: יש $a\ne b$ ב-$S$ עם $\pi(a)=\pi(b)=m$. שניהם בזוג
          $\{m,11-m\}$, ושונים זה מזה, ולכן אחד מהם $m$ והשני $11-m$, וסכומם $11$.
      - kind: computation
        text: >-
          (ב) ב-$\{1,2,3,4,5\}$ הסכום הגדול ביותר של שני מספרים שונים הוא $4+5=9<11$.
      - kind: check
        text: >-
          ב-(ב) לכל מספר שובך משלו ($\pi$ שם חד-חד-ערכית), ולכן ההוכחה של (א) נעצרת בדיוק בצעד שבו השתמשנו ב-$6>5$.
      - kind: result
        text: >-
          (א) בכל שישה מספרים מ-$\{1,\dots,10\}$ יש שניים שסכומם $11$. (ב) עם חמישה לא: $\{1,2,3,4,5\}$.

  - id: W-0.8-08
    level: exam
    objectives: [OBJ-0.8-1, OBJ-0.8-2]
    prompt: >-
      תהי $f:\mathbb{R}\setminus\{-2\}\to\mathbb{R}$, $f(x)=\frac{x-1}{x+2}$.

      (א) הוכיחו ש-$f$ חד-חד-ערכית.

      (ב) הוכיחו שהתמונה של $f$ היא $\mathbb{R}\setminus\{1\}$. האם $f$ על?

      (ג) נתייחס ל-$f$ כפונקציה מ-$\mathbb{R}\setminus\{-2\}$ אל $\mathbb{R}\setminus\{1\}$. מצאו את ההפוכה שלה,
      וחשבו את $f^{-1}(0)$ ואת $f^{-1}(2)$.
    answer: >-
      (א) $f(x)=1-\frac{3}{x+2}$. (ב) $f$ אינה "על": $1$ נמצא בטווח ואינו מתקבל. (ג) $f^{-1}(y)=\frac{1+2y}{1-y}$,
      $f^{-1}(0)=1$, $f^{-1}(2)=-5$.
    solution:
      - kind: idea
        text: >-
          חילוק עם שארית: $\frac{x-1}{x+2}=\frac{(x+2)-3}{x+2}=1-\frac{3}{x+2}$. מהצורה הזו רואים גם חד-חד-ערכיות
          וגם שהערך $1$ חסר, כי $\frac{3}{x+2}$ אינו אפס אף פעם.
      - kind: step
        text: >-
          (א) נניח $f(x_1)=f(x_2)$, כלומר $1-\frac{3}{x_1+2}=1-\frac{3}{x_2+2}$. אז $\frac{3}{x_1+2}=\frac{3}{x_2+2}$,
          ולכן $x_1+2=x_2+2$ (שני מספרים שונים מאפס עם אותו הופכי שווים), כלומר $x_1=x_2$.
      - kind: step
        text: >-
          (ב) (⊆) לכל $x$ בתחום $\frac{3}{x+2}\ne0$, ולכן $f(x)\ne1$: התמונה מוכלת ב-$\mathbb{R}\setminus\{1\}$.
      - kind: step
        text: >-
          (⊇) יהי $y\ne1$. מחפשים $x\ne-2$ עם $\frac{x-1}{x+2}=y$. כופלים ב-$x+2$: $x-1=yx+2y$, כלומר $x(1-y)=1+2y$,
          ומכיוון ש-$y\ne1$, $x=\frac{1+2y}{1-y}$. נבדוק ש-$x\ne-2$: אילו $\frac{1+2y}{1-y}=-2$, היה $1+2y=-2+2y$,
          כלומר $1=-2$, סתירה. לכן $x$ בתחום ו-$f(x)=y$.
      - kind: step
        text: >-
          לכן התמונה היא $\mathbb{R}\setminus\{1\}$. הטווח הוא $\mathbb{R}$, ו-$1$ בטווח ואין לו מקור: $f$ אינה על.
      - kind: computation
        text: >-
          (ג) עם הטווח $\mathbb{R}\setminus\{1\}$ הפונקציה חד-חד-ערכית (א) ועל (ב), ולכן יש לה הפוכה. ה-$x$ שמצאנו
          ב-(ב) הוא המקור היחיד של $y$: $f^{-1}(y)=\frac{1+2y}{1-y}$. לכן $f^{-1}(0)=1$ ו-$f^{-1}(2)=\frac{5}{-1}=-5$.
      - kind: check
        text: >-
          $f(1)=\frac{0}{3}=0$ ו-$f(-5)=\frac{-6}{-3}=2$. וזו דוגמה למה שהשיעור אמר: אותו כלל עם טווח אחר הוא פונקציה
          אחרת, וכאן הטווח הוא שמכריע אם יש הפוכה.
      - kind: result
        text: >-
          (א) חד-חד-ערכית. (ב) התמונה $\mathbb{R}\setminus\{1\}$, ולכן $f$ אינה "על" (הטווח הוא $\mathbb{R}$). (ג)
          $f^{-1}(y)=\frac{1+2y}{1-y}$, $f^{-1}(0)=1$, $f^{-1}(2)=-5$.

  - id: W-0.8-09
    level: exam
    qualitative: true
    objectives: [OBJ-0.8-2]
    prompt: >-
      יהיו $f:A\to B$ ו-$g,h:B\to C$.

      (א) הוכיחו: אם $f$ היא "על" ו-$g\circ f=h\circ f$, אז $g=h$.

      (ב) הוכיחו: אם $k:C\to D$ חד-חד-ערכית ו-$k\circ g=k\circ h$, אז $g=h$.

      (ג) הפריכו את (א) בלי ההנחה ש-$f$ היא "על": מצאו $f$, $g$, $h$ עם $g\circ f=h\circ f$ ו-$g\ne h$.
    answer: >-
      (א) כל $y\in B$ הוא $f(x)$, ו-$g(f(x))=h(f(x))$. (ב) $k(g(y))=k(h(y))$ גורר $g(y)=h(y)$. (ג) $A=\{1\}$,
      $B=C=\{1,2\}$, $f(1)=1$, $g=\mathrm{id}_B$, $h(1)=h(2)=1$: $g\circ f=h\circ f$ אבל $g(2)=2\ne1=h(2)$.
    solution:
      - kind: goal
        text: >-
          לפי הגדרה 0.8.1, ל-$g$ ול-$h$ כבר אותו תחום $B$ ואותו טווח $C$, ולכן $g=h$ פירושו $g(y)=h(y)$ לכל $y\in B$.
      - kind: idea
        text: >-
          $g\circ f=h\circ f$ אומר ש-$g$ ו-$h$ מסכימות על כל ערך של $f$, כלומר על $f(A)$; "על" אומר ש-$f(A)$ היא כל
          $B$. ב-(ב) מבטלים את $k$ נקודה אחר נקודה, בעזרת החד-חד-ערכיות.
      - kind: step
        text: >-
          (א) יהי $y\in B$. כיוון ש-$f$ היא "על", יש $x\in A$ עם $f(x)=y$. לכן, לפי הגדרה 0.8.8 וההנחה,
          $g(y)=g(f(x))=(g\circ f)(x)=(h\circ f)(x)=h(f(x))=h(y)$.
      - kind: step
        text: >-
          (ב) יהי $y\in B$. לפי ההנחה $k(g(y))=(k\circ g)(y)=(k\circ h)(y)=k(h(y))$. כיוון ש-$k$ חד-חד-ערכית,
          $g(y)=h(y)$.
      - kind: computation
        text: >-
          (ג) $A=\{1\}$, $B=C=\{1,2\}$, $f(1)=1$, $g=\mathrm{id}_B$, ו-$h(1)=h(2)=1$. אז $(g\circ f)(1)=g(1)=1$
          ו-$(h\circ f)(1)=h(1)=1$, ולכן $g\circ f=h\circ f$ (לשתיהן התחום $\{1\}$ והטווח $C$). אבל $g(2)=2\ne1=h(2)$,
          ולכן $g\ne h$.
      - kind: check
        text: >-
          בדוגמה של (ג) $f$ אינה "על" (ל-$2$ אין מקור), ו-$g$ ו-$h$ נבדלות בדיוק ב-$2$, מחוץ ל-$f(A)$: זה מה שהרעיון
          צפה. ו-(ב) בסדר האחר נכשל באותה דרך: עם $k:\{1,2\}\to\{1\}$ (שאינה חד-חד-ערכית) ו-$g,h:\{1\}\to\{1,2\}$,
          $g(1)=1$, $h(1)=2$, מתקיים $k\circ g=k\circ h$ ו-$g\ne h$.
      - kind: result
        text: >-
          פונקציה "על" אפשר לבטל מימין ($g\circ f=h\circ f\Rightarrow g=h$), ופונקציה חד-חד-ערכית אפשר לבטל משמאל
          ($k\circ g=k\circ h\Rightarrow g=h$); בלי "על" הביטול מימין נכשל.

  - id: W-0.8-10
    level: exam
    objectives: [OBJ-0.8-3]
    prompt: >-
      תהי $f:A\to B$, ויהיו $C\subseteq A$ ו-$D\subseteq B$.

      (א) הוכיחו: $f(f^{-1}(D))=D\cap f(A)$.

      (ב) הוכיחו: $f(C)\cap D=f\big(C\cap f^{-1}(D)\big)$.

      (ג) הוכיחו: $f(f^{-1}(D))=D$ אם ורק אם $D\subseteq f(A)$, והסיקו מכאן שוב את משפט 0.8.7(ד).
    answer: >-
      (א)+(ב) בהכלה דו-כיוונית, במעקב אחרי $x$ עם $f(x)=y$. (ג) לפי (א) השוויון הוא $D\cap f(A)=D$, וזה שקול
      ל-$D\subseteq f(A)$; עם $D=B$ מקבלים: השוויון לכל $D$ שקול ל-$f(A)=B$, כלומר ל"על".
    solution:
      - kind: idea
        text: >-
          כל אחד מהאגפים הוא "ערכים $f(x)$ של נקודות $x$ שמקיימות תנאי". עוקבים אחרי ה-$x$: "$x\in f^{-1}(D)$" אומר
          בדיוק "$f(x)\in D$" (הגדרה 0.8.2).
      - kind: step
        text: >-
          (א) (⊆) יהי $y\in f(f^{-1}(D))$: $y=f(x)$ עם $x\in f^{-1}(D)$, כלומר $f(x)\in D$. לכן $y\in D$, וגם $y\in
          f(A)$, כי $x\in A$. (⊇) יהי $y\in D\cap f(A)$: $y=f(x)$ עם $x\in A$, ו-$f(x)=y\in D$, כלומר $x\in
          f^{-1}(D)$. לכן $y\in f(f^{-1}(D))$.
      - kind: step
        text: >-
          (ב) (⊆) יהי $y\in f(C)\cap D$: $y=f(x)$ עם $x\in C$, ו-$f(x)=y\in D$, כלומר $x\in f^{-1}(D)$. לכן $x\in
          C\cap f^{-1}(D)$, ו-$y\in f\big(C\cap f^{-1}(D)\big)$. (⊇) יהי $y=f(x)$ עם $x\in C$ ו-$x\in f^{-1}(D)$. אז
          $y\in f(C)$, ו-$y=f(x)\in D$.
      - kind: step
        text: >-
          (ג) לפי (א), $f(f^{-1}(D))=D$ אם ורק אם $D\cap f(A)=D$. אם $D\cap f(A)=D$, אז $D=D\cap f(A)\subseteq f(A)$.
          ולהפך, אם $D\subseteq f(A)$: תמיד $D\cap f(A)\subseteq D$, וכל $y\in D$ נמצא גם ב-$f(A)$, ולכן $D\subseteq
          D\cap f(A)$; לפי טענה 0.7.3(ד) יש שוויון.
      - kind: theorem
        text: >-
          משפט 0.8.7(ד) שוב: אם $f$ היא "על", אז $f(A)=B$ (משפט 0.8.7(א)), ולכן $D\subseteq f(A)$ לכל $D\subseteq
          B$, ו-(ג) נותן שוויון. ולהפך, אם $f(f^{-1}(D))=D$ לכל $D$, אז בפרט עבור $D=B$, ולפי (ג) $B\subseteq f(A)$;
          כיוון ש-$f(A)\subseteq B$ תמיד, $f(A)=B$, ו-$f$ היא "על".
      - kind: check
        text: >-
          $f:\mathbb{R}\to\mathbb{R}$, $f(x)=x^2$, ו-$D=[-1,4]$. התמונה היא $f(\mathbb{R})=[0,\infty)$ (כל $x^2\ge0$, וכל
          $y\ge0$ הוא $(\sqrt y)^2$), ולכן לפי (א) $f(f^{-1}(D))=[0,4]\ne D$: ל-$-1\in D$ אין מקור. ב-(ב) עם
          $C=[0,\infty)$ ו-$D=\{4\}$: $f(C)\cap D=\{4\}$, ו-$C\cap f^{-1}(\{4\})=[0,\infty)\cap\{-2,2\}=\{2\}$, ש-$f$
          שולחת אל $\{4\}$.
      - kind: result
        text: >-
          $f(f^{-1}(D))=D\cap f(A)$ ו-$f(C)\cap D=f(C\cap f^{-1}(D))$; לכן $f(f^{-1}(D))=D$ בדיוק כש-$D\subseteq f(A)$,
          ולכל $D$ בדיוק כש-$f$ "על".

challenge:
  - id: W-0.8-c1
    stars: 1
    objectives: [OBJ-0.8-1, OBJ-0.8-2]
    prompt: >-
      הוכיחו שהפונקציה $f:\mathbb{R}\setminus\{1\}\to\mathbb{R}\setminus\{1\}$,
      $f(x)=\left(\frac{x+1}{x-1}\right)^3$, חד-חד-ערכית ועל, ומצאו את ההפוכה שלה. (רמז: כתבו את $f$ כהרכבה של שתי
      פונקציות פשוטות.)
    answer: >-
      $f=c\circ h$ עם $h(x)=\frac{x+1}{x-1}$ ו-$c(t)=t^3$, שתיהן חד-חד-ערכיות ועל מ-$\mathbb{R}\setminus\{1\}$ אל
      עצמה. $f^{-1}(y)=\frac{\sqrt[3]{y}+1}{\sqrt[3]{y}-1}$.
    solution:
      - kind: idea
        text: >-
          $f=c\circ h$, כאשר $h(x)=\frac{x+1}{x-1}$ ו-$c(t)=t^3$. לפי מסקנה 0.8.14(ב), הרכבה של שתי פונקציות
          חד-חד-ערכיות ועל היא חד-חד-ערכית ועל, וההפוכה שלה היא $h^{-1}\circ c^{-1}$. לכן מספיק לטפל בכל אחת לחוד,
          כפונקציה מ-$\mathbb{R}\setminus\{1\}$ אל $\mathbb{R}\setminus\{1\}$.
      - kind: step
        text: >-
          $h:\mathbb{R}\setminus\{1\}\to\mathbb{R}\setminus\{1\}$ מוגדרת היטב: $h(x)=1+\frac{2}{x-1}$, ו-$\frac{2}{x-1}\ne0$,
          ולכן $h(x)\ne1$. חד-חד-ערכית: $1+\frac{2}{x_1-1}=1+\frac{2}{x_2-1}$ גורר $x_1-1=x_2-1$.
      - kind: step
        text: >-
          $h$ היא "על": יהי $y\ne1$. מ-$\frac{x+1}{x-1}=y$ מקבלים $x+1=yx-y$, כלומר $x(y-1)=y+1$, ו-$x=\frac{y+1}{y-1}$. זה
          מוגדר כי $y\ne1$, ו-$x\ne1$ כי $\frac{y+1}{y-1}=1$ היה נותן $1=-1$. לכן $h^{-1}(y)=\frac{y+1}{y-1}$: באופן
          מפתיע, $h$ היא ההפוכה של עצמה.
      - kind: step
        text: >-
          הצמצום של $c$ ל-$\mathbb{R}\setminus\{1\}$: $c(t)=t^3$ חד-חד-ערכית ועל מ-$\mathbb{R}$ אל $\mathbb{R}$ (כמו ב-W-0.8-04,
          עם השורש השלישי). המקור היחיד של $1$ הוא $1$, ולכן $c$ שולחת את $\mathbb{R}\setminus\{1\}$ אל
          $\mathbb{R}\setminus\{1\}$, ושם היא עדיין חד-חד-ערכית ועל: לכל $s\ne1$ המקור $\sqrt[3]{s}$ שונה מ-$1$.
      - kind: step
        text: >-
          לכן, לפי מסקנה 0.8.14(ב), $f=c\circ h$ חד-חד-ערכית ועל, וההפוכה מבטלת קודם את $c$ ואחר כך את $h$:
          $f^{-1}(y)=h^{-1}\big(c^{-1}(y)\big)=\frac{\sqrt[3]{y}+1}{\sqrt[3]{y}-1}$.
      - kind: check
        text: >-
          $f(3)=\left(\frac42\right)^3=8$, ו-$f^{-1}(8)=\frac{2+1}{2-1}=3$. $f(0)=(-1)^3=-1$, ו-$f^{-1}(-1)=\frac{-1+1}{-1-1}=0$.
      - kind: result
        text: >-
          $f$ חד-חד-ערכית ועל, ו-$f^{-1}(y)=\frac{\sqrt[3]{y}+1}{\sqrt[3]{y}-1}$.
    source:
      name: 'Richard Hammack, Book of Proof (third edition, edition 3.4)'
      year: 2018
      problem: 'Chapter 12, Section 12.2, Exercise 10'
      url: 'https://richardhammack.github.io/BookOfProof/Main.pdf'
      verified: '2026-11-10'
      adapted: true

  - id: W-0.8-c2
    stars: 1
    objectives: [OBJ-0.8-3]
    prompt: >-
      תהי $f:A\to B$, ויהיו $C\subseteq A$ ו-$D\subseteq B$. לפי טענה 0.8.5, $f^{-1}(f(C))$ יכולה להיות גדולה
      מ-$C$, ו-$f(f^{-1}(D))$ קטנה מ-$D$. הוכיחו או הפריכו:

      (א) $f\big(f^{-1}(f(C))\big)=f(C)$.

      (ב) $f^{-1}\big(f(f^{-1}(D))\big)=f^{-1}(D)$.
    answer: >-
      שתיהן נכונות, לכל פונקציה. בכל אחת הכלה אחת היא טענה 0.8.5 על הקבוצה הפנימית, והשנייה היא טענה 0.8.5
      על הקבוצה המקורית, אחרי הפעלה של $f$ (טענה 0.8.3(א)) או של $f^{-1}$ (טענה 0.8.4(א)).
    solution:
      - kind: idea
        text: >-
          הלוך-ושוב אחד מקלקל, אבל הקלקול "נבלע" בהפעלה השלישית. בכל שוויון יש שתי הכלות, וכל אחת היא טענה 0.8.5
          על קבוצה מתאימה, לפעמים אחרי שמפעילים על שני הצדדים את $f$ או את $f^{-1}$, ששומרות על הכלה.
      - kind: step
        text: >-
          (א) (⊆) נציב בטענה 0.8.5(ב) את הקבוצה $f(C)\subseteq B$ במקום $D$: $f\big(f^{-1}(f(C))\big)\subseteq f(C)$.
      - kind: step
        text: >-
          (א) (⊇) לפי טענה 0.8.5(א), $C\subseteq f^{-1}(f(C))$. לפי טענה 0.8.3(א), הפעלת $f$ שומרת על הכלה:
          $f(C)\subseteq f\big(f^{-1}(f(C))\big)$.
      - kind: step
        text: >-
          (ב) (⊆) לפי טענה 0.8.5(ב), $f(f^{-1}(D))\subseteq D$. לפי טענה 0.8.4(א), הפעלת $f^{-1}$ שומרת על הכלה:
          $f^{-1}\big(f(f^{-1}(D))\big)\subseteq f^{-1}(D)$.
      - kind: step
        text: >-
          (ב) (⊇) נציב בטענה 0.8.5(א) את הקבוצה $f^{-1}(D)\subseteq A$ במקום $C$:
          $f^{-1}(D)\subseteq f^{-1}\big(f(f^{-1}(D))\big)$.
      - kind: check
        text: >-
          $A=\{1,2\}$, $B=\{a,b\}$, $f(1)=f(2)=a$. עם $C=\{1\}$: $f^{-1}(f(C))=f^{-1}(\{a\})=\{1,2\}\ne C$, ובכל זאת
          $f(\{1,2\})=\{a\}=f(C)$. עם $D=B$: $f(f^{-1}(B))=f(A)=\{a\}\ne D$, ובכל זאת $f^{-1}(\{a\})=A=f^{-1}(B)$. ושתי
          הזהויות נבדקו על כל הפונקציות בין קבוצות קטנות ועל כל התת-קבוצות שלהן.
      - kind: result
        text: >-
          שתי הזהויות נכונות לכל $f:A\to B$, $C\subseteq A$, $D\subseteq B$.
    source:
      name: 'Richard Hammack, Book of Proof (third edition, edition 3.4)'
      year: 2018
      problem: 'Chapter 12, Section 12.6, Exercises 13 and 14'
      url: 'https://richardhammack.github.io/BookOfProof/Main.pdf'
      verified: '2026-11-10'
      adapted: true
