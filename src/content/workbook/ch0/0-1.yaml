# Workbook of lesson 0.1 — how to study in this course, and how to read a proof.
# Objectives (src/course.ts):
#   OBJ-0.1-1  tell a definition, a claim, a theorem, a proof and an example apart in a mathematical text
#   OBJ-0.1-2  read a short proof line by line and say what justifies each step
#   OBJ-0.1-3  plan self-study: understanding questions after each lesson, review and exam questions per chapter
# Proofs cite the lesson's numbered results (הגדרה 0.1.1 … מסקנה 0.1.11) and its accepted facts (א)–(ו).
# Every number below was recomputed by a command (npx tsx) on 2026-11-10.
lesson: '0.1'
practice:
  - id: W-0.1-01
    level: basic
    qualitative: true
    objectives: [OBJ-0.1-1]
    prompt: >-
      קראו את הקטע:

      (1) מספר שלם $n$ נקרא **ריבוע שלם** אם קיים מספר שלם $m$ כך ש-$n=m^2$.

      (2) אם $a$ ו-$b$ ריבועים שלמים, אז גם $ab$ ריבוע שלם.

      (3) למשל, $4=2^2$ ו-$9=3^2$, ו-$4\cdot 9=36=6^2$.

      (4) נניח ש-$a=m^2$ ו-$b=p^2$ עם $m$ ו-$p$ שלמים. אז $ab=m^2p^2=(mp)^2$, ו-$mp$ שלם.

      (א) מה התפקיד של כל אחד מהקטעים (1) עד (4)?

      (ב) מהן ההנחות של (2), ומהי המסקנה שלו?

      (ג) האם (3) מוכיח את (2)? נמקו.
    answer: >-
      (א) (1) הגדרה, (2) טענה, (3) דוגמה, (4) הוכחה.

      (ב) ההנחות: $a$ ו-$b$ ריבועים שלמים. המסקנה: $ab$ ריבוע שלם.

      (ג) לא: (3) בודק מקרה אחד, והטענה מדברת על כל שני ריבועים שלמים.
    solution:
      - kind: idea
        text: >-
          מחפשים את המילים שמסמנות תפקיד: "נקרא" מסמן הגדרה, "אם… אז" בלי נימוק מסמן טענה, "למשל" מסמן דוגמה,
          ו"נניח… אז" מסמן הוכחה.
      - kind: step
        text: >-
          (א) (1) נותן שם, "ריבוע שלם", לתכונה של מספר: **הגדרה**. אין בו מה להוכיח. (2) אומר שמשהו נכון לכל שני
          ריבועים שלמים: **טענה**, שצריך להוכיח. (3) מראה מקרה אחד, $a=4$ ו-$b=9$: **דוגמה**. (4) מתחיל במה
          שהטענה מניחה ומגיע למה שהיא אומרת: **הוכחה** של (2).
      - kind: step
        text: >-
          (ב) הטענה (2) היא מהצורה "אם (הנחות) אז (מסקנה)". ההנחות: $a$ ריבוע שלם, ו-$b$ ריבוע שלם. המסקנה: $ab$
          ריבוע שלם.
      - kind: step
        text: >-
          (ג) הדוגמה בודקת זוג אחד. הטענה מדברת על אינסוף זוגות, ובדיקה של זוג אחד, או של אלף זוגות, לא אומרת
          כלום על הזוגות שלא נבדקו. מה שמוכיח את (2) הוא (4), שעובד עם $m$ ו-$p$ כלליים: $m^2p^2=(mp)^2$ לפי
          חוקי החילוף והקיבוץ, עובדה מקובלת (א), ו-$mp$ שלם כי השלמים סגורים לכפל, גם לפי (א).
      - kind: check
        text: >-
          הדוגמה מתאימה להוכחה: עם $m=2$ ו-$p=3$, ההוכחה נותנת $ab=(mp)^2=6^2=36$, ואכן $4\cdot 9=36$.
      - kind: result
        text: >-
          (1) הגדרה, (2) טענה עם הנחות "$a$, $b$ ריבועים שלמים" ומסקנה "$ab$ ריבוע שלם", (3) דוגמה שאינה הוכחה,
          (4) הוכחה.

  - id: W-0.1-02
    level: basic
    objectives: [OBJ-0.1-2]
    prompt: >-
      **טענה:** לכל $a,b\in\mathbb Z$, אם $a$ ו-$b$ אי-זוגיים, אז $a^2+b^2$ זוגי.

      (א) לכל שורה בהוכחה הבאה, כתבו מה מצדיק אותה (ההנחה, הגדרה, חשבון, עובדה מקובלת או טענה קודמת) ובאילו
      שורות קודמות היא משתמשת.

      (1) נניח ש-$a$ ו-$b$ אי-זוגיים.

      (2) קיימים $k,m\in\mathbb Z$ כך ש-$a=2k+1$ ו-$b=2m+1$.

      (3) $a^2+b^2=4k^2+4k+4m^2+4m+2$.

      (4) $a^2+b^2=2(2k^2+2k+2m^2+2m+1)$.

      (5) $2k^2+2k+2m^2+2m+1\in\mathbb Z$.

      (6) לכן $a^2+b^2$ זוגי.

      (ב) הוכיחו את אותה טענה בשתי שורות, בעזרת טענה 0.1.4 בלבד.
    answer: >-
      (א) (1) ההנחה. (2) הגדרה 0.1.1, על (1). (3) חשבון לפי (א): הצבה מ-(2) ופתיחת סוגריים. (4) חשבון לפי (א):
      גורם משותף 2. (5) עובדה מקובלת (א): השלמים סגורים לחיבור ולכפל. (6) הגדרה 0.1.1, על (4) ו-(5).

      (ב) $a^2=a\cdot a$ ו-$b^2=b\cdot b$ אי-זוגיים לפי טענה 0.1.4(5), ולכן $a^2+b^2$ זוגי לפי טענה 0.1.4(2).
    solution:
      - kind: idea
        text: >-
          לכל שורה שואלים שתי שאלות: מאילו שורות קודמות היא יוצאת, ואיזה כלל מעביר מהן אליה. ב-(ב) מחליפים את
          החשבון בטענה שכבר הוכחה: זו בדיוק המטרה של טענה ממוספרת.
      - kind: step
        text: >-
          (1) היא מה שהטענה נותנת, החלק שאחרי "אם": **ההנחה**. (2) מתרגמת את המילה "אי-זוגי" משורה (1) לנוסחה:
          **הגדרה 0.1.1**. לשני המספרים יש שמות שונים, $k$ ו-$m$, כי אין סיבה שיהיו שווים.
      - kind: computation
        text: >-
          (3) מציבים מ-(2) ופותחים סוגריים: $(2k+1)^2=4k^2+4k+1$ ו-$(2m+1)^2=4m^2+4m+1$, ובסכום
          $4k^2+4k+4m^2+4m+2$. **חשבון לפי (א)**. (4) מוציאים 2 כגורם משותף מכל חמשת המחוברים: **חשבון לפי (א)**.
      - kind: step
        text: >-
          (5) אומרת איזה סוג מספר הוא $2k^2+2k+2m^2+2m+1$: $k$ ו-$m$ שלמים לפי (2), והשלמים סגורים לחיבור ולכפל.
          זו **עובדה מקובלת (א)**, לא חשבון. (6) קוראת את (4) ו-(5) בחזרה במילים: $a^2+b^2$ הוא 2 כפול שלם, וזו
          **הגדרה 0.1.1**.
      - kind: step
        text: >-
          (ב) (1) לפי טענה 0.1.4(5) עם $a$ במקום שני המספרים, $a^2=a\cdot a$ אי-זוגי, ובאותה טענה עם $b$ במקום
          שני המספרים, $b^2$ אי-זוגי. (טענה 0.1.4(5) לא דורשת ששני הגורמים יהיו שונים.) (2) לפי טענה 0.1.4(2),
          סכום של שני אי-זוגיים זוגי, ולכן $a^2+b^2$ זוגי.
      - kind: check
        text: >-
          $a=3$, $b=5$: $9+25=34=2\cdot 17$, ועם $k=1$, $m=2$: $2+2+8+4+1=17$. ושימו לב ש-(ב) קצרה כי טענה 0.1.4
          כבר עשתה את החשבון של (3)–(5) פעם אחת, לכל המספרים.
      - kind: result
        text: >-
          (א) (1) ההנחה; (2) הגדרה 0.1.1; (3), (4) חשבון לפי (א); (5) עובדה מקובלת (א); (6) הגדרה 0.1.1.
          (ב) טענה 0.1.4(5) פעמיים, ואז טענה 0.1.4(2).

  - id: W-0.1-03
    level: basic
    qualitative: true
    objectives: [OBJ-0.1-3]
    prompt: >-
      אילו מהפעולות הבאות הן **לימוד פעיל**, שבודק אם אתם יודעים, ואילו **לימוד סביל**, שרק נותן תחושה שאתם
      יודעים? נמקו כל אחת במשפט.

      (א) לקרוא פעם שנייה את ההסבר בשיעור.

      (ב) לכתוב על דף פתרון לתרגיל מהחוברת, ורק אחר כך לפתוח את הפתרון.

      (ג) לפתוח את הפתרון של דוגמה פתורה לפני שניסיתם אותה.

      (ד) לענות על שאלת הבנה, לסמן "בטוחים" או "לא בטוחים", ולקרוא את המשוב.

      (ה) לחזור לשאלה שטעיתם בה אחרי כמה ימים ולענות עליה מאפס.
    answer: >-
      פעיל: (ב), (ד), (ה). סביל: (א), (ג). (קריאה שנייה היא סבילה, אבל יש לה מקום אחרי טעות, כשקוראים אותה עם
      שאלה מוגדרת.)
    solution:
      - kind: idea
        text: >-
          לימוד פעיל הוא כזה שבו אתם מייצרים תשובה בעצמכם לפני שאתם רואים אותה, ולכן הוא מגלה מה חסר. לימוד סביל
          הוא קריאה של משהו שמישהו אחר כתב.
      - kind: step
        text: >-
          (א) סביל: קריאה חוזרת מרגישה מוכרת, ותחושת המוכר מתחפשת להבנה. היא מועילה כשקוראים עם שאלה מוגדרת, למשל
          אחרי טעות שהמשוב מפנה לחלק הזה.
      - kind: step
        text: >-
          (ב) פעיל: אתם בוחרים בעצמכם מאיפה להתחיל ומה הצעד הבא, כמו במבחן, וההשוואה לפתרון מראה מה היה חסר.
      - kind: step
        text: >-
          (ג) סביל: אחרי שראיתם את הרעיון, אי אפשר לבדוק אם הייתם מוצאים אותו לבד. החלק הקשה כבר נעשה בשבילכם.
      - kind: step
        text: >-
          (ד) פעיל: אתם מתחייבים לתשובה ולרמת ביטחון. טעות כשסימנתם "בטוחים" מגלה תפיסה שגויה, ואת זה קריאה לא
          תגלה.
      - kind: step
        text: >-
          (ה) פעיל: אחרי כמה ימים התשובה כבר לא בזיכרון הקצר, ולכן תשובה נכונה מראה הבנה ולא זיכרון.
      - kind: result
        text: >-
          פעיל: (ב), (ד), (ה). סביל: (א), (ג).

  - id: W-0.1-04
    level: mid
    qualitative: true
    objectives: [OBJ-0.1-2]
    prompt: >-
      **טענה:** לכל מספר ממשי $x\neq 0$, אם $x<1$ אז $\frac1x>1$. סטודנט כתב:

      (1) נניח ש-$x<1$.

      (2) נחלק את שני האגפים ב-$x$ ונקבל $1<\frac1x$.

      (3) כלומר $\frac1x>1$.

      (א) איזה מעבר אינו מוצדק? מה היה צריך לדעת על $x$ כדי שהוא יהיה מוצדק?

      (ב) האם הטענה נכונה? אם לא, תנו דוגמה נגדית.

      (ג) הוסיפו לטענה הנחה שהופכת אותה לנכונה, והוכיחו אותה.
    answer: >-
      (א) המעבר מ-(1) ל-(2): לפי מסקנה 0.1.9(2), חילוק של אי-שוויון ב-$x$ שומר על הכיוון רק אם $x>0$.

      (ב) לא נכונה: $x=-1$ מקיים $x<1$, אבל $\frac1x=-1<1$.

      (ג) "אם $0<x<1$ אז $\frac1x>1$": $\frac1x>0$ לפי מסקנה 0.1.9(2), וכופלים את $x<1$ ב-$\frac1x$.
    solution:
      - kind: idea
        text: >-
          בכל כפל או חילוק של אי-שוויון שואלים מה הסימן של מה שמחלקים בו: לפי מסקנה 0.1.9(2), חילוק במספר חיובי
          שומר על הכיוון, ובמספר שלילי הופך אותו.
      - kind: step
        text: >-
          (א) שורה (2) מחלקת את אי-השוויון $x<1$ ב-$x$. לפי מסקנה 0.1.9(2), חילוק ב-$x>0$ שומר על הכיוון, וחילוק
          ב-$x<0$ הופך אותו. הסטודנט לא ידע מה הסימן של $x$, ולכן למעבר אין הצדקה. הוא היה מוצדק אילו היה ידוע
          ש-$x>0$.
      - kind: computation
        text: >-
          (ב) נבדוק את $x=-1$: הוא שונה מאפס ו-$-1<1$, כך שההנחות מתקיימות. אבל $\frac1x=\frac{1}{-1}=-1$, ו-$-1>1$
          אינו נכון. מקרה אחד שבו הטענה נכשלת מפריך אותה.
      - kind: step
        text: >-
          (ג) נוסיף את ההנחה $x>0$. טענה: אם $0<x<1$ אז $\frac1x>1$. הוכחה: (1) נניח $0<x<1$ (ההנחה). (2)
          $\frac1x>0$, לפי מסקנה 0.1.9(2) עם $c=x>0$. (3) כופלים את שני האגפים של $x<1$ ב-$\frac1x$, מספר חיובי
          לפי (2), והכיוון נשמר לפי עובדה מקובלת (ב): $x\cdot\frac1x<1\cdot\frac1x$. (4) לפי (א),
          $x\cdot\frac1x=1$ ו-$1\cdot\frac1x=\frac1x$, ולכן $1<\frac1x$.
      - kind: check
        text: >-
          $x=\frac12$: $\frac1x=2>1$, כמו שהטענה המתוקנת אומרת. ו-$x=-1$ מראה שבלי ההנחה $x>0$ הטענה נכשלת: ההנחה
          שהוספנו נכנסה בשורה (2), ובלעדיה שורה (3) הופכת את הכיוון.
      - kind: result
        text: >-
          המעבר (1)→(2) אינו מוצדק; הטענה שקרית ($x=-1$); עם ההנחה $0<x<1$ היא נכונה.

  - id: W-0.1-05
    level: mid
    qualitative: true
    objectives: [OBJ-0.1-1]
    prompt: >-
      ספר אחד מגדיר: "מספר שלם $n$ נקרא אי-זוגי אם קיים שלם $k$ כך ש-$n=2k+1$". ספר אחר מגדיר: "מספר שלם $n$
      נקרא אי-זוגי אם קיים שלם $j$ כך ש-$n=2j-1$".

      (א) סטודנטית אומרת שאחת ההגדרות שגויה, כי היא "לא ההגדרה של הקורס". מה דעתכם?

      (ב) הוכיחו ששתי ההגדרות שקולות: כל מספר שמקיים את האחת מקיים גם את השנייה.
    answer: >-
      (א) הגדרה אינה נכונה או שגויה; אפשר רק לשאול אם שתי ההגדרות שקולות.

      (ב) אם $n=2k+1$, אז $n=2(k+1)-1$ עם $j=k+1$. אם $n=2j-1$, אז $n=2(j-1)+1$ עם $k=j-1$.
    solution:
      - kind: idea
        text: >-
          הגדרה קובעת מה פירוש מילה, ולכן אין לה ערך אמת. מה שאפשר להוכיח הוא טענה **על** שתי ההגדרות: שהן מתארות
          בדיוק את אותם מספרים. לשם כך מוכיחים שני כיוונים.
      - kind: step
        text: >-
          (א) שני הספרים בחרו שתי דרכים לתת שם לתכונה. השאלה היחידה שיש לה תשובה היא אם שתי הדרכים מתארות את אותם
          מספרים. אם כן, אפשר להשתמש בכל אחת מהן, ולבחור את הנוחה יותר.
      - kind: step
        text: >-
          (ב) כיוון ראשון: נניח ש-$n=2k+1$ עבור שלם $k$ (ההנחה). אז $n=2k+2-1=2(k+1)-1$ (חשבון לפי (א)). $k+1$ שלם
          (עובדה מקובלת (א): השלמים סגורים לחיבור), ולכן $n$ מקיים את ההגדרה השנייה עם $j=k+1$.
      - kind: step
        text: >-
          כיוון שני: נניח ש-$n=2j-1$ עבור שלם $j$. אז $n=2j-2+1=2(j-1)+1$ (חשבון לפי (א)). $j-1$ שלם (עובדה מקובלת
          (א): השלמים סגורים לחיסור), ולכן $n$ מקיים את ההגדרה הראשונה עם $k=j-1$.
      - kind: check
        text: >-
          $n=7$: $7=2\cdot 3+1$ ($k=3$) ו-$7=2\cdot 4-1$ ($j=4=k+1$). $n=-1$: $-1=2\cdot(-1)+1$ ו-$-1=2\cdot 0-1$.
          בשני המקרים $j=k+1$.
      - kind: result
        text: >-
          (א) אין הגדרה "שגויה". (ב) ההגדרות שקולות: $j=k+1$ מעביר מהראשונה לשנייה, ו-$k=j-1$ בחזרה.

  - id: W-0.1-06
    level: mid
    objectives: [OBJ-0.1-2]
    prompt: >-
      הוכיחו: הסכום של כל שלושה מספרים שלמים עוקבים מתחלק ב-3, במובן של הגדרה 0.1.2. כתבו את ההוכחה בשורות
      ממוספרות, וליד כל שורה את ההצדקה שלה.
    answer: >-
      $n+(n+1)+(n+2)=3n+3=3(n+1)$, ו-$n+1$ שלם, ולכן $3$ מחלק את הסכום.
    solution:
      - kind: idea
        text: >-
          שלושה שלמים עוקבים הם $n$, $n+1$, $n+2$ עבור שלם $n$. מחשבים את הסכום ומסדרים אותו בצורה $3\cdot(\dots)$,
          כדי לקרוא אותה בחזרה דרך הגדרה 0.1.2.
      - kind: step
        text: >-
          (1) יהיו שלושה שלמים עוקבים, ונסמן את הקטן שבהם $n$. **הצדקה:** ההנחה. ("עוקבים" פירושו שכל אחד גדול
          ב-1 מקודמו, ולכן השניים האחרים הם $n+1$ ו-$n+2$.)
      - kind: computation
        text: >-
          (2) $n+(n+1)+(n+2)=3n+3$. **הצדקה:** חשבון לפי (א) (חוקי החילוף והקיבוץ).
      - kind: computation
        text: >-
          (3) $3n+3=3(n+1)$. **הצדקה:** חשבון לפי (א) (חוק הפילוג).
      - kind: step
        text: >-
          (4) $n+1$ שלם. **הצדקה:** עובדה מקובלת (א): השלמים סגורים לחיבור.
      - kind: step
        text: >-
          (5) לכן $3\mid n+(n+1)+(n+2)$. **הצדקה:** הגדרה 0.1.2, על שורות (2) עד (4), עם $k=n+1$.
      - kind: check
        text: >-
          $4+5+6=15=3\cdot 5$, ואכן $n+1=5$. וגם עם שליליים: $-1+0+1=0=3\cdot 0$.
      - kind: result
        text: >-
          הסכום הוא $3(n+1)$, ולכן מתחלק ב-3.

  - id: W-0.1-07
    level: mid
    qualitative: true
    objectives: [OBJ-0.1-3]
    prompt: >-
      יוסי לומד את פרק 0 כך: בכל דוגמה פתורה הוא פותח את הפתרון מיד, קורא אותו ומבין כל שורה. בשאלות ההבנה הוא
      מסמן תמיד "בטוח". הוא מצליח ברוב שאלות ההבנה, אבל בשאלות המבחן של הפרק הוא לא יודע מאיפה להתחיל.

      (א) הסבירו למה ההצלחה בשאלות ההבנה לא הפכה להצלחה בשאלות המבחן.

      (ב) הציעו ליוסי שלושה שינויים בדרך הלימוד, ונמקו כל אחד.
    answer: >-
      (א) הוא מתרגל קריאה של פתרונות, ובמבחן צריך לכתוב פתרון לבד; וסימון "בטוח" תמיד מבטל את האבחון של תפיסות
      שגויות.

      (ב) למשל: לנסות כל דוגמה לפני שפותחים את הפתרון; לסמן ביטחון בכנות; לכתוב פתרונות מלאים לחוברת ולשאלות
      המבחן ולבדוק מול המחוון; לחזור לשאלות אחרי כמה ימים.
    solution:
      - kind: idea
        text: >-
          להבין פתרון ולכתוב פתרון הן שתי מיומנויות שונות. מה שמתרגלים הוא מה שמשתפר.
      - kind: step
        text: >-
          (א) כשיוסי פותח את הפתרון מיד, מישהו אחר כבר בחר בשבילו את הרעיון ואת סדר השורות, וזה בדיוק החלק שבמבחן
          צריך לעשות לבד. שאלות ההבנה בודקות בעיקר הבנה של הגדרה או של צעד אחד, ולכן הוא מצליח בהן. שאלות המבחן
          דורשות לבנות הוכחה שלמה, וזה מה שהוא לא תרגל.
      - kind: step
        text: >-
          בנוסף, כשהוא מסמן "בטוח" על הכול, טעות בביטחון כבר לא בולטת: הוא לא יודע אילו מהטעויות שלו הן תפיסות
          שגויות, שחוזרות במבחן.
      - kind: step
        text: >-
          (ב) שינוי 1: לנסות כל דוגמה פתורה לבד, בכתב, לפני שפותחים את הפתרון, גם אם הניסיון לא מצליח. ניסיון
          שנכשל מראה איפה בדיוק נתקעים.
      - kind: step
        text: >-
          שינוי 2: לסמן ביטחון בכנות. אז טעות בביטחון תסמן תפיסה שגויה, והוא יחזור לחלק בשיעור שהמשוב מפנה אליו.
      - kind: step
        text: >-
          שינוי 3: לכתוב פתרונות מלאים לתרגילי החוברת ולשאלות המבחן לפני שפותחים את הפתרון, להשוות למחוון, ולחזור
          לשאלה שנכשל בה אחרי כמה ימים, מאפס.
      - kind: result
        text: >-
          יוסי מתרגל קריאה ולא כתיבה, ומבטל את אבחון הביטחון. התיקון: לנסות לפני שמציצים, לסמן ביטחון בכנות, ולכתוב
          פתרונות מלאים ולבדוק אותם מול המחוון.

  - id: W-0.1-08
    level: exam
    objectives: [OBJ-0.1-1, OBJ-0.1-2]
    prompt: >-
      (א) הוכיחו: לכל $n\in\mathbb Z$, $2\mid n^3-n$.

      (ב) הוכיחו: לכל $n\in\mathbb Z$, $3\mid n^3-n$. (רמז: חילוק עם שארית ב-3.)

      (ג) הוכיחו: לכל $c\in\mathbb Z$, אם $2\mid c$ ו-$3\mid c$, אז $6\mid c$. הסיקו ש-$6\mid n^3-n$ לכל
      $n\in\mathbb Z$.

      (ד) סטודנט בדק את הטענה "$6\mid n^3-n$" לכל $n$ מ-1 עד 1000, ובכל המקרים היא התקיימה. האם הבדיקה שלו
      היא הוכחה? מה התפקיד שלה?
    answer: >-
      (א) $n^3-n=(n-1)\cdot n(n+1)$, ו-$n(n+1)$ זוגי (טענה 0.1.6).

      (ב) $n=3q+r$ עם $r\in\{0,1,2\}$, ו-3 מחלק את $n$, את $n-1$ או את $n+1$.

      (ג) $c=2s=3t$, ולכן $t=3t-2t=2(s-t)$ ו-$c=6(s-t)$.

      (ד) לא; היא דוגמה, שנותנת השערה ובדיקה, לא הוכחה.
    solution:
      - kind: idea
        text: >-
          מפרקים: $n^3-n=n(n^2-1)=(n-1)n(n+1)$, מכפלה של שלושה שלמים עוקבים. 2 מחלק את אחד מהם לפי טענה 0.1.6,
          ו-3 מחלק את אחד מהם לפי חילוק עם שארית ב-3. ב-(ג) מבטאים את $t$ דרך $c$: $t=3t-2t$.
      - kind: computation
        text: >-
          (א) לפי (א), $n^3-n=(n-1)\cdot\big(n(n+1)\big)$. לפי טענה 0.1.6(2), $n(n+1)$ זוגי. לפי טענה 0.1.4(4) עם
          $a=n(n+1)$ ו-$b=n-1$ (ו-$n-1$ שלם לפי (א)), המכפלה $n(n+1)(n-1)$ זוגית, כלומר $2\mid n^3-n$ (חוק החילוף,
          (א)).
      - kind: step
        text: >-
          (ב) לפי חילוק עם שארית, עובדה מקובלת (ג), עם $b=3$: $n=3q+r$ עם $q,r\in\mathbb Z$ ו-$0\le r<3$. כמו בשלב 2
          של למה 0.1.3, $r\in\{0,1,2\}$: אין שלם ממש בין $0$ ל-$1$, בין $1$ ל-$2$ או בין $2$ ל-$3$ (עובדה (ג)).
      - kind: step
        text: >-
          שלושה מקרים. אם $r=0$, אז $n=3q$. אם $r=1$, אז $n-1=3q$. אם $r=2$, אז $n+1=3q+3=3(q+1)$ (א). בכל מקרה
          אחד הגורמים $f$ של $(n-1)n(n+1)$ שווה ל-$3j$ עם $j\in\mathbb Z$. אם $g$ היא המכפלה של שני הגורמים
          האחרים, אז לפי (א) $n^3-n=fg=3(jg)$, ו-$jg\in\mathbb Z$, ולכן $3\mid n^3-n$ לפי הגדרה 0.1.2.
      - kind: step
        text: >-
          (ג) לפי הגדרה 0.1.2 יש $s,t\in\mathbb Z$ עם $c=2s$ ו-$c=3t$. לפי (א), $t=3t-2t=c-2t=2s-2t=2(s-t)$. לכן
          $c=3t=3\cdot 2(s-t)=6(s-t)$, ו-$s-t\in\mathbb Z$, כלומר $6\mid c$. עם $c=n^3-n$ ושני הסעיפים הקודמים:
          $6\mid n^3-n$.
      - kind: step
        text: >-
          (ד) הבדיקה עוסקת ב-1000 מקרים, והטענה מדברת על אינסוף שלמים, גם שליליים. היא **דוגמה**: היא נותנת השערה
          ובודקת שלא טעינו בחשבון, אבל לא מוכיחה. ההוכחה היא (א)–(ג), שעובדת עם $n$ כללי.
      - kind: check
        text: >-
          $n=2$: $8-2=6$. $n=5$: $125-5=120=6\cdot 20$. $n=-3$: $-27+3=-24=6\cdot(-4)$. ובסעיף (ג) הצעד $t=3t-2t$
          תלוי במספרים 2 ו-3: "אם $2\mid c$ ו-$4\mid c$ אז $8\mid c$" נכשל ב-$c=4$, כי $4=2\cdot 2=4\cdot 1$, אבל
          לפי טענה 0.1.5(4) מחלק טבעי של 4 קטן או שווה ל-4, ו-$8>4$.
      - kind: result
        text: >-
          $2\mid n^3-n$ ו-$3\mid n^3-n$, ולכן $6\mid n^3-n$ לכל $n\in\mathbb Z$. בדיקה של 1000 מקרים היא דוגמה ולא
          הוכחה.

  - id: W-0.1-09
    level: exam
    qualitative: true
    objectives: [OBJ-0.1-2]
    prompt: >-
      **טענה:** לכל מספר ממשי $x$, אם $x^2=x$ אז $x=1$. סטודנטית כתבה: "נניח ש-$x^2=x$. נחלק ב-$x$ ונקבל $x=1$."

      (א) מה הפער בהוכחה?

      (ב) האם הטענה נכונה? אם לא, תנו דוגמה נגדית.

      (ג) מצאו את **כל** המספרים הממשיים $x$ שמקיימים $x^2=x$, והוכיחו שאלה כולם.
    answer: >-
      (א) חילוק ב-$x$, שאולי שווה אפס.

      (ב) לא נכונה: $x=0$ מקיים $0^2=0$ ו-$0\neq 1$.

      (ג) $x=0$ או $x=1$.
    solution:
      - kind: idea
        text: >-
          בכל חילוק שואלים אם המחלק שונה מאפס. כאן אפשר להימנע מחילוק: מעבירים אגף ומפרקים, ולפי טענה 0.1.8
          מכפלה היא אפס רק אם אחד הגורמים אפס.
      - kind: step
        text: >-
          (א) חילוק ב-$x$ הוא כפל ב-$\frac1x$, שקיים לפי עובדה מקובלת (א) רק אם $x\neq 0$, וזה לא נתון. לכן למעבר
          "נחלק ב-$x$" אין הצדקה.
      - kind: computation
        text: >-
          (ב) $x=0$: $0^2=0$, כך שההנחה מתקיימת, אבל $0\neq 1$. הטענה שקרית, וההוכחה "מוכיחה" דבר שקרי בגלל הפער.
      - kind: step
        text: >-
          (ג) נניח ש-$x^2=x$ (ההנחה). אז $x^2-x=0$ (חשבון לפי (א)), כלומר $x(x-1)=0$ (חשבון לפי (א): גורם משותף).
          לפי טענה 0.1.8(2), $x=0$ או $x-1=0$, כלומר $x=0$ או $x=1$.
      - kind: step
        text: >-
          הכיוון השני: שני הערכים אכן מקיימים את המשוואה: $0^2=0\cdot 0=0$ לפי טענה 0.1.8(1), ו-$1^2=1$ לפי (א).
          לכן אלה בדיוק הפתרונות, לא יותר ולא פחות.
      - kind: check
        text: >-
          ההוכחה השגויה איבדה בדיוק את הפתרון $x=0$, הערך היחיד שבו החילוק אסור.
      - kind: result
        text: >-
          הפער: חילוק ב-$x$. הטענה שקרית ($x=0$). הפתרונות של $x^2=x$ הם $x=0$ ו-$x=1$.

  - id: W-0.1-10
    level: exam
    objectives: [OBJ-0.1-1, OBJ-0.1-2]
    prompt: >-
      קראו את הקטע:

      (1) מספר טבעי $T$ נקרא **משולשי** אם קיים $m$ טבעי כך ש-$T=\frac{m(m+1)}{2}$.

      (2) למשל, $1$, $3$, $6$ ו-$10$ משולשיים.

      (3) לכל מספר משולשי $T$, המספר $8T+1$ הוא ריבוע של מספר שלם.

      (א) מה התפקיד של כל אחד מהקטעים (1) עד (3)? מה ההנחה של (3), ומה המסקנה שלו?

      (ב) הוכיחו את (3) בשורות ממוספרות, עם הצדקה לכל שורה.

      (ג) בדקו את (3) על ארבעת המספרים שב-(2). האם הבדיקה מחליפה את (ב)?
    answer: >-
      (א) (1) הגדרה, (2) דוגמה, (3) טענה; ההנחה: $T$ משולשי; המסקנה: $8T+1$ ריבוע של שלם.

      (ב) $8T+1=4m(m+1)+1=4m^2+4m+1=(2m+1)^2$.

      (ג) $9=3^2$, $25=5^2$, $49=7^2$, $81=9^2$; הבדיקה אינה הוכחה.
    solution:
      - kind: idea
        text: >-
          פותחים את ההגדרה של "משולשי", מציבים ב-$8T+1$, ומזהים ריבוע של בינום.
      - kind: step
        text: >-
          (א) (1) נותן שם, "משולשי": **הגדרה**. (2) מראה מקרים מסוימים: **דוגמה** (עם $m=1,2,3,4$). (3) אומר
          שמשהו נכון לכל מספר משולשי: **טענה**. ההנחה: $T$ משולשי. המסקנה: $8T+1$ הוא ריבוע של מספר שלם.
      - kind: step
        text: >-
          (ב) (1) יהי $T$ משולשי. **הצדקה:** ההנחה. (2) קיים $m$ טבעי כך ש-$T=\frac{m(m+1)}{2}$. **הצדקה:** ההגדרה
          (1), על שורה (1).
      - kind: computation
        text: >-
          (3) $8T+1=8\cdot\frac{m(m+1)}{2}+1=4m(m+1)+1=4m^2+4m+1$. **הצדקה:** חשבון לפי (א): הצבה מ-(2), $8\cdot\frac12=4$,
          ופתיחת סוגריים. (4) $4m^2+4m+1=(2m+1)^2$. **הצדקה:** חשבון לפי (א): פתיחת סוגריים באגף ימין.
      - kind: step
        text: >-
          (5) $2m+1$ שלם. **הצדקה:** עובדה מקובלת (א): השלמים סגורים לחיבור ולכפל, ו-$m\in\mathbb N$ שלם. (6) לכן
          $8T+1$ הוא ריבוע של המספר השלם $2m+1$. **הצדקה:** ההגדרה של "ריבוע של מספר שלם" (שווה ל-$s^2$ עבור שלם
          $s$), על שורות (3) עד (5), עם $s=2m+1$.
      - kind: check
        text: >-
          (ג) $T=1$: $9=3^2$; $T=3$: $25=5^2$; $T=6$: $49=7^2$; $T=10$: $81=9^2$. בכל מקרה הבסיס הוא $2m+1$ עם
          $m=1,2,3,4$, כמו שההוכחה צופה. אבל ארבעה מקרים אינם הוכחה של טענה על אינסוף מספרים משולשיים: את זה עושה
          (ב).
      - kind: result
        text: >-
          (1) הגדרה, (2) דוגמה, (3) טענה; $8T+1=(2m+1)^2$; הבדיקה מאשרת ארבעה מקרים ואינה מחליפה את ההוכחה.

challenge:
  - id: W-0.1-c1
    stars: 1
    objectives: [OBJ-0.1-2]
    prompt: >-
      **הערכת הוכחה.** טענה: לכל שני מספרים ממשיים $x$ ו-$y$, אם $x\neq y$, $x>0$ ו-$y>0$, אז
      $\frac{x}{y}+\frac{y}{x}>2$.

      הוכחה מוצעת: "$x$ ו-$y$ חיוביים, ולכן $xy$ חיובי, ומותר לכפול את שני האגפים של אי-השוויון ב-$xy$:
      $\left(\frac{x}{y}+\frac{y}{x}\right)\cdot xy>2xy$, כלומר $x^2+y^2>2xy$. נעביר את כל האיברים שמאלה:
      $x^2-2xy+y^2>0$, ונפרק: $(x-y)^2>0$. מכיוון ש-$x\neq y$, $x-y\neq 0$ ולכן $(x-y)^2>0$. זה מוכיח את הטענה."

      האם הטענה נכונה? האם ההוכחה תקינה? אם הטענה נכונה וההוכחה לא, מצאו את הבעיה וכתבו הוכחה תקינה.
    answer: >-
      הטענה נכונה, וההוכחה אינה תקינה: היא מתחילה באי-השוויון שצריך להוכיח. הוכחה תקינה: $(x-y)^2>0$, ולכן
      $x^2+y^2>2xy$, ומחלקים ב-$xy>0$.
    solution:
      - kind: idea
        text: >-
          ההוכחה המוצעת היא שרשרת "מהסוף": היא כופלת ב-$xy$ את מה שצריך להוכיח. כל המעברים בה הפיכים, ולכן אפשר
          לכתוב אותה בכיוון ההפוך, מ-$(x-y)^2>0$ אל הטענה.
      - kind: step
        text: >-
          **הבעיה:** המשפט הראשון כופל ב-$xy$ את אי-השוויון $\frac{x}{y}+\frac{y}{x}>2$, כלומר מניח את המסקנה. מה
          שהוכח הוא רק "אם הטענה נכונה, אז $(x-y)^2>0$", וזה לא מוכיח אותה.
      - kind: step
        text: >-
          **הוכחה.** (1) נניח $x\neq y$, $x>0$, $y>0$ (ההנחה). (2) $x-y\neq 0$ (אילו $x-y=0$, מוסיפים $y$ ומקבלים
          $x=y$, בניגוד להנחה). (3) $(x-y)^2>0$ (מסקנה 0.1.9(1): ריבוע של מספר ששונה מאפס חיובי).
      - kind: computation
        text: >-
          (4) $x^2-2xy+y^2>0$ (חשבון לפי (א): פתיחת סוגריים), ולכן (5) $x^2+y^2>2xy$ (עובדה מקובלת (ב): מוסיפים
          $2xy$ לשני האגפים).
      - kind: step
        text: >-
          (6) $xy>0$ (עובדה מקובלת (ב): כופלים את $0<x$ ב-$y>0$ ומקבלים $0\cdot y<xy$, ו-$0\cdot y=y\cdot 0=0$ לפי חוק
          החילוף (א) וטענה 0.1.8(1)). לכן לפי מסקנה 0.1.9(2) מותר לחלק את שני האגפים של (5) ב-$xy$ בלי לשנות את הכיוון:
          $\frac{x^2}{xy}+\frac{y^2}{xy}>2$, כלומר $\frac{x}{y}+\frac{y}{x}>2$ (חשבון לפי (א): צמצום).
      - kind: check
        text: >-
          $x=1$, $y=2$: $\frac12+2=2.5>2$. ואם $x=y$ מקבלים בדיוק $1+1=2$, ולכן ההנחה $x\neq y$ הכרחית לאי-שוויון
          החזק. ההנחה $x,y>0$ שימשה בשורה (6): בלעדיה, $x=1$, $y=-1$ נותן $-1-1=-2<2$.
      - kind: result
        text: >-
          הטענה נכונה; ההוכחה המוצעת מניחה את המסקנה. ההוכחה התקינה: מ-$(x-y)^2>0$ מקבלים $x^2+y^2>2xy$, ואז
          מחלקים ב-$xy>0$.
    source:
      name: 'Ted Sundstrom, Mathematical Reasoning: Writing and Proof (PreTeXt Edition)'
      year: 2022
      problem: 'Section 3.1, Exercise 19(b) (Evaluation of Proofs)'
      url: 'https://gvsuoer.github.io/sundstrom-textbook/S_directproof.html#prop-exer-recipadd'
      verified: '2026-11-09'
      adapted: true

  - id: W-0.1-c2
    stars: 1
    objectives: [OBJ-0.1-1, OBJ-0.1-2]
    prompt: >-
      **הערכת הוכחה.** (השתמשו בהגדרה 0.1.2: $a\mid b$ אם קיים שלם $k$ כך ש-$b=ak$, ו-$a\nmid b$ אם $a$ אינו
      מחלק את $b$.)

      טענה: לכל שלושה שלמים $a$, $b$ ו-$c$, אם $a\mid bc$ אז $a\mid b$ או $a\mid c$.

      הוכחה מוצעת: "נניח ש-$a$ מחלק את $bc$. אז קיים שלם $k$ כך ש-$bc=ka$. נפרק את $k$ למכפלה $k=mn$ של שני
      שלמים. אז $bc=mna$. זה אומר ש-$b=ma$ או $c=na$, ולכן $a\mid b$ או $a\mid c$."

      האם הטענה נכונה? מצאו את השורה שאין לה הצדקה. אם הטענה שקרית, תנו דוגמה נגדית.
    answer: >-
      הטענה שקרית: $a=4$, $b=c=2$ ($4\mid 4$ אבל $4\nmid 2$). המעבר "זה אומר ש-$b=ma$ או $c=na$" אינו מוצדק.
    solution:
      - kind: idea
        text: >-
          קוראים כל שורה ושואלים מה מצדיק אותה. שורה שאין לה הצדקה היא החשודה; אם בעקבותיה אפשר למצוא מקרה שבו
          ההנחה מתקיימת והמסקנה לא, הטענה שקרית.
      - kind: step
        text: >-
          "קיים $k$ כך ש-$bc=ka$": הגדרה 0.1.2. "נפרק $k=mn$": תמיד אפשר (למשל $m=k$, $n=1$), אבל הבחירה שרירותית.
          "$bc=mna$": חשבון לפי (א).
      - kind: step
        text: >-
          **הפער:** "זה אומר ש-$b=ma$ או $c=na$". משוויון של שתי מכפלות, $b\cdot c=(ma)\cdot n$, לא נובע ששני
          הגורמים שווים בהתאמה, ושום הגדרה, עובדה מקובלת או טענה ממוספרת לא נותנות את המעבר הזה. למשל
          $2\cdot 6=3\cdot 4$, ואף גורם באגף שמאל אינו שווה לגורם באגף ימין.
      - kind: computation
        text: >-
          **דוגמה נגדית:** $a=4$, $b=2$, $c=2$. אז $bc=4=4\cdot 1$, ולכן $4\mid bc$. אבל $4\nmid 2$: לפי טענה
          0.1.5(4), אם $4\mid 2$ אז $4\le 2$, וזה לא נכון. לכן ההנחה מתקיימת, ושני חלקי המסקנה אינם מתקיימים.
      - kind: check
        text: >-
          עוד דוגמה נגדית: $a=6$, $b=2$, $c=3$: $bc=6$, ולפי טענה 0.1.5(4) $6$ אינו מחלק את $2$ ואינו מחלק את $3$,
          כי $6>3>2$. שימו לב שהשורות הראשונות של ההוכחה נכונות: הבעיה היא מעבר אחד בלי הצדקה, ובגללו "הוכח" דבר
          שקרי.
      - kind: result
        text: >-
          הטענה שקרית (למשל $a=4$, $b=c=2$). המעבר "$bc=mna$ ולכן $b=ma$ או $c=na$" הוא הפער.
