# Workbook of lesson 0.3 — quantifiers and negation.
# Objectives (src/course.ts):
#   OBJ-0.3-1  translate a Hebrew mathematical sentence into "for all" / "there exists", and back
#   OBJ-0.3-2  negate a statement with several nested quantifiers, mechanically and correctly
#   OBJ-0.3-3  explain, with an example, why the order of quantifiers changes the meaning
# W-0.3-05 was evaluated with src/math/quantifiers.ts (holds, witness, counterexample); every other number by a
# command in the session that wrote this file.
lesson: '0.3'
practice:
  - id: W-0.3-01
    level: basic
    objectives: [OBJ-0.3-1]
    prompt: >-
      כתבו כל משפט כטענה עם כמתים, וקבעו אם הוא נכון.

      (א) יש מספר ממשי שקטן מכל המספרים הטבעיים.

      (ב) למשוואה $x^2+x+1=0$ אין פתרון ממשי.

      (ג) בין כל שני מספרים ממשיים שונים יש מספר ממשי.
    answer: >-
      (א) $\exists x\in\mathbb{R}\ \forall n\in\mathbb{N}:\ x<n$, נכון ($x=0$).

      (ב) $\forall x\in\mathbb{R}:\ x^2+x+1\ne 0$, נכון.

      (ג) $\forall x\in\mathbb{R}\ \forall y\in\mathbb{R}:\ x<y\Rightarrow \exists z\in\mathbb{R}:\ x<z\land z<y$, נכון.
    solution:
      - kind: idea
        text: >-
          לכל משפט מזהים את הכמתים ואת הסדר שלהם. "יש" הוא $\exists$, "כל" ו"לכל" הם $\forall$, ו"אין" הוא שלילה של
          "יש".
      - kind: step
        text: >-
          (א) המספר הממשי נבחר קודם, ואחריו "כל המספרים הטבעיים":
          $\exists x\in\mathbb{R}\ \forall n\in\mathbb{N}:\ x<n$. נכון: נבחר $x=0$. לכל $n$ טבעי $n\ge 1>0$.
      - kind: step
        text: >-
          (ב) "אין פתרון" הוא $\neg\,\exists x\in\mathbb{R}:\ x^2+x+1=0$, ולפי כלל השלילה זה
          $\forall x\in\mathbb{R}:\ x^2+x+1\ne 0$.
      - kind: computation
        text: >-
          נכון: משלימים לריבוע, $x^2+x+1=\left(x+\frac12\right)^2+\frac34$. הריבוע אינו שלילי, ולכן הביטוי לפחות
          $\frac34>0$, ובפרט אינו 0.
      - kind: step
        text: >-
          (ג) "כל שני מספרים שונים": אחד מהם קטן מהשני, ונקרא לקטן $x$ ולגדול $y$. "יש מספר ביניהם" הוא $\exists z$
          שבא אחרי שניהם, ולכן תלוי בהם:
          $\forall x\in\mathbb{R}\ \forall y\in\mathbb{R}:\ x<y\Rightarrow \exists z\in\mathbb{R}:\ (x<z\land z<y)$.
          התנאי "x קטן מ-y" בא בגרירה, כי הוא מגביל את "לכל".
      - kind: check
        text: >-
          נכון: אם $x<y$ נבחר $z=\frac{x+y}{2}$. אז $z-x=\frac{y-x}{2}>0$ ו-$y-z=\frac{y-x}{2}>0$. למשל $x=1$,
          $y=2$ נותנים $z=1.5$.
      - kind: result
        text: >-
          שלוש הטענות נכונות. ב-(ג) ה-$z$ תלוי ב-$x$ וב-$y$, כי הוא נבחר אחריהם.

  - id: W-0.3-02
    level: basic
    qualitative: true
    objectives: [OBJ-0.3-1]
    prompt: >-
      אמרו במילים מה אומרת כל טענה, וקבעו אם היא נכונה.

      (א) $\forall x\in\mathbb{R}\ \exists y\in\mathbb{R}:\ y^3=x$

      (ב) $\exists x\in\mathbb{R}\ \forall y\in\mathbb{R}:\ xy=0$

      (ג) $\forall x\in\mathbb{R}:\ x^2=1\Rightarrow x=1$
    answer: >-
      (א) לכל מספר ממשי יש שורש שלישי ממשי: נכון.

      (ב) יש מספר שמכפלתו בכל מספר היא 0: נכון ($x=0$).

      (ג) כל מספר שריבועו 1 שווה ל-1: לא נכון ($x=-1$).
    solution:
      - kind: idea
        text: קוראים משמאל לימין, וכל כמת הופך למילים במקומו. מה שנבחר אחרי משתנה רשאי להיות תלוי בו.
      - kind: step
        text: >-
          (א) "לכל מספר ממשי $x$ יש מספר ממשי $y$ שהחזקה השלישית שלו היא $x$", כלומר לכל מספר ממשי יש שורש
          שלישי ממשי. נכון: $y=\sqrt[3]{x}$, שמוכר מבית הספר גם למספרים שליליים (למשל $\sqrt[3]{-8}=-2$). ה-$y$
          תלוי ב-$x$.
      - kind: step
        text: >-
          (ב) "יש מספר ממשי $x$ כך שלכל $y$, $xy=0$". אותו $x$ צריך להתאים לכל $y$. נכון: $x=0$, כי $0\cdot y=0$
          לכל $y$.
      - kind: step
        text: >-
          (ג) "כל מספר ממשי שריבועו 1 שווה ל-1". זו טענת "לכל", ומפריכים אותה בדוגמה נגדית אחת: $x=-1$ מקיים
          $(-1)^2=1$, אבל $-1\ne 1$. בשורה של $x=-1$ ההנחה נכונה והמסקנה שקרית, וזו בדיוק השורה שבה גרירה שקרית.
      - kind: check
        text: >-
          ב-(ב) הסדר חשוב: $\exists x\ \forall y$ דורשת $x$ אחד לכל ה-$y$, ו-$0$ עומד בזה. ב-(ג), $x=1$ מקיים את
          הגרירה, אבל דוגמה אחת שמקיימת לא מוכיחה טענת "לכל".
      - kind: result
        text: (א) נכונה, (ב) נכונה, (ג) לא נכונה.

  - id: W-0.3-03
    level: basic
    objectives: [OBJ-0.3-2]
    prompt: >-
      שללו כל טענה בצורה מכנית, וקבעו מי נכונה: הטענה או השלילה שלה.

      (א) $\exists x\in\mathbb{R}:\ x^2=-1$

      (ב) $\forall n\in\mathbb{N}:\ n^2\ge n$

      (ג) $\forall n\in\mathbb{N}\ \exists m\in\mathbb{N}:\ m^2=n$
    answer: >-
      (א) $\forall x\in\mathbb{R}:\ x^2\ne -1$, השלילה נכונה.

      (ב) $\exists n\in\mathbb{N}:\ n^2<n$, הטענה נכונה.

      (ג) $\exists n\in\mathbb{N}\ \forall m\in\mathbb{N}:\ m^2\ne n$, השלילה נכונה ($n=2$).
    solution:
      - kind: definition
        text: >-
          הכלל: כל "לכל" הופך ל"קיים", כל "קיים" הופך ל"לכל", התחומים נשארים, והתנאי שבסוף נשלל.
      - kind: step
        text: >-
          (א) השלילה: $\forall x\in\mathbb{R}:\ x^2\ne -1$. היא נכונה: ריבוע של מספר ממשי אינו שלילי, ולכן אינו
          $-1$.
      - kind: step
        text: >-
          (ב) השלילה: $\exists n\in\mathbb{N}:\ n^2<n$ (שלילת $\ge$ היא $<$). הטענה המקורית נכונה: יהי $n$ טבעי.
          $n\ge 1$, ומכפילים במספר החיובי $n$: $n^2\ge n$.
      - kind: step
        text: >-
          (ג) השלילה: $\exists n\in\mathbb{N}\ \forall m\in\mathbb{N}:\ m^2\ne n$, כלומר יש מספר טבעי שאינו ריבוע של
          טבעי. היא נכונה עם $n=2$: $1^2=1$, ולכל $m\ge 2$ מתקיים $m^2\ge 4$, ולכן אף $m$ לא נותן 2.
      - kind: check
        text: >-
          בכל זוג בדיוק אחת נכונה. ב-(ג) שימו לב שהשלילה לא החליפה את הסדר: $n$ עדיין נבחר לפני $m$, רק הכמתים
          התהפכו.
      - kind: result
        text: (א) השלילה נכונה; (ב) הטענה נכונה; (ג) השלילה נכונה.

  - id: W-0.3-04
    level: mid
    qualitative: true
    objectives: [OBJ-0.3-2]
    prompt: >-
      שלושה סטודנטים שללו את הטענה $A:\ \forall x\in\mathbb{R}\ \exists y\in\mathbb{R}:\ x<y$.

      (I) $\exists x\in\mathbb{R}\ \exists y\in\mathbb{R}:\ x\ge y$

      (II) $\exists x\in\mathbb{R}\ \forall y\in\mathbb{R}:\ x>y$

      (III) $\forall x\in\mathbb{R}\ \exists y\in\mathbb{R}:\ x\ge y$

      מצאו את הטעות של כל אחד, וכתבו את השלילה הנכונה. למי מהם אפשר לגלות את הטעות רק לפי ערך האמת?
    answer: >-
      השלילה הנכונה: $\exists x\in\mathbb{R}\ \forall y\in\mathbb{R}:\ x\ge y$. (I) לא הפך את הכמת השני, (II)
      שלל את $<$ ל-$>$, (III) לא הפך אף כמת. את (I) ואת (III) מגלים לפי ערך האמת: הן נכונות, כמו $A$.
    solution:
      - kind: step
        text: >-
          השלילה הנכונה לפי הכלל: $\forall$ הופך ל-$\exists$, $\exists$ הופך ל-$\forall$, ו-$x<y$ נשלל ל-$x\ge y$:
          $\exists x\in\mathbb{R}\ \forall y\in\mathbb{R}:\ x\ge y$, כלומר יש מספר ממשי גדול או שווה לכל המספרים.
      - kind: step
        text: >-
          (I) הפך רק את הכמת הראשון. (II) הפך את שני הכמתים, אבל שלל $<$ ל-$>$ ושכח את השוויון. (III) שלל רק את
          התנאי והשאיר את הכמתים.
      - kind: check
        text: >-
          $A$ נכונה ($y=x+1$), ולכן השלילה שלה חייבת להיות שקרית. (I) נכונה ($x=y=0$) ו-(III) נכונה ($y=x$), ולכן
          אף אחת מהן אינה השלילה. (II) שקרית, כמו השלילה הנכונה, ולכן ערך האמת לא מגלה את הטעות בה.
      - kind: step
        text: >-
          כדי לראות ש-(II) אומרת משהו אחר, מעבירים את שתי הטענות לתחום אחר, הקבוצה $\{1,2,3\}$: שם
          $\exists x\ \forall y:\ x\ge y$ נכונה ($x=3$), אבל $\exists x\ \forall y:\ x>y$ שקרית, כי $y=x$ תמיד נכשל.
          שתי טענות שאומרות אותו דבר היו מסכימות בכל תחום.
      - kind: result
        text: >-
          השלילה הנכונה היא $\exists x\ \forall y:\ x\ge y$. שלושת הסטודנטים טעו; את הטעות של (II) מגלים רק כשבודקים
          את הניסוח, לא את ערך האמת.

  - id: W-0.3-05
    level: mid
    qualitative: true
    objectives: [OBJ-0.3-3]
    prompt: >-
      על הקבוצה $\{1,2,3\}$ התנאי $R(x,y)$ מתקיים בדיוק בארבעה זוגות: $(1,2)$, $(2,3)$, $(3,1)$ ו-$(3,3)$.
      קבעו אם כל טענה נכונה, ותנו נימוק (דוגמה, אסטרטגיה או דוגמה נגדית).

      (א) $\forall x\ \exists y:\ R(x,y)$

      (ב) $\exists y\ \forall x:\ R(x,y)$

      (ג) $\exists x\ \forall y:\ R(x,y)$

      (ד) $\forall y\ \exists x:\ R(x,y)$
    answer: (א) נכונה; (ב) שקרית; (ג) שקרית; (ד) נכונה.
    solution:
      - kind: idea
        text: >-
          ב"לכל-קיים" נותנים תשובה לכל ערך של המשתנה הראשון. ב"קיים-לכל" צריך ערך אחד שעובד מול כל הערכים, ומפריכים
          את זה בכך שמראים, לכל ערך, ערך נגדי שמפיל אותו.
      - kind: step
        text: >-
          (א) נכונה. אסטרטגיה: ל-$x=1$ עונים $y=2$, ל-$x=2$ עונים $y=3$, ל-$x=3$ עונים $y=1$. ה-$y$ שונה לכל $x$.
      - kind: step
        text: >-
          (ב) שקרית. לכל $y$ יש $x$ שמפיל אותו: $y=1$ נופל ב-$x=1$ (הזוג $(1,1)$ אינו ברשימה), $y=2$ נופל ב-$x=2$,
          ו-$y=3$ נופל ב-$x=1$. זו בדיוק השלילה, $\forall y\ \exists x:\ \neg R(x,y)$.
      - kind: step
        text: >-
          (ג) שקרית. $x=1$ נופל ב-$y=1$, $x=2$ נופל ב-$y=1$, ו-$x=3$ נופל ב-$y=2$ (הזוג $(3,2)$ אינו ברשימה).
      - kind: step
        text: >-
          (ד) נכונה. ל-$y=1$ עונים $x=3$, ל-$y=2$ עונים $x=1$, ל-$y=3$ עונים $x=2$.
      - kind: check
        text: >-
          (א) נכונה ו-(ב) שקרית: אותו תנאי, אותם שני כמתים, וסדר אחר. וכמו שהמשפט אומר, אילו (ב) הייתה נכונה, גם (א)
          הייתה נכונה; ההפך לא נכון. אותו קשר יש בין (ג) ל-(ד).
      - kind: result
        text: (א) ו-(ד) נכונות; (ב) ו-(ג) שקריות.

  - id: W-0.3-06
    level: mid
    objectives: [OBJ-0.3-1, OBJ-0.3-2]
    prompt: >-
      כתבו כל משפט בכמתים, עם הקשר הנכון בין התחום לתנאי, שללו אותו, וקבעו מי נכונה.

      (א) כל מספר שלם שמתחלק ב-6 מתחלק ב-3.

      (ב) יש מספר ראשוני זוגי.
    answer: >-
      (א) $\forall n\in\mathbb{Z}:\ 6\mid n\Rightarrow 3\mid n$; השלילה $\exists n\in\mathbb{Z}:\ 6\mid n\land 3\nmid n$.
      הטענה נכונה.

      (ב) $\exists p:\ p$ ראשוני וגם זוגי; השלילה: כל ראשוני אינו זוגי. הטענה נכונה ($p=2$).
    solution:
      - kind: definition
        text: >-
          $a\mid b$ פירושו ש-$a$ מחלק את $b$, כלומר $b=ak$ עבור $k$ שלם, ו-$a\nmid b$ פירושו שלא. עם "לכל" התנאי
          המגביל בא בגרירה, ועם "קיים" ב"וגם".
      - kind: step
        text: >-
          (א) "כל מספר שמתחלק ב-6" הוא "לכל" עם תנאי: $\forall n\in\mathbb{Z}:\ (6\mid n\Rightarrow 3\mid n)$.
          השלילה של הגרירה היא "ההנחה וגם שלילת המסקנה": $\exists n\in\mathbb{Z}:\ (6\mid n\land 3\nmid n)$.
      - kind: step
        text: >-
          הטענה נכונה: אם $6\mid n$ אז $n=6k$ עבור $k$ שלם, ולכן $n=3\cdot(2k)$, ו-$2k$ שלם. לכן $3\mid n$.
      - kind: step
        text: >-
          (ב) "יש מספר ראשוני זוגי" הוא "קיים" עם שני תנאים ב"וגם": יש $p$ כך ש-$p$ ראשוני וגם $p$ זוגי. השלילה:
          לכל $p$, אם $p$ ראשוני אז $p$ אינו זוגי. ("וגם" נשלל ל"או", ו"לא A או לא B" הוא "אם A אז לא B".)
      - kind: check
        text: >-
          (ב) נכונה: $p=2$ ראשוני וזוגי. לכן השלילה, "כל ראשוני אי-זוגי", שקרית, ו-2 הוא הדוגמה הנגדית לה. ב-(א),
          $n=12$ מקיים $12=3\cdot4$; ו-$n=9$ אינו מתחלק ב-6, ולכן אינו נבדק בכלל.
      - kind: result
        text: >-
          (א) הטענה נכונה והשלילה שקרית. (ב) הטענה נכונה ($p=2$) והשלילה, "כל ראשוני אי-זוגי", שקרית.

  - id: W-0.3-07
    level: mid
    qualitative: true
    objectives: [OBJ-0.3-3]
    prompt: >-
      יהי $P(x,y)$ תנאי כלשהו על מספרים ממשיים.

      (א) הוכיחו: אם $\exists x\ \forall y:\ P(x,y)$, אז $\forall y\ \exists x:\ P(x,y)$.

      (ב) הראו בדוגמה שמ-$\forall y\ \exists x:\ P(x,y)$ לא נובעת $\exists x\ \forall y:\ P(x,y)$.
    answer: >-
      (א) ה-$x_0$ האחד מתאים לכל $y$. (ב) $P(x,y)$: $x=y$. לכל $y$ יש $x=y$, אבל אין $x$ ששווה לכל $y$.
    solution:
      - kind: idea
        text: >-
          (א) ה-$x$ שמתאים לכל $y$ הוא תשובה מוכנה מראש. (ב) צריך תנאי שבו כל $y$ צריך $x$ משלו.
      - kind: step
        text: >-
          (א) לפי ההנחה יש $x_0$ כך ש-$P(x_0,y)$ לכל $y$. יהי $y$ כלשהו. אז $P(x_0,y)$, ולכן עבור ה-$y$ הזה קיים $x$
          מתאים, $x=x_0$. כיוון ש-$y$ היה כלשהו, $\forall y\ \exists x:\ P(x,y)$.
      - kind: step
        text: >-
          (ב) ניקח את התנאי $P(x,y)$: $x=y$. הטענה $\forall y\ \exists x:\ x=y$ נכונה: לכל $y$ בוחרים $x=y$.
      - kind: step
        text: >-
          הטענה $\exists x\ \forall y:\ x=y$ שקרית: יהי $x$ מועמד כלשהו. נבחר $y=x+1$ (מותר: $y$ עובר על כל
          המספרים הממשיים). אז $x=y$ פירושו $x=x+1$, וזה לא מתקיים. כך כל מועמד $x$ נופל, ולכן אין $x$ ששווה לכל $y$.
      - kind: check
        text: >-
          זה אותו משפט כמו בשיעור, עם המשתנים בתפקידים הפוכים, ואותה תמונה: עמודה מלאה ברשת נותנת נקודה מלאה בכל
          שורה. התנאי $x=y$ הוא האלכסון של הרשת: בכל שורה נקודה מלאה אחת, ואף עמודה אינה מלאה.
      - kind: result
        text: >-
          $\exists x\ \forall y$ גוררת $\forall y\ \exists x$, וההפך לא נכון: $x=y$ הוא דוגמה נגדית.

  - id: W-0.3-08
    level: exam
    objectives: [OBJ-0.3-2, OBJ-0.3-3]
    prompt: >-
      נתונות שתי טענות:

      $$U:\quad \forall x\in\mathbb{R}\ \ \exists y\in\mathbb{R}\ \ \forall z\in\mathbb{R}:\quad z>y\Rightarrow z>x$$

      $$V:\quad \exists y\in\mathbb{R}\ \ \forall x\in\mathbb{R}\ \ \forall z\in\mathbb{R}:\quad z>y\Rightarrow z>x$$

      (א) הוכיחו את $U$.

      (ב) כתבו את השלילה של $V$ בצורה מכנית, בלי סימן שלילה לפני כמת או לפני גרירה.

      (ג) הוכיחו את השלילה של $V$, ואמרו במילים מה ההבדל בין $U$ ל-$V$.
    answer: >-
      (א) $y=x$. (ב) $\forall y\ \exists x\ \exists z:\ z>y\land z\le x$. (ג) $z=x=y+1$. $U$: לכל $x$ יש סף שמעליו
      הכול גדול מ-$x$. $V$: יש סף אחד שמעליו הכול גדול מכל מספר, וזה שקר.
    solution:
      - kind: idea
        text: >-
          ב-$U$ ה-$y$ נבחר אחרי $x$ ויכול להיות $x$ עצמו. ב-$V$ ה-$y$ נבחר לפני $x$, ולכן $x$ יכול להיות גדול ממנו.
      - kind: step
        text: >-
          (א) יהי $x$ ממשי. נבחר $y=x$. יהי $z$ ממשי עם $z>y$. אז $z>x$, כי $y=x$. לכן הגרירה מתקיימת לכל $z$.
      - kind: step
        text: >-
          (ב) כל כמת מתהפך, ושלילת הגרירה $z>y\Rightarrow z>x$ היא $z>y\land z\le x$:

          $$\neg V:\quad \forall y\in\mathbb{R}\ \ \exists x\in\mathbb{R}\ \ \exists z\in\mathbb{R}:\quad z>y\land z\le x$$
      - kind: step
        text: >-
          (ג) יהי $y$ ממשי. נבחר $x=y+1$ ו-$z=y+1$. אז $z=y+1>y$, וגם $z=x$, ובפרט $z\le x$. לכן $\neg V$ נכונה,
          ו-$V$ שקרית.
      - kind: check
        text: >-
          עם $y=5$: $x=z=6$, ו-$6>5$ וגם $6\le 6$. ב-(א) עם $x=2$: $y=2$, ו-$z=2.5$ אכן גדול מ-2.
      - kind: result
        text: >-
          $U$ נכונה: לכל $x$ יש סף ($y=x$) שכל מספר מעליו גדול מ-$x$. $V$ שקרית: היא טוענת שיש סף אחד שכל מספר מעליו
          גדול מכל המספרים. ההבדל הוא רק המקום של $\exists y$.

  - id: W-0.3-09
    level: exam
    objectives: [OBJ-0.3-1, OBJ-0.3-2, OBJ-0.3-3]
    prompt: >-
      תהי $f:\mathbb{R}\to\mathbb{R}$ פונקציה, כלומר כלל שמתאים לכל מספר ממשי $x$ מספר ממשי $f(x)$, ונתונות
      הטענות

      $$A:\ \forall x\in\mathbb{R}\ \exists y\in\mathbb{R}:\ f(y)>f(x) \qquad B:\ \exists y\in\mathbb{R}\ \forall x\in\mathbb{R}:\ f(y)\ge f(x)$$

      (א) אמרו במילים מה אומרת כל אחת.

      (ב) הוכיחו ש-$A$ שקולה לשלילה של $B$.

      (ג) קבעו מי מהן נכונה עבור $f(x)=x^2$, ומי עבור $f(x)=-x^2$, והוכיחו.
    answer: >-
      (א) $A$: לכל נקודה יש נקודה שבה הערך גדול יותר. $B$: יש נקודה שבה $f$ מקבלת את הערך הגדול ביותר שלה.
      (ב) $\neg B$ היא $A$ עם שמות המשתנים מוחלפים. (ג) ל-$x^2$: $A$ נכונה ו-$B$ שקרית. ל-$-x^2$: $B$ נכונה ($y=0$)
      ו-$A$ שקרית.
    solution:
      - kind: step
        text: >-
          (א) $A$: לכל $x$ יש $y$ שבו הערך של $f$ גדול ממש מהערך ב-$x$, כלומר אין נקודה שבה $f$ מגיעה לערך הכי גדול
          שלה. $B$: יש $y$ שהערך בו גדול או שווה לכל הערכים, כלומר $f$ מקבלת ערך גדול ביותר, בנקודה $y$.
      - kind: step
        text: >-
          (ב) השלילה המכנית של $B$: $\forall y\in\mathbb{R}\ \exists x\in\mathbb{R}:\ f(y)<f(x)$. אם נקרא למשתנה
          הראשון $x$ ולשני $y$ (שמות של משתנים שתחת כמת אפשר להחליף, כל עוד מחליפים בכל מקום), נקבל
          $\forall x\ \exists y:\ f(x)<f(y)$, וזו בדיוק $A$.
      - kind: idea
        text: >-
          לפי (ב) בדיוק אחת מ-$A$ ו-$B$ נכונה לכל פונקציה. לכן מספיק להוכיח את הנכונה.
      - kind: step
        text: >-
          (ג) $f(x)=x^2$: נוכיח את $A$. יהי $x$ ממשי, ונבחר $y=|x|+1$. אז $y>|x|\ge 0$, ולכן
          $y^2-x^2=y^2-|x|^2=(y-|x|)(y+|x|)>0$, כי שני הגורמים חיוביים. כלומר $f(y)>f(x)$.
      - kind: step
        text: >-
          $f(x)=-x^2$: נוכיח את $B$ עם $y=0$. לכל $x$ ממשי $x^2\ge 0$, ולכן $f(x)=-x^2\le 0=f(0)$.
      - kind: check
        text: >-
          עבור $x^2$ עם $x=-3$ ההוכחה בוחרת $y=4$, ו-$16>9$. עבור $x=0$ היא בוחרת $y=1$, ו-$1>0$. ה-$y$ תלוי ב-$x$,
          כפי ש-$A$ מרשה.
      - kind: result
        text: >-
          $A$ שקולה ל-$\neg B$. עבור $x^2$: $A$ נכונה ו-$B$ שקרית. עבור $-x^2$: $B$ נכונה (המקסימום 0 ב-$y=0$) ו-$A$
          שקרית.

  - id: W-0.3-10
    level: exam
    objectives: [OBJ-0.3-1, OBJ-0.3-2, OBJ-0.3-3]
    prompt: >-
      המשפט: "לכל מספר חיובי יש מספר חיובי קטן ממנו, ואין מספר חיובי שקטן מכל המספרים החיוביים או שווה להם."

      (א) כתבו אותו בכמתים.

      (ב) כתבו את החלק השני בלי סימן שלילה לפני כמת, ושימו לב למה שיוצא.

      (ג) הוכיחו את המשפט.

      (ד) מה קורה לכל אחד משני החלקים אם מחליפים בכל מקום "מספר חיובי" ב"מספר טבעי"?
    answer: >-
      (א) $(\forall x>0\ \exists y>0:\ y<x)\land\neg(\exists y>0\ \forall x>0:\ y\le x)$. (ב) $\forall y>0\ \exists x>0:\
      x<y$, שזה החלק הראשון עם שמות מוחלפים. (ג) $y=\frac x2$. (ד) שני החלקים מתהפכים: 1 הוא הטבעי הקטן ביותר.
    solution:
      - kind: step
        text: >-
          (א) החלק הראשון: $\forall x>0\ \exists y>0:\ y<x$. החלק השני, "אין מספר חיובי שקטן או שווה לכל החיוביים":
          $\neg\,(\exists y>0\ \forall x>0:\ y\le x)$. המשפט הוא "וגם" של השניים.
      - kind: step
        text: >-
          (ב) לפי הכלל: $\forall y>0\ \exists x>0:\ x<y$ (התחומים $y>0$ ו-$x>0$ נשארים, ו-$\le$ הופך ל-$<$). אם
          מחליפים את שמות המשתנים זו בדיוק הטענה של החלק הראשון. כלומר שני החלקים הם אותה טענה: "אין חיובי קטן ביותר"
          ו"לכל חיובי יש חיובי קטן ממנו" אומרים אותו דבר.
      - kind: step
        text: >-
          (ג) לכן מספיק להוכיח את החלק הראשון. יהי $x>0$. נבחר $y=\frac x2$. אז $y>0$, ו-$x-y=\frac x2>0$, כלומר
          $y<x$.
      - kind: step
        text: >-
          (ד) בטבעיים החלק הראשון, $\forall n\in\mathbb{N}\ \exists m\in\mathbb{N}:\ m<n$, שקרי: ל-$n=1$ אין טבעי קטן
          ממנו. והטענה שהחלק השני שולל, $\exists m\in\mathbb{N}\ \forall n\in\mathbb{N}:\ m\le n$, נכונה עם $m=1$,
          ולכן גם החלק השני שקרי.
      - kind: check
        text: >-
          ב-(ג) עם $x=0.01$ נקבל $y=0.005$, חיובי וקטן יותר. וב-(ד) שני החלקים התהפכו יחד, כמו שצריך לטענות שקולות.
      - kind: result
        text: >-
          המשפט נכון בחיוביים, ושני חלקיו הם אותה טענה. בטבעיים שני החלקים שקריים, כי 1 הוא הטבעי הקטן ביותר.

challenge:
  - id: W-0.3-c1
    stars: 1
    objectives: [OBJ-0.3-1, OBJ-0.3-2, OBJ-0.3-3]
    prompt: >-
      המשפט המיוחס לאברהם לינקולן: "אפשר לרמות חלק מהאנשים כל הזמן, ואפשר לרמות את כל האנשים חלק מהזמן, אבל אי
      אפשר לרמות את כל האנשים כל הזמן." נסמן ב-$F(x,t)$ את הטענה "אפשר לרמות את האדם $x$ ברגע $t$".

      (א) כתבו את המשפט בכמתים. ("אבל" הוא "וגם".)

      (ב) לחלק האמצעי, "את כל האנשים חלק מהזמן", יש שתי קריאות. כתבו את שתיהן, הסבירו את ההבדל, ואמרו איזו גוררת
      את האחרת.

      (ג) שללו את המשפט כולו (בקריאה החזקה של החלק האמצעי), בלי סימן שלילה לפני כמת.
    answer: >-
      (א) $(\exists x\ \forall t:\ F)\land(\exists t\ \forall x:\ F)\land\neg(\forall x\ \forall t:\ F)$, או עם
      $\forall x\ \exists t$ בחלק האמצעי. (ב) $\exists t\ \forall x$ (רגע אחד שבו כולם מרומים) גוררת את
      $\forall x\ \exists t$ (כל אחד מרומה ברגע משלו), ולא להפך. (ג)
      $(\forall x\ \exists t:\ \neg F)\lor(\forall t\ \exists x:\ \neg F)\lor(\forall x\ \forall t:\ F)$.
    solution:
      - kind: idea
        text: >-
          כל חלק הוא טענה עם שני כמתים. "חלק מהאנשים" הוא $\exists x$, "כל הזמן" הוא $\forall t$, וכן הלאה. הסדר בכל
          חלק הוא מה שמבדיל בין הקריאות.
      - kind: step
        text: >-
          (א) "חלק מהאנשים כל הזמן": יש אדם שאפשר לרמות אותו בכל רגע, $\exists x\ \forall t:\ F(x,t)$. "אי אפשר
          לרמות את כל האנשים כל הזמן": $\neg\,(\forall x\ \forall t:\ F(x,t))$. החלק האמצעי בסעיף (ב).
      - kind: step
        text: >-
          (ב) קריאה אחת: יש רגע שבו אפשר לרמות את כולם, $\exists t\ \forall x:\ F(x,t)$. קריאה שנייה: כל אדם אפשר
          לרמות ברגע כלשהו, אולי רגע אחר לכל אדם, $\forall x\ \exists t:\ F(x,t)$. לפי המשפט מהשיעור הראשונה גוררת
          את השנייה: הרגע האחד מתאים לכל אדם. ההפך לא נכון: אם כל אדם מרומה רק ביום ההולדת שלו, ולא לכולם אותו יום
          הולדת, השנייה נכונה והראשונה לא.
      - kind: step
        text: >-
          (ג) שלילה של "וגם" היא "או" של השלילות. משלילים כל חלק לפי הכלל:
          $\neg(\exists x\ \forall t:\ F)$ היא $\forall x\ \exists t:\ \neg F$;
          $\neg(\exists t\ \forall x:\ F)$ היא $\forall t\ \exists x:\ \neg F$;
          $\neg\neg(\forall x\ \forall t:\ F)$ היא $\forall x\ \forall t:\ F$.
      - kind: check
        text: >-
          במילים: או שלכל אדם יש רגע שבו אי אפשר לרמות אותו, או שבכל רגע יש מישהו שאי אפשר לרמות, או שאפשר לרמות את
          כולם תמיד. מספיק שאחד מהמצבים האלה יתקיים כדי שלינקולן יטעה.
      - kind: result
        text: >-
          (ג) $(\forall x\ \exists t:\ \neg F(x,t))\lor(\forall t\ \exists x:\ \neg F(x,t))\lor(\forall x\ \forall t:\
          F(x,t))$.
    source:
      name: 'Book of Proof (Richard Hammack), third edition'
      year: 2018
      problem: 'Chapter 2, Exercise 12 of Section 2.9'
      url: 'https://richardhammack.github.io/BookOfProof/Main.pdf'
      verified: '2026-11-09'
      adapted: true

  - id: W-0.3-c2
    stars: 1
    objectives: [OBJ-0.3-1, OBJ-0.3-2]
    prompt: >-
      תהי $f:\mathbb{R}\to\mathbb{R}$ פונקציה (כלל שמתאים לכל מספר ממשי $x$ מספר ממשי $f(x)$), ו-$b$ מספר ממשי.
      ($\varepsilon$ היא האות היוונית אפסילון, כאן שם של משתנה.) נתון המשפט: "לכל מספר חיובי $\varepsilon$ יש מספר חיובי
      $M$ כך ש-$|f(x)-b|<\varepsilon$ בכל פעם ש-$x>M$."

      (א) כתבו את המשפט בכמתים, כולל הכמת הסמוי.

      (ב) שללו אותו בצורה מכנית, ותרגמו את השלילה למילים.

      (ג) הוכיחו שעבור $f(x)=x$ ו-$b=0$ השלילה נכונה.
    answer: >-
      (א) $\forall\varepsilon>0\ \exists M>0\ \forall x\in\mathbb{R}:\ x>M\Rightarrow|f(x)-b|<\varepsilon$.
      (ב) $\exists\varepsilon>0\ \forall M>0\ \exists x\in\mathbb{R}:\ x>M\land|f(x)-b|\ge\varepsilon$.
      (ג) $\varepsilon=1$, ולכל $M$ בוחרים $x=M+1$.
    solution:
      - kind: idea
        text: >-
          "בכל פעם ש-$x>M$" הוא "לכל $x$ שגדול מ-$M$": כמת סמוי, עם גרירה. רק אחרי שכותבים אותו אפשר לשלול נכון.
      - kind: step
        text: >-
          (א) $\forall\varepsilon>0\ \ \exists M>0\ \ \forall x\in\mathbb{R}:\ \ x>M\Rightarrow|f(x)-b|<\varepsilon$.
          ה-$M$ נבחר אחרי $\varepsilon$ ותלוי בו.
      - kind: step
        text: >-
          (ב) שלושת הכמתים מתהפכים, התחומים נשארים, ושלילת הגרירה היא "ההנחה וגם שלילת המסקנה":
          $\exists\varepsilon>0\ \ \forall M>0\ \ \exists x\in\mathbb{R}:\ \ x>M\land|f(x)-b|\ge\varepsilon$.
          במילים: יש מרחק חיובי $\varepsilon$ כך שמעבר לכל סף $M$ יש עוד $x$ שבו $f(x)$ רחוק מ-$b$ לפחות
          $\varepsilon$.
      - kind: step
        text: >-
          (ג) עם $f(x)=x$ ו-$b=0$ התנאי הוא $|x|\ge\varepsilon$. נבחר $\varepsilon=1$. יהי $M>0$, ונבחר $x=M+1$. אז
          $x>M$, ו-$|x|=M+1>1$, ובפרט $|x|\ge 1$.
      - kind: check
        text: >-
          עם $M=100$: $x=101$, ו-$|101-0|=101\ge 1$. וכל $M$ שייבחר נכשל, כי ה-$x$ נבחר אחרי $M$ ותלוי בו.
      - kind: result
        text: >-
          השלילה: יש $\varepsilon>0$ כך שלכל $M>0$ יש $x>M$ עם $|f(x)-b|\ge\varepsilon$. עבור $f(x)=x$ ו-$b=0$ היא
          נכונה עם $\varepsilon=1$ ו-$x=M+1$.
    source:
      name: 'Book of Proof (Richard Hammack), third edition'
      year: 2018
      problem: 'Chapter 2, Exercise 5 of Section 2.10'
      url: 'https://richardhammack.github.io/BookOfProof/Main.pdf'
      verified: '2026-11-09'
      adapted: true
