# Workbook of lesson 0.3 — quantifiers and negation.
# Objectives (src/course.ts):
#   OBJ-0.3-1  translate a Hebrew mathematical sentence into "for all" / "there exists", and back
#   OBJ-0.3-2  negate a statement with several nested quantifiers, mechanically and correctly
#   OBJ-0.3-3  explain, with an example, why the order of quantifiers changes the meaning
# Numbered results cited: definitions 0.3.2, 0.3.4, 0.3.7; claim 0.3.5 (restricted quantifiers), 0.3.8 (existence
# and uniqueness), theorem 0.3.10 (negating a quantifier), corollaries 0.3.11, 0.3.12, 0.3.14, claim 0.3.13
# (negating the condition), 0.3.16 (distribution), theorem 0.3.17 (∃∀ ⇒ ∀∃). Accepted facts (א)–(ה) of lesson 0.1.
# W-0.3-05 was evaluated with src/math/quantifiers.ts (holds); every other number by a command in the session that
# wrote this file.
lesson: '0.3'
practice:
  - id: W-0.3-01
    level: basic
    objectives: [OBJ-0.3-1]
    prompt: >-
      כתבו כל משפט כטענה עם כמתים, וקבעו אם הוא נכון.

      (א) יש מספר ממשי שקטן מכל המספרים הטבעיים.

      (ב) למשוואה $x^2+x+1=0$ אין פתרון ממשי.

      (ג) בין כל שני מספרים ממשיים שונים יש מספר ממשי.
    answer: >-
      (א) $\exists x\in\mathbb{R}\ \forall n\in\mathbb{N}:\ x<n$, נכון ($x=0$).

      (ב) $\forall x\in\mathbb{R}:\ x^2+x+1\ne 0$, נכון.

      (ג) $\forall x\in\mathbb{R}\ \forall y\in\mathbb{R}:\ x<y\Rightarrow \exists z\in\mathbb{R}:\ x<z\land z<y$, נכון.
    solution:
      - kind: idea
        text: >-
          לכל משפט מזהים את הכמתים ואת הסדר שלהם. "יש" הוא $\exists$, "כל" ו"לכל" הם $\forall$, ו"אין" הוא שלילה של
          "יש", שלפי משפט 0.3.10 היא "לכל" עם תנאי שלול.
      - kind: step
        text: >-
          (א) המספר הממשי נבחר קודם, ואחריו "כל המספרים הטבעיים":
          $\exists x\in\mathbb{R}\ \forall n\in\mathbb{N}:\ x<n$. נכון: נבחר $x=0$. יהי $n$ טבעי; אז $n\ge 1>0$.
      - kind: step
        text: >-
          (ב) "אין פתרון" הוא $\neg\,\exists x\in\mathbb{R}:\ x^2+x+1=0$, ולפי משפט 0.3.10 זה
          $\forall x\in\mathbb{R}:\ x^2+x+1\ne 0$.
      - kind: computation
        text: >-
          נכון: יהי $x$ ממשי. משלימים לריבוע, $x^2+x+1=\left(x+\frac12\right)^2+\frac34$ (חשבון, עובדה מקובלת (א)).
          הריבוע אינו שלילי (עובדה מקובלת (ב)), ולכן הביטוי לפחות $\frac34>0$, ובפרט אינו 0.
      - kind: step
        text: >-
          (ג) "כל שני מספרים שונים": אחד מהם קטן מהשני, ונקרא לקטן $x$ ולגדול $y$. "יש מספר ביניהם" הוא $\exists z$
          שבא אחרי שניהם, ולכן תלוי בהם:
          $\forall x\in\mathbb{R}\ \forall y\in\mathbb{R}:\ x<y\Rightarrow \exists z\in\mathbb{R}:\ (x<z\land z<y)$.
          התנאי "x קטן מ-y" בא בגרירה, כי הוא מגביל את "לכל" (טענה 0.3.5).
      - kind: check
        text: >-
          נכון: אם $x<y$ נבחר $z=\frac{x+y}{2}$. אז $z-x=\frac{y-x}{2}>0$ ו-$y-z=\frac{y-x}{2}>0$. למשל $x=1$,
          $y=2$ נותנים $z=1.5$.
      - kind: result
        text: >-
          שלוש הטענות נכונות. ב-(ג) ה-$z$ תלוי ב-$x$ וב-$y$, כי הוא נבחר אחריהם.

  - id: W-0.3-02
    level: basic
    qualitative: true
    objectives: [OBJ-0.3-1]
    prompt: >-
      אמרו במילים מה אומרת כל טענה, וקבעו אם היא נכונה.

      (א) $\forall x\in\mathbb{R}\ \exists y\in\mathbb{R}:\ y^3=x$

      (ב) $\exists x\in\mathbb{R}\ \forall y\in\mathbb{R}:\ xy=0$

      (ג) $\forall x\in\mathbb{R}:\ x^2=1\Rightarrow x=1$
    answer: >-
      (א) לכל מספר ממשי יש שורש שלישי ממשי: נכון.

      (ב) יש מספר שמכפלתו בכל מספר היא 0: נכון ($x=0$).

      (ג) כל מספר שריבועו 1 שווה ל-1: לא נכון ($x=-1$).
    solution:
      - kind: idea
        text: קוראים משמאל לימין, וכל כמת הופך למילים במקומו. מה שנבחר אחרי משתנה רשאי להיות תלוי בו.
      - kind: step
        text: >-
          (א) "לכל מספר ממשי $x$ יש מספר ממשי $y$ שהחזקה השלישית שלו היא $x$", כלומר לכל מספר ממשי יש שורש
          שלישי ממשי. נכון: $y=\sqrt[3]{x}$, שמוכר מבית הספר גם למספרים שליליים (עובדה מקובלת (ה); למשל
          $\sqrt[3]{-8}=-2$). ה-$y$ תלוי ב-$x$.
      - kind: step
        text: >-
          (ב) "יש מספר ממשי $x$ כך שלכל $y$, $xy=0$". אותו $x$ צריך להתאים לכל $y$. נכון: $x=0$, כי $0\cdot y=0$
          לכל $y$.
      - kind: step
        text: >-
          (ג) "כל מספר ממשי שריבועו 1 שווה ל-1". זו טענת "לכל", ומפריכים אותה בדוגמה נגדית אחת (מסקנה 0.3.11):
          $x=-1$ מקיים $(-1)^2=1$, אבל $-1\ne 1$. בשורה של $x=-1$ ההנחה נכונה והמסקנה שקרית, וזו בדיוק השורה שבה
          גרירה שקרית.
      - kind: check
        text: >-
          ב-(ב) הסדר חשוב: $\exists x\ \forall y$ דורשת $x$ אחד לכל ה-$y$, ו-$0$ עומד בזה. ב-(ג), $x=1$ מקיים את
          הגרירה, אבל דוגמה אחת שמקיימת לא מוכיחה טענת "לכל".
      - kind: result
        text: (א) נכונה, (ב) נכונה, (ג) לא נכונה.

  - id: W-0.3-03
    level: basic
    objectives: [OBJ-0.3-2]
    prompt: >-
      שללו כל טענה בצורה מכנית, קבעו מי נכונה, הטענה או השלילה שלה, והוכיחו אותה.

      (א) $\exists x\in\mathbb{R}:\ x^2=-1$

      (ב) $\forall n\in\mathbb{N}:\ n^2\ge n$

      (ג) $\forall n\in\mathbb{N}\ \exists m\in\mathbb{N}:\ m^2=n$
    answer: >-
      (א) $\forall x\in\mathbb{R}:\ x^2\ne -1$, השלילה נכונה.

      (ב) $\exists n\in\mathbb{N}:\ n^2<n$, הטענה נכונה.

      (ג) $\exists n\in\mathbb{N}\ \forall m\in\mathbb{N}:\ m^2\ne n$, השלילה נכונה ($n=2$).
    solution:
      - kind: theorem
        text: >-
          מסקנה 0.3.12: כל "לכל" הופך ל"קיים", כל "קיים" הופך ל"לכל", התחומים נשארים, והתנאי שבסוף נשלל (טענה
          0.3.13: שלילת $\ge$ היא $<$).
      - kind: step
        text: >-
          (א) השלילה: $\forall x\in\mathbb{R}:\ x^2\ne -1$. נוכיח אותה: יהי $x$ ממשי. $x^2\ge 0>-1$ (עובדה מקובלת
          (ב)), ולכן $x^2\ne -1$.
      - kind: step
        text: >-
          (ב) השלילה: $\exists n\in\mathbb{N}:\ n^2<n$. הטענה המקורית נכונה: יהי $n$ טבעי. $n\ge 1$, ומכפילים במספר
          החיובי $n$ (עובדה מקובלת (ב)): $n^2\ge n$.
      - kind: step
        text: >-
          (ג) השלילה: $\exists n\in\mathbb{N}\ \forall m\in\mathbb{N}:\ m^2\ne n$, כלומר יש מספר טבעי שאינו ריבוע של
          טבעי. נוכיח אותה עם $n=2$. יהי $m$ טבעי. אין שלם ממש בין 1 ל-2 (עובדה מקובלת (ג)), ולכן $m=1$ או
          $m\ge 2$. אם $m=1$, $m^2=1\ne 2$. אם $m\ge 2$, כשמכפילים פעמיים (ב-$m$ וב-2) מקבלים $m^2\ge 2m\ge 4>2$.
      - kind: check
        text: >-
          בכל זוג בדיוק אחת נכונה. ב-(ג) שימו לב שהשלילה לא החליפה את הסדר: $n$ עדיין נבחר לפני $m$, רק הכמתים
          התהפכו.
      - kind: result
        text: (א) השלילה נכונה; (ב) הטענה נכונה; (ג) השלילה נכונה.

  - id: W-0.3-04
    level: mid
    qualitative: true
    objectives: [OBJ-0.3-2]
    prompt: >-
      שלושה סטודנטים שללו את הטענה $A:\ \forall x\in\mathbb{R}\ \exists y\in\mathbb{R}:\ x<y$.

      (I) $\exists x\in\mathbb{R}\ \exists y\in\mathbb{R}:\ x\ge y$

      (II) $\exists x\in\mathbb{R}\ \forall y\in\mathbb{R}:\ x>y$

      (III) $\forall x\in\mathbb{R}\ \exists y\in\mathbb{R}:\ x\ge y$

      מצאו את הטעות של כל אחד, וכתבו את השלילה הנכונה. למי מהם אפשר לגלות את הטעות רק לפי ערך האמת?
    answer: >-
      השלילה הנכונה: $\exists x\in\mathbb{R}\ \forall y\in\mathbb{R}:\ x\ge y$. (I) לא הפך את הכמת השני, (II)
      שלל את $<$ ל-$>$, (III) לא הפך אף כמת. את (I) ואת (III) מגלים לפי ערך האמת: הן נכונות, כמו $A$.
    solution:
      - kind: step
        text: >-
          השלילה הנכונה לפי מסקנה 0.3.12 וטענה 0.3.13: $\forall$ הופך ל-$\exists$, $\exists$ הופך ל-$\forall$,
          ו-$x<y$ נשלל ל-$x\ge y$: $\exists x\in\mathbb{R}\ \forall y\in\mathbb{R}:\ x\ge y$, כלומר יש מספר ממשי גדול
          או שווה לכל המספרים.
      - kind: step
        text: >-
          (I) הפך רק את הכמת הראשון. (II) הפך את שני הכמתים, אבל שלל $<$ ל-$>$ ושכח את השוויון. (III) שלל רק את
          התנאי והשאיר את הכמתים.
      - kind: check
        text: >-
          $A$ נכונה ($y=x+1$, טענה 0.3.18), ולכן השלילה שלה חייבת להיות שקרית. (I) נכונה ($x=y=0$) ו-(III) נכונה
          ($y=x$), ולכן אף אחת מהן אינה השלילה. (II) שקרית, כמו השלילה הנכונה, ולכן ערך האמת לא מגלה את הטעות בה.
      - kind: step
        text: >-
          כדי לראות ש-(II) אומרת משהו אחר, מעבירים את שתי הטענות לתחום אחר, הקבוצה $\{1,2,3\}$: שם
          $\exists x\ \forall y:\ x\ge y$ נכונה ($x=3$), אבל $\exists x\ \forall y:\ x>y$ שקרית, כי $y=x$ תמיד נכשל.
          שתי טענות שקולות (הגדרה 0.3.3) מסכימות בכל תחום.
      - kind: result
        text: >-
          השלילה הנכונה היא $\exists x\ \forall y:\ x\ge y$. שלושת הסטודנטים טעו; את הטעות של (II) מגלים רק כשבודקים
          את הניסוח, לא את ערך האמת.

  - id: W-0.3-05
    level: mid
    qualitative: true
    objectives: [OBJ-0.3-3]
    prompt: >-
      על הקבוצה $\{1,2,3\}$ התנאי $R(x,y)$ מתקיים בדיוק בארבעה זוגות: $(1,2)$, $(2,3)$, $(3,1)$ ו-$(3,3)$.
      הוכיחו או הפריכו כל טענה (בדוגמה, באסטרטגיה או בדוגמה נגדית).

      (א) $\forall x\ \exists y:\ R(x,y)$

      (ב) $\exists y\ \forall x:\ R(x,y)$

      (ג) $\exists x\ \forall y:\ R(x,y)$

      (ד) $\forall y\ \exists x:\ R(x,y)$
    answer: (א) נכונה; (ב) שקרית; (ג) שקרית; (ד) נכונה.
    solution:
      - kind: idea
        text: >-
          ב"לכל-קיים" נותנים תשובה לכל ערך של המשתנה הראשון. ב"קיים-לכל" צריך ערך אחד שעובד מול כל הערכים, ומפריכים
          את זה בהוכחת השלילה (משפט 0.3.10): לכל ערך, ערך נגדי שמפיל אותו.
      - kind: step
        text: >-
          (א) נכונה. אסטרטגיה: ל-$x=1$ עונים $y=2$, ל-$x=2$ עונים $y=3$, ל-$x=3$ עונים $y=1$. ה-$y$ שונה לכל $x$.
      - kind: step
        text: >-
          (ב) שקרית. נוכיח את השלילה, $\forall y\ \exists x:\ \neg R(x,y)$: $y=1$ נופל ב-$x=1$ (הזוג $(1,1)$ אינו
          ברשימה), $y=2$ נופל ב-$x=2$, ו-$y=3$ נופל ב-$x=1$.
      - kind: step
        text: >-
          (ג) שקרית. השלילה, $\forall x\ \exists y:\ \neg R(x,y)$: $x=1$ נופל ב-$y=1$, $x=2$ נופל ב-$y=1$, ו-$x=3$
          נופל ב-$y=2$ (הזוג $(3,2)$ אינו ברשימה).
      - kind: step
        text: >-
          (ד) נכונה. ל-$y=1$ עונים $x=3$, ל-$y=2$ עונים $x=1$, ל-$y=3$ עונים $x=2$.
      - kind: check
        text: >-
          (א) נכונה ו-(ב) שקרית: אותו תנאי, אותם שני כמתים, וסדר אחר. וכמו שמשפט 0.3.17 אומר, אילו (ב) הייתה נכונה,
          גם (א) הייתה נכונה; ההפך לא נכון. אותו קשר יש בין (ג) ל-(ד).
      - kind: result
        text: (א) ו-(ד) נכונות; (ב) ו-(ג) שקריות.

  - id: W-0.3-06
    level: mid
    objectives: [OBJ-0.3-1, OBJ-0.3-2]
    prompt: >-
      (א) כתבו בכמתים, עם הקשר הנכון בין התחום לתנאי, ושללו: "כל מספר שלם שמתחלק ב-6 מתחלק ב-3". קבעו מי נכונה,
      הטענה או השלילה, והוכיחו אותה.

      (ב) כתבו את הטענה $\exists! x\in\mathbb{R}\ \forall y\in\mathbb{R}:\ xy=x$ בעזרת $\exists$ ו-$\forall$ בלבד,
      והוכיחו אותה.
    answer: >-
      (א) $\forall n\in\mathbb{Z}:\ 6\mid n\Rightarrow 3\mid n$; השלילה $\exists n\in\mathbb{Z}:\ 6\mid n\land 3\nmid n$.
      הטענה נכונה.

      (ב) $\exists x\in\mathbb{R}:\ \big((\forall y\in\mathbb{R}:\ xy=x)\land\forall z\in\mathbb{R}:\ ((\forall y\in\mathbb{R}:\ zy=z)\Rightarrow z=x)\big)$.
      המספר היחיד הוא $x=0$.
    solution:
      - kind: definition
        text: >-
          $a\mid b$ פירושו ש-$a$ מחלק את $b$, כלומר $b=ak$ עבור $k$ שלם, ו-$a\nmid b$ פירושו שלא. לפי טענה 0.3.5,
          עם "לכל" התנאי המגביל בא בגרירה, ועם "קיים" ב"וגם".
      - kind: step
        text: >-
          (א) "כל מספר שמתחלק ב-6" הוא "לכל" עם תנאי: $\forall n\in\mathbb{Z}:\ (6\mid n\Rightarrow 3\mid n)$.
          לפי משפט 0.3.10 וטענה 0.3.13, השלילה היא "ההנחה וגם שלילת המסקנה":
          $\exists n\in\mathbb{Z}:\ (6\mid n\land 3\nmid n)$.
      - kind: step
        text: >-
          הטענה נכונה: יהי $n$ שלם עם $6\mid n$. אז $n=6k$ עבור $k$ שלם, ולכן $n=3\cdot(2k)$, ו-$2k$ שלם (עובדה
          מקובלת (א)). לכן $3\mid n$.
      - kind: step
        text: >-
          (ב) לפי הגדרה 0.3.7, עם $P(x)$: $\forall y\in\mathbb{R}:\ xy=x$, הטענה היא
          $\exists x\in\mathbb{R}:\ \big(P(x)\land\forall z\in\mathbb{R}:\ (P(z)\Rightarrow z=x)\big)$. לפי טענה 0.3.8
          מוכיחים קיום ויחידות.
      - kind: step
        text: >-
          קיום: $x=0$. יהי $y$ ממשי; $0\cdot y=0$ (טענה 0.1.8), ולכן $P(0)$.
      - kind: step
        text: >-
          יחידות: יהיו $x$, $x'$ ממשיים שמקיימים שניהם את $P$. בוחרים ב-$P(x)$ את $y=0$: $x\cdot 0=x$, ולפי טענה 0.1.8 $x\cdot 0=0$, כלומר $0=x$.
          באותה בחירה ב-$P(x')$: $0=x'$. לכן $x=x'$.
      - kind: check
        text: >-
          $x=1$ אינו מקיים את $P$: עם $y=0$, $1\cdot 0=0\ne 1$. ושימו לב שהיחידות השתמשה בכך ש-$P(x)$ נכון **לכל**
          $y$: מותר לבחור בו $y=0$.
      - kind: result
        text: >-
          (א) הטענה נכונה והשלילה שקרית. (ב) הטענה נכונה: $x=0$ הוא המספר היחיד שמכפלתו בכל מספר שווה לו עצמו.

  - id: W-0.3-07
    level: mid
    qualitative: true
    objectives: [OBJ-0.3-1]
    prompt: >-
      על המספרים השלמים, יהי $E(n)$: "$n$ זוגי" (כלומר $n=2k$ עם $k$ שלם), ו-$O(n)$: "$n$ אי-זוגי" (כלומר
      $n=2k+1$ עם $k$ שלם). הוכיחו או הפריכו:

      (א) $\forall n\in\mathbb{Z}:\ \big(E(n)\lor O(n)\big)$

      (ב) $\big(\forall n\in\mathbb{Z}:\ E(n)\big)\lor\big(\forall n\in\mathbb{Z}:\ O(n)\big)$

      (ג) $\exists n\in\mathbb{Z}:\ \big(E(n)\land O(n)\big)$

      (ד) $\big(\exists n\in\mathbb{Z}:\ E(n)\big)\land\big(\exists n\in\mathbb{Z}:\ O(n)\big)$

      איזה חלק של טענה 0.3.16 מדגימים הזוגות (א)-(ב) ו-(ג)-(ד)?
    answer: >-
      (א) נכונה; (ב) שקרית; (ג) שקרית; (ד) נכונה. "לכל" אינו מתפלג על "או", ו"קיים" אינו מתפלג על "וגם".
    solution:
      - kind: idea
        text: >-
          הכלי הוא חלוקה עם שארית ב-2 (עובדה מקובלת (ג)): לכל שלם $n$ יש $q$ ו-$r$ שלמים **יחידים** עם $n=2q+r$
          ו-$0\le r<2$. $E(n)$ פירושו שאפשר $r=0$, ו-$O(n)$ שאפשר $r=1$.
      - kind: step
        text: >-
          (א) נכונה. יהי $n$ שלם, ויהיו $q,r$ מהחלוקה ב-2. $r$ שלם ו-$0\le r<2$, ואין שלם ממש בין 0 ל-1 או ממש בין 1
          ל-2 (עובדה מקובלת (ג)), ולכן $r=0$ או $r=1$. במקרה הראשון $n=2q$ זוגי, ובשני $n=2q+1$ אי-זוגי.
      - kind: step
        text: >-
          (ג) שקרית. נוכיח את השלילה, $\forall n\in\mathbb{Z}:\ \neg(E(n)\land O(n))$ (משפט 0.3.10). יהי $n$ שלם, ונניח
          ש-$n=2k$ וגם $n=2j+1$ עם $k,j$ שלמים. אלה שתי חלוקות של $n$ ב-2 עם שארית, עם השאריות 0 ו-1, ולפי
          היחידות בעובדה מקובלת (ג) השאריות שוות: $0=1$, וזה שקר. לכן $E(n)\land O(n)$ שקרי לכל $n$. ((א) ו-(ג) יחד הן למה 0.1.3.)
      - kind: step
        text: >-
          (ב) שקרית: שני חלקי ה"או" שקריים. $\forall n:\ E(n)$ נופלת בדוגמה הנגדית $n=1=2\cdot 0+1$, שהוא אי-זוגי,
          ולכן לפי (ג) אינו זוגי. $\forall n:\ O(n)$ נופלת בדוגמה הנגדית $n=0=2\cdot 0$, שהוא זוגי, ולכן לפי (ג) אינו
          אי-זוגי.
      - kind: step
        text: >-
          (ד) נכונה: $0=2\cdot 0$ הוא דוגמה ל-$\exists n:\ E(n)$, ו-$1=2\cdot 0+1$ הוא דוגמה ל-$\exists n:\ O(n)$.
      - kind: check
        text: >-
          לפי טענה 0.3.16, (ב) גוררת את (א) ו-(ג) גוררת את (ד), והכיוונים האלה לא נשברו כאן: (ב) ו-(ג) שקריות. מה
          שנשבר הוא ההפך: (א) נכונה ו-(ב) לא; (ד) נכונה ו-(ג) לא.
      - kind: result
        text: >-
          (א) ו-(ד) נכונות, (ב) ו-(ג) שקריות. "כל שלם זוגי או אי-זוגי" אינה "כל השלמים זוגיים או כל השלמים
          אי-זוגיים"; "יש זוגי ויש אי-זוגי" אינה "יש מספר שהוא שניהם".

  - id: W-0.3-08
    level: exam
    objectives: [OBJ-0.3-2, OBJ-0.3-3]
    prompt: >-
      נתונות שתי טענות:

      $$U:\quad \forall x\in\mathbb{R}\ \ \exists y\in\mathbb{R}\ \ \forall z\in\mathbb{R}:\quad z>y\Rightarrow z>x$$

      $$V:\quad \exists y\in\mathbb{R}\ \ \forall x\in\mathbb{R}\ \ \forall z\in\mathbb{R}:\quad z>y\Rightarrow z>x$$

      (א) הוכיחו את $U$.

      (ב) כתבו את השלילה של $V$ בצורה מכנית, בלי סימן שלילה לפני כמת או לפני גרירה.

      (ג) הוכיחו את השלילה של $V$, ואמרו במילים מה ההבדל בין $U$ ל-$V$.
    answer: >-
      (א) $y=x$. (ב) $\forall y\ \exists x\ \exists z:\ z>y\land z\le x$. (ג) $z=x=y+1$. $U$: לכל $x$ יש סף שמעליו
      הכול גדול מ-$x$. $V$: יש סף אחד שמעליו הכול גדול מכל מספר, וזה שקר.
    solution:
      - kind: idea
        text: >-
          ב-$U$ ה-$y$ נבחר אחרי $x$ ויכול להיות $x$ עצמו. ב-$V$ ה-$y$ נבחר לפני $x$, ולכן $x$ יכול להיות גדול ממנו.
      - kind: step
        text: >-
          (א) יהי $x$ ממשי. נבחר $y=x$. יהי $z$ ממשי. אם $z>y$, אז $z>x$, כי $y=x$; ואם $z>y$ שקרי, הגרירה אמיתית
          באמת ריקה. לכן הגרירה מתקיימת לכל $z$.
      - kind: step
        text: >-
          (ב) לפי מסקנה 0.3.12 כל כמת מתהפך, ולפי טענה 0.3.13 שלילת הגרירה $z>y\Rightarrow z>x$ היא
          $z>y\land \neg(z>x)$, כלומר $z>y\land z\le x$:

          $$\neg V:\quad \forall y\in\mathbb{R}\ \ \exists x\in\mathbb{R}\ \ \exists z\in\mathbb{R}:\quad z>y\land z\le x$$
      - kind: step
        text: >-
          (ג) יהי $y$ ממשי. נבחר $x=y+1$ ו-$z=y+1$. אז $z=y+1>y$ (כי $1>0$), וגם $z=x$, ובפרט $z\le x$. לכן
          $\neg V$ נכונה, ו-$V$ שקרית.
      - kind: check
        text: >-
          עם $y=5$: $x=z=6$, ו-$6>5$ וגם $6\le 6$. ב-(א) עם $x=2$: $y=2$, ו-$z=2.5$ אכן גדול מ-2. ולפי משפט 0.3.17
          (עם $P(x,y)$: $\forall z:\ z>y\Rightarrow z>x$), $V$ גוררת את $U$; כאן $U$ נכונה ו-$V$ לא, כמו בטענה
          0.3.18.
      - kind: result
        text: >-
          $U$ נכונה: לכל $x$ יש סף ($y=x$) שכל מספר מעליו גדול מ-$x$. $V$ שקרית: היא טוענת שיש סף אחד שכל מספר מעליו
          גדול מכל המספרים. ההבדל הוא רק המקום של $\exists y$.

  - id: W-0.3-09
    level: exam
    objectives: [OBJ-0.3-1, OBJ-0.3-2, OBJ-0.3-3]
    prompt: >-
      תהי $f:\mathbb{R}\to\mathbb{R}$ פונקציה, כלומר כלל שמתאים לכל מספר ממשי $x$ מספר ממשי $f(x)$, ונתונות
      הטענות

      $$A:\ \forall x\in\mathbb{R}\ \exists y\in\mathbb{R}:\ f(y)>f(x) \qquad B:\ \exists y\in\mathbb{R}\ \forall x\in\mathbb{R}:\ f(y)\ge f(x)$$

      (א) אמרו במילים מה אומרת כל אחת.

      (ב) הוכיחו ש-$A$ שקולה לשלילה של $B$.

      (ג) קבעו מי מהן נכונה עבור $f(x)=x^2$, ומי עבור $f(x)=-x^2$, והוכיחו.
    answer: >-
      (א) $A$: לכל נקודה יש נקודה שבה הערך גדול יותר. $B$: יש נקודה שבה $f$ מקבלת את הערך הגדול ביותר שלה.
      (ב) $\neg B$ היא $A$ עם שמות המשתנים מוחלפים. (ג) ל-$x^2$: $A$ נכונה ו-$B$ שקרית. ל-$-x^2$: $B$ נכונה ($y=0$)
      ו-$A$ שקרית.
    solution:
      - kind: step
        text: >-
          (א) $A$: לכל $x$ יש $y$ שבו הערך של $f$ גדול ממש מהערך ב-$x$, כלומר אין נקודה שבה $f$ מגיעה לערך הכי גדול
          שלה. $B$: יש $y$ שהערך בו גדול או שווה לכל הערכים, כלומר $f$ מקבלת ערך גדול ביותר, בנקודה $y$.
      - kind: step
        text: >-
          (ב) לפי מסקנה 0.3.12 וטענה 0.3.13, השלילה של $B$ היא $\forall y\in\mathbb{R}\ \exists x\in\mathbb{R}:\ f(y)<f(x)$.
          לשם של משתנה שתחת כמת אין משמעות (הגדרה 0.3.2), ולכן אפשר לקרוא למשתנה הראשון $x$ ולשני $y$, בכל מקום:
          $\forall x\ \exists y:\ f(x)<f(y)$, וזו בדיוק $A$.
      - kind: idea
        text: >-
          לפי (ב) בדיוק אחת מ-$A$ ו-$B$ נכונה לכל פונקציה. לכן מספיק להוכיח את הנכונה.
      - kind: step
        text: >-
          (ג) $f(x)=x^2$: נוכיח את $A$. יהי $x$ ממשי, ונבחר $y=x^2+1$. אז $y\ge 1>0$ (כי $x^2\ge 0$), וכשמכפילים את
          $1\le y$ במספר החיובי $y$ (עובדה מקובלת (ב)) מקבלים $y\le y^2$. לכן $f(y)=y^2\ge y=x^2+1>x^2=f(x)$.
      - kind: step
        text: >-
          $f(x)=-x^2$: נוכיח את $B$ עם $y=0$. לכל $x$ ממשי $x^2\ge 0$, ולכן $f(x)=-x^2\le 0=f(0)$.
      - kind: check
        text: >-
          עבור $x^2$ עם $x=-3$ ההוכחה בוחרת $y=10$, ו-$100>9$. עבור $x=0$ היא בוחרת $y=1$, ו-$1>0$. ה-$y$ תלוי ב-$x$,
          כפי ש-$A$ מרשה.
      - kind: result
        text: >-
          $A$ שקולה ל-$\neg B$. עבור $x^2$: $A$ נכונה ו-$B$ שקרית. עבור $-x^2$: $B$ נכונה (המקסימום 0 ב-$y=0$) ו-$A$
          שקרית.

  - id: W-0.3-10
    level: exam
    objectives: [OBJ-0.3-1, OBJ-0.3-2, OBJ-0.3-3]
    prompt: >-
      המשפט: "לכל מספר חיובי יש מספר חיובי קטן ממנו, ואין מספר חיובי שקטן מכל המספרים החיוביים או שווה להם."

      (א) כתבו אותו בכמתים.

      (ב) כתבו את החלק השני בלי סימן שלילה לפני כמת, ושימו לב למה שיוצא.

      (ג) הוכיחו את המשפט.

      (ד) מה קורה לכל אחד משני החלקים אם מחליפים בכל מקום "מספר חיובי" ב"מספר טבעי"?
    answer: >-
      (א) $(\forall x>0\ \exists y>0:\ y<x)\land\neg(\exists y>0\ \forall x>0:\ y\le x)$. (ב) $\forall y>0\ \exists x>0:\
      x<y$, שזה החלק הראשון עם שמות מוחלפים. (ג) $y=\frac x2$. (ד) שני החלקים מתהפכים: 1 הוא הטבעי הקטן ביותר.
    solution:
      - kind: step
        text: >-
          (א) החלק הראשון: $\forall x>0\ \exists y>0:\ y<x$. החלק השני, "אין מספר חיובי שקטן או שווה לכל החיוביים":
          $\neg\,(\exists y>0\ \forall x>0:\ y\le x)$. המשפט הוא "וגם" של השניים.
      - kind: step
        text: >-
          (ב) לפי מסקנות 0.3.12 ו-0.3.14 וטענה 0.3.13: $\forall y>0\ \exists x>0:\ x<y$ (התחומים $y>0$ ו-$x>0$
          נשארים, ו-$\le$ הופך ל-$>$, כלומר $y>x$). אם מחליפים את שמות המשתנים זו בדיוק הטענה של החלק הראשון. כלומר
          שני החלקים הם אותה טענה: "אין חיובי קטן ביותר" ו"לכל חיובי יש חיובי קטן ממנו" אומרים אותו דבר.
      - kind: step
        text: >-
          (ג) לכן מספיק להוכיח את החלק הראשון. יהי $x>0$. נבחר $y=\frac x2$. אז $y>0$ (מכפלה של $x>0$ ב-$\frac12>0$,
          עובדה מקובלת (ב)), ו-$x-y=\frac x2>0$, כלומר $y<x$.
      - kind: step
        text: >-
          (ד) בטבעיים החלק הראשון, $\forall n\in\mathbb{N}\ \exists m\in\mathbb{N}:\ m<n$, שקרי: ל-$n=1$ אין טבעי קטן
          ממנו, כי כל טבעי הוא לפחות 1. והטענה שהחלק השני שולל, $\exists m\in\mathbb{N}\ \forall n\in\mathbb{N}:\ m\le n$,
          נכונה עם $m=1$, ולכן גם החלק השני שקרי.
      - kind: check
        text: >-
          ב-(ג) עם $x=0.01$ נקבל $y=0.005$, חיובי וקטן יותר. וב-(ד) שני החלקים התהפכו יחד, כמו שצריך לטענות שקולות.
      - kind: result
        text: >-
          המשפט נכון בחיוביים, ושני חלקיו הם אותה טענה. בטבעיים שני החלקים שקריים, כי 1 הוא הטבעי הקטן ביותר.

challenge:
  - id: W-0.3-c1
    stars: 1
    objectives: [OBJ-0.3-1, OBJ-0.3-2, OBJ-0.3-3]
    prompt: >-
      המשפט המיוחס לאברהם לינקולן: "אפשר לרמות חלק מהאנשים כל הזמן, ואפשר לרמות את כל האנשים חלק מהזמן, אבל אי
      אפשר לרמות את כל האנשים כל הזמן." נסמן ב-$F(x,t)$ את הטענה "אפשר לרמות את האדם $x$ ברגע $t$".

      (א) כתבו את המשפט בכמתים. ("אבל" הוא "וגם".)

      (ב) לחלק האמצעי, "את כל האנשים חלק מהזמן", יש שתי קריאות. כתבו את שתיהן, הסבירו את ההבדל, ואמרו איזו גוררת
      את האחרת.

      (ג) שללו את המשפט כולו (בקריאה החזקה של החלק האמצעי), בלי סימן שלילה לפני כמת.
    answer: >-
      (א) $(\exists x\ \forall t:\ F)\land(\exists t\ \forall x:\ F)\land\neg(\forall x\ \forall t:\ F)$, או עם
      $\forall x\ \exists t$ בחלק האמצעי. (ב) $\exists t\ \forall x$ (רגע אחד שבו כולם מרומים) גוררת את
      $\forall x\ \exists t$ (כל אחד מרומה ברגע משלו), ולא להפך. (ג)
      $(\forall x\ \exists t:\ \neg F)\lor(\forall t\ \exists x:\ \neg F)\lor(\forall x\ \forall t:\ F)$.
    solution:
      - kind: idea
        text: >-
          כל חלק הוא טענה עם שני כמתים. "חלק מהאנשים" הוא $\exists x$, "כל הזמן" הוא $\forall t$, וכן הלאה. הסדר בכל
          חלק הוא מה שמבדיל בין הקריאות.
      - kind: step
        text: >-
          (א) "חלק מהאנשים כל הזמן": יש אדם שאפשר לרמות אותו בכל רגע, $\exists x\ \forall t:\ F(x,t)$. "אי אפשר
          לרמות את כל האנשים כל הזמן": $\neg\,(\forall x\ \forall t:\ F(x,t))$. החלק האמצעי בסעיף (ב).
      - kind: step
        text: >-
          (ב) קריאה אחת: יש רגע שבו אפשר לרמות את כולם, $\exists t\ \forall x:\ F(x,t)$. קריאה שנייה: כל אדם אפשר
          לרמות ברגע כלשהו, אולי רגע אחר לכל אדם, $\forall x\ \exists t:\ F(x,t)$. לפי משפט 0.3.17 הראשונה גוררת
          את השנייה: הרגע האחד מתאים לכל אדם. ההפך לא נכון: אם כל אדם מרומה רק ביום ההולדת שלו, ולא לכולם אותו יום
          הולדת, השנייה נכונה והראשונה לא.
      - kind: step
        text: >-
          (ג) שלילה של "וגם" היא "או" של השלילות (טענה 0.3.13, פעמיים). משלילים כל חלק לפי מסקנה 0.3.12:
          $\neg(\exists x\ \forall t:\ F)$ היא $\forall x\ \exists t:\ \neg F$;
          $\neg(\exists t\ \forall x:\ F)$ היא $\forall t\ \exists x:\ \neg F$;
          $\neg\neg(\forall x\ \forall t:\ F)$ היא $\forall x\ \forall t:\ F$.
      - kind: check
        text: >-
          במילים: או שלכל אדם יש רגע שבו אי אפשר לרמות אותו, או שבכל רגע יש מישהו שאי אפשר לרמות, או שאפשר לרמות את
          כולם תמיד. מספיק שאחד מהמצבים האלה יתקיים כדי שלינקולן יטעה.
      - kind: result
        text: >-
          (ג) $(\forall x\ \exists t:\ \neg F(x,t))\lor(\forall t\ \exists x:\ \neg F(x,t))\lor(\forall x\ \forall t:\
          F(x,t))$.
    source:
      name: 'Book of Proof (Richard Hammack), third edition'
      year: 2018
      problem: 'Chapter 2, Exercise 12 of Section 2.9'
      url: 'https://richardhammack.github.io/BookOfProof/Main.pdf'
      verified: '2026-11-09'
      adapted: true

  - id: W-0.3-c2
    stars: 1
    objectives: [OBJ-0.3-1, OBJ-0.3-2]
    prompt: >-
      תהי $f:\mathbb{R}\to\mathbb{R}$ פונקציה (כלל שמתאים לכל מספר ממשי $x$ מספר ממשי $f(x)$), ו-$b$ מספר ממשי.
      ($\varepsilon$ היא האות היוונית אפסילון, כאן שם של משתנה, ו-$|t|$ הוא הערך המוחלט של $t$, כמו בבית הספר:
      $|t|=t$ כש-$t\ge 0$; בשיעור 0.9 נגדיר אותו במדויק.) נתון המשפט: "לכל מספר חיובי $\varepsilon$ יש מספר חיובי
      $M$ כך ש-$|f(x)-b|<\varepsilon$ בכל פעם ש-$x>M$."

      (א) כתבו את המשפט בכמתים, כולל הכמת הסמוי.

      (ב) שללו אותו בצורה מכנית, ותרגמו את השלילה למילים.

      (ג) הוכיחו שעבור $f(x)=x$ ו-$b=0$ השלילה נכונה.
    answer: >-
      (א) $\forall\varepsilon>0\ \exists M>0\ \forall x\in\mathbb{R}:\ x>M\Rightarrow|f(x)-b|<\varepsilon$.
      (ב) $\exists\varepsilon>0\ \forall M>0\ \exists x\in\mathbb{R}:\ x>M\land|f(x)-b|\ge\varepsilon$.
      (ג) $\varepsilon=1$, ולכל $M$ בוחרים $x=M+1$.
    solution:
      - kind: idea
        text: >-
          "בכל פעם ש-$x>M$" הוא "לכל $x$ שגדול מ-$M$": כמת סמוי, עם גרירה (טענה 0.3.5). רק אחרי שכותבים אותו אפשר
          לשלול נכון.
      - kind: step
        text: >-
          (א) $\forall\varepsilon>0\ \ \exists M>0\ \ \forall x\in\mathbb{R}:\ \ x>M\Rightarrow|f(x)-b|<\varepsilon$.
          ה-$M$ נבחר אחרי $\varepsilon$ ותלוי בו.
      - kind: step
        text: >-
          (ב) לפי מסקנות 0.3.12 ו-0.3.14 שלושת הכמתים מתהפכים והתחומים נשארים, ולפי טענה 0.3.13 שלילת הגרירה היא
          "ההנחה וגם שלילת המסקנה":
          $\exists\varepsilon>0\ \ \forall M>0\ \ \exists x\in\mathbb{R}:\ \ x>M\land|f(x)-b|\ge\varepsilon$.
          במילים: יש מרחק חיובי $\varepsilon$ כך שמעבר לכל סף $M$ יש עוד $x$ שבו $f(x)$ רחוק מ-$b$ לפחות
          $\varepsilon$.
      - kind: step
        text: >-
          (ג) עם $f(x)=x$ ו-$b=0$ התנאי הוא $|x|\ge\varepsilon$. נבחר $\varepsilon=1$. יהי $M>0$, ונבחר $x=M+1$. אז
          $x>M>0$, ולכן $|x|=x=M+1>1$, ובפרט $|x|\ge 1$.
      - kind: check
        text: >-
          עם $M=100$: $x=101$, ו-$|101-0|=101\ge 1$. וכל $M$ שייבחר נכשל, כי ה-$x$ נבחר אחרי $M$ ותלוי בו.
      - kind: result
        text: >-
          השלילה: יש $\varepsilon>0$ כך שלכל $M>0$ יש $x>M$ עם $|f(x)-b|\ge\varepsilon$. עבור $f(x)=x$ ו-$b=0$ היא
          נכונה עם $\varepsilon=1$ ו-$x=M+1$.
