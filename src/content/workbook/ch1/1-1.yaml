# Workbook of lesson 1.1 — the field axioms.
# Objectives (src/course.ts):
#   OBJ-1.1-1  list the field axioms and explain the role of each
#   OBJ-1.1-2  prove from the axioms alone: uniqueness of zero and of the inverse, a·0 = 0
#   OBJ-1.1-3  tell fields from non-fields and name the axiom that fails
# Every table entry, inverse and solution set in ℤ_n below was recomputed with src/math/modular.ts (tests in
# tests/math/modular.test.ts); W-08 was checked numerically on a grid; the four-element field of W-10 and the
# uniqueness claim of c1 are checked exhaustively in tests/math/modular.test.ts.
# Solutions cite the numbered results of the lesson (1.1.1–1.1.18) by number.
lesson: '1.1'
practice:
  - id: W-1.1-01
    level: basic
    qualitative: true
    objectives: [OBJ-1.1-1]
    prompt: >-
      חוק הפילוג (פ) אומר $a(b+c)=ab+ac$: הגורם המשותף משמאל. הנה הוכחה של חוק הפילוג "מימין", לכל $a,b,c$ בשדה
      $F$:

      $$(a+b)c=c(a+b)=ca+cb=ac+bc$$

      כתבו ליד כל אחד משלושת השוויונות את האקסיומה שמצדיקה אותו. למה אי אפשר פשוט לכתוב "לפי (פ)" על כל השרשרת?
    answer: >-
      (כ1); (פ); (כ1) פעמיים. (פ) מרשה לפתוח רק מכפלה שבה הגורם המשותף משמאל, ולכן צריך קודם להעביר אותו שמאלה.
    solution:
      - kind: idea
        text: >-
          כל אקסיומה מרשה שכתוב אחד מסוים. (פ) פותחת סוגריים של $c(\dots)$, לא של $(\dots)c$; חוק החילוף של הכפל
          מעביר את $c$ לצד הנכון.
      - kind: step
        text: >-
          השוויון הראשון, $(a+b)c=c(a+b)$: (כ1), עם $a+b$ ו-$c$ בתפקיד שני הגורמים.
      - kind: step
        text: >-
          השוויון השני, $c(a+b)=ca+cb$: (פ), עם $c$ בתפקיד הגורם המשותף.
      - kind: step
        text: >-
          השוויון השלישי, $ca+cb=ac+bc$: (כ1) פעמיים, $ca=ac$ ו-$cb=bc$.
      - kind: check
        text: >-
          (פ) היא טענה על הצורה $x(y+z)$. לביטוי $(a+b)c$ אין הצורה הזו, ולכן אי אפשר להפעיל עליו את (פ) ישירות. בשדה
          זה רק "פורמליות", אבל במבנה שבו הכפל אינו חילופי, כמו המטריצות של דוגמה 4, הפילוג משמאל אינו נותן את הפילוג
          מימין, ולכן שם מניחים את שניהם.
      - kind: result
        text: '(כ1), (פ), (כ1). חוק הפילוג מימין נובע מ-(פ) ומחוק החילוף של הכפל.'

  - id: W-1.1-02
    level: basic
    objectives: [OBJ-1.1-3]
    prompt: >-
      (א) כתבו את הנגדי ואת ההופכי של כל איבר של $\mathbb Z_5$ (אם קיים).

      (ב) פתרו ב-$\mathbb Z_5$: $2\odot x=3$, ו-$3\oplus x=1$.
    answer: >-
      (א) נגדיים: $-0=0$, $-1=4$, $-2=3$, $-3=2$, $-4=1$. הופכיים: $1^{-1}=1$, $2^{-1}=3$, $3^{-1}=2$, $4^{-1}=4$; ל-0 אין.
      (ב) $x=4$ ו-$x=3$.
    solution:
      - kind: idea
        text: >-
          5 ראשוני, ולכן $\mathbb Z_5$ שדה (משפט 1.1.17), וכל טענה על שדות חלה עליו. הנגדי של $a\ne0$ הוא $5-a$ (משפט
          1.1.16); את ההופכי מוצאים בשורה של $a$ בטבלת הכפל. משוואות פותרים לפי טענה 1.1.10.
      - kind: computation
        text: >-
          (א) נגדיים: $1\oplus4=r_5(5)=0$, $2\oplus3=0$, ו-$0\oplus0=0$. הופכיים: $1\odot1=1$; $2\odot3=r_5(6)=1$;
          $4\odot4=r_5(16)=1$. ל-0 אין הופכי (טענה 1.1.7).
      - kind: computation
        text: >-
          (ב) לפי טענה 1.1.10(ב), הפתרון היחיד של $2\odot x=3$ הוא $x=3\odot2^{-1}=3\odot3=r_5(9)=4$. לפי טענה
          1.1.10(א), הפתרון היחיד של $3\oplus x=1$ הוא $x=1-3=1\oplus2=3$.
      - kind: check
        text: >-
          $2\odot4=r_5(8)=3$ ו-$3\oplus3=r_5(6)=1$. נכון. שימו לב שהנגדי של 2 הוא 3, וגם ההופכי של 2 הוא 3: ב-$\mathbb Z_5$
          זה צירוף מקרים, וב-$\mathbb Z_7$, למשל, הנגדי של 2 הוא 5 וההופכי שלו 4.
      - kind: result
        text: >-
          (א) נגדיים $0,4,3,2,1$ ל-$0,1,2,3,4$; הופכיים $1,3,2,4$ ל-$1,2,3,4$. (ב) $x=4$; $x=3$.

  - id: W-1.1-03
    level: basic
    objectives: [OBJ-1.1-2]
    prompt: >-
      יהי $F$ שדה. הוכיחו מהאקסיומות ומטענות השיעור:

      (א) $1^{-1}=1$.

      (ב) $(-a)^2=a^2$ לכל $a\in F$.

      (ג) $-(a-b)=b-a$ לכל $a,b\in F$.
    answer: '(א) $1\cdot1=1$ ויחידות ההופכי. (ב) טענה 1.1.8(ד). (ג) $(a-b)+(b-a)=0$ ויחידות הנגדי.'
    solution:
      - kind: idea
        text: >-
          בכל סעיף מראים שהאיבר המוצע מקיים את ההגדרה (של הופכי או של נגדי), ואז היחידות אומרת שהוא **ה**הופכי או
          **ה**נגדי.
      - kind: step
        text: >-
          (א) $1\ne0$ לפי (ש), ולכן ל-1 יש הופכי. לפי (כ3) עם $a=1$, $1\cdot1=1$, כלומר 1 הוא הופכי של 1. לפי טענה
          1.1.5(ב), $1^{-1}=1$.
      - kind: step
        text: >-
          (ב) לפי ההגדרה של ריבוע וטענה 1.1.8(ד) עם $b=a$: $(-a)^2=(-a)(-a)=a\cdot a=a^2$.
      - kind: step
        text: >-
          (ג) לפי ההגדרה של ההפרש ולמה 1.1.2א(ב) לחיבור:
          $(a-b)+(b-a)=\big(a+(-b)\big)+\big(b+(-a)\big)=\big(a+(-a)\big)+\big((-b)+b\big)$.

          כל סוגריים שווים ל-0 (הגדרה 1.1.4 ו-(ח1)), ולפי (ח3) $0+0=0$. לכן $b-a$ הוא נגדי של $a-b$, ולפי טענה
          1.1.3(ב), $-(a-b)=b-a$.
      - kind: check
        text: >-
          ב-$\mathbb R$: $-(5-2)=-3=2-5$, ו-$(-3)^2=9=3^2$. ב-$\mathbb Z_7$, עם $a=2$ ו-$b=5$: $a-b=2\oplus2=4$, $b-a=5\oplus5=3$,
          ו-$4\oplus3=0$, כלומר 3 הוא אכן הנגדי של 4.
      - kind: result
        text: '(א) $1^{-1}=1$. (ב) $(-a)^2=a^2$. (ג) $-(a-b)=b-a$.'

  - id: W-1.1-04
    level: mid
    objectives: [OBJ-1.1-2]
    prompt: >-
      יהי $F$ שדה, ויהיו $a,b,c,d\in F$.

      (א) נניח $b,c,d\ne0$. הוכיחו ש-$\frac cd\ne0$, וש-$\dfrac{a/b}{c/d}=\dfrac{ad}{bc}$.

      (ב) נניח $b,d\ne0$. הוכיחו: $\frac ab-\frac cd=\frac{ad-bc}{bd}$.
    answer: '(א) לפי טענה 1.1.11(ד) ו-(ב). (ב) לפי טענה 1.1.11(א) עם $-c$, וכללי הסימן.'
    solution:
      - kind: idea
        text: >-
          חלוקה בשבר היא כפל בהופכי שלו, וההופכי של $\frac cd$ הוא $\frac dc$. הפרש של שברים הוא סכום עם שבר נגדי, ואת
          המינוס "מכניסים" למונה בעזרת טענה 1.1.8(ג).
      - kind: step
        text: >-
          (א) $c\ne0$ ו-$d\ne0$, ולכן לפי טענה 1.1.11(ד), $\frac cd\ne0$ ו-$\left(\frac cd\right)^{-1}=\frac dc$. לפי
          טענה 1.1.9(א), $bc\ne0$, ולכן $\frac{ad}{bc}$ מוגדר.
      - kind: step
        text: >-
          לפי ההגדרה של המנה (הגדרה 1.1.6) וטענה 1.1.11(ב), עם $b$ ו-$c$ כמכנים:
          $\dfrac{a/b}{c/d}=\frac ab\cdot\left(\frac cd\right)^{-1}=\frac ab\cdot\frac dc=\frac{ad}{bc}$.
      - kind: step
        text: >-
          (ב) לפי ההגדרה של ההפרש וטענה 1.1.8(ג): $-\frac cd=-(cd^{-1})=(-c)d^{-1}=\frac{-c}{d}$. לכן, לפי טענה 1.1.11(א)
          עם $-c$ במקום $c$:
          $\frac ab-\frac cd=\frac ab+\frac{-c}{d}=\frac{ad+b(-c)}{bd}$.
      - kind: step
        text: >-
          לפי טענה 1.1.8(ג), $b(-c)=-(bc)$, ולכן המונה הוא $ad+\big(-(bc)\big)=ad-bc$.
      - kind: check
        text: >-
          ב-$\mathbb R$: $\frac{1/2}{3/4}=\frac23$, ו-$\frac{1\cdot4}{2\cdot3}=\frac46=\frac23$. ו-$\frac12-\frac13=\frac16$,
          ו-$\frac{1\cdot3-2\cdot1}{6}=\frac16$. ההנחה $c\ne0$ ב-(א) נחוצה: עם $c=0$, $\frac cd=0$, ולאפס אין הופכי.
      - kind: result
        text: '(א) $\dfrac{a/b}{c/d}=\dfrac{ad}{bc}$. (ב) $\frac ab-\frac cd=\frac{ad-bc}{bd}$.'

  - id: W-1.1-05
    level: mid
    qualitative: true
    objectives: [OBJ-1.1-2, OBJ-1.1-3]
    prompt: >-
      (א) יהי $F$ שדה. הוכיחו: $x^3=x$ אם ורק אם $x\in\{0,1,-1\}$.

      (ב) הפריכו: "בכל מבנה שמקיים את כל אקסיומות השדה חוץ מ-(כ4), ל-$x^3=x$ יש לכל היותר שלושה פתרונות". (רמז:
      $\mathbb Z_8$.)
    answer: >-
      (א) $x^3-x=x(x-1)(x+1)$, ואין מחלקי אפס. (ב) ב-$\mathbb Z_8$ יש חמישה פתרונות: $0,1,3,5,7$.
    solution:
      - kind: idea
        text: >-
          מעבירים לצד אחד ומפרקים לגורמים: $x^3-x=x(x^2-1)=x(x-1)(x+1)$. בשדה מכפלה היא אפס רק אם אחד הגורמים אפס.
          במבנה עם מחלקי אפס זה נשבר.
      - kind: computation
        text: >-
          (א) לפי הגדרה 1.1.12, (כ1), (פ) וטענה 1.1.8(ג): $x(x^2-1)=x\cdot x^2+x\cdot(-1)=x^3-x$. לפי טענה 1.1.13(ב)
          עם $b=1$: $x^2-1=x^2-1^2=(x-1)(x+1)$. לכן $x^3-x=x(x-1)(x+1)$.
      - kind: step
        text: >-
          לפי ההערה אחרי טענה 1.1.10, $x^3=x$ אם ורק אם $x^3-x=0$, כלומר $\big(x(x-1)\big)(x+1)=0$. לפי טענה 1.1.9(א)
          פעמיים: $x=0$, או $x-1=0$, או $x+1=0$; כלומר $x=0$, $x=1$ או $x=-1$ (טענה 1.1.10(א)).
      - kind: step
        text: >-
          ולהפך: $0^3=0$ (טענה 1.1.7), $1^3=1$ ((כ3)), ו-$(-1)^3=(-1)^2\cdot(-1)=1\cdot(-1)=-1$ (טענה 1.1.8(ד)).
      - kind: computation
        text: >-
          (ב) לפי משפט 1.1.16, $\mathbb Z_8$ מקיים את כל האקסיומות חוץ מ-(כ4). נבדוק את שמונת האיברים: $3^3=27=3\cdot8+3$,
          $5^3=125=15\cdot8+5$, $7^3=343=42\cdot8+7$, ו-$0$, $1$ פותרים. לעומת זאת $2^3=8$, $4^3=64$ ו-$6^3=216=27\cdot8$
          נותנים כולם $0$, ששונה מ-2, 4, 6. לכן הפתרונות הם $0,1,3,5,7$: חמישה.
      - kind: check
        text: >-
          איפה נשברת ההוכחה של (א) ב-$\mathbb Z_8$? בטענה 1.1.9: למשל $x=3$ נותן $x(x-1)(x+1)=3\cdot2\cdot4=24$, שהשארית שלו
          0, אף ששלושת הגורמים שונים מאפס. ובשדה $\mathbb Z_2$ יש רק שני פתרונות, 0 ו-1, כי שם $-1=1$: הקבוצה
          $\{0,1,-1\}$ היא $\{0,1\}$.
      - kind: result
        text: '(א) $x^3=x\iff x\in\{0,1,-1\}$. (ב) הטענה שקרית: ב-$\mathbb Z_8$ יש 5 פתרונות.'

  - id: W-1.1-06
    level: mid
    qualitative: true
    objectives: [OBJ-1.1-3]
    prompt: >-
      הוכיחו או הפריכו, ובכל הפרכה הצביעו על אקסיומה שנכשלת ועל איבר שבו היא נכשלת:

      (א) $\{0,1\}\subseteq\mathbb R$, עם החיבור והכפל של $\mathbb R$, היא שדה.

      (ב) קבוצת השלמים הזוגיים, עם החיבור והכפל של $\mathbb R$, היא שדה.

      (ג) $\mathbb Z_{13}$ הוא שדה.
    answer: >-
      (א) לא: החיבור אינו פעולה על הקבוצה, $1+1=2\notin\{0,1\}$. (ב) לא: אין יחידה, (כ3) נכשלת. (ג) כן: 13 ראשוני.
    solution:
      - kind: idea
        text: >-
          לפני כל אקסיומה בודקים שהפעולה בכלל **פעולה** על הקבוצה (סגירות). כדי להפריך מספיק כשל אחד. ל-$\mathbb Z_n$
          יש משפט מוכן.
      - kind: step
        text: >-
          (א) $1+1\ne1$: אחרת $1+1=1+0$, ולפי טענה 1.1.3(א) $1=0$, בסתירה ל-(ש). ו-$1+1\ne0$ ב-$\mathbb R$: לפי עובדה (ב)
          (שתוכח בשיעור 1.2), $0<1$, ולכן $1<1+1$ ובטרנזיטיביות $0<1+1$. לכן $1+1\notin\{0,1\}$, והחיבור של $\mathbb R$
          אינו פעולה $\{0,1\}\times\{0,1\}\to\{0,1\}$: הקבוצה אינה שדה עם הפעולות האלה. (הטבלאות של $\mathbb Z_2$ כן
          הופכות אותה לשדה, אבל אלה פעולות אחרות.)
      - kind: step
        text: >-
          (ב) נניח שיש שלם זוגי $e$ עם $a\cdot e=a$ לכל זוגי $a$. עם $a=2$: $2e=2=2\cdot1$, ולפי טענה 1.1.5(א) ב-$\mathbb R$
          ($2\ne0$), $e=1$. אבל 1 אי-זוגי (למה 0.1.3), סתירה. לכן (כ3) נכשלת. (הסגירות מתקיימת: $2k+2m=2(k+m)$,
          $(2k)(2m)=2(2km)$.)
      - kind: step
        text: >-
          (ג) 13 ראשוני: מחלק טבעי $d$ של 13 מקיים $d\le13$ (טענה 0.1.5(4)), ובדיקה של $d=2,\dots,12$ מראה שאף אחד מהם
          אינו מחלק את 13 (השאריות $1,1,1,3,1,6,5,4,3,2,1$). לפי משפט 1.1.17, $\mathbb Z_{13}$ שדה.
      - kind: check
        text: >-
          באיור עם $n=13$: בכל אחת מ-12 השורות של איבר ששונה מאפס יש 1. למשל $5\odot8=r_{13}(40)=1$ ו-$4\odot10=r_{13}(40)=1$.
      - kind: result
        text: '(א) לא: אין סגירות לחיבור. (ב) לא: (כ3) נכשלת. (ג) כן.'

  - id: W-1.1-07
    level: mid
    qualitative: true
    objectives: [OBJ-1.1-1]
    prompt: >-
      על $\mathbb R$ משאירים את החיבור הרגיל, ומגדירים כפל חדש: $a\ast b:=a$ (תמיד האיבר השמאלי). לכל אחת מהאקסיומות
      (כ1), (כ2), (כ3), (כ4), (פ), הוכיחו שהיא מתקיימת עם $\ast$ או הפריכו אותה בדוגמה נגדית. מה ההבדל בין (כ3) כאן
      לבין טענה 1.1.2?
    answer: >-
      (כ2) ו-(כ3) מתקיימות; (כ1), (כ4) ו-(פ) נכשלות. (כ3) מתקיימת עם **כל** $e$, ולכן היחידה אינה יחידה: טענה 1.1.2
      משתמשת ב-(כ1), שנכשלת כאן.
    solution:
      - kind: idea
        text: >-
          מחשבים כל אגף לפי ההגדרה $a\ast b=a$. אקסיומה "לכל" מופרכת בדוגמה אחת; אקסיומה "יש" מתקיימת אם מצאנו איבר
          אחד שעובד.
      - kind: step
        text: >-
          (כ1) נכשלת: $1\ast2=1$ ו-$2\ast1=2$. (כ2) מתקיימת: $(a\ast b)\ast c=a\ast c=a$, ו-$a\ast(b\ast c)=a$.
      - kind: step
        text: >-
          (כ3) מתקיימת: $a\ast e=a$ לכל $a$, וזה נכון לכל $e\in\mathbb R$; נבחר למשל $e=1$. (כ4), עם $e=1$: צריך לכל
          $a\ne0$ איבר $b$ עם $a\ast b=1$, כלומר $a=1$. עם $a=2$ זה נכשל. (ועם כל בחירה אחרת של $e$: אחד מהמספרים 1,
          2 שונה מ-$e$ ומאפס, ובו (כ4) נכשלת.)
      - kind: step
        text: >-
          (פ) נכשלת: $1\ast(1+1)=1$, ואילו $1\ast1+1\ast1=1+1=2\ne1$.
      - kind: check
        text: >-
          טענה 1.1.2 אומרת שבשדה יש איבר יחידה **אחד**. ההוכחה שלה משווה את $1\cdot e$ ל-$e\cdot1$ בעזרת (כ1). כאן (כ1)
          נכשלת, ובאמת: $1$ ו-$2$ שניהם מקיימים את הדרישה של (כ3), ואין "האיבר 1". זו הסיבה שחוק החילוף מופיע ברשימה
          גם כשנדמה שהוא "לא עושה כלום".
      - kind: result
        text: '(כ2), (כ3) מתקיימות; (כ1), (כ4), (פ) נכשלות; והיחידה אינה יחידה, כי אין חוק חילוף.'

  - id: W-1.1-08
    level: exam
    objectives: [OBJ-1.1-1, OBJ-1.1-3]
    prompt: >-
      על $\mathbb R$ מגדירים שתי פעולות חדשות:
      $$a\oplus b:=a+b-1,\qquad a\odot b:=a+b-ab.$$

      (א) הוכיחו ש-$(\mathbb R,\oplus,\odot)$ הוא שדה. מהו האפס שלו, מהי היחידה, מהו הנגדי של $a$, ומהו ההופכי של איבר
      ששונה מהאפס?

      (ב) לאיזה $a\in\mathbb R$ אין הופכי בשדה הזה? למה זה לא סותר את (כ4)?
    answer: >-
      (א) האפס הוא $1$, היחידה $0$; הנגדי של $a$ הוא $2-a$; ההופכי של $a\ne1$ הוא $\frac{a}{a-1}$. (ב) ל-$a=1$ אין הופכי, וזה
      האפס של השדה.
    solution:
      - kind: idea
        text: >-
          בודקים את עשר האקסיומות עם הפעולות החדשות; כל החישובים עצמם נעשים בשדה $\mathbb R$. את האיברים הניטרליים מוצאים
          מהמשוואה שהם צריכים לקיים, ולא מניחים שהם $0$ ו-$1$.
      - kind: computation
        text: >-
          (ח1), (כ1): $a+b-1$ ו-$a+b-ab$ אינם משתנים כשמחליפים $a$ ו-$b$. (ח2): $(a\oplus b)\oplus c=(a+b-1)+c-1=a+b+c-2$, ו-$a\oplus(b\oplus c)=a+(b+c-1)-1$,
          אותו דבר. (כ2): $(a\odot b)\odot c=(a+b-ab)+c-(a+b-ab)c=a+b+c-ab-ac-bc+abc$, ו-$a\odot(b\odot c)=a+(b+c-bc)-a(b+c-bc)$,
          שגם הוא $a+b+c-ab-ac-bc+abc$.
      - kind: computation
        text: >-
          (ח3): $a\oplus z=a$ לכל $a$ פירושו $a+z-1=a$, כלומר $z=1$; והוא אכן מקיים $a\oplus1=a$. האפס הוא $1$. (ח4): צריך
          $a\oplus b=1$, כלומר $a+b-1=1$, ו-$b=2-a$ מקיים זאת.
      - kind: computation
        text: >-
          (כ3): $a\odot e=a$ לכל $a$ פירושו $e-ae=0$, כלומר $e(1-a)=0$ לכל $a$; עם $a=0$, $e=0$, ו-$e=0$ אכן מקיים
          $a\odot0=a+0-0=a$. היחידה היא $0$. (ש): האפס $1$ שונה מהיחידה $0$.
      - kind: computation
        text: >-
          (כ4): יהי $a$ ששונה **מהאפס של השדה**, כלומר $a\ne1$. צריך $b$ עם $a\odot b=0$ (היחידה), כלומר $a+b-ab=0$, כלומר
          $b(1-a)=-a$. כי $1-a\ne0$, לפי טענה 1.1.10(ב) ב-$\mathbb R$, $b=\frac{-a}{1-a}=\frac{a}{a-1}$.
      - kind: computation
        text: >-
          (פ): $a\odot(b\oplus c)=a+(b+c-1)-a(b+c-1)=2a+b+c-1-ab-ac$. ו-$(a\odot b)\oplus(a\odot c)=(a+b-ab)+(a+c-ac)-1$, אותו
          דבר. כל עשר האקסיומות מתקיימות.
      - kind: step
        text: >-
          (ב) ההופכי מוגדר רק ל-$a\ne1$. ל-$a=1$ אין הופכי: $1\odot b=1+b-b=1\ne0$ לכל $b$. זה בדיוק מה ש-(כ4) מרשה
          וטענה 1.1.7 מחייבת: $1$ הוא האפס של השדה, ולאפס אין הופכי.
      - kind: check
        text: >-
          $a=3$: הנגדי $2-3=-1$, ו-$3\oplus(-1)=3-1-1=1$; ההופכי $\frac32$, ו-$3\odot\frac32=3+\frac32-\frac92=0$. ודרך שנייה
          להבין את הכול: עם $\varphi(x)=1-x$, $\varphi(a\oplus b)=\varphi(a)+\varphi(b)$ ו-$\varphi(a\odot b)=\varphi(a)\varphi(b)$.
          כלומר זה $\mathbb R$ עצמו, "בשמות אחרים": האפס נקרא כאן $1$ והיחידה נקראת $0$.
      - kind: result
        text: >-
          (א) שדה; אפס $1$, יחידה $0$, נגדי $2-a$, הופכי $\frac a{a-1}$ ל-$a\ne1$. (ב) ל-$a=1$, האפס של השדה.

  - id: W-1.1-09
    level: exam
    objectives: [OBJ-1.1-2, OBJ-1.1-3]
    prompt: >-
      תהי $F$ קבוצה **סופית** עם שתי פעולות שמקיימות את כל אקסיומות השדה חוץ, אולי, מ-(כ4), ונניח שב-$F$ אין מחלקי
      אפס: אם $ab=0$ אז $a=0$ או $b=0$.

      (א) הוכיחו ש-$F$ שדה. (רמז: לכל $a\ne0$ הסתכלו על הפונקציה $f(x)=ax$ מ-$F$ אל $F$.)

      (ב) הראו שההנחה "סופית" נחוצה.
    answer: >-
      (א) $f$ חד-חד-ערכית, ולכן לפי משפט 0.8.18 היא "על", ויש $x$ עם $ax=1$. (ב) $\mathbb Z$: אין בו מחלקי אפס, כל
      האקסיומות חוץ מ-(כ4) מתקיימות, והוא אינו שדה.
    solution:
      - kind: idea
        text: >-
          כפל ב-$a\ne0$ אינו "מאחד" שני איברים, כי אין מחלקי אפס. בקבוצה סופית, פונקציה מהקבוצה לעצמה שאינה מאחדת איברים
          מכסה את כל הקבוצה, ובפרט מגיעה ל-1.
      - kind: step
        text: >-
          (א) נשים לב קודם: ההוכחות של טענות 1.1.3, 1.1.7 (בלי הבפרט), 1.1.8 ו-1.1.10(א) לא השתמשו ב-(כ4). לכן הן נכונות
          גם ב-$F$.
      - kind: step
        text: >-
          יהי $a\in F$, $a\ne0$, ותהי $f:F\to F$, $f(x)=ax$ (פונקציה, כי הכפל הוא פעולה על $F$). $f$ חד-חד-ערכית: אם
          $ax=ay$, אז לפי (פ) וטענה 1.1.8(ג), $a(x-y)=ax+a(-y)=ax-ay=0$ (ההערה אחרי טענה 1.1.10). אין מחלקי אפס ו-$a\ne0$,
          ולכן $x-y=0$, כלומר $x=y$.
      - kind: theorem
        text: >-
          ל-$F$ יש $n$ איברים עבור $n\in\mathbb N$ כלשהו (הגדרה 0.8.16), ו-$f$ היא פונקציה מ-$F$ אל $F$. לפי משפט 0.8.18,
          פונקציה חד-חד-ערכית בין שתי קבוצות עם אותו מספר איברים היא "על".
      - kind: step
        text: >-
          לכן $1$, שהוא איבר של $F$, נמצא בתמונה של $f$: יש $x\in F$ עם $ax=1$. זה (כ4) עבור $a$, ו-$a\ne0$ היה כלשהו;
          לכן $F$ שדה.
      - kind: step
        text: >-
          (ב) $\mathbb Z$, עם החיבור והכפל של $\mathbb R$, מקיים את כל האקסיומות חוץ מ-(כ4) (טענה 1.1.18(א) והוכחתה), ואין
          בו מחלקי אפס, כי אין כאלה ב-$\mathbb R$ (טענה 1.1.9(א)). אבל הוא אינו שדה. בהוכחה של (א), הפונקציה $f(x)=2x$
          על $\mathbb Z$ חד-חד-ערכית ואינה "על": 1 אינו בתמונה, כי $2x$ זוגי ו-1 אי-זוגי (למה 0.1.3).
      - kind: check
        text: >-
          (א) נותנת הוכחה שנייה לכיוון "ראשוני ⇒ שדה" של משפט 1.1.17, אם יודעים שב-$\mathbb Z_p$ אין מחלקי אפס, כלומר
          ש-$p\mid ab$ גורר $p\mid a$ או $p\mid b$; ההוכחה שבשיעור עוקפת את זה בעזרת למה 1.1.17א. ב-$\mathbb Z_7$ עם $a=3$
          הפונקציה $f$ שולחת את $0,\dots,6$ ל-$0,3,6,2,5,1,4$: כל האיברים, ו-1 מתקבל ב-$x=5$.
      - kind: result
        text: '(א) $F$ שדה: $x\mapsto ax$ חד-חד-ערכית ולכן "על". (ב) $\mathbb Z$ מראה שבלי סופיות זה נכשל.'

  - id: W-1.1-10
    level: exam
    objectives: [OBJ-1.1-2, OBJ-1.1-3]
    prompt: >-
      יהי $F$ שדה עם **ארבעה** איברים בדיוק: $F=\{0,1,a,b\}$, כולם שונים.

      (א) הוכיחו ש-$1+1=0$ ב-$F$.

      (ב) הסיקו ש-$\mathbb Z_4$ אינו שדה, בלי להשתמש במשפט 1.1.17.
    answer: >-
      (א) אם $1+1\ne0$, אפשר לסמן $1+1=a$; אז $1+a=b$ ו-$1+b=0$, ולכן $a\cdot a=(1+1)(1+1)=0$, סתירה לטענה 1.1.9. (ב) ב-$\mathbb Z_4$,
      $1\oplus1=2\ne0$.
    solution:
      - kind: idea
        text: >-
          נניח $1+1\ne0$ ונעקוב אחרי $1$, $1+1$, $1+1+1$, … בתוך ארבעת האיברים. חוק הצמצום פוסל כמעט כל אפשרות, ומה
          שנשאר נותן $(1+1)(1+1)=0$, כלומר מחלקי אפס.
      - kind: step
        text: >-
          (א) נניח בשלילה $1+1\ne0$. גם $1+1\ne1$: אחרת $1+1=1+0$, ולפי טענה 1.1.3(א) $1=0$, בסתירה ל-(ש). לכן $1+1$ הוא
          $a$ או $b$; השמות $a,b$ סימטריים, ונבחר אותם כך ש-$1+1=a$.
      - kind: step
        text: >-
          נבדוק את $1+a$. $1+a\ne a$ (אחרת $1+a=0+a$ ו-$1=0$), ו-$1+a\ne1$ (אחרת $a=0$). לכן $1+a=0$ או $1+a=b$.
      - kind: step
        text: >-
          המקרה $1+a=0$ בלתי אפשרי. נבדוק את $1+b$: $1+b\ne b$ ו-$1+b\ne1$, כמו קודם. אם $1+b=0=1+a$, אז $b=a$ (טענה
          1.1.3(א)). ואם $1+b=a=1+1$, אז $b=1$. בכל האפשרויות סתירה, ו-$1+b\in F$ חייב להיות אחד מהם.
      - kind: step
        text: >-
          לכן $1+a=b$. נבדוק את $1+b$: $1+b\ne b$, $1+b\ne1$, ואם $1+b=a=1+1$, אז $b=1$. לכן $1+b=0$.
      - kind: computation
        text: >-
          לפי (פ), (כ3) ו-(ח2): $(1+1)(1+1)=(1+1)\cdot1+(1+1)\cdot1=(1+1)+(1+1)=\big((1+1)+1\big)+1=(a+1)+1=b+1=0$ (בשימוש
          ב-(ח1): $a+1=1+a=b$). כלומר $a\cdot a=0$ עם $a\ne0$, בסתירה לטענה 1.1.9(א). לכן $1+1=0$.
      - kind: step
        text: >-
          (ב) ב-$\mathbb Z_4$ יש ארבעה איברים, ו-$1\oplus1=r_4(2)=2\ne0$. לפי (א), $\mathbb Z_4$ אינו שדה.
      - kind: check
        text: >-
          שדה עם ארבעה איברים קיים: הטבלאות $1+1=0$, $a+1=b$, $a+a=0$, $a\cdot a=b$, $a\cdot b=1$, $b\cdot b=a$ (ושאר
          התאים לפי $0$ ו-$1$) מקיימות את כל עשר האקסיומות; בדקנו זאת בכל השלשות. בשדה הזה $a\cdot a=b\ne0$, בניגוד
          ל-$\mathbb Z_4$, שבו $2\odot2=0$.
      - kind: result
        text: '(א) בכל שדה עם 4 איברים $1+1=0$. (ב) ב-$\mathbb Z_4$, $1\oplus1=2\ne0$, ולכן אינו שדה.'

challenge:
  - id: W-1.1-c1
    stars: 1
    objectives: [OBJ-1.1-2, OBJ-1.1-3]
    prompt: >-
      תהי $F=\{0,1,2\}$. הוכיחו שיש **דרך אחת בדיוק** להגדיר על $F$ חיבור וכפל כך ש-$F$ יהיה שדה, שבו $0$ הוא האפס
      (האיבר של (ח3)) ו-$1$ הוא היחידה (האיבר של (כ3)).
    answer: >-
      האקסיומות כופות $1+1=2$, $1+2=0$, $2+2=1$ ו-$2\cdot2=1$ (ושאר התאים נקבעים מ-$0$ ו-$1$); אלה הטבלאות של $\mathbb Z_3$,
      שהוא שדה. לכן יש בדיוק דרך אחת.
    solution:
      - kind: idea
        text: >-
          שני דברים: **יחידות** (האקסיומות וטענות השיעור לא משאירות ברירה באף תא) ו**קיום** (הטבלאות שנכפו אכן נותנות
          שדה). התאים עם $0$ ו-$1$ נקבעים מ-(ח3), (כ3) וטענה 1.1.7; נשארים $1+1$, $1+2$, $2+2$ ו-$2\cdot2$.
      - kind: step
        text: >-
          תאים קבועים: לפי (ח3) ו-(ח1), $0+x=x+0=x$. לפי (כ3) ו-(כ1), $1\cdot x=x\cdot1=x$. לפי טענה 1.1.7, $0\cdot x=x\cdot0=0$.
      - kind: step
        text: >-
          $1+1$: לא $1$ (אחרת $1+1=1+0$ ו-$1=0$, טענה 1.1.3(א)). אם $1+1=0$, אז $1+2$: לא $2$ (אחרת $1=0$), לא $1$ (אחרת
          $2=0$), ולא $0$ (אחרת $1+2=1+1$ ו-$2=1$). אין אפשרות, ולכן $1+1=2$.
      - kind: step
        text: >-
          $1+2$: לא $2$ ולא $1$, כמו קודם; לכן $1+2=0$. ו-$2+2=2+(1+1)=(2+1)+1=0+1=1$, לפי (ח2) ו-(ח1).
      - kind: step
        text: >-
          $2\cdot2$: לא $0$ (טענה 1.1.9(א), כי $2\ne0$), ולא $2$ (אחרת $2\cdot2=2\cdot1$, ולפי טענה 1.1.5(א) $2=1$). לכן
          $2\cdot2=1$.
      - kind: theorem
        text: >-
          קיום: הטבלאות שקיבלנו הן בדיוק $\oplus$ ו-$\odot$ של $\mathbb Z_3$ ($1\oplus1=2$, $1\oplus2=r_3(3)=0$, $2\oplus2=r_3(4)=1$,
          $2\odot2=r_3(4)=1$). 3 ראשוני, ולפי משפט 1.1.17 $\mathbb Z_3$ שדה.
      - kind: check
        text: >-
          בדקנו גם במחשב: מבין כל 729 הזוגות של טבלאות חילופיות על $\{0,1,2\}$ עם $0$ ניטרלי לחיבור ו-$1$ ניטרלי לכפל,
          רק זוג אחד מקיים את עשר האקסיומות, והוא של $\mathbb Z_3$.
      - kind: result
        text: 'יש דרך אחת בלבד: הטבלאות של $\mathbb Z_3$.'
    source:
      name: 'Jiří Lebl, Basic Analysis I: Introduction to Real Analysis, Volume I (version 6.3)'
      year: 2026
      problem: 'Section 1.1, Exercise 1.1.8(a)'
      url: 'https://www.jirka.org/ra/realanal.pdf'
      verified: '2026-11-12'
      adapted: true

  - id: W-1.1-c2
    stars: 2
    objectives: [OBJ-1.1-1, OBJ-1.1-2]
    prompt: >-
      תהי $\ast$ פעולה על קבוצה $S$ שמקיימת חוק חילוף וחוק קיבוץ. נניח שלכל $x,y\in S$ יש $z\in S$ (שיכול להיות תלוי
      ב-$x$ וב-$y$) כך ש-$x\ast z=y$. הוכיחו חוק צמצום: אם $a,b,c\in S$ ו-$a\ast c=b\ast c$, אז $a=b$.
    answer: >-
      בוחרים $e$ עם $c\ast e=c$ ומראים שהוא ניטרלי לכל איבר; אחר כך בוחרים $d$ עם $c\ast d=e$, וכופלים את $a\ast c=b\ast c$
      ב-$d$.
    solution:
      - kind: idea
        text: >-
          בשדה, חוק הצמצום (טענות 1.1.3, 1.1.5) הוכח בעזרת איבר ניטרלי ואיבר נגדי או הופכי. כאן אין אקסיומות כאלה, אבל
          ההנחה "כל משוואה $x\ast z=y$ פתירה" מייצרת את שניהם.
      - kind: step
        text: >-
          לפי ההנחה עם $x=y=c$, יש $e\in S$ עם $c\ast e=c$.
      - kind: step
        text: >-
          $e$ ניטרלי לכל איבר. יהי $x\in S$. לפי ההנחה יש $z$ עם $c\ast z=x$. לפי חוק הקיבוץ וחוק החילוף:
          $x\ast e=(c\ast z)\ast e=c\ast(z\ast e)=c\ast(e\ast z)=(c\ast e)\ast z=c\ast z=x$.
      - kind: step
        text: >-
          לפי ההנחה עם $x=c$ ו-$y=e$, יש $d\in S$ עם $c\ast d=e$.
      - kind: step
        text: >-
          נניח $a\ast c=b\ast c$. לפי חוק הקיבוץ והשלב הקודם:
          $a=a\ast e=a\ast(c\ast d)=(a\ast c)\ast d=(b\ast c)\ast d=b\ast(c\ast d)=b\ast e=b$.
      - kind: check
        text: >-
          החיבור של $\mathbb R$ מקיים את ההנחות (הפתרון של $x+z=y$ הוא $z=y-x$, טענה 1.1.10(א)), וכך מתקבלת הוכחה שנייה
          לטענה 1.1.3(א). הכפל של $\mathbb R$ אינו מקיים אותן: ל-$0\cdot z=1$ אין פתרון; ובאמת $0\cdot1=0\cdot2$ ו-$1\ne2$.
          ההנחה על פתירות נחוצה.
      - kind: result
        text: 'אם $a\ast c=b\ast c$ אז $a=b$.'
    source:
      name: 'The 73rd William Lowell Putnam Mathematical Competition'
      year: 2012
      problem: 'Problem A2'
      url: 'https://kskedlaya.org/putnam-archive/2012.pdf'
      verified: '2026-11-12'
      adapted: true
