# Workbook of lesson 1.2 — the order axioms.
# Objectives (src/course.ts):
#   OBJ-1.2-1  list the order axioms and prove basic properties from them (a nonzero square is positive)
#   OBJ-1.2-2  manipulate inequalities, justifying each step by an axiom or a proved claim
#   OBJ-1.2-3  define the absolute value from the order and prove its properties
# Every number was recomputed (npx tsx): the squares mod 3, 5, 7, 13 (W-06), the harmonic mean (W-04), the bounds of
# W-10, and the IMO 1971 claims of c2 (S_3, S_5 ≥ 0 on 200000 random tuples; S_n = −1 for the counterexamples, n = 4,
# 6, 8 and 7, 9, 11). The algebraic identities are in tests/math/order.test.ts.
# Solutions cite the numbered results of lessons 1.1 and 1.2 by number; (ס1)–(ס4) are the order axioms.
lesson: '1.2'
practice:
  - id: W-1.2-01
    level: basic
    objectives: [OBJ-1.2-1]
    prompt: >-
      יהי $F$ שדה סדור, ויהיו $a,b\in F$. הוכיחו:

      (א) $a^2+b^2\ge 2ab$.

      (ב) $a^2+b^2=0$ אם ורק אם $a=b=0$.
    answer: >-
      (א) $a^2+b^2-2ab=(a-b)^2\ge0$. (ב) אם אחד מהם שונה מאפס, ריבועו חיובי והסכום חיובי.
    solution:
      - kind: idea
        text: >-
          ריבוע אינו שלילי (טענה 1.2.5(ג)). ב-(א) מעבירים הכול לאגף אחד ומזהים ריבוע; ב-(ב) סכום של אי-שלילי
          וחיובי הוא חיובי.
      - kind: computation
        text: >-
          (א) לפי טענה 1.1.13 (עם $-b$ במקום $b$, וכללי הסימן 1.1.8): $(a-b)^2=a^2-2ab+b^2$. לפי טענה 1.2.5(ג),
          $(a-b)^2\ge0$, כלומר $0\le(a^2+b^2)-2ab$, ולפי טענה 1.2.2(א) (עם $\le$: שוויון או אי-שוויון חזק)
          $2ab\le a^2+b^2$. שוויון מתקיים בדיוק כש-$(a-b)^2=0$, כלומר (טענה 1.2.5(ג)) כש-$a-b=0$, כלומר כש-$a=b$.
      - kind: step
        text: >-
          (ב) אם $a=b=0$, אז $a^2+b^2=0+0=0$ (טענה 1.1.7). ולהפך, נניח ש-$a\ne0$. אז $a^2>0$ (טענה 1.2.5(א))
          ו-$b^2\ge0$ (טענה 1.2.5(ג)), ולפי טענה 1.2.3(ב) $a^2+b^2>0+0=0$; בפרט $a^2+b^2\ne0$ (ס1). אם $b\ne0$,
          אותו נימוק עם התפקידים מוחלפים. לכן $a^2+b^2=0$ גורר $a=b=0$.
      - kind: check
        text: >-
          $a=3$, $b=1$: $9+1=10\ge6$. $a=b=2$: $8\ge8$, שוויון, ואכן $a-b=0$. ב-$\mathbb{Z}_5$ דווקא $1^2+2^2=5=0$
          עם $1,2\ne0$: עוד דרך לראות ש-$\mathbb{Z}_5$ אינו סדור.
      - kind: result
        text: >-
          (א) $a^2+b^2\ge2ab$, עם שוויון בדיוק כש-$a=b$. (ב) $a^2+b^2=0$ אם ורק אם $a=b=0$.

  - id: W-1.2-02
    level: basic
    qualitative: true
    objectives: [OBJ-1.2-2]
    prompt: >-
      סטודנטית כתבה: "טענה: אם $x<1$ אז $x^2<1$. הוכחה: כופלים את $x<1$ ב-$x$ ומקבלים $x^2<x$. מכיוון ש-$x<1$,
      בטרנזיטיביות $x^2<1$."

      (א) מצאו את המעבר השגוי, והפריכו את הטענה בדוגמה נגדית.

      (ב) הוסיפו הנחה על $x$ שהופכת את הטענה לנכונה, והוכיחו אותה.
    answer: >-
      (א) הכפל ב-$x$ מותר לפי (ס4) רק כש-$x>0$; $x=-2$ מפריך. (ב) למשל $0\le x<1$.
    solution:
      - kind: idea
        text: >-
          (ס4) מתירה לכפול אי-שוויון רק במספר **חיובי**. לפני כל כפל שואלים: מה הסימן של הכופל?
      - kind: step
        text: >-
          (א) המעבר "כופלים ב-$x$" משתמש ב-(ס4), שדורשת $x>0$; אין הנחה כזו. כש-$x<0$ הכיוון מתהפך (טענה
          1.2.4(א)), וכש-$x=0$ מתקבל שוויון. דוגמה נגדית: $x=-2$. אז $x<1$, אבל $x^2=4>1$.
      - kind: step
        text: >-
          (ב) נניח $0\le x<1$. לפי טענה 1.2.4(ה), כפל של $x<1$ ב-$x\ge0$ נותן $x\cdot x\le1\cdot x$, כלומר
          $x^2\le x$. יחד עם $x<1$, לפי טענה 1.2.3(ד), $x^2<1$.
      - kind: check
        text: >-
          למה $\le$ ולא $<$ בשלב הכפל? כי ב-$x=0$ מתקבל $0\le0$, ולא $0<0$; המסקנה $x^2<1$ נכונה גם שם. עוד הנחה
          שמספיקה: $|x|<1$, כלומר $-1<x<1$. אז לפי טענה 1.2.8(ב), $|x|^2<1$, ו-$|x|^2=x^2$ (טענה 1.2.12(ה)).
      - kind: result
        text: >-
          (א) השגיאה: כפל ב-$x$ בלי לדעת ש-$x>0$; $x=-2$ מפריך. (ב) אם $0\le x<1$ (או $|x|<1$), אז $x^2<1$.

  - id: W-1.2-03
    level: basic
    objectives: [OBJ-1.2-3]
    prompt: >-
      (א) לפי הגדרה 1.2.11 בלבד, חשבו: $|-7|$, $|3-5|$, $\max(-2,-5)$, $\min(-2,-5)$.

      (ב) הוכיחו שלכל $a,b$ בשדה סדור: $\max(a,b)+\min(a,b)=a+b$ ו-$\max(a,b)-\min(a,b)=|a-b|$.
    answer: >-
      (א) $7$, $2$, $-2$, $-5$. (ב) בשני מקרים, $a\ge b$ ו-$a<b$.
    solution:
      - kind: idea
        text: >-
          כל אחד מ-$|\cdot|$, $\max$, $\min$ מוגדר בשני מקרים; מחליטים באיזה מקרה אנחנו לפי הסימן, ומציבים.
      - kind: computation
        text: >-
          (א) $-7<0$, ולכן $|-7|=-(-7)=7$ (טענה 1.1.8). $3-5=-2<0$, ולכן $|3-5|=2$. $-2\ge-5$, ולכן
          $\max(-2,-5)=-2$ ו-$\min(-2,-5)=-5$.
      - kind: step
        text: >-
          (ב) אם $a\ge b$: $\max(a,b)=a$, $\min(a,b)=b$, והסכום $a+b$. גם $a-b\ge0$ (טענה 1.2.2(א), עם $\le$),
          ולכן $|a-b|=a-b=\max(a,b)-\min(a,b)$.
      - kind: step
        text: >-
          אם $a<b$: $\max(a,b)=b$, $\min(a,b)=a$, והסכום $b+a=a+b$ ((ח1)). כאן $a-b<0$, ולכן
          $|a-b|=-(a-b)=b-a=\max(a,b)-\min(a,b)$ (טענה 1.1.8).
      - kind: check
        text: >-
          עם $a=-2$, $b=-5$: $\max+\min=-7=a+b$, ו-$\max-\min=3=|-2-(-5)|$. משתי הנוסחאות יחד, אחרי חיבור וכפל
          ב-$\frac12$: $\max(a,b)=\frac{a+b+|a-b|}2$.
      - kind: result
        text: >-
          (א) $7$, $2$, $-2$, $-5$. (ב) $\max(a,b)+\min(a,b)=a+b$ ו-$\max(a,b)-\min(a,b)=|a-b|$.

  - id: W-1.2-04
    level: mid
    objectives: [OBJ-1.2-2]
    prompt: >-
      יהיו $a,b$ בשדה סדור עם $0<a<b$. הוכיחו ש-$a<\frac{2ab}{a+b}<b$.
    answer: >-
      $\frac{2ab}{a+b}-a=\frac{a(b-a)}{a+b}>0$ ו-$b-\frac{2ab}{a+b}=\frac{b(b-a)}{a+b}>0$.
    solution:
      - kind: idea
        text: >-
          משווים כל צד לפי טענה 1.2.2(א): מחשבים את ההפרש, מביאים למכנה משותף, ובודקים את הסימן של המונה ושל
          המכנה.
      - kind: step
        text: >-
          $a,b>0$, ולכן $a+b>0$ (טענה 1.2.3(א)), ו-$\frac1{a+b}>0$ (טענה 1.2.7(א)). גם $b-a>0$ (טענה 1.2.2(א)).
      - kind: computation
        text: >-
          לפי טענה 1.1.11:

          $$\frac{2ab}{a+b}-a=\frac{2ab-a^2-ab}{a+b}=\frac{a(b-a)}{a+b},\qquad b-\frac{2ab}{a+b}=\frac{ab+b^2-2ab}{a+b}=\frac{b(b-a)}{a+b}.$$
      - kind: theorem
        text: >-
          בכל אחד מהשברים המונה הוא מכפלה של שני חיוביים, ולכן חיובי (טענה 1.2.4(ב)), וכפל ב-$\frac1{a+b}>0$ שומר
          על החיוביות (טענה 1.2.4(ב) שוב). לכן שני ההפרשים חיוביים, ולפי טענה 1.2.2(א)
          $a<\frac{2ab}{a+b}$ ו-$\frac{2ab}{a+b}<b$.
      - kind: check
        text: >-
          $a=1$, $b=3$: $\frac{6}{4}=1.5$, ו-$1<1.5<3$. ההנחה $a>0$ נחוצה: עם $a=-1$, $b=3$ הביטוי הוא
          $\frac{-6}{2}=-3$, שאינו בין $-1$ ל-$3$.
      - kind: result
        text: '$a<\frac{2ab}{a+b}<b$ לכל $0<a<b$.'

  - id: W-1.2-05
    level: mid
    qualitative: true
    objectives: [OBJ-1.2-2, OBJ-1.2-3]
    prompt: >-
      הוכיחו או הפריכו, לכל $a,b,c,d$ בשדה סדור:

      (א) אם $a<b$, אז $a^2+a<b^2+b$.

      (ב) אם $a<b<0$, אז $a^2>b^2$.

      (ג) אם $a<b$ ו-$c<d$, אז $\max(a,c)<\max(b,d)$.
    answer: >-
      (א) לא נכונה: $a=-1$, $b=0$. (ב) נכונה. (ג) נכונה.
    solution:
      - kind: idea
        text: >-
          (א) $x\mapsto x^2+x$ אינה שומרת סדר ליד $-\frac12$: מחפשים שני מספרים עם אותו ערך. (ב) מחזירים לחיוביים
          בעזרת $-a$ ו-$-b$. (ג) $\max(b,d)$ גדול או שווה לכל אחד מ-$b,d$.
      - kind: step
        text: >-
          (א) הפרכה: $a=-1<b=0$, אבל $a^2+a=1-1=0$ ו-$b^2+b=0$, ו-$0<0$ שקר.
      - kind: step
        text: >-
          (ב) מ-$a<b<0$, לפי טענה 1.2.2(ג),(ב): $0<-b<-a$. לפי טענה 1.2.8(ב), עם $-b,-a\ge0$:
          $(-b)^2<(-a)^2$. לפי טענה 1.1.8, $(-b)^2=b^2$ ו-$(-a)^2=a^2$. לכן $b^2<a^2$.
      - kind: step
        text: >-
          (ג) נסמן $M=\max(b,d)$. לפי הגדרה 1.2.11, $M\ge b$ ו-$M\ge d$: אם $b\ge d$ אז $M=b$; אחרת $M=d>b$.
          לכן $a<b\le M$ ו-$c<d\le M$, ולפי טענה 1.2.3(ד) $a<M$ ו-$c<M$. $\max(a,c)$ הוא $a$ או $c$, ולכן
          $\max(a,c)<M$.
      - kind: check
        text: >-
          ב-(א) הטענה נכונה כש-$a,b\ge0$: אז $a^2<b^2$ (טענה 1.2.8(ב)), ומחברים עם $a<b$ (טענה 1.2.3(א)). ב-(ב),
          $a=-3$, $b=-2$: $9>4$. ב-(ג), $a=1<b=2$, $c=5<d=6$: $\max(1,5)=5<6$.
      - kind: result
        text: >-
          (א) לא נכונה ($a=-1$, $b=0$). (ב) נכונה: על השליליים ההעלאה בריבוע הופכת את הסדר. (ג) נכונה.

  - id: W-1.2-06
    level: mid
    qualitative: true
    objectives: [OBJ-1.2-1]
    prompt: >-
      לכל אחד מהשדות $\mathbb{Z}_3$, $\mathbb{Z}_5$, $\mathbb{Z}_7$, $\mathbb{Z}_{13}$ (משפט 1.1.17):

      (א) קבעו אם יש בו איבר $i$ עם $i^2=-1$, ומצאו אותו כשיש.

      (ב) הסבירו איזו תוצאה של שיעור 1.2 מראה שהשדה אינו סדור. האם משפט 1.2.9 מספיק לכל הארבעה?
    answer: >-
      (א) ב-$\mathbb{Z}_5$: $2^2=4=-1$; ב-$\mathbb{Z}_{13}$: $5^2=12=-1$; ב-$\mathbb{Z}_3$ וב-$\mathbb{Z}_7$ אין. (ב) משפט
      1.2.9 מכסה רק את $\mathbb{Z}_5$ ו-$\mathbb{Z}_{13}$; מסקנה 1.2.10 מכסה את כל הארבעה.
    solution:
      - kind: idea
        text: >-
          ב-$\mathbb{Z}_p$, $-1=p-1$ (כי $1\oplus(p-1)=0$). מחשבים את כל הריבועים ובודקים אם $p-1$ ביניהם.
      - kind: computation
        text: >-
          הריבועים $x\odot x$ ל-$x=0,1,\dots,p-1$: ב-$\mathbb{Z}_3$: $0,1,1$; ב-$\mathbb{Z}_5$: $0,1,4,4,1$; ב-$\mathbb{Z}_7$:
          $0,1,4,2,2,4,1$; ב-$\mathbb{Z}_{13}$: $0,1,4,9,3,12,10,10,12,3,9,4,1$. לכן $-1$ הוא ריבוע ב-$\mathbb{Z}_5$
          ($-1=4=2^2=3^2$) וב-$\mathbb{Z}_{13}$ ($-1=12=5^2=8^2$), ואינו ריבוע ב-$\mathbb{Z}_3$ ($-1=2$) וב-$\mathbb{Z}_7$
          ($-1=6$).
      - kind: theorem
        text: >-
          ב-$\mathbb{Z}_5$ וב-$\mathbb{Z}_{13}$ משפט 1.2.9 חל ישירות. ב-$\mathbb{Z}_3$ וב-$\mathbb{Z}_7$ הוא לא חל, כי
          ההנחה שלו אינה מתקיימת; זה **לא** אומר שהם סדורים. מסקנה 1.2.10(ב) חלה על כל $\mathbb{Z}_p$: סכום של $p$
          אחדים הוא $0$, ובשדה סדור סכום כזה חיובי.
      - kind: check
        text: >-
          ב-$\mathbb{Z}_7$: $1\oplus1\oplus1\oplus1\oplus1\oplus1\oplus1=0$. ובדיקה של $5^2$ ב-$\mathbb{Z}_{13}$: $25=13+12$.
          ההנחה של משפט 1.2.9 היא תנאי מספיק לאי-סדירות, לא הכרחי.
      - kind: result
        text: >-
          $i$ קיים רק ב-$\mathbb{Z}_5$ ($i=2$ או $3$) וב-$\mathbb{Z}_{13}$ ($i=5$ או $8$). אף אחד מארבעת השדות אינו סדור,
          לפי מסקנה 1.2.10; משפט 1.2.9 לבדו מספיק רק לשניים מהם.

  - id: W-1.2-07
    level: mid
    objectives: [OBJ-1.2-3]
    prompt: >-
      הוכיחו שלכל $a,b$ בשדה סדור: $|a+b|+|a-b|=2\max(|a|,|b|)$.
    answer: >-
      אם $|a|\ge|b|$, אז $(a+b)(a-b)=a^2-b^2\ge0$, ומקרה השוויון במשפט 1.2.13 נותן $|a+b|+|a-b|=|2a|$. אחרת, אותו
      דבר עם $a+b$ ו-$b-a$.
    solution:
      - kind: idea
        text: >-
          הסכום $|u|+|v|$ שווה ל-$|u+v|$ בדיוק כש-$uv\ge0$ (משפט 1.2.13). בוחרים את $u,v$ מבין $a+b$ ו-$\pm(a-b)$ כך
          שהמכפלה אי-שלילית; הסכום שלהם הוא $2a$ או $2b$.
      - kind: step
        text: >-
          **המקרה $|a|\ge|b|$.** לפי טענה 1.2.8(ג), $|b|^2\le|a|^2$, ולפי טענה 1.2.12(ה) $b^2\le a^2$. לפי טענה
          1.1.13, $(a+b)(a-b)=a^2-b^2\ge0$. לפי מקרה השוויון במשפט 1.2.13, עם $u=a+b$, $v=a-b$:
          $|a+b|+|a-b|=|2a|=2|a|$ (טענה 1.2.12(ו), ו-$|2|=2$ כי $2>0$).
      - kind: step
        text: >-
          **המקרה $|a|<|b|$.** באותה דרך $a^2<b^2$, ו-$(a+b)(b-a)=b^2-a^2>0$. לפי משפט 1.2.13 עם $u=a+b$, $v=b-a$:
          $|a+b|+|b-a|=|2b|=2|b|$, ו-$|b-a|=|a-b|$ (טענה 1.2.12(ג)).
      - kind: theorem
        text: >-
          בשני המקרים התוצאה היא $2$ כפול הגדול מבין $|a|,|b|$, כלומר $2\max(|a|,|b|)$ (הגדרה 1.2.11).
      - kind: check
        text: >-
          $a=3$, $b=-5$: $|-2|+|8|=10=2\cdot5$. $a=b=1$: $2+0=2=2\cdot1$. במשמעות: $|a-b|$ ו-$|a+b|=|a-(-b)|$ הם
          המרחקים של $a$ מ-$b$ ומ-$-b$, וסכומם הוא פעמיים הגדול מבין $|a|$, $|b|$.
      - kind: result
        text: '$|a+b|+|a-b|=2\max(|a|,|b|)$ לכל $a,b$.'

  - id: W-1.2-08
    level: exam
    objectives: [OBJ-1.2-2]
    prompt: >-
      הוכיחו שלכל $a,b,c$ בשדה סדור $a^2+b^2+c^2\ge ab+bc+ca$, ושוויון מתקיים אם ורק אם $a=b=c$.
    answer: >-
      $2\big(a^2+b^2+c^2-ab-bc-ca\big)=(a-b)^2+(b-c)^2+(c-a)^2\ge0$; שוויון רק כששלושת הריבועים אפס.
    solution:
      - kind: idea
        text: >-
          כופלים ב-2 ומזהים שלושה ריבועים של הפרשים. סכום של אי-שליליים הוא אי-שלילי, ושווה לאפס רק כשכל מחובר אפס.
      - kind: computation
        text: >-
          בחוקי השדה (טענה 1.1.13 על כל ריבוע):

          $$(a-b)^2+(b-c)^2+(c-a)^2=2a^2+2b^2+2c^2-2ab-2bc-2ca=2\big(a^2+b^2+c^2-ab-bc-ca\big).$$
      - kind: theorem
        text: >-
          כל ריבוע $\ge0$ (טענה 1.2.5(ג)), ולפי טענה 1.2.3(ג) הסכום $D:=(a-b)^2+(b-c)^2+(c-a)^2\ge0$. לכן
          $2E\ge0$, כאשר $E=a^2+b^2+c^2-ab-bc-ca$. כופלים ב-$\frac12>0$ (מסקנה 1.2.6(א), טענה 1.2.4(ה)): $E\ge0$,
          ולפי טענה 1.2.2(א) $ab+bc+ca\le a^2+b^2+c^2$.
      - kind: step
        text: >-
          **שוויון.** אם $a=b=c$, שני האגפים $3a^2$. ולהפך, אם $E=0$ אז $D=2E=0$. אילו $a\ne b$, אז $(a-b)^2>0$
          (טענה 1.2.5(א)), ושני הריבועים האחרים $\ge0$, ולפי טענה 1.2.3(ב) $D>0$, סתירה. לכן $a=b$, ובאותה דרך
          $b=c$.
      - kind: check
        text: >-
          $a=1$, $b=2$, $c=3$: $14\ge2+6+3=11$. ההוכחה לא השתמשה בשום הנחה על סימנים: הטענה נכונה לכל
          $a,b,c$, גם שליליים ($a=-1$, $b=c=1$: $3\ge-1+1-1=-1$).
      - kind: result
        text: '$a^2+b^2+c^2\ge ab+bc+ca$, ושוויון אם ורק אם $a=b=c$.'

  - id: W-1.2-09
    level: exam
    objectives: [OBJ-1.2-1]
    prompt: >-
      (א) יהי $F$ שדה סדור, ותהי $P=\{x\in F:\ x>0\}$. הוכיחו: (1) אם $x,y\in P$ אז $x+y\in P$ ו-$xy\in P$;
      (2) לכל $x\in F$ מתקיים בדיוק אחד מ: $x\in P$, $x=0$, $-x\in P$.

      (ב) ולהפך: יהי $F$ שדה, ותהי $P\subseteq F$ קבוצה שמקיימת את (1) ואת (2). נגדיר $a<b$ אם $b-a\in P$. הוכיחו
      שהיחס הזה מקיים את (ס1)–(ס4), ושהאיברים החיוביים שלו הם בדיוק האיברים של $P$.
    answer: >-
      (א) טענות 1.2.3(א), 1.2.4(ב) ו-(ס1) עם 1.2.2(ב). (ב) כל אקסיומה מתורגמת לטענה על $b-a$: (ס1) היא (2) על
      $b-a$, (ס2) היא $(c-b)+(b-a)\in P$, (ס3) היא $(b+c)-(a+c)=b-a$, (ס4) היא $(b-a)c\in P$.
    solution:
      - kind: idea
        text: >-
          סדר על שדה נקבע לגמרי על ידי קבוצת החיוביים: $a<b$ אם ורק אם $b-a$ חיובי (טענה 1.2.2(א)). התרגיל מראה
          שאפשר גם להתחיל מקבוצה $P$ ולבנות ממנה סדר.
      - kind: step
        text: >-
          (א)(1) אם $x,y>0$, אז $x+y>0+0=0$ (טענה 1.2.3(א)) ו-$xy>0$ (טענה 1.2.4(ב)). (א)(2) לפי (ס1) על הזוג
          $0,x$ מתקיים בדיוק אחד מ-$0<x$, $x=0$, $x<0$, ולפי טענה 1.2.2(ב) $x<0$ אם ורק אם $-x>0$.
      - kind: step
        text: >-
          (ב), (ס1). יהיו $a,b\in F$. לפי (2) על $x=b-a$ מתקיים בדיוק אחד מ: $b-a\in P$, $b-a=0$, $-(b-a)\in P$. הם
          בדיוק $a<b$, $a=b$ (כי $b-a=0$ אם ורק אם $b=a$, טענה 1.1.10), ו-$b<a$ (כי $-(b-a)=a-b$, טענה 1.1.8).
      - kind: step
        text: >-
          (ס2): אם $b-a\in P$ ו-$c-b\in P$, אז לפי (1) $(c-b)+(b-a)=c-a\in P$, כלומר $a<c$. (ס3): $(b+c)-(a+c)=b-a$,
          ולכן $a<b$ אם ורק אם $a+c<b+c$. (ס4): אם $b-a\in P$ ו-$0<c$, כלומר $c=c-0\in P$, אז לפי (1)
          $(b-a)c=bc-ac\in P$, כלומר $ac<bc$.
      - kind: step
        text: >-
          החיוביים: $0<x$ אם ורק אם $x-0=x\in P$. לכן קבוצת החיוביים של הסדר החדש היא $P$.
      - kind: check
        text: >-
          ב-$\mathbb{R}$ עם $P=(0,\infty)$ מקבלים את הסדר הרגיל. ובקבוצה $P=(-\infty,0)$: התכונה $xy\in P$ נכשלת
          ($(-1)(-1)=1$), ואכן הסדר שהיא נותנת הוא הסדר ההפוך של דוגמה 1 בשיעור, שאינו מקיים את (ס4).
      - kind: result
        text: >-
          (א) $P$ סגורה לחיבור ולכפל, ומקיימת "בדיוק אחד מ-$x\in P$, $x=0$, $-x\in P$". (ב) כל קבוצה כזו קובעת סדר:
          $a<b\iff b-a\in P$ מקיים את (ס1)–(ס4), והחיוביים שלו הם $P$.

  - id: W-1.2-10
    level: exam
    objectives: [OBJ-1.2-3]
    prompt: >-
      (א) הוכיחו: אם $0\le s<t$ בשדה סדור, אז $\frac{s}{1+s}<\frac{t}{1+t}$.

      (ב) הוכיחו שלכל $a,b$ בשדה סדור:

      $$\frac{|a+b|}{1+|a+b|}\le\frac{|a|}{1+|a|}+\frac{|b|}{1+|b|}.$$
    answer: >-
      (א) $\frac t{1+t}-\frac s{1+s}=\frac{t-s}{(1+s)(1+t)}>0$. (ב) אי-שוויון המשולש, (א), ואז הגדלה של מונה
      והקטנה של מכנה בכל מחובר.
    solution:
      - kind: idea
        text: >-
          הפונקציה $t\mapsto\frac t{1+t}$ עולה על $t\ge0$ ((א)), ולכן אפשר להחליף את $|a+b|$ בגדול ממנו, $|a|+|b|$.
          אחר כך מפצלים את השבר לשניים ומקטינים כל מכנה.
      - kind: computation
        text: >-
          (א) $1+s>0$ ו-$1+t>0$ (כי $s,t\ge0$ ו-$1>0$, טענה 1.2.3(ב)). לפי טענה 1.1.11:
          $\frac t{1+t}-\frac s{1+s}=\frac{t(1+s)-s(1+t)}{(1+s)(1+t)}=\frac{t-s}{(1+s)(1+t)}$. המונה חיובי (טענה
          1.2.2(א)), והמכנה חיובי (טענה 1.2.4(ב)), ולכן גם ההופכי שלו (טענה 1.2.7(א)) והשבר (טענה 1.2.4(ב)). לפי טענה
          1.2.2(א), $\frac s{1+s}<\frac t{1+t}$. מכאן גם: אם $0\le s\le t$ אז $\frac s{1+s}\le\frac t{1+t}$.
      - kind: theorem
        text: >-
          (ב) לפי משפט 1.2.13, $0\le|a+b|\le|a|+|b|$, ולפי (א) (בגרסת $\le$):
          $\frac{|a+b|}{1+|a+b|}\le\frac{|a|+|b|}{1+|a|+|b|}=\frac{|a|}{1+|a|+|b|}+\frac{|b|}{1+|a|+|b|}$.
      - kind: step
        text: >-
          $0<1+|a|\le1+|a|+|b|$ (טענה 1.2.3(ג)), ולכן לפי טענה 1.2.7(ה) (או שוויון) $\frac1{1+|a|+|b|}\le\frac1{1+|a|}$.
          כופלים ב-$|a|\ge0$ (טענה 1.2.4(ה)): $\frac{|a|}{1+|a|+|b|}\le\frac{|a|}{1+|a|}$. באותה דרך עם $b$, ומחברים
          (טענה 1.2.3(ג)). יחד עם השלב הקודם וטענה 1.2.3(ד) מתקבל אי-השוויון.
      - kind: check
        text: >-
          $a=b=1$: $\frac23\le\frac12+\frac12=1$. $a=1$, $b=-1$: $0\le1$. $a=3$, $b=-2$: $\frac12\le\frac34+\frac23$. עם
          $a=x-y$ ו-$b=y-z$, אי-השוויון מראה ש-$\frac{|x-y|}{1+|x-y|}$ מקיים את אי-שוויון המשולש, כמו $|x-y|$.
      - kind: result
        text: >-
          (א) $t\mapsto\frac t{1+t}$ עולה ממש על $t\ge0$. (ב)
          $\frac{|a+b|}{1+|a+b|}\le\frac{|a|}{1+|a|}+\frac{|b|}{1+|b|}$.

challenge:
  - id: W-1.2-c1
    stars: 1
    objectives: [OBJ-1.2-1]
    prompt: >-
      תהי $M$ קבוצת הפולינומים עם מקדמים שלמים, $f(x)=a_nx^n+\dots+a_1x+a_0$ עם $a_k\in\mathbb{Z}$. נאמר ש-$0\prec f$
      אם קיים $M_0>0$ כך ש-$f(x)>0$ לכל ממשי $x>M_0$ ("$f$ חיובי מנקודה מסוימת"), ונגדיר $f\prec g$ אם $0\prec g-f$.

      (א) הוכיחו ש-$0\prec f$ אם ורק אם $f$ אינו פולינום האפס והמקדם המוביל שלו חיובי.

      (ב) הוכיחו ש-$\prec$ מקיים את (ס1)–(ס4) (כש-$+$ ו-$\cdot$ הם החיבור והכפל של פולינומים).

      (ג) הוכיחו שהפולינום $x$ גדול, ביחס $\prec$, מכל פולינום קבוע $n\in\mathbb{Z}$.
    answer: >-
      (א) כש-$a_n\ge1$ ו-$A=|a_0|+\dots+|a_{n-1}|$, לכל $x>A+1$: $\big|a_0+\dots+a_{n-1}x^{n-1}\big|\le Ax^{n-1}<x^n\le a_nx^n$.
      (ב) כל אקסיומה עוברת מ-$\mathbb{R}$, נקודה אחרי נקודה, מעבר לנקודה גדולה מספיק. (ג) ל-$x-n$ מקדם מוביל $1>0$.
    solution:
      - kind: idea
        text: >-
          כש-$x$ גדול, האיבר המוביל $a_nx^n$ "מנצח" את כל השאר. לכן הסימן של $f$ מנקודה מסוימת הוא הסימן של המקדם
          המוביל, ו-(ס1) של $\prec$ נובעת מ-(ס1) של $\mathbb{Z}$ על המקדם הזה.
      - kind: step
        text: >-
          (א), כיוון ראשון. נניח $a_n>0$, ולכן $a_n\ge1$ (אין שלם בין $0$ ל-$1$, עובדה מקובלת (ג)). אם $n=0$, $f=a_0>0$ קבוע, וכל $M_0$ מתאים. אחרת
          נסמן $A=|a_0|+\dots+|a_{n-1}|$ ו-$M_0=A+1\ge1$. יהי $x>M_0$. אז $x>1$, ולפי טענה 0.9.19 $x^k\le x^{n-1}$
          לכל $0\le k\le n-1$. לפי טענה 0.9.10 וטענה 1.2.12(ו):
          $\big|a_0+a_1x+\dots+a_{n-1}x^{n-1}\big|\le|a_0|+|a_1|x+\dots+|a_{n-1}|x^{n-1}\le Ax^{n-1}$.
      - kind: step
        text: >-
          $x>A$ ו-$x^{n-1}>0$, ולכן $Ax^{n-1}<x\cdot x^{n-1}=x^n\le a_nx^n$ ((ס4), טענה 1.2.4(ה)). לפי טענה
          1.2.12(ד), $a_0+\dots+a_{n-1}x^{n-1}\ge-Ax^{n-1}>-a_nx^n$, ולכן $f(x)=a_nx^n+\big(a_0+\dots+a_{n-1}x^{n-1}\big)>0$
          (טענה 1.2.2(א)).
      - kind: step
        text: >-
          (א), כיוון שני. אם $f=0$, אז $f(x)=0$ לכל $x$, ובפרט ב-$x=M_0+1$: לא $0\prec f$. אם $f\ne0$ והמקדם המוביל
          שלילי, אז ל-$-f$ מקדם מוביל חיובי, ולפי הכיוון הראשון $-f(x)>0$, כלומר $f(x)<0$, לכל $x>M_1$. אילו גם
          $0\prec f$ עם $M_0$, אז ב-$x=\max(M_0,M_1)+1$ היה $f(x)>0$ וגם $f(x)<0$, בסתירה ל-(ס1).
      - kind: step
        text: >-
          (ב), (ס1). יהיו $f,g$, ו-$h=g-f$. אם $h=0$, אז $f=g$, ולפי (א) לא $f\prec g$ ולא $g\prec f$ (כי $f-g=0$
          גם הוא). אם $h\ne0$, המקדם המוביל שלו $c\ne0$ שלם, ולפי (ס1) ב-$\mathbb{Z}$ בדיוק אחד מ-$c>0$ (אז $f\prec g$)
          ו-$c<0$ (אז ל-$f-g=-h$ מקדם מוביל $-c>0$, ו-$g\prec f$); ו-$f\ne g$. בכל מקרה מתקיים בדיוק אחד מהשלושה.
      - kind: step
        text: >-
          (ס2): אם $g-f$ חיובי מ-$M_1$ ו-$h-g$ חיובי מ-$M_2$, אז לכל $x>\max(M_1,M_2)$:
          $(h-f)(x)=(h-g)(x)+(g-f)(x)>0$ (טענה 1.2.3(א)). (ס3): $(g+h)-(f+h)=g-f$. (ס4): אם $0\prec g-f$ (מ-$M_1$)
          ו-$0\prec h$ (מ-$M_2$), אז לכל $x>\max(M_1,M_2)$: $(gh-fh)(x)=(g-f)(x)\,h(x)>0$ (טענה 1.2.4(ב)).
      - kind: step
        text: >-
          (ג) לכל $n\in\mathbb{Z}$, לפולינום $x-n$ מקדם מוביל $1>0$, ולפי (א) $0\prec x-n$, כלומר $n\prec x$.
      - kind: check
        text: >-
          $f(x)=x^2-5x-3$: $A=8$, $M_0=9$, ו-$f(9)=33>0$; ואכן $f(x)>0$ לכל $x>9$ (נבדק על רשת עד 200). $M$ אינו שדה
          (לפולינום $x$ אין הופכי פולינומי), ולכן זה אינו "שדה סדור"; אבל (ג) מראה סדר שמתאים לפעולות ובו איבר
          גדול מכל השלמים. בשיעור 1.6 נראה מה מבטיח שב-$\mathbb{R}$ אין דבר כזה.
      - kind: result
        text: >-
          (א) $0\prec f$ בדיוק כשהמקדם המוביל חיובי. (ב) $\prec$ מקיים את (ס1)–(ס4). (ג) $n\prec x$ לכל שלם $n$.
    source:
      name: 'MIT OpenCourseWare 18.100B Real Analysis (Spring 2025), Problem Set 1'
      year: 2025
      problem: 'Problems 4 and 5'
      url: 'https://live.ocw.mit.edu/courses/18-100b-real-analysis-spring-2025/mit18_100b_s25_pset01.pdf'
      verified: '2026-11-12'
      adapted: true

  - id: W-1.2-c2
    stars: 2
    objectives: [OBJ-1.2-2]
    prompt: >-
      לכל $n\ge3$ ולמספרים ממשיים $a_1,\dots,a_n$ נסמן

      $$S_n=\sum_{i=1}^n\ \prod_{j\ne i}(a_i-a_j)=(a_1-a_2)(a_1-a_3)\cdots(a_1-a_n)+\dots+(a_n-a_1)\cdots(a_n-a_{n-1}).$$

      הוכיחו ש-$S_n\ge0$ לכל $a_1,\dots,a_n$ כש-$n=3$ וכש-$n=5$, ושלכל $n>2$ אחר יש $a_1,\dots,a_n$ עם $S_n<0$.
    answer: >-
      אחרי מיון $a_1\ge\dots\ge a_n$: ל-$n=3$, $T_1+T_2=(a_1-a_2)^2$ ו-$T_3\ge0$; ל-$n=5$, $T_1+T_2\ge0$, $T_3\ge0$,
      $T_4+T_5\ge0$. ל-$n$ זוגי: $a_1=0$, השאר $1$; ל-$n\ge7$ אי-זוגי: $a_1=0$, שלושה $1$, השאר $-1$.
    solution:
      - kind: idea
        text: >-
          נסמן $T_i=\prod_{j\ne i}(a_i-a_j)$. החלפת השמות של המספרים רק מחליפה את סדר המחוברים, ולכן אפשר להניח
          $a_1\ge a_2\ge\dots\ge a_n$. אז מחברים זוגות שכנים: הסימנים של $T_1$ ו-$T_2$ מנוגדים, אבל $|T_1|\ge|T_2|$.
          לדוגמאות הנגדיות: $T_i=0$ כש-$a_i$ שווה לאחד האחרים, ולכן בונים דוגמה שבה רק $T_1$ שונה מאפס.
      - kind: step
        text: >-
          **מיון.** $T_i$ תלוי רק ב-$a_i$ ובקבוצת המספרים האחרים, ולכן תמורה של $a_1,\dots,a_n$ מתמירה את
          $T_1,\dots,T_n$, והסכום לא משתנה. לפי עובדה מקובלת (ד), בוחרים את הגדול ביותר, ממנו את הגדול מבין הנותרים,
          וכן הלאה; לכן מותר להניח $a_1\ge\dots\ge a_n$. נשתמש בכך שמכפלה של אי-שליליים אי-שלילית, ושאם
          $0\le x\le x'$ ו-$0\le y\le y'$ אז $xy\le x'y'$ (טענה 1.2.4(ה) פעמיים: $xy\le x'y\le x'y'$).
      - kind: computation
        text: >-
          **$n=3$.** $T_1+T_2=(a_1-a_2)(a_1-a_3)+(a_2-a_1)(a_2-a_3)=(a_1-a_2)\big[(a_1-a_3)-(a_2-a_3)\big]=(a_1-a_2)^2\ge0$,
          ו-$T_3=(a_3-a_1)(a_3-a_2)=(a_1-a_3)(a_2-a_3)\ge0$ (טענה 1.1.8; שני הגורמים $\ge0$). לכן $S_3\ge0$.
      - kind: computation
        text: >-
          **$n=5$.** $T_1+T_2=(a_1-a_2)\big[(a_1-a_3)(a_1-a_4)(a_1-a_5)-(a_2-a_3)(a_2-a_4)(a_2-a_5)\big]$, ולכל
          $k=3,4,5$: $a_1-a_k\ge a_2-a_k\ge0$; לכן הסוגריים $\ge0$, ו-$T_1+T_2\ge0$. $T_3=\big[(a_1-a_3)(a_2-a_3)\big]\big[(a_3-a_4)(a_3-a_5)\big]\ge0$.
          ולבסוף $T_4+T_5=(a_4-a_5)\big[(a_1-a_5)(a_2-a_5)(a_3-a_5)-(a_1-a_4)(a_2-a_4)(a_3-a_4)\big]\ge0$, כי
          $a_k-a_5\ge a_k-a_4\ge0$ ל-$k=1,2,3$. (כאן, לפי טענה 1.1.8,
          $(a_4-a_1)(a_4-a_2)(a_4-a_3)=-(a_1-a_4)(a_2-a_4)(a_3-a_4)$, $(a_5-a_1)(a_5-a_2)(a_5-a_3)=-(a_1-a_5)(a_2-a_5)(a_3-a_5)$
          ו-$a_5-a_4=-(a_4-a_5)$.) לכן $S_5\ge0$.
      - kind: step
        text: >-
          **$n$ זוגי, $n\ge4$.** $a_1=0$ ו-$a_2=\dots=a_n=1$. ל-$i\ge2$ יש $j\ge2$, $j\ne i$ (כי $n\ge3$), עם
          $a_i-a_j=0$, ולכן $T_i=0$. ו-$T_1=(0-1)^{n-1}=-1$, כי $n-1$ אי-זוגי. לכן $S_n=-1<0$.
      - kind: step
        text: >-
          **$n$ אי-זוגי, $n\ge7$.** $a_1=0$, $a_2=a_3=a_4=1$, ו-$a_5=\dots=a_n=-1$ ($n-4\ge3$ מספרים). כל $a_i$ עם
          $i\ge2$ שווה לעוד אחד, ולכן $T_i=0$. ו-$T_1=(0-1)^3\cdot(0+1)^{n-4}=-1$. לכן $S_n=-1<0$.
      - kind: check
        text: >-
          חישוב: $S_4(0,1,1,1)=S_6=S_8=-1$, ו-$S_7=S_9=S_{11}=-1$ בדוגמאות שלמעלה; והמינימום של $S_3$ ושל $S_5$ על
          200000 בחירות אקראיות של חצאים בין $-5$ ל-$5$ הוא $0$ (מתקבל, למשל, כששלושה מהמספרים שווים). זו עדות;
          ההוכחה היא החישוב שלמעלה.
      - kind: result
        text: >-
          $S_3\ge0$ ו-$S_5\ge0$ תמיד; לכל $n$ זוגי ולכל $n\ge7$ אי-זוגי יש דוגמה עם $S_n=-1$.
    source:
      name: 'International Mathematical Olympiad (IMO)'
      year: 1971
      problem: 'Problem 1'
      url: 'https://dev.skoljka.org/problems/427/'
      verified: '2026-11-12'
      adapted: false
