# Workbook of lesson 1.5 — the completeness axiom.
# Objectives (src/course.ts):
#   OBJ-1.5-1  state the completeness axiom and explain why the rationals do not satisfy it
#   OBJ-1.5-2  compute sup and inf of sets and prove the answer in both directions
#   OBJ-1.5-3  prove properties of sup: of a sum of sets, of a constant multiple, of a subset
# No Archimedes yet (lesson 1.6): every set is generated by a real parameter or an interval.
# Recomputed with npx tsx (2026-11-12): the rational maps of W-09 and c1 in exact rational arithmetic on all p/q with
# p < 200, q < 60; the witnesses of W-04, W-05 on sample eps; the delta inequalities of c2 on 200000 random triples;
# W-01(ב) on a grid; W-03 and W-08 by direct evaluation. Solutions cite the numbered results 1.5.1-1.5.10.
lesson: '1.5'
practice:
  - id: W-1.5-01
    level: basic
    objectives: [OBJ-1.5-2]
    prompt: >-
      מצאו את הסופרמום, האינפימום, המקסימום והמינימום (אם הם קיימים) של כל קבוצה, ונמקו:

      (א) $\{x\in\mathbb{R}:\ |2x-1|\le3\}$.

      (ב) $\{x\in\mathbb{R}:\ x^2<3x\}$.

      (ג) $[-2,1)\cup(3,5]$.
    answer: >-
      (א) $[-1,2]$: $\sup=\max=2$, $\inf=\min=-1$. (ב) $(0,3)$: $\sup=3$, $\inf=0$, בלי מקסימום ומינימום. (ג)
      $\sup=\max=5$, $\inf=\min=-2$.
    solution:
      - kind: idea
        text: >-
          כותבים כל קבוצה כקטע או כאיחוד של קטעים, ואז טענה 1.5.4 (קטעים) וטענה 1.5.10 (איחוד) נותנות את התשובה.
          מקסימום קיים בדיוק כשהסופרמום שייך לקבוצה (טענה 1.4.7).
      - kind: computation
        text: >-
          (א) לפי טענה 1.2.12: $|2x-1|\le3\iff-3\le2x-1\le3\iff-2\le2x\le4\iff-1\le x\le2$ (מוסיפים 1, וכופלים
          ב-$\frac12>0$). הקבוצה $[-1,2]$, ולפי טענה 1.5.4: $\sup=2$ ו-$\inf=-1$, ושניהם בקבוצה, ולכן הם מקסימום
          ומינימום.
      - kind: computation
        text: >-
          (ב) $x^2<3x\iff x(x-3)<0$. מכפלה שלילית בדיוק כששני הגורמים בסימנים מנוגדים (טענה 1.2.4): $x>0$ ו-$x<3$,
          או $x<0$ ו-$x>3$, והאפשרות השנייה ריקה. הקבוצה $(0,3)$: $\sup=3$, $\inf=0$, ואף אחד מהם אינו בקבוצה.
      - kind: computation
        text: >-
          (ג) לפי טענה 1.5.4: $\sup[-2,1)=1$, $\inf[-2,1)=-2$, $\sup(3,5]=5$, $\inf(3,5]=3$. לפי טענה 1.5.10:
          $\sup=\max(1,5)=5$ ו-$\inf=\min(-2,3)=-2$. שניהם בקבוצה ($5\in(3,5]$, $-2\in[-2,1)$).
      - kind: check
        text: >-
          ב-(ב), נקודות: $x=1$ נותן $1<3$ (בקבוצה); $x=3$ נותן $9<9$, שקר; $x=-1$ נותן $1<-3$, שקר. ב-(ג), החור
          $[1,3]$ באמצע אינו משנה דבר: הסופרמום נקבע בחלק הימני, והאינפימום בשמאלי.
      - kind: result
        text: >-
          (א) $\sup=\max=2$, $\inf=\min=-1$. (ב) $\sup=3$, $\inf=0$, לא מתקבלים. (ג) $\sup=\max=5$, $\inf=\min=-2$.

  - id: W-1.5-02
    level: basic
    qualitative: true
    objectives: [OBJ-1.5-1]
    prompt: >-
      הוכיחו או הפריכו כל טענה.

      (א) לכל קבוצה לא ריקה וחסומה $A\subseteq\mathbb{R}$ יש גם סופרמום וגם אינפימום.

      (ב) לכל קבוצה לא ריקה $A\subseteq\mathbb{Q}$ שחסומה מלעיל יש סופרמום ב-$\mathbb{R}$.

      (ג) לכל קבוצה לא ריקה $A\subseteq\mathbb{R}$ שחסומה מלעיל יש מקסימום.

      (ד) אם לקבוצה $A\subseteq\mathbb{R}$ אין סופרמום, אז $A=\varnothing$.
    answer: '(א) נכונה. (ב) נכונה. (ג) לא נכונה: $(0,1)$. (ד) לא נכונה: $[0,\infty)$.'
    solution:
      - kind: idea
        text: >-
          אקסיומת השלמות מבטיחה סופרמום, לא מקסימום, ורק כששני התנאים מתקיימים: הקבוצה לא ריקה **וגם** חסומה
          מלעיל. כל טענה נבדקת מול התנאים האלה.
      - kind: theorem
        text: >-
          (א) נכונה. $A$ לא ריקה וחסומה מלעיל, ולכן לפי (של) יש לה סופרמום; היא לא ריקה וחסומה מלרע, ולכן לפי משפט
          1.5.2 יש לה אינפימום.
      - kind: theorem
        text: >-
          (ב) נכונה. $A\subseteq\mathbb{Q}\subseteq\mathbb{R}$ היא קבוצה לא ריקה וחסומה מלעיל של ממשיים, ולכן לפי
          (של) יש לה סופרמום ב-$\mathbb{R}$. (הוא לא חייב להיות רציונלי: מסקנה 1.5.3א.)
      - kind: step
        text: >-
          (ג) לא נכונה. $(0,1)$ לא ריקה וחסומה מלעיל ב-1, ולפי טענה 1.5.4(ב) אין לה מקסימום, כי $1\notin(0,1)$.
      - kind: step
        text: >-
          (ד) לא נכונה. לפי טענה 1.5.4(ג), $[0,\infty)$ אינה חסומה מלעיל, ולכן אין לה סופרמום (סופרמום הוא בפרט חסם
          מלעיל), והיא אינה ריקה. מה שכן נכון: אם ל-$A$ אין סופרמום, אז $A$ ריקה **או** אינה חסומה מלעיל; זו
          השלילה של (של), לפי כללי דה-מורגן.
      - kind: result
        text: '(א) נכונה. (ב) נכונה. (ג) לא נכונה: $(0,1)$. (ד) לא נכונה: $[0,\infty)$.'

  - id: W-1.5-03
    level: basic
    objectives: [OBJ-1.5-3]
    prompt: >-
      $A,B\subseteq\mathbb{R}$ לא ריקות וחסומות, $\sup A=2$, $\inf A=-3$, $\sup B=1$, $\inf B=0$. חשבו, ונמקו כל
      מעבר בטענה מהשיעור:

      (א) $\sup(A+B)$ ו-$\inf(A+B)$.

      (ב) $\sup(-A)$ ו-$\sup(A-B)$.

      (ג) $\inf(2A-B)$, כאשר $2A-B=\{2a-b:\ a\in A,\ b\in B\}$.

      (ד) $\sup\big(A\cup(B+5)\big)$, כאשר $B+5=\{b+5:\ b\in B\}$.
    answer: '(א) $3$ ו-$-3$. (ב) $3$ ו-$2$. (ג) $-7$. (ד) $6$.'
    solution:
      - kind: idea
        text: >-
          כל קבוצה נבנית מ-$A$ ומ-$B$ בפעולות שיש להן משפט: סכום (1.5.7), כפל בקבוע (1.5.8), הפרש (1.5.9), איחוד
          (1.5.10). קבוצה כמו $2A-B$ מפרקים: $2A-B=(2A)+(-B)$.
      - kind: computation
        text: >-
          (א) לפי משפט 1.5.7: $\sup(A+B)=2+1=3$, $\inf(A+B)=-3+0=-3$.
      - kind: computation
        text: >-
          (ב) לפי משפט 1.5.2(ב): $\sup(-A)=-\inf A=3$. לפי מסקנה 1.5.9(א): $\sup(A-B)=\sup A-\inf B=2-0=2$.
      - kind: computation
        text: >-
          (ג) $2a-b=2a+(-b)$, ולכן $2A-B=(2A)+(-B)$. לפי משפט 1.5.8(א), $\inf(2A)=2\inf A=-6$; לפי טענה 1.4.10,
          $\inf(-B)=-\sup B=-1$. לפי משפט 1.5.7(ב): $\inf(2A-B)=-6+(-1)=-7$.
      - kind: computation
        text: >-
          (ד) $B+5=B+\{5\}$, ולפי משפט 1.5.7 $\sup(B+5)=1+5=6$. לפי טענה 1.5.10:
          $\sup\big(A\cup(B+5)\big)=\max(2,6)=6$.
      - kind: check
        text: >-
          דוגמה שמקיימת את הנתונים: $A=[-3,2]$, $B=[0,1]$. אז $2A-B=[-6,4]+[-1,0]=[-7,4]$, והאינפימום $-7$: מתקבל
          מ-$a=-3$ (הקטן ביותר) ומ-$b=1$ (הגדול ביותר). הטעות הנפוצה ב-(ג) היא $2\cdot(-3)-0=-6$: מחסרים את $b$,
          ולכן הקטן ביותר בא מ-$b$ **גדול**.
      - kind: result
        text: '(א) $3$ ו-$-3$. (ב) $3$ ו-$2$. (ג) $-7$. (ד) $6$.'

  - id: W-1.5-04
    level: mid
    objectives: [OBJ-1.5-2]
    prompt: >-
      תהי $A=\left\{\frac{2x+3}{x+1}:\ x>0\right\}$. הוכיחו ש-$A=(2,3)$, והסיקו את $\sup A$ ואת $\inf A$. האם יש ל-$A$
      מקסימום או מינימום?
    answer: '$A=(2,3)$; $\sup A=3$, $\inf A=2$, ואין מקסימום ואין מינימום.'
    solution:
      - kind: idea
        text: >-
          כותבים $\frac{2x+3}{x+1}=2+\frac{1}{x+1}$, ומראים שתי הכלות: כל איבר ב-$(2,3)$, וכל מספר ב-$(2,3)$ הוא
          איבר, עם פרמטר מפורש. אחר כך טענה 1.5.4 עושה את השאר.
      - kind: computation
        text: >-
          לכל $x>0$: $x+1>0$, ולפי חשבון שברים (טענה 1.1.11) $\frac{2x+3}{x+1}=\frac{2(x+1)+1}{x+1}=2+\frac1{x+1}$.
      - kind: step
        text: >-
          $A\subseteq(2,3)$: יהי $x>0$. אז $0<1<x+1$, ולפי טענה 1.2.7, $0<\frac1{x+1}<\frac11=1$. מוסיפים 2: האיבר
          בין 2 ל-3, ממש.
      - kind: step
        text: >-
          $(2,3)\subseteq A$: יהי $y\in(2,3)$, ו-$t=y-2\in(0,1)$. נבחר $x=\frac1t-1$. לפי טענה 1.2.7, $\frac1t>\frac11=1$,
          ולכן $x>0$. ו-$\frac1{x+1}=\frac1{1/t}=t$, ולכן האיבר של $x$ הוא $2+t=y$. כלומר $y\in A$.
      - kind: theorem
        text: >-
          לכן $A=(2,3)$, ולפי טענה 1.5.4: $\sup A=3$, $\inf A=2$, ושניהם אינם בקבוצה, ולכן אין מקסימום ואין
          מינימום.
      - kind: check
        text: >-
          $x=0.001$ נותן $\approx2.999$, $x=1000$ נותן $\approx2.001$: האיברים מתקרבים ל-3 כש-$x$ קטן ול-2 כש-$x$
          גדל, ולא להפך. $x=0$ היה נותן בדיוק 3, אבל הוא אסור.
      - kind: result
        text: '$A=(2,3)$, $\sup A=3$, $\inf A=2$, בלי מקסימום ובלי מינימום.'

  - id: W-1.5-05
    level: mid
    objectives: [OBJ-1.5-2]
    prompt: >-
      תהי $A=\left\{1-\frac1x:\ x\ge1\right\}$. הוכיחו ישירות, בעזרת אפיון האפסילון (משפט 1.4.8) ובלי לזהות את $A$
      כקטע, ש-$\min A=0$, ש-$\sup A=1$, ושאין ל-$A$ מקסימום.
    answer: '$\min A=0$ (מ-$x=1$); $\sup A=1$ עם האיבר של $x=1+\frac1\varepsilon$; $1\notin A$.'
    solution:
      - kind: idea
        text: >-
          לפרמטר $x\ge1$ מתאים האיבר $1-\frac1x$, שקרוב ל-1 כש-$\frac1x$ קטן. צריך $\frac1x<\varepsilon$ **וגם**
          $x\ge1$. הבחירה $x=\frac1\varepsilon$ לא מספיקה: היא נותנת $\frac1x=\varepsilon$ בדיוק, ואם $\varepsilon>1$ היא
          אפילו לא מותרת. הבחירה $x=1+\frac1\varepsilon$ עונה על שתי הדרישות.
      - kind: step
        text: >-
          יהי $x\ge1$. אז $0<1\le x$, ולפי טענה 1.2.7, $0<\frac1x\le1$. לכן $0\le1-\frac1x<1$. כלומר $0$ חסם מלרע
          ו-$1$ חסם מלעיל, ו-$1\notin A$.
      - kind: step
        text: >-
          $x=1$ נותן את האיבר $1-1=0$. איבר שהוא חסם מלרע הוא מינימום (הגדרה 1.4.2), ולכן $\min A=0$.
      - kind: step
        text: >-
          יהי $\varepsilon>0$, ו-$x=1+\frac1\varepsilon$. אז $x>1$, ו-$\frac1x=\frac{\varepsilon}{\varepsilon+1}<\varepsilon$
          (כי $\varepsilon<\varepsilon(\varepsilon+1)=\varepsilon+\varepsilon^2$). לכן האיבר $1-\frac1x>1-\varepsilon$.
      - kind: theorem
        text: >-
          לפי משפט 1.4.8, $\sup A=1$. ו-$1\notin A$, ולכן לפי טענה 1.4.7 אין מקסימום.
      - kind: check
        text: >-
          $\varepsilon=0.1$: $x=11$, האיבר $\frac{10}{11}\approx0.909>0.9$. $\varepsilon=2$: $x=1.5$, האיבר
          $\frac13>-1$. בבחירה $x=\frac1\varepsilon$ עם $\varepsilon=0.1$ האיבר הוא $0.9$ בדיוק, ולא גדול מ-$0.9$.
      - kind: result
        text: '$\min A=\inf A=0$, $\sup A=1$, ואין מקסימום.'

  - id: W-1.5-06
    level: mid
    qualitative: true
    objectives: [OBJ-1.5-3]
    prompt: >-
      יהיו $A,B\subseteq\mathbb{R}$ לא ריקות וחסומות. הוכיחו או הפריכו:

      (א) אם $\sup A<\inf B$, אז יש $c\in\mathbb{R}$ עם $a<c<b$ לכל $a\in A$ ולכל $b\in B$.

      (ב) אם $\sup A\le\sup B$, אז לכל $a\in A$ יש $b\in B$ עם $a\le b$.

      (ג) $A+A=2A$.

      (ד) $\sup(A+A)=\sup(2A)$.
    answer: '(א) נכונה. (ב) לא נכונה: $A=\{1\}$, $B=[0,1)$. (ג) לא נכונה: $A=\{0,1\}$. (ד) נכונה.'
    solution:
      - kind: idea
        text: >-
          (א) בין שני מספרים יש אמצע (מסקנה 1.2.6). (ב) נופלת כשהסופרמום של $B$ אינו מתקבל. (ג)–(ד): קבוצות שונות
          יכולות להיות עם אותו סופרמום, וכאן משפטים 1.5.7 ו-1.5.8 נותנים את שני הסופרמומים.
      - kind: step
        text: >-
          (א) נכונה. $c=\frac{\sup A+\inf B}{2}$ מקיים $\sup A<c<\inf B$ (מסקנה 1.2.6). לכל $a\in A$, $b\in B$:
          $a\le\sup A<c<\inf B\le b$.
      - kind: step
        text: >-
          (ב) לא נכונה. $A=\{1\}$, $B=[0,1)$: $\sup A=1$ ו-$\sup B=1$ (טענה 1.5.4), ולכן $\sup A\le\sup B$. אבל לאיבר
          $a=1$ אין $b\in B$ עם $1\le b$, כי כל $b<1$.
      - kind: step
        text: >-
          (ג) לא נכונה. $A=\{0,1\}$: $A+A=\{0,1,2\}$, ואילו $2A=\{0,2\}$; $1\in A+A$ ו-$1\notin2A$.
      - kind: theorem
        text: >-
          (ד) נכונה. לפי משפט 1.5.7, $\sup(A+A)=\sup A+\sup A=2\sup A$; לפי משפט 1.5.8(א) עם $c=2$,
          $\sup(2A)=2\sup A$.
      - kind: check
        text: >-
          תמיד $2A\subseteq A+A$ ($2a=a+a$), ולכן לפי טענה 1.5.5 $\sup(2A)\le\sup(A+A)$; (ד) אומרת שכאן יש שוויון
          אף שההכלה יכולה להיות ממש, כמו ב-(ג). ב-(א) ההנחה $\sup A<\inf B$ חיונית: עם $A=[0,1)$, $B=[1,2]$
          ($\sup A=\inf B$) אין $c$ כזה, כי $c<1$ אינו גדול מכל $a$ ו-$c\ge1$ אינו קטן מ-$b=1$.
      - kind: result
        text: '(א) נכונה. (ב) לא נכונה. (ג) לא נכונה. (ד) נכונה.'

  - id: W-1.5-07
    level: mid
    objectives: [OBJ-1.5-3]
    prompt: >-
      יהיו $A,B\subseteq\mathbb{R}$ לא ריקות, כך ש-$a\le b$ לכל $a\in A$ ולכל $b\in B$. הוכיחו ש-$\sup A=\inf B$
      אם ורק אם לכל $\varepsilon>0$ יש $a\in A$ ו-$b\in B$ עם $b-a<\varepsilon$.
    answer: 'שני הכיוונים נובעים מטענה 1.5.6 ומאפיון האפסילון, עם $\frac\varepsilon2$ לכל קבוצה.'
    solution:
      - kind: given
        text: '$A,B$ לא ריקות ו-$a\le b$ לכל $a,b$. לפי טענה 1.5.6, $\sup A$ ו-$\inf B$ קיימים ו-$\sup A\le\inf B$.'
      - kind: idea
        text: >-
          המרחק בין $a$ ל-$b$ הוא לפחות $\inf B-\sup A$. אם המרחק הזה אפס, בוחרים $a$ קרוב ל-$\sup A$ ו-$b$ קרוב
          ל-$\inf B$; אם הוא חיובי, הוא עצמו $\varepsilon$ שאין לו זוג.
      - kind: step
        text: >-
          ($\Rightarrow$) נניח $\sup A=\inf B=s$, ויהי $\varepsilon>0$. לפי משפט 1.4.8 עם $\frac\varepsilon2$: יש $a\in A$
          עם $a>s-\frac\varepsilon2$, ויש $b\in B$ עם $b<s+\frac\varepsilon2$. אז
          $b-a<\left(s+\frac\varepsilon2\right)-\left(s-\frac\varepsilon2\right)=\varepsilon$ (טענה 1.2.3).
      - kind: step
        text: >-
          ($\Leftarrow$) נניח את תנאי האפסילון, ונניח בשלילה ש-$\sup A\ne\inf B$. לפי טענה 1.5.6, $\sup A<\inf B$,
          ולכן $\varepsilon_0=\inf B-\sup A>0$. לכל $a\in A$ ו-$b\in B$: $a\le\sup A$ ו-$b\ge\inf B$, ולכן
          $b-a\ge\inf B-\sup A=\varepsilon_0$. זה סותר את התנאי עם $\varepsilon=\varepsilon_0$.
      - kind: check
        text: >-
          $A=[0,1)$, $B=[1,2]$: עם $a=1-\frac\varepsilon2$ (כש-$\varepsilon\le2$) ו-$b=1$, $b-a=\frac\varepsilon2<\varepsilon$,
          ואכן $\sup A=\inf B=1$. $A=[0,1]$, $B=[2,3]$: תמיד $b-a\ge1$, ו-$\sup A=1<2=\inf B$.
      - kind: result
        text: '$\sup A=\inf B$ אם ורק אם לכל $\varepsilon>0$ יש $a\in A$, $b\in B$ עם $b-a<\varepsilon$.'

  - id: W-1.5-08
    level: exam
    qualitative: true
    objectives: [OBJ-1.5-3]
    prompt: >-
      יהיו $A,B\subseteq\mathbb{R}$ לא ריקות וחסומות מלעיל, ונגדיר $M=\{\max(a,b):\ a\in A,\ b\in B\}$ ו-$m=\{\min(a,b):\ a\in A,\ b\in B\}$.

      (א) הוכיחו ש-$\sup M=\max(\sup A,\sup B)$.

      (ב) הוכיחו או הפריכו: $\sup m=\min(\sup A,\sup B)$.

      (ג) לעומת זאת, $\sup(A\cap B)$ יכול להיות קטן מ-$\min(\sup A,\sup B)$ (מסקנה 1.5.5א). הסבירו את ההבדל בין $m$
      ל-$A\cap B$ על הדוגמה $A=\{0,2\}$, $B=\{0,3\}$.
    answer: >-
      (א) הוכחה עם אפסילון. (ב) נכונה. (ג) $m=\{0,2\}$ ו-$\sup m=2$, ואילו $A\cap B=\{0\}$: ב-$m$ משתתף $\min(2,3)=2$,
      שאינו איבר משותף.
    solution:
      - kind: idea
        text: >-
          $\max(a,b)$ ו-$\min(a,b)$ הם תמיד אחד משני המספרים $a$, $b$. לחסם משווים כל אחד מהם לסופרמום שלו. לכיוון
          השני בוחרים $a$ קרוב ל-$\sup A$ **וגם** $b$ קרוב ל-$\sup B$, באותו $\varepsilon$, ואז גם המקסימום וגם המינימום
          שלהם קרובים למקסימום ולמינימום של הסופרמומים.
      - kind: step
        text: >-
          נסמן $\alpha=\sup A$, $\beta=\sup B$ (קיימים לפי (של)), $\mu=\max(\alpha,\beta)$, $\nu=\min(\alpha,\beta)$.
          לכל $a\in A$, $b\in B$: $a\le\alpha\le\mu$ ו-$b\le\beta\le\mu$, ו-$\max(a,b)$ הוא $a$ או $b$, ולכן
          $\max(a,b)\le\mu$. כמו כן $\min(a,b)\le a\le\alpha$ ו-$\min(a,b)\le b\le\beta$, ולכן $\min(a,b)\le\nu$
          ($\nu$ הוא $\alpha$ או $\beta$).
      - kind: step
        text: >-
          יהי $\varepsilon>0$. לפי משפט 1.4.8 יש $a\in A$ עם $a>\alpha-\varepsilon$ ו-$b\in B$ עם $b>\beta-\varepsilon$.
      - kind: step
        text: >-
          (א) $\max(a,b)\ge a>\alpha-\varepsilon$ ו-$\max(a,b)\ge b>\beta-\varepsilon$. המספר $\mu-\varepsilon$ הוא
          $\alpha-\varepsilon$ או $\beta-\varepsilon$, ולכן $\max(a,b)>\mu-\varepsilon$. לפי משפט 1.4.8, $\sup M=\mu$.
      - kind: step
        text: >-
          (ב) נכונה. $\min(a,b)$ הוא $a$ או $b$. אם הוא $a$: $a>\alpha-\varepsilon\ge\nu-\varepsilon$. אם הוא $b$:
          $b>\beta-\varepsilon\ge\nu-\varepsilon$. בשני המקרים $\min(a,b)>\nu-\varepsilon$, ולפי משפט 1.4.8
          $\sup m=\nu$.
      - kind: computation
        text: >-
          (ג) עבור $A=\{0,2\}$, $B=\{0,3\}$: $\min(0,0)=\min(0,3)=\min(2,0)=0$ ו-$\min(2,3)=2$, ולכן $m=\{0,2\}$
          ו-$\sup m=2=\min(2,3)$. אבל $A\cap B=\{0\}$. ב-$m$ מותר לקחת את $a$ ואת $b$ **שונים**: $\min(2,3)$ משתמש
          ב-2 מ-$A$ וב-3 מ-$B$. בחיתוך צריך מספר אחד ששייך לשתי הקבוצות.
      - kind: check
        text: >-
          (א) ב-(ג) נותן $M=\{0,3,2,3\}=\{0,2,3\}$ ו-$\sup M=3=\max(2,3)$. ותמיד $A\cap B\subseteq m$ (עבור $x$
          משותף, $x=\min(x,x)$), ולכן לפי טענה 1.5.5 $\sup(A\cap B)\le\sup m$: זה עוד דרך לראות את מסקנה 1.5.5א.
      - kind: result
        text: >-
          (א) $\sup M=\max(\sup A,\sup B)$. (ב) נכונה: $\sup m=\min(\sup A,\sup B)$. (ג) $m$ בונה מינימום מזוג
          איברים שונים, החיתוך רק מאיבר משותף.

  - id: W-1.5-09
    level: exam
    objectives: [OBJ-1.5-1]
    prompt: >-
      תהי $B=\{x\in\mathbb{Q}:\ x>0,\ x^2<3\}$. הוכיחו ש-$B$ לא ריקה וחסומה מלעיל ב-$\mathbb{Q}$, ושאין לה סופרמום
      ב-$\mathbb{Q}$. היעזרו במספרים $\frac{3r+3}{r+3}$ ו-$\frac{r^2+3}{2r}$.
    answer: >-
      $1\in B$ ו-$2$ חוסם. אם $r$ רציונלי חיובי עם $r^2<3$, אז $\frac{3r+3}{r+3}\in B$ וגדול מ-$r$; אם $r^2>3$, אז
      $\frac{r^2+3}{2r}$ חסם רציונלי קטן מ-$r$; ו-$r^2=3$ בלתי אפשרי (מסקנה 1.3.17).
    solution:
      - kind: idea
        text: >-
          כמו במשפט 1.5.3: סופרמום רציונלי $r$ היה מקיים $r^2<3$, $r^2=3$ או $r^2>3$, וכל מקרה נסגר. המספרים הנתונים
          מתקבלים מ-$r$ בפעולות חשבון, ולכן רציונליים.
      - kind: step
        text: >-
          $1\in B$: $1>0$ ו-$1<3$. חסם: אם $x\in B$ ו-$x>2$, אז לפי טענה 1.2.8 $x^2>4>3$, סתירה; לכן $x\le2$.
      - kind: computation
        text: >-
          יהי $r\in\mathbb{Q}$, $r>0$, $r^2<3$, ו-$r''=\frac{3r+3}{r+3}$ (רציונלי וחיובי, טענות 1.3.14, 1.2.4, 1.2.7).
          לפי טענה 1.1.11:

          $$r''-r=\frac{3-r^2}{r+3}>0,\qquad r''^2-3=\frac{(3r+3)^2-3(r+3)^2}{(r+3)^2}=\frac{6(r^2-3)}{(r+3)^2}<0.$$

          לכן $r''\in B$ ו-$r''>r$.
      - kind: computation
        text: >-
          יהי $r\in\mathbb{Q}$, $r>0$, $r^2>3$, ו-$r'=\frac{r^2+3}{2r}$ (רציונלי וחיובי). אז
          $r-r'=\frac{r^2-3}{2r}>0$, ו-

          $$r'^2-3=\frac{(r^2+3)^2-12r^2}{4r^2}=\frac{(r^2-3)^2}{4r^2}>0.$$

          אם $x\in B$ ו-$x>r'$, אז לפי טענה 1.2.8 $x^2>r'^2>3$, סתירה. לכן $r'$ חסם מלעיל רציונלי של $B$, ו-$r'<r$.
      - kind: step
        text: >-
          נניח בשלילה ש-$r\in\mathbb{Q}$ הוא הסופרמום של $B$ ב-$\mathbb{Q}$. $1\in B$, ולכן $r\ge1>0$. לפי מסקנה
          1.3.17, 3 אינו ריבוע של שלם ($1^2<3<2^2$), ולכן $r^2\ne3$. אם $r^2<3$, אז $r\in B$ ו-$r''\in B$ גדול ממנו:
          $r$ אינו חוסם. אם $r^2>3$, אז $r'<r$ חסם רציונלי: $r$ אינו הקטן ביותר. סתירה בכל מקרה.
      - kind: check
        text: >-
          $r=1$: $r''=\frac64=\frac32$, ו-$\frac94=2.25<3$. $r=2$: $r'=\frac74$, ו-$\frac{49}{16}=3.0625>3$. במונה של
          $r''^2-3$: $9r^2+18r+9-3r^2-18r-27=6r^2-18$. בלי מסקנה 1.3.17 המקרה $r^2=3$ לא היה נסגר: לכן ההוכחה
          לא עובדת, למשל, ל-$x^2<4$, שם הסופרמום $2$ רציונלי.
      - kind: result
        text: 'ל-$B$ אין סופרמום ב-$\mathbb{Q}$; זו עוד קבוצה שמראה ש-$\mathbb{Q}$ אינו שלם.'

  - id: W-1.5-10
    level: exam
    objectives: [OBJ-1.5-1]
    prompt: >-
      יהי $F$ שדה סדור. הוכיחו ש-$F$ שלם (מקיים את (של)) אם ורק אם לכל קבוצה לא ריקה $A\subseteq F$ שחסומה מלרע יש
      אינפימום ב-$F$.
    answer: >-
      ($\Rightarrow$) ההוכחה של משפט 1.5.2. ($\Leftarrow$) לקבוצה $A$ לא ריקה וחסומה מלעיל, קבוצת החסמים המלעיל $U$
      לא ריקה וחסומה מלרע, ו-$\inf U=\sup A$.
    solution:
      - kind: idea
        text: >-
          כיוון אחד הוא משפט 1.5.2, שההוכחה שלו משתמשת רק באקסיומות שדה סדור וב-(של). בכיוון השני, הסופרמום הוא
          "החסם המלעיל הקטן ביותר", כלומר האינפימום של קבוצת החסמים המלעיל.
      - kind: theorem
        text: >-
          ($\Rightarrow$) אם $F$ שלם, ההוכחה של משפט 1.5.2 עובדת בתוך $F$ מילה במילה: היא משתמשת בטענות 1.1.8, 1.2.2
          ו-1.4.10, שנכונות בכל שדה סדור, וב-(של).
      - kind: step
        text: >-
          ($\Leftarrow$) תהי $A\subseteq F$ לא ריקה וחסומה מלעיל, ותהי $U$ קבוצת כל החסמים המלעיל של $A$ ב-$F$:
          $U=\{M\in F:\ \forall a\in A,\ a\le M\}$.
      - kind: step
        text: >-
          $U\ne\varnothing$, כי $A$ חסומה מלעיל. כל $a\in A$ הוא חסם מלרע של $U$: $a\le M$ לכל $M\in U$. $A\ne\varnothing$,
          ולכן $U$ חסומה מלרע. לפי ההנחה יש $u=\inf U$.
      - kind: step
        text: >-
          $u$ חסם מלעיל של $A$: כל $a\in A$ הוא חסם מלרע של $U$, ו-$u$ הוא החסם המלרע הגדול ביותר, ולכן $a\le u$.
      - kind: step
        text: >-
          $u$ הקטן מבין החסמים: לכל חסם מלעיל $M$ של $A$, $M\in U$, ולכן $u\le M$ ($u$ חסם מלרע של $U$). לפי הגדרה
          1.4.5, $u=\sup A$.
      - kind: check
        text: >-
          ב-$\mathbb{R}$ עם $A=(0,1)$: $U=[1,\infty)$, ו-$\inf U=1=\sup A$. ב-$\mathbb{Q}$ עם הקבוצה של משפט 1.5.3: $U$
          היא החסמים הרציונליים, ולפי משפט 1.5.3(ג) אין לה מינימום; וגם אינפימום רציונלי אין לה, כי הוא היה הסופרמום.
      - kind: result
        text: '$F$ שלם אם ורק אם לכל קבוצה לא ריקה וחסומה מלרע ב-$F$ יש אינפימום ב-$F$.'

challenge:
  - id: W-1.5-c1
    stars: 1
    objectives: [OBJ-1.5-1]
    prompt: >-
      **תכונת החתך.** נאמר ששדה סדור $F$ מקיים את תכונת החתך אם: לכל שתי קבוצות $A,B\subseteq F$ לא ריקות וזרות, עם
      $A\cup B=F$ ו-$a<b$ לכל $a\in A$, $b\in B$, יש $c\in F$ כך ש-$x\le c$ לכל $x\in A$ ו-$x\ge c$ לכל $x\in B$.

      (א) הוכיחו ש-$\mathbb{R}$ מקיים את תכונת החתך.

      (ב) הוכיחו ששדה סדור שמקיים את תכונת החתך הוא שלם.

      (ג) הראו ש-$\mathbb{Q}$ אינו מקיים את תכונת החתך.
    answer: >-
      (א) $c=\sup A$. (ב) לקבוצה $S$ לא ריקה וחסומה מלעיל: $B$ = החסמים המלעיל, $A$ = כל השאר; ה-$c$ של החתך הוא
      $\sup S$. (ג) $A=\{x\in\mathbb{Q}:\ x\le0\ \lor\ x^2<2\}$ ו-$B=\{x\in\mathbb{Q}:\ x>0,\ x^2>2\}$.
    solution:
      - kind: idea
        text: >-
          חתך הוא חלוקה של הישר לחלק שמאלי ולחלק ימני; ה-$c$ הוא "נקודת החיתוך". ב-$\mathbb{R}$ זו הסופרמום של החלק
          השמאלי. בכיוון ההפוך, החסמים המלעיל של קבוצה הם חלק ימני, והשאר חלק שמאלי. ב-$\mathbb{Q}$ החיתוך נופל
          ב"חור" של משפט 1.5.3.
      - kind: step
        text: >-
          (א) $B\ne\varnothing$, וכל $b\in B$ חוסם את $A$; $A\ne\varnothing$. לפי טענה 1.5.6 יש $c=\sup A$, ו-$c\le b$
          לכל $b\in B$. וכמובן $x\le c$ לכל $x\in A$. לכן $c$ מתאים.
      - kind: step
        text: >-
          (ב) תהי $S\subseteq F$ לא ריקה וחסומה מלעיל. $B$ = קבוצת החסמים המלעיל של $S$, $A=F\setminus B$. $B\ne\varnothing$.
          יהי $s\in S$; $s-1<s$, ולכן $s-1$ אינו חוסם ו-$s-1\in A$. הקבוצות זרות ואיחודן $F$. אם $a\in A$ ו-$b\in B$:
          $a$ אינו חוסם, ולכן יש $s\in S$ עם $s>a$, ו-$b\ge s>a$.
      - kind: step
        text: >-
          לפי תכונת החתך יש $c$. נניח בשלילה ש-$c\in A$: יש $s\in S$ עם $s>c$, והאמצע $d=\frac{c+s}2$ מקיים $c<d<s$
          (מסקנה 1.2.6), ולכן $d$ אינו חוסם ($s>d$), כלומר $d\in A$, ולכן $d\le c$. סתירה. לכן $c\in B$: $c$ חסם
          מלעיל של $S$, ו-$c\le b$ לכל חסם $b\in B$. לפי הגדרה 1.4.5, $c=\sup S$.
      - kind: step
        text: >-
          (ג) ב-$\mathbb{Q}$ יהיו $A$ קבוצת הרציונליים $x$ עם $x\le0$ או $x^2<2$, ו-$B=\{x\in\mathbb{Q}:\ x>0,\ x^2>2\}$.
          לפי משפט 1.3.15 אין רציונלי עם $x^2=2$, ולכן כל רציונלי נמצא בדיוק באחת מהן; $0\in A$, $2\in B$. אם $a\in A$,
          $b\in B$: כש-$a\le0$, $a<b$; כש-$a>0$, $a^2<2<b^2$, ולפי טענה 1.2.8 $a<b$.
      - kind: step
        text: >-
          נניח שיש $c\in\mathbb{Q}$ כזה. $1\in A$, ולכן $c\ge1>0$, ו-$c^2\ne2$. אם $c^2<2$, אז לפי משפט 1.5.3(ב)
          $\frac{2c+2}{c+2}$ איבר של $A$ (חיובי, ריבועו קטן מ-2) וגדול מ-$c$: סתירה ל-$x\le c$ על $A$. אם $c^2>2$, אז
          $c'=\frac{c^2+2}{2c}$ רציונלי, חיובי, $c'^2>2$ ו-$c'<c$ (משפט 1.5.3(ג) ושלב 6 בהוכחתו), כלומר $c'\in B$ ו-$c'<c$: סתירה
          ל-$x\ge c$ על $B$.
      - kind: check
        text: >-
          ב-(ב) השתמשנו רק באקסיומות שדה סדור ובאמצע, ולכן (א) ו-(ב) יחד אומרים שתכונת החתך שקולה ל-(של). ב-(ג)
          החלוקה היא "לפני $\sqrt2$" ו"אחרי $\sqrt2$", ו-$\sqrt2$ אינו ב-$\mathbb{Q}$.
      - kind: result
        text: '(א) $c=\sup A$. (ב) שדה עם תכונת החתך שלם. (ג) ב-$\mathbb{Q}$ החתך סביב השורש של 2 אין לו נקודה.'
    source:
      name: 'Intro to Real Analysis, Problem Set 2 (all questions taken from S. Abbott, Understanding Analysis, 2nd ed.)'
      year: 2017
      problem: 'Challenge 1'
      url: 'https://this-vijay.github.io/teaching_material/analysis_2017fall/HW2_fall_2017.pdf'
      verified: '2026-11-12'
      adapted: true

  - id: W-1.5-c2
    stars: 1
    objectives: [OBJ-1.5-3]
    prompt: >-
      יהיו $A,B$ קבוצות לא ריקות וחסומות של מספרים ממשיים אי-שליליים, ו-$C=\{ab:\ a\in A,\ b\in B\}$. הוכיחו ש-$C$
      חסומה, ש-$\sup C=\sup A\cdot\sup B$ וש-$\inf C=\inf A\cdot\inf B$.
    answer: >-
      החסמים מכפל אי-שוויונות של אי-שליליים. לסופרמום: $\delta=\min\left(\alpha,\beta,\frac{\varepsilon}{\alpha+\beta}\right)$
      (כש-$\alpha,\beta>0$); לאינפימום: $\delta=\min\left(1,\frac{\varepsilon}{\alpha'+\beta'+1}\right)$.
    solution:
      - kind: idea
        text: >-
          כמו בסכום (משפט 1.5.7), אבל כופלים אי-שוויונות, וזה מותר כאן כי הכול אי-שלילי (טענה 1.2.8). את
          ה-$\varepsilon$ מחלקים דרך הפיתוח $(\alpha-\delta)(\beta-\delta)=\alpha\beta-\delta(\alpha+\beta)+\delta^2$.
      - kind: step
        text: >-
          נסמן $\alpha=\sup A$, $\beta=\sup B$, $\alpha'=\inf A$, $\beta'=\inf B$. $0$ חסם מלרע של $A$ ו-$B$, ולכן
          $\alpha',\beta'\ge0$, ו-$\alpha\ge\alpha'\ge0$, $\beta\ge\beta'\ge0$. לכל $a\in A$, $b\in B$: כפל של
          $\alpha'\le a\le\alpha$ ו-$\beta'\le b\le\beta$, כשהכול אי-שלילי, נותן $\alpha'\beta'\le ab\le\alpha\beta$.
          לכן $C$ חסומה.
      - kind: step
        text: >-
          **סופרמום.** אם $\alpha=0$, אז $0\le a\le0$ לכל $a$, כלומר $A=\{0\}$ ו-$C=\{0\}$, ו-$\sup C=0=\alpha\beta$; וכך
          גם אם $\beta=0$. נניח $\alpha,\beta>0$, ויהי $\varepsilon>0$ ו-$\delta=\min\left(\alpha,\beta,\frac{\varepsilon}{\alpha+\beta}\right)>0$.
          לפי משפט 1.4.8 יש $a>\alpha-\delta\ge0$ ו-$b>\beta-\delta\ge0$, ולפי טענה 1.2.8

          $$ab>(\alpha-\delta)(\beta-\delta)=\alpha\beta-\delta(\alpha+\beta)+\delta^2\ge\alpha\beta-\varepsilon.$$

          לפי משפט 1.4.8, $\sup C=\alpha\beta$.
      - kind: step
        text: >-
          **אינפימום.** יהי $\varepsilon>0$ ו-$\delta=\min\left(1,\frac{\varepsilon}{\alpha'+\beta'+1}\right)>0$. יש $a<\alpha'+\delta$
          ו-$b<\beta'+\delta$, עם $a,b\ge0$. לפי טענה 1.2.8, ובגלל $\delta^2\le\delta$ (כי $\delta\le1$):

          $$ab<(\alpha'+\delta)(\beta'+\delta)=\alpha'\beta'+\delta(\alpha'+\beta')+\delta^2\le\alpha'\beta'+\delta(\alpha'+\beta'+1)\le\alpha'\beta'+\varepsilon.$$

          לפי משפט 1.4.8, $\inf C=\alpha'\beta'$.
      - kind: check
        text: >-
          $A=B=[1,2]$: $C=[1,4]$, ו-$1=1\cdot1$, $4=2\cdot2$. בלי אי-שליליות זה נכשל: $A=B=\{-2,1\}$ נותנות
          $\sup C=4\ne1$ (שיעור 1.5, "מה לא עובר למכפלות"). ההגבלה $\delta\le\alpha,\beta$ שומרת ש-$\alpha-\delta$
          ו-$\beta-\delta$ אי-שליליים, אחרת אסור לכפול.
      - kind: result
        text: '$C$ חסומה, $\sup C=\sup A\cdot\sup B$, $\inf C=\inf A\cdot\inf B$.'
    source:
      name: 'Jiří Lebl, Basic Analysis I: Introduction to Real Analysis, Volume I (HTML edition, Section 1.2)'
      year: 2026
      problem: 'Exercise 1.2.10'
      url: 'https://jirka.org/ra/html/sec_setofreals.html'
      verified: '2026-11-12'
      adapted: true
