  - id: W-2.5-c2
    stars: 1
    objectives: [OBJ-2.5-2]
    prompt: >-
      תהי $(x_n)$ סדרה מונוטונית ומתכנסת, ונניח שיש $k\in\mathbb{N}$ כך ש-$\lim x_n=x_k$: הגבול הוא אחד מאיברי
      הסדרה.

      (א) הוכיחו ש-$x_n=x_k$ לכל $n\ge k$.

      (ב) הפריכו את הטענה בלי ההנחה שהסדרה מונוטונית.

      (ג) הסיקו: סדרה עולה ממש ומתכנסת אינה מקבלת את הגבול שלה אף פעם.
    answer: >-
      (א) לסדרה עולה: $x_k\le x_n$ ממונוטוניות ו-$x_n\le\lim x_m=x_k$ משמירה על אי-שוויון חלש. (ב) $x_1=0$
      ו-$x_n=\frac1n$ לכל $n\ge2$. (ג) אילו $\lim x_n=x_k$, לפי (א) $x_{k+1}=x_k$, בסתירה ל-$x_k<x_{k+1}$.
    solution:
      - kind: idea
        text: >-
          בסדרה עולה כל איבר קטן או שווה לגבול: מקבעים מקום $n$, וכל האיברים שאחריו גדולים או שווים ל-$x_n$; גבול
          שומר על אי-שוויון חלש. אם הגבול הוא $x_k$, אז מ-$k$ והלאה האיברים כלואים בין $x_k$ ל-$x_k$.
      - kind: step
        text: >-
          (א) נניח קודם ש-$(x_n)$ עולה, ונסמן $L=\lim x_n=x_k$. יהי $n\in\mathbb{N}$. לפי טענה 2.1.8, $x_n\le x_m$ לכל
          $m>n$, ולפי מסקנה 2.5.2 (א) (עם $c=x_n$ ו-$n_0=n$) $x_n\le L$. כלומר $x_n\le x_k$ לכל $n$.
      - kind: step
        text: >-
          מצד שני, לכל $n\ge k$ לפי טענה 2.1.8 (או $n=k$) $x_k\le x_n$. יחד: $x_k\le x_n\le x_k$, ולכן $x_n=x_k$ לכל
          $n\ge k$.
      - kind: step
        text: >-
          אם $(x_n)$ יורדת, הסדרה $(-x_n)$ עולה ($x_{n+1}\le x_n$ גורר $-x_n\le-x_{n+1}$, טענה 1.2.2 (ג)), שואפת ל-$-L=-x_k$ (משפט 2.4.1), והגבול הזה הוא האיבר
          ה-$k$ שלה. לפי המקרה הקודם $-x_n=-x_k$, כלומר $x_n=x_k$, לכל $n\ge k$.
      - kind: step
        text: >-
          (ב) $x_1=0$ ו-$x_n=\frac1n$ לכל $n\ge2$. הסדרה שואפת ל-$0$ (היא שונה מ-$\frac1n$ רק במקום הראשון, מסקנה
          2.2.12 (ב)), ו-$0=x_1$. אבל $x_2=\frac12\ne0$. היא אינה מונוטונית: $x_1<x_2$ ו-$x_2>x_3$.
      - kind: step
        text: >-
          (ג) תהי $(x_n)$ עולה ממש ומתכנסת, ונניח בשלילה ש-$\lim x_n=x_k$. לפי (א) $x_{k+1}=x_k$, אבל הסדרה עולה
          ממש, ולכן $x_k<x_{k+1}$: סתירה.
      - kind: check
        text: >-
          איפה השתמשנו בכל הנחה: המונוטוניות נתנה את שני אי-השוויונות $x_n\le L$ ו-$x_k\le x_n$; ההתכנסות נתנה את
          $L$; והשמירה על אי-שוויון **חלש** היא כל מה שצריך, כי $x_n<L$ אינו נכון כאן. דוגמה ל-(א): הסדרה
          $\min\left(n,3\right)$, כלומר $1,2,3,3,3,\dots$, עולה, שואפת ל-$3=x_3$, וקבועה מ-$n=3$.
      - kind: result
        text: >-
          (א) בסדרה מונוטונית שמקבלת את גבולה במקום $k$, כל האיברים מ-$k$ והלאה שווים לגבול. (ב) בלי מונוטוניות לא.
          (ג) סדרה עולה ממש ומתכנסת אינה מקבלת את הגבול שלה.
    source:
      name: 'Jiří Lebl, Basic Analysis I: Introduction to Real Analysis, Volume I (version 6.3)'
      year: 2026
      problem: 'Exercise 2.1.13'
      url: 'https://www.jirka.org/ra/realanal.pdf'
      verified: '2026-11-17'
      adapted: true
