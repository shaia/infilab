  - id: W-2.2-c2
    stars: 1
    objectives: [OBJ-2.2-1]
    prompt: >-
      תהי $x_n$ סדרה. נגדיר ממנה סדרה חדשה $y_n$ שמשלבת את $x_n$ עם האיברים שלה במקומות שהם ריבועים: לכל
      $k\in\mathbb{N}$

      $$y_{2k-1}=x_k,\qquad y_{2k}=x_{k^2}$$

      כלומר $y_1,y_2,y_3,y_4,y_5,y_6,\dots$ הם $x_1,x_1,x_2,x_4,x_3,x_9,\dots$. הוכיחו שלכל $L\in\mathbb{R}$:
      $x_n\to L$ אם ורק אם $y_n\to L$.
    answer: >-
      אם $N$ מתאים ל-$\varepsilon$ עבור $x_n$, אז $2N$ מתאים ל-$\varepsilon$ עבור $y_n$. ולהפך, אם $M$ מתאים
      עבור $y_n$, אז אותו $M$ מתאים עבור $x_n$.
    solution:
      - kind: idea
        text: >-
          כל איבר של $y_n$ הוא איבר של $x_n$ שהאינדקס שלו לפחות כמחצית מהמקום שלו ב-$y_n$; וכל איבר $x_k$ מופיע
          ב-$y_n$ במקום $2k-1\ge k$. לכן זנב של אחת הסדרות נמצא בתוך זנב של השנייה.
      - kind: goal
        text: 'שני כיוונים: אם $x_n\to L$ אז $y_n\to L$; ואם $y_n\to L$ אז $x_n\to L$.'
      - kind: step
        text: >-
          נניח $x_n\to L$, ויהי $\varepsilon>0$. יש $N$ כך ש-$|x_k-L|<\varepsilon$ לכל $k>N$. נראה ש-$|y_n-L|<\varepsilon$
          לכל $n>2N$.
      - kind: step
        text: >-
          אם $n=2k$ זוגי: $2k>2N$ נותן $k>N$, וכיוון ש-$k\ge1$ גם $k^2\ge k>N$. לכן
          $|y_n-L|=|x_{k^2}-L|<\varepsilon$.
      - kind: step
        text: >-
          אם $n=2k-1$ אי-זוגי: $2k-1>2N$ נותן $k>N+\frac12>N$. לכן $|y_n-L|=|x_k-L|<\varepsilon$. בשני המקרים
          $2N$ מתאים ל-$\varepsilon$ עבור $y_n$, ולכן $y_n\to L$.
      - kind: step
        text: >-
          להפך: נניח $y_n\to L$, ויהי $\varepsilon>0$. יש $M$ כך ש-$|y_n-L|<\varepsilon$ לכל $n>M$. לכל $k>M$:
          $2k-1=k+(k-1)\ge k>M$, ולכן $|x_k-L|=|y_{2k-1}-L|<\varepsilon$. כלומר $M$ מתאים ל-$\varepsilon$ עבור
          $x_n$, ו-$x_n\to L$.
      - kind: check
        text: >-
          למה צריך את המקומות האי-זוגיים: אילו $y_n$ הייתה רק $x_{n^2}$, הכיוון השני היה נכשל. למשל $x_n=0$ כאשר
          $n$ ריבוע ו-$x_n=1$ אחרת: אז $x_{n^2}=0$ לכל $n$, אבל $x_n$ אינה שואפת ל-0, כי אחרי כל $N$ יש מספר
          שאינו ריבוע. המקומות האי-זוגיים מכילים את כל $x_n$, ובזכותם הכיוון השני עובד.
      - kind: result
        text: >-
          לכל $L$: $x_n\to L$ אם ורק אם $y_n\to L$. ה-$N$ עובר מסדרה לסדרה במפורש ($2N$ בכיוון אחד, $M$ בשני).
    source:
      name: 'Jiří Lebl, Basic Analysis I: Introduction to Real Analysis, Volume I (version 6.3)'
      year: 2026
      problem: 'Exercise 2.1.20'
      url: 'https://www.jirka.org/ra/realanal.pdf'
      verified: '2026-11-06'
      adapted: true
