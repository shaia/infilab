# Workbook of lesson 2.9 — subsequences, partial limits and the Bolzano–Weierstrass theorem.
# Objectives (src/course.ts):
#   OBJ-2.9-1  define a subsequence; every subsequence of a convergent sequence tends to the same limit
#   OBJ-2.9-2  define a partial limit and find the partial limits of given sequences
#   OBJ-2.9-3  state and prove Bolzano–Weierstrass, and use it
# Every number below was recomputed by a command (node / src/math/bisection.ts).
lesson: '2.9'
practice:
  - id: W-2.9-01
    level: basic
    qualitative: true
    objectives: [OBJ-2.9-1]
    prompt: >-
      תהי $(a_n)$ סדרה. לכל אחת מהנוסחאות הבאות ל-$n_k$, הוכיחו או הפריכו ש-$(a_{n_k})_{k=1}^{\infty}$ היא תת-סדרה
      של $(a_n)$.

      (א) $n_k=2^k$.

      (ב) $n_k=k^2-3k+3$.

      (ג) $n_k=\left\lceil\frac k2\right\rceil$.

      (ד) $n_k=\frac{k(k+1)}{2}$.
    answer: '(א) ו-(ד) תת-סדרות; (ב) ו-(ג) לא, כי $n_1=n_2=1$.'
    solution:
      - kind: definition
        text: >-
          לפי הגדרה 2.9.1, $(a_{n_k})$ היא תת-סדרה אם כל $n_k$ טבעי ו-$n_1<n_2<n_3<\cdots$, כלומר
          $n_{k+1}>n_k$ לכל $k$ (טענה 2.1.8 מעבירה את זה לכל $k<k'$).
      - kind: step
        text: >-
          (א) $2^k\in\mathbb{N}$, ו-$n_{k+1}-n_k=2^{k+1}-2^k=2^k>0$. לכן זו תת-סדרה: $a_2, a_4, a_8, a_{16},\dots$
      - kind: computation
        text: >-
          (ב) $n_1=1-3+3=1$ ו-$n_2=4-6+3=1$. אז $n_1=n_2$, והמקומות אינם עולים ממש: הסדרה $a_1,a_1,a_3,a_7,\dots$
          חוזרת על המקום הראשון, ואינה תת-סדרה.
      - kind: computation
        text: >-
          (ג) $n_1=\lceil0.5\rceil=1$ ו-$n_2=\lceil1\rceil=1$: שוב $n_1=n_2$, והסדרה $a_1,a_1,a_2,a_2,\dots$ אינה
          תת-סדרה.
      - kind: step
        text: >-
          (ד) $k(k+1)$ זוגי (אחד משני מספרים עוקבים זוגי), ולכן $n_k\in\mathbb{N}$. $n_{k+1}-n_k=\frac{(k+1)(k+2)-k(k+1)}{2}=k+1>0$.
          לכן זו תת-סדרה: $a_1,a_3,a_6,a_{10},\dots$
      - kind: result
        text: '(א) ו-(ד) תת-סדרות. (ב) ו-(ג) אינן, כי בשתיהן $n_1=n_2=1$.'

  - id: W-2.9-02
    level: basic
    objectives: [OBJ-2.9-1]
    prompt: >-
      נתון ש-$a_n\to5$.

      (א) הוכיחו ש-$\frac{a_{2n}+a_{n^2}}{2}\to5$.

      (ב) חשבו את $\lim_{n\to\infty}a_{n+1}\,a_{3n}$, ונמקו כל צעד.
    answer: '(א) לפי משפט 2.9.3 שני המחוברים שואפים ל-5. (ב) 25.'
    solution:
      - kind: theorem
        text: 'משפט 2.9.3: אם $a_n\to L$, כל תת-סדרה שואפת ל-$L$.'
      - kind: step
        text: >-
          (א) $n\mapsto2n$ ו-$n\mapsto n^2$ עולות ממש ($2(n+1)>2n$, ו-$(n+1)^2-n^2=2n+1>0$), ולכן $(a_{2n})$
          ו-$(a_{n^2})$ תת-סדרות, ושתיהן שואפות ל-5. לפי משפט 2.4.1, $\frac{a_{2n}+a_{n^2}}{2}\to\frac{5+5}{2}=5$.
      - kind: step
        text: >-
          (ב) $(a_{n+1})$ היא תת-סדרה עם $n_k=k+1$ (זנב, גם לפי מסקנה 2.2.12 (א)), ו-$(a_{3n})$ עם $n_k=3k$. שתיהן
          שואפות ל-5, ולפי משפט 2.4.2 המכפלה שואפת ל-$5\cdot5=25$.
      - kind: check
        text: 'למשל $a_n=5+\frac1n$: $a_{n+1}a_{3n}=\left(5+\frac1{n+1}\right)\left(5+\frac1{3n}\right)$, ועבור $n=1000$ זה בערך $25.0067$.'
      - kind: result
        text: '(א) הגבול 5. (ב) $\lim a_{n+1}a_{3n}=25$.'

  - id: W-2.9-03
    level: basic
    objectives: [OBJ-2.9-2]
    prompt: >-
      מצאו את כל הגבולות החלקיים של $a_n=\big(1+(-1)^n\big)\frac{n}{n+1}$, והוכיחו שאין אחרים.
    answer: '$0$ ו-$2$.'
    solution:
      - kind: computation
        text: >-
          במקומות האי-זוגיים $1+(-1)^n=0$, ולכן $a_{2k-1}=0$. במקומות הזוגיים $a_{2k}=\frac{2\cdot2k}{2k+1}=2-\frac2{2k+1}$.
          למשל $a_2=\frac43$, $a_4=\frac85=1.6$.
      - kind: step
        text: >-
          $a_{2k-1}=0\to0$, ו-$|a_{2k}-2|=\frac{2}{2k+1}\le\frac2k$, ולכן לפי טענה 2.2.13 $a_{2k}\to2$. שני המספרים
          גבולות חלקיים.
      - kind: idea
        text: 'כדי לפסול $L$ אחר: אחרי מקום מסוים כל האיבר קרוב ל-0 או ל-2, ולכן רחוק מ-$L$ (משפט 2.9.5).'
      - kind: step
        text: >-
          יהי $L\notin\{0,2\}$ ו-$\delta=\min(|L|,\ |L-2|)>0$. לכל $n$, $a_n=0$ או $|a_n-2|\le\frac2n$. אם $n>\frac4\delta$,
          במקרה הראשון $|a_n-L|=|L|\ge\delta$, ובשני, לפי מסקנה 0.9.9, $|a_n-L|\ge|2-L|-\frac2n>\delta-\frac\delta2$.
          בשני המקרים $|a_n-L|>\frac\delta2$.
      - kind: step
        text: >-
          לכן $\left\{n:\ |a_n-L|<\frac\delta2\right\}$ חסומה על ידי $\frac4\delta$, ולפי למה 2.2.6 סופית. לפי משפט 2.9.5
          (ב), $L$ אינו גבול חלקי.
      - kind: result
        text: 'הגבולות החלקיים הם בדיוק $0$ ו-$2$ (ולכן הסדרה מתבדרת, מסקנה 2.9.3א).'

  - id: W-2.9-04
    level: mid
    qualitative: true
    objectives: [OBJ-2.9-2, OBJ-2.9-1]
    prompt: >-
      הוכיחו או הפריכו:

      (א) אם $L$ גבול חלקי של $(a_n)$, אז $L$ גבול חלקי של כל תת-סדרה של $(a_n)$.

      (ב) גבול חלקי של תת-סדרה של $(a_n)$ הוא גבול חלקי של $(a_n)$.

      (ג) אם לשתי סדרות יש אותה קבוצת ערכים, יש להן אותם גבולות חלקיים.
    answer: '(א) לא נכון; (ב) נכון; (ג) לא נכון.'
    solution:
      - kind: step
        text: >-
          (א) הפרכה: $a_n=(-1)^n$, ו-$L=-1$ גבול חלקי ($a_{2k-1}=-1$). התת-סדרה $a_{2k}=1$ קבועה, ולפי מסקנה 2.9.6
          הגבול החלקי היחיד שלה הוא 1.
      - kind: step
        text: >-
          (ב) הוכחה: תהי $b_k=a_{n_k}$ תת-סדרה, ו-$L$ גבול חלקי שלה: יש $k_1<k_2<\cdots$ עם $b_{k_j}\to L$. לפי למה
          2.9.2 (ב), $b_{k_j}=a_{n_{k_j}}$ היא תת-סדרה של $(a_n)$, ולכן $L$ גבול חלקי של $(a_n)$.
      - kind: step
        text: >-
          (ג) הפרכה: $a_n=\frac1n$, ו-$(b_n)$ המוגדרת כך: $b_{2k-1}=1$ ו-$b_{2k}=\frac1{k+1}$, כלומר
          $1,\frac12,1,\frac13,1,\frac14,\dots$ לשתיהן קבוצת הערכים $\left\{\frac1k:\ k\in\mathbb{N}\right\}$.
      - kind: step
        text: >-
          ל-$(a_n)$ הגבול החלקי היחיד הוא 0 (מסקנה 2.9.6). ל-$(b_n)$ גם 1 גבול חלקי, כי $b_{2k-1}=1\to1$. הגבול
          החלקי תלוי בכמה פעמים, ובאילו מקומות, מתקבל ערך, ולא רק בקבוצת הערכים.
      - kind: result
        text: '(א) לא נכון; (ב) נכון; (ג) לא נכון.'

  - id: W-2.9-05
    level: mid
    objectives: [OBJ-2.9-3]
    prompt: >-
      יהיו $(a_n)$ ו-$(b_n)$ סדרות חסומות. הוכיחו שיש מקומות $m_1<m_2<\cdots$ כך ש**שתי** הסדרות $(a_{m_j})$
      ו-$(b_{m_j})$ מתכנסות.
    answer: 'בולצאנו-ויירשטראס פעמיים: קודם על $a_n$, ואז על $b$ לאורך המקומות שנבחרו.'
    solution:
      - kind: idea
        text: >-
          משפט 2.9.8 נותן מקומות שבהם $a$ מתכנסת. לאורך המקומות האלה $b$ עדיין חסומה, ומפעילים את המשפט שוב. תת-סדרה
          של סדרה מתכנסת מתכנסת לאותו גבול, ולכן $a$ לא מתקלקלת בצעד השני.
      - kind: step
        text: 'לפי משפט 2.9.8 יש $n_1<n_2<\cdots$ ו-$L$ עם $a_{n_k}\to L$.'
      - kind: step
        text: >-
          הסדרה $c_k=b_{n_k}$ חסומה, כי $(b_n)$ חסומה. לפי משפט 2.9.8 יש $k_1<k_2<\cdots$ ו-$M$ עם $c_{k_j}=b_{n_{k_j}}\to M$.
      - kind: step
        text: >-
          נגדיר $m_j=n_{k_j}$. לפי למה 2.9.2 (ב) $m_1<m_2<\cdots$. $(a_{m_j})$ היא תת-סדרה של $(a_{n_k})$, ולפי
          משפט 2.9.3 $a_{m_j}\to L$; ו-$b_{m_j}=c_{k_j}\to M$.
      - kind: check
        text: >-
          $a_n=(-1)^n$, $b_n=(-1)^{\lfloor n/2\rfloor}$ ($b_1,b_2,\dots=1,-1,-1,1,1,-1,\dots$): המקומות $m_j=4j$ נותנים
          $a_{4j}=1$ ו-$b_{4j}=(-1)^{2j}=1$, ושתיהן קבועות.
      - kind: result
        text: 'יש $m_1<m_2<\cdots$ עם $a_{m_j}\to L$ ו-$b_{m_j}\to M$.'

  - id: W-2.9-06
    level: mid
    qualitative: true
    objectives: [OBJ-2.9-3]
    prompt: >-
      הוכיחו או הפריכו:

      (א) אם $[a_{n+1},b_{n+1}]\subseteq[a_n,b_n]$ לכל $n$ (קטעים סגורים, $a_n\le b_n$), יש מספר ששייך לכל הקטעים,
      גם אם האורכים אינם שואפים לאפס.

      (ב) אם בנוסף כל הקצוות $a_n,b_n$ רציונליים ו-$b_n-a_n\to0$, הנקודה המשותפת רציונלית.
    answer: '(א) נכון; (ב) לא נכון: חציה של $[1,2]$ לעבר $\sqrt2$.'
    solution:
      - kind: step
        text: >-
          (א) כמו בשלבים 1–2 של למה 2.9.7: $(a_n)$ עולה וחסומה מלעיל על ידי $b_1$, ולכן $a_n\to\alpha$ (משפט 2.7.1).
          לפי מסקנה 2.7.2, $a_n\le\alpha$ לכל $n$.
      - kind: step
        text: >-
          לכל $m$ ולכל $n$, $a_n\le b_m$ (שלב 1 בלמה 2.9.7). נקבע $m$ ונעביר לגבול ב-$n$: לפי מסקנה 2.5.2 $\alpha\le b_m$.
          לכן $a_m\le\alpha\le b_m$ לכל $m$, ו-$\alpha$ בכל הקטעים. אורך ששואף לאפס נחוץ רק ליחידות.
      - kind: step
        text: >-
          (ב) הפרכה. $I_1=[1,2]$; בכל צעד חוצים את $I_n=[a_n,b_n]$ בנקודה $m_n=\frac{a_n+b_n}2$, ששוב רציונלית. $\sqrt2$
          אי-רציונלי (משפט 1.3.15, שיעור 1.3), ולכן $\sqrt2\ne m_n$, ושומרים את החצי שמכיל את $\sqrt2$: $[a_n,m_n]$ אם $\sqrt2<m_n$,
          אחרת $[m_n,b_n]$.
      - kind: step
        text: >-
          באינדוקציה, הקצוות רציונליים, $\sqrt2\in I_n$, והאורך $\frac1{2^{n-1}}\to0$ (טענה 2.8.1). לפי למה 2.9.7 יש
          נקודה משותפת יחידה, והיא $\sqrt2$, כי $\sqrt2$ בכל הקטעים.
      - kind: check
        text: >-
          הקטעים הראשונים: $[1,2]$, $[1,1.5]$, $[1.25,1.5]$, $[1.375,1.5]$, $[1.375,1.4375]$; ו-$\sqrt2\approx1.41421$ בכולם.
      - kind: result
        text: '(א) נכון. (ב) לא נכון: קצוות רציונליים, נקודה משותפת $\sqrt2$.'

  - id: W-2.9-07
    level: mid
    objectives: [OBJ-2.9-2]
    prompt: >-
      (א) הוכיחו: $L$ **אינו** גבול חלקי של $(a_n)$ אם ורק אם יש $\varepsilon>0$ ו-$N\in\mathbb{N}$ כך ש-$|a_n-L|\ge\varepsilon$
      לכל $n>N$.

      (ב) עבור $a_n=(-1)^n+\frac1n$ ו-$L=0$, מצאו $\varepsilon$ ו-$N$ כאלה.
    answer: '(א) השלילה של משפט 2.9.5 (ג). (ב) למשל $\varepsilon=\frac12$, $N=1$.'
    solution:
      - kind: theorem
        text: >-
          לפי משפט 2.9.5, $L$ גבול חלקי אם ורק אם
          $\forall\varepsilon>0\ \forall N\in\mathbb{N}\ \exists n>N:\ |a_n-L|<\varepsilon$.
      - kind: step
        text: >-
          (א) שוללים את שני הצדדים. לפי משפט 0.3.10 וטענה 0.3.13 (כמו בהוכחת משפט 2.2.8), השלילה היא
          $\exists\varepsilon>0\ \exists N\in\mathbb{N}\ \forall n>N:\ |a_n-L|\ge\varepsilon$. זו בדיוק הטענה.
      - kind: computation
        text: >-
          (ב) $a_1=-1+1=0$, ולכן $n=1$ קרוב ל-0; נבחר $N=1$, שמשאיר אותו מחוץ לבדיקה. לכל $n\ge2$, לפי מסקנה 0.9.9,
          $|a_n|\ge|(-1)^n|-\frac1n=1-\frac1n\ge\frac12$.
      - kind: check
        text: '$a_2=1.5$, $a_3=-\frac23$, $a_4=1.25$: כולם במרחק לפחות $\frac12$ מ-0.'
      - kind: result
        text: '(א) הוכח. (ב) $\varepsilon=\frac12$ ו-$N=1$.'

  - id: W-2.9-08
    level: exam
    objectives: [OBJ-2.9-3, OBJ-2.9-2]
    prompt: >-
      (א) תהי $(a_n)$ סדרה חסומה שיש לה בדיוק שני גבולות חלקיים, $L_1<L_2$. הוכיחו: לכל $\varepsilon>0$ קיים $N$ כך
      שלכל $n>N$, $a_n\in(L_1-\varepsilon,\ L_1+\varepsilon)\cup(L_2-\varepsilon,\ L_2+\varepsilon)$.

      (ב) הפריכו את (א) בלי ההנחה שהסדרה חסומה.
    answer: '(א) בדרך השלילה עם בולצאנו-ויירשטראס. (ב) $a_{3k}=3k$, $a_{3k+1}=0$, $a_{3k+2}=1$.'
    solution:
      - kind: idea
        text: >-
          אם אינסוף איברים נשארים מחוץ לשתי הסביבות, הם יוצרים תת-סדרה חסומה, ולפי בולצאנו-ויירשטראס יש להם גבול
          חלקי שלישי.
      - kind: step
        text: >-
          (א) נניח בשלילה שיש $\varepsilon>0$ כך שלכל $N$ יש $n>N$ עם $|a_n-L_1|\ge\varepsilon$ וגם $|a_n-L_2|\ge\varepsilon$.
          לפי למה 2.2.6 הקבוצה $S$ של המקומות האלה אינה סופית, ולפי למה 2.9.2 (ג) יש תת-סדרה $(a_{n_k})$ עם $n_k\in S$.
      - kind: theorem
        text: >-
          $(a_{n_k})$ חסומה, ולפי משפט 2.9.8 יש לה תת-סדרה $a_{n_{k_j}}\to L$. לפי למה 2.9.2 (ב), $L$ גבול חלקי של
          $(a_n)$, ולכן $L=L_1$ או $L=L_2$.
      - kind: step
        text: >-
          אבל $|a_{n_{k_j}}-L_i|\ge\varepsilon$ לכל $j$ ולכל $i$, ולפי משפט 2.4.1, טענה 2.3.6 ומסקנה 2.5.2,
          $|L-L_1|\ge\varepsilon$ ו-$|L-L_2|\ge\varepsilon$. סתירה.
      - kind: step
        text: >-
          (ב) $a_n=n$ כש-$n$ מתחלק ב-3, $a_n=0$ כשהשארית 1, ו-$a_n=1$ כשהשארית 2. $0$ ו-$1$ גבולות חלקיים (תת-סדרות
          קבועות). אין אחרים: תת-סדרה מתכנסת חסומה (משפט 2.3.3), ולכן רק מספר סופי של איבריה במקומות שמתחלקים ב-3,
          ומזנב מסוים היא תת-סדרה של איברים ששווים ל-0 או ל-1; לפי משפט 2.9.5 ולמה 2.2.6, אין לה גבול מלבד 0 ו-1.
      - kind: check
        text: >-
          עם $\varepsilon=\frac14$: האיברים $a_{3k}=3k$ נמצאים מחוץ ל-$\left(-\frac14,\frac14\right)\cup\left(\frac34,\frac54\right)$
          לכל $k$, ולכן אין $N$ כנדרש. בהוכחה של (א), התת-סדרה של שלב 1 היא כאן $a_{3k}$, שאינה חסומה.
      - kind: result
        text: '(א) הוכח. (ב) הסדרה $3k$, $0$, $1$ במחזור מפריכה את הטענה בלי חסימות.'

  - id: W-2.9-09
    level: exam
    objectives: [OBJ-2.9-2]
    prompt: >-
      (א) הוכיחו: אם $L_1, L_2, L_3,\dots$ גבולות חלקיים של $(a_n)$ ו-$L_k\to L$, אז גם $L$ גבול חלקי של $(a_n)$.

      (ב) הסיקו שאין סדרה שקבוצת הגבולות החלקיים שלה היא בדיוק $\left\{\frac1k:\ k\in\mathbb{N}\right\}$.
    answer: '(א) בונים תת-סדרה עם $|a_{n_k}-L_k|<\frac1k$. (ב) 0 היה גבול חלקי.'
    solution:
      - kind: idea
        text: >-
          בצעד ה-$k$ בוחרים איבר קרוב ל-$L_k$ עד כדי $\frac1k$, ואחרי המקום הקודם. אז המרחק מ-$L$ קטן מ-$\frac1k+|L_k-L|$,
          ששואף לאפס.
      - kind: step
        text: >-
          (א) לכל $k$ ולכל $x\in\mathbb{R}$, לפי משפט 2.9.5 (ג) עבור $L_k$, עם $\varepsilon=\frac1k$ ו-$N>x$ טבעי (ארכימדס),
          הקבוצה $\left\{n>x:\ |a_n-L_k|<\frac1k\right\}$ אינה ריקה; נסמן את האיבר הקטן ביותר שלה $g_k(x)$ (משפט 0.6.3).
      - kind: step
        text: >-
          לפי משפט 0.5.4: $n_1=g_1(0)$, $n_{k+1}=g_{k+1}(n_k)$. אז $n_1<n_2<\cdots$ ו-$|a_{n_k}-L_k|<\frac1k$ לכל $k$.
      - kind: step
        text: >-
          לפי אי-שוויון המשולש, $|a_{n_k}-L|\le|a_{n_k}-L_k|+|L_k-L|<\frac1k+|L_k-L|$. הסדרה $\frac1k+|L_k-L|$ שואפת
          ל-0 (טענות 2.2.2, 2.2.10 ומשפט 2.4.1), ולפי טענה 2.2.13 (עם $C=1$) $a_{n_k}\to L$.
      - kind: step
        text: >-
          (ב) אילו כל $\frac1k$ היה גבול חלקי, אז לפי (א) עם $L_k=\frac1k\to0$ גם 0 היה גבול חלקי, ו-$0\notin\left\{\frac1k\right\}$.
      - kind: check
        text: >-
          לעומת זאת $\left\{\frac1k\right\}\cup\{0\}$ אפשרית: $1;\ 1,\frac12;\ 1,\frac12,\frac13;\dots$ (שאלה Q-2.9-sets).
      - kind: result
        text: '(א) $L$ גבול חלקי. (ב) קבוצה כזו חייבת להכיל גם את 0.'

  - id: W-2.9-10
    level: exam
    qualitative: true
    objectives: [OBJ-2.9-3]
    prompt: >-
      (א) הוכיחו: אם $(a_n)$ חסומה, אז לכל $\varepsilon>0$ יש מקומות $m\ne n$ עם $|a_m-a_n|<\varepsilon$.

      (ב) הפריכו את (א) בלי ההנחה שהסדרה חסומה.

      (ג) הסיקו שאין סדרה $(x_n)$ שכל איבריה בקטע $[0,1]$ ו-$|x_m-x_n|\ge\frac1{1000}$ לכל $m\ne n$.
    answer: '(א) תת-סדרה מתכנסת: שני איברים מאוחרים שלה קרובים. (ב) $a_n=n$. (ג) מקרה פרטי של (א).'
    solution:
      - kind: idea
        text: >-
          לפי בולצאנו-ויירשטראס יש תת-סדרה מתכנסת, ואיבריה המאוחרים כולם קרובים לגבול, ולכן זה לזה.
      - kind: step
        text: >-
          (א) לפי משפט 2.9.8 יש $a_{n_k}\to L$. יהי $\varepsilon>0$, ויהי $K$ שמתאים ל-$\frac\varepsilon2$: $|a_{n_k}-L|<\frac\varepsilon2$
          לכל $k>K$. ניקח $m=n_{K+1}$ ו-$n=n_{K+2}$; הם שונים כי $n_{K+1}<n_{K+2}$.
      - kind: computation
        text: '$|a_m-a_n|\le|a_m-L|+|L-a_n|<\frac\varepsilon2+\frac\varepsilon2=\varepsilon$ (אי-שוויון המשולש).'
      - kind: step
        text: '(ב) $a_n=n$: לכל $m\ne n$, $|a_m-a_n|=|m-n|\ge1$ (שלמים שונים), ולכן עם $\varepsilon=1$ אין זוג כזה.'
      - kind: step
        text: >-
          (ג) סדרה כזו חסומה ($0\le x_n\le1$), ולפי (א) עם $\varepsilon=\frac1{1000}$ יש $m\ne n$ עם
          $|x_m-x_n|<\frac1{1000}$, בסתירה להנחה.
      - kind: check
        text: >-
          במבט כמותי: בקטע $[0,1]$ אפשר לשים לכל היותר $1001$ נקודות במרחקים של לפחות $\frac1{1000}$ זו מזו
          ($0,\frac1{1000},\dots,1$), ואי אפשר אינסוף. זו פתיחת השיעור: אינסוף נקודות בקטע חסום חייבות להצטופף.
      - kind: result
        text: '(א) הוכח בעזרת בולצאנו-ויירשטראס. (ב) $a_n=n$. (ג) אין סדרה כזו.'

challenge:
  - id: W-2.9-c1
    stars: 1
    objectives: [OBJ-2.9-3]
    prompt: >-
      בכל הסעיפים $(x_n)$ סדרה כלשהי, שאינה מתכנסת בהכרח, ובלבד שהביטוי מוגדר לכל $n$. השתמשו במשפט
      בולצאנו-ויירשטראס.

      (א) יהי $p(x)=c_0x^d+c_1x^{d-1}+\dots+c_d$ פולינום עם מקדמים ממשיים. הוכיחו שלסדרה $p(\sin x_n)$ יש תת-סדרה
      מתכנסת. (השתמשו בעובדה מבית הספר $|\sin x|\le1$, מוכח בשיעור 3.2.)

      (ב) הוכיחו שלסדרה $\frac{x_n^2+5}{1+2x_n+x_n^2}$ לא תמיד יש תת-סדרה מתכנסת: מצאו דוגמה נגדית והוכיחו אותה.
    answer: '(א) בולצאנו-ויירשטראס על $\sin x_n$ ומסקנה 2.4.5. (ב) $x_n=-1+\frac1n$: האיברים גדולים מ-$5n^2$.'
    solution:
      - kind: idea
        text: >-
          (א) $\sin x_n$ חסומה, ולכן יש לה תת-סדרה מתכנסת; פולינום של סדרה מתכנסת מתכנס (מסקנה 2.4.5), ואין צורך
          ברציפות. (ב) המכנה הוא $(1+x_n)^2$, ואם $x_n$ מתקרבת ל-$-1$ הביטוי בורח לאינסוף.
      - kind: step
        text: >-
          (א) $y_n=\sin x_n$ מקיימת $|y_n|\le1$, ולכן חסומה. לפי משפט 2.9.8 יש $y_{n_k}\to y$. לפי מסקנה 2.4.5
          (שיעור 2.4), $p(y_{n_k})\to p(y)$. לכן $p(\sin x_{n_k})$ היא תת-סדרה מתכנסת של $p(\sin x_n)$.
      - kind: step
        text: >-
          (ב) $1+2x+x^2=(1+x)^2$. נבחר $x_n=-1+\frac1n$; אז $(1+x_n)^2=\frac1{n^2}\ne0$, והביטוי מוגדר. המונה $x_n^2+5\ge5$,
          ולכן $y_n=\frac{x_n^2+5}{(1+x_n)^2}\ge5n^2$.
      - kind: step
        text: >-
          תהי $(y_{n_k})$ תת-סדרה. לפי למה 2.9.2 (א), $y_{n_k}\ge5n_k^2\ge5k^2\ge k$, ולכן היא אינה חסומה מלעיל
          (תכונת ארכימדס), ולפי משפט 2.3.3 אינה מתכנסת.
      - kind: check
        text: >-
          $n=1$: $x_1=0$, $y_1=5$. $n=10$: $x_{10}=-0.9$, $y_{10}=\frac{0.81+5}{0.01}=581\ge500$. בולצאנו-ויירשטראס
          לא חל כאן כי $(y_n)$ אינה חסומה.
      - kind: result
        text: '(א) יש תת-סדרה מתכנסת. (ב) עם $x_n=-1+\frac1n$ אין לסדרה אף תת-סדרה מתכנסת.'
    source:
      name: 'MIT OpenCourseWare 18.100A Introduction to Analysis (Fall 2012), Assignment 5'
      year: 2012
      problem: 'Problem 2'
      url: 'https://live.ocw.mit.edu/courses/18-100a-introduction-to-analysis-fall-2012/c2e661f9954f1170d9ab814c1dfb80ee_MIT18_100AF12_Assign_5.pdf'
      verified: '2026-11-17'
      adapted: true

  - id: W-2.9-c2
    stars: 1
    objectives: [OBJ-2.9-1, OBJ-2.9-3]
    prompt: >-
      (א) תהי $(x_n)$ סדרה כך שלכל תת-סדרה $(x_{n_k})$ שלה יש תת-סדרה $(x_{n_{k_j}})$ ששואפת ל-$x$. הוכיחו ש-$x_n\to x$.
      (שימו לב: לא מניחים שהסדרה חסומה.)

      (ב) הראו שהתנאי החלש יותר "כל תת-סדרה **מתכנסת** של $(x_n)$ שואפת ל-$x$" אינו מספיק כדי להסיק ש-$x_n\to x$,
      ושהוא כן מספיק כשהסדרה חסומה.
    answer: '(א) בדרך השלילה: תת-סדרה שנשארת במרחק $\varepsilon$ מ-$x$. (ב) $n$ במקומות האי-זוגיים ו-0 בזוגיים; עם חסימות, מסקנה 2.9.10.'
    solution:
      - kind: idea
        text: >-
          אם $x_n$ אינה שואפת ל-$x$, אינסוף איברים נשארים רחוקים מ-$x$. מהם בונים תת-סדרה, וכל תת-סדרה שלה רחוקה מ-$x$,
          ולכן אינה יכולה לשאוף ל-$x$.
      - kind: step
        text: >-
          (א) נניח ש-$x_n$ אינה שואפת ל-$x$. לפי מסקנה 2.2.9 יש $\varepsilon>0$ כך ש-$S=\{n:\ |x_n-x|\ge\varepsilon\}$
          אינה סופית, ולפי למה 2.9.2 (ג) יש תת-סדרה $(x_{n_k})$ עם $|x_{n_k}-x|\ge\varepsilon$ לכל $k$.
      - kind: step
        text: >-
          לפי ההנחה יש $x_{n_{k_j}}\to x$. אבל $|x_{n_{k_j}}-x|\ge\varepsilon$ לכל $j$, ולפי טענה 2.3.6 ומסקנה 2.5.2,
          $0=|x-x|\ge\varepsilon$. סתירה. לא השתמשנו בבולצאנו-ויירשטראס, ולכן אין צורך בחסימות.
      - kind: step
        text: >-
          (ב) $x_n=n$ כש-$n$ אי-זוגי ו-$x_n=0$ כש-$n$ זוגי, עם $x=0$. כל תת-סדרה מתכנסת שואפת ל-0 (הגבול החלקי היחיד
          הוא 0, שיעור 2.9 אחרי מסקנה 2.9.6), אבל הסדרה מתבדרת. בתנאי של (א) זה נופל: לתת-סדרה $x_{2k-1}=2k-1$ אין
          תת-סדרה מתכנסת.
      - kind: step
        text: >-
          כשהסדרה חסומה: כל תת-סדרה $(x_{n_k})$ חסומה, ולפי משפט 2.9.8 יש לה תת-סדרה מתכנסת, שהיא תת-סדרה מתכנסת
          של $(x_n)$ (למה 2.9.2 (ב)) ולכן שואפת ל-$x$. זה התנאי של (א), ולכן $x_n\to x$.
      - kind: result
        text: '(א) $x_n\to x$. (ב) בלי חסימות התנאי החלש אינו מספיק; עם חסימות הוא מספיק.'
    source:
      name: 'Jiří Lebl, Basic Analysis I: Introduction to Real Analysis (HTML edition, Section 2.3)'
      year: 2026
      problem: 'Exercise 2.3.11'
      url: 'https://www.jirka.org/ra/html/sec_bw.html'
      verified: '2026-11-17'
      adapted: true
