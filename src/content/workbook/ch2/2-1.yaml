# Workbook of lesson 2.1 — sequences: boundedness and monotonicity.
# Objectives (src/course.ts):
#   OBJ-2.1-1  a sequence as a function on ℕ, given by a formula, a recursion or in words
#   OBJ-2.1-2  prove that a sequence is bounded or unbounded, monotone or not
#   OBJ-2.1-3  draw the terms on a line and as a graph, and read a conjecture off the drawing
# No limits: the definition of a limit is lesson 2.2. Every number below was recomputed by a command.
lesson: '2.1'
practice:
  - id: W-2.1-01
    level: basic
    qualitative: true
    objectives: [OBJ-2.1-1]
    prompt: >-
      לכל אחד מהכללים הבאים, הוכיחו או הפריכו שהוא מגדיר סדרה $(a_n)_{n=1}^{\infty}$ של מספרים ממשיים.

      (א) $a_n=\frac{1}{n-3}$.

      (ב) $a_n$ הוא השלם הגדול ביותר $m$ שמקיים $m^2\le n$.

      (ג) $a_1=1$ ו-$a_{n+1}=\sqrt{a_n-2}$.

      (ד) $a_n$ הוא מספר ממשי כלשהו בין $n$ ל-$n+1$.
    answer: >-
      רק (ב) מגדיר סדרה ($a_n=\lfloor\sqrt n\rfloor$). ב-(א) ו-(ג) אין ערך במקום אחד ($a_3$, $a_2$), וב-(ד) אין ערך
      אחד.
    solution:
      - kind: definition
        text: >-
          סדרה היא פונקציה $a:\mathbb{N}\to\mathbb{R}$ (הגדרה 2.1.1): הכלל צריך לקבוע **לכל** $n\in\mathbb{N}$ מספר
          ממשי **אחד**. כדי להפריך מספיק מקום אחד שבו אין ערך, או שבו הכלל לא בוחר ערך אחד.
      - kind: step
        text: >-
          (א) לא. עבור $n=3$ המכנה $3-3=0$, ו-$\frac10$ אינו מוגדר. הכלל מגדיר סדרה רק אם מתחילים מ-$n=4$, וזו
          כבר סדרה אחרת: $b_n=\frac1{n}$ עבור $b_n=a_{n+3}$.
      - kind: step
        text: >-
          (ב) כן. לפי טענה 1.6.6 (ג), $m\le\sqrt n$ אם ורק אם $m\le\lfloor\sqrt n\rfloor$, ולשלם $m\ge0$ התנאי
          $m^2\le n$ שקול ל-$m\le\sqrt n$ (טענה 1.7.5 (ג)). שלם שלילי אינו הגדול ביותר, כי גם $m=1$ מקיים
          $1^2\le n$. לכן השלם הגדול ביותר כזה הוא בדיוק
          $\lfloor\sqrt n\rfloor$, מספר אחד ויחיד לכל $n$: $1,1,1,2,2,2,2,2,3,\dots$
      - kind: computation
        text: >-
          (ג) לא. $a_2=\sqrt{1-2}=\sqrt{-1}$, ואין שורש ממשי למספר שלילי (ריבוע של ממשי אינו שלילי, טענה 1.2.5).
          הכלל נתקע כבר בצעד הראשון; טענה 2.1.3 לא חלה, כי אין קבוצה $A$ שמכילה את $1$ וש-$\sqrt{x-2}$ מעבירה
          אותה לתוך עצמה.
      - kind: step
        text: >-
          (ד) לא. לכל $n$ יש אינסוף מספרים בין $n$ ל-$n+1$ (למשל $n+\frac1k$ לכל $k\ge2$), והכלל לא בוחר אחד מהם.
          פונקציה צריכה ערך **אחד** בכל מקום. (הכלל "$a_n=n+\frac12$" כן מגדיר סדרה.)
      - kind: result
        text: 'רק (ב) מגדיר סדרה: $a_n=\lfloor\sqrt n\rfloor$.'

  - id: W-2.1-02
    level: basic
    objectives: [OBJ-2.1-1, OBJ-2.1-3]
    prompt: >-
      $a_1=2$ ו-$a_{n+1}=3a_n-2$ לכל $n\in\mathbb{N}$.

      (א) חשבו את $a_2,\dots,a_5$, סמנו אותם על ישר המספרים ונחשו נוסחה מפורשת ל-$a_n$.

      (ב) הוכיחו את הנוסחה באינדוקציה, והסיקו שהסדרה עולה ממש ואינה חסומה מלעיל.
    answer: '$a_n=3^{n-1}+1$; עולה ממש ואינה חסומה מלעיל.'
    solution:
      - kind: computation
        text: >-
          (א) $a_2=3\cdot2-2=4$, $a_3=10$, $a_4=28$, $a_5=82$. על הישר המרחקים בין הנקודות גדלים פי 3:
          $2,6,18,54$. אחרי הפחתת 1 מקבלים $1,3,9,27,81$, חזקות של 3. ההשערה: $a_n=3^{n-1}+1$.
      - kind: step
        text: >-
          (ב) בסיס: $3^0+1=2=a_1$. צעד: אם $a_n=3^{n-1}+1$, אז
          $a_{n+1}=3(3^{n-1}+1)-2=3^n+1=3^{(n+1)-1}+1$. לפי מסקנה 0.5.2 הנוסחה נכונה לכל $n$.
      - kind: step
        text: >-
          עלייה ממש: $a_{n+1}-a_n=3^n-3^{n-1}=2\cdot3^{n-1}>0$ (מסקנה 0.5.7 (ג)), ולפי טענה 2.1.9 (א) הסדרה עולה
          ממש.
      - kind: step
        text: >-
          אינה חסומה מלעיל: לפי אי-שוויון ברנולי (משפט 0.6.6 עם $x=2$), $3^{n-1}=(1+2)^{n-1}\ge1+2(n-1)\ge n$ לכל
          $n\ge2$, וגם $3^0=1=n$ עבור $n=1$. לכן $a_n>n$ לכל $n$. יהי $M$; לפי תכונת ארכימדס יש $n>M$, ואז
          $a_n>n>M$. לפי טענה 2.1.6 הסדרה אינה חסומה מלעיל.
      - kind: check
        text: >-
          $a_5=3^4+1=82$, כמו בחישוב הישיר. הנוסחה שהתאימה לחמשת האיברים הייתה השערה; האינדוקציה היא שהופכת אותה
          לנכונה לכל $n$.
      - kind: result
        text: '$a_n=3^{n-1}+1$. הסדרה עולה ממש ואינה חסומה מלעיל (וחסומה מלרע על ידי $a_1=2$).'

  - id: W-2.1-03
    level: basic
    objectives: [OBJ-2.1-2]
    prompt: >-
      נגדיר $a_n=\frac{2n-1}{n+3}$. הוכיחו שהסדרה עולה ממש וחסומה, ומצאו חסם מלרע וחסם מלעיל.
    answer: 'עולה ממש, ו-$\frac14\le a_n<2$ לכל $n$.'
    solution:
      - kind: idea
        text: >-
          מחלקים עם שארית: $2n-1=2(n+3)-7$, ולכן $a_n=2-\frac7{n+3}$. כש-$n$ גדל, $\frac7{n+3}$ קטן, ולכן $a_n$ גדל;
          והחסר מ-2 חיובי.
      - kind: computation
        text: '$a_n=\frac{2(n+3)-7}{n+3}=2-\frac{7}{n+3}$.'
      - kind: step
        text: >-
          לכל $n$: $0<n+3<n+4$, ולפי טענה 1.2.7 (ב) $\frac1{n+4}<\frac1{n+3}$; כפל ב-$7>0$ ו-(ס3) נותנים
          $a_{n+1}=2-\frac7{n+4}>2-\frac7{n+3}=a_n$. הסדרה עולה ממש.
      - kind: step
        text: >-
          חסמים: $\frac7{n+3}>0$, ולכן $a_n<2$. ולפי טענה 2.1.10 (א), $a_n\ge a_1=\frac14$.
      - kind: check
        text: '$a_1=\frac14$, $a_2=\frac35$, $a_3=\frac56$; ההפרשים $\frac{7}{20}$ ו-$\frac{7}{30}$ חיוביים.'
      - kind: result
        text: 'הסדרה עולה ממש ו-$\frac14\le a_n<2$.'

  - id: W-2.1-04
    level: mid
    qualitative: true
    objectives: [OBJ-2.1-2]
    prompt: >-
      תהי $(a_n)$ סדרה חסומה ותהי $(b_n)$ סדרה שאינה חסומה. הוכיחו או הפריכו:

      (א) $(a_n+b_n)$ אינה חסומה.

      (ב) $(a_nb_n)$ אינה חסומה.

      (ג) לכל סדרה $(c_n)$: אם $(c_n^2)$ חסומה, אז $(c_n)$ חסומה.
    answer: '(א) נכון. (ב) לא נכון: $a_n=\frac1n$, $b_n=n$. (ג) נכון.'
    solution:
      - kind: idea
        text: >-
          (א) בהוכחה בשלילה: אם הסכום חסום, אז $b_n=(a_n+b_n)-a_n$ הוא סכום של שתי סדרות חסומות. (ב) גורם חסום יכול
          להיות קטן מאוד בדיוק במקומות שבהם השני גדול. (ג) שורש של חסם.
      - kind: step
        text: >-
          (א) נכון. נניח בשלילה ש-$(a_n+b_n)$ חסומה. גם $(-a_n)$ חסומה (טענה 2.1.5 (ג) עם $c=-1$), ולכן לפי טענה
          2.1.5 (ג) הסכום $(a_n+b_n)+(-a_n)=b_n$ חסום, בסתירה להנחה.
      - kind: step
        text: >-
          (ב) לא נכון. $a_n=\frac1n$ חסומה ($0<\frac1n\le1$), ו-$b_n=n$ אינה חסומה (טענה 2.1.6). אבל $a_nb_n=1$ לכל
          $n$, סדרה קבועה וחסומה.
      - kind: step
        text: >-
          (ג) נכון. לפי טענה 2.1.5 (א) יש $M\ge0$ עם $c_n^2=|c_n^2|\le M$ לכל $n$. לפי טענה 1.2.12 (ה),
          $|c_n|^2=c_n^2\le M=(\sqrt M)^2$, ושני המספרים $|c_n|$ ו-$\sqrt M$ אי-שליליים, ולכן לפי טענה 1.2.8 (ג)
          $|c_n|\le\sqrt M$. לפי טענה 2.1.5 (א) $(c_n)$ חסומה.
      - kind: check
        text: >-
          ב-(ב) המכפלה יכולה גם לא להיות חסומה: $a_n=1$, $b_n=n$. לכן "הפריכו" כאן פירושו רק שהטענה אינה נכונה
          תמיד.
      - kind: result
        text: '(א) נכון; (ב) לא נכון ($\frac1n\cdot n=1$); (ג) נכון, עם החסם $\sqrt M$.'

  - id: W-2.1-05
    level: mid
    objectives: [OBJ-2.1-2, OBJ-2.1-3]
    prompt: >-
      נגדיר $a_n=\frac{3^n}{n!}$.

      (א) חשבו את $a_1,\dots,a_4$ ושרטטו אותם כנקודות $(n,a_n)$. מה ההשערה?

      (ב) הוכיחו שהסדרה יורדת החל מ-$n=2$ ויורדת ממש החל מ-$n=3$, ושהיא אינה מונוטונית.

      (ג) הוכיחו שהסדרה חסומה, ומצאו את האיבר הגדול ביותר.
    answer: >-
      $a_1=3$, $a_2=a_3=\frac92$, $a_4=\frac{27}8$. $\frac{a_{n+1}}{a_n}=\frac3{n+1}$; הסדרה אינה מונוטונית,
      יורדת מ-2, ו-$0<a_n\le\frac92$.
    solution:
      - kind: computation
        text: >-
          (א) $a_1=3$, $a_2=\frac92$, $a_3=\frac{27}6=\frac92$, $a_4=\frac{81}{24}=\frac{27}8=3.375$. הנקודות עולות,
          נשארות באותו גובה, ויורדות. ההשערה: מ-$n=2$ הסדרה יורדת, וכל איבריה לכל היותר $\frac92$.
      - kind: computation
        text: >-
          כל האיברים חיוביים (מסקנה 0.5.7 (ג), ו-$n!>0$). לכל $n$:
          $\frac{a_{n+1}}{a_n}=\frac{3^{n+1}}{(n+1)!}\cdot\frac{n!}{3^n}=\frac3{n+1}$.
      - kind: step
        text: >-
          (ב) עבור $n\ge2$: $n+1\ge3$, ולכן $\frac3{n+1}\le1$; עבור $n\ge3$: $n+1\ge4$, ולכן $\frac3{n+1}<1$. לפי
          טענה 2.1.9 (ב) (החל מ-$n_0$), הסדרה יורדת החל מ-2 ויורדת ממש החל מ-3. היא אינה מונוטונית: $a_1=3<\frac92=a_2$
          (לכן אינה יורדת) ו-$a_3=\frac92>\frac{27}8=a_4$ (לכן אינה עולה).
      - kind: step
        text: >-
          (ג) $a_1<a_2$, ולפי טענה 2.1.8 (ג), החל מ-2, $a_n\le a_2$ לכל $n\ge2$. לכן $0<a_n\le\frac92$ לכל $n$,
          והאיבר הגדול ביותר הוא $\frac92=a_2=a_3$.
      - kind: check
        text: '$a_5=\frac{243}{120}=2.025<a_4$, כמו שמבחן המנה אומר ($\frac35<1$).'
      - kind: result
        text: >-
          הסדרה אינה מונוטונית, יורדת החל מ-2 ויורדת ממש החל מ-3; $0<a_n\le\frac92$, והמקסימום מתקבל פעמיים, ב-$a_2$
          וב-$a_3$.

  - id: W-2.1-06
    level: mid
    objectives: [OBJ-2.1-2]
    prompt: >-
      נגדיר $a_n=n-5\sqrt n$. הוכיחו שהסדרה חסומה מלרע ואינה חסומה מלעיל.
    answer: '$a_n\ge-\frac{25}4$ לכל $n$; לכל $M>0$ המקום $n=\max(36,\lfloor M^2\rfloor+1)$ נותן $a_n>M$.'
    solution:
      - kind: idea
        text: >-
          נסמן $x=\sqrt n$. אז $a_n=x^2-5x$, ריבוע שלם פחות קבוע נותן את החסם מלרע. כש-$\sqrt n\ge6$, הגורם
          $\sqrt n-5$ הוא לפחות 1, ולכן $a_n=\sqrt n(\sqrt n-5)\ge\sqrt n$, ואת $\sqrt n$ קל להעביר מעל כל $M$.
      - kind: computation
        text: >-
          חסם מלרע: $a_n=(\sqrt n)^2-5\sqrt n=\left(\sqrt n-\frac52\right)^2-\frac{25}4\ge-\frac{25}4$, כי ריבוע אינו
          שלילי (טענה 1.2.5).
      - kind: step
        text: >-
          אינה חסומה מלעיל: יהי $M\in\mathbb{R}$, ונגדיר $M'=\max(M,1)>0$. נבחר $n=\max(36,\ \lfloor M'^2\rfloor+1)$.
          אז $n\ge36$, ולפי טענה 1.7.5 (ג) $\sqrt n\ge6$, כלומר $\sqrt n-5\ge1$. וגם $n>M'^2$ (טענה 1.6.6 (ב)), ולכן
          $\sqrt n>M'\ge M$ (טענה 1.7.5 (ג) ו-(א)).
      - kind: step
        text: >-
          לכן $a_n=\sqrt n\,(\sqrt n-5)\ge\sqrt n\cdot1>M$ (כפל של $\sqrt n-5\ge1$ ב-$\sqrt n>0$). לפי טענה 2.1.6
          הסדרה אינה חסומה מלעיל.
      - kind: check
        text: >-
          $a_1=-4$, $a_4=-6$, $a_6\approx-6.247$, $a_9=-6$, $a_{25}=0$, $a_{36}=6$. האיבר הקטן ביותר הוא $a_6$, מעל
          $-\frac{25}4=-6.25$, כמו שהחסם אומר: המינימום של $x^2-5x$ הוא ב-$x=2.5$, ו-$\sqrt6\approx2.449$ הכי קרוב
          אליו. עבור $M=10$: $n=\max(36,101)=101$ ו-$a_{101}\approx50.75>10$.
      - kind: result
        text: 'חסומה מלרע על ידי $-\frac{25}4$, ואינה חסומה מלעיל.'

  - id: W-2.1-07
    level: mid
    qualitative: true
    objectives: [OBJ-2.1-3]
    prompt: >-
      בגרף של סדרה, 20 הנקודות הראשונות $(n,a_n)$ נמצאות כולן בין הישרים $y=0$ ו-$y=1$, וכל נקודה גבוהה מקודמתה.
      לכל אחת מההשערות הבאות, הפריכו אותה בסדרה שנותנת בדיוק תמונה כזו ב-20 המקומות הראשונים:

      (א) הסדרה חסומה.

      (ב) הסדרה עולה.

      (ג) כל איברי הסדרה בין $0$ ל-$1$.
    answer: >-
      (א), (ג) $a_n=\frac{n^2}{1000}$. (ב) $a_n=\frac{n(41-n)}{1000}$. גרף של מספר סופי של איברים נותן השערה בלבד.
    solution:
      - kind: idea
        text: >-
          מחפשים נוסחאות שמתנהגות "יפה" עד $n=20$ ומשנות התנהגות אחר כך: מקדם קטן שמעכב את הגדילה, או פרבולה שהקודקוד
          שלה אחרי 20.
      - kind: step
        text: >-
          (א) ו-(ג): $a_n=\frac{n^2}{1000}$. לכל $n\le20$, $0<a_n\le\frac{400}{1000}=0.4<1$, והיא עולה ממש
          ($a_{n+1}-a_n=\frac{2n+1}{1000}>0$). אבל $a_{32}=1.024>1$, מה שמפריך את (ג); ולכל $M>0$ יש $n>\sqrt{1000M}$
          עם $a_n>M$ (תכונת ארכימדס ושורשים; עבור $M\le0$ כל איבר עובר אותו), ולכן אינה חסומה, מה שמפריך את (א).
      - kind: step
        text: >-
          (ב): $a_n=\frac{n(41-n)}{1000}$. $a_{n+1}-a_n=\frac{(n+1)(40-n)-n(41-n)}{1000}=\frac{40-2n}{1000}$, חיובי לכל
          $n\le19$: הנקודות 1 עד 20 עולות. כל איבריה עד $n=20$ בין $0$ ל-$1$: $0<a_n\le a_{20}=0.42$. אבל
          $a_{21}=0.42=a_{20}$ ו-$a_{22}=0.418<a_{21}$, ולכן אינה עולה.
      - kind: check
        text: '$a_{20}=\frac{20\cdot21}{1000}=0.42$, $a_{21}=\frac{21\cdot20}{1000}=0.42$, $a_{22}=\frac{22\cdot19}{1000}=0.418$.'
      - kind: result
        text: >-
          שלוש ההשערות סבירות לפי הגרף, ושלושן לא נובעות ממנו. גרף הוא כלי לניחוש; כל טענה על כל האיברים צריכה הוכחה.

  - id: W-2.1-08
    level: exam
    objectives: [OBJ-2.1-1, OBJ-2.1-2]
    prompt: >-
      נתון הכלל $a_{n+1}=2-\frac1{a_n}$.

      (א) הראו שעם $a_1=\frac12$ הכלל אינו מגדיר סדרה.

      (ב) הוכיחו שעם $a_1=3$ הכלל מגדיר סדרה אחת ויחידה, וכל איבריה גדולים מ-1.

      (ג) הוכיחו שעם $a_1=3$ הסדרה יורדת ממש, ושהיא חסומה.

      (ד) נחשו נוסחה מפורשת ל-$a_n$ והוכיחו אותה.
    answer: >-
      (א) $a_2=0$ ו-$a_3$ אינו מוגדר. (ב) טענה 2.1.3 עם $A=(1,\infty)$. (ג) $a_{n+1}-a_n=-\frac{(a_n-1)^2}{a_n}<0$,
      ו-$1<a_n\le3$. (ד) $a_n=\frac{2n+1}{2n-1}$.
    solution:
      - kind: computation
        text: '(א) $a_2=2-\frac{1}{1/2}=0$, ו-$a_3=2-\frac10$ אינו מוגדר. אין סדרה כזו.'
      - kind: step
        text: >-
          (ב) נסמן $A=(1,\infty)$ ו-$f(n,x)=2-\frac1x$. אם $x>1$, אז $0<\frac1x<1$ (טענה 1.2.7), ולכן
          $1<2-\frac1x<2$; בפרט $f(n,x)\in A$. לכן $f:\mathbb{N}\times A\to A$ ו-$3\in A$, ולפי טענה 2.1.3 יש סדרה
          אחת ויחידה, וכל איבריה ב-$A$, כלומר גדולים מ-1.
      - kind: computation
        text: >-
          (ג) לכל $n$: $a_{n+1}-a_n=2-\frac1{a_n}-a_n=\frac{2a_n-1-a_n^2}{a_n}=-\frac{(a_n-1)^2}{a_n}$.
      - kind: step
        text: >-
          לפי (ב) $a_n>1$, ולכן $(a_n-1)^2>0$ ו-$a_n>0$; ההפרש שלילי, ולפי טענה 2.1.9 (א) הסדרה יורדת ממש. לפי
          טענה 2.1.10 (ב) $a_n\le a_1=3$, ולפי (ב) $a_n>1$: $1<a_n\le3$, והסדרה חסומה.
      - kind: computation
        text: >-
          (ד) $a_1=3=\frac31$, $a_2=\frac53$, $a_3=2-\frac35=\frac75$, $a_4=2-\frac57=\frac97$. ההשערה:
          $a_n=\frac{2n+1}{2n-1}$. בסיס: $\frac31=3$. צעד: אם $a_n=\frac{2n+1}{2n-1}$, אז
          $a_{n+1}=2-\frac{2n-1}{2n+1}=\frac{4n+2-2n+1}{2n+1}=\frac{2n+3}{2n+1}=\frac{2(n+1)+1}{2(n+1)-1}$.
      - kind: check
        text: >-
          מהנוסחה: $a_n=1+\frac2{2n-1}$, ומכאן שוב $a_n>1$ ושהסדרה יורדת ממש, כי $\frac2{2n-1}$ יורד ממש. שתי
          ההוכחות של (ג) מסכימות.
      - kind: result
        text: >-
          עם $a_1=\frac12$ אין סדרה; עם $a_1=3$ יש אחת, $a_n=\frac{2n+1}{2n-1}$, יורדת ממש ו-$1<a_n\le3$.

  - id: W-2.1-09
    level: exam
    qualitative: true
    objectives: [OBJ-2.1-2]
    prompt: >-
      הוכיחו או הפריכו:

      (א) אם $(a_n)$ ו-$(b_n)$ עולות, אז $c_n=\max(a_n,b_n)$ עולה.

      (ב) אם $(a_n)$ עולה ממש וכל איבריה שלמים, אז היא אינה חסומה מלעיל.

      (ג) אם $(a_n)$ עולה ממש וכל איבריה רציונליים, אז היא אינה חסומה מלעיל.
    answer: '(א) נכון. (ב) נכון: $a_n\ge a_1+n-1$. (ג) לא נכון: $\frac n{n+1}$.'
    solution:
      - kind: idea
        text: >-
          (א) המקסימום בצעד הבא גדול מכל אחד מהשניים בצעד הבא, ולכן מכל אחד מהשניים עכשיו. (ב) בין שני שלמים שונים
          יש הפרש של לפחות 1, ולכן עלייה ממש בשלמים היא עלייה של לפחות 1 בכל צעד. (ג) ברציונליים אין "צעד מינימלי".
      - kind: step
        text: >-
          (א) נכון. יהי $n$. לפי הגדרה 1.2.11, $c_{n+1}\ge a_{n+1}$ ו-$c_{n+1}\ge b_{n+1}$. לכן
          $c_{n+1}\ge a_{n+1}\ge a_n$ ו-$c_{n+1}\ge b_{n+1}\ge b_n$, ו-$c_{n+1}$ גדול או שווה לשני המספרים
          $a_n,b_n$, ובפרט למקסימום שלהם $c_n$ (שהוא אחד מהם).
      - kind: step
        text: >-
          (ב) נכון. לכל $n$, $a_{n+1}>a_n$ ושניהם שלמים, ולכן $a_{n+1}-a_n$ שלם חיובי, כלומר לפחות 1 (טענה 1.3.8). באינדוקציה
          $a_n\ge a_1+(n-1)$: הבסיס שוויון, ואם $a_n\ge a_1+n-1$ אז $a_{n+1}\ge a_n+1\ge a_1+n$. יהי $M$; לפי
          תכונת ארכימדס יש $n\in\mathbb{N}$ עם $n>M-a_1+1$, ואז $a_n\ge a_1+n-1>M$. לפי טענה 2.1.6 אינה חסומה
          מלעיל.
      - kind: step
        text: >-
          (ג) לא נכון. $a_n=\frac n{n+1}$ רציונלית לכל $n$ (מנה של שלמים), עולה ממש וחסומה מלעיל על ידי 1 (דוגמה 1
          בשיעור).
      - kind: check
        text: >-
          ב-(א) גם המינימום של שתי סדרות עולות עולה, באותה הוכחה עם אי-השוויונות ההפוכים: $c_n=\min(a_n,b_n)\le a_n\le
          a_{n+1}$ ו-$c_n\le b_{n+1}$. ב-(ב) ההנחה "ממש" נחוצה: הסדרה הקבועה $0$ עולה, שלמה וחסומה.
      - kind: result
        text: '(א) נכון; (ב) נכון; (ג) לא נכון.'

  - id: W-2.1-10
    level: exam
    objectives: [OBJ-2.1-2, OBJ-2.1-3]
    prompt: >-
      נגדיר $a_n=\frac{n!}{n^n}$.

      (א) חשבו את $a_1,\dots,a_4$ ושרטטו אותם על ישר המספרים. מה ההשערה?

      (ב) הוכיחו שהסדרה יורדת ממש ושמתקיים $0<a_n\le1$ לכל $n$.

      (ג) הוכיחו ש-$a_n\le\frac2n$ לכל $n\ge2$.
    answer: >-
      $1,\frac12,\frac29,\frac3{32}$; $\frac{a_{n+1}}{a_n}=\left(\frac n{n+1}\right)^n<1$, ולכן יורדת ממש ו-$0<a_n\le a_1=1$;
      ו-$a_n\le\frac2{n^2}\le\frac2n$.
    solution:
      - kind: computation
        text: >-
          (א) $a_1=1$, $a_2=\frac24=\frac12$, $a_3=\frac6{27}=\frac29\approx0.222$, $a_4=\frac{24}{256}=\frac3{32}\approx0.094$.
          על הישר הנקודות זזות שמאלה ונדחסות ליד 0. ההשערה: הסדרה יורדת, וכל איבריה בין 0 ל-1.
      - kind: computation
        text: >-
          (ב) כל האיברים חיוביים. לכל $n$:
          $\frac{a_{n+1}}{a_n}=\frac{(n+1)!}{(n+1)^{n+1}}\cdot\frac{n^n}{n!}=\frac{(n+1)\,n^n}{(n+1)^{n+1}}=\frac{n^n}{(n+1)^n}=\left(\frac n{n+1}\right)^n$.
      - kind: step
        text: >-
          $0\le\frac n{n+1}<1$, ולפי מסקנה 0.5.7 (ו) (עם $b=1$) $\left(\frac n{n+1}\right)^n<1^n=1$. לפי טענה 2.1.9 (ב)
          הסדרה יורדת ממש, ולפי טענה 2.1.10 (ב) $a_n\le a_1=1$. ו-$a_n>0$ כמנה של חיוביים.
      - kind: step
        text: >-
          (ג) עבור $n\ge2$ כותבים
          $a_n=\frac{1}{n}\cdot\frac{2}{n}\cdot\frac{3}{n}\cdots\frac{n}{n}$, מכפלה של $n$ גורמים חיוביים. כל גורם
          $\frac kn$ עם $3\le k\le n$ מקיים $0<\frac kn\le1$, וכפל של מספר חיובי בגורם כזה אינו מגדיל אותו (טענה 1.2.4 (ה)); גורם
          אחר גורם,
          $a_n\le\frac1n\cdot\frac2n=\frac2{n^2}\le\frac2n$.
      - kind: check
        text: >-
          $a_4=\frac3{32}\approx0.094$ ו-$\frac2{16}=0.125$, $\frac24=0.5$: שני החסמים מתקיימים. ב-$n=2$:
          $a_2=\frac12=\frac2{2^2}$, שוויון.
      - kind: result
        text: 'הסדרה יורדת ממש, $0<a_n\le1$, ו-$a_n\le\frac2{n^2}\le\frac2n$ לכל $n\ge2$.'

challenge:
  - id: W-2.1-c1
    stars: 1
    objectives: [OBJ-2.1-2]
    prompt: >-
      נגדיר $x_n=\frac{n}{n^2+16}$.

      (א) הוכיחו שהסדרה יורדת ממש החל מ-$n=4$ (כלומר הזנב $x_4,x_5,x_6,\dots$ יורד ממש), ושזה המקום הקטן ביותר
      שממנו היא יורדת.

      (ב) הוכיחו שהסדרה חסומה, ומצאו את האיבר הגדול ביותר שלה.
    answer: >-
      $x_{n+1}-x_n=\frac{16-n-n^2}{(n^2+16)((n+1)^2+16)}$: חיובי ל-$n\le3$ ושלילי ל-$n\ge4$. האיבר הגדול ביותר הוא
      $x_4=\frac18$, ו-$0<x_n\le\frac18$.
    solution:
      - kind: idea
        text: >-
          מבחן ההפרש: מחשבים את המונה של $x_{n+1}-x_n$ על מכנה משותף. המכנה חיובי, ולכן הסימן הוא הסימן של המונה,
          שהוא פולינום ריבועי פשוט ב-$n$.
      - kind: computation
        text: >-
          $x_{n+1}-x_n=\frac{(n+1)(n^2+16)-n\big((n+1)^2+16\big)}{(n^2+16)\big((n+1)^2+16\big)}$. המונה:
          $n^3+n^2+16n+16-(n^3+2n^2+17n)=16-n-n^2$.
      - kind: step
        text: >-
          (א) $n^2+n=n(n+1)$ עולה ממש עם $n$. עבור $n\ge4$: $n(n+1)\ge4\cdot5=20>16$, ולכן המונה שלילי ו-$x_{n+1}<x_n$.
          לפי טענה 2.1.9 (א) (החל מ-$n_0=4$) הסדרה יורדת ממש החל מ-4. עבור $n=3$: $3\cdot4=12<16$, ולכן
          $x_4>x_3$: מ-$n_0=3$ היא אינה יורדת, וגם לא מכל $n_0<3$ (הצעד מ-3 ל-4 עולה). לכן 4 הוא המקום הקטן ביותר.
      - kind: step
        text: >-
          (ב) עבור $n\le3$, $n(n+1)\le12<16$, ולכן $x_1<x_2<x_3<x_4$. לכן $x_n\le x_4$ לכל $n\le4$
          (שרשרת, טענה 1.2.3 (ד)) ולכל $n\ge4$ (ירידה מ-4, טענה 2.1.8 (ג)). כל האיברים חיוביים. לכן $0<x_n\le x_4=\frac4{32}=\frac18$.
      - kind: check
        text: >-
          $x_1\approx0.0588$, $x_2=0.1$, $x_3=0.12$, $x_4=0.125$, $x_5\approx0.1220$: בדיוק תמונה של עלייה עד 4 וירידה
          ממנו.
      - kind: result
        text: 'יורדת ממש החל מ-4 (ולא לפני), $0<x_n\le\frac18$, והאיבר הגדול ביותר הוא $x_4=\frac18$.'
    source:
      name: 'Jiří Lebl, Basic Analysis I: Introduction to Real Analysis, Volume I (version 6.3)'
      year: 2026
      problem: 'Section 2.1, Exercise 2.1.21'
      url: 'https://www.jirka.org/ra/realanal.pdf'
      verified: '2026-11-17'
      adapted: true

  - id: W-2.1-c2
    stars: 2
    objectives: [OBJ-2.1-2]
    prompt: >-
      יהיו $a_0=1$ ו-$(a_n)_{n=1}^{\infty}$ סדרה עולה עם $a_1\ge1$ (כך ש-$1=a_0\le a_1\le a_2\le\cdots$). נגדיר
      לכל $n\in\mathbb{N}$

      $$b_n=\sum_{k=1}^{n}\left(1-\frac{a_{k-1}}{a_k}\right)\frac{1}{\sqrt{a_k}} .$$

      הוכיחו ש-$(b_n)$ עולה ושמתקיים $0\le b_n<2$ לכל $n$.
    answer: >-
      כל מחובר אי-שלילי, ולכן $(b_n)$ עולה ו-$b_n\ge0$. עם $c_k=\sqrt{a_k}$ כל מחובר קטן או שווה ל-$2\left(\frac1{c_{k-1}}-\frac1{c_k}\right)$,
      ובסכום טלסקופי $b_n\le2\left(1-\frac1{c_n}\right)<2$.
    solution:
      - kind: idea
        text: >-
          המחובר ה-$k$-י כתוב בשורשים $x=c_{k-1}=\sqrt{a_{k-1}}$ ו-$y=c_k=\sqrt{a_k}$ הוא $\frac{(y-x)(y+x)}{y^3}$.
          חוסמים אותו בהפרש $2\left(\frac1x-\frac1y\right)$, וסכום של הפרשים כאלה מתקפל ל-$2\left(1-\frac1{c_n}\right)$.
      - kind: step
        text: >-
          כל $a_k\ge1>0$ (טענה 2.1.10 (א) ו-$a_1\ge1$), ולכן המחוברים מוגדרים. נסמן $c_k=\sqrt{a_k}$; אז $c_0=1$ ו-$1\le
          c_{k-1}\le c_k$ (טענה 1.7.5 (ג)).
      - kind: step
        text: >-
          עלייה ואי-שליליות: $a_{k-1}\le a_k$, ולכן $\frac{a_{k-1}}{a_k}\le1$ וכל מחובר אי-שלילי. לכן
          $b_{n+1}-b_n$, שהוא המחובר ה-$(n+1)$-י, אי-שלילי: $(b_n)$ עולה (טענה 2.1.9 (א)), ו-$b_n\ge b_1\ge0$.
      - kind: computation
        text: >-
          עם $x=c_{k-1}$, $y=c_k$: $\left(1-\frac{x^2}{y^2}\right)\frac1y=\frac{y^2-x^2}{y^3}=\frac{(y-x)(y+x)}{y^3}$, ו-$2\left(\frac1x-\frac1y\right)=\frac{2(y-x)}{xy}$.
      - kind: step
        text: >-
          הטענה $\frac{(y-x)(y+x)}{y^3}\le\frac{2(y-x)}{xy}$: אם $y=x$ שני האגפים $0$. אם $y>x$, מחלקים ב-$y-x>0$
          וכופלים ב-$xy^3>0$, ומקבלים את הטענה השקולה $x(y+x)\le2y^2$. והיא נכונה: $xy\le y^2$ ו-$x^2\le y^2$, כי
          $0<x\le y$ (טענה 1.2.8), ומחברים (טענה 1.2.3 (ג)).
      - kind: step
        text: >-
          סכום טלסקופי: באינדוקציה על $n$,
          $\sum_{k=1}^{n}\left(\frac1{c_{k-1}}-\frac1{c_k}\right)=\frac1{c_0}-\frac1{c_n}$ (עבור $n=1$ זו ההגדרה;
          המעבר מוסיף $\frac1{c_n}-\frac1{c_{n+1}}$). לכן, מחיבור אי-השוויונות של השלב הקודם,
          $b_n\le2\left(1-\frac1{c_n}\right)$.
      - kind: step
        text: '$c_n>0$, ולכן $\frac1{c_n}>0$ ו-$b_n\le2-\frac2{c_n}<2$.'
      - kind: check
        text: >-
          עם $a_k=4^k$: $c_k=2^k$, כל מחובר הוא $\frac34\cdot\frac1{2^k}$, ו-$b_n=\frac34\left(1-\frac1{2^n}\right)<\frac34$,
          בתוך $[0,2)$. ועם $a_k=1$ לכל $k$, $b_n=0$: החסם $0$ מתקבל.
      - kind: result
        text: '$(b_n)$ עולה ו-$0\le b_n<2$ לכל $n$.'
