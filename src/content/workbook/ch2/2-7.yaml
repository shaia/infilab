# Workbook of lesson 2.7 — monotone sequences and the number e.
# Objectives (src/course.ts):
#   OBJ-2.7-1  a monotone bounded sequence converges to its sup (or inf)
#   OBJ-2.7-2  recursive sequences: monotone and bounded by induction, the limit from the fixed-point equation
#   OBJ-2.7-3  (1 + 1/n)ⁿ converges; this defines e
# Every number below was recomputed with src/math/recursion.ts (orbit, eSeq, fSeq, ePowerFraction) or BigInt.
lesson: '2.7'
practice:
  - id: W-2.7-01
    level: basic
    qualitative: true
    objectives: [OBJ-2.7-1]
    prompt: >-
      הוכיחו או הפריכו:

      (א) אם $(a_n)$ עולה ו-$a_n\le M$ לכל $n$, אז $a_n\to M$.

      (ב) אם $(a_n)$ יורדת ו-$a_n\ge0$ לכל $n$, אז $(a_n)$ מתכנסת וגבולה אי-שלילי.

      (ג) אם $(a_n)$ עולה, $(b_n)$ יורדת, ו-$a_n\le b_n$ לכל $n$, אז שתי הסדרות מתכנסות.
    answer: >-
      (א) לא נכון: $1-\frac1n\le2$ וגבולה $1$. (ב) נכון: משפט 2.7.1 (ב) ומסקנה 2.5.2. (ג) נכון: $b_1$ חוסם את
      $(a_n)$ מלעיל ו-$a_1$ חוסם את $(b_n)$ מלרע.
    solution:
      - kind: idea
        text: >-
          משפט 2.7.1 נותן התכנסות לסופרמום או לאינפימום, החסם **הטוב ביותר**, לא לחסם שנתון. ב-(ג) צריך למצוא
          לכל סדרה חסם בכיוון הנכון, ושתי הסדרות חוסמות זו את זו.
      - kind: step
        text: >-
          (א) דוגמה נגדית: $a_n=1-\frac1n$ ו-$M=2$. הסדרה עולה, כי $\frac1{n+1}<\frac1n$, ו-$a_n<1\le2$. אבל
          $a_n\to1$ (מסקנה 2.2.14 (א) ומשפט 2.4.1), ולפי יחידות הגבול לא ל-$2$.
      - kind: step
        text: >-
          (ב) הסדרה יורדת וחסומה מלרע על ידי $0$, ולכן לפי משפט 2.7.1 (ב) מתכנסת ל-$L=\inf\{a_n\}$. לפי מסקנה
          2.5.2 (א) עם $c=0$, $L\ge0$. (הגבול יכול להיות $0$, כמו ב-$\frac1n$, או חיובי, כמו ב-$1+\frac1n$.)
      - kind: step
        text: >-
          (ג) לכל $n$: $a_n\le b_n\le b_1$, כי $(b_n)$ יורדת (טענה 2.1.8). לכן $(a_n)$ עולה וחסומה מלעיל על ידי
          $b_1$, ולפי משפט 2.7.1 (א) מתכנסת. וגם $b_n\ge a_n\ge a_1$, ולכן $(b_n)$ יורדת וחסומה מלרע על ידי $a_1$,
          ולפי משפט 2.7.1 (ב) מתכנסת.
      - kind: check
        text: >-
          ב-(ג) לא נובע שהגבולות שווים: $a_n=-\frac1n$ ו-$b_n=1+\frac1n$ מקיימות את ההנחות, עם הגבולות $0$ ו-$1$.
          לפי משפט 2.5.1 רק $\lim a_n\le\lim b_n$.
      - kind: result
        text: '(א) לא נכון. (ב) נכון. (ג) נכון, אבל הגבולות אינם חייבים להיות שווים.'

  - id: W-2.7-02
    level: basic
    objectives: [OBJ-2.7-1]
    prompt: >-
      נגדיר

      $$a_n=\frac{1\cdot3\cdot5\cdots(2n-1)}{2\cdot4\cdot6\cdots(2n)}=\prod_{k=1}^{n}\frac{2k-1}{2k}.$$

      הוכיחו ש-$(a_n)$ מתכנסת, ושגבולה $L$ מקיים $0\le L<\frac12$.
    answer: '$(a_n)$ יורדת ממש וחיובית, ולכן מתכנסת; $0\le L<a_1=\frac12$.'
    solution:
      - kind: idea
        text: >-
          במכפלה נוח לבדוק מונוטוניות במנה $\frac{a_{n+1}}{a_n}$ (טענה 2.1.9 (ב)), שמותרת כי כל האיברים
          חיוביים.
      - kind: step
        text: >-
          כל גורם $\frac{2k-1}{2k}$ חיובי, ולכן $a_n>0$ לכל $n$. לפי הגדרת המכפלה (הגדרה 0.5.5 (ב))
          $a_{n+1}=a_n\cdot\frac{2n+1}{2n+2}$, ולכן $\frac{a_{n+1}}{a_n}=\frac{2n+1}{2n+2}<1$.
      - kind: theorem
        text: >-
          לפי טענה 2.1.9 (ב), $a_{n+1}<a_n$: הסדרה יורדת ממש. היא חסומה מלרע על ידי $0$, ולפי משפט 2.7.1 (ב)
          מתכנסת ל-$L$.
      - kind: step
        text: >-
          $L\ge0$ לפי מסקנה 2.5.2 (א). והסדרה יורדת ממש, ולכן לפי מסקנה 2.7.2 (ב) $L<a_1=\frac12$. (למעשה
          $L<a_n$ לכל $n$.)
      - kind: check
        text: >-
          $a_1=0.5$, $a_2=0.375$, $a_3=0.3125$, $a_4\approx0.2734$, $a_5\approx0.2461$ (חושבו בפקודה): יורדת
          וחיובית. את הגבול עצמו המשפט לא מגלה. (הוא $0$: $\frac{2k-1}{2k}<\frac{2k}{2k+1}$, ולכן
          $a_n^2<\prod_{k=1}^{n}\frac{2k-1}{2k+1}=\frac1{2n+1}<\frac1n$, ו-$0<a_n<\frac1{\sqrt n}$; לפי טענה 2.2.13
          ומסקנה 2.2.14 (ג), $a_n\to0$.)
      - kind: result
        text: '$(a_n)$ מתכנסת, ו-$0\le L<\frac12$.'

  - id: W-2.7-03
    level: basic
    objectives: [OBJ-2.7-2]
    prompt: >-
      נגדיר $a_1=0$ ו-$a_{n+1}=\frac{a_n+4}3$. הוכיחו באינדוקציה ש-$a_n<2$ לכל $n$, הוכיחו שהסדרה עולה, ומצאו
      את גבולה.
    answer: '$a_n\to2$.'
    solution:
      - kind: idea
        text: >-
          המתכון של השיעור: חסם באינדוקציה, מונוטוניות מתוך החסם, התכנסות לפי משפט 2.7.1, ורק בסוף משוואת
          הנקודה הקבועה.
      - kind: step
        text: >-
          חסם. בסיס: $a_1=0<2$. צעד: אם $a_n<2$, אז $a_n+4<6$, ולכן $a_{n+1}<\frac63=2$. לפי עקרון האינדוקציה
          $a_n<2$ לכל $n$.
      - kind: computation
        text: >-
          עלייה: $a_{n+1}-a_n=\frac{a_n+4-3a_n}3=\frac{4-2a_n}3=\frac{2(2-a_n)}3>0$, לפי החסם.
      - kind: theorem
        text: >-
          הסדרה עולה וחסומה מלעיל, ולפי משפט 2.7.1 (א) מתכנסת ל-$L$. הכלל $f(x)=\frac{x+4}3$ הוא פולינום, ולפי
          טענה 2.7.3 (ב) $L=\frac{L+4}3$, כלומר $3L=L+4$ ו-$L=2$.
      - kind: check
        text: '$0,\ 1.333333,\ 1.777778,\ 1.925926,\ 1.975309$ (חושבו בפקודה): עולה ומתקרבת ל-$2$.'
      - kind: result
        text: '$a_n\to2$.'

  - id: W-2.7-04
    level: mid
    objectives: [OBJ-2.7-2]
    prompt: >-
      נגדיר $a_1=1$ ו-$a_{n+1}=2+\sqrt{a_n}$.

      (א) הוכיחו ש-$1\le a_n<4$ לכל $n$ ושהסדרה עולה.

      (ב) הוכיחו ש-$a_n\to4$. נמקו כל מעבר לגבול.
    answer: '(א) באינדוקציה, ו-$a_{n+1}-a_n=(2-\sqrt{a_n})(1+\sqrt{a_n})>0$. (ב) $L=2+\sqrt L$ נותן $L=4$.'
    solution:
      - kind: idea
        text: >-
          עם ההצבה $t=\sqrt{a_n}$ ההפרש $a_{n+1}-a_n=2+t-t^2$ מתפרק לגורמים. במעבר לגבול צריך
          $\sqrt{a_n}\to\sqrt L$: את זה נותנת טענה 2.4.6 (שורש של סדרה מתכנסת), לא "רציפות", שמוגדרת רק בשיעור 4.1.
      - kind: step
        text: >-
          (א) חסם. בסיס: $a_1=1$. צעד: אם $1\le a_n<4$, אז לפי טענה 1.7.5 (ג) $1\le\sqrt{a_n}<2$, ולכן
          $3\le a_{n+1}<4$, ובפרט $1\le a_{n+1}<4$.
      - kind: computation
        text: >-
          עלייה. נסמן $t=\sqrt{a_n}$, כך ש-$1\le t<2$ ו-$a_n=t^2$:
          $a_{n+1}-a_n=2+t-t^2=(2-t)(1+t)>0$.
      - kind: theorem
        text: >-
          (ב) עולה וחסומה מלעיל על ידי $4$: לפי משפט 2.7.1 (א) $a_n\to L$, ולפי מסקנה 2.7.2 (א) $L\ge a_1=1$.
      - kind: step
        text: >-
          לפי טענה 2.7.3 (א) $a_{n+1}\to L$. לפי טענה 2.4.6 (עם $a_n\ge0$) $\sqrt{a_n}\to\sqrt L$, ולפי משפט 2.4.1
          $2+\sqrt{a_n}\to2+\sqrt L$. זו אותה סדרה, ולפי יחידות הגבול $L=2+\sqrt L$.
      - kind: computation
        text: >-
          עם $u=\sqrt L\ge1$: $u^2-u-2=(u-2)(u+1)=0$, ו-$u+1>0$, ולכן $u=2$ ו-$L=4$.
      - kind: check
        text: '$1,\ 3,\ 3.732051,\ 3.931852,\ 3.982890$ (חושבו בפקודה): עולה ומתקרבת ל-$4$.'
      - kind: result
        text: '$a_n\to4$.'

  - id: W-2.7-05
    level: mid
    qualitative: true
    objectives: [OBJ-2.7-2]
    prompt: >-
      נגדיר $a_{n+1}=a_n^2$ עם $a_1\ge0$. מצאו את כל ערכי $a_1\ge0$ שעבורם הסדרה מתכנסת, ואת הגבול בכל מקרה.
      הוכיחו את תשובתכם.
    answer: >-
      מתכנסת אם ורק אם $0\le a_1\le1$: ל-$0$ כש-$a_1<1$, ול-$1$ כש-$a_1=1$. כש-$a_1>1$ היא שואפת ל-$\infty$.
    solution:
      - kind: idea
        text: >-
          המועמדים: $L=L^2$, כלומר $0$ או $1$. האיבר הראשון קובע אם הסדרה יורדת או עולה, ואם עולה מעל $1$, אין
          מועמד שמתאים לה.
      - kind: step
        text: >-
          $0\le a_1<1$: באינדוקציה $0\le a_n<1$ (אם $0\le a_n<1$ אז $0\le a_n^2<1$). ו-$a_{n+1}-a_n=a_n(a_n-1)\le0$:
          יורדת וחסומה מלרע, ולפי משפט 2.7.1 (ב) מתכנסת ל-$L$. לפי טענה 2.7.3 (ב) $L\in\{0,1\}$, ולפי מסקנה 2.7.2
          (ב) $L\le a_1<1$, ולכן $L=0$.
      - kind: step
        text: '$a_1=1$: $a_n=1$ לכל $n$ (אינדוקציה), והגבול $1$.'
      - kind: step
        text: >-
          $a_1>1$: באינדוקציה $a_n>1$, ולכן $a_{n+1}-a_n=a_n(a_n-1)>0$: הסדרה עולה. אילו התכנסה ל-$L$, אז לפי
          מסקנה 2.7.2 (א) $L\ge a_1>1$, ולפי טענה 2.7.3 (ב) $L\in\{0,1\}$: סתירה. לכן היא אינה מתכנסת, ולפי משפט
          2.7.1 (ג) היא אינה חסומה ושואפת ל-$\infty$.
      - kind: check
        text: >-
          $a_1=\frac12$: $0.5,\ 0.25,\ 0.0625,\ 0.0039$ (חושבו בפקודה). המשוואה $L=L^2$ נותנת שני מועמדים, ואף אחד
          מהם אינו גבול כש-$a_1>1$: הבדיקה $L\ge a_1$ היא שמגלה זאת.
      - kind: result
        text: >-
          מתכנסת בדיוק כש-$0\le a_1\le1$: גבול $0$ עבור $a_1<1$, גבול $1$ עבור $a_1=1$. עבור $a_1>1$, $a_n\to\infty$.

  - id: W-2.7-06
    level: mid
    objectives: [OBJ-2.7-3]
    prompt: >-
      חשבו את הגבולות, ונמקו כל צעד:

      (א) $\left(1+\frac1n\right)^{n-3}$

      (ב) $\left(\frac n{n+1}\right)^n$

      (ג) $\left(\frac{n+2}{n+1}\right)^{2n}$
    answer: '(א) $e$. (ב) $\frac1e$. (ג) $e^2$.'
    solution:
      - kind: idea
        text: 'בכל ביטוי מזהים חזקה של $e_n$ או של $e_{n+1}$, כפול גורם ששואף ל-$1$, ומפעילים את חשבון הגבולות.'
      - kind: step
        text: '(א) זו מסקנה 2.7.7 (א) עם $k=-3$: הגבול $e$.'
      - kind: computation
        text: >-
          (ב) $\frac n{n+1}=\frac1{1+\frac1n}$, ולכן $\left(\frac n{n+1}\right)^n=\frac1{e_n}$. לפי משפט 2.4.4
          (עם $e\ne0$) הגבול $\frac1e$.
      - kind: computation
        text: >-
          (ג) $\frac{n+2}{n+1}=1+\frac1{n+1}$, ולכן
          $\left(\frac{n+2}{n+1}\right)^{2n}=\frac{e_{n+1}^2}{\left(1+\frac1{n+1}\right)^2}$. לפי טענה 2.2.11
          $e_{n+1}\to e$, לפי משפט 2.4.2 המונה שואף ל-$e^2$, המכנה ל-$1$, ולפי משפט 2.4.4 הגבול $e^2$.
      - kind: check
        text: >-
          בפקודה: (א) עם $n=10^6$, $2.71827$; (ב) עם $n=1000$, $\left(\frac{1000}{1001}\right)^{1000}=\frac1{e_{1000}}\approx0.36806$,
          ו-$\frac1e\approx0.36788$; (ג) עם $n=10^6$, $7.38903$, ו-$e^2\approx7.38906$.
      - kind: result
        text: '(א) $e$. (ב) $\frac1e$. (ג) $e^2$.'

  - id: W-2.7-07
    level: mid
    qualitative: true
    objectives: [OBJ-2.7-3]
    prompt: >-
      הוכיחו או הפריכו, בעזרת משפט 2.7.4 וטענה 2.7.6 בלבד (בלי ערך מספרי של $e$ שלא הוכח):

      (א) $\left(1+\frac1n\right)^n\ge2$ לכל $n$.

      (ב) $e>2.5$.

      (ג) $e<2.8$.

      (ד) קיים $n$ שעבורו $\left(1+\frac1n\right)^n=e$.
    answer: '(א) נכון. (ב) נכון: $e>e_6>2.5$. (ג) נכון: $e<f_{17}<2.8$. (ד) לא נכון: $e_n<e$ לכל $n$.'
    solution:
      - kind: idea
        text: >-
          כל איבר $e_n$ חוסם את $e$ מלמטה וכל איבר $f_n$ מלמעלה (טענה 2.7.6 (ג)). כדי להוכיח $e>c$ או $e<c$ מספיק
          למצוא איבר אחד מתאים, ולחשב אותו בשבר מדויק.
      - kind: step
        text: '(א) הסדרה עולה (משפט 2.7.4), ולפי טענה 2.1.8 $e_n\ge e_1=2$.'
      - kind: computation
        text: >-
          (ב) $e_6=\left(\frac76\right)^6=\frac{117649}{46656}$, ו-$2\cdot117649=235298>233280=5\cdot46656$, ולכן
          $e_6>\frac52$. לפי טענה 2.7.6 (ג), $e>e_6>2.5$.
      - kind: computation
        text: >-
          (ג) $f_{17}=\left(\frac{18}{17}\right)^{18}\approx2.79785$, ובדיקה בשלמים (פקודה) נותנת
          $5\cdot18^{18}<14\cdot17^{18}$, כלומר $f_{17}<2.8$. לפי טענה 2.7.6 (ג), $e<f_{17}<2.8$.
      - kind: step
        text: '(ד) הסדרה עולה ממש, ולפי מסקנה 2.7.2 (א) $e_n<e$ לכל $n$: אף איבר אינו שווה לגבול.'
      - kind: check
        text: >-
          $e_5=2.48832<2.5$, ולכן $n=5$ לא היה מספיק ל-(ב); ו-$f_{16}\approx2.80280>2.8$, ולכן $17$ הוא ה-$n$ הקטן
          ביותר שמתאים ל-(ג) (חושבו בפקודה).
      - kind: result
        text: '(א), (ב), (ג) נכונות; (ד) לא נכונה.'

  - id: W-2.7-08
    level: exam
    objectives: [OBJ-2.7-1, OBJ-2.7-2]
    prompt: >-
      נגדיר $a_1=1$ ו-$a_{n+1}=a_n+\frac1{a_n}$.

      (א) הוכיחו ש-$a_n\ge1$ לכל $n$ ושהסדרה עולה ממש.

      (ב) הוכיחו שהסדרה אינה חסומה, והסיקו ש-$a_n\to\infty$.

      (ג) הוכיחו ש-$a_n\le n$ לכל $n$.
    answer: >-
      (א) אינדוקציה, ו-$a_{n+1}-a_n=\frac1{a_n}>0$. (ב) גבול סופי $L$ היה מקיים $L=L+\frac1L$, וזה בלתי אפשרי;
      עולה ולא חסומה שואפת ל-$\infty$. (ג) $a_{n+1}\le a_n+1$.
    solution:
      - kind: idea
        text: >-
          כאן משוואת הנקודה הקבועה **אין לה פתרון**, וזה בדיוק מה שמוכיח שהסדרה מתבדרת: אם הייתה מתכנסת, הגבול
          היה פתרון.
      - kind: step
        text: >-
          (א) בסיס: $a_1=1$. צעד: אם $a_n\ge1$, אז $\frac1{a_n}>0$ ו-$a_{n+1}>a_n\ge1$. ולכל $n$,
          $a_{n+1}-a_n=\frac1{a_n}>0$.
      - kind: step
        text: >-
          (ב) נניח בשלילה שהסדרה חסומה. היא עולה, ולפי משפט 2.7.1 (א) מתכנסת ל-$L$, ולפי מסקנה 2.7.2 (א)
          $L\ge a_1=1$, ובפרט $L\ne0$.
      - kind: step
        text: >-
          $f(x)=x+\frac1x=\frac{x^2+1}x$ היא מנה של פולינומים, והמכנה ב-$L$ אינו אפס. לפי טענה 2.7.3 (ב),
          $L=L+\frac1L$, כלומר $\frac1L=0$, וזה בלתי אפשרי. לכן הסדרה אינה חסומה; היא עולה, ולפי משפט 2.7.1 (ג)
          (טענה 2.6.7) $a_n\to\infty$.
      - kind: step
        text: >-
          (ג) בסיס: $a_1=1\le1$. צעד: אם $a_n\le n$, אז לפי (א) $\frac1{a_n}\le1$, ולכן $a_{n+1}\le n+1$.
      - kind: check
        text: >-
          $1,\ 2,\ 2.5,\ 2.9,\ 3.2448,\ 3.5530$ ו-$a_{100}\approx14.21$ (חושבו בפקודה): עולה ללא גבול, אבל
          לאט, הרבה מתחת לחסם $n$ של (ג).
      - kind: result
        text: '(א) $a_n\ge1$ ועולה ממש. (ב) $a_n\to\infty$. (ג) $a_n\le n$.'

  - id: W-2.7-09
    level: exam
    objectives: [OBJ-2.7-3, OBJ-2.7-1]
    prompt: >-
      (א) הוכיחו ש-$\left(1+\frac1{n^2}\right)^{n^2}\to e$.

      (ב) הוכיחו ש-$\left(1+\frac1{n^2}\right)^{n}\to1$. (רמז: $(1+x)(1-x)\le1$, ואי-שוויון ברנולי.)
    answer: >-
      (א) $e_n\le e_{n^2}<e$ וסנדוויץ'. (ב) $1\le\left(1+\frac1{n^2}\right)^n\le\frac n{n-1}$ לכל $n\ge2$, וסנדוויץ'.
    solution:
      - kind: idea
        text: >-
          (א) $e_{n^2}$ הוא איבר של הסדרה העולה $(e_n)$ במקום $n^2\ge n$: הוא גדול מ-$e_n$ וקטן מ-$e$. (ב) את
          $(1+x)^n$ חוסמים מלמעלה דרך $(1-x)^n$, שאותו ברנולי חוסם מלמטה.
      - kind: step
        text: >-
          (א) לכל $n$, $n^2\ge n$, ולפי טענה 2.1.8 (הסדרה $e_n$ עולה, משפט 2.7.4) $e_n\le e_{n^2}$. לפי טענה 2.7.6
          (ג), $e_{n^2}<e$. לכן $e_n\le e_{n^2}\le e$, ושני הקצוות שואפים ל-$e$ (הגדרה 2.7.5 וסדרה קבועה). לפי
          כלל הסנדוויץ' (משפט 2.5.3), $e_{n^2}\to e$.
      - kind: step
        text: >-
          (ב) יהי $n\ge2$, ונסמן $x=\frac1{n^2}$. לפי אי-שוויון ברנולי (משפט 0.6.6) עם $-x\ge-1$:
          $(1-x)^n\ge1-nx=1-\frac1n>0$.
      - kind: step
        text: >-
          $0\le1-x^2\le1$, ולכן (באינדוקציה) $(1-x^2)^n\le1$, כלומר $(1+x)^n(1-x)^n\le1$. מחלקים ב-$(1-x)^n>0$:
          $(1+x)^n\le\frac1{(1-x)^n}\le\frac1{1-\frac1n}=\frac n{n-1}$.
      - kind: step
        text: >-
          לכן $1\le\left(1+\frac1{n^2}\right)^n\le\frac n{n-1}=1+\frac1{n-1}$ לכל $n\ge2$. שני הקצוות שואפים ל-$1$
          (טענה 2.2.11 ומסקנה 2.2.14), ולפי כלל הסנדוויץ' הגבול $1$.
      - kind: check
        text: >-
          $\left(1+\frac1{100}\right)^{10}\approx1.1046\le\frac{10}9\approx1.1111$ ו-$e_{100}\approx2.7048$ (חושבו
          בפקודה). שימו לב: ב-(ב) הבסיס שואף ל-$1$ והמעריך לאינסוף, והגבול $1$; ב-(א) אותו בסיס, מעריך גדול יותר,
          והגבול $e$. הצורה "$1^\infty$" לבדה אינה מכריעה.
      - kind: result
        text: '(א) $e$. (ב) $1$.'

  - id: W-2.7-10
    level: exam
    objectives: [OBJ-2.7-2, OBJ-2.7-1]
    prompt: >-
      נגדיר $a_{n+1}=4-\frac3{a_n}$.

      (א) עבור $a_1=2$: הוכיחו ש-$1<a_n<3$ לכל $n$, שהסדרה עולה, ומצאו את גבולה.

      (ב) עבור $a_1=\frac12$: חשבו את $a_2$ ואת $a_3$, והוכיחו שהסדרה מתכנסת, ולאותו גבול.

      (ג) מצאו $a_1>0$ שעבורו $a_3$ אינו מוגדר.
    answer: '(א) $a_n\to3$. (ב) $a_2=-2$, $a_3=5.5$, ומ-$n=3$ יורדת וגדולה מ-$3$; $a_n\to3$. (ג) $a_1=\frac34$.'
    solution:
      - kind: idea
        text: >-
          $f(x)=4-\frac3x$ עולה ממש על $(0,\infty)$, ונקודותיה הקבועות הן $1$ ו-$3$. סדרה שנכנסת לקטע $(1,3)$
          נשארת בו ועולה; סדרה שנכנסת לקטע $(3,\infty)$ נשארת בו ויורדת.
      - kind: computation
        text: >-
          $f(x)=x$ אם ורק אם $x^2-4x+3=(x-1)(x-3)=0$. ולכל $x\ne0$:
          $f(x)-x=\frac{4x-3-x^2}x=-\frac{(x-1)(x-3)}x$.
      - kind: step
        text: >-
          (א) חסם. בסיס: $1<2<3$. צעד: אם $1<a_n<3$, אז $\frac13<\frac1{a_n}<1$, ולכן $1<4-\frac3{a_n}<3$. עלייה:
          $a_{n+1}-a_n=-\frac{(a_n-1)(a_n-3)}{a_n}>0$, כי $a_n-1>0$, $a_n-3<0$ ו-$a_n>0$.
      - kind: theorem
        text: >-
          עולה וחסומה: $a_n\to L$ (משפט 2.7.1 (א)), $L\ge a_1=2$ (מסקנה 2.7.2), והמכנה ב-$L$ אינו אפס; לפי טענה
          2.7.3 (ב) $L\in\{1,3\}$, ולכן $L=3$.
      - kind: computation
        text: '(ב) $a_2=4-6=-2$ ו-$a_3=4+\frac32=\frac{11}2=5.5$.'
      - kind: step
        text: >-
          מ-$n=3$: באינדוקציה $a_n>3$ (אם $a_n>3$ אז $\frac3{a_n}<1$ ו-$a_{n+1}>3$), ו-$a_{n+1}-a_n<0$ לפי הנוסחה
          של $f(x)-x$. הסדרה יורדת החל מ-$n_0=3$ וחסומה מלרע על ידי $3$; לפי משפט 2.7.1 (ד) היא מתכנסת ל-$L\ge3$,
          ושוב $L=3$ (טענה 2.7.3 (ב), על הזנב מ-$n=3$, שכל איבריו ב-$D=(3,\infty)$, ו-$f$ מעבירה את $D$ לתוכו).
      - kind: step
        text: '(ג) $a_3$ אינו מוגדר כש-$a_2=0$, כלומר $4=\frac3{a_1}$, ו-$a_1=\frac34$.'
      - kind: check
        text: >-
          (א) $2,\ 2.5,\ 2.8,\ 2.928571$; (ב) $0.5,\ -2,\ 5.5,\ 3.454545,\ 3.131579$ (חושבו בפקודה). ב-(ב) המונוטוניות
          מתחילה רק ב-$n=3$, ולכן צריך את משפט 2.7.1 (ד).
      - kind: result
        text: '(א) $3$. (ב) $a_2=-2$, $a_3=\frac{11}2$, והגבול $3$. (ג) $a_1=\frac34$.'

challenge:
  - id: W-2.7-c1
    stars: 1
    objectives: [OBJ-2.7-2, OBJ-2.7-1]
    prompt: >-
      יהי $c\in\mathbb{R}$, ונגדיר $x_1=c$ ו-$x_{n+1}=x_n^2+x_n$. הוכיחו ש-$(x_n)$ מתכנסת אם ורק אם
      $-1\le c\le0$, ושבמקרה הזה גבולה $0$.
    answer: >-
      הסדרה תמיד עולה ($x_{n+1}-x_n=x_n^2\ge0$), והמועמד היחיד הוא $0$. היא מתכנסת בדיוק כשכל איבריה נשארים
      $\le0$, וזה קורה בדיוק כש-$-1\le c\le0$.
    solution:
      - kind: idea
        text: >-
          $x_{n+1}-x_n=x_n^2\ge0$: הסדרה עולה לכל $c$. לכן היא מתכנסת אם ורק אם היא חסומה מלעיל (משפט 2.7.1 (ג)),
          והגבול הוא פתרון של $L=L^2+L$, כלומר $L=0$. סדרה עולה עם גבול $0$ חייבת להישאר $\le0$.
      - kind: step
        text: >-
          אם הסדרה מתכנסת ל-$L$: לפי טענה 2.7.3 (ב) ($f(x)=x^2+x$ פולינום) $L=L^2+L$, ולכן $L=0$. לפי מסקנה 2.7.2
          (א), $x_n\le0$ לכל $n$; בפרט $c=x_1\le0$ ו-$x_2=c(c+1)\le0$. אילו $c<-1$, אז $c<0$ ו-$c+1<0$, ו-$c(c+1)>0$:
          סתירה. לכן $-1\le c\le0$.
      - kind: step
        text: >-
          להפך, נניח $-1\le c\le0$. נוכיח באינדוקציה ש-$-1\le x_n\le0$. בסיס: $x_1=c$. צעד: אם $-1\le x_n\le0$, אז
          $x_n\le0$ ו-$x_n+1\ge0$, ולכן $x_{n+1}=x_n(x_n+1)\le0$; ו-$x_{n+1}\ge x_n\ge-1$, כי הסדרה עולה.
      - kind: theorem
        text: >-
          הסדרה עולה וחסומה מלעיל על ידי $0$, ולפי משפט 2.7.1 (א) מתכנסת; לפי הצעד הראשון הגבול הוא $0$.
      - kind: check
        text: >-
          $c=-\frac12$: $-0.5,\ -0.25,\ -0.1875,\ -0.1523$ (עולה אל $0$); $c=-1$: $-1,0,0,\dots$; $c=-\frac32$:
          $-1.5,\ 0.75,\ 1.3125,\ 3.0352$, ובורחת (חושבו בפקודה). כש-$c\notin[-1,0]$ הסדרה עולה ולא חסומה, ולפי
          משפט 2.7.1 (ג) שואפת ל-$\infty$.
      - kind: result
        text: '$(x_n)$ מתכנסת אם ורק אם $-1\le c\le0$, ואז $x_n\to0$; אחרת $x_n\to\infty$.'
    source:
      name: 'Jiří Lebl, Basic Analysis I: Introduction to Real Analysis, Volume I (version 6.3), HTML edition'
      year: 2026
      problem: 'Exercise 2.2.14'
      url: 'https://jirka.org/ra/html/sec_factslimsseqs.html'
      verified: '2026-11-17'
      adapted: true

  - id: W-2.7-c2
    stars: 2
    objectives: [OBJ-2.7-2, OBJ-2.7-1]
    prompt: >-
      יהי $a_1\in(0,1)$, ונגדיר $a_{n+1}=a_n(1-a_n)$.

      (א) הוכיחו ש-$a_n\to0$.

      (ב) הוכיחו ש-$n\,a_n\to1$. (רמז: הסתכלו על $b_n=\frac1{a_n}$, והראו ש-$b_{n+1}-b_n=\frac1{1-a_n}$.)
    answer: >-
      (א) יורדת וחיובית, והמועמד היחיד הוא $0$. (ב) $n<b_n\le b_2+n+\frac83\sqrt n$, ולכן
      $\frac1{1+\frac{b_2}n+\frac8{3\sqrt n}}\le n\,a_n<1$, וסנדוויץ'.
    solution:
      - kind: idea
        text: >-
          (א) הוא המתכון של השיעור. ב-(ב) המהירות שבה $a_n\to0$ נקראת מההופכי: $b_n=\frac1{a_n}$ גדלה בכל צעד
          בקצת יותר מ-$1$, ולכן $b_n\approx n$. צריך לחסום את ה"קצת יותר" כך שסכומו קטן לעומת $n$.
      - kind: step
        text: >-
          (א) באינדוקציה $0<a_n<1$: אם כך, $a_{n+1}$ מכפלה של שני מספרים ב-$(0,1)$, ולכן ב-$(0,1)$.
          $a_{n+1}-a_n=-a_n^2<0$: יורדת וחסומה מלרע על ידי $0$, ולפי משפט 2.7.1 (ב) $a_n\to L\ge0$. לפי טענה
          2.7.3 (ב), $L=L-L^2$, ולכן $L=0$.
      - kind: computation
        text: >-
          (ב) לכל $x\in(0,1)$: $\frac1{x(1-x)}=\frac1x+\frac1{1-x}$. לכן
          $b_{n+1}=\frac1{a_n(1-a_n)}=b_n+\frac1{1-a_n}$, ו-$b_{n+1}-b_n=\frac1{1-a_n}>1$.
      - kind: step
        text: >-
          חסם מלמטה: סוכמים את ההפרשים, $b_n\ge b_1+(n-1)>n$, כי $b_1=\frac1{a_1}>1$. לכן $n\,a_n<1$ לכל $n$.
      - kind: step
        text: >-
          חסם מלמעלה: $a_2=a_1(1-a_1)\le\left(\frac{a_1+1-a_1}2\right)^2=\frac14$ (אי-שוויון הממוצעים), והסדרה
          יורדת, ולכן $a_k\le\frac14$ לכל $k\ge2$. אז $\frac1{1-a_k}=1+\frac{a_k}{1-a_k}\le1+\frac43a_k<1+\frac4{3k}$,
          לפי החסם מלמטה ($a_k<\frac1k$).
      - kind: step
        text: >-
          לכל $k\ge2$, $\frac1k\le\frac1{\sqrt k}\le\frac2{\sqrt k+\sqrt{k-1}}=2\left(\sqrt k-\sqrt{k-1}\right)$ (כפל
          בצמוד), וסכום מתקפל נותן $\sum_{k=2}^{n-1}\frac1k\le2\sqrt{n}$. סוכמים את הפרשי $b$ מ-$k=2$ עד $n-1$, לכל $n\ge2$:
          $b_n\le b_2+(n-2)+\frac43\cdot2\sqrt n<b_2+n+\frac83\sqrt n$.
      - kind: step
        text: >-
          מחלקים ב-$n$: $\frac1{1+\frac{b_2}n+\frac8{3\sqrt n}}<n\,a_n<1$. לפי מסקנה 2.2.14, משפט 2.4.1 ומשפט 2.4.4
          אגף שמאל שואף ל-$1$, ולפי כלל הסנדוויץ' (משפט 2.5.3) $n\,a_n\to1$.
      - kind: check
        text: >-
          עם $a_1=\frac12$: $10\,a_{10}\approx0.7509$, $100\,a_{100}\approx0.9486$, $1000\,a_{1000}\approx0.9924$;
          והחסם $b_n\le b_2+n+\frac83\sqrt n$ נבדק בפקודה עד $n=5000$ עבור $a_1\in\{0.01,\ 0.1,\ 0.5,\ 0.9\}$.
      - kind: result
        text: '(א) $a_n\to0$. (ב) $n\,a_n\to1$: $a_n$ מתנהגת כמו $\frac1n$.'
    source:
      name: '27th William Lowell Putnam Mathematical Competition (Kalva archive)'
      year: 1966
      problem: 'A3'
      url: 'https://prase.cz/kalva/putnam/psoln/psol663.html'
      verified: '2026-11-17'
      adapted: true
