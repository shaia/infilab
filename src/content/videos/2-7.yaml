  why: >-
    לפי הכותרת והתיאור: עוד על התכנסות של סדרות נסיגה (סדרות רקורסיביות), כולל מה עושים כש-$a_n$ מופיע גם
    במונה וגם במכנה, כמו בשיטת הרון ובכלל $1+\frac1{a_n}$. בזמן הצפייה, זהו בכל דוגמה את שלבי המתכון: חסם
    באינדוקציה, מונוטוניות, התכנסות, ורק בסוף משוואת הנקודה הקבועה.
