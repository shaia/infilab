# Misconceptions first detected in lesson 2.9 (subsequences and Bolzano–Weierstrass).
- id: MC-subsequence-indices-not-increasing
  title: חושבים שתת-סדרה יכולה לחזור על איברים או לשנות את הסדר
  belief: >-
    כל בחירה של איברים מהסדרה היא תת-סדרה, גם $a_1,a_1,a_2,a_2,\dots$ או $a_2,a_1,a_4,a_3,\dots$.
  truth: >-
    תת-סדרה היא $a_{n_k}$ עם אינדקסים **עולים ממש**: $n_1<n_2<n_3<\dots$. מותר לדלג על איברים, אסור לחזור
    אחורה או לחזור על אותו מקום.
  remedy: { lesson: '2.9', label: 'הגדרת תת-סדרה' }

- id: MC-convergent-subsequence-implies-convergent
  title: מסיקים מתת-סדרה מתכנסת שהסדרה כולה מתכנסת
  belief: >-
    אם $a_{2n}\to L$ (או תת-סדרה אחרת שואפת ל-$L$), אז $a_n\to L$.
  truth: >-
    הכיוון הנכון הפוך: אם הסדרה מתכנסת, כל תת-סדרה שלה מתכנסת לאותו גבול. $(-1)^n$ מתבדרת, אף ש-$a_{2n}=1\to1$.
  remedy: { lesson: '2.9', label: 'תת-סדרה של סדרה מתכנסת' }

- id: MC-some-subsequences-cover
  title: חושבים ששתי תת-סדרות עם אותו גבול מוכיחות התכנסות
  belief: >-
    אם $a_{2n}\to L$ וגם $a_{3n}\to L$, אז $a_n\to L$.
  truth: >-
    צריך שתתי-הסדרות יכסו את **כל** האינדקסים מנקודה מסוימת, כמו $a_{2n}$ ו-$a_{2n-1}$. האינדקסים $2n$ ו-$3n$ לא
    מכסים את $1,5,7,11,\dots$: הסדרה ששווה ל-0 כש-$n$ מתחלק ב-2 או ב-3, ול-1 אחרת, מתבדרת.
  remedy: { lesson: '2.9', label: 'תת-סדרות שמכסות את הסדרה' }

- id: MC-partial-limit-is-term
  title: מבלבלים בין גבול חלקי לבין ערך של איבר
  belief: >-
    כל ערך שהסדרה מקבלת הוא גבול חלקי, וכל גבול חלקי הוא ערך של איבר.
  truth: >-
    גבול חלקי הוא גבול של תת-סדרה. ב-$\frac1n$ הערך 1 מתקבל פעם אחת ואינו גבול חלקי, והגבול החלקי 0 אינו ערך
    של אף איבר. ערך הוא גבול חלקי בוודאות רק כשהוא מתקבל אינסוף פעמים.
  remedy: { lesson: '2.9', label: 'הגדרת גבול חלקי' }

- id: MC-unique-partial-limit-converges
  title: חושבים שסדרה עם גבול חלקי יחיד מתכנסת
  belief: >-
    אם לסדרה יש בדיוק גבול חלקי אחד $L$, היא מתכנסת ל-$L$.
  truth: >-
    זה נכון רק לסדרה **חסומה**. הסדרה ששווה ל-$n$ כש-$n$ אי-זוגי ול-0 כש-$n$ זוגי, גבולה החלקי היחיד הוא 0, והיא
    אינה מתכנסת: תת-הסדרה האי-זוגית בורחת לאינסוף.
  remedy: { lesson: '2.9', label: 'גבול חלקי יחיד וחסימות' }

- id: MC-partial-limits-not-closed
  title: חושבים שכל קבוצה יכולה להיות קבוצת הגבולות החלקיים
  belief: >-
    אפשר לבנות סדרה שהגבולות החלקיים שלה הם בדיוק $\left\{\frac1k : k\in\mathbb{N}\right\}$.
  truth: >-
    אם כל $\frac1k$ הוא גבול חלקי, אפשר לבחור לכל $k$ איבר במרחק פחות מ-$\frac1k$ מ-$\frac1k$, באינדקסים עולים;
    תת-הסדרה הזו שואפת ל-0, ולכן גם 0 גבול חלקי. גבול של גבולות חלקיים הוא תמיד גבול חלקי.
  remedy: { lesson: '2.9', label: 'קבוצת הגבולות החלקיים' }

- id: MC-BW-without-bounded
  title: שוכחים את החסימות במשפט בולצאנו-ויירשטראס
  belief: >-
    לכל סדרה יש תת-סדרה מתכנסת.
  truth: >-
    לסדרה $a_n=n$ אין תת-סדרה מתכנסת: כל תת-סדרה $a_{n_k}=n_k\ge k$ שואפת לאינסוף. המשפט דורש שהסדרה תהיה
    חסומה.
  remedy: { lesson: '2.9', label: 'משפט בולצאנו-ויירשטראס' }
