# Misconceptions first detected in lesson 5.7 (monotonicity and Darboux's theorem).
- id: MC-strict-increase-positive-derivative
  title: חושבים שפונקציה עולה ממש חייבת נגזרת חיובית בכל נקודה
  belief: >-
    אם $f$ גזירה ועולה ממש, אז $f'(x)>0$ לכל $x$.
  truth: >-
    $f'>0$ גורר עלייה ממש, אבל לא להפך: $x^3$ עולה ממש ו-$f'(0)=0$. לפונקציה עולה מובטח רק $f'\ge0$.
  remedy: { lesson: '5.7', label: 'סימן הנגזרת ומונוטוניות' }

- id: MC-increasing-negative-derivative-point
  title: חושבים שלפונקציה עולה יכולה להיות נגזרת שלילית בנקודה
  belief: >-
    פונקציה עולה יכולה לקבל נגזרת שלילית בנקודות בודדות, כל עוד היא עולה "בסך הכול".
  truth: >-
    אם $f$ עולה, כל מנות ההפרשים $\frac{f(x+h)-f(x)}{h}$ אי-שליליות, ולכן הגבול שלהן $f'(x)\ge0$ בכל נקודה.
  remedy: { lesson: '5.7', label: 'סימן הנגזרת ומונוטוניות' }

- id: MC-positive-derivative-at-point-increasing
  title: חושבים שנגזרת חיובית בנקודה גוררת עלייה בסביבה שלה
  belief: >-
    אם $f'(x_0)>0$, אז $f$ עולה בקטע קטן סביב $x_0$.
  truth: >-
    נגזרת בנקודה אחת היא מידע על הנקודה בלבד. $x+2x^2\sin\frac1x$ מקיימת $f'(0)=1$, ובכל סביבה של $0$ יש
    נקודות שבהן $f'=-1$. מובטח רק ש-$f(x)>f(x_0)$ ל-$x>x_0$ קרוב מספיק (ו-$f(x)<f(x_0)$ משמאל).
  remedy: { lesson: '5.7', label: 'סימן הנגזרת בנקודה ובקטע' }

- id: MC-derivative-inequality-without-start
  title: מסיקים אי-שוויון בין פונקציות מאי-שוויון בין הנגזרות בלבד
  belief: >-
    אם $f'>g'$ בקטע, אז $f>g$ בקטע.
  truth: >-
    $f'>g'$ אומר ש-$f-g$ עולה. כדי ש-$f-g$ תהיה חיובית צריך גם נקודת התחלה: $f(a)\ge g(a)$ בקצה השמאלי.
    $x$ ו-$1$ ב-$(0,\infty)$ הן דוגמה נגדית.
  remedy: { lesson: '5.7', label: 'הוכחת אי-שוויונות במונוטוניות' }

- id: MC-darboux-needs-continuity
  title: חושבים שמשפט דרבו דורש נגזרת רציפה
  belief: >-
    $f'$ מקבלת כל ערך שבין $f'(a)$ ל-$f'(b)$ רק כש-$f'$ רציפה; זה משפט ערך הביניים.
  truth: >-
    החידוש של דרבו הוא שאין צורך ברציפות של $f'$. ההוכחה משתמשת רק ברציפות של $f$ עצמה (ויירשטראס)
    ובמשפט פרמה.
  remedy: { lesson: '5.7', label: 'משפט דרבו' }

- id: MC-darboux-confused-with-rolle
  title: מפעילים את רול כשהנתונים הם על הנגזרת
  belief: >-
    כדי להראות ש-$f'$ מתאפסת בקטע, מספיק לדעת ש-$f'$ מחליפה בו סימן, ולכן זה משפט רול.
  truth: >-
    רול דורש ערכים שווים של $f$ בקצוות. כשהנתונים הם ערכי $f'$ (שלילית בקצה אחד וחיובית בשני), הכלי הוא
    משפט דרבו.
  remedy: { lesson: '5.7', label: 'משפט דרבו' }

- id: MC-derivative-jump-possible
  title: חושבים שלנגזרת יכולה להיות קפיצה
  belief: >-
    אפשר להדביק שני ישרים בשיפועים שונים ולקבל פונקציה גזירה שהנגזרת שלה קופצת.
  truth: >-
    לפי דרבו לנגזרת יש תכונת ערך הביניים, ולכן אין לה קפיצות: ההדבקה יוצרת פינה, ושם הפונקציה לא גזירה.
    $\operatorname{sign}(x)$ ו-$\lfloor x\rfloor$ אינן נגזרות.
  remedy: { lesson: '5.7', label: 'לנגזרת אין קפיצות' }

- id: MC-darboux-only-excludes-jumps
  title: חושבים שדרבו פוסל רק קפיצות
  belief: >-
    כל פונקציה שאין לה נקודות קפיצה יכולה להיות נגזרת.
  truth: >-
    דרבו דורש את תכונת ערך הביניים כולה. פונקציית דיריכלה לא קופצת אף פעם (הגבולות החד-צדדיים שלה לא קיימים),
    אבל היא מקבלת רק $0$ ו-$1$, ולכן אינה נגזרת.
  remedy: { lesson: '5.7', label: 'לנגזרת אין קפיצות' }

- id: MC-abs-derivative-sign
  title: חושבים שהנגזרת של הערך המוחלט היא פונקציית הסימן בכל מקום
  belief: >-
    $(|x|)'=\operatorname{sign}(x)$ לכל $x$, כולל $(|x|)'(0)=0$.
  truth: >-
    ב-$0$ הנגזרות החד-צדדיות של $|x|$ הן $-1$ ו-$1$, ולכן היא לא גזירה שם. את הנגזרת לא "מגדירים": היא גבול,
    והגבול הזה לא קיים.
  remedy: { lesson: '5.7', label: 'לנגזרת אין קפיצות' }
