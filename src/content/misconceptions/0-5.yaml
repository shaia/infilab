# Misconceptions first detected in lesson 0.5 (mathematical induction).
- id: MC-induction-skip-base
  title: חושבים שצעד האינדוקציה לבדו מוכיח את הטענה
  belief: >-
    אם הוכחנו שהטענה עבור $n$ גוררת את הטענה עבור $n+1$, הטענה נכונה לכל $n$, גם בלי לבדוק את הבסיס.
  truth: >-
    הצעד הוא גרירה: "אם נכון ל-$n$ אז נכון ל-$n+1$". בלי מקרה ראשון שבו הטענה נכונה, אין ממה להתחיל. "$n=n+1$"
    עוברת את הצעד (מוסיפים 1 לשני האגפים) ושקרית לכל $n$.
  remedy: { lesson: '0.5', anchor: fig-0-5a, label: 'אינדוקציה: הבסיס והצעד' }

- id: MC-induction-hypothesis-circular
  title: חושבים שהנחת האינדוקציה מניחה את מה שרוצים להוכיח
  belief: >-
    בצעד מניחים שהטענה נכונה לכל $n$, ולכן האינדוקציה היא הוכחה מעגלית; או שמותר להשתמש בטענה עבור $n+1$
    כדי להוכיח אותה עבור $n+1$.
  truth: >-
    בצעד מוכיחים גרירה: לכל $n$, **אם** הטענה נכונה עבור $n$ זה, **אז** היא נכונה עבור $n+1$. מניחים אותה
    עבור $n$ אחד ולא לכל $n$, ואת הטענה עבור $n+1$ צריך להסיק, לא להניח.
  remedy: { lesson: '0.5', anchor: hypothesis, label: 'אינדוקציה: הנחת האינדוקציה' }

- id: MC-induction-step-not-all-n
  title: בודקים את הצעד רק ל-n "טיפוסי" ולא לכל n מהבסיס
  belief: >-
    אם הצעד עובד ל-$n$ גדול, או ל-$n$ "כללי", הוא עובד לכל $n$.
  truth: >-
    הצעד צריך לעבוד לכל $n$ מהבסיס והלאה, כולל המעבר הראשון. "בכל קבוצה של $n$ מספרים כולם שווים" נופלת
    במעבר מ-$1$ ל-$2$; ו-$2n^2\ge(n+1)^2$, שמופיע בהוכחה של $2^n\ge n^2$, נכון רק החל מ-$n=3$.
  remedy: { lesson: '0.5', anchor: flawed, label: 'הוכחות אינדוקציה פגומות' }

- id: MC-bernoulli-any-x
  title: משתמשים באי-שוויון ברנולי בלי התנאי על x
  belief: >-
    $(1+x)^n\ge 1+nx$ לכל $x$ ממשי ולכל $n$ טבעי.
  truth: >-
    ברנולי דורש $x\ge -1$: בצעד כופלים את הנחת האינדוקציה ב-$1+x$, וזה שומר על אי-השוויון רק כש-$1+x\ge 0$.
    עבור $x=-4$ ו-$n=3$: $(-3)^3=-27$, בעוד $1+3\cdot(-4)=-11$.
  remedy: { lesson: '0.5', anchor: bernoulli, label: 'אי-שוויון ברנולי' }

- id: MC-induction-stronger-is-harder
  title: חושבים שטענה חזקה יותר קשה יותר להוכחה באינדוקציה
  belief: >-
    אם צעד האינדוקציה נתקע, הטענה לא ניתנת להוכחה באינדוקציה; ובטח שאין טעם לנסות להוכיח טענה חזקה יותר.
  truth: >-
    בצעד, הטענה עבור $n$ היא גם מה שמניחים. טענה חזקה יותר נותנת הנחה חזקה יותר, ולפעמים רק איתה הצעד נסגר.
    מ-$\frac12+\dots+\frac1{2^n}<1$ לבד אי אפשר להסיק את הטענה עבור $n+1$, אבל את השוויון
    $\frac12+\dots+\frac1{2^n}=1-\frac1{2^n}$ מוכיחים באינדוקציה בשורה אחת, וממנו נובע אי-השוויון.
  remedy: { lesson: '0.5', anchor: strengthen, label: 'כשהצעד נתקע: מחזקים את הטענה' }

- id: MC-induction-stuck-move-base
  title: חושבים שכשהצעד נתקע, מספיק להזיז את הבסיס
  belief: >-
    אם מההנחה עבור $n$ לא מצליחים להסיק את הטענה עבור $n+1$, מתחילים מבסיס אחר והצעד יסתדר.
  truth: >-
    הזזת הבסיס עוזרת רק כשהנימוק של הצעד עובד מ-$n$ מסוים והלאה, כמו ב-$2^n>n^3$. כשההנחה עצמה חלשה מדי, כמו
    "$\frac13+\dots+\frac1{3^n}<\frac12$", הצעד נתקע מכל בסיס, והפתרון הוא להוכיח טענה חזקה יותר.
  remedy: { lesson: '0.5', anchor: strengthen, label: 'כשהצעד נתקע: מחזקים את הטענה' }

- id: MC-well-ordering-any-set
  title: מפעילים את עקרון הסדר הטוב על קבוצות שאינן קבוצות של טבעיים
  belief: >-
    לכל קבוצה לא ריקה של מספרים שלמים, או של מספרים חיוביים, יש איבר קטן ביותר.
  truth: >-
    עקרון הסדר הטוב הוא על קבוצות לא ריקות של **טבעיים**. ל-$\mathbb{Z}$ אין איבר קטן ביותר (לכל שלם $m$, גם
    $m-1$ שלם), ולקבוצת המספרים $\frac1n$ אין איבר קטן ביותר אף שכולם חיוביים. מצד שני, לכל קבוצה לא ריקה של
    טבעיים, גם אינסופית, יש איבר קטן ביותר.
  remedy: { lesson: '0.5', anchor: strong, label: 'אינדוקציה שלמה ועקרון הסדר הטוב' }

- id: MC-strong-induction-no-cases
  title: חושבים שבאינדוקציה שלמה אין צורך לבדוק מקרים קטנים
  belief: >-
    באינדוקציה שלמה מניחים את כל המקרים הקודמים, ולכן אין בסיס ואין מה לבדוק בנפרד.
  truth: >-
    עבור $n=n_0$ אין מקרים קודמים, ולכן את $P(n_0)$ מוכיחים בלי עזרה. וכשהנימוק בצעד משתמש, למשל, ב-$P(n-3)$,
    הוא עובד רק כש-$n-3\ge n_0$; את ה-$n$ הקטנים יותר מוכיחים ישירות.
  remedy: { lesson: '0.5', anchor: strong, label: 'אינדוקציה שלמה ועקרון הסדר הטוב' }
