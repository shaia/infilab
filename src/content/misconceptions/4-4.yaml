# Misconceptions first detected in lesson 4.4 (Weierstrass's theorems).
- id: MC-continuous-is-bounded
  title: חושבים שפונקציה רציפה על קטע חסום חסומה
  belief: >-
    פונקציה רציפה על קטע חסום כלשהו, גם פתוח, חסומה; הסגירות של הקטע לא משחקת תפקיד בהוכחה.
  truth: >-
    $\frac1x$ רציפה ב-$(0,1)$ ואינה חסומה. בהוכחה, הסגירות מבטיחה שגבול של תת-סדרה נשאר בתחום, ושם
    הרציפות נותנת את הסתירה.
  remedy: { lesson: '4.4', label: 'משפט ויירשטראס הראשון: איפה הסגירות נכנסת' }

- id: MC-theorem-hypotheses-necessary
  title: חושבים שכשהנחה של משפט נכשלת גם המסקנה נכשלת
  belief: >-
    $\mathbb{R}$ אינו קטע סגור, ולכן פונקציה רציפה על $\mathbb{R}$ (או על קטע פתוח) לא מקבלת מקסימום.
  truth: >-
    משפט הוא גרירה: כשההנחות מתקיימות, המסקנה מובטחת; כשהן לא מתקיימות, המשפט לא אומר כלום. $\sin x$ על
    $\mathbb{R}$ מקבלת מקסימום, ו-$x$ על $(0,1)$ לא.
  remedy: { lesson: '4.4', label: 'מה משתבש בלי ההנחות' }

- id: MC-image-endpoints
  title: חושבים שהתמונה של קטע היא הקטע שבין הערכים בקצוות
  belief: >-
    $f([a,b])$ הוא הקטע שבין $f(a)$ ל-$f(b)$, והמקסימום והמינימום מתקבלים בקצוות.
  truth: >-
    התמונה היא $[m,M]$, כש-$m$ ו-$M$ הם המינימום והמקסימום **בכל** הקטע, והם יכולים להתקבל בפנים. רק
    לפונקציה מונוטונית הם בקצוות.
  remedy: { lesson: '4.4', label: 'התמונה של קטע סגור' }

- id: MC-open-maps-to-open
  title: חושבים שפונקציה רציפה מעבירה קטע פתוח לקטע פתוח
  belief: >-
    התמונה של קטע פתוח תחת פונקציה רציפה היא קטע פתוח, ושל קטע סגור היא קטע סגור "מאותו סוג".
  truth: >-
    רק "סגור וחסום" נשמר. התמונה של קטע פתוח היא קטע, מכל סוג: $\frac{1+\sin 2\pi x}{2}$ מעבירה את
    $(0,1)$ ל-$[0,1]$, ופונקציה קבועה מעבירה אותו לנקודה.
  remedy: { lesson: '4.4', label: 'התמונה של קטע סגור' }

- id: MC-weierstrass-without-continuity
  title: מפעילים את משפט ויירשטראס בלי רציפות בכל הקטע
  belief: >-
    כל פונקציה על קטע סגור חסומה, או שמספיקה רציפות בכל נקודה פרט לאחת.
  truth: >-
    המשפט דורש רציפות בכל נקודה של $[a,b]$, כולל הקצוות. $\frac1x$ על $(0,1]$ עם הערך 0 ב-0 מוגדרת על
    $[0,1]$ ואינה חסומה.
  remedy: { lesson: '4.4', label: 'מה משתבש בלי רציפות' }

- id: MC-image-of-closed-any-interval
  title: חושבים שהתמונה של קטע סגור יכולה להיות כל קטע
  belief: >-
    פונקציה רציפה יכולה להעביר את $[a,b]$ לקטע פתוח, או לקטע לא חסום.
  truth: >-
    לפי ויירשטראס וערך הביניים יחד, התמונה של $[a,b]$ היא בדיוק $[m,M]$: קטע **סגור וחסום** (אולי נקודה
    אחת).
  remedy: { lesson: '4.4', label: 'התמונה של קטע סגור' }

- id: MC-positive-function-inf-positive
  title: חושבים שפונקציה חיובית חסומה מלרע במספר חיובי
  belief: >-
    אם $f(x)>0$ לכל $x$, יש $c>0$ עם $f(x)\ge c$ לכל $x$, כי האינפימום של מספרים חיוביים חיובי.
  truth: >-
    האינפימום של מספרים חיוביים יכול להיות 0: $x$ על $(0,1]$. חסם מלרע חיובי מובטח כשהאינפימום **מתקבל**,
    למשל לפונקציה רציפה על קטע סגור (ויירשטראס).
  remedy: { lesson: '4.4', label: 'משפט ויירשטראס השני' }
