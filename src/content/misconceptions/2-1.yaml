# Misconceptions first detected in lesson 2.1 (sequences: boundedness and monotonicity).
- id: MC-sequence-is-set
  title: מזהים סדרה עם קבוצת הערכים שלה
  belief: >-
    סדרה היא הקבוצה $\{a_1, a_2, \dots\}$: הסדר לא חשוב, ואיבר לא יכול לחזור.
  truth: >-
    סדרה היא פונקציה $a:\mathbb{N}\to\mathbb{R}$. הסדר נקבע על ידי $n$ וערכים יכולים לחזור:
    $(-1)^n$ ו-$(-1)^{n+1}$ הן שתי סדרות שונות עם אותה קבוצת ערכים $\{-1, 1\}$.
  remedy: { lesson: '2.1', label: 'סדרה כפונקציה על הטבעיים' }

- id: MC-sequence-needs-formula
  title: חושבים שלסדרה חייבת להיות נוסחה
  belief: >-
    סדרה נתונה רק בנוסחה מפורשת של $n$; כלל במילים או ברקורסיה אינו מגדיר סדרה.
  truth: >-
    כל כלל שמתאים לכל $n\in\mathbb{N}$ מספר ממשי אחד מגדיר סדרה: נוסחה, רקורסיה, או תיאור במילים כמו "הספרה
    ה-$n$-ית של $\pi$".
  remedy: { lesson: '2.1', label: 'שלוש דרכים לתאר סדרה' }

- id: MC-sequence-index-shift
  title: זזים מקום אחד באינדקס של סדרה
  belief: >-
    אין הבדל אם הסדרה מתחילה ב-$a_0$ או ב-$a_1$, ואפשר לספור צעדי רקורסיה בלי לבדוק מאיזה איבר מתחילים.
  truth: >-
    כאן $\mathbb{N} = \{1, 2, 3, \dots\}$ והסדרה מתחילה ב-$a_1$. כדי להגיע מ-$a_1$ ל-$a_n$ צריך $n-1$ צעדי רקורסיה,
    ונוסחה מפורשת נבדקת קודם על $n=1$.
  remedy: { lesson: '2.1', label: 'רקורסיה ונוסחה מפורשת' }

- id: MC-formula-from-first-terms
  title: מסיקים נוסחה מהתאמה לאיברים הראשונים בלבד
  belief: >-
    אם נוסחה נותנת את האיבר הראשון (או את כמה הראשונים), היא הנוסחה של הסדרה.
  truth: >-
    התאמה לכמה איברים היא השערה. נוסחה לסדרה רקורסיבית מוכחים באינדוקציה: היא נכונה ל-$n=1$, ואם היא נכונה
    ל-$a_n$ אז כלל הרקורסיה נותן אותה גם ל-$a_{n+1}$.
  remedy: { lesson: '2.1', label: 'מהשערה להוכחה באינדוקציה' }

- id: MC-bound-depends-on-n
  title: בוחרים חסם שתלוי במקום בסדרה
  belief: >-
    "לכל $n$ קיים $M$ כך ש-$|a_n|\le M$" אומר שהסדרה חסומה.
  truth: >-
    זה נכון לכל סדרה ($M = |a_n|+1$). חסימות דורשת $M$ אחד לכל האיברים: $\exists M\ \forall n:\ |a_n|\le M$.
    סדר הכמתים קובע.
  remedy: { lesson: '2.1', label: 'הגדרת סדרה חסומה' }

- id: MC-bounded-means-above
  title: חושבים ש"חסומה" פירושו חסומה מלעיל
  belief: >-
    סדרה שיש לה חסם מלעיל (או רק חסם מלרע) היא סדרה חסומה.
  truth: >-
    חסומה פירושו חסומה מלעיל וגם מלרע, כלומר יש $M$ עם $|a_n|\le M$ לכל $n$. הסדרה $-n$ חסומה מלעיל ואינה
    חסומה.
  remedy: { lesson: '2.1', label: 'חסם מלעיל, חסם מלרע וחסימות' }

- id: MC-monotone-eventually
  title: קוראים לסדרה מונוטונית כשהיא מונוטונית רק מנקודה מסוימת
  belief: >-
    סדרה שעולה החל ממקום מסוים היא סדרה עולה.
  truth: >-
    עולה פירושו $a_{n+1}\ge a_n$ **לכל** $n$. הסדרה $n^2-6n$ יורדת עד $n=3$ ועולה משם, ולכן אינה מונוטונית.
    "עולה החל מ-$N$" היא טענה אחרת, ולפעמים היא כל מה שצריך.
  remedy: { lesson: '2.1', label: 'הגדרת סדרה מונוטונית' }

- id: MC-monotone-weak-strict
  title: מבלבלים בין עולה (או יורדת) לבין עולה ממש
  belief: >-
    מנה $\frac{a_{n+1}}{a_n}\le 1$ מוכיחה שהסדרה יורדת ממש, ויורדת ויורדת ממש הם אותו דבר.
  truth: >-
    יורדת היא $a_{n+1}\le a_n$, ויורדת ממש היא $a_{n+1}<a_n$. בסדרה $\frac{n}{2^n}$ מתקיים $a_1 = a_2$: היא
    יורדת, אבל לא ממש. ומנה קטנה מ-1 מעידה על ירידה רק כשהאיברים חיוביים.
  remedy: { lesson: '2.1', label: 'עולה ועולה ממש' }

- id: MC-increasing-means-unbounded
  title: חושבים שסדרה עולה אינה חסומה
  belief: >-
    סדרה שגדלה כל הזמן (או שהמונה שלה גדל בלי הגבלה) אינה חסומה.
  truth: >-
    עלייה אינה גוררת אי-חסימות: $\frac{n}{n+1}$ עולה ממש וכל איבריה קטנים מ-1. כדי להוכיח אי-חסימות מראים
    שלכל $M$ יש איבר גדול ממנו.
  remedy: { lesson: '2.1', label: 'סדרה עולה וחסומה' }

- id: MC-unbounded-from-samples
  title: מוכיחים אי-חסימות בכמה דוגמאות
  belief: >-
    אם כמה איברים גדולים מאוד, או אם $1000$ אינו חסם, הסדרה אינה חסומה.
  truth: >-
    אי-חסימות היא $\forall M>0\ \exists n:\ |a_n|>M$. צריך טיעון שעובד לכל $M$, בדרך כלל בנוסחה ל-$n$ כפונקציה
    של $M$.
  remedy: { lesson: '2.1', label: 'הוכחה שסדרה אינה חסומה' }

- id: MC-monotone-wrong-bound
  title: מבלבלים איזה חסם צריך לסדרה מונוטונית
  belief: >-
    סדרה יורדת שחסומה מלעיל היא חסומה.
  truth: >-
    סדרה יורדת חסומה מלעיל תמיד, על ידי $a_1$. היא חסומה אם ורק אם היא חסומה מלרע; $-n$ יורדת ואינה חסומה.
    באותו אופן, סדרה עולה חסומה אם ורק אם היא חסומה מלעיל.
  remedy: { lesson: '2.1', label: 'סדרות מונוטוניות וחסמים' }

- id: MC-plot-proves
  title: מסיקים מהשרטוט של האיברים הראשונים במקום להוכיח
  belief: >-
    אם בגרף של האיברים הראשונים הסדרה עולה, או חסומה, זו התכונה של הסדרה כולה.
  truth: >-
    שרטוט מראה מספר סופי של איברים ונותן השערה בלבד. $\frac{n^{10}}{2^n}$ עולה בעשרת האיברים הראשונים, אבל
    יורדת החל מ-$n=14$ וחסומה.
  remedy: { lesson: '2.1', label: 'מהשרטוט להשערה' }

- id: MC-monotone-by-absolute-value
  title: מסיקים מונוטוניות מהערך המוחלט של האיברים
  belief: >-
    אם $|a_n|$ יורדת, כלומר האיברים מתקרבים לאפס בכל צעד, הסדרה $a_n$ יורדת.
  truth: >-
    מונוטוניות היא תכונה של $a_n$ עצמה. $\frac{(-1)^n}{n}$ מתקרבת לאפס בכל צעד, אבל קופצת מצד לצד: $a_1<a_2$
    ו-$a_2>a_3$, ולכן אינה מונוטונית.
  remedy: { lesson: '2.1', label: 'הגדרת סדרה מונוטונית' }
