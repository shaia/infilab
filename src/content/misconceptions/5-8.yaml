# Misconceptions first detected in lesson 5.8 (extreme points).
- id: MC-second-test-zero-no-extremum
  title: מסיקים מנגזרת שנייה אפס שאין קיצון
  belief: >-
    אם $f'(x_0)=0$ ו-$f''(x_0)=0$, מבחן הנגזרת השנייה מראה שאין ב-$x_0$ קיצון; ובמקסימום תמיד $f''<0$.
  truth: >-
    כש-$f''(x_0)=0$ המבחן אינו מכריע: $x^4$ (מינימום), $-x^4$ (מקסימום) ו-$x^3$ (אין קיצון) מקיימות כולן
    $f'(0)=f''(0)=0$. חוזרים למבחן הנגזרת הראשונה.
  remedy: { lesson: '5.8', label: 'מבחן הנגזרת השנייה ומתי הוא שותק' }

- id: MC-first-test-reversed
  title: הופכים בין מקסימום למינימום במבחן הנגזרת הראשונה
  belief: >-
    כש-$f'$ עוברת מחיובית לשלילית יש מינימום.
  truth: >-
    $f'>0$ ואחר כך $f'<0$ פירושו שהפונקציה עולה ואחר כך יורדת: מקסימום. מעבר מ-$-$ ל-$+$ הוא מינימום.
  remedy: { lesson: '5.8', label: 'מבחן הנגזרת הראשונה' }

- id: MC-extremum-point-for-value
  title: עונים בנקודת הקיצון כשנשאלים על ערך הקיצון
  belief: >-
    "המינימום של $f$" הוא ה-$x$ שבו הוא מתקבל.
  truth: >-
    נקודת הקיצון היא $x_0$; ערך הקיצון הוא $f(x_0)$. בבעיות מילוליות צריך לחזור לשאלה ולבדוק מה התבקש: הממד,
    השטח או הנפח.
  remedy: { lesson: '5.8', label: 'נקודת קיצון וערך קיצון' }

- id: MC-absolute-extrema-candidates
  title: בודקים רק חלק מהמועמדים למקסימום המוחלט
  belief: >-
    המקסימום המוחלט בקטע סגור מתקבל בנקודה שבה $f'=0$, ולכן אין צורך לבדוק את הקצוות.
  truth: >-
    בקטע סגור המועמדים הם הקצוות, הנקודות שבהן $f'=0$ והנקודות שבהן $f$ אינה גזירה. $x^4-8x^2$ ב-$[-1,3]$
    מקבלת את המקסימום $9$ בקצה $3$, לא במקסימום המקומי $0$.
  remedy: { lesson: '5.8', label: 'קיצון מוחלט בקטע סגור' }

- id: MC-extremum-existence-assumed
  title: מניחים שהמקסימום המוחלט קיים
  belief: >-
    לכל פונקציה רציפה יש מקסימום ומינימום מוחלטים, ונשאר רק למצוא אותם.
  truth: >-
    הקיום מובטח רק בקטע סגור וחסום (ויירשטראס). בקטע פתוח צריך להוכיח אותו, למשל מתוך מונוטוניות: $x^2+\frac{16}{x}$
    ב-$(0,\infty)$ מקבלת מינימום ואין לה מקסימום.
  remedy: { lesson: '5.8', label: 'קיצון מוחלט בקטע פתוח' }

- id: MC-unique-critical-not-global
  title: חושבים שמינימום מקומי יחיד אינו בהכרח מוחלט
  belief: >-
    גם כשלפונקציה גזירה בקטע יש נקודה קריטית אחת בלבד והיא מינימום מקומי, ייתכן שבמקום אחר היא יורדת מתחת לו.
  truth: >-
    במשתנה אחד זה בלתי אפשרי: כדי לרדת מתחת ל-$f(c)$ הפונקציה הייתה צריכה לעלות ואז לרדת, ובאמצע הייתה נקודת
    מקסימום פנימית, כלומר נקודה קריטית שנייה.
  remedy: { lesson: '5.8', label: 'קיצון מוחלט בקטע פתוח' }

- id: MC-local-is-absolute
  title: חושבים שכל מינימום מקומי הוא מינימום מוחלט
  belief: >-
    אם מצאנו מינימום מקומי, הוא הערך הקטן ביותר של הפונקציה.
  truth: >-
    מקומי פירושו בסביבה קטנה בלבד: $x^3-3x$ מקבלת מינימום מקומי ב-$1$ ואינה חסומה מלרע. כדי לקבוע שהוא מוחלט
    צריך להשוות לכל המועמדים, או להשתמש ביחידות הנקודה הקריטית.
  remedy: { lesson: '5.8', label: 'קיצון מקומי וקיצון מוחלט' }

- id: MC-extremum-type-not-checked
  title: לוקחים נקודה קריטית בלי לבדוק את סוגה
  belief: >-
    הנקודה הקריטית הראשונה שמוצאים היא הקיצון שמחפשים.
  truth: >-
    נקודה קריטית יכולה להיות מינימום, מקסימום או אף אחד מהם. בבעיית המרחק בין $(0,3)$ לפרבולה $y=x^2$ הנקודה
    $x=0$ היא מקסימום מקומי של המרחק; צריך לסווג כל מועמד ולהשוות ערכים.
  remedy: { lesson: '5.8', label: 'בעיות קיצון מילוליות' }

- id: MC-square-trick-same-values
  title: חושבים שמזעור ריבוע המרחק נותן גם את ערך המרחק
  belief: >-
    $d=\sqrt D$ ו-$D$ הן "אותה בעיה", ולכן גם הערכים המינימליים והנגזרות שלהן שווים.
  truth: >-
    משותפת רק **נקודת** המינימום, כי $\sqrt t$ עולה ממש. הערך המינימלי של $d$ הוא שורש הערך המינימלי של $D$, ו-$d'=\frac{D'}{2\sqrt D}$.
  remedy: { lesson: '5.8', label: 'בעיות קיצון מילוליות' }
