# Misconceptions first detected in lesson 4.3 (the intermediate value theorem).
- id: MC-ivt-unique-root
  title: חושבים שמשפט ערך הביניים נותן שורש יחיד
  belief: >-
    אם $f(a)<0<f(b)$ ו-$f$ רציפה, יש ל-$f$ בדיוק שורש אחד ב-$(a,b)$; ולפולינום ממעלה אי-זוגית יש שורש ממשי אחד.
  truth: >-
    המשפט נותן **קיום**, לא יחידות ולא מספר. $x^3-x$ על $[-2,2]$ מחליפה סימן ויש לה שלושה שורשים. יחידות
    מוכיחים בנפרד, למשל ממונוטוניות ממש.
  remedy: { lesson: '4.3', label: 'משפט ערך הביניים: קיום, לא יחידות' }

- id: MC-ivt-converse
  title: הופכים את משפט ערך הביניים
  belief: >-
    אם לפונקציה רציפה יש שורש ב-$(a,b)$, אז $f(a)$ ו-$f(b)$ בסימנים הפוכים.
  truth: >-
    המשפט הוא גרירה בכיוון אחד. $x^2$ על $[-1,1]$ מתאפסת ב-0 בלי החלפת סימן בקצוות. כשאין החלפת סימן,
    המשפט פשוט לא אומר דבר.
  remedy: { lesson: '4.3', label: 'משפט ערך הביניים: מה הוא לא אומר' }

- id: MC-ivt-open-continuity-enough
  title: חושבים שמספיקה רציפות בקטע הפתוח
  belief: >-
    במשפט ערך הביניים מספיק ש-$f$ רציפה ב-$(a,b)$, ומוגדרת בקצוות.
  truth: >-
    צריך רציפות גם בקצוות. $f(0)=-1$ ו-$f(x)=1$ לכל $x\in(0,1]$ רציפה ב-$(0,1)$, מחליפה סימן בקצוות, ואין לה
    שורש.
  remedy: { lesson: '4.3', label: 'ההנחות של משפט ערך הביניים' }

- id: MC-ivt-sign-change-unchecked
  title: מפעילים את משפט ערך הביניים בלי לבדוק החלפת סימן
  belief: >-
    אפשר להסיק שורש בקטע בלי לחשב את הסימנים בקצוות, או מהחלפת סימן של פונקציה אחרת.
  truth: >-
    המסקנה דורשת שהפונקציה **שעליה מפעילים את המשפט** תהיה בסימנים הפוכים בשני הקצוות. מחשבים את שני
    הערכים במפורש; הקטע תלוי בפונקציה.
  remedy: { lesson: '4.3', label: 'קיום פתרון למשוואה' }

- id: MC-ivt-polynomials-only
  title: חושבים שמשפט ערך הביניים חל רק על פולינומים
  belief: >-
    המשפט מבטיח שורשים רק למשוואות פולינומיות, ולא למשוואות כמו $x=\cos x$.
  truth: >-
    המשפט חל על כל פונקציה רציפה בקטע סגור. $x-\cos x$ רציפה כהפרש של רציפות, ולכן המשפט חל עליה.
  remedy: { lesson: '4.3', label: 'קיום פתרון למשוואה' }

- id: MC-ivt-domain-irrelevant
  title: מפעילים את משפט ערך הביניים כשהתחום אינו קטע
  belief: >-
    המשפט (או משפט נקודת השבת) נכון לכל פונקציה רציפה, בלי קשר לתחום: גם על איחוד של קטעים, על קטע
    פתוח או על הרציונליים.
  truth: >-
    המשפט דורש קטע סגור של ממשיים. על $[0,1]\cup[2,3]$ פונקציה רציפה יכולה לדלג על ערכים, על הרציונליים
    $x^2-2$ אינה מתאפסת, ו-$\frac x2$ על $(0,1)$ אין לה נקודת שבת.
  remedy: { lesson: '4.3', label: 'כשהתחום אינו קטע' }

- id: MC-ivt-no-continuity-needed
  title: מפעילים את משפט ערך הביניים על פונקציה שאינה רציפה
  belief: >-
    אם $f(a)<0<f(b)$, יש ל-$f$ שורש בין $a$ ל-$b$, גם אם $f$ קופצת.
  truth: >-
    בלי רציפות הפונקציה יכולה לדלג על 0: $f=-1$ משמאל ל-0 ו-$f=1$ מ-0 והלאה. רציפות בכל הקטע היא הנחה
    הכרחית.
  remedy: { lesson: '4.3', label: 'ההנחות של משפט ערך הביניים' }

- id: MC-ivt-property-implies-continuous
  title: חושבים שתכונת ערך הביניים גוררת רציפות
  belief: >-
    פונקציה שמקבלת כל ערך ביניים בכל קטע חייבת להיות רציפה.
  truth: >-
    המשפט הוא גרירה בכיוון אחד. $\sin\frac1x$ עם הערך 0 ב-0 מקבלת כל ערך ביניים ואינה רציפה ב-0: יש לה שם
    אי-רציפות מסוג שני.
  remedy: { lesson: '4.3', label: 'תכונת ערך הביניים בלי רציפות' }
