# Misconceptions first detected in lesson 3.1 (real functions).
- id: MC-domain-from-simplified-formula
  title: קובעים את תחום ההגדרה אחרי שמפשטים את הנוסחה
  belief: >-
    הפונקציה $\frac{x^2-1}{x-1}$ היא $x+1$, ולכן היא מוגדרת על כל הישר.
  truth: >-
    תחום ההגדרה הטבעי נקבע מהנוסחה כפי שנכתבה, לפני כל צמצום: אסור לחלק באפס ואסור להוציא שורש ממספר
    שלילי. $\frac{x^2-1}{x-1}$ ו-$x+1$ הן שתי פונקציות שונות: הן שוות על $\mathbb{R}\setminus\{1\}$,
    אבל לראשונה אין ערך ב-1.
  remedy: { lesson: '3.1', label: 'תחום ההגדרה הטבעי' }

- id: MC-domain-excludes-numerator-zeros
  title: מוציאים מתחום ההגדרה את האפסים של המונה
  belief: >-
    מנה אינה מוגדרת בכל נקודה שבה המונה או המכנה מתאפסים.
  truth: >-
    רק אפס במכנה אסור. מונה שמתאפס נותן ערך אפס, שהוא ערך לגיטימי: $\frac{x^2-1}{x-1}$ מוגדרת ב-$x=-1$
    ושווה שם אפס.
  remedy: { lesson: '3.1', label: 'תחום ההגדרה הטבעי' }

- id: MC-piecewise-boundary-point
  title: בנקודת התפר של פונקציה מוגדרת למקוטעין לוקחים את הענף הלא נכון
  belief: >-
    בנקודה שבה מתחלפת הנוסחה אפשר להציב בכל אחד משני הענפים, או שיש לגרף שם שתי נקודות.
  truth: >-
    לכל $x$ בתחום יש ערך אחד בדיוק: זה של הענף שהתנאי שלו כולל את $x$. בשרטוט, עיגול מלא מסמן את הנקודה
    ששייכת לגרף ועיגול ריק נקודה שאינה שייכת לו.
  remedy: { lesson: '3.1', label: 'פונקציות מוגדרות למקוטעין' }

- id: MC-function-even-or-odd
  title: חושבים שכל פונקציה היא זוגית או אי-זוגית
  belief: >-
    פונקציה שאינה זוגית היא אי-זוגית, ולהפך.
  truth: >-
    רוב הפונקציות אינן זוגיות ואינן אי-זוגיות: עבור $f(x)=x+1$ מתקיים $f(-1)=0$ ו-$f(1)=2$, ולכן
    $f(-1)\neq f(1)$ וגם $f(-1)\neq -f(1)$. כל פונקציה על תחום סימטרי היא **סכום** של פונקציה זוגית ופונקציה
    אי-זוגית, אבל זה דבר אחר.
  remedy: { lesson: '3.1', label: 'פונקציות זוגיות ואי-זוגיות' }

- id: MC-monotone-from-samples
  title: מסיקים מונוטוניות מערכים בכמה נקודות
  belief: >-
    אם $f(1)<f(2)<f(3)<\dots$, הפונקציה עולה.
  truth: >-
    מונוטוניות היא טענה על **כל** זוג נקודות $x<y$ בתחום, לא רק על הנקודות השלמות. הפונקציה
    $x+\sin(2\pi x)$ שווה ל-$n$ בכל $n$ שלם, ובכל זאת $f(1.25)=2.25$ גדול מ-$f(1.75)=0.75$.
  remedy: { lesson: '3.1', label: 'פונקציות מונוטוניות' }

- id: MC-bounded-attains-bounds
  title: חושבים שחסם של פונקציה חייב להתקבל
  belief: >-
    פונקציה חסומה מקבלת ערך מקסימלי וערך מינימלי, או שפונקציה שמתקרבת לערך בלי להגיע אליו אינה חסומה.
  truth: >-
    חסומה פירושו שיש $M$ עם $|f(x)|\le M$ לכל $x$, בלי דרישה שהחסם יתקבל. $\frac{1}{1+x^2}$ חסומה בין 0
    ל-1, מקבלת את 1 ב-$x=0$, ואת 0 אינה מקבלת אף פעם: האינפימום שלה 0 ואין לה מינימום.
  remedy: { lesson: '3.1', label: 'פונקציות חסומות' }

- id: MC-periodic-has-least-period
  title: חושבים שלכל פונקציה מחזורית יש מחזור חיובי קטן ביותר
  belief: >-
    אם $f$ מחזורית, יש לה "המחזור": המספר החיובי הקטן ביותר $T$ עם $f(x+T)=f(x)$.
  truth: >-
    לפונקציה קבועה כל מספר חיובי הוא מחזור, ולכן אין מחזור קטן ביותר. גם לפונקציית דיריכלה (שיעור 3.2) כל
    רציונלי חיובי הוא מחזור. כשאומרים "המחזור של $\sin$" מתכוונים ל-$2\pi$, המחזור הקטן ביותר, שקיים במקרה
    הזה.
  remedy: { lesson: '3.1', label: 'פונקציות מחזוריות' }

- id: MC-composition-domain-one-function
  title: קובעים את התחום של הרכבה לפי פונקציה אחת בלבד
  belief: >-
    התחום של $f\circ g$ הוא התחום של $g$, או התחום של $f$, או החיתוך שלהם.
  truth: >-
    התחום של $f\circ g$ הוא $\{x\in D_g : g(x)\in D_f\}$: צריך ש-$g(x)$ יהיה מוגדר, **וגם** שהערך שלו יהיה
    בתחום של $f$. עבור $\sqrt{1-x^2}$ התשובה היא $[-1,1]$, לא $\mathbb{R}$ ולא $[0,\infty)$.
  remedy: { lesson: '3.1', label: 'הרכבה של פונקציות ותחומה' }

- id: MC-inverse-wrong-order
  title: מבטלים את הפעולות באותו סדר שבו בוצעו
  belief: >-
    כדי להפוך את $2x+3$ מבטלים את הכפל ב-2 ואחר כך את ההוספה של 3, ומקבלים $\frac{x}{2}-3$; או שהופכים
    כל פעולה ומקבלים $2x-3$.
  truth: >-
    פעולה אחרונה מתבטלת ראשונה: $f$ כופלת ב-2 ואחר כך מוסיפה 3, ולכן $f^{-1}$ מחסירה 3 ואחר כך מחלקת ב-2:
    $f^{-1}(y)=\frac{y-3}{2}$. בודקים תמיד: $f(f^{-1}(y))=y$.
  remedy: { lesson: '3.1', label: 'הפונקציה ההפוכה' }

