# Misconceptions first detected in lesson 1.2 (the order axioms).
- id: MC-order-just-a-ranking
  title: חושבים שסדר על שדה הוא סתם דירוג של האיברים
  belief: >-
    כדי שיהיה לשדה סדר מספיק לדרג את האיברים בשורה, למשל $0<1<2<3<4$ ב-$\mathbb{Z}_5$; ואם אי אפשר לשים את
    האיברים על ישר, אין סדר.
  truth: >-
    סדר של שדה חייב לקיים גם את אקסיומות החיבור והכפל: $a<b \Rightarrow a+c<b+c$, ו-$a<b,\ c>0 \Rightarrow
    ac<bc$. השאלה היא אם יש דירוג שמתאים לפעולות, ובודקים אותה באקסיומות.
  remedy: { lesson: '1.2', anchor: 'ordered-field', label: 'אקסיומות הסדר: הקשר לחיבור ולכפל' }

- id: MC-order-minus-x-negative
  title: חושבים ש-מינוס x הוא תמיד מספר שלילי
  belief: >-
    $-x$ שלילי תמיד, כי יש לפניו מינוס; לכן $|x|$ לעולם אינו שווה ל-$-x$.
  truth: >-
    $-x$ הוא הנגדי של $x$. "שלילי" פירושו "קטן מאפס", ו-$-x$ שלילי בדיוק כש-$x$ חיובי. כש-$x=-3$,
    $-x=3$.
  remedy: { lesson: '1.2', anchor: 'abs-order', label: 'ערך מוחלט: ההגדרה בשני מקרים' }

- id: MC-every-field-ordered
  title: חושבים שאפשר לסדר כל שדה
  belief: >-
    על כל שדה, גם $\mathbb{C}$, אפשר להגדיר סדר שמקיים את האקסיומות; למשל לפי החלק הממשי ואחריו המדומה.
  truth: >-
    בשדה סדור כל ריבוע של איבר שונה מאפס חיובי, ולכן $-1$ אינו ריבוע. ב-$\mathbb{C}$ מתקיים $i^2=-1$, ולכן
    אין עליו סדר כזה; גם $\mathbb{Z}_5$ אינו סדור.
  remedy: { lesson: '1.2', anchor: 'no-order', label: 'שדות שאי אפשר לסדר' }

- id: MC-order-flip-negative-factor
  title: כופלים אי-שוויון במספר שלילי בלי להפוך את הכיוון
  belief: >-
    אם $a<b$ אז $ac<bc$ לכל $c$; או להפך, שאסור בכלל לכפול אי-שוויון בביטוי שסימנו לא ידוע מראש.
  truth: >-
    כפל במספר חיובי שומר על הכיוון, כפל בשלילי הופך אותו, וכפל באפס נותן שוויון. כשהסימן לא ידוע, מפצלים
    למקרים.
  remedy: { lesson: '1.2', anchor: 'sign-rules', label: 'מניפולציות על אי-שוויונות' }

- id: MC-order-multiply-unsigned
  title: כופלים שני אי-שוויונות בלי לבדוק סימנים
  belief: >-
    מ-$a<b$ ו-$c<d$ נובע $ac<bd$, כמו שבחיבור מותר לחבר אי-שוויונות.
  truth: >-
    כפל אי-שוויונות מותר כשכל הגורמים חיוביים: $0<a<b$ ו-$0<c<d$ נותנים $ac<bd$. בלי זה הטענה נכשלת, למשל
    $a=c=-2$, $b=d=-1$.
  remedy: { lesson: '1.2', anchor: 'multiply-inequalities', label: 'מניפולציות על אי-שוויונות: כפל' }

- id: MC-order-subtract-inequalities
  title: מחסרים אי-שוויונות באותו כיוון
  belief: >-
    מ-$a<b$ ו-$c<d$ נובע $a-c<b-d$, כמו שמותר לחבר אותם.
  truth: >-
    מותר לחבר אי-שוויונות באותו כיוון. לחסר מותר רק אחרי שהופכים את השני: מ-$c<d$ נובע $-d<-c$, ואז
    $a-d<b-c$.
  remedy: { lesson: '1.2', anchor: 'add-inequalities', label: 'מניפולציות על אי-שוויונות: חיסור' }

- id: MC-order-reciprocal-flip
  title: חושבים שמעבר להופכי תמיד הופך את אי-השוויון
  belief: >-
    לכל $a,b\neq0$: אם $a<b$ אז $\frac1a>\frac1b$.
  truth: >-
    $\frac1a-\frac1b=\frac{b-a}{ab}$, ולכן הכיוון מתהפך רק כש-$ab>0$. כש-$a<0<b$ מתקיים $\frac1a<0<\frac1b$.
  remedy: { lesson: '1.2', anchor: 'reciprocal', label: 'אי-שוויונות עם הופכיים' }

- id: MC-order-only-sqrt-minus-one
  title: חושבים ששדה אי אפשר לסדר רק כשיש בו שורש של מינוס אחת
  belief: >-
    אם בשדה אין איבר $i$ עם $i^2=-1$, אז אפשר לסדר אותו; משפט 1.2.9 הוא הסיבה היחידה לכך ששדה אינו סדור.
  truth: >-
    משפט 1.2.9 נותן תנאי מספיק, לא הכרחי. ב-$\mathbb{Z}_3$ אין איבר שריבועו $-1=2$ (הריבועים הם $0,1,1$),
    ובכל זאת אי אפשר לסדר אותו: לפי מסקנה 1.2.10, בשדה סדור $1+1+1>0$, וב-$\mathbb{Z}_3$ הסכום הזה הוא $0$.
  remedy: { lesson: '1.2', anchor: 'char-positive', label: 'שדות שאי אפשר לסדר: סכומים של אחדים' }
