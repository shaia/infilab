# Misconceptions first detected in lesson 5.1 (the definition of the derivative).
- id: MC-deriv-symmetric-quotient
  title: מחליפים את מנת ההפרשים במנה הסימטרית
  belief: >-
    אם $\lim_{h\to0}\frac{f(x_0+h)-f(x_0-h)}{2h}$ קיים, אז $f$ גזירה ב-$x_0$ והנגזרת שווה לגבול הזה; או: הנגזרת
    היא הממוצע של שתי הנגזרות החד-צדדיות.
  truth: >-
    כש-$f$ גזירה, המנה הסימטרית אכן שואפת ל-$f'(x_0)$, אבל לא להפך: עבור $|x|$ ב-0 המנה הסימטרית היא 0 לכל
    $h$, ו-$|x|$ אינה גזירה ב-0. ההגדרה היא הגבול של $\frac{f(x_0+h)-f(x_0)}{h}$.
  remedy: { lesson: '5.1', label: 'הגדרת הנגזרת: הגבול של מנת ההפרשים' }

- id: MC-deriv-numerator-limit
  title: מבלבלים בין הגבול של ההפרש לבין הנגזרת
  belief: >-
    הנגזרת היא $\lim_{h\to0}\left(f(x_0+h)-f(x_0)\right)$, ולכן רציפות וגזירות הן אותו דבר.
  truth: >-
    הגבול של ההפרש הוא 0 לכל פונקציה רציפה: זו הגדרת הרציפות. הנגזרת היא הגבול של ההפרש **חלקי $h$**, שיפוע,
    והוא יכול לא להתקיים גם כשההפרש שואף ל-0.
  remedy: { lesson: '5.1', label: 'הגדרת הנגזרת: מנת ההפרשים' }

- id: MC-deriv-fixed-h-is-derivative
  title: חושבים שמנת ההפרשים עם h קבוע היא הנגזרת
  belief: >-
    מנת ההפרשים $\frac{f(x_0+h)-f(x_0)}{h}$ עם $h$ נתון, למשל $h=0.1$, שווה ל-$f'(x_0)$.
  truth: >-
    עם $h$ קבוע המנה היא שיפוע של מיתר. הנגזרת היא הגבול שלה כש-$h\to0$. עבור $x^3$ ב-1 המנה היא
    $3+3h+h^2$, ורק הגבול שלה הוא 3.
  remedy: { lesson: '5.1', label: 'הגדרת הנגזרת: ממיתר למשיק' }

- id: MC-tangent-line-formula
  title: כותבים את משוואת המשיק בלי הנקודה שעליה הוא עובר
  belief: >-
    המשיק בנקודה $x_0$ הוא $y=f'(x_0)(x-x_0)$, או $y=f(x_0)+f'(x_0)\,x$.
  truth: >-
    המשיק הוא הישר שעובר בנקודה $(x_0, f(x_0))$ ושיפועו $f'(x_0)$: $y=f(x_0)+f'(x_0)(x-x_0)$. כדאי לבדוק
    תמיד שהצבת $x=x_0$ נותנת $f(x_0)$.
  remedy: { lesson: '5.1', label: 'משוואת המשיק' }

- id: MC-tangent-touches-once
  title: חושבים שמשיק פוגש את הגרף בנקודה אחת בלבד
  belief: >-
    המשיק לגרף בנקודה נוגע בגרף רק בנקודה הזו ואינו חותך אותו, וכל ישר שפוגש את הגרף בנקודה אחת הוא משיק.
  truth: >-
    המשיק מוגדר בשיפוע שלו, כגבול של שיפועי מיתרים. המשיק ל-$x^3$ ב-1, $y=3x-2$, פוגש את הגרף גם ב-$x=-2$;
    המשיק ל-$x^3$ ב-0 חוצה את הגרף; והישר $y=\frac x2$ פוגש את $|x|$ רק ב-0 ואינו משיק.
  remedy: { lesson: '5.1', label: 'המשיק כגבול של מיתרים' }

- id: MC-continuous-implies-differentiable
  title: חושבים שפונקציה רציפה גזירה
  belief: >-
    אם $f$ רציפה ב-$x_0$ היא גזירה שם, כי גזירות ורציפות הולכות יחד.
  truth: >-
    גזירה גוררת רציפה, אבל לא להפך. $|x|$ רציפה ב-0 ואינה גזירה שם (פינה), וגם $x\sin\frac1x$ רציפה ב-0
    ואינה גזירה שם (תנודות).
  remedy: { lesson: '5.1', label: 'גזירה גוררת רציפה, ולא להפך' }

- id: MC-onesided-equals-derivative
  title: חושבים שנגזרת חד-צדדית מספיקה לגזירות
  belief: >-
    אם קיימת נגזרת מימין (או ששתי הנגזרות החד-צדדיות קיימות), הפונקציה גזירה בנקודה.
  truth: >-
    $f$ גזירה ב-$x_0$ אם ורק אם שתי הנגזרות החד-צדדיות קיימות, סופיות **ושוות**. ל-$|x|$ ב-0 הן 1 ומינוס 1,
    ולכן אין נגזרת.
  remedy: { lesson: '5.1', label: 'נגזרות חד-צדדיות' }

- id: MC-differentiable-point-vs-neighbourhood
  title: קושרים גזירות בנקודה להתנהגות בנקודות אחרות
  belief: >-
    פונקציה שאינה רציפה ליד $x_0$ אינה יכולה להיות גזירה ב-$x_0$; ופונקציה שגזירה ב-$x_0$ גזירה, או לפחות
    רציפה, גם בסביבה שלו.
  truth: >-
    גזירות היא תכונה של נקודה אחת. הפונקציה ששווה ל-$x^2$ על הרציונליים ול-0 על האי-רציונליים גזירה ב-0
    (הנגזרת 0) ואינה רציפה באף נקודה אחרת.
  remedy: { lesson: '5.1', label: 'גזירות בנקודה אחת' }

