# Misconceptions first detected in lesson 2.10 (Cauchy sequences).
- id: MC-cauchy-consecutive-terms
  title: חושבים שמספיק שהפרש בין איברים עוקבים ישאף לאפס
  belief: >-
    אם $a_{n+1}-a_n\to0$ (או $a_{n+p}-a_n\to0$ לכל $p$ קבוע), הסדרה היא סדרת קושי ולכן מתכנסת.
  truth: >-
    תנאי קושי דורש ש-$|a_m-a_n|$ יהיה קטן לכל זוג $m,n>N$, גם כשהמרחק בין $m$ ל-$n$ גדל. $\sqrt n$ מקיימת
    $\sqrt{n+1}-\sqrt n\to0$, אבל $\sqrt{4n}-\sqrt n=\sqrt n\to\infty$; גם הסכומים החלקיים של $\frac1k$ מתבדרים.
  remedy: { lesson: '2.10', label: 'תנאי קושי: כל זוג, לא רק עוקבים' }

- id: MC-cauchy-mentions-limit
  title: חושבים שכדי להשתמש בתנאי קושי צריך לדעת את הגבול
  belief: >-
    תנאי קושי הוא הגדרת הגבול בניסוח אחר, ולכן גם בו צריך מועמד $L$; בלי לדעת את הגבול אי אפשר להוכיח התכנסות.
  truth: >-
    תנאי קושי מדבר רק על איברי הסדרה זה מול זה: $|a_m-a_n|<\varepsilon$. בזכותו מוכיחים התכנסות של סדרות
    שאת גבולן לא יודעים לכתוב, כמו $\sum_{k=1}^{n}\frac1{k^2}$.
  remedy: { lesson: '2.10', label: 'תנאי קושי לעומת הגדרת הגבול' }

- id: MC-cauchy-converges-in-rationals
  title: חושבים שסדרת קושי מתכנסת בכל מערכת מספרים
  belief: >-
    ההוכחה שסדרת קושי מתכנסת לא משתמשת בשום תכונה מיוחדת של הממשיים, ולכן היא נכונה גם ברציונליים.
  truth: >-
    ההוכחה עוברת דרך בולצאנו-ויירשטראס, שנשען על אקסיומת השלמות. ברציונליים הקירובים העשרוניים
    $1,\ 1.4,\ 1.41,\ 1.414,\dots$ של $\sqrt2$ הם סדרת קושי בלי גבול רציונלי.
  remedy: { lesson: '2.10', label: 'קושי ושלמות' }

- id: MC-cauchy-weaker-in-reals
  title: חושבים שיש סדרות קושי ממשיות שאינן מתכנסות
  belief: >-
    תנאי קושי חלש מהתכנסות: כל סדרה מתכנסת היא סדרת קושי, אבל יש סדרות קושי ממשיות שמתבדרות.
  truth: >-
    בממשיים שני התנאים שקולים: סדרה מתכנסת אם ורק אם היא סדרת קושי. ההבדל הוא רק בניסוח: תנאי קושי לא מזכיר
    את הגבול.
  remedy: { lesson: '2.10', label: 'מתכנסת אם ורק אם קושי' }
