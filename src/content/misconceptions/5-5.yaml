# Misconceptions first detected in lesson 5.5 (Fermat's theorem and Rolle's theorem).
- id: MC-fermat-endpoint
  title: מפעילים את משפט פרמה בקצה של קטע
  belief: >-
    בכל נקודת קיצון של פונקציה גזירה הנגזרת מתאפסת, גם כשהנקודה היא קצה של הקטע שעליו מסתכלים.
  truth: >-
    פרמה דורש נקודה **פנימית**: ההוכחה משווה את מנת ההפרשים משני הצדדים. $x$ על $[0,1]$ מקבלת מקסימום ב-1,
    והנגזרת שם היא 1. לכן בקטע סגור בודקים את הקצוות בנפרד.
  remedy: { lesson: '5.5', label: 'משפט פרמה: נקודה פנימית' }

- id: MC-rolle-open-continuity
  title: מסתפקים ברציפות או בגזירות בקטע הפתוח במשפט רול
  belief: >-
    אם $f$ גזירה ב-$(a,b)$ ו-$f(a)=f(b)$, משפט רול חל; הרציפות בקצוות לא משנה.
  truth: >-
    רול דורש רציפות בקטע **הסגור** $[a,b]$. $f(x)=x$ ב-$[0,1)$ עם $f(1)=0$ גזירה בקטע הפתוח ומקיימת $f(0)=f(1)$,
    ובכל זאת $f'=1$ בכל נקודה פנימית. ופונקציה שאינה מוגדרת בנקודה של הקטע, כמו $\frac{1}{x^2}$ ב-0, אינה רציפה בו.
  remedy: { lesson: '5.5', label: 'ההנחות של משפט רול' }

- id: MC-rolle-unique-c
  title: חושבים שמשפט רול נותן נקודה יחידה
  belief: >-
    משפט רול מבטיח נקודה **אחת** שבה $f'=0$; ואם ל-$f$ יש $k$ שורשים, ל-$f'$ יש בדיוק $k-1$.
  truth: >-
    רול נותן קיום בלבד: $\sin$ על $[0,4\pi]$ מקיימת את ההנחות, ו-$\cos$ מתאפסת בארבע נקודות. מ-$k$ שורשים של $f$
    נובעים **לפחות** $k-1$ שורשים של $f'$.
  remedy: { lesson: '5.5', label: 'משפט רול: קיום, לא יחידות' }

- id: MC-rolle-c-location
  title: חושבים שמשפט רול אומר איפה הנגזרת מתאפסת
  belief: >-
    הנקודה $c$ של רול היא אמצע הקטע, או נקודה מיוחדת אחרת שאפשר לקבוע מראש.
  truth: >-
    רול אומר רק ש-$c$ קיימת בתוך הקטע. עבור $(x-1)(x-2)(x-3)$ על $[1,2]$ הנקודה היא $2-\frac{1}{\sqrt3}$, לא
    $1.5$. כדי למצוא את $c$ פותרים $f'(c)=0$.
  remedy: { lesson: '5.5', label: 'משפט רול: קיום, לא מיקום' }

- id: MC-rolle-converse-injective
  title: חושבים שפונקציה גזירה וחד-חד-ערכית נגזרתה לא מתאפסת
  belief: >-
    אם $f$ גזירה וחד-חד-ערכית, אז $f'(x)\neq0$ לכל $x$; ולכן $x^3$ מפריכה את הטענה "נגזרת שאינה מתאפסת גוררת
    חד-חד-ערכיות".
  truth: >-
    $x^3$ חד-חד-ערכית ו-$f'(0)=0$, כלומר הטענה ההפוכה נכשלת. הטענה עצמה נכונה, מרול: אם $f(a)=f(b)$, הנגזרת
    מתאפסת ביניהן. דוגמה נגדית להפוכה אינה מפריכה את הטענה.
  remedy: { lesson: '5.5', label: 'רול וחד-חד-ערכיות' }

- id: MC-conclusion-implies-hypotheses
  title: מסיקים מכך שהמסקנה של משפט מתקיימת שגם ההנחות מתקיימות
  belief: >-
    אם הנגזרת מתאפסת בתוך הקטע, הפונקציה מקיימת את ההנחות של משפט רול.
  truth: >-
    משפט אומר "הנחות גוררות מסקנה", לא להפך. $x^2$ על $[-1,2]$ מקיימת $f'(0)=0$, ובכל זאת $f(-1)\neq f(2)$.
    את ההנחות בודקים אחת-אחת.
  remedy: { lesson: '5.5', label: 'ההנחות של משפט רול' }

- id: MC-critical-point-is-extremum
  title: חושבים שכל נקודה שבה הנגזרת מתאפסת היא נקודת קיצון
  belief: >-
    אם $f'(x_0)=0$, אז ב-$x_0$ יש מקסימום או מינימום מקומי (זה מה שמשפט פרמה אומר).
  truth: >-
    פרמה אומר רק שבקיצון פנימי $f'=0$; ההפך לא נכון. $x^3$ מקיימת $f'(0)=0$ ועולה ממש. נקודה קריטית היא מועמדת,
    ומכריעים לפי החלפת הסימן של $f'$.
  remedy: { lesson: '5.5', label: 'משפט פרמה: הכיוון ההפוך לא נכון' }

- id: MC-extremum-only-where-derivative-zero
  title: מחפשים קיצון רק בנקודות שבהן הנגזרת מתאפסת
  belief: >-
    נקודת קיצון מקומי חייבת להיות נקודה שבה $f'=0$.
  truth: >-
    קיצון יכול להיות גם בנקודה שבה $f$ אינה גזירה: $|x|$ ב-$0$, $\sqrt[3]{x^2}$ ב-$0$. המועמדים הם נקודות
    שבהן $f'=0$ ונקודות שבהן $f'$ לא קיימת.
  remedy: { lesson: '5.5', label: 'משפט פרמה: קיצון בנקודה שבה אין נגזרת' }
