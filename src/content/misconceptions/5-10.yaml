# Misconceptions first detected in lesson 5.10 (analysing a function).
- id: MC-vertical-asymptote-every-denominator-zero
  title: מציירים אסימפטוטה אנכית בכל נקודה שבה המכנה מתאפס
  belief: >-
    אם המכנה של $f$ מתאפס ב-$x_0$, הישר $x=x_0$ הוא אסימפטוטה אנכית.
  truth: >-
    $x=x_0$ אסימפטוטה אנכית רק אם לפחות אחד הגבולות החד-צדדיים ב-$x_0$ אינסופי. כשגם המונה מתאפס הגבול יכול להיות
    סופי: $\frac{x^2-1}{x^2-x}\to2$ כש-$x\to1$, וזו אי-רציפות סליקה.
  remedy: { lesson: '5.10', label: 'אסימפטוטות אנכיות' }

- id: MC-asymptote-never-crossed
  title: חושבים שגרף לא יכול לחתוך את האסימפטוטה שלו
  belief: >-
    אסימפטוטה היא ישר שהגרף מתקרב אליו ואף פעם לא נוגע בו.
  truth: >-
    אסימפטוטה אופקית או משופעת מוגדרת בגבול כש-$x\to\pm\infty$, ואין בה איסור לחתוך: $\frac{\sin x}{x}$ חותכת את
    $y=0$ בכל $x=k\pi$. רק אסימפטוטה אנכית $x=x_0$ (כש-$f$ אינה מוגדרת ב-$x_0$) אינה נחתכת.
  remedy: { lesson: '5.10', label: 'אסימפטוטות אופקיות ומשופעות' }

- id: MC-slant-intercept-skipped
  title: קובעים את החותך של אסימפטוטה משופעת בלי לחשב גבול
  belief: >-
    אחרי שמצאנו את השיפוע $m$, החותך $b$ הוא $0$, או נקרא מהמקדמים של המונה.
  truth: >-
    $b=\lim\bigl(f(x)-mx\bigr)$, ויש לחשב את הגבול הזה. ב-$\frac{2x^2+3x-1}{x-1}$ מתקבל $b=5$, וב-$\sqrt{x^2+4x}$ מתקבל $b=2$
    כש-$x\to\infty$, אף ש"בערך" $f(x)\approx x$.
  remedy: { lesson: '5.10', label: 'אסימפטוטות אופקיות ומשופעות' }

- id: MC-same-asymptote-both-sides
  title: מניחים שאותה אסימפטוטה מתאימה לשני הכיוונים
  belief: >-
    האסימפטוטה המשופעת כש-$x\to\infty$ היא גם האסימפטוטה כש-$x\to-\infty$.
  truth: >-
    כל כיוון נבדק בנפרד. $\sqrt{x^2+4x}$ מתקרבת ל-$y=x+2$ כש-$x\to\infty$ ול-$y=-x-2$ כש-$x\to-\infty$. זה קורה בכל פעם
    שמופיעים $|x|$ או שורש.
  remedy: { lesson: '5.10', label: 'אסימפטוטות אופקיות ומשופעות' }

- id: MC-local-min-below-local-max
  title: חושבים שערך מינימום מקומי תמיד קטן מערך מקסימום מקומי
  belief: >-
    אם בחקירה יצא מינימום מקומי שגדול ממקסימום מקומי, יש טעות בחישוב.
  truth: >-
    ערך מקומי משווה רק לנקודות קרובות. ב-$\frac{x^2}{x-1}$ המקסימום המקומי $0$ והמינימום המקומי $4$ נמצאים על שני
    ענפים, משני צדי האסימפטוטה $x=1$.
  remedy: { lesson: '5.10', label: 'חקירה מלאה ושרטוט' }

- id: MC-convex-increasing-may-level-off
  title: חושבים שפונקציה עולה וקמורה יכולה להתייצב
  belief: >-
    פונקציה עולה וקמורה יכולה להתקרב לאסימפטוטה אופקית, כמו כל פונקציה עולה.
  truth: >-
    אם $f'>0$ ו-$f'$ עולה, אז $f(x)\ge f(0)+f'(0)x$ ל-$x>0$, ולכן $f\to\infty$. פונקציה עולה שמתייצבת, כמו $-e^{-x}$,
    היא קעורה.
  remedy: { lesson: '5.10', label: 'חקירה מלאה ושרטוט' }

- id: MC-solutions-forget-negative-branch
  title: סופרים פתרונות רק בחלק מתחום ההגדרה
  belief: >-
    כשמפרידים פרמטר, למשל $a=\frac{e^x}{x}$, מספיק לחקור את הפונקציה ב-$x>0$.
  truth: >-
    התחום של $\frac{e^x}{x}$ הוא $x\neq0$, ושני הענפים תורמים פתרונות: ל-$a<0$ יש ל-$e^x=ax$ פתרון שלילי אחד. סופרים את
    הפתרונות בכל קטע של התחום ומחברים.
  remedy: { lesson: '5.10', label: 'מספר הפתרונות של משוואה' }

- id: MC-tangent-case-two-solutions
  title: סופרים שני פתרונות במקרה ההשקה
  belief: >-
    בערך הגבולי של הפרמטר, שבו הישר משיק לגרף, יש שני פתרונות שמתלכדים, ולכן סופרים שניים.
  truth: >-
    בהשקה יש נקודה משותפת **אחת**. אם $h$ יורדת ממש עד המינימום שלה ואחר כך עולה ממש, ערך המינימום מתקבל פעם אחת
    בדיוק.
  remedy: { lesson: '5.10', label: 'מספר הפתרונות של משוואה' }

- id: MC-asymptote-from-derivative-limit
  title: מסיקים אסימפטוטה משופעת מהגבול של הנגזרת בלבד
  belief: >-
    אם $f'(x)\to m$ כש-$x\to\infty$, לגרף יש אסימפטוטה משופעת בשיפוע $m$.
  truth: >-
    מזה נובע רק $\frac{f(x)}{x}\to m$. האסימפטוטה צריכה גם גבול סופי של $f(x)-mx$, ולזה אין ערובה: $x+\ln x$ מקיימת
    $f'\to1$, ו-$f(x)-x=\ln x\to\infty$.
  remedy: { lesson: '5.10', label: 'אסימפטוטות אופקיות ומשופעות' }
