# Misconceptions first detected in lesson 1.4 (bounds, supremum and infimum).
- id: MC-sup-is-max
  title: חושבים שהסופרמום תמיד שייך לקבוצה
  belief: >-
    הסופרמום הוא האיבר הגדול ביותר של הקבוצה (והאינפימום הקטן ביותר), ולכן $\min\left\{\frac1n\right\}=0$
    ו-$\max(0,1)=1$; ומה שאינו בקבוצה אינו יכול להיות הסופרמום שלה.
  truth: >-
    הסופרמום הוא החסם מלעיל הקטן ביותר. הוא יכול להיות מחוץ לקבוצה: $\sup(0,1)=1\notin(0,1)$. רק כשהוא בקבוצה
    הוא גם המקסימום. אותו דבר לאינפימום ולמינימום.
  remedy: { lesson: '1.4', label: 'סופרמום לעומת מקסימום' }

- id: MC-sup-never-in-set
  title: חושבים שהסופרמום לעולם אינו שייך לקבוצה
  belief: >-
    הסופרמום הוא מספר שהאיברים "מתקרבים אליו ולא מגיעים", ולכן הוא אף פעם אינו בקבוצה, ואינו שווה
    למקסימום; ב-$(0,1)\cup\{2\}$ הוא $1$.
  truth: >-
    הסופרמום מוגדר כחסם מלעיל הקטן ביותר, בלי שום תנאי על שייכות. $\sup[0,1]=1\in[0,1]$, וכשיש מקסימום הוא
    הסופרמום.
  remedy: { lesson: '1.4', label: 'סופרמום שבתוך הקבוצה' }

- id: MC-sup-any-upper-bound
  title: מבלבלים בין חסם מלעיל לסופרמום
  belief: >-
    כל חסם מלעיל הוא "הסופרמום", או שחסם מלעיל חייב להיות החסם הקטן ביותר.
  truth: >-
    לקבוצה חסומה יש אינסוף חסמים מלעיל: אם $M$ חסם, כל מספר גדול ממנו גם הוא חסם. הסופרמום הוא אחד מהם,
    הקטן ביותר.
  remedy: { lesson: '1.4', label: 'חסם מלעיל וסופרמום' }

- id: MC-upper-bound-in-set
  title: חושבים שחסם מלעיל חייב להיות איבר של הקבוצה
  belief: >-
    חסם מלעיל של $A$ הוא איבר של $A$ שגדול מכל האחרים.
  truth: >-
    זה המקסימום. חסם מלעיל הוא כל מספר ממשי שאף איבר אינו עולה עליו, בתוך הקבוצה או מחוצה לה: $5$ חוסם את
    $(0,1)$.
  remedy: { lesson: '1.4', label: 'חסמים, מקסימום ומינימום' }

- id: MC-max-always-exists
  title: חושבים שלכל קבוצה חסומה יש מקסימום
  belief: >-
    אם קבוצה לא ריקה חסומה מלעיל, יש בה איבר גדול ביותר; ולכל קבוצת רציונליים חסומה יש מקסימום.
  truth: >-
    $(0,1)$ חסומה ואין לה מקסימום. חסימות מבטיחה (בממשיים) סופרמום, לא מקסימום.
  remedy: { lesson: '1.4', label: 'קבוצה חסומה בלי מקסימום' }

- id: MC-infinite-means-unbounded
  title: חושבים שלקבוצה אינסופית אין מקסימום או שאינה חסומה
  belief: >-
    רק לקבוצות סופיות יש מקסימום, וקבוצה אינסופית "ממשיכה לנצח" ולכן אינה חסומה.
  truth: >-
    $[0,1]$ ו-$\left\{\frac1n\right\}$ אינסופיות, חסומות, ויש להן מקסימום, $1$. אינסוף איברים יכולים לשבת
    בקטע חסום.
  remedy: { lesson: '1.4', label: 'מקסימום של קבוצה אינסופית' }

- id: MC-empty-set-sup-zero
  title: חושבים שלקבוצה הריקה יש סופרמום אפס, או שאין לה חסמים
  belief: >-
    $\sup\varnothing=0$, או ש-$\varnothing$ אינה חסומה כי אין בה איברים להשוות אליהם.
  truth: >-
    כל מספר הוא חסם מלעיל של $\varnothing$ (באופן ריק), ולכן אין חסם מלעיל קטן ביותר: ל-$\varnothing$ אין
    סופרמום. לכן אקסיומת השלמות דורשת קבוצה לא ריקה.
  remedy: { lesson: '1.4', label: 'הקבוצה הריקה' }

- id: MC-sup-epsilon-wrong-side
  title: מחפשים איבר מעל הסופרמום באפיון האפסילון
  belief: >-
    אפיון הסופרמום אומר שלכל $\varepsilon$ יש איבר גדול מ-$s+\varepsilon$, או בתוך $(s,s+\varepsilon)$.
  truth: >-
    $s$ חסם מלעיל, ולכן אין איברים מעליו. האפיון אומר שלכל $\varepsilon>0$ יש איבר **מתחת** ל-$s$ וקרוב
    אליו: $a>s-\varepsilon$.
  remedy: { lesson: '1.4', label: 'אפיון הסופרמום עם אפסילון' }

- id: MC-sup-epsilon-wrong-quantifier
  title: טועים בכמתים של אפיון האפסילון
  belief: >-
    מספיק אפסילון אחד שיש בשבילו איבר גדול מ-$s-\varepsilon$; או שצריך שכל האיברים יהיו גדולים מ-$s-\varepsilon$.
  truth: >-
    "לכל $\varepsilon>0$ קיים $a\in A$ עם $a>s-\varepsilon$". אפסילון אחד אינו מספיק (כל חסם מקיים זאת
    עם $\varepsilon$ גדול), ו"כל האיברים" חזק מדי.
  remedy: { lesson: '1.4', label: 'אפיון הסופרמום: הכמתים' }

- id: MC-sup-epsilon-one-element
  title: חושבים שליד סופרמום שאינו בקבוצה יש רק מעט איברים
  belief: >-
    אפיון האפסילון נותן איבר אחד ליד הסופרמום, ולכן ייתכן שבקטע $(s-\varepsilon,s)$ יש רק מספר סופי של
    איברים, גם כש-$s\notin A$.
  truth: >-
    כש-$s\notin A$, כל איבר שנמצא מתחת ל-$s$, ו-$\varepsilon$ קטן יותר מחייב איבר חדש, קרוב יותר. לכן בכל
    קטע $(s-\varepsilon,s)$ יש אינסוף איברים.
  remedy: { lesson: '1.4', label: 'אפיון הסופרמום: כמה איברים ליד הסופרמום' }
