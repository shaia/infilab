# Misconceptions first detected in lesson 0.6 (strong induction, well-ordering, Bernoulli, the binomial theorem).
- id: MC-bernoulli-any-x
  title: משתמשים באי-שוויון ברנולי בלי התנאי על x
  belief: >-
    $(1+x)^n\ge 1+nx$ לכל $x$ ממשי ולכל $n$ טבעי.
  truth: >-
    ברנולי דורש $x\ge -1$: בצעד כופלים את הנחת האינדוקציה ב-$1+x$, וזה שומר על אי-השוויון רק כש-$1+x\ge 0$.
    עבור $x=-4$ ו-$n=3$: $(-3)^3=-27$, בעוד $1+3\cdot(-4)=-11$.
  remedy: { lesson: '0.6', anchor: bernoulli, label: 'אי-שוויון ברנולי' }

- id: MC-well-ordering-any-set
  title: מפעילים את עקרון הסדר הטוב על קבוצות שאינן קבוצות של טבעיים
  belief: >-
    לכל קבוצה לא ריקה של מספרים שלמים, או של מספרים חיוביים, יש איבר קטן ביותר.
  truth: >-
    עקרון הסדר הטוב הוא על קבוצות לא ריקות של **טבעיים**. ל-$\mathbb{Z}$ אין איבר קטן ביותר (לכל שלם $m$, גם
    $m-1$ שלם), ולקבוצת המספרים $\frac1n$ אין איבר קטן ביותר אף שכולם חיוביים. מצד שני, לכל קבוצה לא ריקה של
    טבעיים, גם אינסופית, יש איבר קטן ביותר.
  remedy: { lesson: '0.6', anchor: well-ordering, label: 'עקרון הסדר הטוב' }

- id: MC-strong-induction-no-cases
  title: חושבים שבאינדוקציה שלמה אין צורך לבדוק מקרים קטנים
  belief: >-
    באינדוקציה שלמה מניחים את כל המקרים הקודמים, ולכן אין בסיס ואין מה לבדוק בנפרד.
  truth: >-
    עבור $n=n_0$ אין מקרים קודמים, ולכן את $P(n_0)$ מוכיחים בלי עזרה. וכשהנימוק בצעד משתמש, למשל, ב-$P(n-3)$,
    הוא עובד רק כש-$n-3\ge n_0$; את ה-$n$ הקטנים יותר מוכיחים ישירות.
  remedy: { lesson: '0.6', anchor: strong, label: 'אינדוקציה שלמה' }

- id: MC-power-of-sum
  title: מפרקים חזקה של סכום לסכום של חזקות
  belief: >-
    $(a+b)^n=a^n+b^n$, כמו שכפל מתפלג על חיבור.
  truth: >-
    לפי הבינום של ניוטון, $(a+b)^n=\sum_{k=0}^{n}\binom nk a^{n-k}b^k$, ויש בו גם המחוברים האמצעיים. כבר
    $(1+1)^2=4$, ואילו $1^2+1^2=2$.
  remedy: { lesson: '0.6', anchor: binomial, label: 'הבינום של ניוטון' }

- id: MC-binomial-exponent-swap
  title: מצמידים למקדם הבינומי את החזקות הלא נכונות
  belief: >-
    המחובר עם $\binom nk$ בפיתוח של $(a+b)^n$ הוא $\binom nk a^k b^k$, או $\binom nk a^k b^{n-k}$ כשמחפשים את המקדם
    של $b^k$.
  truth: >-
    המחובר עם $\binom nk$ הוא $\binom nk a^{n-k}b^k$: סכום החזקות הוא תמיד $n$, והחזקה של $b$ היא $k$. למשל
    המקדם של $x^3$ ב-$(2+x)^5$ הוא $\binom53\cdot2^2=40$, לא $\binom53\cdot2^3=80$.
  remedy: { lesson: '0.6', anchor: binomial, label: 'הבינום של ניוטון' }

- id: MC-binomial-drop-negative-terms
  title: משמיטים מחוברים מפיתוח הבינום גם כשהם עלולים להיות שליליים
  belief: >-
    מהבינום נובע $(1+x)^n\ge1+nx+\frac{n(n-1)}{2}x^2$ לכל $x\ge-1$, כי פשוט משמיטים את שאר המחוברים.
  truth: >-
    השמטת מחוברים מקטינה סכום רק כשהם אי-שליליים, כלומר כש-$x\ge0$. עבור $x<0$ הסימנים מתחלפים: עם $x=-0.9$
    ו-$n=3$, $(0.1)^3=0.001$, ואילו $1-2.7+2.43=0.73$.
  remedy: { lesson: '0.6', anchor: binomial, label: 'הבינום של ניוטון: הערה 0.6.12' }
