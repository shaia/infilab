# Misconceptions first detected in lesson 4.1 (continuity at a point).
- id: MC-cont-delta-before-epsilon
  title: בוחרים את דלתא לפני אפסילון בהגדרת הרציפות
  belief: >-
    "קיים $\delta$ כך שלכל $\varepsilon$..." אומר אותו דבר כמו "לכל $\varepsilon$ קיים $\delta$...".
  truth: >-
    כש-$\delta$ בא קודם, אותו $\delta$ חייב להתאים לכל $\varepsilon$, ואז $f$ קבועה בכל הסביבה. בהגדרת
    הרציפות $\delta$ נבחר אחרי $\varepsilon$ ותלוי בו.
  remedy: { lesson: '4.1', label: 'רציפות בנקודה: אפסילון קודם, דלתא אחריו' }

- id: MC-cont-implication-reversed
  title: הופכים את כיוון הגרירה בהגדרת הרציפות
  belief: >-
    רציפות פירושה שאם $f(x)$ קרוב ל-$f(x_0)$ אז $x$ קרוב ל-$x_0$.
  truth: >-
    הגרירה היא מהנקודות לערכים: $|x-x_0|<\delta \Rightarrow |f(x)-f(x_0)|<\varepsilon$. פונקציה קבועה רציפה,
    ואצלה ערכים קרובים לא אומרים דבר על הנקודות.
  remedy: { lesson: '4.1', label: 'רציפות בנקודה: הגדרת אפסילון-דלתא' }

- id: MC-cont-limit-exists-enough
  title: חושבים שקיום הגבול בנקודה מספיק לרציפות
  belief: >-
    אם לגבול של $f$ ב-$x_0$ יש ערך, $f$ רציפה ב-$x_0$.
  truth: >-
    רציפות היא $\lim_{x\to x_0} f(x)=f(x_0)$: הגבול קיים **ושווה לערך**. הפונקציה ששווה ל-0 לכל $x\ne0$ ול-1
    ב-0 יש לה גבול ב-0, ואינה רציפה שם.
  remedy: { lesson: '4.1', label: 'רציפות בנקודה: הגבול שווה לערך' }

- id: MC-heine-one-sequence
  title: בודקים רציפות על סדרה אחת בלבד
  belief: >-
    אם יש סדרה $x_n\to x_0$ שעליה $f(x_n)\to f(x_0)$, $f$ רציפה ב-$x_0$.
  truth: >-
    הגדרת היינה דורשת זאת **לכל** סדרה ששואפת ל-$x_0$. סדרה אחת יכולה להוכיח אי-רציפות, אבל לא רציפות:
    פונקציית דיריכלה מקיימת $D(\frac1n)=D(0)$ ואינה רציפה ב-0.
  remedy: { lesson: '4.1', label: 'הגדרת היינה לרציפות' }

- id: MC-cont-judged-by-formula
  title: קובעים רציפות לפי הנוסחה במקום לפי הגבול והערך
  belief: >-
    אם הביטוי שמגדיר את $f$ "לא עובד" בנקודה (מכנה אפס), יש שם אי-רציפות, ואם הוא עובד, $f$ רציפה.
  truth: >-
    רציפות נקבעת רק על ידי השוויון בין הגבול לערך בנקודה. אותו ביטוי עם ערך אחר בנקודה אחת יכול לתת
    פונקציה רציפה או לא רציפה.
  remedy: { lesson: '4.1', label: 'רציפות בנקודה: הגבול שווה לערך' }

- id: MC-cont-at-point-spreads
  title: חושבים שרציפות בנקודה אחת גוררת רציפות בכל מקום
  belief: >-
    פונקציה שרציפה בנקודה אחת רציפה גם בנקודות שסביבה, או בכל הישר.
  truth: >-
    רציפות היא תכונה של נקודה. $x\cdot D(x)$, כש-$D$ פונקציית דיריכלה, רציפה ב-0 ובשום נקודה אחרת.
    רציפות מתפשטת רק כשיש סיבה מיוחדת, כמו משוואה שקושרת ערכים בנקודות שונות.
  remedy: { lesson: '4.1', label: 'רציפות בנקודה' }

- id: MC-cont-plus-discont-may-be-cont
  title: חושבים שפונקציה רציפה יכולה לתקן אי-רציפות של פונקציה אחרת בסכום
  belief: >-
    אם $f$ רציפה ו-$g$ אינה רציפה ב-$x_0$, אפשר שבכל זאת $f+g$ רציפה שם.
  truth: >-
    זה בלתי אפשרי: אילו $f+g$ הייתה רציפה, גם $g=(f+g)-f$ הייתה רציפה. כדי לבטל אי-רציפות בסכום צריך פונקציה
    שגם היא אינה רציפה.
  remedy: { lesson: '4.1', label: 'חשבון של פונקציות רציפות' }

- id: MC-two-discont-sum-discont
  title: חושבים שסכום או מכפלה של שתי פונקציות לא רציפות אינם רציפים
  belief: >-
    אם $f$ ו-$g$ אינן רציפות ב-$x_0$, גם $f+g$ ו-$f\cdot g$ אינן רציפות שם.
  truth: >-
    כללי החשבון אומרים רק מה קורה כששתי הפונקציות רציפות. אם $f$ קופצת ב-0, אז $f+(-f)\equiv0$ רציפה, ועבור
    הפונקציה $f=\pm1$ לפי הסימן, $f\cdot f\equiv 1$ רציפה.
  remedy: { lesson: '4.1', label: 'חשבון של פונקציות רציפות' }

- id: MC-composition-inherits-discont
  title: חושבים שהרכבה עם פונקציה לא רציפה תמיד אינה רציפה
  belief: >-
    אם $f$ אינה רציפה באיזושהי נקודה, $f\circ g$ אינה רציפה.
  truth: >-
    משפט ההרכבה דורש רציפות של $f$ רק בנקודות $g(x_0)$. אם $g$ לא מגיעה לנקודות אי-הרציפות של $f$, ההרכבה
    יכולה להיות רציפה בכל מקום.
  remedy: { lesson: '4.1', label: 'רציפות של הרכבה' }

- id: MC-composition-one-continuous-enough
  title: חושבים שמספיק שאחת הפונקציות בהרכבה רציפה
  belief: >-
    אם $g$ רציפה, $f\circ g$ רציפה, בלי קשר ל-$f$.
  truth: >-
    צריך את שתיהן: $g$ רציפה ב-$x_0$ **ו**-$f$ רציפה ב-$g(x_0)$. עם $g(x)=x^2$ ו-$f$ שקופצת ב-0, ההרכבה
    קופצת ב-0.
  remedy: { lesson: '4.1', label: 'רציפות של הרכבה' }

- id: MC-cont-means-whole-line
  title: חושבים שפונקציה רציפה חייבת להיות מוגדרת ורציפה בכל הישר
  belief: >-
    אחד חלקי x או טנגנס אינן רציפות, כי יש להן "חור" או קפיצה בנקודות שבהן הן לא מוגדרות.
  truth: >-
    "פונקציה רציפה" פירושו רציפה בכל נקודה של **תחום ההגדרה** שלה. נקודה מחוץ לתחום אינה נקודת אי-רציפות.
    $\frac1x$ רציפה, אף שהגרף שלה בנוי משני חלקים.
  remedy: { lesson: '4.1', label: 'פונקציות רציפות בתחום הגדרתן' }

- id: MC-piecewise-pieces-continuous
  title: חושבים שאם כל חלק רציף, הפונקציה המוגדרת למקוטעין רציפה
  belief: >-
    פונקציה שבנויה מחלקים רציפים (קבועים, פולינומים) רציפה בכל מקום.
  truth: >-
    בכל נקודת תפר צריך לבדוק בנפרד ששני הגבולות החד-צדדיים שווים לערך. הערך השלם בנוי מקבועים וקופץ בכל
    מספר שלם.
  remedy: { lesson: '4.1', label: 'רציפות של פונקציה מוגדרת למקוטעין' }

- id: MC-corner-means-discontinuous
  title: חושבים שפינה בגרף היא אי-רציפות
  belief: >-
    $|x|$ אינה רציפה ב-0, כי יש לגרף שלה פינה שם.
  truth: >-
    רציפות היא רק "הגבול שווה לערך": $\big||x|-0\big|=|x|$, ו-$\delta=\varepsilon$ מתאים. פינה פוגעת בגזירות
    (פרק 5), לא ברציפות.
  remedy: { lesson: '4.1', label: 'רציפות בנקודה: הגדרת אפסילון-דלתא' }
