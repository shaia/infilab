# Misconceptions first detected in lesson 6.3 (L'Hôpital's rule).
- id: MC-lhopital-quotient-rule
  title: גוזרים את המנה בכלל המנה במקום לגזור מונה ומכנה בנפרד
  belief: >-
    בכלל לופיטל מחליפים את $\frac{f}{g}$ בנגזרת שלה, $\left(\frac fg\right)' = \frac{f'g-fg'}{g^2}$.
  truth: >-
    כלל לופיטל מחליף את $\frac{f(x)}{g(x)}$ במנה של שתי נגזרות נפרדות, $\frac{f'(x)}{g'(x)}$. הנגזרת של
    המנה היא ביטוי אחר לגמרי, ובדרך כלל הגבול שלו שונה.
  remedy: { lesson: '6.3', label: 'ניסוח כלל לופיטל' }

- id: MC-lhopital-no-indeterminate
  title: מפעילים את כלל לופיטל בלי לבדוק שהצורה היא אפס חלקי אפס או אינסוף חלקי אינסוף
  belief: >-
    כלל לופיטל עובד לכל גבול של מנה: תמיד מותר לעבור מ-$\frac fg$ ל-$\frac{f'}{g'}$.
  truth: >-
    הכלל דורש ש-$f$ ו-$g$ ישאפו שתיהן לאפס, או ש-$|g|$ ישאף לאינסוף. אחרת התשובה שגויה:
    $\lim_{x\to1}\frac{x^2+1}{x+1} = 1$, ואילו מנת הנגזרות שואפת ל-$2$.
  remedy: { lesson: '6.3', label: 'ההנחות של כלל לופיטל' }

- id: MC-lhopital-converse
  title: מסיקים שגבול המנה אינו קיים כי גבול מנת הנגזרות אינו קיים
  belief: >-
    אם הגבול של $\frac{f'}{g'}$ אינו קיים, גם הגבול של $\frac fg$ אינו קיים.
  truth: >-
    כלל לופיטל הוא גרירה בכיוון אחד: אם גבול מנת הנגזרות קיים, אז גבול המנה קיים ושווה לו. כשגבול מנת
    הנגזרות אינו קיים הכלל פשוט לא אומר דבר. $\frac{x+\sin x}{x}\to 1$ באינסוף, ו-$1+\cos x$ אינו מתכנס.
  remedy: { lesson: '6.3', label: 'מתי הכלל לא חל' }

- id: MC-lhopital-needs-value-at-point
  title: חושבים שכלל לופיטל דורש גזירות או ערכים בנקודה עצמה
  belief: >-
    כדי להפעיל את הכלל ב-$a$ צריך ש-$f$ ו-$g$ יהיו גזירות ב-$a$, ש-$f(a)=g(a)=0$, ש-$g'(a)\ne0$, או
    שהנגזרות יהיו רציפות.
  truth: >-
    הכלל עוסק בגבול, ולכן מסתכל רק על סביבה מנוקבת של $a$: $f,g$ גזירות שם, $g'\ne 0$ שם, $f,g\to0$,
    וגבול מנת הנגזרות קיים. הערכים ב-$a$, אם בכלל מוגדרים, לא משנים דבר.
  remedy: { lesson: '6.3', label: 'ההנחות של כלל לופיטל' }

- id: MC-lhopital-circular
  title: משתמשים בכלל לופיטל במקום שהמסקנה או הנגזרת עצמה תלויות בגבול המבוקש
  belief: >-
    אפשר להניח שגבול המנה קיים כחלק מההנחות, או להוכיח את $\lim_{x\to0}\frac{\sin x}{x}=1$ בעזרת כלל
    לופיטל.
  truth: >-
    קיום גבול המנה הוא המסקנה של הכלל, לא הנחה. והנגזרת של סינוס בנקודה $0$ חושבה בעזרת הגבול
    $\frac{\sin x}{x}\to 1$, ולכן "הוכחה" של הגבול הזה בלופיטל היא מעגלית.
  remedy: { lesson: '6.3', label: 'ההנחות של כלל לופיטל' }

- id: MC-lhopital-always-helps
  title: חושבים שהפעלה חוזרת של כלל לופיטל תמיד מסתיימת בתשובה
  belief: >-
    אם אחרי הפעלה אחת עדיין יש צורה לא מוגדרת, ממשיכים לגזור, ובסוף מגיעים לתשובה.
  truth: >-
    לפעמים כל הפעלה מחזירה את אותה מנה (כמו ב-$\frac{\sqrt{x^2+1}}{x}$) או מסבכת אותה (כמו כתיבת
    $x\ln x$ כ-$\frac{x}{1/\ln x}$). אז מחלקים בחזקה המובילה, בוחרים העברה אחרת או עוברים לטיילור.
  remedy: { lesson: '6.3', label: 'מתי הכלל לא עוזר' }

- id: MC-lhopital-differentiate-sequence
  title: גוזרים סדרה לפי n
  belief: >-
    כלל לופיטל חל ישירות על סדרות: גוזרים את המונה והמכנה לפי $n$.
  truth: >-
    לסדרה אין נגזרת: היא מוגדרת רק על הטבעיים. מחשבים את הגבול של פונקציה, למשל $\frac{\ln x}{x}$
    כש-$x\to\infty$, ומעבירים לסדרה בעזרת היינה.
  remedy: { lesson: '6.3', label: 'לופיטל וסדרות' }
