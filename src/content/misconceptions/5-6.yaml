# Misconceptions first detected in lesson 5.6 (the mean value theorem).
- id: MC-mvt-for-all-c
  title: חושבים שמשפט לגרנז' מתקיים בכל נקודה של הקטע
  belief: >-
    לפי משפט לגרנז' הנגזרת שווה לשיפוע המיתר בכל נקודה של $(a,b)$.
  truth: >-
    המשפט מבטיח נקודה $c$ **אחת** לפחות. עבור $x^2$ ב-$[0,2]$ שיפוע המיתר $2$ מתקבל רק ב-$c=1$.
  remedy: { lesson: '5.6', label: 'משפט לגרנז'': קיימת נקודה' }

- id: MC-mvt-no-differentiability
  title: מפעילים את משפט לגרנז' על פונקציה רציפה שאינה גזירה
  belief: >-
    משפט הערך הממוצע חל על כל פונקציה רציפה בקטע סגור.
  truth: >-
    צריך גם גזירות בכל נקודה פנימית. $|x|$ ב-$[-1,1]$ רציפה, שיפוע המיתר $0$, והנגזרת אף פעם אינה $0$.
  remedy: { lesson: '5.6', label: 'משפט לגרנז'': ההנחות' }

- id: MC-cauchy-from-two-lagrange
  title: מוכיחים את משפט קושי משני משפטי לגרנז' עם אותה נקודה
  belief: >-
    משפט קושי נובע מהפעלת לגרנז' על $f$ ועל $g$ בנפרד וחלוקה, כי שתי ההפעלות נותנות את אותה נקודה $c$.
  truth: >-
    כל הפעלה נותנת נקודה משלה, ובדרך כלל הן שונות. עבור $x^2$ ו-$x^3$ ב-$[0,1]$ הנקודות הן $\frac12$ ו-$\frac{1}{\sqrt3}$,
    וה-$c$ של קושי הוא $\frac23$. ההוכחה מפעילה את רול על פונקציה אחת שבנויה משתיהן.
  remedy: { lesson: '5.6', label: 'משפט קושי והוכחתו' }

- id: MC-mvt-c-midpoint
  title: מניחים שהנקודה של משפט לגרנז' היא אמצע הקטע
  belief: >-
    ה-$c$ שמשפט לגרנז' נותן הוא $\frac{a+b}{2}$, או נקודה ידועה אחרת.
  truth: >-
    המשפט אומר רק ש-$c$ בתוך $(a,b)$. כל מה שמותר להשתמש בו הוא $a<c<b$, ומכאן באים החסמים.
    עבור $\ln(1+t)$ ב-$[0,1]$ הנקודה היא $\frac{1}{\ln2}-1\approx0.443$, לא $\frac12$.
  remedy: { lesson: '5.6', label: 'אי-שוויונות בעזרת לגרנז''' }

- id: MC-mvt-bound-direction
  title: הופכים את כיוון החסם כשמעריכים את הנגזרת בנקודה הלא ידועה
  belief: >-
    מ-$a<c<b$ אפשר לקבל חסם עליון ותחתון בלי לבדוק אם הנגזרת עולה או יורדת, וכפל אי-שוויון במספר שלילי
    שומר על הכיוון.
  truth: >-
    החסם העליון על $f'(c)$ בא מהקצה שבו $f'$ גדולה יותר, וכשכופלים במספר שלילי (למשל $x<0$) הכיוון מתהפך.
    כדאי לבדוק את התוצאה במספר אחד.
  remedy: { lesson: '5.6', label: 'אי-שוויונות בעזרת לגרנז''' }

- id: MC-mvt-bound-values-instead
  title: חוסמים ערכים כשצריך לחסום הפרשים
  belief: >-
    כדי להעריך $|f(a)-f(b)|$ מספיק חסם על $|f|$.
  truth: >-
    חסם על הערכים נותן רק $|f(a)-f(b)|\le 2\sup|f|$, שלא קטן כש-$a$ ו-$b$ מתקרבים. הפרש נחסם בעזרת
    הנגזרת: $|f(a)-f(b)|\le\sup|f'|\cdot|a-b|$.
  remedy: { lesson: '5.6', label: 'אי-שוויונות בעזרת לגרנז''' }

- id: MC-derivative-theorems-on-union
  title: מסיקים מהנגזרת על איחוד קטעים כאילו היה קטע אחד
  belief: >-
    אם $f'=0$ בכל התחום אז $f$ קבועה, ואם $f'>0$ בכל התחום אז $f$ עולה, גם כשהתחום הוא איחוד של קטעים.
  truth: >-
    ההוכחות מפעילות את לגרנז' בקטע $[x,y]$, שחייב להיות כולו בתחום. $\arctan x+\arctan\frac1x$ שווה ל-$\frac\pi2$
    ב-$(0,\infty)$ ול-$-\frac\pi2$ ב-$(-\infty,0)$, ו-$-\frac1x$ עולה בכל אחד משני הקטעים אבל לא באיחוד שלהם.
  remedy: { lesson: '5.6', label: 'נגזרת אפס בקטע' }

- id: MC-lipschitz-implies-differentiable
  title: חושבים שפונקציה ליפשיצית גזירה
  belief: >-
    אם $|f(x)-f(y)|\le M|x-y|$ לכל $x,y$, אז $f$ גזירה.
  truth: >-
    תנאי ליפשיץ חוסם את מנות ההפרשים אבל לא מבטיח שיש להן גבול: $|x|$ מקיימת אותו עם $M=1$ ואינה גזירה ב-$0$.
  remedy: { lesson: '5.6', label: 'נגזרת חסומה ותנאי ליפשיץ' }

- id: MC-continuous-implies-lipschitz
  title: חושבים שפונקציה רציפה בקטע סגור מקיימת תנאי ליפשיץ
  belief: >-
    פונקציה רציפה בקטע סגור חסומה, ולכן גם מנות ההפרשים שלה חסומות.
  truth: >-
    $\sqrt x$ רציפה ב-$[0,1]$, אבל $\frac{\sqrt x-0}{x-0}=\frac{1}{\sqrt x}$ אינו חסום. מה שמבטיח תנאי ליפשיץ הוא
    נגזרת חסומה, לא רציפות.
  remedy: { lesson: '5.6', label: 'נגזרת חסומה ותנאי ליפשיץ' }

- id: MC-bounded-derivative-bounded-function
  title: חושבים שנגזרת חסומה גוררת פונקציה חסומה
  belief: >-
    אם $|f'|\le M$ ב-$\mathbb{R}$, אז $f$ חסומה.
  truth: >-
    נגזרת חסומה מגבילה את קצב השינוי, לא את הערכים: $f(x)=x$ מקיימת $f'=1$ ואינה חסומה. בקטע **חסום** זה
    כן נכון, כי $|f(x)-f(a)|\le M|x-a|$.
  remedy: { lesson: '5.6', label: 'נגזרת חסומה ותנאי ליפשיץ' }
