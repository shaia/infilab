# Misconceptions first detected in lesson 0.1 (how to study, how to read a proof).
- id: MC-definition-is-claim
  title: מתייחסים להגדרה כאל טענה שאפשר להוכיח או להפריך
  belief: >-
    הגדרה היא עובדה שצריך להוכיח, ואם שני ספרים מגדירים מושג אחרת, אחת ההגדרות שגויה.
  truth: >-
    הגדרה קובעת מה פירוש מילה, ולכן היא לא נכונה ולא שגויה. מה שמוכיחים הוא טענות **על** המושג המוגדר,
    וגם את הטענה ששתי הגדרות שקולות, כלומר מתארות בדיוק את אותם עצמים.
  remedy: { lesson: '0.1', anchor: roles, label: 'הגדרה, טענה, משפט, הוכחה ודוגמה' }

- id: MC-text-roles-confused
  title: קוראים טקסט מתמטי בלי לשאול מה תפקיד כל שורה בו
  belief: >-
    כל שורה בטקסט מתמטי היא "עוד מידע", ואין הבדל בין הגדרה, טענה, הוכחה ודוגמה.
  truth: >-
    לכל שורה יש תפקיד: הגדרה נותנת שם, טענה (או משפט) אומרת משהו שצריך הוכחה, הוכחה מראה למה הטענה נכונה,
    ודוגמה מראה מקרה אחד. מילים כמו "נקרא", "טענה:", "הוכחה:" ו"למשל" מסמנות את התפקיד.
  remedy: { lesson: '0.1', anchor: roles, label: 'הגדרה, טענה, משפט, הוכחה ודוגמה' }

- id: MC-examples-are-proof
  title: חושבים שכמה דוגמאות מוכיחות טענה כללית
  belief: >-
    אם טענה על כל המספרים הטבעיים נבדקה במקרים רבים ובכולם היא נכונה, היא הוכחה.
  truth: >-
    דוגמאות בודקות מספר סופי של מקרים ונותנות השערה בלבד. $n^2+n+41$ ראשוני לכל $n$ מ-1 עד 39, ובכל זאת
    עבור $n=40$ מקבלים $1681=41^2$. טענה כללית מוכיחים בטיעון שעובד לכל מקרה.
  remedy: { lesson: '0.1', anchor: examples-not-proof, label: 'דוגמה אינה הוכחה' }

- id: MC-proof-backwards
  title: מתחילים מהטענה, מגיעים לדבר נכון, וחושבים שהוכחנו
  belief: >-
    אם מהטענה שרוצים להוכיח הגענו בכמה מעברים לדבר נכון (כמו $0=0$ או $24<25$), הטענה הוכחה.
  truth: >-
    מטענה שקרית אפשר להגיע לדבר נכון: מ-$1=2$, אחרי כפל ב-$0$, מקבלים $0=0$. הוכחה מתחילה ממה שידוע ומגיעה
    אל הטענה. שרשרת "מהסוף" מותרת כטיוטה, והיא הופכת להוכחה רק אם כל מעבר בה הפיך וכותבים אותה בכיוון ההפוך.
  remedy: { lesson: '0.1', anchor: backwards, label: 'הוכחה מהסוף' }

- id: MC-square-preserves-order
  title: מעלים אי-שוויון בריבוע בלי לבדוק סימנים
  belief: >-
    אם $a<b$ אז $a^2<b^2$, ולהפך, לכל שני מספרים ממשיים.
  truth: >-
    זה נכון רק כששני הצדדים אי-שליליים. $-3<2$ אבל $9>4$; ו-$x^2<1$ אומר $-1<x<1$, לא רק $x<1$. לפני
    העלאה בריבוע, או הוצאת שורש, בודקים את הסימנים.
  remedy: { lesson: '0.1', anchor: traps, label: 'שתי מלכודות: חילוק באפס והעלאה בריבוע' }

- id: MC-step-justification-vague
  title: שופטים מעבר בהוכחה לפי התחושה ולא לפי מה שמצדיק אותו
  belief: >-
    מעבר בהוכחה נכון אם הוא "נראה סביר" או אם השורה שמתקבלת נכונה, ולא צריך לשאול מאיזה כלל הוא נובע.
  truth: >-
    כל מעבר צריך הצדקה מפורשת: הגדרה, הנחה, טענה שכבר הוכחה או כלל חשבון. חילוק בביטוי שערכו $0$ "נראה"
    כמו כל חילוק, ובכל זאת אסור; וכפל של שני אגפים בשוויון באותו מספר "נראה" חשוד, ובכל זאת תמיד מותר.
  remedy: { lesson: '0.1', anchor: read-proof, label: 'קריאת הוכחה שורה אחר שורה' }

- id: MC-hypothesis-decorative
  title: חושבים שהנחה בטענה היא רק נוחות, ושאפשר לוותר עליה
  belief: >-
    ההנחות של טענה, כמו "$a,b$ טבעיים" או "$a,b\ge 0$", נכתבות כדי שההוכחה תהיה נוחה, והטענה נכונה גם בלעדיהן.
  truth: >-
    כל הנחה בטענה ממוספרת נכנסת להוכחה במקום מסוים, ובלעדיה הטענה יכולה להיכשל. בלי $a,b\in\mathbb N$,
    $3$ ו-$(-3)$ מחלקים זה את זה ואינם שווים; בלי $a\ge 0$, עבור $a=-3$ ו-$b=2$: $a<b$ אבל $a^2=9>4=b^2$. כשקוראים הוכחה, מסמנים איפה כל
    הנחה נכנסה.
  remedy: { lesson: '0.1', anchor: divisibility, label: 'תכונות החלוקה, וההנחות שלהן' }

- id: MC-study-passive-reading
  title: חושבים שקריאה והבנה של פתרון הן כמו לדעת לפתור
  belief: >-
    אם קראתי את הפתרון המלא והבנתי כל שורה, אני יודע לפתור את השאלה.
  truth: >-
    במבחן כותבים הוכחה לבד, בלי פתרון מול העיניים. מנסים קודם בכתב, רק אחר כך פותחים את הפתרון ומסמנים
    לפי המחוון מה היה חסר, וחוזרים לשאלה אחרי כמה ימים.
  remedy: { lesson: '0.1', anchor: study, label: 'איך לומדים לבד עם הקורס הזה' }

- id: MC-wrong-and-sure-ignored
  title: מתעלמים מטעות שעניתם עליה בביטחון
  belief: >-
    טעות בשאלה שסימנתי עליה "בטוח" היא מקרית, ועדיף פשוט לעבור הלאה.
  truth: >-
    טעות בביטחון היא הסימן החשוב ביותר: היא מראה תפיסה שגויה, לא חוסר ידע. קוראים את המשוב, חוזרים לחלק
    בשיעור שהוא מפנה אליו, וחוזרים לשאלה מאוחר יותר.
  remedy: { lesson: '0.1', anchor: confidence, label: 'בטוחים או לא בטוחים' }
