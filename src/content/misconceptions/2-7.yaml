# Misconceptions first detected in lesson 2.7 (monotone sequences and the number e).
- id: MC-monotone-limit-any-bound
  title: חושבים שסדרה מונוטונית וחסומה שואפת לחסם שנתון
  belief: >-
    אם $a_n$ עולה ו-$a_n\le 5$ לכל $n$, אז $a_n\to 5$; ואם $a_n$ יורדת וחיובית, אז $a_n\to 0$.
  truth: >-
    הגבול הוא הסופרמום (או האינפימום), החסם **הטוב ביותר**, לא חסם כלשהו. $1-\frac1n$ עולה וחסומה על ידי 5,
    וגבולה 1; $1+\frac1n$ יורדת וחיובית, וגבולה 1.
  remedy: { lesson: '2.7', label: 'מונוטונית וחסומה מתכנסת לסופרמום' }

- id: MC-monotone-limit-is-a-term
  title: חושבים שהגבול של סדרה מונוטונית הוא אחד מאיבריה
  belief: >-
    סדרה עולה וחסומה מגיעה בסוף לגבול שלה: הגבול הוא האיבר הגדול ביותר.
  truth: >-
    לסדרה עולה ממש אין איבר גדול ביותר, והגבול (הסופרמום) אינו אחד מאיבריה: $1-\frac1n$ לעולם אינה שווה ל-1.
  remedy: { lesson: '2.7', label: 'מונוטונית וחסומה מתכנסת לסופרמום' }

- id: MC-monotone-from-start
  title: חושבים שמשפט ההתכנסות המונוטונית דורש מונוטוניות מהאיבר הראשון
  belief: >-
    אם הסדרה עולה רק החל מ-$n=100$, אי אפשר להשתמש במשפט על סדרה מונוטונית וחסומה.
  truth: >-
    הגבול תלוי רק בזנב. אם $a_n$ עולה החל מ-$N$ וחסומה, הזנב $a_{N+1},a_{N+2},\dots$ עולה וחסום, ולכן מתכנס,
    וזה הגבול של כל הסדרה.
  remedy: { lesson: '2.7', label: 'מונוטונית וחסומה מתכנסת לסופרמום' }

- id: MC-monotone-alone-converges
  title: חושבים שכל סדרה מונוטונית מתכנסת
  belief: >-
    סדרה יורדת "מתייצבת" בסוף, ולכן מספיק להוכיח מונוטוניות כדי להסיק התכנסות.
  truth: >-
    צריך גם חסם בכיוון הנכון: $-n$ יורדת ושואפת למינוס אינסוף. סדרה יורדת מתכנסת אם ורק אם היא חסומה מלרע.
  remedy: { lesson: '2.7', label: 'מונוטונית וחסומה מתכנסת לסופרמום' }

- id: MC-convergent-implies-monotone
  title: חושבים שסדרה מתכנסת חייבת להיות מונוטונית
  belief: >-
    סדרה שאינה מונוטונית אינה מתכנסת, או שכל סדרה מתכנסת עולה או יורדת מנקודה מסוימת.
  truth: >-
    המשפט הוא בכיוון אחד בלבד. $\frac{(-1)^n}{n}$ מתחלפת בסימן, אינה מונוטונית מאף מקום, ושואפת ל-0.
  remedy: { lesson: '2.7', label: 'מונוטונית וחסומה מתכנסת לסופרמום' }

- id: MC-fixed-point-before-convergence
  title: פותרים את משוואת הנקודה הקבועה לפני שמוכיחים התכנסות
  belief: >-
    בסדרה $a_{n+1}=f(a_n)$ מספיק לפתור $L=f(L)$ כדי למצוא את הגבול.
  truth: >-
    המשוואה $L=f(L)$ נכונה רק **אם** יש גבול. בסדרה $a_1=2$, $a_{n+1}=a_n^2$ המשוואה נותנת $L=0$ או $L=1$, אבל
    $a_n\to\infty$. קודם מוכיחים התכנסות (מונוטוניות וחסימות), ורק אז פותרים.
  remedy: { lesson: '2.7', label: 'סדרות רקורסיביות: קודם התכנסות, אחר כך משוואה' }

- id: MC-fixed-point-root-choice
  title: לא בודקים איזה פתרון של משוואת הנקודה הקבועה הוא הגבול
  belief: >-
    כל פתרון של $L=f(L)$ יכול להיות הגבול, או שבוחרים ביניהם באקראי.
  truth: >-
    הגבול מקיים גם כל אי-שוויון חלש שכל האיברים מקיימים. אם $a_n\ge 0$ לכל $n$ אז $L\ge 0$, ולכן הפתרון
    $L=-1$ של $L^2=L+2$ נפסל.
  remedy: { lesson: '2.7', label: 'סדרות רקורסיביות: בחירת הפתרון' }

- id: MC-recursion-ignores-start
  title: חושבים שכלל הרקורסיה לבדו קובע אם הסדרה עולה או יורדת
  belief: >-
    לכלל $a_{n+1}=\sqrt{2+a_n}$ יש התנהגות אחת: הסדרה תמיד עולה וחסומה על ידי 2, מה שלא יהיה $a_1$.
  truth: >-
    האיבר הראשון קובע. עם $a_1=0$ הסדרה עולה ונשארת מתחת ל-2; עם $a_1=3$ היא יורדת ונשארת מעל 2. שתיהן שואפות
    ל-2, אבל ההוכחה שונה.
  remedy: { lesson: '2.7', label: 'סדרות רקורסיביות: התפקיד של האיבר הראשון' }

- id: MC-one-power-infinity-is-one
  title: מכריעים את הצורה אחד בחזקת אינסוף לפי הבסיס או לפי המעריך לבד
  belief: >-
    $\left(1+\frac1n\right)^n\to 1$ כי הבסיס שואף ל-1 ו-1 בכל חזקה הוא 1; או לחלופין שואפת לאינסוף, כי
    הבסיס גדול מ-1 והמעריך שואף לאינסוף.
  truth: >-
    כשגם הבסיס וגם המעריך משתנים, אי אפשר לקבוע את הגבול לפי אחד מהם. $\left(1+\frac1n\right)^n$ עולה וחסומה
    על ידי 3, וגבולה הוא המספר $e\approx 2.718$.
  remedy: { lesson: '2.7', label: 'המספר e' }
