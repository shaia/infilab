# Misconceptions first detected in lesson 2.3 (proving a limit from the definition, first properties).
- id: MC-estimate-from-below
  title: חוסמים את המרחק לגבול מלמטה במקום מלמעלה
  belief: >-
    בהוכחה מההגדרה מספיק למצוא ביטוי פשוט $b_n\le|a_n-L|$ ולדרוש $b_n<\varepsilon$.
  truth: >-
    כדי להסיק $|a_n-L|<\varepsilon$ צריך חסם **מלמעלה**: $|a_n-L|\le b_n$ ו-$b_n<\varepsilon$. חסם מלמטה לא
    אומר כמה גדול $|a_n-L|$ יכול להיות.
  remedy: { lesson: '2.3', label: 'הערכה מלמעלה של המרחק לגבול' }

- id: MC-estimate-not-small
  title: חוסמים את המרחק לגבול בביטוי שאינו שואף לאפס
  belief: >-
    כל חסם מלמעלה נכון של $|a_n-L|$ טוב להוכחה, גם קבוע או ביטוי שגדל עם $n$.
  truth: >-
    החסם צריך להיות קטן מ-$\varepsilon$ מ-$N$ והלאה לכל $\varepsilon>0$, כלומר ביטוי כמו $\frac Cn$ ששואף לאפס.
    חסם כמו $\frac53$ או $\frac{n+1}{4}$ נכון אבל לא מוכיח דבר.
  remedy: { lesson: '2.3', label: 'הערכה מלמעלה של המרחק לגבול' }

- id: MC-estimate-wrong-direction
  title: מגדילים שבר בכיוון הלא נכון
  belief: >-
    מותר להחליף את המכנה $n^2-5$ ב-$n^2$ כדי לקבל חסם מלמעלה, כי הם "כמעט שווים".
  truth: >-
    הגדלת המכנה **מקטינה** שבר חיובי. כדי לחסום מלמעלה מגדילים את המונה או מקטינים את המכנה, למשל
    $n^2-5\ge\frac{n^2}{2}$ לכל $n\ge4$. כל אי-שוויון בשרשרת נבדק.
  remedy: { lesson: '2.3', label: 'הגדלה והקטנה של שברים' }

- id: MC-estimate-by-approximation
  title: מחליפים אי-שוויון ב"בערך"
  belief: >-
    למספרים גדולים $a_n\approx\frac1n$, ולכן $N$ שמתאים ל-$\frac1n$ מתאים גם ל-$a_n$.
  truth: >-
    הוכחה מההגדרה היא שרשרת של אי-שוויונות נכונים. "בערך" אינו אי-שוויון: $\frac{n+1}{n^2-5}$ גדול מ-$\frac1n$,
    וה-$N$ של $\frac1n$ לא מתאים לו.
  remedy: { lesson: '2.3', label: 'הערכה מלמעלה של המרחק לגבול' }

- id: MC-epsilon-too-wide
  title: בוחרים אפסילון רחב מדי בהוכחה בשלילה
  belief: >-
    בהוכחה בשלילה (יחידות הגבול, התבדרות, שמירה על אי-שוויון) כל $\varepsilon$ חיובי מוביל לסתירה, למשל
    $\varepsilon = 1$ או המרחק כולו.
  truth: >-
    הסתירה נובעת רק כשהסביבה צרה מספיק כדי להפריד: בין שני גבולות צריך $\varepsilon\le\frac{|L_1-L_2|}{2}$,
    ובהוכחה ש-$(-1)^n$ מתבדרת צריך $\varepsilon\le1$. סביבה רחבה מדי מכילה את שני הצדדים, ואין סתירה.
  remedy: { lesson: '2.3', label: 'יחידות הגבול: סביבות זרות' }

- id: MC-epsilon-depends-on-n
  title: בוחרים אפסילון שתלוי ב-n
  belief: >-
    אפשר לבחור $\varepsilon = \frac1n$ בהגדרת הגבול או בשלילתה.
  truth: >-
    בהגדרה $\varepsilon$ נבחר ראשון, לפני $N$ ולפני $n$, ולכן הוא מספר קבוע. רק $N$ רשאי להיות תלוי בו, ו-$n$
    הוא כל מספר אחרי $N$.
  remedy: { lesson: '2.3', label: 'סדר הבחירות בהוכחה' }

- id: MC-bounded-implies-convergent
  title: מבלבלים בין "מתכנסת גוררת חסומה" לבין הכיוון ההפוך
  belief: >-
    סדרה חסומה מתכנסת, או: מתכנסת וחסומה הם אותו דבר.
  truth: >-
    כל סדרה מתכנסת חסומה, אבל לא להפך: $(-1)^n$ חסומה ומתבדרת. מה שכן נובע הוא הקונטרפוזיטיב: סדרה שאינה
    חסומה אינה מתכנסת.
  remedy: { lesson: '2.3', label: 'סדרה מתכנסת חסומה' }

- id: MC-sequence-max-exists
  title: מניחים שלסדרה יש איבר גדול ביותר
  belief: >-
    לכל סדרה (או לכל סדרה חסומה) יש מקסימום $\max_n|a_n|$, ואפשר להשתמש בו כחסם.
  truth: >-
    למספר סופי של איברים יש מקסימום; לאינסוף איברים אולי אין: $1-\frac1n$ חסומה ואין לה איבר גדול ביותר.
    לכן בהוכחה שסדרה מתכנסת חסומה לוקחים מקסימום של $a_1,\dots,a_N$ בלבד.
  remedy: { lesson: '2.3', label: 'סדרה מתכנסת חסומה' }

- id: MC-terms-bounded-by-limit
  title: חושבים שאיברי סדרה מתכנסת חסומים בגבול שלה
  belief: >-
    אם $a_n\to L$, אז $|a_n|\le|L|$ לכל $n$ (או לפחות מ-$N$ והלאה).
  truth: >-
    האיברים יכולים להיות רחוקים מאפס יותר מהגבול: $1+\frac1n\to1$ וכל איבריה גדולים מ-1. מה שנכון הוא
    $|a_n|<|L|+\varepsilon$ מ-$N$ והלאה, לכל $\varepsilon>0$.
  remedy: { lesson: '2.3', label: 'סדרה מתכנסת חסומה' }

- id: MC-diverge-one-L
  title: מוכיחים התבדרות בפסילת גבול אחד
  belief: >-
    אם הוכחנו ש-$a_n$ אינה שואפת ל-0 (או לכמה מספרים מסוימים), הוכחנו שהיא מתבדרת.
  truth: >-
    מתבדרת פירושו שאף $L\in\mathbb{R}$ אינו גבול:

    $$\forall L\in\mathbb{R}\ \exists\varepsilon>0\ \forall N\ \exists n>N:\ |a_n-L|\ge\varepsilon$$

    לכן ההוכחה מתחילה מ-$L$ כללי.
  remedy: { lesson: '2.3', label: 'הוכחה שסדרה מתבדרת' }
