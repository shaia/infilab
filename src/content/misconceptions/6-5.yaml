# Misconceptions first detected in lesson 6.5 (the Taylor remainder and error estimates).
- id: MC-remainder-wrong-order
  title: כותבים את שארית לגרנז' עם הנגזרת או העצרת מהסדר הלא נכון
  belief: >-
    השארית אחרי $T_n$ היא $\frac{f^{(n)}(c)}{n!}(x-a)^n$, או שאפשר לחסום אותה ב-$\frac{M}{n!}|x-a|^{n+1}$.
  truth: >-
    השארית אחרי $T_n$ היא האיבר "הבא" עם נקודה אחרת: $R_n(x) = \frac{f^{(n+1)}(c)}{(n+1)!}(x-a)^{n+1}$.
    נגזרת, עצרת וחזקה כולן מסדר $n+1$.
  remedy: { lesson: '6.5', label: 'צורת לגרנז'' של השארית' }

- id: MC-remainder-c-at-center
  title: מציבים את מרכז הפיתוח במקום הנקודה c בשארית
  belief: >-
    בשארית לגרנז' מציבים $c=a$, ואז השארית היא $\frac{f^{(n+1)}(a)}{(n+1)!}(x-a)^{n+1}$ בדיוק.
  truth: >-
    $c$ היא נקודה לא ידועה בין $a$ ל-$x$. אי אפשר להציב ערך מסוים; חוסמים את $|f^{(n+1)}(t)|$ על כל
    הקטע שבין $a$ ל-$x$. עם $c=a$ מקבלים רק את האיבר הבא בפיתוח, שהוא קירוב של השארית ולא השארית.
  remedy: { lesson: '6.5', label: 'הנקודה c: לא ידועה, ולכן חוסמים' }

- id: MC-remainder-c-fixed
  title: חושבים שהנקודה c בשארית לגרנז' אינה תלויה ב-x
  belief: >-
    יש נקודה $c$ אחת שמתאימה לכל $x$, ולכן $f(x) = T_n(x) + K(x-a)^{n+1}$ עם קבוע $K$.
  truth: >-
    $c$ תלויה ב-$x$ (וב-$n$). לו $K$ היה קבוע, $f$ הייתה פולינום. לכן חוסמים את $|f^{(n+1)}|$ על כל
    הקטע, ולא מחשבים אותו בנקודה אחת.
  remedy: { lesson: '6.5', label: 'הנקודה c תלויה ב-x' }

- id: MC-remainder-sign-assumed
  title: מניחים את סימן השארית בלי לדעת איפה נמצאת הנקודה c
  belief: >-
    בשארית כמו $\frac{\cos c}{24}x^4$ החזקה הזוגית חיובית, ולכן השארית אי-שלילית.
  truth: >-
    הסימן תלוי גם ב-$f^{(n+1)}(c)$, ועל $c$ ידוע רק שהיא בין $a$ ל-$x$. כש-$x$ גדול, $\cos c$ יכול להיות
    שלילי. בוחרים סדר שבו הסימן ידוע לכל $c$, למשל $-\frac{\cos c}{2}x^2 \ge -\frac{x^2}{2}$.
  remedy: { lesson: '6.5', label: 'הוכחת אי-שוויונות בעזרת השארית' }

- id: MC-peano-global
  title: משתמשים בשארית פאנו כאילו היא נותנת חסם מספרי
  belief: >-
    מ-$f(x) = T_n(x) + o\left((x-a)^n\right)$ אפשר להסיק אי-שוויון לכל $x$, או לחשב כמה גדולה השגיאה ב-$x=1$.
  truth: >-
    $o\left((x-a)^n\right)$ מתאר מה קורה כש-$x\to a$, ואינו אומר דבר על $x$ מסוים. בשביל חסם בנקודה
    נתונה צריך את צורת לגרנז', וחסם על הנגזרת ה-$(n+1)$ בקטע.
  remedy: { lesson: '6.5', label: 'פאנו מול לגרנז''' }

- id: MC-second-test-inconclusive-final
  title: חושבים שכאשר מבחן הנגזרת השנייה לא מכריע, אין דרך לסווג את הנקודה
  belief: >-
    אם $f'(a)=f''(a)=0$, אין דרך לדעת אם יש ב-$a$ קיצון, או שכל נגזרת נוספת שמתאפסת מוכיחה שאין קיצון.
  truth: >-
    ממשיכים לנגזרת הראשונה שאינה אפס, ומסתכלים על הזוגיות של הסדר שלה. $x^4$ מקיימת $f'(0)=f''(0)=f'''(0)=0$
    ו-$f^{(4)}(0)=24>0$, ול-$0$ נקודת מינימום.
  remedy: { lesson: '6.5', label: 'סיווג נקודות קיצון בנגזרות מסדר גבוה' }

- id: MC-odd-order-extremum
  title: מתעלמים מהזוגיות של הנגזרת הראשונה שאינה אפס
  belief: >-
    אם הנגזרת הראשונה שאינה אפס היא חיובית, יש מינימום, ואם שלילית יש מקסימום, בלי קשר לסדר שלה.
  truth: >-
    הסימן קובע רק כשהסדר $n$ זוגי, כי אז $(x-a)^n\ge0$ משני הצדדים. כש-$n$ אי-זוגי, $(x-a)^n$ מחליף סימן
    ב-$a$, ולכן אין קיצון: $x^3$ ב-$0$.
  remedy: { lesson: '6.5', label: 'סיווג נקודות קיצון בנגזרות מסדר גבוה' }
