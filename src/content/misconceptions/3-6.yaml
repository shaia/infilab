# Misconceptions first detected in lesson 3.6 (one-sided limits, limits at infinity, infinite limits).
- id: MC-one-side-enough
  title: מסיקים מגבול חד-צדדי אחד את הגבול הדו-צדדי
  belief: >-
    אם $\lim_{x\to a^+}f(x)=L$, אז $\lim_{x\to a}f(x)=L$; או שגבול מצד אחד מספיק כדי לקבוע שאין גבול.
  truth: >-
    הגבול קיים אם ורק אם **שני** הגבולות החד-צדדיים קיימים ושווים. מצד אחד לבד אי אפשר לדעת: לפונקציה
    ששווה ל-2 כש-$x>0$ ול-$x^2$ כש-$x<0$ יש גבול 2 מימין ואין לה גבול ב-0.
  remedy: { lesson: '3.6', label: 'גבול קיים אם ורק אם שני הצדדים שווים' }

- id: MC-infinite-limit-as-number
  title: מציבים את אינסוף בהגדרה כאילו הוא מספר
  belief: >-
    $\lim_{x\to a}f(x)=\infty$ פירושו שלכל $\varepsilon>0$ יש $\delta$ כך ש-$|f(x)-\infty|<\varepsilon$.
  truth: >-
    אינסוף אינו מספר ממשי, ולכן $|f(x)-\infty|$ חסר משמעות. ההגדרה של גבול אינסופי מחליפה את הרצועה סביב
    $L$ בחצי-ישר: לכל $M$ קיים $\delta>0$ כך ש-$0<|x-a|<\delta$ גורר $f(x)>M$.
  remedy: { lesson: '3.6', label: 'הגדרת הגבול האינסופי' }

- id: MC-integer-points-limit-at-infinity
  title: מסיקים גבול באינסוף מהערכים בשלמים
  belief: >-
    אם $f(n)\to L$ כש-$n\to\infty$ על הטבעיים, אז $f(x)\to L$ כש-$x\to\infty$.
  truth: >-
    הסדרה $f(n)$ רואה רק את הנקודות השלמות. $f(x)=\sin(\pi x)$ מתאפסת בכל שלם, ובכל זאת אין לה גבול באינסוף:
    ב-$x=2n+\frac12$ היא שווה ל-1. לפי היינה צריך $f(x_n)\to L$ **לכל** סדרה $x_n\to\infty$.
  remedy: { lesson: '3.6', label: 'גבול באינסוף והגדרת היינה' }

- id: MC-monotone-two-sided-limit
  title: חושבים שלפונקציה מונוטונית יש גבול בכל נקודה
  belief: >-
    פונקציה עולה "לא יכולה להשתולל", ולכן יש לה גבול (דו-צדדי) בכל נקודה.
  truth: >-
    לפונקציה מונוטונית יש בכל נקודה **גבולות חד-צדדיים**, אבל הם יכולים להיות שונים: $\lfloor x\rfloor$ עולה,
    וב-1 הגבול משמאל 0 ומימין 1. מה שמונוטוניות כן מבטיחה הוא שאין "תנודות", רק קפיצות.
  remedy: { lesson: '3.6', label: 'גבולות חד-צדדיים של פונקציה מונוטונית' }

- id: MC-monotone-sided-sup-inf-swap
  title: מחליפים בין סופרמום לאינפימום בגבולות של פונקציה מונוטונית
  belief: >-
    לפונקציה עולה, $\lim_{x\to a^+}f(x)=\sup\{f(x):x>a\}$.
  truth: >-
    כש-$x$ יורד אל $a$ מימין, הערכים של פונקציה עולה **יורדים**, ולכן הגבול מימין הוא
    $\inf\{f(x):x>a\}$. הגבול משמאל הוא $\sup\{f(x):x<a\}$. ציירו את $\lfloor x\rfloor$ ליד 1 ובדקו.
  remedy: { lesson: '3.6', label: 'גבולות חד-צדדיים של פונקציה מונוטונית' }
