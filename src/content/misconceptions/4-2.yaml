# Misconceptions first detected in lesson 4.2 (points of discontinuity).
- id: MC-jump-vs-removable
  title: מבלבלים בין אי-רציפות סליקה לקפיצה
  belief: >-
    כל נקודה שבה הערך שונה מהגבולות היא קפיצה, או שכל אי-רציפות שבה הגבולות החד-צדדיים קיימים היא סליקה.
  truth: >-
    סליקה: שני הגבולות החד-צדדיים קיימים **ושווים** (רק הערך בנקודה "לא במקום"). קפיצה: שניהם קיימים
    **ושונים**, ואז שום ערך בנקודה לא יתקן את הרציפות.
  remedy: { lesson: '4.2', label: 'סיווג נקודות אי-רציפות' }

- id: MC-redefine-fixes-any
  title: חושבים שכל אי-רציפות אפשר לתקן בשינוי הערך בנקודה
  belief: >-
    תמיד אפשר לבחור את $f(x_0)$ כך ש-$f$ תהיה רציפה ב-$x_0$, למשל ערך "באמצע".
  truth: >-
    שינוי הערך מתקן רק אי-רציפות סליקה, כלומר כשהגבול בנקודה קיים. בקפיצה, ובאי-רציפות מסוג שני כמו
    $\sin\frac1x$ ב-0, אין ערך שמתאים.
  remedy: { lesson: '4.2', label: 'אי-רציפות סליקה' }

- id: MC-oscillation-is-jump
  title: קוראים לתנודה בלי גבול קפיצה
  belief: >-
    $\sin\frac1x$ "קופצת" בין $-1$ ל-1 ליד 0, ולכן יש לה ב-0 אי-רציפות מסוג קפיצה.
  truth: >-
    קפיצה היא מונח מדויק: שני הגבולות החד-צדדיים קיימים ושונים. ב-$\sin\frac1x$ הגבולות החד-צדדיים
    אינם קיימים בכלל, וזו אי-רציפות מסוג שני.
  remedy: { lesson: '4.2', label: 'אי-רציפות מסוג שני' }

- id: MC-infinite-limit-is-jump
  title: קוראים לגבולות חד-צדדיים אינסופיים קפיצה
  belief: >-
    $\frac1x$ ב-0 (עם ערך כלשהו ב-0) קופצת ממינוס אינסוף לאינסוף, ולכן זו קפיצה.
  truth: >-
    בקפיצה הגבולות החד-צדדיים הם מספרים ממשיים. גבול אינסופי אינו קיים כמספר, ולכן זו אי-רציפות מסוג
    שני.
  remedy: { lesson: '4.2', label: 'אי-רציפות מסוג שני' }

- id: MC-dirichlet-cont-somewhere
  title: חושבים שפונקציית דיריכלה רציפה בחלק מהנקודות
  belief: >-
    באי-הרציונליים (או ברציונליים) פונקציית דיריכלה קבועה "ברוב" הסביבה, ולכן רציפה שם.
  truth: >-
    בכל קטע יש גם רציונליים וגם אי-רציונליים, ולכן ליד כל נקודה יש סדרה שעליה $D$ שווה לערך ההפוך. $D$
    אינה רציפה באף נקודה.
  remedy: { lesson: '4.2', label: 'פונקציית דיריכלה' }

- id: MC-times-dirichlet-nowhere
  title: חושבים שמכפלה בפונקציית דיריכלה אינה רציפה באף נקודה
  belief: >-
    $x\cdot D(x)$ אינה רציפה באף נקודה, כי $D$ אינה רציפה באף נקודה.
  truth: >-
    ב-0 הגורם $x$ מתאפס: $|x\,D(x)|\le|x|$, ולכן $x\cdot D(x)$ רציפה ב-0. בכל נקודה אחרת היא אינה רציפה.
  remedy: { lesson: '4.2', label: 'הפונקציה x כפול דיריכלה' }

- id: MC-riemann-wrong-points
  title: טועים בקבוצת נקודות הרציפות של פונקציית רימן
  belief: >-
    פונקציית רימן אינה רציפה באף נקודה, כמו דיריכלה, או שהיא רציפה גם ב-0 או ברציונליים אחרים.
  truth: >-
    הגבול של $R$ בכל נקודה הוא 0. לכן $R$ רציפה בדיוק היכן ש-$R=0$, כלומר באי-הרציונליים, ובכל רציונלי
    (גם ב-0, שם $R(0)=1$) יש אי-רציפות סליקה.
  remedy: { lesson: '4.2', label: 'פונקציית רימן' }
