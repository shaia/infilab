# Misconceptions first detected in lesson 0.4 (direct proof, proof by contradiction, counterexample).
- id: MC-contradiction-wrong-assumption
  title: בהוכחה בשלילה מניחים את הטענה עצמה במקום את שלילתה
  belief: >-
    הוכחה בדרך השלילה מתחילה בהנחת הטענה שרוצים להוכיח, או בעובדה כלשהי שקשורה אליה.
  truth: >-
    מניחים את **שלילת** הטענה ומגיעים לסתירה; הסתירה מראה שהשלילה שקרית, ולכן הטענה נכונה. לפני שמתחילים
    כותבים במפורש את השלילה, לפי כללי השלילה של שיעור 0.3.
  remedy: { lesson: '0.4', anchor: contradiction, label: 'הוכחה בדרך השלילה' }

- id: MC-contrapositive-doubted
  title: חושבים שהוכחת הקונטרפוזיטיב לא מוכיחה את הטענה
  belief: >-
    כדי להוכיח "אם $P$ אז $Q$" חייבים להתחיל מ-$P$; הוכחה של "אם לא $Q$ אז לא $P$" היא הוכחה של טענה אחרת,
    או רק של חלק מהמקרים.
  truth: >-
    $\neg Q\Rightarrow\neg P$ שקולה ל-$P\Rightarrow Q$: יש להן אותה טבלת אמת. לכן הוכחה של הקונטרפוזיטיב היא
    הוכחה של הטענה, ולפעמים היא הדרך הקלה בהרבה.
  remedy: { lesson: '0.4', anchor: contrapositive, label: 'הוכחה דרך הקונטרפוזיטיב' }

- id: MC-one-counterexample-not-enough
  title: חושבים שדוגמה נגדית אחת לא מספיקה כדי להפריך
  belief: >-
    טענה כללית שנכונה כמעט תמיד היא "נכונה", ודוגמה נגדית אחת היא רק "יוצא מן הכלל".
  truth: >-
    טענה "לכל" שקרית אם יש מקרה אחד שבו היא נכשלת. $n^2+n+41$ ראשוני לכל $n$ עד 39, והמקרה $n=40$ לבדו
    מפריך את "לכל $n$". אין במתמטיקה "יוצא מן הכלל": יש טענה נכונה ויש טענה שקרית.
  remedy: { lesson: '0.4', anchor: fig-0-4a, label: 'הפרכה בדוגמה נגדית' }

- id: MC-counterexample-wrong-shape
  title: בוחרים דוגמה נגדית שלא מקיימת את ההנחה, או שמקיימת את המסקנה
  belief: >-
    כל מקרה שבו משהו "לא מסתדר" הוא דוגמה נגדית לטענה "אם $P$ אז $Q$", גם מקרה שבו $P$ לא מתקיים.
  truth: >-
    דוגמה נגדית ל-"לכל $x$, אם $P(x)$ אז $Q(x)$" היא $x$ אחד שמקיים את $P$ **ולא** מקיים את $Q$. מקרה שבו $P$
    לא מתקיים לא אומר דבר על הטענה, כי שם הגרירה נכונה.
  remedy: { lesson: '0.4', anchor: counterexample, label: 'דוגמה נגדית לגרירה' }

- id: MC-counterexample-for-exists
  title: מנסים להפריך טענת "קיים" בדוגמה נגדית אחת
  belief: >-
    כדי להראות שהטענה "קיים $x$ כך ש-$P(x)$" שקרית מספיק למצוא $x$ אחד שלא מקיים את $P$.
  truth: >-
    השלילה של "קיים $x$ עם $P(x)$" היא "לכל $x$, לא $P(x)$". מפריכים אותה בהוכחה שאף $x$ לא מקיים את $P$;
    ומוכיחים אותה בדוגמה אחת שכן מקיימת.
  remedy: { lesson: '0.4', anchor: ex-0-4-2, label: 'מה מוכיחים ומה מפריכים בדוגמה' }

- id: MC-iff-one-direction
  title: מוכיחים "אם ורק אם" בכיוון אחד בלבד
  belief: >-
    כדי להוכיח "$P$ אם ורק אם $Q$" מספיק להוכיח ש-$P$ גורר את $Q$, או להוכיח את אותו כיוון פעמיים בניסוחים
    שונים.
  truth: >-
    "$P$ אם ורק אם $Q$" היא שתי טענות: $P\Rightarrow Q$ וגם $Q\Rightarrow P$. הקונטרפוזיטיב של כיוון אחד הוא אותו
    כיוון, לא השני. "$x>1$ אם ורק אם $x^2>1$" נכשלת בגלל הכיוון השני: $x=-2$.
  remedy: { lesson: '0.4', anchor: iff, label: 'הוכחת "אם ורק אם" בשני כיוונים' }
