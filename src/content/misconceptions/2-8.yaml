# Misconceptions first detected in lesson 2.8 (useful limits).
- id: MC-nth-root-keeps-size
  title: חושבים שהשורש ה-n-י שומר על הגודל של המספר
  belief: >-
    השורש ה-$n$-י של מספר גדול נשאר גדול, ושל מספר בין 0 ל-1 שואף ל-0: $\sqrt[n]{n}\to\infty$, $\sqrt[n]{1000}$ גדול,
    ו-$\sqrt[n]{\frac12}\to 0$.
  truth: >-
    לכל $a>0$ קבוע $\sqrt[n]a\to1$, וגם $\sqrt[n]n\to1$: השורש ה-$n$-י "מוחץ" כל מספר קבוע, ואפילו את $n$, לעבר 1.
    רק משהו שגדל מעריכית, כמו $\sqrt[n]{2^n}=2$, שורד את השורש.
  remedy: { lesson: '2.8', label: 'השורש ה-n-י של n ושל a' }

- id: MC-nth-root-always-one
  title: חושבים שהשורש ה-n-י של כל סדרה חיובית שואף ל-1
  belief: >-
    $\sqrt[n]{a_n}\to 1$ לכל סדרה חיובית $a_n$, כי השורש ה-$n$-י "מוחץ הכל" ל-1.
  truth: >-
    זה נכון כש-$a_n$ קבועה, או חסומה בין שני מספרים חיוביים, או גדלה כמו חזקה של $n$. אבל $\sqrt[n]{3^n}=3$ ו-$\sqrt[n]{2^n+3^n}\to3$:
    גדילה מעריכית שורדת את השורש.
  remedy: { lesson: '2.8', label: 'השורש ה-n-י של n ושל a' }

- id: MC-geometric-q-less-than-one
  title: חושבים ש-q בחזקת n שואף לאפס לכל q קטן מ-1
  belief: >-
    $q^n\to0$ לכל $q<1$, כולל $q$ שלילי.
  truth: >-
    התנאי הוא $|q|<1$. עבור $q=-1$ הסדרה $(-1)^n$ מתבדרת, ועבור $q=-2$ הערך המוחלט $2^n$ שואף לאינסוף והסימן
    מתחלף.
  remedy: { lesson: '2.8', label: 'q בחזקת n' }

- id: MC-ratio-test-q-equals-one
  title: מסיקים משהו ממבחן המנה כשהמנה שואפת ל-1
  belief: >-
    אם $\frac{a_{n+1}}{a_n}\to1$, אז $a_n$ מתכנסת (או שואפת לאפס, או ל-1).
  truth: >-
    כשהמנה שואפת ל-1 המבחן לא אומר דבר: עבור $n$, $\frac1n$ ו-$1+\frac1n$ המנה שואפת ל-1, והגבולות הם $\infty$, $0$
    ו-$1$.
  remedy: { lesson: '2.8', label: 'מבחן המנה לסדרות' }

- id: MC-ratio-below-one-implies-null
  title: חושבים שמנה קטנה מ-1 בכל צעד מבטיחה שאיפה לאפס
  belief: >-
    אם $a_n>0$ ו-$\frac{a_{n+1}}{a_n}<1$ לכל $n$, אז $a_n\to0$.
  truth: >-
    מנה קטנה מ-1 אומרת רק שהסדרה יורדת. מבחן המנה דורש שגבול המנה $q$ יהיה קטן מ-1, כך שהמנה נשארת מתחת
    למספר קבוע $r<1$. בסדרה $1+\frac1n$ כל מנה קטנה מ-1, המנות שואפות ל-1, והגבול הוא 1.
  remedy: { lesson: '2.8', label: 'מבחן המנה לסדרות' }

- id: MC-ratio-limit-is-limit
  title: מבלבלים בין הגבול של המנה לגבול של הסדרה
  belief: >-
    אם $\frac{a_{n+1}}{a_n}\to q$, אז $a_n\to q$.
  truth: >-
    $q$ מתאר את קצב השינוי, לא את המקום. עבור $a_n=\frac{1}{2^n}$ המנה היא $\frac12$ והסדרה שואפת ל-0; עבור $a_n=5$
    המנה היא 1 והסדרה שואפת ל-5.
  remedy: { lesson: '2.8', label: 'מבחן המנה לסדרות' }

- id: MC-growth-judged-by-early-terms
  title: משווים קצבי גדילה לפי האיברים הראשונים
  belief: >-
    $n^{10}$ גדלה מהר יותר מ-$1.1^n$, כי ב-$n=10$ או ב-$n=100$ היא גדולה בהרבה; ו-$\frac{n!}{10^n}$ שואפת ל-0,
    כי האיברים הראשונים קטנים.
  truth: >-
    קצב גדילה נקבע בזנב: $\frac{n^{10}}{1.1^n}\to0$ אף ש-$n^{10}$ גדולה יותר עד בערך $n=685$, ו-$\frac{n!}{10^n}\to\infty$.
    הכלי הוא מבחן המנה, לא טבלת ערכים.
  remedy: { lesson: '2.8', label: 'השוואת קצבי גדילה' }
