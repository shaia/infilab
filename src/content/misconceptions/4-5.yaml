# Misconceptions first detected in lesson 4.5 (continuity of monotone and inverse functions).
- id: MC-monotone-is-continuous
  title: חושבים שכל פונקציה מונוטונית רציפה
  belief: >-
    פונקציה מונוטונית "לא יכולה לקפוץ", ולכן היא רציפה.
  truth: >-
    $\lfloor x\rfloor$ עולה וקופצת בכל מספר שלם. מונוטוניות לבדה שוללת רק אי-רציפות סליקה ומסוג שני;
    רציפות דורשת בנוסף שהתמונה תהיה קטע.
  remedy: { lesson: '4.5', label: 'פונקציה מונוטונית שהתמונה שלה קטע' }

- id: MC-interval-image-implies-continuous
  title: חושבים שפונקציה שהתמונה שלה קטע רציפה
  belief: >-
    אם $f([a,b])$ הוא קטע, אין ל-$f$ קפיצות, ולכן היא רציפה.
  truth: >-
    בלי מונוטוניות זה שגוי: $2x$ על $[0,\frac12]$ ו-$2x-1$ על $(\frac12,1]$ מעבירה את $[0,1]$ על $[0,1]$
    וקופצת ב-$\frac12$. ערך שדילגו עליו יכול להתקבל במקום אחר.
  remedy: { lesson: '4.5', label: 'למה המונוטוניות הכרחית' }

- id: MC-monotone-any-discontinuity
  title: חושבים שלפונקציה מונוטונית יכולה להיות כל אי-רציפות
  belief: >-
    לפונקציה מונוטונית יכולה להיות אי-רציפות סליקה או מסוג שני.
  truth: >-
    לפונקציה מונוטונית יש גבולות חד-צדדיים בכל נקודה, והערך תקוע ביניהם. לכן כל אי-רציפות שלה היא
    קפיצה.
  remedy: { lesson: '4.5', label: 'אי-רציפות של פונקציה מונוטונית' }

- id: MC-injective-is-monotone
  title: חושבים שכל פונקציה חד-חד-ערכית מונוטונית
  belief: >-
    חד-חד-ערכית פירושו מונוטונית ממש, בלי קשר לרציפות או לתחום.
  truth: >-
    המשפט דורש גם רציפות וגם תחום שהוא קטע. $\frac1x$ על $\mathbb{R}\setminus\{0\}$ רציפה וחד-חד-ערכית ואינה
    מונוטונית; ופונקציה לא רציפה יכולה לעלות ואחר כך לרדת בלי לחזור על ערך.
  remedy: { lesson: '4.5', label: 'רציפה וחד-חד-ערכית על קטע' }

- id: MC-inverse-always-continuous
  title: חושבים שההפוכה של פונקציה רציפה תמיד רציפה
  belief: >-
    אם $f$ רציפה וחד-חד-ערכית, $f^{-1}$ רציפה, בכל תחום.
  truth: >-
    על **קטע** זה נכון. על תחום אחר זה יכול להיכשל: $f(x)=x$ על $[0,1)$ ו-$x-1$ על $[2,3]$ רציפה ועולה ממש,
    וההפוכה שלה קופצת ב-1.
  remedy: { lesson: '4.5', label: 'רציפות הפונקציה ההפוכה' }

- id: MC-arcsin-any-restriction
  title: מצמצמים את סינוס לקטע שעליו הוא אינו חד-חד-ערכי
  belief: >-
    כדי להגדיר $\arcsin$ אפשר לצמצם את $\sin$ לכל קטע שעליו הוא מקבל את כל הערכים בין $-1$ ל-1, למשל
    $[0,\pi]$ או $[0,2\pi]$.
  truth: >-
    צריך קטע שעליו $\sin$ מונוטונית ממש. הבחירה המקובלת היא $[-\frac\pi2,\frac\pi2]$: שם $\sin$ עולה ממש מ-$-1$
    ל-1.
  remedy: { lesson: '4.5', label: 'הפונקציות הטריגונומטריות ההפוכות' }
