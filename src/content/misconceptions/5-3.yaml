# Misconceptions first detected in lesson 5.3 (the chain rule and the derivative of an inverse).
- id: MC-chain-forget-inner
  title: שוכחים את הנגזרת הפנימית בכלל השרשרת
  belief: >-
    $(f\circ g)'(x)=f'(g(x))$, ובהרכבה מקוננת מספיק לגזור את השכבה החיצונית.
  truth: >-
    $(f\circ g)'(x)=f'(g(x))\cdot g'(x)$: כל שכבה תורמת גורם. בדיקה: $(\sin 2x)'=2\cos2x$, ולא $\cos 2x$, כי
    $\sin2x$ משתנה פי שניים מהר יותר.
  remedy: { lesson: '5.3', label: 'כלל השרשרת בהרכבות מקוננות' }

- id: MC-chain-wrong-point
  title: גוזרים את הפונקציה החיצונית בנקודה הלא נכונה
  belief: >-
    $(f\circ g)'(x)=f'(x)\,g'(x)$, או $f'(g'(x))$.
  truth: >-
    את $f$ גוזרים בנקודה $g(x)$, שאליה $g$ מעבירה את $x$: $(f\circ g)'(x)=f'(g(x))\,g'(x)$. עם $f(u)=u^3$
    ו-$g(x)=x^2+1$, ב-1 צריך $f'(2)$ ולא $f'(1)$.
  remedy: { lesson: '5.3', label: 'כלל השרשרת: ניסוח' }

- id: MC-chain-naive-proof
  title: מוכיחים את כלל השרשרת בכפל וחילוק ב-g(x) פחות g(x0)
  belief: >-
    כופלים ומחלקים ב-$g(x)-g(x_0)$, והגבול של כל גורם קיים, ולכן כלל השרשרת מוכח.
  truth: >-
    $g(x)-g(x_0)$ יכול להתאפס עבור $x$ קרובים כרצוננו ל-$x_0$ ($g$ קבועה, או $x^2\sin\frac1x$ ב-0), ואז
    מחלקים באפס. ההוכחה הנכונה משתמשת בפונקציית עזר $\varphi$ שמקיימת $f(y)-f(y_0)=\varphi(y)(y-y_0)$ לכל $y$.
  remedy: { lesson: '5.3', label: 'הוכחת כלל השרשרת' }

- id: MC-inverse-deriv-wrong-point
  title: גוזרים את הפונקציה בנקודה של ההפוכה
  belief: >-
    $(f^{-1})'(y_0)=\frac{1}{f'(y_0)}$.
  truth: >-
    $(f^{-1})'(y_0)=\frac{1}{f'(x_0)}$ עם $x_0=f^{-1}(y_0)$: הנקודה $y_0$ נמצאת על ציר ה-$y$ של $f$, ואת $f$
    גוזרים בנקודה המתאימה על ציר ה-$x$.
  remedy: { lesson: '5.3', label: 'נגזרת של פונקציה הפוכה' }

- id: MC-inverse-deriv-no-reciprocal
  title: שוכחים את ההופכי בנגזרת של פונקציה הפוכה
  belief: >-
    הנגזרת של ההפוכה ב-$f(x_0)$ שווה ל-$f'(x_0)$.
  truth: >-
    הגרף של $f^{-1}$ הוא שיקוף של הגרף של $f$ סביב הישר $y=x$, והשיקוף הופך שיפוע $m$ לשיפוע $\frac1m$:
    $(f^{-1})'(f(x_0))=\frac{1}{f'(x_0)}$.
  remedy: { lesson: '5.3', label: 'נגזרת של פונקציה הפוכה' }

- id: MC-inverse-always-differentiable
  title: חושבים שההפוכה של פונקציה גזירה גזירה בכל נקודה
  belief: >-
    אם $f$ גזירה וחד-חד-ערכית על קטע, $f^{-1}$ גזירה בכל נקודה.
  truth: >-
    בנקודה שבה $f'(x_0)=0$ ההפוכה אינה גזירה ב-$f(x_0)$: אילו הייתה, כלל השרשרת על $f(f^{-1}(y))=y$ היה נותן
    $0=1$. הדוגמה: $x^3$ ו-$\sqrt[3]{y}$ ב-0.
  remedy: { lesson: '5.3', label: 'נגזרת ההפוכה כשהנגזרת מתאפסת' }

- id: MC-hypothesis-fails-so-conclusion-fails
  title: מסיקים מכך שהנחה של משפט לא מתקיימת שהמסקנה שלו נכשלת
  belief: >-
    אם אחת ההנחות של משפט לא מתקיימת, המסקנה שלו לא נכונה.
  truth: >-
    משפט אומר "אם ההנחות, אז המסקנה", ובלי ההנחות הוא פשוט לא אומר דבר. $x^2$ על $[-1,2]$ אינה מקיימת
    $f(-1)=f(2)$, ובכל זאת הנגזרת שלה מתאפסת ב-0. כדי להראות שמסקנה נכשלת צריך דוגמה או טיעון נפרד.
  remedy: { lesson: '5.3', label: 'נגזרת ההפוכה כשהנגזרת מתאפסת' }

- id: MC-inverse-continuity-assumed
  title: מניחים בלי הצדקה שההפוכה רציפה
  belief: >-
    אם $y=f(x)$ ו-$y\to y_0$, ברור ש-$x=f^{-1}(y)\to x_0$.
  truth: >-
    זו הטענה ש-$f^{-1}$ רציפה ב-$y_0$, והיא משפט: ההפוכה של פונקציה רציפה ומונוטונית ממש **על קטע** רציפה
    (שיעור 4.5). ההוכחה של נגזרת ההפוכה נשענת עליו.
  remedy: { lesson: '5.3', label: 'הוכחת המשפט על נגזרת ההפוכה' }

- id: MC-power-rule-variable-exponent
  title: גוזרים חזקה עם מעריך משתנה לפי כלל החזקה או כמעריכית
  belief: >-
    $(x^x)'=x\cdot x^{x-1}$, או $(x^x)'=x^x\ln x$.
  truth: >-
    כלל החזקה דורש מעריך קבוע, וכלל המעריכית דורש בסיס קבוע. כשהשניים משתנים כותבים $x^x=e^{x\ln x}$ וגוזרים
    לפי כלל השרשרת: $(x^x)'=x^x(\ln x+1)$, סכום שתי התרומות.
  remedy: { lesson: '5.3', label: 'גזירה של חזקה ממשית' }

- id: MC-limit-of-derivatives
  title: חושבים שהנגזרת של גבול היא הגבול של הנגזרות
  belief: >-
    אם $f_n\to f$ והנגזרות $f_n'$ שואפות לפונקציה $g$, אז $f'=g$.
  truth: >-
    זה לא נכון בלי הנחות נוספות (נושא של אינפי 2): $\frac{\sin(nx)}{n}\to0$ לכל $x$, אבל $\cos(nx)$ אינה
    שואפת ל-0. לכן נגזרת של $x^\alpha$ מחושבת מ-$e^{\alpha\ln x}$, לא מקירוב ברציונליים.
  remedy: { lesson: '5.3', label: 'גזירה של חזקה ממשית' }

- id: MC-induction-on-real-exponent
  title: מוכיחים באינדוקציה טענה על מעריך ממשי
  belief: >-
    טענה על $x^\alpha$ שהוכחה באינדוקציה ל-$\alpha=n$ טבעי נכונה לכל $\alpha$ ממשי.
  truth: >-
    אינדוקציה עוברת מ-$n$ ל-$n+1$ ומוכיחה רק טענות על טבעיים. למעריך ממשי צריך הגדרה והוכחה משלו, כאן דרך
    $x^\alpha=e^{\alpha\ln x}$.
  remedy: { lesson: '5.3', label: 'גזירה של חזקה ממשית' }
