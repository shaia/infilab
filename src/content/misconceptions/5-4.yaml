# Misconceptions first detected in lesson 5.4 (higher derivatives and continuous differentiability).
- id: MC-substitute-before-differentiating
  title: מציבים את הנקודה לפני שגוזרים
  belief: >-
    כדי לחשב $f''(1)$ אפשר להציב $x=1$ ואז לגזור, או לגזור את $f'(1)$.
  truth: >-
    $f'(1)$ הוא מספר, ונגזרת של קבוע היא 0. $f''(1)$ היא הערך ב-1 של הפונקציה $f''$: קודם גוזרים את
    הפונקציות, ורק בסוף מציבים.
  remedy: { lesson: '5.4', label: 'נגזרות מסדר גבוה' }

- id: MC-trig-nth-period-two
  title: מאבדים את הסימנים בנגזרות של סינוס וקוסינוס
  belief: >-
    הנגזרות של $\sin$ מתחלפות $\sin,\cos,\sin,\cos,\dots$, במחזור של 2 ובלי סימנים.
  truth: >-
    המחזור הוא 4: $\sin,\ \cos,\ -\sin,\ -\cos$, ובאינדוקציה $\sin^{(n)}(x)=\sin\left(x+\frac{n\pi}{2}\right)$.
    כדי לקבוע את $\sin^{(n)}$ מחשבים את השארית של $n$ בחלוקה ב-4.
  remedy: { lesson: '5.4', label: 'הנגזרת ה-n-ית של סינוס' }

- id: MC-nth-formula-not-checked
  title: מנחשים נוסחה לנגזרת ה-n-ית בלי לבדוק אותה
  belief: >-
    מספיק לראות תבנית בשתיים-שלוש נגזרות ראשונות כדי לכתוב את $f^{(n)}$.
  truth: >-
    תבנית היא השערה. בודקים אותה במקרה הבסיס ($n=1$), ומוכיחים באינדוקציה: גוזרים את הנוסחה של $f^{(n)}$
    ומראים שמתקבלת הנוסחה של $f^{(n+1)}$. בדיקה ב-$n=1$ לבדה כבר תופסת טעות של אחד בחזקה.
  remedy: { lesson: '5.4', label: 'נוסחה לנגזרת ה-n-ית באינדוקציה' }

- id: MC-differentiable-implies-twice
  title: חושבים שפונקציה גזירה גזירה גם פעמיים
  belief: >-
    אם $f$ גזירה בכל נקודה, גם $f'$ גזירה; ואם $x^k\sin\frac1x$ גזירה ברציפות, היא גם גזירה פעמיים.
  truth: >-
    כל סדר של גזירות דורש הוכחה משלו. $x|x|$ גזירה ברציפות, ונגזרתה $2|x|$ אינה גזירה ב-0. $x^3\sin\frac1x$
    גזירה ברציפות ואינה גזירה פעמיים ב-0.
  remedy: { lesson: '5.4', label: 'גזירה, גזירה ברציפות, גזירה פעמיים' }

- id: MC-derivative-via-limit-of-derivative
  title: מחשבים את הנגזרת בנקודה כגבול של הנגזרת
  belief: >-
    $f'(0)$ היא $\lim_{x\to0}f'(x)$, ולכן אם לגבול הזה אין קיום, $f$ אינה גזירה ב-0.
  truth: >-
    $f'(0)$ היא הגבול של מנת ההפרשים ב-0. הגבול של $f'(x)$ יכול לא להתקיים גם כש-$f'(0)$ קיימת:
    $x^2\sin\frac1x$ גזירה ב-0 עם $f'(0)=0$, ו-$f'(x)$ אין לה גבול ב-0. לכן בנקודה מיוחדת חוזרים להגדרה.
  remedy: { lesson: '5.4', label: 'הפונקציה x בריבוע כפול סינוס של אחד חלקי x' }

- id: MC-leibniz-no-binomial
  title: שוכחים את המקדמים הבינומיים בנוסחת לייבניץ
  belief: >-
    $(fg)^{(n)}=\sum_{k=0}^{n}f^{(k)}g^{(n-k)}$, או רק $f^{(n)}g+fg^{(n)}$.
  truth: >-
    $(fg)^{(n)}=\sum_{k=0}^{n}\binom nk f^{(k)}g^{(n-k)}$. כל איבר מתקבל בכמה מסלולים של גזירה, כמו בפיתוח
    $(a+b)^n$. בדיקה עם $n=2$: $(fg)''=f''g+2f'g'+fg''$.
  remedy: { lesson: '5.4', label: 'נוסחת לייבניץ' }

- id: MC-derivative-always-continuous
  title: חושבים שכל נגזרת רציפה
  belief: >-
    אם $f$ גזירה בכל נקודה, הפונקציה $f'$ רציפה, ולכן אפשר להפעיל עליה את משפט ערך הביניים.
  truth: >-
    הנגזרת של $x^2\sin\frac1x$ (עם $0$ ב-$0$) קיימת בכל מקום ואינה רציפה ב-$0$. מה שנכון לכל נגזרת הוא חלש
    יותר: תכונת ערך הביניים (משפט דרבו).
  remedy: { lesson: '5.4', label: 'הפונקציה x בריבוע כפול סינוס של אחד חלקי x' }
