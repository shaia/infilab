# Misconceptions first detected in lesson 3.3 (the limit of a function: Cauchy's definition).
- id: MC-limit-delta-before-epsilon
  title: בוחרים את דלתא לפני אפסילון בהגדרת הגבול של פונקציה
  belief: >-
    "קיים $\delta>0$ כך שלכל $\varepsilon>0$..." אומר אותו דבר כמו "לכל $\varepsilon>0$ קיים $\delta>0$...".
  truth: >-
    כש-$\delta$ בא קודם, אותו $\delta$ חייב להתאים לכל $\varepsilon$, ואז $|f(x)-L|$ קטן מכל מספר חיובי,
    כלומר $f(x)=L$ לכל $x$ בסביבה המנוקבת: $f$ קבועה שם. בהגדרת הגבול $\delta$ נבחר אחרי $\varepsilon$
    ותלוי בו.
  remedy: { lesson: '3.3', label: 'הגדרת קושי: אפסילון קודם, דלתא אחריו' }

- id: MC-limit-implication-reversed
  title: מחליפים את התפקידים של אפסילון ודלתא, או של x ו-f(x)
  belief: >-
    הגבול אומר שאם $f(x)$ קרוב ל-$L$ אז $x$ קרוב ל-$a$; או שלכל סביבה של $a$ יש סביבה של $L$.
  truth: >-
    הגרירה היא מהנקודות לערכים: $0<|x-a|<\delta \Rightarrow |f(x)-L|<\varepsilon$. הרוחב $\varepsilon$ סביב $L$
    נתון ראשון (על ציר $y$), ו-$\delta$ סביב $a$ (על ציר $x$) נבחר בתגובה. לפונקציה קבועה יש גבול בכל נקודה,
    אף שערך קרוב ל-$L$ לא אומר שם דבר על $x$.
  remedy: { lesson: '3.3', label: 'הגדרת קושי: המלבן סביב הנקודה' }

- id: MC-function-limit-is-value
  title: חושבים שהגבול בנקודה הוא הערך של הפונקציה בה
  belief: >-
    $\lim_{x\to a}f(x)=f(a)$ תמיד, ולכן כדי לחשב גבול מציבים; או שהערך $f(a)$ יכול למנוע מהגבול להתקיים.
  truth: >-
    ההגדרה מסתכלת רק על $x$ עם $0<|x-a|<\delta$: הנקודה $a$ עצמה מוצאת. שינוי של $f(a)$, או מחיקה שלו, לא
    משנה את הגבול. הפונקציה ששווה ל-$x^2$ כש-$x\neq3$ ול-100 ב-3 שואפת ל-9 ב-3. השוויון $\lim f=f(a)$ הוא
    תכונה מיוחדת, רציפות, שתוגדר בשיעור 4.1.
  remedy: { lesson: '3.3', label: 'למה הערך בנקודה לא משפיע על הגבול' }

- id: MC-limit-needs-f-at-a
  title: חושבים שאין גבול בנקודה שבה הפונקציה אינה מוגדרת
  belief: >-
    ל-$\frac{x^2-4}{x-2}$ אין גבול ב-2, כי היא לא מוגדרת שם.
  truth: >-
    הגבול דורש ש-$f$ תהיה מוגדרת בסביבה **מנוקבת** של $a$, בלי $a$ עצמו. רוב הגבולות המעניינים בקורס הם
    בדיוק בנקודות כאלה: $\frac{\sin x}{x}$ ב-0, ומנת ההפרשים בפרק 5.
  remedy: { lesson: '3.3', label: 'הסביבה המנוקבת בהגדרת הגבול' }

- id: MC-delta-must-be-optimal
  title: חושבים שצריך את הדלתא הגדולה ביותר, או שדלתא קטנה יותר לא עובדת
  belief: >-
    בהוכחת גבול צריך למצוא את ה-$\delta$ המקסימלי, ו-$\delta$ קטן יותר כבר לא מתאים לאותו $\varepsilon$.
  truth: >-
    אם $\delta$ מתאים ל-$\varepsilon$, כל $\delta'$ עם $0<\delta'<\delta$ מתאים גם הוא: הקבוצה
    $0<|x-a|<\delta'$ מוכלת ב-$0<|x-a|<\delta$. לכן מותר להקטין את $\delta$ כרצוננו, ובשביל זה יש
    $\min(1,\dots)$.
  remedy: { lesson: '3.3', label: 'בחירת דלתא תלויה באפסילון' }

- id: MC-delta-depends-on-x
  title: בוחרים דלתא שתלויה ב-x
  belief: >-
    אפשר לבחור $\delta=\frac{\varepsilon}{|x+3|}$ כדי לקבל $|x-3|\cdot|x+3|<\varepsilon$.
  truth: >-
    $\delta$ נבחר **לפני** $x$: "קיים $\delta$ כך שלכל $x$". דלתא שתלויה ב-$x$ היא מעגל שוטה, כי $x$ עדיין לא
    נבחר. כדי להיפטר מ-$x$ חוסמים את הגורם הבעייתי בסביבה קבועה: אם $|x-3|<1$ אז $|x+3|<7$.
  remedy: { lesson: '3.3', label: 'בחירת דלתא: חסם מקומי' }

- id: MC-delta-forgets-local-bound
  title: משתמשים בחסם מקומי בלי להכניס אותו לדלתא
  belief: >-
    אחרי ש"$|x+3|<7$ ליד 3" מספיק לבחור $\delta=\frac{\varepsilon}{7}$.
  truth: >-
    החסם $|x+3|<7$ נכון רק כש-$|x-3|<1$, ולכן $\delta$ חייב להבטיח גם את זה: $\delta=\min(1,\frac{\varepsilon}{7})$.
    עם $\delta=\frac{\varepsilon}{7}$ ו-$\varepsilon=70$ מקבלים $\delta=10$, ו-$x=12$ נותן $|x^2-9|=135>70$.
  remedy: { lesson: '3.3', label: 'בחירת דלתא: למה המינימום' }
