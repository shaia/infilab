# Misconceptions first detected in lesson 5.2 (the rules of differentiation).
- id: MC-product-rule-naive
  title: גוזרים מכפלה כמו סכום
  belief: >-
    הנגזרת של מכפלה היא מכפלת הנגזרות, $(fg)'=f'g'$, או נוסחה דומה שלא נבדקה.
  truth: >-
    $(fg)'=f'g+fg'$. בדיקה עם $f=g=x$: $(x^2)'=2x$, ואילו $f'g'=1$. כש-$x$ זז, כל אחד מהגורמים משתנה
    כשהשני מוכפל בו.
  remedy: { lesson: '5.2', label: 'כלל המכפלה והוכחתו' }

- id: MC-quotient-rule-naive
  title: גוזרים מנה כמנת הנגזרות
  belief: >-
    הנגזרת של $\frac fg$ היא $\frac{f'}{g'}$.
  truth: >-
    $\left(\frac fg\right)'=\frac{f'g-fg'}{g^2}$ בכל נקודה שבה $g\neq0$. בדיקה עם $f=g=x$: המנה קבועה ונגזרתה
    0, ואילו $\frac{f'}{g'}=1$.
  remedy: { lesson: '5.2', label: 'כלל המנה והוכחתו' }

- id: MC-quotient-rule-order
  title: הופכים את הסדר במונה של כלל המנה
  belief: >-
    $\left(\frac fg\right)'=\frac{fg'-f'g}{g^2}$.
  truth: >-
    הסדר הפוך מזה, ולכן גם הסימן: $\frac{f'g-fg'}{g^2}$. בדיקה עם $g=1$ מזכירה את הסדר: צריך לקבל $f'$.
  remedy: { lesson: '5.2', label: 'כלל המנה והוכחתו' }

- id: MC-nondiff-sum-product
  title: כללים לא נכונים לסכום ומכפלה של פונקציות שאינן גזירות
  belief: >-
    אם $f+g$ או $fg$ גזירה אז $f$ ו-$g$ גזירות; מכפלה של שתי פונקציות שאינן גזירות, או של גזירה בשאינה גזירה,
    אינה גזירה; וסכום של גזירה ושאינה גזירה עשוי להיות גזיר.
  truth: >-
    רק טענה אחת כזו נכונה: סכום של גזירה ושאינה גזירה אינו גזיר, כי $g=(f+g)-f$. כל השאר נכשלות:
    $|x|+(-|x|)=0$, $|x|\cdot|x|=x^2$, ו-$x\cdot|x|$ גזירה ב-0.
  remedy: { lesson: '5.2', label: 'כללי הגזירה: מה הם אומרים ומה לא' }

- id: MC-nonzero-at-point-nonzero-nearby
  title: חושבים שפונקציה ששונה מאפס בנקודה שונה מאפס בסביבתה, בלי רציפות
  belief: >-
    אם $g(x_0)\neq0$ אז $g(x)\neq0$ ליד $x_0$ (או אפילו לכל $x$), בלי שום הנחה נוספת.
  truth: >-
    זה נכון כש-$g$ רציפה ב-$x_0$ (שימור סימן), ולא בלי רציפות: הפונקציה ששווה ל-1 ב-0 ול-0 בכל מקום אחר
    מתאפסת בכל סביבה של 0. בכלל המנה הרציפות באה מהגזירות של $g$.
  remedy: { lesson: '5.2', label: 'כלל המנה: למה המנה מוגדרת בסביבה' }

- id: MC-abs-of-differentiable
  title: חושבים שהערך המוחלט של פונקציה גזירה גזיר
  belief: >-
    אם $g$ גזירה אז גם $|g|$ גזירה.
  truth: >-
    בנקודה שבה $g$ מתאפסת ו-$g'\neq0$ נוצרת פינה: $|\sin x|$ ו-$|x^2-1|$ אינן גזירות ב-0 וב-1 בהתאמה.
    כש-$g$ ו-$g'$ מתאפסות יחד, כמו $|x^3|$ ב-0, הערך המוחלט עשוי להיות גזיר.
  remedy: { lesson: '5.2', label: 'נגזרות חד-צדדיות של ערך מוחלט' }

- id: MC-seam-piece-derivatives
  title: בודקים גזירות בנקודת התפר רק לפי הנגזרות של החלקים
  belief: >-
    פונקציה מוגדרת למקוטעין גזירה בנקודת התפר אם הנגזרות של שני הביטויים שוות שם.
  truth: >-
    קודם בודקים רציפות בנקודת התפר, ורק אחר כך את הנגזרות החד-צדדיות של $f$ עצמה. אם $f(x)=x^2$ משמאל ל-1
    ו-$f(x)=2x$ מ-1 והלאה, לשני הביטויים נגזרת 2 ב-1, אבל $f$ קופצת שם ואינה גזירה.
  remedy: { lesson: '5.2', label: 'גזירות בנקודת התפר' }
