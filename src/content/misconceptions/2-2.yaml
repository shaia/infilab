# Misconceptions first detected in lesson 2.2 (the definition of a limit).
- id: MC-limit-quantifier-order
  title: מחליפים את סדר הכמתים בהגדרת הגבול
  belief: >-
    "קיים N כך שלכל אפסילון..." אומר אותו דבר כמו "לכל אפסילון קיים N...".
  truth: >-
    כש-$N$ בא קודם, אותו $N$ חייב להתאים לכל $\varepsilon$, ואז הסדרה קבועה מ-$N$ והלאה. בהגדרת הגבול
    $N$ נבחר אחרי $\varepsilon$ ותלוי בו.
  remedy: { lesson: '2.2', anchor: definition, label: 'הגדרת הגבול: הסביבה ו-N שתלוי בה' }

- id: MC-limit-all-terms
  title: חושבים שכל איברי הסדרה צריכים להיות קרובים לגבול
  belief: >-
    אם $a_n \to L$, אז כל האיברים, כבר מהראשון, קרובים ל-$L$; ואיבר אחד רחוק מספיק כדי לשלול גבול.
  truth: >-
    הגבול תלוי רק בזנב של הסדרה. מספר סופי של איברים בהתחלה יכול להיות כל דבר, ובשביל זה ההגדרה מתחילה
    רק מ-$N$.
  remedy: { lesson: '2.2', anchor: fig-2-2a, label: 'הגדרת הגבול: למה יש N' }

- id: MC-limit-infinitely-often
  title: '"אינסוף איברים קרובים" במקום "כל האיברים מ-N והלאה"'
  belief: >-
    אם אינסוף איברים נמצאים בסביבה של $L$ (או שווים ל-$L$), הסדרה שואפת ל-$L$.
  truth: >-
    ההגדרה דורשת שמ-$N$ והלאה **כל** האיברים יהיו בסביבה. $(-1)^n$ שווה ל-1 אינסוף פעמים ואינה מתכנסת.
    "אינסוף איברים בתוך **כל** סביבה של $L$" מתאר גבול חלקי (שיעור 2.9), לא גבול.
  remedy: { lesson: '2.2', anchor: fig-2-2b, label: 'הגדרת הגבול: הסדרה מינוס אחד בחזקת n' }

- id: MC-limit-few-epsilons
  title: בודקים כמה ערכים של אפסילון ומסיקים התכנסות
  belief: >-
    אם התנאי מתקיים ל-$\varepsilon=0.1$ ול-$\varepsilon=0.01$, הסדרה מתכנסת.
  truth: >-
    ההגדרה היא "לכל $\varepsilon>0$". בדיקה של מספר סופי של ערכים, כמה שיהיו, אינה הוכחה; ההוכחה מראה
    איך מוצאים $N$ לכל $\varepsilon$, בדרך כלל בנוסחה.
  remedy: { lesson: '2.2', anchor: definition, label: 'הגדרת הגבול: לכל אפסילון' }

- id: MC-limit-N-independent
  title: חושבים ש-N לא תלוי באפסילון
  belief: >-
    ב-$\varepsilon$-$N$ מחפשים מספר $N$ קבוע אחד, או שמספר האיברים מחוץ לסביבה צריך להיות זהה לכל סביבה.
  truth: >-
    $N$ הוא פונקציה של $\varepsilon$, ובדרך כלל גדל כש-$\varepsilon$ קטן. מה שקבוע הוא רק שמחוץ לכל
    סביבה יש מספר סופי של איברים.
  remedy: { lesson: '2.2', anchor: fig-2-2a, label: 'הגדרת הגבול: N שתלוי באפסילון' }

- id: MC-N-is-first-index
  title: מבלבלים בין N לבין האיבר הראשון שנכנס לסביבה
  belief: >-
    ה-$N$ של ההגדרה הוא האינדקס של האיבר הראשון שנמצא בתוך הסביבה.
  truth: >-
    ההגדרה אומרת "לכל $n>N$", ולכן התנאי מתחיל מ-$N+1$. ה-$N$ הקטן ביותר הוא האינדקס של האיבר **האחרון** שמחוץ לסביבה, לא האיבר הראשון שבתוכה פחות אחד: בסדרה $\frac{2+(-1)^n}{n}$ עם $\varepsilon = 0.1$ האיבר $a_{11}$ כבר בפנים, אבל $a_{30}$ עוד בחוץ, ולכן $N = 30$. בהוכחות זה כמעט לא משנה (כל $N$ גדול יותר גם
    עובד), אבל כשמבקשים את ה-$N$ הקטן ביותר צריך לקרוא את ההגדרה במדויק.
  remedy: { lesson: '2.2', anchor: find-n, label: 'מציאת N לאפסילון נתון' }

- id: MC-N-must-be-minimal
  title: חושבים שבהוכחה צריך את ה-N הקטן ביותר
  belief: >-
    הוכחה של גבול חייבת למצוא את ה-$N$ המינימלי, ו-$N$ גדול יותר הוא טעות.
  truth: >-
    ההגדרה אומרת "קיים $N$". כל $N$ שעובד מספיק, וכל $N$ גדול ממנו גם עובד; לכן מותר, ורצוי, להעריך
    בגסות כדי לקבל נוסחה פשוטה.
  remedy: { lesson: '2.2', anchor: definition, label: 'כל N גדול יותר גם מתאים' }

- id: MC-n-inequality-wrong-power
  title: מבודדים את n בלי לטפל בחזקה או בשורש
  belief: >-
    מ-$\frac{1}{\sqrt n}<\varepsilon$ מקבלים $n>\frac1\varepsilon$, כאילו השורש לא שם.
  truth: >-
    מבודדים צעד אחר צעד: $\frac{1}{\sqrt n}<\varepsilon \iff \sqrt n>\frac1\varepsilon \iff n>\frac{1}{\varepsilon^2}$.
    בדיקה עם מספר אחד, למשל $\varepsilon = 0.1$, תופסת את הטעות מיד.
  remedy: { lesson: '2.2', anchor: find-n, label: 'איך מוצאים N' }
