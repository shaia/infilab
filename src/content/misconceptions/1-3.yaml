# Misconceptions first detected in lesson 1.3 (naturals, integers, rationals).
- id: MC-inductive-set-is-N
  title: חושבים שכל קבוצה אינדוקטיבית היא הטבעיים, או מוכלת בהם
  belief: >-
    קבוצה אינדוקטיבית היא $\mathbb{N}$, או לפחות מוכלת ב-$\mathbb{N}$; לכן אם $[1,\infty)$ אינדוקטיבית, כל
    איבריה טבעיים.
  truth: >-
    $\mathbb{R}$, $\mathbb{Z}$ ו-$[1,\infty)$ כולן אינדוקטיביות. $\mathbb{N}$ היא הקטנה ביותר: היא מוכלת
    בכל אחת מהן. לכן כשמראים ש-$S$ אינדוקטיבית מקבלים $\mathbb{N}\subseteq S$, כלומר מידע על מה שאין
    ב-$\mathbb{N}$.
  remedy: { lesson: '1.3', anchor: 'naturals', label: 'הטבעיים כקבוצה האינדוקטיבית הקטנה ביותר' }

- id: MC-sqrt-irrational-proof-any-n
  title: חושבים שההוכחה לשורש 2 עובדת כמו שהיא לכל מספר
  belief: >-
    ההוכחה שאין רציונלי שריבועו $2$ מראה, בלי שינוי, שלכל מספר (או לכל מספר שאינו שלם) אין שורש רציונלי;
    ולמשל ל-$3$ מספיק להשוות את הזוגיות של שני האגפים.
  truth: >-
    ההוכחה משתמשת בכך ש-$p^2$ זוגי גורר $p$ זוגי, ובכך שאחרי $p=2k$ נשאר $q^2=2k^2$. ל-$4$ השלב השני
    נכשל ($2^2=4$), ול-$3$ השוואת הזוגיות של האגפים לא מספיקה: צריך מידע עדין יותר, למשל שאריות בחלוקה
    ב-3 (או ב-4).
  remedy: { lesson: '1.3', anchor: 'generalise', label: 'שורש 2 אינו רציונלי, ואיך מכלילים את ההוכחה' }

- id: MC-irrational-closure-confused
  title: מבלבלים אילו תכונות סגירות יש לרציונליים ואילו לאי-רציונליים
  belief: >-
    האי-רציונליים סגורים לחיבור ולכפל כמו הרציונליים; או להפך, שרציונלי ועוד אי-רציונלי יכול לצאת רציונלי.
  truth: >-
    $\mathbb{Q}$ סגורה לארבע הפעולות (בלי חלוקה באפס), ולכן רציונלי ועוד אי-רציונלי הוא תמיד אי-רציונלי.
    האי-רציונליים אינם סגורים: $\sqrt2+(-\sqrt2)=0$ ו-$\sqrt2\cdot\sqrt2=2$.
  remedy: { lesson: '1.3', anchor: 'closure', label: 'סגירות ואי-סגירות' }

- id: MC-rational-times-irrational-zero
  title: שוכחים את המקרה אפס כשכופלים רציונלי באי-רציונלי
  belief: >-
    מכפלה של רציונלי כלשהו באי-רציונלי היא תמיד אי-רציונלית.
  truth: >-
    $0\cdot x=0$ רציונלי. ההוכחה ש-$rx$ אי-רציונלי מחלקת ב-$r$, ולכן היא דורשת $r\neq0$.
  remedy: { lesson: '1.3', anchor: 'closure', label: 'סגירות: מכפלה ברציונלי' }

- id: MC-close-means-equal
  title: חושבים ששבר שמתקרב כמה שרוצים למספר יפגע בו בסוף
  belief: >-
    שברים מתקרבים ל-$\sqrt2$ כמה שרוצים (למשל $\frac{577}{408}$), ולכן עם מכנה גדול מספיק יש שבר שריבועו
    בדיוק $2$; או שאפשר להכריע בשאלה בבדיקה של הרבה מכנים.
  truth: >-
    "קרוב כמה שרוצים" ו"שווה" הם שני דברים שונים: $577^2-2\cdot408^2=1\ne0$, ולפי משפט 1.3.15 אין אף
    שבר שריבועו $2$. בדיקה של מספר סופי של מכנים היא עדות, לא הוכחה.
  remedy: { lesson: '1.3', anchor: 'hook-answer', label: 'בחזרה לשבר שכמעט שווה' }
