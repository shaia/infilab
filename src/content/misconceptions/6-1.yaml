# Misconceptions first detected in lesson 6.1 (lim sup and lim inf).
- id: MC-limsup-is-sup
  title: מבלבלים בין הגבול העליון לבין הסופרמום של איברי הסדרה
  belief: >-
    הגבול העליון של סדרה הוא הסופרמום של קבוצת האיברים שלה, $\sup_n a_n$.
  truth: >-
    הגבול העליון תלוי רק בזנבות: $\limsup a_n = \lim_{n\to\infty} \sup_{k\ge n} a_k$. מספר סופי של איברים
    גדולים בהתחלה משנה את הסופרמום ולא את הגבול העליון. ב-$(-1)^n\left(1+\frac1n\right)$ הסופרמום הוא
    $\frac32$ והגבול העליון הוא $1$.
  remedy: { lesson: '6.1', label: 'הגבול העליון: סופרמום של זנבות, לא של כל הסדרה' }

- id: MC-limsup-function-range
  title: לוקחים את הגבול העליון מהטווח של הפונקציה במקום מהערכים שהסדרה מקבלת
  belief: >-
    הגבול העליון של $\sin\left(\frac{n\pi}{3}\right)$ הוא $1$, כי $1$ הוא הערך הגדול ביותר של סינוס.
  truth: >-
    הגבול העליון נקבע לפי הערכים שהסדרה מקבלת אינסוף פעמים או מתקרבת אליהם. הסדרה
    $\sin\left(\frac{n\pi}{3}\right)$ מקבלת רק את הערכים $0$, $\pm\frac{\sqrt3}{2}$, ולכן הגבול העליון שלה
    $\frac{\sqrt3}{2}$.
  remedy: { lesson: '6.1', label: 'חישוב גבול עליון: מוצאים את הגבולות החלקיים' }

- id: MC-limsup-may-not-exist
  title: חושבים שלסדרה שאינה מתכנסת אין גבול עליון
  belief: >-
    גבול עליון קיים רק לסדרה מתכנסת, או רק לסדרה חסומה; לסדרה כמו $(-1)^n$ או $n$ אין גבול עליון.
  truth: >-
    לכל סדרה יש גבול עליון, אולי $\pm\infty$: סדרת הסופרמומים של הזנבות מונוטונית יורדת, ולכן יש לה גבול
    במובן הרחב. לסדרה חסומה הוא מספר ממשי, גם כשהיא מתבדרת: הגבול העליון של $(-1)^n$ הוא $1$.
  remedy: { lesson: '6.1', label: 'למה לכל סדרה יש גבול עליון' }

- id: MC-limsup-equal-enough
  title: שוכחים שבמשפט ההתכנסות הגבולות העליון והתחתון צריכים להיות סופיים
  belief: >-
    אם הגבול העליון שווה לגבול התחתון, הסדרה מתכנסת.
  truth: >-
    הסדרה מתכנסת אם ורק אם הגבול העליון והתחתון שווים **וסופיים**. אם שניהם $\infty$, כמו בסדרה $a_n=n$,
    הסדרה שואפת לאינסוף, ואינה מתכנסת.
  remedy: { lesson: '6.1', label: 'התכנסות: גבול עליון ותחתון שווים וסופיים' }

- id: MC-limsup-eventual-bound
  title: חושבים שמהמקום מסוים כל האיברים קטנים מהגבול העליון או שווים לו
  belief: >-
    אם $\limsup a_n = L$, אז $a_n \le L$ לכל $n$ גדול מספיק.
  truth: >-
    מובטח רק ש-$a_n < L+\varepsilon$ מ-$N$ והלאה, לכל $\varepsilon>0$. הסדרה $\frac1n$ מקיימת
    $\limsup \frac1n = 0$ וכל איבריה חיוביים.
  remedy: { lesson: '6.1', label: 'האפיון של הגבול העליון עם אפסילון' }

- id: MC-limsup-additive
  title: חושבים שהגבול העליון של סכום הוא סכום הגבולות העליונים
  belief: >-
    $\limsup (a_n+b_n) = \limsup a_n + \limsup b_n$ לכל שתי סדרות חסומות.
  truth: >-
    מתקיים רק אי-שוויון: $\limsup (a_n+b_n) \le \limsup a_n + \limsup b_n$. עם $a_n=(-1)^n$
    ו-$b_n=-(-1)^n$ האגף השמאלי $0$ והימני $2$. שוויון מובטח כשאחת הסדרות מתכנסת.
  remedy: { lesson: '6.1', label: 'גבול עליון של סכום' }

- id: MC-limsup-from-one-subsequence
  title: לוקחים את הגבול של תת-סדרה אחת נוחה בתור הגבול העליון
  belief: >-
    מוצאים תת-סדרה מתכנסת (למשל בבולצאנו-ויירשטראס, או $a_{3n}$), והגבול שלה הוא הגבול העליון.
  truth: >-
    תת-סדרה אחת נותנת גבול חלקי אחד. הגבול העליון הוא הגדול מבין **כל** הגבולות החלקיים, ולכן צריך לפצל את
    הסדרה לתת-סדרות שמכסות את כל האיברים, או לעבוד עם הסופרמומים של הזנבות.
  remedy: { lesson: '6.1', label: 'הגבול העליון כגבול החלקי הגדול ביותר' }
