# Misconceptions first detected in lesson 1.5 (the completeness axiom).
- id: MC-completeness-no-hypotheses
  title: משתמשים באקסיומת השלמות בלי לבדוק את תנאיה
  belief: >-
    לכל קבוצת ממשיים יש סופרמום, ולכן אפשר לכתוב $\sup A$ בלי לבדוק ש-$A$ לא ריקה וחסומה מלעיל.
  truth: >-
    ל-$\mathbb{N}$ אין סופרמום (אינה חסומה) וגם ל-$\varnothing$ אין. לפני שכותבים $\sup A$ בודקים את שני
    התנאים, ורק אז האקסיומה מבטיחה קיום.
  remedy: { lesson: '1.5', label: 'אקסיומת השלמות ותנאיה' }

- id: MC-dense-means-complete
  title: חושבים שצפיפות הרציונליים פירושה שאין בהם חורים
  belief: >-
    בין כל שני רציונליים יש רציונלי נוסף, ולכן $\mathbb{Q}$ "רציף" ומקיים את אקסיומת השלמות; לקבוצה חסומה
    של רציונליים יש סופרמום רציונלי.
  truth: >-
    צפיפות ושלמות הן תכונות שונות. $\{x\in\mathbb{Q}: x^2<2\}$ חסומה ואין לה סופרמום ב-$\mathbb{Q}$: החסמים
    הרציונליים שלה אפשר תמיד להקטין. השלמות היא בדיוק מה שמוסיפים ל-$\mathbb{Q}$ כדי לקבל את $\mathbb{R}$.
  remedy: { lesson: '1.5', label: 'למה הרציונליים אינם שלמים' }

- id: MC-sup-proof-one-side
  title: מוכיחים סופרמום רק מצד אחד
  belief: >-
    כדי להוכיח ש-$s=\sup A$ מספיק להראות ש-$s$ חסם מלעיל של $A$.
  truth: >-
    הוכחת סופרמום היא תמיד שני צעדים: $s$ חסם מלעיל, **ו**אין חסם מלעיל קטן ממנו (לכל $\varepsilon>0$ יש
    $a\in A$ עם $a>s-\varepsilon$). בלי הצעד השני גם כל חסם גדול יותר היה "מוכח".
  remedy: { lesson: '1.5', label: 'חישוב סופרמום והוכחה משני הכיוונים' }

- id: MC-set-parameter-vs-element
  title: מבלבלים בין הפרמטר שמייצר איבר לבין האיבר עצמו
  belief: >-
    ב-$\left\{\frac{x}{1+x}: x>0\right\}$, כש-$x$ אינו חסום גם הקבוצה אינה חסומה; וכדי למצוא איבר קרוב
    ל-$1-\varepsilon$ בוחרים $x$ קרוב ל-$1-\varepsilon$.
  truth: >-
    איברי הקבוצה הם הערכים $\frac{x}{1+x}$, לא ה-$x$-ים. החסמים והאפסילון נבדקים על האיברים; את הפרמטר
    בוחרים כך שהאיבר שהוא מייצר יעמוד בדרישה.
  remedy: { lesson: '1.5', label: 'סופרמום של קבוצה שמוגדרת בנוסחה' }

- id: MC-sup-negative-scalar
  title: שוכחים שכפל במספר שלילי מחליף בין סופרמום לאינפימום
  belief: >-
    $\sup(cA)=c\sup A$ לכל $c$, ו-$\sup(A-B)=\sup A-\sup B$.
  truth: >-
    כפל במספר שלילי הופך את הסדר: עבור $c<0$, $\sup(cA)=c\inf A$. בפרט $\sup(-B)=-\inf B$, ולכן
    $\sup(A-B)=\sup A-\inf B$.
  remedy: { lesson: '1.5', label: 'סופרמום של כפל בקבוע' }

- id: MC-sup-strict-inclusion
  title: טועים במה שהכלה של קבוצות אומרת על הסופרמום
  belief: >-
    אם $A\subsetneq B$ אז $\sup A<\sup B$, כי ב-$B$ יש יותר איברים; או שאין שום קשר בין שני הסופרמומים.
  truth: >-
    מ-$A\subseteq B$ נובע תמיד $\sup A\le\sup B$, כי $\sup B$ חוסם גם את $A$. אי-שוויון ממש אינו מובטח:
    $\sup[0,1)=\sup[0,1]=1$.
  remedy: { lesson: '1.5', label: 'סופרמום של קבוצה מוכלת' }
