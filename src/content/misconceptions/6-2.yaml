# Misconceptions first detected in lesson 6.2 (uniform continuity).
- id: MC-uc-is-pointwise
  title: חושבים שרציפות במידה שווה היא רציפות בכל נקודה
  belief: >-
    "רציפה במידה שווה בקטע" ו"רציפה בכל נקודה של הקטע" הן אותה הגדרה, ואפשר לבחור את $\delta$ אחרי
    שבוחרים את הנקודה.
  truth: >-
    ברציפות בכל נקודה $\delta$ תלוי גם ב-$\varepsilon$ וגם בנקודה $x$. ברציפות במידה שווה $\delta$ נבחר
    אחרי $\varepsilon$ בלבד, ואותו $\delta$ עובד לכל זוג נקודות בתחום. $x^2$ רציפה בכל נקודה של
    $\mathbb{R}$, אבל לא במידה שווה.
  remedy: { lesson: '6.2', label: 'סדר הכמתים: דלתא אחת לכל הנקודות' }

- id: MC-continuous-implies-uc
  title: חושבים שפונקציה רציפה בקטע חסום רציפה בו במידה שווה
  belief: >-
    כל פונקציה רציפה בקטע, או לפחות בקטע חסום, רציפה בו במידה שווה.
  truth: >-
    משפט קנטור דורש קטע סגור וחסום. $\frac1x$ ו-$\sin\frac1x$ רציפות בקטע החסום $(0,1)$ ואינן רציפות בו
    במידה שווה; $x^2$ רציפה בקטע הסגור והלא חסום $[0,\infty)$ ואינה רציפה בו במידה שווה.
  remedy: { lesson: '6.2', label: 'משפט קנטור ומה קורה בלי ההנחות שלו' }

- id: MC-uc-pairs-not-close
  title: מפריכים רציפות במידה שווה עם זוג סדרות שמקיים רק חצי מהתנאי
  belief: >-
    כדי להראות ש-$f$ אינה רציפה במידה שווה מספיק למצוא סדרות $x_n,y_n$ עם $f(x_n)-f(y_n)$ גדול, או סדרות
    עם $x_n-y_n\to 0$.
  truth: >-
    צריך את שני התנאים יחד: $x_n-y_n\to 0$ **וגם** $|f(x_n)-f(y_n)|\ge\varepsilon_0$ לכל $n$. עבור $x^2$
    הזוג $x_n=n+1$, $y_n=n$ לא מוכיח דבר (המרחק לא שואף לאפס), והזוג $x_n=\frac1n$, $y_n=0$ לא מוכיח דבר
    (גם ההפרש בערכים שואף לאפס).
  remedy: { lesson: '6.2', label: 'הקריטריון של זוגות סדרות' }

- id: MC-cantor-converse
  title: מסיקים מכך שמשפט קנטור אינו חל שהפונקציה אינה רציפה במידה שווה
  belief: >-
    אם הקטע אינו סגור או אינו חסום, הפונקציה אינה רציפה בו במידה שווה.
  truth: >-
    משפט קנטור נותן תנאי מספיק, לא הכרחי. $x\sin\frac1x$ רציפה במידה שווה בקטע הפתוח $(0,1)$, ו-$\sin x$
    רציפה במידה שווה על כל הישר. כשהמשפט לא חל צריך הוכחה אחרת, בכל אחד מהכיוונים.
  remedy: { lesson: '6.2', label: 'משפט קנטור הוא תנאי מספיק' }

- id: MC-cantor-closed-enough
  title: חושבים שבמשפט קנטור מספיק שהתחום סגור
  belief: >-
    פונקציה רציפה על קבוצה סגורה, כמו $[0,\infty)$, רציפה עליה במידה שווה.
  truth: >-
    ההוכחה של קנטור צריכה שתת-סדרה של נקודות בתחום תתכנס לנקודה בתחום, ובשביל זה צריך תחום סגור **וחסום**
    (בולצאנו-ויירשטראס). $x^2$ על $[0,\infty)$ רציפה ואינה רציפה במידה שווה.
  remedy: { lesson: '6.2', label: 'איפה ההוכחה של קנטור משתמשת בכל הנחה' }

- id: MC-uc-implies-lipschitz
  title: חושבים שכל פונקציה רציפה במידה שווה מקיימת תנאי ליפשיץ
  belief: >-
    אם $f$ רציפה במידה שווה, יש קבוע $M$ כך ש-$|f(x)-f(y)|\le M|x-y|$, או שהנגזרת שלה חסומה.
  truth: >-
    ליפשיץ גורר רציפות במידה שווה, אבל לא להפך. $\sqrt x$ רציפה במידה שווה ב-$[0,1]$, ובכל זאת
    $\frac{\sqrt x - 0}{x-0} = \frac{1}{\sqrt x}$ אינו חסום ליד $0$.
  remedy: { lesson: '6.2', label: 'ליפשיץ, רציפות במידה שווה, והשורש' }
