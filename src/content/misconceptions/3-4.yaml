# Misconceptions first detected in lesson 3.4 (Heine's definition and the equivalence).
- id: MC-heine-some-sequences
  title: בודקים סדרה אחת או כמה סדרות ומסיקים שהגבול קיים
  belief: >-
    אם $f\left(\frac1n\right)\to L$, או אם שתי סדרות שונות נותנות את אותו גבול, אז $\lim_{x\to0}f(x)=L$.
  truth: >-
    הגדרת היינה דורשת $f(x_n)\to L$ **לכל** סדרה $x_n\to a$ עם $x_n\neq a$. מספר סופי של סדרות, או אפילו
    סדרה אחת מסוג מיוחד, לא מספיק: $\sin\frac{\pi}{x}$ מתאפסת ב-$x_n=\frac1n$, אבל בסדרה $y_n=\frac{2}{4n+1}$ היא
    שווה ל-1. סדרה אחת **יכולה** להוכיח שגבול אינו קיים, או שאינו $L$.
  remedy: { lesson: '3.4', label: 'הגדרת היינה: לכל סדרה' }

- id: MC-heine-allows-xn-equal-a
  title: מתירים בהגדרת היינה סדרות שאיבריהן שווים לנקודה
  belief: >-
    בהגדרת היינה מספיק ש-$x_n\to a$; אפשר לקחת גם את הסדרה הקבועה $x_n=a$.
  truth: >-
    ההגדרה דורשת $x_n\neq a$ לכל $n$, ובכך היא מקבילה לתנאי $0<|x-a|$ של קושי. בלי הדרישה הזו הפונקציה ששווה
    ל-0 כש-$x\neq0$ ול-1 ב-0 הייתה "בלי גבול" ב-0 (הסדרה הקבועה 0 נותנת 1), אף שלפי קושי הגבול שלה 0.
  remedy: { lesson: '3.4', label: 'הגדרת היינה: למה x_n שונה מ-a' }

- id: MC-heine-sequence-not-to-a
  title: בוחרים סדרות שאינן שואפות לנקודה
  belief: >-
    כדי להוכיח שאין גבול ב-$a$ מספיק למצוא שתי סדרות כלשהן שעליהן ערכי $f$ שואפים לגבולות שונים.
  truth: >-
    שתי הסדרות צריכות לשאוף ל-$a$ (ולהיות שונות מ-$a$). סדרה שהולכת לנקודה אחרת בודקת את $f$ במקום אחר ולא
    אומרת דבר על הגבול ב-$a$.
  remedy: { lesson: '3.4', label: 'הוכחת אי-קיום בעזרת שתי סדרות' }
