# Misconceptions first detected in lesson 1.1 (the field axioms).
- id: MC-axiom-misattributed
  title: מייחסים מעבר בהוכחה לאקסיומה הלא נכונה
  belief: >-
    כל מעבר אלגברי מוצדק ב"חוקי החשבון", ולא משנה איזו אקסיומה; למשל, חילופיות או קיבוציות מרשות לפתוח
    סוגריים.
  truth: >-
    כל אקסיומה מתירה שכתוב מסוים אחד: חילופיות מחליפה סדר, קיבוציות מזיזה סוגריים, ורק חוק הפילוג פותח
    מכפלה של סכום. כשמצדיקים מעבר, מצביעים על האקסיומה שאומרת בדיוק אותו.
  remedy: { lesson: '1.1', label: 'אקסיומות השדה: מה כל אקסיומה מרשה' }

- id: MC-field-inverse-confusion
  title: מבלבלים בין הנגדי להופכי
  belief: >-
    הנגדי וההופכי הם אותו רעיון, ואפשר להשתמש באחד במקום השני; למשל, ההופכי של $3$ ב-$\mathbb{Z}_7$ הוא $4$.
  truth: >-
    הנגדי $-a$ מקיים $a+(-a)=0$ ושייך לחיבור; ההופכי $a^{-1}$ מקיים $a\cdot a^{-1}=1$, שייך לכפל, וקיים רק
    ל-$a\neq0$.
  remedy: { lesson: '1.1', label: 'אקסיומות השדה: נגדי והופכי' }

- id: MC-zero-inverse-is-infinity
  title: חושבים שלאפס יש הופכי, אינסוף
  belief: >-
    $\frac10=\infty$, וההחרגה $a\neq0$ באקסיומת ההופכי היא רק מוסכמה.
  truth: >-
    מהאקסיומות נובע $0\cdot x=0$ לכל $x$, ולכן אילו היה לאפס הופכי היינו מקבלים $0=1$. אינסוף אינו איבר של
    השדה.
  remedy: { lesson: '1.1', label: 'למה לאפס אין הופכי' }

- id: MC-field-fact-taken-as-axiom
  title: מתייחסים לעובדה מוכרת כאילו היא אקסיומה
  belief: >-
    עובדות כמו $0\cdot a=0$, $(-1)a=-a$, $1>0$ או "אי אפשר לחלק באפס" הן אקסיומות, או שהן ברורות ואינן
    צריכות הוכחה.
  truth: >-
    האקסיומות הן רשימה קצרה וסגורה. כל עובדה אחרת, מוכרת ככל שתהיה, היא משפט: מוכיחים אותה מהאקסיומות,
    ורק אז מותר להשתמש בה.
  remedy: { lesson: '1.1', label: 'מה אקסיומה ומה משפט' }

- id: MC-zn-always-field
  title: חושבים שחשבון מודולו n הוא תמיד שדה
  belief: >-
    $\mathbb{Z}_n$ שדה לכל $n$, ולכן דוגמה כמו $2\cdot3=0$ ב-$\mathbb{Z}_6$ מפריכה טענות על שדות.
  truth: >-
    $\mathbb{Z}_n$ שדה בדיוק כש-$n$ ראשוני. ב-$\mathbb{Z}_6$ ל-$2$ אין הופכי, ולכן מה שקורה בו לא אומר דבר
    על שדות.
  remedy: { lesson: '1.1', label: 'מבנים שהם שדה ומבנים שאינם' }

- id: MC-field-closure-enough
  title: חושבים שסגירות ועוד כמה אקסיומות מספיקות לשדה
  belief: >-
    אם הפעולות סגורות ורוב האקסיומות מתקיימות (יש אפס, יש נגדי), המבנה הוא שדה; למשל $\mathbb{Z}$.
  truth: >-
    שדה חייב לקיים את **כל** האקסיומות. אקסיומה אחת שנכשלת, כמו הופכי לכל איבר שונה מאפס, מספיקה כדי שהמבנה
    לא יהיה שדה.
  remedy: { lesson: '1.1', label: 'בודקים את כל האקסיומות' }

- id: MC-field-must-be-numbers
  title: חושבים שאיברי שדה חייבים להיות מספרים רגילים
  belief: >-
    שדה הוא קבוצה של מספרים; שאריות או מטריצות "אינן מספרים", ולכן הן נפסלות מראש, ומחפשים את ההופכי של
    $3$ ב-$\mathbb{Z}_7$ בין השברים.
  truth: >-
    שדה מוגדר רק על ידי האקסיומות. איבריו יכולים להיות כל דבר, ו-$\mathbb{Z}_5$ הוא שדה. כל חישוב נעשה
    בתוך המבנה, בפעולות שלו.
  remedy: { lesson: '1.1', label: 'שדה מוגדר על ידי האקסיומות' }

- id: MC-field-usual-operations
  title: בודקים את האקסיומות עם הפעולות והאיברים הרגילים במקום אלה של המבנה
  belief: >-
    איבר היחידה של כל שדה הוא המספר $1$, והאפס הוא $0$; כשבודקים חוק פילוג או הופכי, מחשבים עם הכפל הרגיל.
  truth: >-
    האקסיומות מדברות על הפעולות של המבנה הנתון. איבר היחידה הוא האיבר $e$ שמקיים $e*a=a$ בכפל **שלו**, והוא
    יכול להיות כל איבר (עבור $a*b=2ab$ הוא $\frac12$).
  remedy: { lesson: '1.1', label: 'שדה עם כפל חדש' }
