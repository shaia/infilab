# Misconceptions first detected in lesson 6.4 (the Taylor polynomial).
- id: MC-taylor-forget-factorial
  title: שוכחים לחלק בעצרת במקדמי טיילור
  belief: >-
    המקדם של $(x-a)^k$ בפולינום טיילור הוא $f^{(k)}(a)$; או, בכיוון ההפוך, הנגזרת ה-$k$-ית בנקודה שווה
    למקדם.
  truth: >-
    המקדם הוא $\frac{f^{(k)}(a)}{k!}$, כי הנגזרת ה-$k$-ית של $(x-a)^k$ היא $k!$. לכן גם
    $f^{(k)}(a) = k!\cdot c_k$, לא $c_k$.
  remedy: { lesson: '6.4', label: 'הגדרת פולינום טיילור והמקדמים' }

- id: MC-taylor-pattern-guess
  title: מעתיקים את התבנית של פיתוח מוכר במקום לחשב את הנגזרות
  belief: >-
    לכל הפיתוחים אותה צורה: עצרות במכנה (כמו ב-$e^x$), או סימנים מתחלפים בכל איבר, או איבר חופשי $1$.
  truth: >-
    המקדמים נקבעים מהנגזרות בנקודה, ולכל פונקציה תבנית משלה. ב-$\ln(1+x)$ המקדם של $x^k$ הוא
    $\frac{(-1)^{k+1}}{k}$, בלי עצרת ובלי איבר חופשי; בסינוס יש רק חזקות אי-זוגיות.
  remedy: { lesson: '6.4', label: 'פולינומי טיילור של הפונקציות האלמנטריות' }

- id: MC-taylor-center-zero
  title: מפתחים סביב אפס כשהנקודה היא a
  belief: >-
    פולינום טיילור סביב $a$ כתוב בחזקות של $x$, ומקדמיו הם הנגזרות ב-$0$.
  truth: >-
    סביב $a$ הפולינום כתוב בחזקות של $x-a$, והמקדמים הם $\frac{f^{(k)}(a)}{k!}$. לדוגמה, סביב $1$:
    $\ln x \approx (x-1) - \frac{(x-1)^2}{2}$.
  remedy: { lesson: '6.4', label: 'פולינום טיילור סביב נקודה כלשהי' }

- id: MC-little-o-is-big-o
  title: מבלבלים בין o קטן לבין חסימות של המנה
  belief: >-
    $g(x) = o(x^n)$ אומר ש-$g$ בסדר גודל של $x^n$ או קטן ממנו, ולכן גם $x^n$ עצמו, או $2x^n$, הם
    $o(x^n)$.
  truth: >-
    $g(x) = o(x^n)$ כש-$x\to0$ פירושו $\frac{g(x)}{x^n}\to 0$: המנה שואפת לאפס, לא רק חסומה. $x^3$ ו-$x^2\sin x$
    הם $o(x^2)$; $x^2$ ו-$x\sin x$ אינם.
  remedy: { lesson: '6.4', label: 'הסימון o קטן' }

- id: MC-taylor-order-too-low
  title: מפתחים לסדר נמוך מדי, והשארית בולעת את התשובה
  belief: >-
    מספיק לכתוב $\sin x \approx x$ בכל גבול, כי זה "הקירוב של סינוס".
  truth: >-
    מפתחים עד שהאיבר הראשון שלא מתבטל מופיע בצורה מפורשת. ב-$\frac{\sin x - x}{x^3}$ הפיתוח
    $\sin x = x + o(x)$ נותן במונה רק $o(x)$, ואחרי חלוקה ב-$x^3$ לא נשאר מידע. צריך
    $\sin x = x - \frac{x^3}{6} + o(x^3)$.
  remedy: { lesson: '6.4', label: 'חישוב גבולות בעזרת טיילור: עד איזה סדר' }

- id: MC-taylor-uniqueness-any-degree
  title: שוכחים שבמשפט היחידות הפולינום הוא ממעלה לכל היותר n
  belief: >-
    כל פולינום $P$ עם $f(x)-P(x) = o(x^n)$ הוא פולינום טיילור מסדר $n$.
  truth: >-
    היחידות היא בין הפולינומים ממעלה $n$ לכל היותר. פולינום ממעלה גבוהה יותר יכול להוסיף איברים שהם בעצמם
    $o(x^n)$: גם $1+x+\frac{x^2}{2}+x^3$ מקיים $e^x - P(x) = o(x^2)$, ואינו פולינום טיילור מסדר $2$.
  remedy: { lesson: '6.4', label: 'יחידות פולינום טיילור' }
