# Misconceptions first detected in lesson 2.5 (limits and inequalities).
- id: MC-squeeze-unequal-limits
  title: מפעילים את כלל הסנדוויץ' עם חסמים שגבולותיהם שונים
  belief: >-
    אם $a_n\le b_n\le c_n$ ו-$a_n$, $c_n$ מתכנסות, אז $b_n$ מתכנסת, למספר כלשהו שבין שני הגבולות.
  truth: >-
    הסנדוויץ' דורש ש-$a_n$ ו-$c_n$ ישאפו **לאותו** גבול. עם גבולות שונים נובעת רק חסימות:
    $b_n = \frac{1+(-1)^n}{2}$ כלואה בין 0 ל-1 ומתבדרת.
  remedy: { lesson: '2.5', label: 'כלל הסנדוויץ'' ומה הוא דורש' }

- id: MC-squeeze-one-side
  title: מסתפקים בחסם מצד אחד
  belief: >-
    אם $a_n\le L$ לכל $n$ (והחסם הוא "המספר הנכון"), אז $a_n\to L$.
  truth: >-
    חסם מצד אחד לא קובע גבול: $\frac1n\le\sqrt2$ ו-$\frac1n\to0$. הסנדוויץ' צריך חסם מלמטה וחסם מלמעלה ששניהם
    שואפים ל-$L$.
  remedy: { lesson: '2.5', label: 'כלל הסנדוויץ'' ומה הוא דורש' }

- id: MC-sum-of-null-terms
  title: חושבים שסכום של מחוברים ששואפים לאפס שואף לאפס, גם כשמספרם גדל
  belief: >-
    אם כל מחובר ב-$S_n = \sum_{k=1}^{n}\frac{n}{n^2+k}$ שואף ל-0, גם $S_n$ שואף ל-0.
  truth: >-
    כלל הסכום מדבר על מספר קבוע של סדרות. כשמספר המחוברים גדל עם $n$, $n$ מחוברים בערך $\frac1n$ יכולים לתת 1.
    חוסמים את הסכום כולו, למשל במספר המחוברים כפול הקטן והגדול שבהם, ומשתמשים בסנדוויץ'.
  remedy: { lesson: '2.5', label: 'סנדוויץ'' לסכומים' }

- id: MC-limit-keeps-strict
  title: חושבים שגבול שומר על אי-שוויון חזק
  belief: >-
    אם $a_n>0$ לכל $n$ אז $\lim a_n>0$; ואם $a_n<b_n$ לכל $n$ אז $\lim a_n<\lim b_n$.
  truth: >-
    גבולות שומרים על אי-שוויון חלש בלבד: $\frac1n>0$ לכל $n$, והגבול 0. מ-$a_n<b_n$ נובע רק
    $\lim a_n\le\lim b_n$.
  remedy: { lesson: '2.5', label: 'שמירה על אי-שוויון חלש' }

- id: MC-order-converse-weak
  title: מעבירים אי-שוויון חלש בין גבולות אל האיברים
  belief: >-
    אם $\lim a_n\le\lim b_n$, אז $a_n\le b_n$ מ-$N$ מסוים והלאה.
  truth: >-
    רק אי-שוויון **חזק** בין הגבולות עובר לאיברים: אם $\lim a_n<\lim b_n$ אז $a_n<b_n$ מ-$N$ מסוים. כשהגבולות
    שווים אין מסקנה: $\frac1n>0$ לכל $n$ ושני הגבולות 0.
  remedy: { lesson: '2.5', label: 'שמירה על אי-שוויון חלש' }

- id: MC-bounded-factor-blocks-limit
  title: חושבים שגורם מתנודד בלי גבול מונע ממכפלה להתכנס
  belief: >-
    לסדרה $\frac{\sin n}{n}$ אין גבול, כי ל-$\sin n$ אין גבול.
  truth: >-
    סדרה ששואפת לאפס כפול סדרה חסומה שואפת לאפס, בלי קשר לשאלה אם לגורם החסום יש גבול:
    $\left|\frac{\sin n}{n}\right|\le\frac1n$. כלל המכפלה לא חל כאן, אבל המשפט הזה כן.
  remedy: { lesson: '2.5', label: 'אפס כפול חסומה' }
