# Misconceptions first detected in lesson 2.4 (arithmetic of limits).
- id: MC-common-N-too-small
  title: בוחרים N משותף שלא מתאים לשתי הסדרות
  belief: >-
    כשיש $N_1$ לסדרה אחת ו-$N_2$ לשנייה, אפשר לקחת $N = \min(N_1,N_2)$, או את אחד מהם.
  truth: >-
    צריך $n$ שבו שתי ההבטחות תקפות, ולכן $N\ge N_1$ וגם $N\ge N_2$: הבחירה הטבעית היא $\max(N_1,N_2)$. כל $N$
    גדול ממנו גם עובד.
  remedy: { lesson: '2.4', label: 'הוכחת כלל הסכום' }

- id: MC-quotient-rule-no-hypothesis
  title: משתמשים בכלל המנה כשגבול המכנה הוא אפס
  belief: >-
    אם $a_n\to a$, $b_n\to b$ ו-$b_n\ne0$, אז $\frac{a_n}{b_n}\to\frac ab$; ו"אפס חלקי אפס" הוא 1 (או 0).
  truth: >-
    כלל המנה דורש $b\ne0$. כש-$b = 0$ הכלל לא אומר כלום, והמנה יכולה להתכנס לכל מספר, לא להיות חסומה, או
    להתנודד: $\frac{5/n}{1/n} = 5$, $\frac{1/n}{1/n^2} = n$, $\frac{(-1)^n/n}{1/n} = (-1)^n$.
  remedy: { lesson: '2.4', label: 'כלל המנה ומה הוא דורש' }

- id: MC-rational-wrong-terms
  title: בגבול של מנת פולינומים מסתכלים על האיברים הלא נכונים
  belief: >-
    הגבול של $\frac{3n^2-2n+1}{5n^2+4}$ הוא היחס בין המקדמים החופשיים ($\frac14$), או בין האיברים מהחזקה הנמוכה
    ביותר.
  truth: >-
    כש-$n$ גדל, האיברים מהחזקה הגבוהה ביותר קובעים. מחלקים מונה ומכנה בחזקה המובילה של המכנה, ואז כל שאר
    האיברים הופכים לסדרות ששואפות לאפס.
  remedy: { lesson: '2.4', label: 'גבול של מנת פולינומים' }

- id: MC-root-difference-zero
  title: חושבים שהפרש של שני ביטויים גדולים שואף לאפס
  belief: >-
    $\sqrt{n^2+3n}$ ו-$n$ גדלים שניהם בלי הגבלה ו"דומים" זה לזה, ולכן ההפרש ביניהם שואף ל-0.
  truth: >-
    כללי הגבול לא חלים על סדרות לא חסומות, וההפרש יכול לשאוף לכל דבר: $\sqrt{n^2+3n}-n\to\frac32$. כופלים
    בצמוד והופכים את ההפרש למנה שאפשר לחשב.
  remedy: { lesson: '2.4', label: 'כפל בצמוד' }

- id: MC-root-of-difference
  title: מוציאים שורש מהפרש איבר-איבר
  belief: >-
    $\sqrt{n+1}-\sqrt n = \sqrt{(n+1)-n} = 1$.
  truth: >-
    שורש אינו פועל על חיבור וחיסור איבר-איבר: $\sqrt2-\sqrt1\approx0.414\ne1$. מה שכן נכון הוא
    $\sqrt{x}-\sqrt{y} = \frac{x-y}{\sqrt x+\sqrt y}$, וזה הכפל בצמוד.
  remedy: { lesson: '2.4', label: 'כפל בצמוד' }

- id: MC-limit-rules-on-divergent
  title: מפעילים את כללי הגבול על סדרות שאין להן גבול
  belief: >-
    $\lim(a_n+b_n) = \lim a_n+\lim b_n$ (וכך למכפלה ולמנה) תמיד, גם כש-$a_n$ או $b_n$ אינן מתכנסות.
  truth: >-
    כל כלל מניח ששני הגבולות קיימים (ולמנה גם שגבול המכנה שונה מאפס), ורק אז מסיק. כשהם לא קיימים, קודם משנים
    את צורת הביטוי: מחלקים בחזקה המובילה, כופלים בצמוד, או משתמשים בכלל אחר.
  remedy: { lesson: '2.4', label: 'מתי חשבון הגבולות לא חל' }

- id: MC-sum-converges-parts-converge
  title: חושבים שאם סכום מתכנס, כל מחובר מתכנס
  belief: >-
    אם $a_n+b_n$ מתכנסת, אז $a_n$ ו-$b_n$ מתכנסות; ואם שתיהן מתבדרות, גם הסכום מתבדר.
  truth: >-
    כלל הסכום הולך בכיוון אחד. $(-1)^n$ ו-$-(-1)^n$ מתבדרות וסכומן 0. מה שנכון: אם $a_n$ וגם $a_n+b_n$
    מתכנסות, אז $b_n$ מתכנסת.
  remedy: { lesson: '2.4', label: 'מתי חשבון הגבולות לא חל' }

- id: MC-product-converges-factor-converges
  title: חושבים שאם מכפלה מתכנסת, אחד הגורמים מתכנס
  belief: >-
    אם $a_nb_n$ מתכנסת, אז לפחות אחת מהסדרות $a_n$, $b_n$ מתכנסת.
  truth: >-
    $a_n = b_n = (-1)^n$ מתבדרות, ומכפלתן 1. אם ידוע ש-$b_n\to b\ne0$, אז כן $a_n = \frac{a_nb_n}{b_n}$ מתכנסת.
  remedy: { lesson: '2.4', label: 'מתי חשבון הגבולות לא חל' }

- id: MC-null-times-anything
  title: חושבים שגורם ששואף לאפס מאפס כל מכפלה
  belief: >-
    אם $a_n\to0$, אז $a_nb_n\to0$ לכל סדרה $b_n$.
  truth: >-
    זה נכון כש-$b_n$ חסומה (שיעור 2.5), אבל לא באופן כללי: $\frac1n\cdot n^2 = n$, ו-$n\left(\sqrt{n^2+1}-n\right)\to\frac12$.
    כשהגורם השני אינו חסום, צריך לחשב.
  remedy: { lesson: '2.4', label: 'מתי חשבון הגבולות לא חל' }
