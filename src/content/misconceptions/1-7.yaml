# Misconceptions first detected in lesson 1.7 (existence of roots and powers).
- id: MC-sqrt-exists-by-picture
  title: חושבים שקיום שורש 2 ברור מהגרף או מהשבר העשרוני
  belief: >-
    רואים בשרטוט שהגרף של $x^2$ חוצה את הקו $y=2$, או ש-$\sqrt2=1.41421\ldots$ הוא מספר, ולכן קיום השורש
    אינו צריך הוכחה.
  truth: >-
    בתוך $\mathbb{Q}$ אותו שרטוט נראה זהה, ובכל זאת אין שם שורש. הקיום נובע מאקסיומת השלמות:
    $s=\sup\{x\ge0 : x^2<2\}$ מקיים $s^2=2$. גם שבר עשרוני אינסופי הוא מספר רק בזכות השלמות.
  remedy: { lesson: '1.7', anchor: 'root-existence', label: 'קיום שורש בעזרת סופרמום' }

- id: MC-sqrt-sup-one-case
  title: שוללים רק אחד משני המקרים כשמוכיחים שריבוע הסופרמום הוא 2
  belief: >-
    אם $s^2<2$ בלתי אפשרי, אז $s^2=2$ נובע מכך ש-$s$ סופרמום, או מכך שכל האיברים מקיימים $x^2<2$.
  truth: >-
    לפי הטריכוטומיה יש שלושה מקרים. $s^2<2$ נשלל כי $s$ חסם מלעיל (אפשר לדחוף איבר מעליו), ו-$s^2>2$ נשלל
    כי $s$ החסם **הקטן ביותר** (אפשר להוריד חסם מתחתיו). צריך את שני הטיעונים.
  remedy: { lesson: '1.7', anchor: 'root-existence', label: 'קיום שורש: שני המקרים' }

- id: MC-estimate-drop-term-wrong-direction
  title: משמיטים מחובר בהערכה בכיוון הלא נכון
  belief: >-
    כש-$h$ קטן אפשר להזניח את $h^2$ ולכתוב $(s+h)^2<s^2+2sh$; ולהוכחת "$X<2$" מספיק כל אי-שוויון נכון על
    $X$.
  truth: >-
    השמטה של מחובר חיובי **מקטינה** את הביטוי, ולכן נותנת חסם מלרע. כדי להוכיח $X<2$ צריך חסם מלעיל: למשל
    $h^2<h$ כש-$0<h<1$, ואז $(s+h)^2<s^2+h(2s+1)$.
  remedy: { lesson: '1.7', anchor: 'power-estimates', label: 'הערכות בהוכחת קיום השורש' }

- id: MC-negative-exponent-negative
  title: חושבים שמעריך שלילי נותן תוצאה שלילית
  belief: >-
    $8^{-2/3}=-4$: מינוס במעריך הופך את התוצאה לשלילית.
  truth: >-
    $a^{-r}=\frac1{a^r}$. לבסיס חיובי כל חזקה חיובית; מעריך שלילי מעביר למכנה.
  remedy: { lesson: '1.7', anchor: 'rational-power', label: 'חזקה רציונלית: מעריך שלילי' }

- id: MC-sqrt-square-is-x
  title: חושבים שהשורש של x בריבוע הוא x, או פלוס-מינוס x
  belief: >-
    $\sqrt{x^2}=x$ לכל $x$, או $\sqrt{x^2}=\pm x$.
  truth: >-
    $\sqrt{y}$ הוא השורש **האי-שלילי** היחיד של $y$, ולכן $\sqrt{x^2}=|x|$. עבור $x=-3$: $\sqrt9=3$.
  remedy: { lesson: '1.7', anchor: 'root-rules', label: 'השורש החיובי היחיד' }

- id: MC-rational-power-representation
  title: לא בודקים שהחזקה הרציונלית אינה תלויה בהצגת השבר
  belief: >-
    $a^{m/n}$ מוגדר היטב "ברור", כי $\frac24=\frac12$; או להפך, ש-$\left(a^{1/4}\right)^2$ עשוי להיות שונה
    מ-$a^{1/2}$.
  truth: >-
    ההגדרה $\left(a^{1/n}\right)^m$ משתמשת ב-$m$ וב-$n$, ולכן צריך להוכיח שהצגות שונות של אותו שבר נותנות
    אותה תוצאה. ההוכחה, לבסיס חיובי, היא מיחידות השורש החיובי.
  remedy: { lesson: '1.7', anchor: 'well-defined', label: 'חזקה רציונלית מוגדרת היטב' }

- id: MC-rational-power-negative-base
  title: חושבים שחזקה רציונלית עובדת גם לבסיס שלילי
  belief: >-
    חוקי החזקות הרציונליות נכונים לכל בסיס, וההגבלה $a>0$ היא רק נוחות; או שלמספר שלילי אין שורשים בכלל.
  truth: >-
    לבסיס שלילי התוצאה תלויה בהצגת השבר והחוקים נשברים: $-1=(-1)^{2\cdot\frac12}$, אבל
    $\left((-1)^2\right)^{1/2}=1$. שורש אי-זוגי של שלילי קיים, אבל חזקות רציונליות כלליות מגדירים רק ל-$a>0$.
  remedy: { lesson: '1.7', anchor: 'negative-base', label: 'למה הבסיס חיובי' }

- id: MC-irrational-power-wrong-side
  title: לוקחים את הקצה הלא נכון בהגדרת חזקה אי-רציונלית
  belief: >-
    $a^x$ הוא האינפימום של $a^r$ על $r<x$, או הסופרמום על $r>x$.
  truth: >-
    עבור $a>1$ החזקה עולה ב-$r$: מהרציונליים $r<x$ לוקחים **סופרמום** (ושקול לו האינפימום על $r>x$). האינפימום
    על $r<x$ הוא $0$, ולסופרמום על $r>x$ אין חסם.
  remedy: { lesson: '1.7', anchor: 'real-power', label: 'חזקה עם מעריך אי-רציונלי' }

- id: MC-irrational-power-sup-small-base
  title: משתמשים באותה נוסחת סופרמום גם לבסיס קטן מ-1
  belief: >-
    $a^x=\sup\{a^r : r\in\mathbb{Q},\ r<x\}$ לכל $a>0$; או שלבסיס קטן מ-1 אין חזקה אי-רציונלית.
  truth: >-
    כש-$0<a<1$ החזקה יורדת ב-$r$, והקבוצה אינה חסומה מלעיל. מגדירים $a^x=\left(\frac1a\right)^{-x}$, עם
    $\frac1a>1$.
  remedy: { lesson: '1.7', anchor: 'real-power', label: 'חזקה אי-רציונלית של בסיס קטן מ-1' }

- id: MC-irrational-power-circular
  title: משתמשים בחזקה האי-רציונלית בתוך ההגדרה שלה
  belief: >-
    הקבוצה $\{2^r : r<\sqrt2\}$ חסומה ב-$2^{\sqrt2}$, ולכן יש לה סופרמום.
  truth: >-
    $2^{\sqrt2}$ הוא מה שמגדירים, ולכן אסור להשתמש בו. החסם צריך להיות מספר שכבר מוגדר, למשל $2^2$, בעזרת
    המונוטוניות של חזקות רציונליות.
  remedy: { lesson: '1.7', anchor: 'real-power-bounded', label: 'חזקה אי-רציונלית: למה הקבוצה חסומה' }

- id: MC-root-of-sum
  title: חושבים שהשורש של סכום הוא סכום השורשים
  belief: >-
    $\sqrt a+\sqrt b=\sqrt{a+b}$, כמו שהשורש של מכפלה הוא מכפלת השורשים.
  truth: >-
    השורש מתחלק על מכפלה ($\sqrt{ab}=\sqrt a\sqrt b$ לבסיסים חיוביים), אבל לא על סכום: $\sqrt1+\sqrt1=2$, ואילו
    $\sqrt2\approx1.41$.
  remedy: { lesson: '1.7', anchor: 'root-rules', label: 'כללי השורשים: מה מותר ומה לא' }
