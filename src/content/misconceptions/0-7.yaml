# Misconceptions first detected in lesson 0.7 (sets).
- id: MC-set-difference-rules
  title: מטפלים בהפרש קבוצות כאילו היה סימטרי או קיבוצי
  belief: >-
    $A\setminus B=B\setminus A$, או $A\setminus(B\setminus C)=(A\setminus B)\setminus C$, כמו באיחוד.
  truth: >-
    הפרש אינו סימטרי ואינו קיבוצי. עבור $A=\{1,2,3,4\}$ ו-$B=\{3,4,5\}$: $A\setminus B=\{1,2\}$ אבל
    $B\setminus A=\{5\}$. עבור $A=B=C=\{1\}$: $A\setminus(B\setminus C)=\{1\}$ אבל $(A\setminus B)\setminus C$ ריקה.
  remedy: { lesson: '0.7', anchor: set-operations, label: 'פעולות על קבוצות' }

- id: MC-complement-de-morgan
  title: חושבים שהמשלים של חיתוך הוא חיתוך המשלימים
  belief: >-
    $(A\cap B)^c=A^c\cap B^c$, ו-$(A\cup B)^c=A^c\cup B^c$.
  truth: >-
    לפי כללי דה-מורגן המשלים מחליף חיתוך באיחוד: $(A\cap B)^c=A^c\cup B^c$ ו-$(A\cup B)^c=A^c\cap B^c$. זה
    אותו כלל כמו בשלילה: "לא (וגם)" הוא "(לא) או (לא)".
  remedy: { lesson: '0.7', anchor: de-morgan, label: 'משלים וכללי דה-מורגן' }

- id: MC-set-equality-one-inclusion
  title: מוכיחים שוויון קבוצות בהכלה אחת
  belief: >-
    אם כל איבר של $A$ נמצא ב-$B$, אז $A=B$.
  truth: >-
    זה מראה רק $A\subseteq B$. שוויון דורש גם $B\subseteq A$: $\{1\}\subseteq\{1,2\}$, והקבוצות שונות. שוויון
    קבוצות מוכיחים בהכלה דו-כיוונית.
  remedy: { lesson: '0.7', anchor: double-inclusion, label: 'שוויון קבוצות בהכלה דו-כיוונית' }

- id: MC-element-vs-subset
  title: מבלבלים בין איבר של קבוצה לבין תת-קבוצה שלה
  belief: >-
    $1\subseteq\{1,2\}$, או $\{1\}\in\{1,2\}$; ובקבוצת החזקה: $1\in\mathcal{P}(\{1,2\})$.
  truth: >-
    $x\in A$ אומר ש-$x$ הוא אחד האיברים של $A$; $X\subseteq A$ אומר שכל איבר של $X$ הוא איבר של $A$. לכן
    $1\in\{1,2\}$ ו-$\{1\}\subseteq\{1,2\}$, אבל $\{1\}\notin\{1,2\}$. האיברים של $\mathcal{P}(A)$ הם תת-קבוצות
    של $A$: $\{1\}\in\mathcal{P}(\{1,2\})$, ו-$1\notin\mathcal{P}(\{1,2\})$.
  remedy: { lesson: '0.7', anchor: power-set, label: 'קבוצת החזקה: איברים שהם קבוצות' }

- id: MC-nested-intersection-nonempty
  title: חושבים שחיתוך של קבוצות לא ריקות שכל אחת מוכלת בקודמת אינו ריק
  belief: >-
    אם $A_1\supseteq A_2\supseteq A_3\supseteq\dots$ וכל $A_n$ לא ריקה, אז גם $\bigcap_{n=1}^{\infty}A_n$ לא
    ריקה: "משהו חייב להישאר".
  truth: >-
    לא בהכרח. עבור $A_n=\{k\in\mathbb{N}:\ k\ge n\}$ כל $A_n$ לא ריקה ו-$A_{n+1}\subseteq A_n$, אבל החיתוך ריק:
    כל $m\in\mathbb{N}$ אינו ב-$A_{m+1}$. לכל איבר יש קבוצה במשפחה שהוא כבר לא בה.
  remedy: { lesson: '0.7', anchor: nested-empty, label: 'חיתוך ריק של קבוצות לא ריקות' }

- id: MC-power-set-union
  title: חושבים שקבוצת החזקה של איחוד היא איחוד קבוצות החזקה
  belief: >-
    $\mathcal{P}(A\cup B)=\mathcal{P}(A)\cup\mathcal{P}(B)$, כמו שמתקיים לחיתוך.
  truth: >-
    תמיד $\mathcal{P}(A)\cup\mathcal{P}(B)\subseteq\mathcal{P}(A\cup B)$, אבל השוויון נכון רק כש-$A\subseteq B$ או
    $B\subseteq A$. עבור $A=\{1\}$ ו-$B=\{2\}$: $\{1,2\}\in\mathcal{P}(A\cup B)$, והיא אינה תת-קבוצה של $A$ ואינה
    תת-קבוצה של $B$.
  remedy: { lesson: '0.7', anchor: power-set-ops, label: 'קבוצת החזקה של חיתוך ושל איחוד' }

- id: MC-pair-order
  title: מתייחסים לזוג סדור כאל קבוצה של שני איברים
  belief: >-
    $(1,2)=(2,1)$, ולכן $A\times B=B\times A$; או: $(a,b)$ הוא $\{a,b\}$.
  truth: >-
    בזוג סדור הסדר קובע: $(a,b)=(c,d)$ רק כש-$a=c$ וגם $b=d$, ולכן $(1,2)\ne(2,1)$. במכפלה $A\times B$ האיבר
    הראשון בא מ-$A$ והשני מ-$B$: עבור $A=\{1\}$, $B=\{2\}$, $A\times B=\{(1,2)\}\ne\{(2,1)\}=B\times A$.
  remedy: { lesson: '0.7', anchor: product, label: 'זוג סדור ומכפלה' }
