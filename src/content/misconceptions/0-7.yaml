# Misconceptions first detected in lesson 0.7 (inequalities and absolute value).
- id: MC-abs-one-side
  title: פותרים אי-שוויון עם ערך מוחלט בלי לפצל למקרים
  belief: >-
    $|x-3|<2$ פירושו $x-3<2$, כלומר $x<5$; את הערך המוחלט פשוט "מורידים".
  truth: >-
    $|t|<r$ פירושו $-r<t<r$: שני תנאים. $|x-3|<2$ הוא $-2<x-3<2$, כלומר $1<x<5$. בביטוי עם כמה ערכים מוחלטים
    מפצלים לפי הנקודות שבהן כל ביטוי מחליף סימן, ופותרים בכל קטע בנפרד.
  remedy: { lesson: '0.7', anchor: solving, label: 'אי-שוויונות עם ערך מוחלט' }

- id: MC-abs-union-intersection
  title: מבלבלים מתי הפתרון הוא קטע ומתי איחוד של קטעים
  belief: >-
    גם $|t|>r$ נותן קטע אחד, למשל $-r>t>r$, או $-r<t<r$.
  truth: >-
    $|t|<r$ הוא "וגם" ($-r<t$ וגם $t<r$): קטע אחד. $|t|>r$ הוא "או" ($t>r$ או $t<-r$): איחוד של שני קטעים.
    "$-r>t>r$" אינו מתקיים לאף $t$ כש-$r>0$.
  remedy: { lesson: '0.7', anchor: fig-0-7a, label: 'אי-שוויונות עם ערך מוחלט: קטע מול איחוד' }

- id: MC-abs-distance-sign
  title: קוראים את |x+a| כמרחק מ-a
  belief: >-
    $|x+2|$ הוא המרחק של $x$ מ-$2$.
  truth: >-
    $|x-a|$ הוא המרחק בין $x$ ל-$a$. לכן $|x+2|=|x-(-2)|$ הוא המרחק מ-$-2$, ו-$|x+2|\le 1$ הוא הקטע
    $[-3,-1]$ סביב $-2$.
  remedy: { lesson: '0.7', anchor: centre-radius, label: 'ערך מוחלט כמרחק: מרכז ורדיוס' }

- id: MC-reverse-triangle-direction
  title: הופכים את כיוון אי-שוויון המשולש בצורתו ההפוכה
  belief: >-
    $|a-b|\le|a|-|b|$, או $|a+b|\ge|a|+|b|$; או שהפרש של חסמים חוסם הפרש.
  truth: >-
    אי-שוויון המשולש חוסם מלמעלה: $|a+b|\le|a|+|b|$. הצורה ההפוכה חוסמת מלמטה: $|a-b|\ge\big||a|-|b|\big|$.
    עבור $a=0$, $b=1$: $|a-b|=1$ ואילו $|a|-|b|=-1$.
  remedy: { lesson: '0.7', anchor: reverse, label: 'אי-שוויון המשולש וצורתו ההפוכה' }

- id: MC-amgm-negative
  title: משתמשים באי-שוויון הממוצעים גם למספרים שליליים
  belief: >-
    $\frac{a+b}{2}\ge\sqrt{ab}$ לכל $a,b$ שעבורם השורש מוגדר.
  truth: >-
    אי-שוויון הממוצעים דורש $a,b\ge 0$. עבור $a=b=-1$: $\frac{a+b}{2}=-1$ ו-$\sqrt{ab}=1$. ההוכחה,
    $(\sqrt a-\sqrt b)^2\ge 0$, משתמשת ב-$\sqrt a$ וב-$\sqrt b$, שמוגדרים רק לאי-שליליים.
  remedy: { lesson: '0.7', anchor: estimates, label: 'אי-שוויון הממוצעים' }

- id: MC-bound-fraction-direction
  title: מקטינים את המונה או מגדילים את המכנה כשרוצים חסם מלמעלה
  belief: >-
    כדי לחסום שבר מלמעלה אפשר לפשט אותו בכל דרך, למשל להחליף את $n+1$ במונה ב-$n$, או להגדיל את המכנה.
  truth: >-
    לשבר חיובי, חסם **מלמעלה** מקבלים כשמגדילים את המונה או מקטינים את המכנה. $\frac{n+1}{n^2+5}\le\frac{2n}{n^2}$
    נכון ($n+1\le 2n$, $n^2+5\ge n^2$), אבל $\frac{n+1}{n^2+5}\le\frac{n}{n^2}$ נכשל כבר ב-$n=6$.
  remedy: { lesson: '0.7', anchor: fractions, label: 'הערכות: חסם מלמעלה ומלמטה' }

- id: MC-order-abs-additive
  title: חושבים שהערך המוחלט של סכום הוא סכום הערכים המוחלטים
  belief: >-
    $|a+b|=|a|+|b|$ לכל $a,b$, כי הערך המוחלט "מוחק את המינוסים".
  truth: >-
    תמיד $|a+b|\le|a|+|b|$ (אי-שוויון המשולש), ושוויון יש בדיוק כש-$ab\ge0$. למשל $|1+(-1)|=0<2$.
  remedy: { lesson: '0.7', anchor: equality, label: 'אי-שוויון המשולש: מתי יש שוויון' }

- id: MC-triangle-equality-case
  title: חושבים שבאי-שוויון המשולש יש שוויון רק במקרים מיוחדים מאוד
  belief: >-
    $|x+y|=|x|+|y|$ רק כש-$x=y$, או רק כשאחד המספרים הוא $0$.
  truth: >-
    יש שוויון בדיוק כש-$xy\ge 0$: כש-$x$ ו-$y$ באותו סימן, או שאחד מהם $0$. למשל $|2+5|=7=|2|+|5|$ אף ש-$2\ne 5$,
    ו-$|{-1}+(-3)|=4=|{-1}|+|{-3}|$. הסיבה: $|x+y|^2=x^2+2xy+y^2$ ו-$(|x|+|y|)^2=x^2+2|xy|+y^2$.
  remedy: { lesson: '0.7', anchor: equality, label: 'אי-שוויון המשולש: מתי יש שוויון' }
