# Misconceptions first detected in lesson 5.9 (convexity and inflection points).
- id: MC-convex-concave-swapped
  title: מחליפים בין קמורה לקעורה
  belief: >-
    פונקציה קמורה היא זו שהגרף שלה נמצא מעל המיתרים, ונגזרת שנייה שלילית נותנת קמירות.
  truth: >-
    לפי ההגדרה $f(tx+(1-t)y)\le t f(x)+(1-t)f(y)$ המיתר נמצא **מעל** הגרף של פונקציה קמורה, כמו ב-$x^2$, ו-$f''\ge0$
    גוררת קמירות. כשמתרגמים אי-שוויון של $-f$ ל-$f$, הכיוון מתהפך. ספרים שונים משתמשים במילים שונות, ולכן
    תמיד חוזרים לאי-השוויון עצמו.
  remedy: { lesson: '5.9', label: 'ההגדרה של קמירות ומשמעותה' }

- id: MC-convex-means-increasing
  title: מבלבלים בין קמירות לבין עלייה וירידה
  belief: >-
    פונקציה קמורה היא פונקציה עולה, או פונקציה שיורדת ואחר כך עולה בצורת "U".
  truth: >-
    קמירות היא תכונה של מיתרים, לא של כיוון: $e^{-x}$ קמורה ויורדת, $e^x$ קמורה ועולה, $f(x)=x$ קמורה ו-$\sqrt x$ עולה
    ואינה קמורה. קמירות קשורה לסימן של $f''$, ומונוטוניות לסימן של $f'$.
  remedy: { lesson: '5.9', label: 'ההגדרה של קמירות ומשמעותה' }

- id: MC-convexity-from-f-prime-sign
  title: קובעים קמירות לפי הסימן של הנגזרת הראשונה
  belief: >-
    $f$ קמורה היכן ש-$f'\le0$ (או $f'\ge0$).
  truth: >-
    הסימן של $f'$ קובע מונוטוניות. קמירות של פונקציה גזירה פעמיים נקבעת לפי הסימן של $f''$, כלומר לפי השאלה
    אם $f'$ עולה.
  remedy: { lesson: '5.9', label: 'נגזרת שנייה וקמירות' }

- id: MC-convex-needs-derivative
  title: חושבים שפונקציה קמורה חייבת להיות גזירה
  belief: >-
    קמירות מוגדרת בעזרת הנגזרת השנייה, ולכן פונקציה שאינה גזירה לא יכולה להיות קמורה.
  truth: >-
    ההגדרה $f(tx+(1-t)y)\le t f(x)+(1-t)f(y)$ לא מזכירה נגזרות. $|x|$ קמורה ואינה גזירה ב-$0$. $f''\ge0$ הוא רק
    תנאי מספיק, לפונקציות שגזירות פעמיים.
  remedy: { lesson: '5.9', label: 'ההגדרה של קמירות ומשמעותה' }

- id: MC-linear-not-convex
  title: חושבים שישר אינו קמור
  belief: >-
    פונקציה קמורה חייבת להיות "מעוקלת"; פונקציה לינארית אינה קמורה ואינה קעורה.
  truth: >-
    פונקציה לינארית מקיימת את ההגדרה בשוויון, ולכן היא גם קמורה וגם קעורה. הגדרה עם $\le$ מתירה שוויון; "קמורה
    ממש" היא ההגדרה עם $<$.
  remedy: { lesson: '5.9', label: 'ההגדרה של קמירות ומשמעותה' }

- id: MC-convex-closed-under-product
  title: חושבים שמכפלה והרכבה של פונקציות קמורות קמורות
  belief: >-
    כמו סכום, גם מכפלה והרכבה של שתי פונקציות קמורות הן קמורות.
  truth: >-
    סכום ומקסימום כן שומרים על קמירות. מכפלה לא: $x\cdot x^2=x^3$. הרכבה לא: $e^{-u}$ ו-$x^2$ קמורות, ו-$e^{-x^2}$ לא.
    הרכבה $f\circ g$ קמורה כש-$g$ קמורה ו-$f$ קמורה ועולה.
  remedy: { lesson: '5.9', label: 'ההגדרה של קמירות ומשמעותה' }

- id: MC-jensen-misapplied
  title: מציבים בהגדרת הקמירות עם המשקלים הלא נכונים
  belief: >-
    בהגדרה אפשר לחבר את הערכים במקום לקחת ממוצע, או לתת את המשקל $t$ לנקודה הקרובה יותר.
  truth: >-
    המשקל $t$ מלווה את $x$ גם בתוך $f$ וגם מחוצה לו: $x_0=tx+(1-t)y$ ו-$t f(x)+(1-t)f(y)$. נקודה קרובה ל-$x$
    מקבלת $t$ קרוב ל-$1$. עם $t=\frac12$ מקבלים ממוצעים, לא סכומים.
  remedy: { lesson: '5.9', label: 'אי-שוויון ינסן לשתי נקודות' }

- id: MC-inflection-where-second-zero
  title: חושבים שכל נקודה שבה הנגזרת השנייה מתאפסת היא נקודת פיתול
  belief: >-
    אם $f''(x_0)=0$, אז $x_0$ נקודת פיתול.
  truth: >-
    נקודת פיתול היא מקום שבו כיוון הקמירות משתנה. $x^4$ מקיימת $f''(0)=0$ וקמורה משני הצדדים. בודקים אם $f''$
    **מחליפה סימן**.
  remedy: { lesson: '5.9', label: 'נקודות פיתול' }

- id: MC-inflection-confused-with-extremum
  title: מבלבלים בין נקודת פיתול לנקודת קיצון
  belief: >-
    נקודת הפיתול היא המקום שבו $f'=0$, שם הגרף "מתהפך".
  truth: >-
    בקיצון $f$ מחליפה כיוון (סימן $f'$ משתנה); בפיתול $f$ מחליפה את כיוון הקמירות (סימן $f''$ משתנה). ב-$x e^{-x}$
    המקסימום ב-$1$ והפיתול ב-$2$.
  remedy: { lesson: '5.9', label: 'נקודות פיתול' }

- id: MC-inflection-outside-domain
  title: מסמנים נקודת פיתול בנקודה שאינה בתחום
  belief: >-
    אם $f''$ מחליפה סימן ב-$x_0$, אז $x_0$ נקודת פיתול, גם כש-$f$ אינה מוגדרת שם.
  truth: >-
    נקודת פיתול היא נקודה של הגרף, שבה $f$ רציפה. ב-$\frac{x^2-3}{x-2}$ כיוון הקמירות משתנה משני צדי $x=2$, אבל שם יש
    אסימפטוטה אנכית ואין נקודת פיתול.
  remedy: { lesson: '5.9', label: 'נקודות פיתול' }
