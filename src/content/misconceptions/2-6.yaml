# Misconceptions first detected in lesson 2.6 (infinite limits).
- id: MC-unbounded-implies-infinity
  title: חושבים שסדרה לא חסומה מלעיל שואפת לאינסוף
  belief: >-
    אם לכל $M$ יש איבר של הסדרה שגדול מ-$M$, אז $a_n \to \infty$.
  truth: >-
    "לא חסומה מלעיל" אומר שלכל $M$ יש איבר **אחד** מעל $M$. "שואפת לאינסוף" אומר שמ-$N$ מסוים והלאה **כל**
    האיברים מעל $M$. הסדרה ששווה ל-$n$ במקומות הזוגיים ול-$0$ באי-זוגיים אינה חסומה, ואינה שואפת לאינסוף.
  remedy: { lesson: '2.6', label: 'לא חסומה, שואפת לאינסוף, מתבדרת סתם' }

- id: MC-reciprocal-of-null-is-infinity
  title: חושבים שאם סדרה שואפת לאפס, ההופכית שלה שואפת לאינסוף
  belief: >-
    אם $b_n \to 0$ ו-$b_n \ne 0$, אז $\frac{1}{b_n} \to \infty$, כי "אחד חלקי אפס הוא אינסוף".
  truth: >-
    זה נכון רק כש-$b_n>0$ מ-$N$ מסוים והלאה. עבור $b_n = \frac{(-1)^n}{n}$ ההופכית היא $(-1)^n n$, שאינה
    שואפת לאינסוף ולא למינוס אינסוף. נכון תמיד רק ש-$\left|\frac{1}{b_n}\right| \to \infty$.
  remedy: { lesson: '2.6', label: 'חשבון הגבולות המורחב' }

- id: MC-indeterminate-form-value
  title: מבלבלים בין צורה לא מוגדרת לצורה שיש לה ערך
  belief: >-
    אינסוף פחות אינסוף הוא 0, אינסוף חלקי אינסוף הוא 1, ואפס כפול אינסוף הוא 0; או להפך, שגם אינסוף ועוד
    אינסוף אינו מוגדר.
  truth: >-
    צורה לא מוגדרת אומרת שהצורה לבדה לא קובעת את הגבול. עבור $a_n,b_n\to\infty$ ההפרש $a_n-b_n$ יכול
    לשאוף לכל מספר, לאינסוף, או לא לשאוף לשום דבר; צריך לפשט את הביטוי עצמו. לעומת זאת $\infty+\infty$
    ו-$\infty\cdot\infty$ הן צורות מוגדרות: התוצאה תמיד אינסוף.
  remedy: { lesson: '2.6', label: 'הצורות הלא-מוגדרות' }

- id: MC-divergent-means-infinity
  title: חושבים שסדרה מתבדרת שואפת לאינסוף או למינוס אינסוף
  belief: >-
    אם לסדרה אין גבול סופי, היא בהכרח שואפת לאינסוף או למינוס אינסוף.
  truth: >-
    יש סדרות מתבדרות "סתם": $(-1)^n$ חסומה ומתבדרת, ו-$(-1)^n n$ לא חסומה ואינה שואפת לאף אחד מהם.
  remedy: { lesson: '2.6', label: 'לא חסומה, שואפת לאינסוף, מתבדרת סתם' }

- id: MC-infinity-requires-monotone
  title: חושבים שסדרה ששואפת לאינסוף חייבת להיות עולה
  belief: >-
    סדרה שאינה מונוטונית לא יכולה לשאוף לאינסוף, כי היא "יורדת לפעמים".
  truth: >-
    ההגדרה דורשת רק שמ-$N$ והלאה כל האיברים מעל $M$. הסדרה $n+2(-1)^n$ אינה מונוטונית (היא קופצת למעלה
    ולמטה) ושואפת לאינסוף, כי $n+2(-1)^n \ge n-2$.
  remedy: { lesson: '2.6', label: 'ההגדרה של שאיפה לאינסוף' }
