# Terms first defined in lesson 0.8 (functions).
- id: function
  term: פונקציה
  en: function
  symbol: 'f:A\to B'
  definition: >-
    כלל שמתאים לכל איבר $x$ של קבוצה $A$ איבר אחד ויחיד $f(x)$ של קבוצה $B$. פונקציה נקבעת על ידי התחום,
    הטווח והכלל יחד, לא על ידי הנוסחה לבדה.
  lesson: '0.8'
- id: function-domain
  term: תחום
  en: domain
  definition: >-
    הקבוצה $A$ ב-$f:A\to B$: הקבוצה שעל איבריה הפונקציה מוגדרת.
  lesson: '0.8'
- id: function-codomain
  term: טווח
  en: codomain
  definition: >-
    הקבוצה $B$ ב-$f:A\to B$: הקבוצה שאליה הפונקציה שולחת. לא כל איבר של הטווח חייב להתקבל.
  lesson: '0.8'
- id: function-image
  term: תמונה
  en: image (range)
  symbol: 'f(A)'
  definition: >-
    קבוצת הערכים שהפונקציה מקבלת בפועל, $f(A)=\{f(x):\ x\in A\}$. היא מוכלת בטווח, ושווה לו בדיוק כש-$f$ על.
  lesson: '0.8'
- id: injective-function
  term: חד-חד-ערכית
  en: injective (one-to-one)
  definition: >-
    $f$ חד-חד-ערכית אם לכל $x_1,x_2$ בתחום, $f(x_1)=f(x_2)$ גורר $x_1=x_2$: נקודות שונות הולכות לערכים שונים.
  reject: [חד חד ערכית]
  lesson: '0.8'
- id: surjective-function
  term: על
  en: surjective (onto)
  definition: >-
    $f:A\to B$ היא על אם לכל $y\in B$ קיים $x\in A$ כך ש-$f(x)=y$, כלומר התמונה שווה לטווח.
  lesson: '0.8'
- id: bijective-function
  term: חד-חד-ערכית ועל
  en: bijective (bijection)
  definition: >-
    פונקציה שהיא גם חד-חד-ערכית וגם על. בדיוק לפונקציות כאלה יש פונקציה הפוכה.
  lesson: '0.8'
- id: function-composition
  term: הרכבה
  en: composition
  symbol: 'g\circ f'
  definition: >-
    $(g\circ f)(x)=g(f(x))$: קודם מפעילים את $f$, ואת התוצאה מציבים ב-$g$. מוגדרת כשהתמונה של $f$ מוכלת בתחום
    של $g$.
  lesson: '0.8'
- id: inverse-function
  term: פונקציה הפוכה
  en: inverse function
  symbol: 'f^{-1}'
  definition: >-
    פונקציה $g:B\to A$ שמבטלת את $f:A\to B$ משני הצדדים: $g\circ f=\mathrm{id}_A$ ו-$f\circ g=\mathrm{id}_B$.
    היא קיימת בדיוק כש-$f$ חד-חד-ערכית ועל, והיא יחידה; מסמנים אותה $f^{-1}$, ו-$f^{-1}(y)$ הוא המקור היחיד של
    $y$. היא אינה $\frac{1}{f}$.
  lesson: '0.8'
- id: preimage
  term: מקור
  en: preimage
  definition: >-
    עבור $f:A\to B$ ו-$y\in B$, איבר $x\in A$ שמקיים $f(x)=y$ נקרא מקור של $y$. לאיבר של הטווח יכולים להיות
    כמה מקורות, או אף לא אחד. $f$ על אם לכל $y$ יש מקור, וחד-חד-ערכית אם לכל $y$ יש לכל היותר מקור אחד.
  lesson: '0.8'
- id: identity-function
  term: פונקציית הזהות
  en: identity function
  symbol: '\mathrm{id}_A'
  definition: >-
    הפונקציה $\mathrm{id}_A:A\to A$ ששולחת כל איבר לעצמו: $\mathrm{id}_A(x)=x$.
  lesson: '0.8'
- id: function-restriction
  term: צמצום של פונקציה
  en: restriction
  definition: >-
    הצמצום של $f:A\to B$ לתת-קבוצה $S\subseteq A$ הוא הפונקציה $S\to B$ שנותנת לכל $x\in S$ את אותו ערך $f(x)$:
    משנים רק את התחום. לצמצום יכולות להיות תכונות שאין ל-$f$: $x^2$ מ-$\mathbb{R}$ אל $\mathbb{R}$ אינה
    חד-חד-ערכית, וצמצומה ל-$[0,\infty)$ כן. כשמקטינים גם את הטווח (למשל אל התמונה), אומרים זאת בנפרד.
  lesson: '0.8'
- id: function-graph
  term: גרף של פונקציה
  en: graph of a function
  symbol: '\Gamma_f'
  definition: >-
    עבור $f:A\to B$, הקבוצה $\Gamma_f=\{(x,f(x)):\ x\in A\}\subseteq A\times B$. בהגדרה הפורמלית פונקציה היא
    תחום, טווח ותת-קבוצה של $A\times B$ שבה לכל $x\in A$ יש זוג אחד בדיוק שמתחיל ב-$x$.
  lesson: '0.8'
- id: set-preimage
  term: מקור של קבוצה
  en: preimage of a set
  symbol: 'f^{-1}(D)'
  definition: >-
    עבור $f:A\to B$ ו-$D\subseteq B$, $f^{-1}(D)=\{x\in A:\ f(x)\in D\}$. מוגדר לכל פונקציה, הפיכה או לא, והוא
    תת-קבוצה של התחום.
  lesson: '0.8'
- id: left-inverse
  term: הפוכה משמאל
  en: left inverse
  definition: >-
    $g:B\to A$ היא הפוכה משמאל של $f:A\to B$ אם $g\circ f=\mathrm{id}_A$. כש-$A$ לא ריקה, יש כזו בדיוק
    כש-$f$ חד-חד-ערכית. היא אינה בהכרח יחידה.
  lesson: '0.8'
- id: right-inverse
  term: הפוכה מימין
  en: right inverse
  definition: >-
    $h:B\to A$ היא הפוכה מימין של $f:A\to B$ אם $f\circ h=\mathrm{id}_B$. אם יש כזו, $f$ היא על. היא אינה בהכרח
    יחידה.
  lesson: '0.8'
- id: finite-set
  term: קבוצה סופית
  en: finite set
  definition: >-
    לקבוצה $A$ יש $n$ איברים אם יש פונקציה חד-חד-ערכית ועל מ-$\{1,\dots,n\}$ אל $A$ (ול-$\emptyset$ יש 0
    איברים). $A$ סופית אם יש לה $n$ איברים עבור $n$ כלשהו, ואינסופית אחרת; $\mathbb{N}$ אינסופית.
  lesson: '0.8'
- id: pigeonhole-principle
  term: עקרון שובך היונים
  en: pigeonhole principle
  definition: >-
    אם $m>n$, אין פונקציה חד-חד-ערכית מקבוצה עם $m$ איברים אל קבוצה עם $n$ איברים: אם מכניסים $m$ יונים ל-$n$
    שובכים, באחד השובכים יש לפחות שתי יונים.
  lesson: '0.8'
