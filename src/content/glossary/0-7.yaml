# Terms first defined in lesson 0.7 (sets).
- id: set
  term: קבוצה
  en: set
  definition: >-
    אוסף של עצמים, שנקראים איברי הקבוצה. קבוצה נקבעת רק לפי האיברים שלה: אין בה סדר ואין בה חזרות.
  lesson: '0.7'
- id: set-element
  term: איבר של קבוצה
  en: element
  symbol: 'x\in A'
  definition: >-
    $x\in A$ פירושו ש-$x$ שייך לקבוצה $A$; $x\notin A$ פירושו שאינו שייך.
  lesson: '0.7'
- id: subset
  term: תת-קבוצה
  en: subset
  symbol: 'A\subseteq B'
  definition: >-
    $A\subseteq B$ ($A$ מוכלת ב-$B$) אם כל איבר של $A$ הוא איבר של $B$. שתי קבוצות שוות אם $A\subseteq B$ וגם
    $B\subseteq A$ (הכלה דו-כיוונית).
  reject: [תת קבוצה]
  lesson: '0.7'
- id: set-union
  term: איחוד
  en: union
  symbol: 'A\cup B'
  definition: >-
    $A\cup B$ היא קבוצת כל ה-$x$ ש-$x\in A$ **או** $x\in B$.
  lesson: '0.7'
- id: set-intersection
  term: חיתוך
  en: intersection
  symbol: 'A\cap B'
  definition: >-
    $A\cap B$ היא קבוצת כל ה-$x$ ש-$x\in A$ **וגם** $x\in B$.
  lesson: '0.7'
- id: disjoint-sets
  term: קבוצות זרות
  en: disjoint sets
  definition: >-
    שתי קבוצות $A$ ו-$B$ זרות אם אין להן איבר משותף, כלומר $A\cap B=\emptyset$.
  lesson: '0.7'
- id: set-difference
  term: הפרש קבוצות
  en: set difference
  symbol: 'A\setminus B'
  definition: >-
    $A\setminus B$ היא קבוצת כל ה-$x$ ש-$x\in A$ ו-$x\notin B$. בדרך כלל $A\setminus B\ne B\setminus A$.
  lesson: '0.7'
- id: set-complement
  term: משלים
  en: complement
  symbol: 'A^c'
  definition: >-
    המשלים של $A$ ביחס לקבוצה גדולה $U$ (אצלנו בדרך כלל $U=\mathbb{R}$) הוא $A^c=U\setminus A$.
  lesson: '0.7'
- id: empty-set
  term: הקבוצה הריקה
  en: empty set
  symbol: '\emptyset'
  definition: >-
    הקבוצה שאין בה אף איבר, $\emptyset$. היא תת-קבוצה של כל קבוצה.
  lesson: '0.7'
- id: de-morgan-sets
  term: כללי דה-מורגן לקבוצות
  en: De Morgan's laws (sets)
  symbol: '(A\cup B)^c=A^c\cap B^c'
  definition: >-
    המשלים מחליף איחוד בחיתוך ולהפך: $(A\cup B)^c=A^c\cap B^c$ ו-$(A\cap B)^c=A^c\cup B^c$. אלה כללי
    השלילה של "או" ושל "וגם", כשהם נאמרים על שייכות לקבוצה.
  lesson: '0.7'
- id: membership-table
  term: טבלת שייכות
  en: membership table
  definition: >-
    טבלת אמת של שייכות: לכל אחת מהאפשרויות לשייכות של $x$ ל-$A$, ל-$B$ (ול-$C$) רושמים אם $x$ שייך לביטוי.
    שתי קבוצות שנבנות מ-$A$, $B$, $C$ בפעולות שוות לכל בחירה של הקבוצות בדיוק כשהשורות שלהן בטבלה זהות.
  lesson: '0.7'
- id: power-set
  term: קבוצת החזקה
  en: power set
  symbol: '\mathcal{P}(A)'
  definition: >-
    קבוצת כל התת-קבוצות של $A$: $\mathcal{P}(A)=\{X:\ X\subseteq A\}$. תמיד $\emptyset\in\mathcal{P}(A)$ ו-$A\in\mathcal{P}(A)$.
  lesson: '0.7'
- id: ordered-pair
  term: זוג סדור
  en: ordered pair
  symbol: '(a,b)'
  definition: >-
    שני איברים בסדר קבוע. $(a,b)=(c,d)$ אם ורק אם $a=c$ וגם $b=d$; לכן $(1,2)\ne(2,1)$, אף ש-$\{1,2\}=\{2,1\}$.
  lesson: '0.7'
- id: cartesian-product
  term: מכפלה קרטזית
  en: Cartesian product
  symbol: 'A\times B'
  definition: >-
    קבוצת כל הזוגות הסדורים $(a,b)$ עם $a\in A$ ו-$b\in B$. המישור הוא $\mathbb{R}\times\mathbb{R}$.
  lesson: '0.7'
- id: indexed-family
  term: משפחה של קבוצות
  en: indexed family of sets
  symbol: '\bigcup_{i\in I}A_i'
  definition: >-
    קבוצה $A_i$ לכל אינדקס $i$ בקבוצה לא ריקה $I$. האיחוד $\bigcup_{i\in I}A_i$ הוא קבוצת ה-$x$ שנמצאים
    ב-$A_i$ עבור $i$ אחד לפחות, והחיתוך $\bigcap_{i\in I}A_i$ קבוצת ה-$x$ שנמצאים ב-$A_i$ לכל $i$.
  lesson: '0.7'
