# Terms first defined in lesson 1.3.
- id: inductive-set
  term: קבוצה אינדוקטיבית
  en: inductive set
  definition: >-
    קבוצה $S\subseteq\mathbb{R}$ שמקיימת $1\in S$, ולכל $x\in S$ גם $x+1\in S$. הטבעיים $\mathbb{N}$ הם
    הקבוצה האינדוקטיבית הקטנה ביותר: החיתוך של כל הקבוצות האינדוקטיביות.
  lesson: '1.3'
- id: natural-number
  term: המספרים הטבעיים
  en: natural numbers
  symbol: '\mathbb{N}'
  definition: >-
    החיתוך של כל תת-הקבוצות האינדוקטיביות של $\mathbb{R}$ (הגדרה 1.3.2): המספרים ששייכים לכל קבוצה
    אינדוקטיבית. $\mathbb{N}=\{1,2,3,\dots\}$, והיא הקבוצה האינדוקטיבית הקטנה ביותר.
  lesson: '1.3'
- id: integer
  term: המספרים השלמים
  en: integers
  symbol: '\mathbb{Z}'
  definition: >-
    $\mathbb{Z}=\mathbb{N}\cup\{0\}\cup\{-n:\ n\in\mathbb{N}\}$ (הגדרה 1.3.7). מספר שלם הוא איבר של
    $\mathbb{Z}$.
  lesson: '1.3'
- id: closed-under-operation
  term: קבוצה סגורה לפעולה
  en: closed under an operation
  definition: >-
    קבוצה $A\subseteq\mathbb{R}$ סגורה לחיבור אם $a+b\in A$ לכל $a,b\in A$, ובאותו אופן לכפל, לחיסור ולחילוק
    (במספר ששונה מאפס). למשל $\mathbb{N}$ סגורה לחיבור ולכפל ולא לחיסור, ו-$\mathbb{Q}$ סגורה לארבע הפעולות.
  lesson: '1.3'
- id: least-denominator
  term: המכנה הקטן ביותר
  en: least denominator
  definition: >-
    לרציונלי $x$, המספר הטבעי הקטן ביותר $b$ שבשבילו $bx$ שלם (למה 1.3.14א). עם $a=bx$ מתקבל
    $x=\frac ab$, והשבר מצומצם: אין שלם $t\ge2$ שמחלק גם את $a$ וגם את $b$.
  lesson: '1.3'
- id: rational-number
  term: מספר רציונלי
  en: rational number
  symbol: '\mathbb{Q}'
  definition: >-
    מספר מהצורה $\frac pq$ עם $p,q$ שלמים ו-$q\neq0$. קבוצת הרציונליים מסומנת $\mathbb{Q}$, והיא שדה
    סדור.
  lesson: '1.3'
- id: irrational-number
  term: מספר אי-רציונלי
  en: irrational number
  definition: >-
    מספר ממשי שאינו רציונלי, כמו $\sqrt2$. קבוצת האי-רציונליים היא $\mathbb{R}\setminus\mathbb{Q}$.
  reject: [אירציונלי]
  lesson: '1.3'
