# Terms first defined in lesson 2.9.
- id: subsequence
  term: תת-סדרה
  en: subsequence
  symbol: '(a_{n_k})_{k=1}^{\infty}'
  definition: >-
    בהינתן סדרה $a_n$ וסדרת אינדקסים טבעיים עולה ממש $n_1<n_2<n_3<\dots$, הסדרה $b_k=a_{n_k}$ היא תת-סדרה של $a_n$.
    באינדוקציה $n_k\ge k$ לכל $k$.
  reject: [תת סדרה]
  lesson: '2.9'
- id: partial-limit
  term: גבול חלקי
  en: partial limit (subsequential limit)
  definition: >-
    מספר ממשי $L$ הוא גבול חלקי של $a_n$ אם יש תת-סדרה $a_{n_k}\to L$. שקול: לכל $\varepsilon>0$ יש אינסוף
    אינדקסים $n$ עם $|a_n-L|<\varepsilon$.
  lesson: '2.9'
- id: bolzano-weierstrass
  term: משפט בולצאנו-ויירשטראס
  en: Bolzano–Weierstrass theorem
  definition: >-
    לכל סדרה חסומה יש תת-סדרה מתכנסת. במילים אחרות: לכל סדרה חסומה יש לפחות גבול חלקי אחד.
  reject: [בולצנו, ויירשטרס]
  lesson: '2.9'
- id: nested-intervals
  term: קטעים מקוננים
  en: nested intervals
  symbol: '[a_1,b_1]\supseteq[a_2,b_2]\supseteq[a_3,b_3]\supseteq\cdots'
  definition: >-
    סדרה של קטעים סגורים שכל אחד מהם מוכל בקודמו: $a_n\le a_{n+1}\le b_{n+1}\le b_n$ לכל $n$. לפי הלמה של קנטור
    (למה 2.9.7), אם בנוסף $b_n-a_n\to0$, יש נקודה אחת ויחידה ששייכת לכל הקטעים.
  lesson: '2.9'
- id: peak
  term: פסגה
  en: peak (of a sequence)
  definition: >-
    מקום $m$ בסדרה $a_n$ כך ש-$a_m\ge a_n$ לכל $n>m$: האיבר במקום $m$ אינו קטן מאף איבר שאחריו. לפי למה 2.9.9,
    אם יש אינסוף פסגות הן נותנות תת-סדרה יורדת, ואם יש מספר סופי של פסגות יש תת-סדרה עולה ממש.
  lesson: '2.9'
