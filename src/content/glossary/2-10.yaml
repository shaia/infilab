# Terms first defined in lesson 2.10.
- id: cauchy-sequence
  term: סדרת קושי
  en: Cauchy sequence
  symbol: '\forall\varepsilon>0\ \exists N\ \forall m,n>N:\ |a_m-a_n|<\varepsilon'
  definition: >-
    סדרה שאיבריה מתקרבים זה לזה: לכל $\varepsilon>0$ קיים $N$ כך שלכל $m,n>N$ מתקיים $|a_m-a_n|<\varepsilon$.
    בממשיים סדרה מתכנסת אם ורק אם היא סדרת קושי.
  lesson: '2.10'

- id: cauchy-criterion
  term: קריטריון קושי
  en: Cauchy criterion
  definition: >-
    המשפט שלפיו סדרה של מספרים ממשיים מתכנסת אם ורק אם היא סדרת קושי (משפט 2.10.5). הוא מאפשר להוכיח התכנסות
    בלי לדעת מהו הגבול, ונשען על אקסיומת השלמות: ברציונליים הוא אינו נכון.
  lesson: '2.10'

- id: partial-sums
  term: סכום חלקי
  en: partial sum
  symbol: 'S_n=\sum_{k=1}^{n}b_k'
  definition: >-
    בהינתן סדרה $(b_k)$, הסכום החלקי ה-$n$-י הוא $S_n=b_1+b_2+\dots+b_n$. הסכומים החלקיים הם סדרה חדשה,
    $(S_n)$, וההפרש בין שני סכומים חלקיים הוא סכום של קטע: $S_m-S_n=b_{n+1}+\dots+b_m$ כש-$m>n$.
  lesson: '2.10'

- id: telescoping-sum
  term: סכום טלסקופי
  en: telescoping sum
  symbol: '\sum_{k=n}^{m-1}(c_{k+1}-c_k)=c_m-c_n'
  definition: >-
    סכום של הפרשים עוקבים, $(c_{n+1}-c_n)+(c_{n+2}-c_{n+1})+\dots+(c_m-c_{m-1})$, שבו כל איבר בפנים מופיע פעם
    עם פלוס ופעם עם מינוס, ולכן נשארים רק הקצוות: $c_m-c_n$.
  lesson: '2.10'

- id: contractive-sequence
  term: סדרה מכווצת
  en: contractive sequence
  symbol: '|a_{n+2}-a_{n+1}|\le q\,|a_{n+1}-a_n|,\ 0<q<1'
  definition: >-
    סדרה שבה כל הפרש עוקב קטן לפחות פי קבוע מההפרש שלפניו: יש $0<q<1$ כך ש-$|a_{n+2}-a_{n+1}|\le q\,|a_{n+1}-a_n|$
    לכל $n$ (או לכל $n$ מאיזה מקום). כל סדרה מכווצת מתכנסת (מסקנה 2.10.8).
  lesson: '2.10'
