# Terms first defined in lesson 1.2.
- id: order-axioms
  term: אקסיומות הסדר
  en: order axioms
  definition: >-
    התכונות שמניחים על היחס $<$: טריכוטומיה, טרנזיטיביות ($a<b,\ b<c \Rightarrow a<c$), התאמה לחיבור ($a<b
    \Rightarrow a+c<b+c$) והתאמה לכפל ($a<b,\ 0<c \Rightarrow ac<bc$).
  lesson: '1.2'
- id: trichotomy
  term: טריכוטומיה
  en: trichotomy
  definition: >-
    אקסיומת הסדר שלפיה לכל $a,b$ מתקיים בדיוק אחד מהשלושה: $a<b$, $a=b$ או $b<a$.
  lesson: '1.2'
- id: ordered-field
  term: שדה סדור
  en: ordered field
  definition: >-
    שדה עם יחס $<$ שמקיים את אקסיומות הסדר. $\mathbb{Q}$ ו-$\mathbb{R}$ הם שדות סדורים; $\mathbb{C}$ ו-$\mathbb{Z}_5$
    אינם יכולים להיות סדורים.
  lesson: '1.2'
