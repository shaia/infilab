# Terms first defined in lesson 2.2.
- id: limit-of-sequence
  term: גבול של סדרה
  en: limit of a sequence
  symbol: '\lim_{n\to\infty} a_n = L'
  definition: >-
    $L$ הוא הגבול של $a_n$ אם לכל $\varepsilon>0$ קיים $N$ כך שלכל $n>N$ מתקיים $|a_n-L|<\varepsilon$.
    כותבים גם $a_n \to L$.
  lesson: '2.2'
- id: convergent-sequence
  term: סדרה מתכנסת
  en: convergent sequence
  definition: סדרה שיש לה גבול סופי. סדרה שאין לה גבול סופי נקראת סדרה מתבדרת.
  reject: [סידרה מתכנסת]
  lesson: '2.2'
- id: epsilon-band
  term: רצועת אפסילון
  en: epsilon-neighbourhood
  symbol: '(L-\varepsilon,\ L+\varepsilon)'
  definition: >-
    הקטע הפתוח $(L-\varepsilon, L+\varepsilon)$, כל המספרים שמרחקם מ-$L$ קטן מ-$\varepsilon$. בהגדרת הגבול,
    מ-$N$ והלאה כל איברי הסדרה בתוך הרצועה.
  lesson: '2.2'
- id: fitting-n
  term: N שמתאים לאפסילון
  en: an N that works for epsilon
  definition: >-
    בהינתן סדרה $a_n$, מספר $L$ ו-$\varepsilon>0$: מספר $N\in\mathbb{N}$ מתאים ל-$\varepsilon$ אם
    $|a_n-L|<\varepsilon$ לכל $n>N$. $a_n\to L$ פירושו שלכל $\varepsilon>0$ יש $N$ שמתאים לו (הגדרה 2.2.1).
  lesson: '2.2'
- id: ceiling
  term: ערך שלם עליון
  en: ceiling
  symbol: '\lceil x\rceil'
  definition: >-
    $\lceil x\rceil=-\lfloor -x\rfloor$, השלם הקטן ביותר שגדול או שווה ל-$x$: $\lceil x\rceil-1<x\le\lceil x\rceil$.
    למשל $\lceil 2.5\rceil=3$, $\lceil 3\rceil=3$ ו-$\lceil -2.5\rceil=-2$. נקרא גם "תקרה".
  lesson: '2.2'
- id: tail
  term: זנב של סדרה
  en: tail of a sequence
  definition: >-
    האיברים מאינדקס מסוים והלאה, $a_{N+1}, a_{N+2}, \dots$. הגבול של סדרה תלוי רק בזנבות שלה.
  lesson: '2.2'
