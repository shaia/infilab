# Lesson 0.7 — sets.
# Objectives (src/course.ts):
#   OBJ-0.7-1  operate on sets (union, intersection, difference, complement); prove set equality by double inclusion
#   OBJ-0.7-2  prove the laws of the operations and De Morgan's laws, also for a family of sets
#   OBJ-0.7-3  work with the power set and the Cartesian product, and prove claims about them
# Every finite claim below is recomputed in tests/math/sets.test.ts or by src/math/sets.ts in a scratch script.
chapter: 0
questions:
  - id: Q-0.7-operations
    type: multi
    objectives: [OBJ-0.7-1]
    level: basic
    prompt: >-
      יהיו $A=\{1,2,3,4\}$ ו-$B=\{3,4,5\}$. אילו מהשוויונות הבאים נכונים? סמנו את כולם.
    choices:
      - text: '$A\cap B=\{3,4\}$'
        correct: true
        feedback: נכון. החיתוך הוא האיברים שנמצאים בשתי הקבוצות.
      - text: '$A\setminus B=\{1,2\}$'
        correct: true
        feedback: נכון. מוציאים מ-$A$ את האיברים שנמצאים ב-$B$, כלומר את $3$ ואת $4$.
      - text: '$B\setminus A=\{1,2\}$'
        feedback: >-
          $B\setminus A$ הם האיברים של $B$ שאינם ב-$A$: רק $5$. ההפרש אינו סימטרי:
          $B\setminus A=\{5\}\ne A\setminus B$.
        misconception: MC-set-difference-rules
      - text: '$A\cup B=\{3,4\}$'
        feedback: >-
          זה החיתוך. האיחוד הוא האיברים שנמצאים ב-$A$ **או** ב-$B$: $A\cup B=\{1,2,3,4,5\}$.
        misconception: MC-or-as-and

  - id: Q-0.7-union-or
    type: mc
    objectives: [OBJ-0.7-1]
    level: basic
    prompt: >-
      יהיו $A$ ו-$B$ קבוצות. מתי $x\in A\cup B$?
    choices:
      - text: 'כש-$x\in A$ או $x\in B$, וגם כש-$x$ בשתיהן'
        correct: true
        feedback: >-
          נכון. "או" במתמטיקה הוא "או" כולל (שיעור 0.2): איבר של $A\cap B$ שייך גם ל-$A\cup B$.
      - text: 'כש-$x$ נמצא בדיוק באחת מהקבוצות'
        feedback: >-
          זה "או" מוציא, והוא נותן את ההפרש הסימטרי $(A\setminus B)\cup(B\setminus A)$, לא את האיחוד. למשל עם
          $A=\{1,2\}$, $B=\{2,3\}$: $2\in A\cup B$, אף שהוא בשתיהן.
        misconception: MC-or-exclusive
      - text: 'כש-$x\in A$ וגם $x\in B$'
        feedback: >-
          זה החיתוך $A\cap B$. באיחוד מספיקה אחת מהשייכויות: עם $A=\{1\}$, $B=\{2\}$, $1\in A\cup B$ אף ש-$1\notin B$.
        misconception: MC-or-as-and

  - id: Q-0.7-element-subset
    type: multi
    objectives: [OBJ-0.7-1]
    qualitative: true
    level: basic
    prompt: >-
      אילו מהטענות הבאות נכונות? סמנו את כולן.
    choices:
      - text: '$1\in\{1,2\}$'
        correct: true
        feedback: נכון. $1$ הוא אחד משני האיברים של הקבוצה.
      - text: '$\{1\}\subseteq\{1,2\}$'
        correct: true
        feedback: נכון. האיבר היחיד של $\{1\}$, המספר $1$, נמצא ב-$\{1,2\}$.
      - text: '$\emptyset\subseteq\{1,2\}$'
        correct: true
        feedback: >-
          נכון, לפי טענה 0.7.3(ב): "כל איבר של $\emptyset$ נמצא ב-$\{1,2\}$" נכון באמת ריקה.
      - text: '$\{1\}\in\{1,2\}$'
        feedback: >-
          האיברים של $\{1,2\}$ הם המספרים $1$ ו-$2$, ואף אחד מהם אינו הקבוצה $\{1\}$. הנכון הוא
          $\{1\}\subseteq\{1,2\}$: הכלה, לא שייכות.
        misconception: MC-element-vs-subset
      - text: '$1\subseteq\{1,2\}$'
        feedback: >-
          $\subseteq$ הוא יחס בין שתי קבוצות, ו-$1$ הוא מספר, לא קבוצה של איברים של $\{1,2\}$. הנכון הוא $1\in\{1,2\}$.
        misconception: MC-element-vs-subset

  - id: Q-0.7-one-inclusion
    type: twotier
    objectives: [OBJ-0.7-1]
    qualitative: true
    level: mid
    prompt: >-
      כדי להוכיח ש-$A=B$, סטודנטית הראתה שכל איבר של $A$ נמצא ב-$B$. האם זה מספיק?
    choices:
      - text: לא
        correct: true
        feedback: נכון. היא הוכיחה הכלה אחת מתוך שתיים.
      - text: כן
        feedback: >-
          דוגמה נגדית: $A=\{1\}$ ו-$B=\{1,2\}$. כל איבר של $A$ נמצא ב-$B$, והקבוצות שונות.
        misconception: MC-set-equality-one-inclusion
    reasons:
      - text: 'זה מראה רק $A\subseteq B$; למשל $\{1\}\subseteq\{1,2\}$, והקבוצות שונות'
        correct: true
        feedback: >-
          בדיוק. חסר $B\subseteq A$: צריך גם להראות שכל איבר של $B$ נמצא ב-$A$.
      - text: אם כל האיברים של $A$ נמצאים ב-$B$, הקבוצות זהות
        feedback: >-
          ל-$B$ עשויים להיות איברים נוספים. "כל איבר של $A$ ב-$B$" פירושו רק ש-$A$ מוכלת ב-$B$.
        misconception: MC-set-equality-one-inclusion
      - text: חסר רק לבדוק שאיבר אחד של $B$ נמצא ב-$A$
        feedback: >-
          איבר אחד לא מספיק: צריך שכל איבר של $B$ יהיה ב-$A$. ב-$A=\{1\}$, $B=\{1,2\}$, האיבר $1$ של $B$ נמצא
          ב-$A$, והקבוצות עדיין שונות.
        misconception: MC-examples-are-proof

  - id: Q-0.7-complement
    type: mc
    objectives: [OBJ-0.7-2]
    qualitative: true
    level: mid
    prompt: >-
      יהיו $A,B\subseteq\mathbb{R}$, ונסמן ב-$X^c$ את המשלים של $X$ ב-$\mathbb{R}$. לאיזו קבוצה שווה
      $(A\cap B)^c$?
    choices:
      - text: '$A^c\cup B^c$'
        correct: true
        feedback: >-
          נכון. $x\notin A\cap B$ פירושו "לא ($x\in A$ וגם $x\in B$)", כלומר $x\notin A$ **או** $x\notin B$. זה
          כלל דה-מורגן, אותו כלל כמו בשלילת "וגם".
      - text: '$A^c\cap B^c$'
        feedback: >-
          דוגמה נגדית: $A=(0,2)$, $B=(1,3)$. המספר $\frac12$ נמצא ב-$A$ ולא ב-$B$, ולכן $\frac12\in(A\cap B)^c$;
          אבל $\frac12\notin A^c$, ולכן גם לא בחיתוך המשלימים. המשלים הופך חיתוך לאיחוד.
        misconception: MC-complement-de-morgan
      - text: '$A\cup B$'
        feedback: >-
          איברים של $A\cap B$ נמצאים גם ב-$A\cup B$, ולכן $A\cup B$ לא יכולה להיות המשלים של $A\cap B$ (אלא אם
          החיתוך ריק).
        misconception: MC-complement-de-morgan

  - id: Q-0.7-distributive
    type: rank
    objectives: [OBJ-0.7-2]
    level: exam
    prompt: >-
      הוכיחו: לכל שלוש קבוצות $A$, $B$, $C$ מתקיים $A\cap(B\cup C)=(A\cap B)\cup(A\cap C)$.
    help: 'סדרו את שלבי ההוכחה לפי הסדר הנכון.'
    items:
      - id: plan
        label: 'נוכיח שתי הכלות: כל אגף מוכל באגף השני.'
      - id: take-left
        label: 'יהי $x\in A\cap(B\cup C)$. אז $x\in A$, וגם $x\in B$ או $x\in C$.'
      - id: cases-left
        label: 'אם $x\in B$ אז $x\in A\cap B$, ואם $x\in C$ אז $x\in A\cap C$; בכל מקרה $x\in(A\cap B)\cup(A\cap C)$.'
      - id: take-right
        label: 'להפך, יהי $x\in(A\cap B)\cup(A\cap C)$. בשני המקרים $x\in A$, וגם $x\in B$ או $x\in C$.'
      - id: conclude
        label: 'לכן $x\in A\cap(B\cup C)$. הוכחנו את שתי ההכלות, ולכן הקבוצות שוות.'
    order: [plan, take-left, cases-left, take-right, conclude]
    correctFeedback: >-
      נכון. זו התבנית של כל הוכחת שוויון קבוצות: "יהי $x$ באגף שמאל... לכן $x$ באגף ימין", ואחר כך להפך.
    wrongFeedback: >-
      כל הכלה מתחילה ב"יהי $x$" באחד האגפים ומסתיימת בכך ש-$x$ באגף השני. סיימו הכלה אחת לפני שמתחילים את
      השנייה.

  - id: Q-0.7-diff-assoc
    type: twotier
    objectives: [OBJ-0.7-2]
    qualitative: true
    level: mid
    prompt: >-
      האם לכל שלוש קבוצות $A$, $B$, $C$ מתקיים $A\setminus(B\setminus C)=(A\setminus B)\setminus C$?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. איבר של $A\cap C$ נמצא תמיד באגף שמאל, ואף פעם לא באגף ימין; כל קבוצות שבהן $A\cap C\ne\emptyset$
          הן דוגמה נגדית.
      - text: כן
        feedback: >-
          דוגמה נגדית: $A=B=C=\{1\}$. אגף שמאל $\{1\}\setminus\emptyset=\{1\}$, אגף ימין
          $\emptyset\setminus\{1\}=\emptyset$. הסוגריים בהפרש משנים, בניגוד לאיחוד ולחיתוך.
        misconception: MC-set-difference-rules
    reasons:
      - text: 'עם $A=B=C=\{1\}$ אגף שמאל הוא $\{1\}$ ואגף ימין ריק'
        correct: true
        feedback: >-
          בדיוק. דוגמה נגדית אחת מפריכה טענה על **כל** הקבוצות. ובטבלת השייכות: האגפים שונים בדיוק באזורים של
          $A\cap C$.
      - text: 'הפרש מתנהג כמו איחוד, ולכן אפשר להזיז סוגריים'
        feedback: >-
          איחוד קיבוצי (משפט 0.7.5(ב)), אבל הפרש לא: $A\setminus(B\setminus C)=(A\setminus B)\cup(A\cap C)$, וזה גדול
          יותר מ-$(A\setminus B)\setminus C$ כש-$A\cap C\ne\emptyset$.
        misconception: MC-set-difference-rules
      - text: 'בדקנו את $A=\{1,2\}$, $B=\{2\}$, $C=\{3\}$, ושני האגפים יצאו $\{1\}$'
        feedback: >-
          החישוב נכון ($B\setminus C=\{2\}$, ושני האגפים $\{1\}$), אבל דוגמה אחת שבה האגפים שווים אינה הוכחה. כאן
          $A\cap C=\emptyset$, ולכן הדוגמה פשוט לא פוגשת את האזור שבו הם שונים.
        misconception: MC-examples-are-proof

  - id: Q-0.7-nested-intersection
    type: twotier
    objectives: [OBJ-0.7-2]
    qualitative: true
    level: mid
    prompt: >-
      לכל $n\in\mathbb{N}$ תהי $A_n=\{k\in\mathbb{N}:\ k\ge n\}$. כל $A_n$ לא ריקה, ו-$A_{n+1}\subseteq A_n$. מהי
      $\bigcap_{n=1}^{\infty}A_n$?
    choices:
      - text: '$\emptyset$'
        correct: true
        feedback: >-
          נכון. לכל $m\in\mathbb{N}$, $m\notin A_{m+1}$, ולכן $m$ אינו בחיתוך.
      - text: 'קבוצה לא ריקה, כי כל $A_n$ לא ריקה וכל אחת מוכלת בקודמת'
        feedback: >-
          זה נכון למשפחה **סופית** $A_1\supseteq\dots\supseteq A_N$, שהחיתוך שלה הוא $A_N$. באינסוף קבוצות אין
          "אחרונה": כל $m$ נפלט כבר ב-$A_{m+1}$.
        misconception: MC-nested-intersection-nonempty
      - text: '$\mathbb{N}$'
        feedback: >-
          $\mathbb{N}$ הוא **האיחוד**: כל $k$ נמצא ב-$A_1$. החיתוך דורש $k\in A_n$ **לכל** $n$, ו-$k\notin A_{k+1}$.
        misconception: MC-quantifier-mistranslated
    reasons:
      - text: 'לכל $m\in\mathbb{N}$, $m\notin A_{m+1}$, כי $m\ge m+1$ היה נותן $0\ge1$'
        correct: true
        feedback: >-
          בדיוק. כדי להראות ש-$m$ אינו בחיתוך מספיקה קבוצה **אחת** במשפחה שהוא לא בה: שלילה של "לכל $n$".
      - text: 'החיתוך מכיל את המספר הגדול ביותר, שנמצא בכל הקבוצות'
        feedback: >-
          אין מספר טבעי גדול ביותר: לכל $m$ גם $m+1\in\mathbb{N}$. ולכל $m$, $m\notin A_{m+1}$.
        misconception: MC-nested-intersection-nonempty
      - text: 'בכל אחת מהקבוצות יש אינסוף איברים, ולכן גם בחיתוך'
        feedback: >-
          גודל של כל קבוצה לבדה לא קובע את החיתוך. כאן כל $A_n$ אינסופית, והחיתוך בכל זאת ריק.
        misconception: MC-nested-intersection-nonempty

  - id: Q-0.7-family-demorgan
    type: mc
    objectives: [OBJ-0.7-2]
    level: mid
    prompt: >-
      תהי $A_n\subseteq U$ לכל $n\in\mathbb{N}$, והמשלים ב-$U$. לאיזו קבוצה שווה
      $\big(\bigcap_{n=1}^{\infty}A_n\big)^c$?
    choices:
      - text: '$\bigcup_{n=1}^{\infty}A_n^c$'
        correct: true
        feedback: >-
          נכון, לפי משפט 0.7.10: $x$ אינו בחיתוך אם ורק אם **קיים** $n$ עם $x\notin A_n$, כלומר $x\in A_n^c$
          עבור $n$ כלשהו.
      - text: '$\bigcap_{n=1}^{\infty}A_n^c$'
        feedback: >-
          שלילה של "לכל $n$" היא "קיים $n$", ולא "לכל $n$" של השלילה. עם $U=\{1,2\}$, $A_1=\{1\}$ ו-$A_n=\{2\}$
          לכל $n\ge2$: החיתוך ריק, ולכן המשלים שלו $\{1,2\}$, אבל $\bigcap_n A_n^c=\{2\}\cap\{1\}=\emptyset$.
        misconception: MC-complement-de-morgan
      - text: '$\bigcup_{n=1}^{\infty}A_n$'
        feedback: >-
          איבר שנמצא בכל ה-$A_n$ נמצא גם באיחוד שלהן, ולכן האיחוד לא יכול להיות המשלים של החיתוך (אלא אם החיתוך
          ריק).
        misconception: MC-complement-de-morgan

  - id: Q-0.7-power-set-count
    type: numeric
    objectives: [OBJ-0.7-3]
    level: basic
    prompt: >-
      לקבוצה $\{1,2,3,4\}$ יש $16$ תת-קבוצות. לפי טענה 0.7.11, כמה תת-קבוצות יש לקבוצה $\{1,2,3,4,5\}$?
    answer: 32
    tolerance: 0.001
    correctFeedback: >-
      נכון. לפי טענה 0.7.11 עם $n=4$, התת-קבוצות של $\{1,2,3,4,5\}$ הן $16$ התת-קבוצות של $\{1,2,3,4\}$, ועוד $16$
      הקבוצות שמתקבלות מהן בהוספת $5$: שונות זו מזו (0.7.11(ג)) ושונות מהראשונות (0.7.11(ב)). המספר מוכפל (הערה
      0.7.12).
    wrongFeedback: >-
      לפי טענה 0.7.11, כל תת-קבוצה של $\{1,2,3,4,5\}$ היא תת-קבוצה של $\{1,2,3,4\}$, או תת-קבוצה כזו ועוד $5$. כמה
      יש מכל סוג?
    commonWrong:
      - value: 17
        feedback: >-
          הוספתם רק את $\{5\}$. אבל $5$ אפשר להוסיף ל**כל** אחת מ-$16$ התת-קבוצות של $\{1,2,3,4\}$, ולכל אחת מתקבלת
          קבוצה חדשה: $\{1,5\}$, $\{1,2,5\}$, ועד $\{1,2,3,4,5\}$.
      - value: 31
        feedback: >-
          שכחתם קבוצה אחת מהמשפחה השנייה, כנראה את $\{5\}=\emptyset\cup\{5\}$: גם $\emptyset$ היא תת-קבוצה של
          $\{1,2,3,4\}$ (טענה 0.7.3(ב)), ולכן גם ממנה מתקבלת קבוצה עם $5$.

  - id: Q-0.7-power-membership
    type: multi
    objectives: [OBJ-0.7-3]
    qualitative: true
    level: mid
    prompt: >-
      תהי $A=\{1,2\}$. אילו מהטענות הבאות נכונות? סמנו את כולן.
    choices:
      - text: '$\emptyset\in\mathcal{P}(A)$'
        correct: true
        feedback: נכון. $\emptyset\subseteq A$ (טענה 0.7.3(ב)), ולכן היא איבר של $\mathcal{P}(A)$.
      - text: '$\{1\}\in\mathcal{P}(A)$'
        correct: true
        feedback: נכון. $\{1\}\subseteq A$.
      - text: '$\{\emptyset\}\subseteq\mathcal{P}(A)$'
        correct: true
        feedback: >-
          נכון. האיבר היחיד של $\{\emptyset\}$ הוא $\emptyset$, ו-$\emptyset\in\mathcal{P}(A)$.
      - text: '$1\in\mathcal{P}(A)$'
        feedback: >-
          איברי $\mathcal{P}(A)$ הם **קבוצות** שמוכלות ב-$A$. $1$ הוא איבר של $A$, לא תת-קבוצה שלה; הנכון הוא
          $\{1\}\in\mathcal{P}(A)$.
        misconception: MC-element-vs-subset
      - text: '$\{1\}\subseteq\mathcal{P}(A)$'
        feedback: >-
          $\{1\}\subseteq\mathcal{P}(A)$ אומר שהאיבר $1$ הוא איבר של $\mathcal{P}(A)$, וזה לא נכון. $\{1\}$ הוא
          **איבר** של $\mathcal{P}(A)$, לא תת-קבוצה שלה.
        misconception: MC-element-vs-subset

  - id: Q-0.7-product-pairs
    type: multi
    objectives: [OBJ-0.7-3]
    level: basic
    prompt: >-
      יהיו $A=\{1,2\}$ ו-$B=\{a,b,c\}$. אילו מהטענות הבאות נכונות? סמנו את כולן.
    choices:
      - text: '$(2,c)\in A\times B$'
        correct: true
        feedback: נכון. $2\in A$ ו-$c\in B$.
      - text: 'ב-$A\times B$ יש שישה זוגות'
        correct: true
        feedback: >-
          נכון: $(1,a),(1,b),(1,c),(2,a),(2,b),(2,c)$. לכל אחד משני האיברים של $A$ שלוש אפשרויות מ-$B$.
      - text: '$(c,2)\in A\times B$'
        feedback: >-
          באיבר של $A\times B$ האיבר **הראשון** בא מ-$A$. ב-$(c,2)$ האיבר הראשון הוא $c\notin A$. בזוג סדור הסדר
          קובע: $(c,2)\ne(2,c)$.
        misconception: MC-pair-order
      - text: '$A\times B=B\times A$'
        feedback: >-
          $(1,a)\in A\times B$, אבל $(1,a)\notin B\times A$, כי האיבר הראשון של זוג ב-$B\times A$ שייך ל-$B$. שתי
          הקבוצות שונות, אף שבשתיהן שישה זוגות.
        misconception: MC-pair-order

  - id: Q-0.7-power-union
    type: twotier
    objectives: [OBJ-0.7-3]
    qualitative: true
    level: exam
    prompt: >-
      האם לכל שתי קבוצות $A$ ו-$B$ מתקיים $\mathcal{P}(A\cup B)=\mathcal{P}(A)\cup\mathcal{P}(B)$?
    choices:
      - text: לא
        correct: true
        feedback: >-
