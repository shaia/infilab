# Lesson 0.7 — inequalities and absolute value.
# Objectives (src/course.ts):
#   OBJ-0.7-1  solve inequalities with absolute values and describe the solution as an interval or a union of intervals
#   OBJ-0.7-2  prove and use the triangle inequality and its reverse form
#   OBJ-0.7-3  use the AM-GM inequality and simple estimates to bound an expression from above and from below
chapter: 0
questions:
  - id: Q-0.7-abs-less
    type: mc
    objectives: [OBJ-0.7-1]
    qualitative: true
    level: basic
    prompt: >-
      מהי קבוצת הפתרונות של $|x-3|<2$?
    choices:
      - text: '$(1,5)$'
        correct: true
        feedback: >-
          נכון. $|x-3|<2$ פירושו שהמרחק של $x$ מ-$3$ קטן מ-$2$, כלומר $-2<x-3<2$, ולכן $1<x<5$.
      - text: '$(-\infty,5)$'
        feedback: >-
          זה רק החצי $x-3<2$. גם $x=-10$ מקיים אותו, אבל $|{-10}-3|=13$. $|t|<2$ הוא שני תנאים: $t<2$ **וגם**
          $t>-2$.
        misconception: MC-abs-one-side
      - text: '$(-\infty,1)\cup(5,\infty)$'
        feedback: >-
          זה הפתרון של $|x-3|>2$: המספרים ש**רחוקים** מ-$3$ יותר מ-$2$. כאן מבקשים את הקרובים, קטע אחד סביב $3$.
        misconception: MC-abs-union-intersection

  - id: Q-0.7-abs-distance
    type: mc
    objectives: [OBJ-0.7-1]
    qualitative: true
    level: basic
    prompt: >-
      הקבוצה $\{x\in\mathbb{R}:\ |x+2|\le 1\}$ היא קבוצת הנקודות שמרחקן מנקודה מסוימת הוא לכל היותר $1$. מהי
      הנקודה, ומהי הקבוצה?
    choices:
      - text: 'הנקודה $-2$, והקבוצה $[-3,-1]$'
        correct: true
        feedback: >-
          נכון. $|x+2|=|x-(-2)|$ הוא המרחק של $x$ מ-$-2$. הנקודות במרחק עד $1$ ממנה הן הקטע הסגור $[-3,-1]$.
      - text: 'הנקודה $2$, והקבוצה $[1,3]$'
        feedback: >-
          המרחק מ-$a$ הוא $|x-a|$. לכן $|x+2|$ הוא המרחק מ-$-2$. בדקו: $x=2$ נותן $|2+2|=4$, שאינו קטן מ-$1$.
        misconception: MC-abs-distance-sign
      - text: 'הנקודה $-2$, והקבוצה $(-\infty,-1]$'
        feedback: >-
          זה רק התנאי $x+2\le 1$. גם $x=-10$ מקיים אותו, אבל מרחקו מ-$-2$ הוא $8$. צריך גם $x+2\ge -1$.
        misconception: MC-abs-one-side

  - id: Q-0.7-abs-greater
    type: mc
    objectives: [OBJ-0.7-1]
    level: mid
    prompt: >-
      מהי קבוצת הפתרונות של $|2x+1|\ge 3$?
    choices:
      - text: '$(-\infty,-2]\cup[1,\infty)$'
        correct: true
        feedback: >-
          נכון. $|t|\ge 3$ פירושו $t\ge 3$ **או** $t\le -3$. כאן $2x+1\ge 3$ נותן $x\ge 1$, ו-$2x+1\le -3$ נותן
          $x\le -2$.
      - text: '$[-2,1]$'
        feedback: >-
          זה הפתרון של $|2x+1|\le 3$. למשל $x=0$ נמצא בקטע, אבל $|2\cdot 0+1|=1<3$. "גדול מ" נותן איחוד של שני
          קטעים, לא קטע אחד.
        misconception: MC-abs-union-intersection
      - text: '$[1,\infty)$'
        feedback: >-
          זה רק המקרה $2x+1\ge 3$. גם $x=-5$ מקיים את אי-השוויון: $|{-9}|=9\ge 3$.
        misconception: MC-abs-one-side
      - text: 'אין פתרון, כי צריך $-2\ge x\ge 1$'
        feedback: >-
          שני התנאים מחוברים ב"או", לא ב"וגם", ולכן אי אפשר לכתוב אותם כשרשרת אחת. כל $x\ge 1$ וכל $x\le -2$ הוא
          פתרון.
        misconception: MC-abs-union-intersection

  - id: Q-0.7-abs-squares
    type: twotier
    objectives: [OBJ-0.7-1]
    qualitative: true
    level: mid
    prompt: >-
      האם לכל $x,y$ ממשיים מתקיים: $|x|<|y|$ אם ורק אם $x^2<y^2$?
    choices:
      - text: כן
        correct: true
        feedback: >-
          נכון. זה מאפשר להיפטר מערכים מוחלטים בהעלאה בריבוע: למשל $|x-1|<|x+1|$ שקול ל-$(x-1)^2<(x+1)^2$,
          כלומר ל-$x>0$.
      - text: לא
        feedback: >-
          $x^2=|x|^2$ ו-$y^2=|y|^2$, ו-$|x|$, $|y|$ אי-שליליים. על מספרים אי-שליליים העלאה בריבוע שומרת על הסדר
          בשני הכיוונים.
        misconception: MC-square-preserves-order
    reasons:
      - text: '$x^2=|x|^2$ ו-$y^2=|y|^2$, ועל מספרים אי-שליליים $a<b$ אם ורק אם $a^2<b^2$'
        correct: true
        feedback: >-
          בדיוק. ההוכחה של הכיוון האחרון: אם $0\le a<b$ אז $a^2\le ab<b^2$; ואם $a\ge b\ge 0$ אז $a^2\ge b^2$.
      - text: 'לכל $x,y$ ממשיים $x<y$ אם ורק אם $x^2<y^2$, ובפרט עבור $|x|$ ו-$|y|$'
        feedback: >-
          המסקנה נכונה, אבל הנימוק שגוי: $-3<2$ ו-$9>4$. העלאה בריבוע שומרת על הסדר רק במספרים אי-שליליים, ולכן
          הערכים המוחלטים חשובים כאן.
        misconception: MC-square-preserves-order
      - text: '$x=-3$, $y=2$ היא דוגמה נגדית'
        feedback: >-
          עבור $x=-3$, $y=2$: $|x|<|y|$ שקר ($3<2$) וגם $x^2<y^2$ שקר ($9<4$). שני הצדדים שקריים, וזה מתאים ל"אם ורק
          אם".
        misconception: MC-counterexample-wrong-shape

  - id: Q-0.7-two-terms
    type: numeric
    objectives: [OBJ-0.7-1]
    level: exam
    prompt: >-
      קבוצת הפתרונות של $|x-1|+|x+2|<5$ היא קטע פתוח $(a,b)$. מהו האורך $b-a$ של הקטע?
    answer: 5
    tolerance: 0.001
    correctFeedback: >-
      נכון. מפצלים לפי $-2$ ו-$1$. עבור $x\ge 1$: $2x+1<5$, כלומר $x<2$. עבור $-2\le x<1$: הסכום הוא $3<5$, תמיד.
      עבור $x<-2$: $-2x-1<5$, כלומר $x>-3$. ביחד $(-3,2)$, באורך $5$.
    wrongFeedback: >-
      הנקודות $x=1$ ו-$x=-2$ מחלקות את הישר לשלושה קטעים; בכל אחד מהם כתבו את הסכום בלי ערך מוחלט ופתרו.
    commonWrong:
      - value: 4
        feedback: >-
          זה האורך של $[-2,2)$: שכחתם את המקרה $x<-2$. שם $|x-1|+|x+2|=-2x-1$, וגם $-3<x<-2$ פותרים.
        misconception: MC-abs-one-side
      - value: 2
        feedback: >-
          זה סכום האורכים של $(-3,-2)$ ושל $(1,2)$: שכחתם את הקטע האמצעי $-2\le x<1$, שבו הסכום קבוע ושווה ל-$3$,
          ולכן כולו פתרון.
        misconception: MC-abs-one-side
    explanation: >-
      בקטע האמצעי הסכום קבוע: $|x-1|+|x+2|$ הוא סכום המרחקים מ-$1$ ומ-$-2$, וכל נקודה ביניהן נמצאת במרחק כולל
      $3$ משתיהן.

  - id: Q-0.7-which-hold
    type: multi
    objectives: [OBJ-0.7-2]
    qualitative: true
    level: mid
    prompt: >-
      אילו מהטענות הבאות נכונות לכל $a,b$ ממשיים? סמנו את כולן.
    choices:
      - text: '$|a+b|\le|a|+|b|$'
        correct: true
        feedback: נכון. זה אי-שוויון המשולש.
      - text: '$|a+b|=|a|+|b|$'
        feedback: >-
          $a=1$, $b=-1$: $|1+(-1)|=0$ ואילו $|1|+|{-1}|=2$. שוויון יש רק כש-$a$ ו-$b$ באותו סימן (או שאחד מהם $0$).
        misconception: MC-order-abs-additive
      - text: '$|a-b|\ge|a|-|b|$'
        correct: true
        feedback: >-
          נכון. זו הצורה ההפוכה: $|a|=|(a-b)+b|\le|a-b|+|b|$.
      - text: '$|a-b|\le|a|-|b|$'
        feedback: >-
          $a=0$, $b=1$: אגף שמאל $1$ ואגף ימין $-1$. הצורה ההפוכה חוסמת את $|a-b|$ **מלמטה**, לא מלמעלה.
        misconception: MC-reverse-triangle-direction
      - text: '$|ab|=|a|\cdot|b|$'
        correct: true
        feedback: >-
          נכון. הערך המוחלט כפלי: בודקים את ארבעת צירופי הסימנים של $a$ ו-$b$, ובכולם שני האגפים שווים.

  - id: Q-0.7-triangle-proof
    type: rank
    objectives: [OBJ-0.7-2]
    level: exam
    prompt: >-
      הוכיחו את אי-שוויון המשולש: לכל $a,b$ ממשיים, $|a+b|\le|a|+|b|$.
    help: 'סדרו את שלבי ההוכחה לפי הסדר הנכון.'
    items:
      - id: basic
        label: 'לכל $t$ ממשי $-|t|\le t\le|t|$ (בודקים את המקרים $t\ge 0$ ו-$t<0$).'
      - id: apply
        label: 'לכן $-|a|\le a\le|a|$ ו-$-|b|\le b\le|b|$.'
      - id: add
        label: 'נחבר את שני אי-השוויונות: $-(|a|+|b|)\le a+b\le|a|+|b|$.'
      - id: conclude
        label: 'כיוון שלכל $c\ge 0$ מתקיים $|y|\le c$ אם ורק אם $-c\le y\le c$, מקבלים $|a+b|\le|a|+|b|$.'
    order: [basic, apply, add, conclude]
    correctFeedback: >-
      נכון. שימו לב לשלב האחרון: הוא מתרגם בחזרה מ"$y$ בין $-c$ ל-$c$" ל"$|y|\le c$", אותו כלל שבו פותרים
      $|t|\le r$.
    wrongFeedback: >-
      קודם עובדה כללית על כל מספר, אחר כך מפעילים אותה על $a$ ועל $b$, מחברים, ובסוף חוזרים לערך מוחלט.

  - id: Q-0.7-reverse-step
    type: mc
    objectives: [OBJ-0.7-2]
    level: mid
    prompt: >-
      רוצים להוכיח את הצורה ההפוכה של אי-שוויון המשולש. הצעד הראשון הוא $|a|-|b|\le|a-b|$. איזה טיעון מוכיח אותו?
    choices:
      - text: 'כותבים $a=(a-b)+b$ ומפעילים את אי-שוויון המשולש: $|a|\le|a-b|+|b|$'
        correct: true
        feedback: >-
          נכון. מעבירים אגף ומקבלים $|a|-|b|\le|a-b|$. אותו טיעון עם $a$ ו-$b$ מוחלפים נותן $|b|-|a|\le|a-b|$, ושני
          אלה יחד הם $\big||a|-|b|\big|\le|a-b|$.
      - text: '$|a-b|=|a|-|b|$, ולכן בפרט $|a|-|b|\le|a-b|$'
        feedback: >-
          השוויון הזה שקר בדרך כלל: $a=1$, $b=-1$ נותן $|a-b|=2$ ו-$|a|-|b|=0$. ערך מוחלט אינו "נפתח" על הפרש.
        misconception: MC-order-abs-additive
      - text: 'מאי-שוויון המשולש $|a-b|\le|a|-|b|$, ומעבירים אגפים'
        feedback: >-
          אי-שוויון המשולש לא אומר את זה; עבור $a=0$, $b=1$ זה $1\le -1$. אי-שוויון המשולש הוא חסם **מלמעלה** על
          סכום: $|x+y|\le|x|+|y|$.
        misconception: MC-reverse-triangle-direction

  - id: Q-0.7-sum-bound
    type: numeric
    objectives: [OBJ-0.7-2]
    level: basic
    prompt: >-
      ידוע ש-$|x-2|<0.1$ ו-$|y+1|<0.2$. מהו החסם מלמעלה על $|x+y-1|$ שמתקבל מאי-שוויון המשולש?
    answer: 0.3
    tolerance: 0.001
    correctFeedback: >-
      נכון. $x+y-1=(x-2)+(y+1)$, ולכן $|x+y-1|\le|x-2|+|y+1|<0.1+0.2=0.3$.
    wrongFeedback: >-
      כתבו את $x+y-1$ כסכום של שני הביטויים שאתם יודעים לחסום, $x-2$ ו-$y+1$, והפעילו את אי-שוויון המשולש.
    commonWrong:
      - value: 0.1
        feedback: >-
          $0.2-0.1$ הוא הפרש החסמים, אבל חסמים מחברים: אי-שוויון המשולש נותן $|u+v|\le|u|+|v|$, ושתי השגיאות
          יכולות להצטבר.
        misconception: MC-reverse-triangle-direction
      - value: 0.02
        feedback: >-
          $0.1\cdot 0.2$ הוא מכפלת החסמים. הביטוי $x+y-1$ הוא **סכום** של $x-2$ ו-$y+1$, ולכן החסמים מתחברים.

  - id: Q-0.7-amgm-sign
    type: twotier
    objectives: [OBJ-0.7-3]
    qualitative: true
    level: mid
    prompt: >-
      האם $\frac{a+b}{2}\ge\sqrt{ab}$ לכל $a,b$ ממשיים שעבורם $ab\ge 0$?
    choices:
      - text: לא
        correct: true
        feedback: נכון. אי-שוויון הממוצעים דורש $a,b\ge 0$, ולא רק $ab\ge 0$.
      - text: כן
        feedback: >-
          $a=b=-1$: $ab=1\ge 0$, אבל $\frac{a+b}{2}=-1$ ו-$\sqrt{ab}=1$.
        misconception: MC-amgm-negative
    reasons:
      - text: 'עבור $a=b=-1$ אגף שמאל $-1$ ואגף ימין $1$'
        correct: true
        feedback: >-
          בדיוק. כש-$a$ ו-$b$ שליליים, הממוצע החשבוני שלילי והשורש אי-שלילי.
      - text: 'ההוכחה $(\sqrt a-\sqrt b)^2\ge 0$ עובדת לכל $a,b$ עם $ab\ge 0$'
        feedback: >-
          ההוכחה משתמשת ב-$\sqrt a$ וב-$\sqrt b$ בנפרד, ואלה מוגדרים רק כש-$a,b\ge 0$. כש-$a,b<0$ אין בה משמעות.
        misconception: MC-amgm-negative
      - text: '$(a-b)^2\ge 0$ לכל $a,b$, ומזה נובע אי-השוויון'
        feedback: >-
          $(a-b)^2\ge 0$ נותן $\frac{a^2+b^2}{2}\ge ab$, שזה אי-שוויון אחר (הממוצעים של $a^2$ ו-$b^2$), והוא נכון לכל
          $a,b$. אי-שוויון הממוצעים של $a$ ו-$b$ עצמם דורש $a,b\ge 0$.
        misconception: MC-amgm-negative

  - id: Q-0.7-amgm-min
    type: numeric
    objectives: [OBJ-0.7-3]
    level: mid
    prompt: >-
      מהו הערך הקטן ביותר של $x+\frac{9}{x}$ עבור $x>0$?
    answer: 6
    tolerance: 0.001
    correctFeedback: >-
      נכון. לפי אי-שוויון הממוצעים, $x+\frac9x\ge 2\sqrt{x\cdot\frac9x}=2\cdot 3=6$, ובשוויון כש-$x=\frac9x$,
      כלומר $x=3$. החסם $6$ מתקבל, ולכן הוא הערך הקטן ביותר.
    wrongFeedback: >-
      הפעילו את אי-שוויון הממוצעים על $a=x$ ו-$b=\frac9x$, שמכפלתם קבועה, ובדקו שיש $x$ שבו מתקבל שוויון.
    commonWrong:
      - value: 3
        feedback: >-
          $3$ הוא ה-$x$ שבו מתקבל המינימום, לא הערך עצמו: $3+\frac93=6$.
      - value: 10
        feedback: >-
          $10$ הוא הערך ב-$x=1$. ערך בנקודה אחת לא נותן את המינימום; צריך חסם מלמטה שמתקיים לכל $x>0$.
        misconception: MC-examples-are-proof

  - id: Q-0.7-fraction-bound
    type: mc
    objectives: [OBJ-0.7-3]
    qualitative: true
    level: exam
    prompt: >-
      איזו מההערכות הבאות נכונה **לכל** $n$ טבעי?
    choices:
      - text: '$\frac{n+1}{n^2+5}\le\frac{2n}{n^2}=\frac2n$'
        correct: true
        feedback: >-
          נכון. הגדלנו את המונה ($n+1\le 2n$ לכל $n\ge 1$) והקטנו את המכנה ($n^2+5\ge n^2$); שתי הפעולות מגדילות
          שבר חיובי, ולכן מקבלים חסם מלמעלה. הערכה כזו היא בדיוק מה שצריך בהוכחות גבול בפרק 2.
      - text: '$\frac{n+1}{n^2+5}\le\frac{n}{n^2}=\frac1n$'
        feedback: >-
          החלפת $n+1$ ב-$n$ **מקטינה** את המונה, וזה לא נותן חסם מלמעלה. ואכן עבור $n=6$: $\frac{7}{41}\approx
          0.171$, גדול מ-$\frac16\approx 0.167$.
        misconception: MC-bound-fraction-direction
      - text: '$\frac{n+1}{n^2+5}\le\frac{n+1}{n^2+5n}$'
        feedback: >-
          $n^2+5n\ge n^2+5$, כלומר הגדלתם את המכנה, והשבר קטן. כבר עבור $n=2$: $\frac39>\frac{3}{14}$.
        misconception: MC-bound-fraction-direction
      - text: '$\frac{n+1}{n^2+5}\ge\frac1n$'
        feedback: >-
          זה חסם מלמטה שנכשל כבר ב-$n=1$: $\frac26=\frac13<1$. הוא מתקיים רק החל מ-$n=5$, ולא לכל $n$.
        misconception: MC-bound-fraction-direction

  - id: Q-0.7-equality-case
    type: mc
    objectives: [OBJ-0.7-2]
    qualitative: true
    level: mid
    prompt: >-
      לאילו זוגות $x,y$ ממשיים מתקיים **שוויון** באי-שוויון המשולש, $|x+y|=|x|+|y|$?
    choices:
      - text: 'בדיוק כש-$xy\ge 0$'
        correct: true
        feedback: >-
          נכון. שני האגפים אי-שליליים, ולכן הם שווים בדיוק כשהריבועים שווים: $x^2+2xy+y^2=x^2+2|xy|+y^2$, כלומר
          $xy=|xy|$, כלומר $xy\ge 0$.
      - text: 'רק כש-$x=y$'
        feedback: >-
          $x=2$, $y=5$: $|2+5|=7=|2|+|5|$, אף ש-$x\ne y$. מה שקובע הוא הסימנים, לא הערכים.
        misconception: MC-triangle-equality-case
      - text: 'רק כש-$x=0$ או $y=0$'
        feedback: >-
          $x=-1$, $y=-3$: $|{-4}|=4=|{-1}|+|{-3}|$, ושניהם שונים מאפס. שוויון יש בכל פעם שהמספרים לא בסימנים
          מנוגדים.
        misconception: MC-triangle-equality-case
      - text: 'לכל $x,y$'
        feedback: >-
