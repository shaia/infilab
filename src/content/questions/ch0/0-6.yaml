# Lesson 0.6 — strong induction, well-ordering, Bernoulli's inequality, the binomial theorem.
# Objectives (src/course.ts):
#   OBJ-0.6-1  prove by strong induction; use the well-ordering principle and its equivalence to induction
#   OBJ-0.6-2  prove and use Bernoulli's inequality; show by a counterexample that the hypothesis on x is needed
#   OBJ-0.6-3  prove Pascal's identity and the binomial theorem, and use them
# Q-0.6-strong-why, -well-ordering-z, -bernoulli-why, -bernoulli-proof, -bernoulli-condition came from lesson 0.5's bank.
chapter: 0
questions:
  - id: Q-0.6-bernoulli-why
    type: mc
    objectives: [OBJ-0.6-2]
    qualitative: true
    level: mid
    prompt: >-
      בצעד של הוכחת אי-שוויון ברנולי, $(1+x)^n\ge 1+nx$ עבור $x\ge -1$, כותבים:
      $$(1+x)^{n+1}=(1+x)^n(1+x)\ge(1+nx)(1+x).$$
      מה מצדיק את אי-השוויון?
    choices:
      - text: 'הנחת האינדוקציה, יחד עם העובדה ש-$1+x\ge 0$'
        correct: true
        feedback: >-
          נכון. כפל של אי-שוויון במספר אי-שלילי שומר עליו. בשביל זה ההנחה $x\ge -1$: עם $1+x<0$ הכפל היה הופך
          את הכיוון.
      - text: הנחת האינדוקציה בלבד
        feedback: >-
          הנחת האינדוקציה נותנת $(1+x)^n\ge 1+nx$, אבל כדי לכפול את שני האגפים ב-$1+x$ בלי להפוך את הכיוון צריך
          $1+x\ge 0$. בלי זה הצעד נופל.
        misconception: MC-bernoulli-any-x
      - text: אי-שוויון ברנולי עבור $n+1$
        feedback: >-
          את אי-השוויון עבור $n+1$ אנחנו מוכיחים עכשיו, ולכן אסור להשתמש בו.
        misconception: MC-induction-hypothesis-circular

  - id: Q-0.6-bernoulli-proof
    type: rank
    objectives: [OBJ-0.6-2]
    level: exam
    prompt: >-
      הוכיחו באינדוקציה את אי-שוויון ברנולי: לכל $x\ge -1$ ולכל $n$ טבעי, $(1+x)^n\ge 1+nx$.
    help: 'סדרו את שלבי ההוכחה לפי הסדר הנכון.'
    items:
      - id: base
        label: 'בסיס: עבור $n=1$ שני האגפים שווים ל-$1+x$.'
      - id: hyp
        label: 'נניח ש-$(1+x)^n\ge 1+nx$ עבור $n$ טבעי מסוים.'
      - id: multiply
        label: 'כיוון ש-$1+x\ge 0$, מותר לכפול את ההנחה ב-$1+x$: $(1+x)^{n+1}\ge(1+nx)(1+x)$.'
      - id: expand
        label: 'נפתח סוגריים: $(1+nx)(1+x)=1+(n+1)x+nx^2$.'
      - id: drop
        label: '$nx^2\ge 0$, ולכן $(1+x)^{n+1}\ge 1+(n+1)x$, וזו הטענה עבור $n+1$.'
    order: [base, hyp, multiply, expand, drop]
    correctFeedback: >-
      נכון. שני מקומות דורשים הצדקה: הכפל ב-$1+x$ (כאן נכנס $x\ge -1$), והשמטת $nx^2$ (שהוא אי-שלילי).
    wrongFeedback: >-
      כדי להשמיט את $nx^2$ צריך קודם לקבל אותו, בפתיחת הסוגריים; וכדי לפתוח סוגריים צריך קודם את המכפלה
      $(1+nx)(1+x)$, שבאה מהכפל בהנחה.

  - id: Q-0.6-bernoulli-condition
    type: twotier
    objectives: [OBJ-0.6-2]
    qualitative: true
    level: mid
    prompt: >-
      האם $(1+x)^n\ge 1+nx$ לכל $x$ ממשי ולכל $n$ טבעי?
    choices:
      - text: לא
        correct: true
        feedback: נכון. בלי התנאי $x\ge -1$ אי-השוויון יכול להיכשל.
      - text: כן
        feedback: >-
          נסו $x=-4$ ו-$n=3$: $(-3)^3=-27$, בעוד $1+3\cdot(-4)=-11$, ו-$-27<-11$.
        misconception: MC-bernoulli-any-x
    reasons:
      - text: 'עבור $x=-4$ ו-$n=3$ אגף שמאל הוא $-27$ ואגף ימין $-11$'
        correct: true
        feedback: >-
          בדיוק. דוגמה נגדית אחת מספיקה. ההוכחה נופלת בדיוק בצעד: כש-$1+x<0$, כפל בו הופך את כיוון אי-השוויון.
      - text: ההוכחה באינדוקציה עובדת לכל $x$
        feedback: >-
          בצעד כופלים את הנחת האינדוקציה ב-$1+x$. אם $1+x<0$ הכפל הופך את הכיוון, וההוכחה לא עוברת.
        misconception: MC-bernoulli-any-x
      - text: בבסיס $n=1$ יש שוויון לכל $x$, ולכן אי-השוויון נכון לכל $x$
        feedback: >-
          הבסיס אכן נכון לכל $x$, אבל אינדוקציה צריכה גם צעד, והצעד דורש $x\ge -1$.
        misconception: MC-bernoulli-any-x

  - id: Q-0.6-strong-why
    type: mc
    objectives: [OBJ-0.6-1]
    qualitative: true
    level: mid
    prompt: >-
      מוכיחים שכל מספר טבעי $n\ge2$ הוא מכפלה של ראשוניים. אם $n$ אינו ראשוני, כותבים $n=de$ עם שלמים
      $2\le d<n$ ו-$2\le e<n$. למה כאן צריך אינדוקציה שלמה, ולא מספיקה הנחת האינדוקציה הרגילה, הטענה עבור $n-1$?
    choices:
      - text: 'כי $d$ ו-$e$ יכולים להיות כל מספרים בין $2$ ל-$n-1$, ולכן צריך את הטענה לכל המספרים הקטנים מ-$n$'
        correct: true
        feedback: >-
          נכון. למשל $12=2\cdot6$: הצעד משתמש בטענה עבור 2 ועבור 6, ולא עבור 11. הטענה עבור $n-1$ לא אומרת דבר על
          $d$ ועל $e$. אינדוקציה שלמה נותנת את הטענה לכל $k$ עם $2\le k<n$, ובפרט ל-$d$ ול-$e$.
      - text: 'כי באינדוקציה שלמה לא צריך לבדוק אף מקרה בנפרד, וכך חוסכים את הבסיס'
        feedback: >-
          לא זו הסיבה, וגם זה לא נכון: עבור $n=2$ אין מספרים קודמים, ולכן את המקרה הזה מוכיחים בלי עזרה (2 ראשוני,
          מכפלה של ראשוני אחד). אינדוקציה שלמה נחוצה כאן בגלל **אילו** מקרים קודמים הצעד צריך.
        misconception: MC-strong-induction-no-cases
      - text: 'אין צורך: מהטענה עבור $n-1$ אפשר להסיק אותה עבור $d$ ועבור $e$, כי הם קטנים מ-$n$'
        feedback: >-
          "קטנים מ-$n$" אינו הצדקה. הטענה עבור $n-1$ היא על המספר $n-1$ בלבד, ושום חוליה לא מעבירה אותה אל $d$ או
          אל $e$. כל מעבר בצעד צריך הנחה או טענה שהוכחה, וכאן חסרה בדיוק ההנחה על $d$ ועל $e$.
        misconception: MC-step-justification-vague

  - id: Q-0.6-well-ordering-z
    type: twotier
    objectives: [OBJ-0.6-1]
    qualitative: true
    level: mid
    prompt: >-
      האם לכל קבוצה לא ריקה של מספרים **שלמים** יש איבר קטן ביותר?
    choices:
      - text: לא
        correct: true
        feedback: נכון. עקרון הסדר הטוב הוא על קבוצות של טבעיים, ולשלמים הוא לא נכון.
      - text: כן
        feedback: >-
          ל-$\mathbb{Z}$ עצמה אין איבר קטן ביותר: לכל שלם $m$ גם $m-1$ שלם, ו-$m-1<m$.
        misconception: MC-well-ordering-any-set
    reasons:
      - text: 'לקבוצה $\mathbb{Z}$ אין איבר קטן ביותר: לכל שלם $m$, גם $m-1$ שלם וקטן ממנו'
        correct: true
        feedback: >-
          בדיוק. דוגמה נגדית אחת מספיקה. גם הקבוצה $\{-1,-2,-3,\dots\}$ היא דוגמה נגדית.
      - text: 'כן, כי זה עקרון הסדר הטוב'
        feedback: >-
          עקרון הסדר הטוב מניח שהקבוצה מוכלת ב-$\mathbb{N}$. ההוכחה שלו משתמשת באינדוקציה, שמתחילה ב-1; בשלמים
          אין מקום להתחיל ממנו.
        misconception: MC-well-ordering-any-set
      - text: 'לא, כי גם לקבוצה אינסופית של טבעיים, כמו המספרים הזוגיים, אין איבר קטן ביותר'
        feedback: >-
          המסקנה "לא" נכונה, אבל הנימוק שגוי: לכל קבוצה לא ריקה של טבעיים, גם אינסופית, יש איבר קטן ביותר; לזוגיים
          הוא 2. הדוגמה הנגדית צריכה לצאת מ-$\mathbb{N}$.
        misconception: MC-well-ordering-any-set

  - id: Q-0.6-strong-bases
    type: numeric
    objectives: [OBJ-0.6-1]
    level: mid
    prompt: >-
      מוכיחים באינדוקציה שלמה שכל שלם $n\ge12$ אפשר לכתוב בצורה $n=3a+7b$ עם שלמים $a,b\ge0$. הנימוק בצעד:
      "לפי ההנחה $n-3=3a+7b$, ולכן $n=3(a+1)+7b$". בכמה ערכים של $n$ צריך לבדוק את הטענה ישירות, בלי הנימוק הזה?
    answer: 3
    tolerance: 0.001
    correctFeedback: >-
      נכון: $n=12,13,14$. הנימוק צריך את הטענה עבור $n-3$, וההנחה של אינדוקציה שלמה מבסיס 12 אומרת משהו רק על
      מספרים שהם לפחות 12, כלומר רק כש-$n\ge15$. ישירות: $12=3\cdot4$, $13=3\cdot2+7$, $14=7\cdot2$.
    wrongFeedback: >-
      בדקו לאילו $n$ המספר $n-3$ עדיין לפחות 12. את כל ה-$n$ שלפני כן, מ-12 והלאה, הנימוק לא מכסה.
    commonWrong:
      - value: 1
        feedback: >-
          בסיס אחד, $n=12$, לא מספיק: עבור $n=13$ הנימוק משתמש ב-10, ועבור $n=14$ ב-11, ועליהם ההנחה לא אומרת דבר.
          11 אף אינו מהצורה $3a+7b$.
        misconception: MC-strong-induction-no-cases
      - value: 0
        feedback: >-
          באינדוקציה שלמה ההנחה עבור $n=12$ ריקה (אין מספרים קודמים מ-12), ולכן את 12 מוכיחים בלי עזרה, וכך גם כל
          $n$ שהנימוק לא מכסה.
        misconception: MC-strong-induction-no-cases
      - value: 4
        feedback: >-
          עבור $n=15$ הנימוק כבר עובד: $15-3=12$, וההנחה אומרת שהטענה נכונה עבור 12. מספיק לבדוק את 12, 13 ו-14.

  - id: Q-0.6-wo-to-induction
    type: mc
    objectives: [OBJ-0.6-1]
    qualitative: true
    level: mid
    prompt: >-
      בהוכחה שעקרון הסדר הטוב גורר את עקרון האינדוקציה: $S\subseteq\mathbb{N}$, $1\in S$, ולכל $n\in S$ גם
      $n+1\in S$. מניחים בשלילה ש-$S\ne\mathbb{N}$, ולוקחים את $m$, המספר הטבעי הקטן ביותר שאינו ב-$S$. למה
      $m-1\in S$?
    choices:
      - text: '$m\ne1$ כי $1\in S$, ולכן $m-1$ טבעי; ו-$m-1<m$, ו-$m$ הקטן ביותר מחוץ ל-$S$, ולכן $m-1$ לא מחוץ ל-$S$'
        correct: true
        feedback: >-
          נכון. שני הנימוקים נחוצים: בלי $m\ne1$ המספר $m-1$ הוא 0, שאינו טבעי. ואז התנאי על $S$ נותן $m\in S$,
          סתירה.
      - text: 'לפי הנחת האינדוקציה, $S$ מכילה את כל המספרים הקטנים מ-$m$'
        feedback: >-
          אין כאן הנחת אינדוקציה: את עקרון האינדוקציה רוצים **להוכיח** מהסדר הטוב, ולהשתמש בו כאן זה מעגלי.
          הנימוק הוא המינימליות של $m$.
        misconception: MC-induction-hypothesis-circular
      - text: 'כי לכל קבוצה של מספרים שלמים יש איבר קטן ביותר, ו-$m-1$ שלם'
        feedback: >-
          עקרון הסדר הטוב הוא על קבוצות לא ריקות של **טבעיים**; לשלמים הוא לא נכון. וכאן הוא כבר הופעל, כדי לבחור
          את $m$; מה שנשאר הוא להשתמש במינימליות של $m$.
        misconception: MC-well-ordering-any-set

  - id: Q-0.6-bernoulli-bound
    type: numeric
    objectives: [OBJ-0.6-2]
    level: basic
    prompt: >-
      איזה חסם מלמטה נותן אי-שוויון ברנולי על $(1.02)^{40}$? כתבו את המספר $1+nx$ המתאים.
    answer: 1.8
    tolerance: 0.001
    correctFeedback: >-
      נכון. $x=0.02\ge-1$ ו-$n=40$, ולכן $(1.02)^{40}\ge1+40\cdot0.02=1.8$. (הערך האמיתי בערך $2.208$.)
    wrongFeedback: >-
      כתבו $1.02=1+x$, כלומר $x=0.02$, ובדקו ש-$x\ge-1$. החסם הוא $1+nx$ עם $n=40$.
    commonWrong:
      - value: 41.8
        feedback: >-
          הצבתם $x=1.02$. בברנולי הבסיס של החזקה הוא $1+x$, ולכן $x=0.02$.
      - value: 2.208
        feedback: >-
          זה הערך האמיתי של $(1.02)^{40}$ בקירוב, לא החסם. ברנולי נותן מספר קטן ממנו, $1.8$, בלי לחשב חזקה.
      - value: 0.8
        feedback: >-
          שכחתם את ה-1: החסם הוא $1+nx$, לא $nx$.

  - id: Q-0.6-pascal-value
    type: numeric
    objectives: [OBJ-0.6-3]
    level: basic
    prompt: >-
      חשבו בעזרת זהות פסקל, בלי עצרות: $\binom62+\binom63$.
    answer: 35
    tolerance: 0.001
    correctFeedback: >-
      נכון. לפי זהות פסקל עם $n=6$ ו-$k=3$: $\binom62+\binom63=\binom73=35$. ובדיקה: $15+20=35$.
    wrongFeedback: >-
      זהות פסקל: $\binom{n}{k-1}+\binom nk=\binom{n+1}{k}$. כאן $n=6$, ו-$k-1=2$, כלומר $k=3$.
    commonWrong:
      - value: 21
        feedback: >-
          זה $\binom72$. בזהות פסקל המקדם התחתון של התוצאה הוא הגדול מבין השניים, $k=3$: $\binom73=35$.
      - value: 56
        feedback: >-
          זה $\binom83$. השורה עולה באחד בלבד: מ-6 ל-7.

  - id: Q-0.6-binomial-coef
    type: numeric
    objectives: [OBJ-0.6-3]
    level: mid
    prompt: >-
      מהו המקדם של $x^3$ בפיתוח של $(2+x)^5$?
    answer: 40
    tolerance: 0.001
    correctFeedback: >-
      נכון. לפי הבינום עם $a=2$, $b=x$ ו-$n=5$, המחובר עם $x^3$ הוא $\binom53\,2^{5-3}x^3=10\cdot4\,x^3=40x^3$.
    wrongFeedback: >-
      המחובר הכללי הוא $\binom5k\,2^{5-k}x^k$. המקדם של $x^3$ מתקבל עם $k=3$.
    commonWrong:
      - value: 80
        feedback: >-
          חישבתם $\binom53\cdot2^3$. החזקה של $a=2$ היא $n-k=2$, לא $k$: $\binom53\cdot2^2=40$.
        misconception: MC-binomial-exponent-swap
      - value: 10
        feedback: >-
          זה רק $\binom53$. גם החזקה $2^{5-3}=4$ של המחובר הראשון היא חלק מהמקדם.
        misconception: MC-binomial-exponent-swap
      - value: 0
        feedback: >-
          $(2+x)^5$ אינו $2^5+x^5$: בפיתוח יש גם המחוברים האמצעיים, ואחד מהם הוא $40x^3$.
        misconception: MC-power-of-sum

  - id: Q-0.6-binomial-step
    type: mc
    objectives: [OBJ-0.6-3]
    level: mid
    prompt: >-
      בצעד של ההוכחה של הבינום של ניוטון, אחרי הכפל ב-$a+b$, מקבלים שני סכומים. המחובר עם $a^{n+1-k}b^k$
      (כש-$1\le k\le n$) מופיע בשניהם, עם המקדמים $\binom nk$ ו-$\binom n{k-1}$. מה הופך את הסכום שלהם למקדם
      של הנוסחה עבור $n+1$?
    choices:
      - text: 'זהות פסקל: $\binom{n}{k-1}+\binom nk=\binom{n+1}{k}$'
        correct: true
        feedback: >-
          נכון. מותר להפעיל אותה כי $n\ge1$ ו-$1\le k\le n$. את המחוברים עם $k=0$ ו-$k=n+1$, שמופיעים רק בסכום אחד,
          מטפלים בנפרד: $a^{n+1}$ ו-$b^{n+1}$.
      - text: '$(a+b)^{n+1}=a^{n+1}+b^{n+1}$, ולכן המחוברים האמצעיים מתבטלים'
        feedback: >-
          חזקה של סכום אינה סכום חזקות: כבר $(1+1)^2=4\ne2$. המחוברים האמצעיים לא מתבטלים; זהות פסקל מאחדת אותם.
        misconception: MC-power-of-sum
      - text: 'הסימטריה $\binom nk=\binom n{n-k}$'
        feedback: >-
          הסימטריה נכונה, אבל היא לא מחברת שני מקדמים לאחד. בכל מעבר בהוכחה צריך את העובדה שמצדיקה **אותו**, וכאן
          זו זהות פסקל.
        misconception: MC-step-justification-vague

  - id: Q-0.6-improved-bernoulli
    type: twotier
    objectives: [OBJ-0.6-2, OBJ-0.6-3]
    qualitative: true
    level: exam
    prompt: >-
      מהבינום של ניוטון, $(1+x)^n=1+nx+\frac{n(n-1)}{2}x^2+\dots$. האם
      $(1+x)^n\ge1+nx+\frac{n(n-1)}{2}x^2$ לכל $x\ge-1$ ולכל $n$ טבעי?
    choices:
      - text: לא
        correct: true
