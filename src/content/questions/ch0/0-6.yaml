# Lesson 0.6 — sets and functions.
# Objectives (src/course.ts):
#   OBJ-0.6-1  operate on sets (union, intersection, difference, complement); prove set equality by double inclusion
#   OBJ-0.6-2  define function, domain, codomain and image; check whether a function is injective and onto
#   OBJ-0.6-3  compose functions and find an inverse function, and know when it exists
chapter: 0
questions:
  - id: Q-0.6-operations
    type: multi
    objectives: [OBJ-0.6-1]
    level: basic
    prompt: >-
      יהיו $A=\{1,2,3,4\}$ ו-$B=\{3,4,5\}$. אילו מהשוויונות הבאים נכונים? סמנו את כולם.
    choices:
      - text: '$A\cap B=\{3,4\}$'
        correct: true
        feedback: נכון. החיתוך הוא האיברים שנמצאים בשתי הקבוצות.
      - text: '$A\setminus B=\{1,2\}$'
        correct: true
        feedback: נכון. מוציאים מ-$A$ את האיברים שנמצאים ב-$B$, כלומר את $3$ ואת $4$.
      - text: '$B\setminus A=\{1,2\}$'
        feedback: >-
          $B\setminus A$ הם האיברים של $B$ שאינם ב-$A$: רק $5$. ההפרש אינו סימטרי:
          $B\setminus A=\{5\}\ne A\setminus B$.
        misconception: MC-set-difference-rules
      - text: '$A\cup B=\{3,4\}$'
        feedback: >-
          זה החיתוך. האיחוד הוא האיברים שנמצאים ב-$A$ **או** ב-$B$: $A\cup B=\{1,2,3,4,5\}$.
        misconception: MC-or-as-and

  - id: Q-0.6-complement
    type: mc
    objectives: [OBJ-0.6-1]
    qualitative: true
    level: mid
    prompt: >-
      יהיו $A,B\subseteq\mathbb{R}$, ונסמן ב-$X^c$ את המשלים של $X$ ב-$\mathbb{R}$. לאיזו קבוצה שווה
      $(A\cap B)^c$?
    choices:
      - text: '$A^c\cup B^c$'
        correct: true
        feedback: >-
          נכון. $x\notin A\cap B$ פירושו "לא ($x\in A$ וגם $x\in B$)", כלומר $x\notin A$ **או** $x\notin B$. זה
          כלל דה-מורגן, אותו כלל כמו בשלילת "וגם".
      - text: '$A^c\cap B^c$'
        feedback: >-
          דוגמה נגדית: $A=(0,2)$, $B=(1,3)$. המספר $\frac12$ נמצא ב-$A$ ולא ב-$B$, ולכן $\frac12\in(A\cap B)^c$;
          אבל $\frac12\notin A^c$, ולכן גם לא בחיתוך המשלימים. המשלים הופך חיתוך לאיחוד.
        misconception: MC-complement-de-morgan
      - text: '$A\cup B$'
        feedback: >-
          איברים של $A\cap B$ נמצאים גם ב-$A\cup B$, ולכן $A\cup B$ לא יכולה להיות המשלים של $A\cap B$ (אלא אם
          החיתוך ריק).
        misconception: MC-complement-de-morgan

  - id: Q-0.6-distributive
    type: rank
    objectives: [OBJ-0.6-1]
    level: exam
    prompt: >-
      הוכיחו: לכל שלוש קבוצות $A$, $B$, $C$ מתקיים $A\cap(B\cup C)=(A\cap B)\cup(A\cap C)$.
    help: 'סדרו את שלבי ההוכחה לפי הסדר הנכון.'
    items:
      - id: plan
        label: 'נוכיח שתי הכלות: כל אגף מוכל באגף השני.'
      - id: take-left
        label: 'יהי $x\in A\cap(B\cup C)$. אז $x\in A$, וגם $x\in B$ או $x\in C$.'
      - id: cases-left
        label: 'אם $x\in B$ אז $x\in A\cap B$, ואם $x\in C$ אז $x\in A\cap C$; בכל מקרה $x\in(A\cap B)\cup(A\cap C)$.'
      - id: take-right
        label: 'להפך, יהי $x\in(A\cap B)\cup(A\cap C)$. בשני המקרים $x\in A$, וגם $x\in B$ או $x\in C$.'
      - id: conclude
        label: 'לכן $x\in A\cap(B\cup C)$. הוכחנו את שתי ההכלות, ולכן הקבוצות שוות.'
    order: [plan, take-left, cases-left, take-right, conclude]
    correctFeedback: >-
      נכון. זו התבנית של כל הוכחת שוויון קבוצות: "יהי $x$ באגף שמאל... לכן $x$ באגף ימין", ואחר כך להפך.
    wrongFeedback: >-
      כל הכלה מתחילה ב"יהי $x$" באחד האגפים ומסתיימת בכך ש-$x$ באגף השני. סיימו הכלה אחת לפני שמתחילים את
      השנייה.

  - id: Q-0.6-one-inclusion
    type: twotier
    objectives: [OBJ-0.6-1]
    qualitative: true
    level: mid
    prompt: >-
      כדי להוכיח ש-$A=B$, סטודנטית הראתה שכל איבר של $A$ נמצא ב-$B$. האם זה מספיק?
    choices:
      - text: לא
        correct: true
        feedback: נכון. היא הוכיחה הכלה אחת מתוך שתיים.
      - text: כן
        feedback: >-
          דוגמה נגדית: $A=\{1\}$ ו-$B=\{1,2\}$. כל איבר של $A$ נמצא ב-$B$, והקבוצות שונות.
        misconception: MC-set-equality-one-inclusion
    reasons:
      - text: 'זה מראה רק $A\subseteq B$; למשל $\{1\}\subseteq\{1,2\}$, והקבוצות שונות'
        correct: true
        feedback: >-
          בדיוק. חסר $B\subseteq A$: צריך גם להראות שכל איבר של $B$ נמצא ב-$A$.
      - text: אם כל האיברים של $A$ נמצאים ב-$B$, הקבוצות זהות
        feedback: >-
          ל-$B$ עשויים להיות איברים נוספים. "כל איבר של $A$ ב-$B$" פירושו רק ש-$A$ מוכלת ב-$B$.
        misconception: MC-set-equality-one-inclusion
      - text: חסר רק לבדוק שאיבר אחד של $B$ נמצא ב-$A$
        feedback: >-
          איבר אחד לא מספיק: צריך שכל איבר של $B$ יהיה ב-$A$. ב-$A=\{1\}$, $B=\{1,2\}$, האיבר $1$ של $B$ נמצא
          ב-$A$, והקבוצות עדיין שונות.
        misconception: MC-examples-are-proof

  - id: Q-0.6-domain-image
    type: mc
    objectives: [OBJ-0.6-2]
    qualitative: true
    level: basic
    prompt: >-
      תהי $f:\mathbb{R}\to\mathbb{R}$, $f(x)=x^2$. מהם התחום, הטווח והתמונה של $f$?
    choices:
      - text: 'תחום $\mathbb{R}$, טווח $\mathbb{R}$, תמונה $[0,\infty)$'
        correct: true
        feedback: >-
          נכון. התחום והטווח כתובים בהגדרה $f:\mathbb{R}\to\mathbb{R}$. התמונה היא מה שמתקבל בפועל: כל מספר
          אי-שלילי $y$ מתקבל ($y=(\sqrt y)^2$), ושליליים לא.
      - text: 'תחום $\mathbb{R}$, טווח $[0,\infty)$, תמונה $[0,\infty)$'
        feedback: >-
          הטווח הוא חלק מההגדרה של הפונקציה, כאן $\mathbb{R}$ (מה שכתוב אחרי החץ). מה שהפונקציה מקבלת בפועל,
          $[0,\infty)$, נקרא התמונה.
        misconception: MC-domain-codomain-image
      - text: 'תחום $[0,\infty)$, טווח $\mathbb{R}$, תמונה $\mathbb{R}$'
        feedback: >-
          התחום הוא הקבוצה שלפני החץ, $\mathbb{R}$: מותר להציב גם מספרים שליליים. והתמונה אינה $\mathbb{R}$, כי
          $x^2$ אף פעם אינו שלילי.
        misconception: MC-domain-codomain-image

  - id: Q-0.6-injective-definition
    type: mc
    objectives: [OBJ-0.6-2]
    qualitative: true
    level: basic
    prompt: >-
      מהי ההגדרה של "$f:A\to B$ חד-חד-ערכית"?
    choices:
      - text: 'לכל $x_1,x_2\in A$: אם $f(x_1)=f(x_2)$ אז $x_1=x_2$'
        correct: true
        feedback: >-
          נכון. בשקילות (קונטרפוזיטיב): נקודות שונות הולכות לערכים שונים.
      - text: 'לכל $x_1,x_2\in A$: אם $x_1=x_2$ אז $f(x_1)=f(x_2)$'
        feedback: >-
          זה נכון לכל פונקציה, כי פונקציה נותנת ערך אחד לכל נקודה; למשל גם $x^2$ מקיימת את זה. חד-חד-ערכית היא
          הגרירה ההפוכה.
        misconception: MC-injective-reversed
      - text: 'לכל $y\in B$ קיים $x\in A$ כך ש-$f(x)=y$'
        feedback: >-
          זו ההגדרה של "על": כל איבר של הטווח מתקבל. זו תכונה אחרת.
        misconception: MC-injective-onto-confused

  - id: Q-0.6-which-injective
    type: multi
    objectives: [OBJ-0.6-2]
    level: mid
    prompt: >-
      אילו מהפונקציות הבאות חד-חד-ערכיות? סמנו את כולן.
    choices:
      - text: '$f:[0,\infty)\to\mathbb{R}$, $f(x)=x^2$'
        correct: true
        feedback: >-
          נכון. אם $x_1^2=x_2^2$ עם $x_1,x_2\ge 0$, אז $(x_1-x_2)(x_1+x_2)=0$. אם $x_1+x_2=0$, שני המספרים
          האי-שליליים הם אפס; אחרת $x_1-x_2=0$. בשני המקרים $x_1=x_2$.
      - text: '$f:\mathbb{R}\to[0,\infty)$, $f(x)=x^2$'
        feedback: >-
          $f(-1)=f(1)$, ולכן היא לא חד-חד-ערכית. היא **על** (כל $y\ge 0$ מתקבל), אבל זו תכונה אחרת.
        misconception: MC-injective-onto-confused
      - text: '$f:\mathbb{R}\to\mathbb{R}$, $f(x)=2x+1$'
        correct: true
        feedback: >-
          נכון. $2x_1+1=2x_2+1$ גורר $x_1=x_2$.
      - text: '$f:\mathbb{R}\to\mathbb{R}$, $f(x)=x^2$'
        feedback: >-
          אותה נוסחה כמו בבחירה הראשונה, אבל תחום אחר: כאן $f(-1)=f(1)=1$. חד-חד-ערכיות תלויה בתחום, לא רק
          בנוסחה.
        misconception: MC-formula-is-function

  - id: Q-0.6-bounded-onto
    type: twotier
    objectives: [OBJ-0.6-2]
    qualitative: true
    level: exam
    prompt: >-
      תהי $f:\mathbb{R}\to\mathbb{R}$, $f(x)=\frac{x}{1+|x|}$. מה נכון לגבי $f$?
    choices:
      - text: חד-חד-ערכית ולא על
        correct: true
        feedback: >-
          נכון. $f$ שולחת נקודות שונות לערכים שונים, אבל כל ערכיה בקטע $(-1,1)$, ולכן, למשל, $2$ אינו מתקבל.
      - text: חד-חד-ערכית ועל
        feedback: >-
          לכל $x$ מתקיים $|f(x)|=\frac{|x|}{1+|x|}<1$. לכן $2$, שנמצא בטווח $\mathbb{R}$, אינו מתקבל, ו-$f$ אינה
          על.
        misconception: MC-domain-codomain-image
      - text: על ולא חד-חד-ערכית
        feedback: >-
          זה הפוך. $f$ אינה על ($|f(x)|<1$), והיא כן חד-חד-ערכית: אם $f(x_1)=f(x_2)$, ל-$x_1$ ול-$x_2$ אותו סימן
          ואותו $|f|$, ולכן אותו $|x|$.
        misconception: MC-injective-onto-confused
    reasons:
      - text: >-
          $|f(x)|=1-\frac{1}{1+|x|}<1$, ולכן $2$ אינו בתמונה; ו-$f(x)$ באותו סימן כמו $x$, ו-$|f(x)|$ גדל
          ממש עם $|x|$, ולכן ערכים שווים באים מאותו $x$
        correct: true
        feedback: >-
          בדיוק. "על" נבדק מול הטווח: התמונה היא $(-1,1)$ והטווח $\mathbb{R}$. חד-חד-ערכיות נבדקת לפי ההגדרה:
          $f(x_1)=f(x_2)$ גורר אותו סימן ואותו ערך מוחלט, כלומר $x_1=x_2$.
      - text: 'לכל $y$ אפשר לפתור את המשוואה $y=\frac{x}{1+|x|}$ ולמצוא $x$'
        feedback: >-
          רק כש-$|y|<1$. עבור $y=2$: אם $x\ge 0$ מקבלים $x=2+2x$, כלומר $x=-2<0$, סתירה; ואם $x<0$ אז $f(x)<0<2$.
          אין פתרון.
        misconception: MC-domain-codomain-image
      - text: 'הטווח הוא $\mathbb{R}$, ולכן התמונה היא $\mathbb{R}$'
        feedback: >-
          הטווח הוא רק לאן $f$ מוגדרת לשלוח. התמונה היא מה שמתקבל בפועל, כאן $(-1,1)$, והיא יכולה להיות קטנה
          מהטווח.
        misconception: MC-domain-codomain-image

  - id: Q-0.6-compose
    type: numeric
    objectives: [OBJ-0.6-3]
    level: basic
    prompt: >-
      יהיו $f(x)=2x+1$ ו-$g(x)=x^2$, שתיהן מ-$\mathbb{R}$ אל $\mathbb{R}$. חשבו את $(f\circ g)(3)$.
    answer: 19
    tolerance: 0.001
    correctFeedback: >-
      נכון. $(f\circ g)(3)=f(g(3))=f(9)=2\cdot 9+1=19$: קודם הפונקציה הימנית, $g$.
    wrongFeedback: >-
      $(f\circ g)(x)=f(g(x))$: הציבו קודם ב-$g$, ואת התוצאה הציבו ב-$f$.
    commonWrong:
      - value: 49
        feedback: >-
          $49=g(f(3))=7^2$: הפעלתם קודם את $f$. ב-$f\circ g$ מפעילים קודם את $g$ (הימנית).
        misconception: MC-composition-order-swapped
      - value: 63
        feedback: >-
          $63=f(3)\cdot g(3)=7\cdot 9$ הוא מכפלה, לא הרכבה. הרכבה פירושה להציב את $g(3)$ בתוך $f$.

  - id: Q-0.6-inverse-exists
    type: twotier
    objectives: [OBJ-0.6-3]
    qualitative: true
    level: mid
    prompt: >-
      לאילו מהפונקציות יש פונקציה הפוכה: (I) $f:\mathbb{R}\to\mathbb{R}$, $f(x)=x^2$; (II)
      $f:[0,\infty)\to[0,\infty)$, $f(x)=x^2$?
    choices:
      - text: רק ל-(II)
        correct: true
        feedback: >-
          נכון. (II) חד-חד-ערכית ועל, וההפוכה שלה היא $f^{-1}(y)=\sqrt y$. (I) אינה חד-חד-ערכית ($f(-1)=f(1)$)
          וגם אינה על ($-1$ לא מתקבל).
      - text: לשתיהן, וההפוכה היא $\sqrt y$
        feedback: >-
          ב-(I) $\sqrt{f(x)}=\sqrt{x^2}=|x|$, ולכן $\sqrt y$ לא מחזירה את $x=-3$. ול-$y=-1$ אין שום מקור. אותה
          נוסחה, פונקציות שונות.
        misconception: MC-inverse-without-injective
      - text: לאף אחת, כי $x^2$ אינה חד-חד-ערכית
        feedback: >-
          ב-(II) התחום הוא $[0,\infty)$, ושם $x^2$ כן חד-חד-ערכית. התכונה תלויה בתחום, לא רק בנוסחה.
        misconception: MC-formula-is-function
    reasons:
      - text: 'יש הפוכה בדיוק כשהפונקציה חד-חד-ערכית ועל; (I) נכשלת בשני התנאים, ו-(II) מקיימת את שניהם'
        correct: true
        feedback: >-
          בדיוק. בלי חד-חד-ערכיות אין ל-$y$ מקור **יחיד**, ובלי על יש $y$ שאין לו מקור בכלל.
      - text: 'ההפוכה של $x^2$ היא $\frac{1}{x^2}$, והיא מוגדרת רק כש-$x\ne 0$'
        feedback: >-
          $\frac{1}{x^2}$ הוא אחד חלקי הפונקציה, לא הפונקציה ההפוכה. ההפוכה צריכה לבטל את $f$: $f^{-1}(f(x))=x$.
          למשל $f(2)=4$, ו-$\frac14\ne 2$.
        misconception: MC-inverse-is-reciprocal
      - text: לכל פונקציה שיש לה נוסחה שמבטלת אותה יש הפוכה, ו-$\sqrt y$ מבטלת את $x^2$
        feedback: >-
          $\sqrt{x^2}=|x|$, לא $x$, ולכן ב-(I) הנוסחה לא מבטלת את $f$. השאלה היא על הפונקציה (תחום, טווח וכלל),
          לא על הנוסחה.
        misconception: MC-formula-is-function

  - id: Q-0.6-inverse-value
    type: numeric
    objectives: [OBJ-0.6-3]
    level: mid
    prompt: >-
      הפונקציה $f:\mathbb{R}\setminus\{1\}\to\mathbb{R}\setminus\{2\}$, $f(x)=\frac{2x+1}{x-1}$, חד-חד-ערכית ועל.
      חשבו את $f^{-1}(5)$.
    answer: 2
    tolerance: 0.001
    correctFeedback: >-
      נכון. מחפשים $x$ עם $\frac{2x+1}{x-1}=5$: $2x+1=5x-5$, כלומר $x=2$. ובדיקה: $f(2)=\frac{5}{1}=5$. (באופן
      כללי $f^{-1}(y)=\frac{y+1}{y-2}$.)
    wrongFeedback: >-
      $f^{-1}(5)$ הוא ה-$x$ שעבורו $f(x)=5$. פתרו את המשוואה $\frac{2x+1}{x-1}=5$ ובדקו את התשובה בהצבה.
    commonWrong:
      - value: 2.75
        feedback: >-
          $2.75=\frac{11}{4}=f(5)$: הצבתם $5$ ב-$f$. צריך את ה-$x$ שעבורו $f(x)=5$.
      - value: 0.36363636
        feedback: >-
          $\frac{4}{11}=\frac{1}{f(5)}$ הוא אחד חלקי ערך הפונקציה, לא ערך הפונקציה ההפוכה.
        misconception: MC-inverse-is-reciprocal

  - id: Q-0.6-composition-injective
    type: twotier
    objectives: [OBJ-0.6-3, OBJ-0.6-2]
    qualitative: true
    level: exam
    prompt: >-
      יהיו $f:A\to B$ ו-$g:B\to C$, ונניח ש-$g\circ f$ חד-חד-ערכית. האם $f$ בהכרח חד-חד-ערכית?
    choices:
      - text: כן
        correct: true
        feedback: נכון. הפונקציה שמופעלת **ראשונה** חייבת להיות חד-חד-ערכית.
      - text: לא בהכרח; זו $g$ שחייבת להיות חד-חד-ערכית
        feedback: >-
          ב-$g\circ f$ מופעלת קודם $f$. אם $f$ הייתה שולחת שתי נקודות שונות לאותו ערך, $g$ הייתה מקבלת אותו ערך
          פעמיים והתוצאה הייתה שווה. ודווקא $g$ לא חייבת: $f(x)=x$ מ-$[0,\infty)$ אל $\mathbb{R}$, ו-$g(x)=x^2$ מ-$\mathbb{R}$ אל $\mathbb{R}$.
        misconception: MC-composition-order-swapped
    reasons:
      - text: 'אם $f(x_1)=f(x_2)$, אז $g(f(x_1))=g(f(x_2))$, ומחד-חד-ערכיות של $g\circ f$ נובע $x_1=x_2$'
        correct: true
        feedback: >-
          בדיוק. ההוכחה בודקת את ההגדרה של $f$ ישירות: מניחים $f(x_1)=f(x_2)$ ומסיקים $x_1=x_2$.
      - text: 'גם $f$ וגם $g$ חייבות להיות חד-חד-ערכיות, כי הרכבה של חד-חד-ערכיות היא חד-חד-ערכית'
        feedback: >-
          הטענה "אם $f$ ו-$g$ חד-חד-ערכיות אז $g\circ f$ חד-חד-ערכית" נכונה, אבל כאן משתמשים בהפוכה שלה, שאינה
          נובעת ממנה. $g(x)=x^2$ מ-$\mathbb{R}$ אל $\mathbb{R}$ אינה חד-חד-ערכית, ובכל זאת $g\circ f$ חד-חד-ערכית
          עבור $f(x)=x$ מ-$[0,\infty)$ אל $\mathbb{R}$.
        misconception: MC-converse-equivalent
      - text: 'אם $x_1=x_2$ אז $f(x_1)=f(x_2)$, ולכן $f$ חד-חד-ערכית'
        feedback: >-
          זה נכון לכל פונקציה ואינו ההגדרה של חד-חד-ערכית. צריך את הגרירה ההפוכה: $f(x_1)=f(x_2)\Rightarrow x_1=x_2$.
        misconception: MC-injective-reversed

  - id: Q-0.6-self-injective
    type: twotier
    objectives: [OBJ-0.6-2]
    qualitative: true
    level: mid
    prompt: >-
      תהי $f:\mathbb{N}\to\mathbb{N}$ חד-חד-ערכית. האם $f$ בהכרח על?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. בקבוצה אינסופית חד-חד-ערכיות לא מבטיחה "על": $f(n)=n+1$ חד-חד-ערכית, ול-$1$ אין מקור.
      - text: כן
        feedback: >-
          זה נכון לפונקציה מקבוצה סופית לעצמה, לא ב-$\mathbb{N}$. $f(n)=2n$ חד-חד-ערכית ($2n=2m$ גורר $n=m$), ול-$3$
          אין מקור, כי $2n$ זוגי.
        misconception: MC-self-injective-onto
    reasons:
      - text: '$f(n)=n+1$ חד-חד-ערכית, ו-$1$ אינו מתקבל כי $n+1\ge 2$'
        correct: true
        feedback: >-
          בדיוק. דוגמה נגדית אחת מפריכה את הטענה הכללית. זה המלון של שיעור 0.6: כל אורח עובר לחדר הבא, והחדר הראשון
          מתפנה.
      - text: 'כל איבר נשלח למקום משלו ואף איבר לא נעלם, ולכן כל המקומות בתמונה'
        feedback: >-
          הנימוק הזה סופר: בקבוצה סופית, $n$ ערכים שונים בקבוצה של $n$ איברים ממלאים אותה. ב-$\mathbb{N}$ אין ספירה
          כזו, ו-$n\mapsto 2n$ משאירה את כל האי-זוגיים בחוץ.
        misconception: MC-self-injective-onto
      - text: 'בדקנו את כל הפונקציות החד-חד-ערכיות מ-$\{1,2,3\}$ לעצמה, וכולן על'
        feedback: >-
          הבדיקה נכונה לקבוצה הסופית, אבל היא לא אומרת דבר על $\mathbb{N}$. דוגמאות על קבוצות אחרות אינן הוכחה, וכאן
          המסקנה אפילו שקרית.
        misconception: MC-examples-are-proof
