# Lesson 0.1 — how to study in this course, and how to read a proof.
# Objectives (src/course.ts):
#   OBJ-0.1-1  tell a definition, a claim, a theorem, a proof and an example apart in a mathematical text
#   OBJ-0.1-2  read a short proof line by line and say what justifies each step
#   OBJ-0.1-3  plan self-study: understanding questions after each lesson, review and exam questions per chapter
chapter: 0
questions:
  - id: Q-0.1-def-or-claim
    type: mc
    objectives: [OBJ-0.1-1]
    qualitative: true
    level: basic
    prompt: >-
      בספר כתוב: "מספר שלם $n$ נקרא **זוגי** אם קיים מספר שלם $k$ כך ש-$n=2k$." מה תפקידה של השורה הזו בטקסט?
    choices:
      - text: הגדרה
        correct: true
        feedback: >-
          נכון. המילה "נקרא" מסמנת הגדרה: השורה נותנת שם ("זוגי") לתכונה. אין בה מה להוכיח, ואחריה אפשר להוכיח
          טענות **על** מספרים זוגיים.
      - text: משפט שצריך להוכיח
        feedback: >-
          משפט אומר שמשהו נכון, ומוכיחים אותו. כאן לא נאמר שמשהו נכון אלא נקבע מה פירוש המילה "זוגי", ולכן אין
          מה להוכיח.
        misconception: MC-definition-is-claim
      - text: דוגמה
        feedback: >-
          דוגמה מראה עצם אחד מסוים, כמו "$6=2\cdot 3$ זוגי". כאן $n$ הוא מספר שלם כללי, והשורה קובעת מתי הוא
          נקרא זוגי.
        misconception: MC-text-roles-confused
      - text: הוכחה
        feedback: >-
          הוכחה מראה למה טענה נכונה, ולכן לפניה צריכה לבוא טענה. כאן אין טענה, רק שם חדש לתכונה.
        misconception: MC-text-roles-confused

  - id: Q-0.1-roles
    type: multi
    objectives: [OBJ-0.1-1]
    qualitative: true
    level: mid
    prompt: >-
      קראו את הקטע:

      (1) מספר שלם $n$ נקרא זוגי אם קיים שלם $k$ כך ש-$n=2k$.

      (2) טענה: לכל $n$ טבעי, המספר $n^2+n$ זוגי.

      (3) למשל, $3^2+3=12=2\cdot 6$.

      (4) הוכחה: $n^2+n=n(n+1)$, ואחד משני המספרים העוקבים $n$ ו-$n+1$ זוגי, ולכן גם המכפלה זוגית.

      אילו מהקביעות הבאות נכונות? סמנו את כולן.
    choices:
      - text: (1) היא הגדרה, ואין מה להוכיח בה
        correct: true
        feedback: 'נכון. "נקרא" מסמן הגדרה: היא קובעת את משמעות המילה "זוגי".'
      - text: (3) מוכיחה את הטענה (2), כי היא מראה שהטענה מתקיימת
        feedback: >-
          (3) בודקת מקרה אחד, $n=3$. הטענה (2) מדברת על **כל** $n$ טבעי, ובדיקה של מקרה אחד, או של מאה מקרים,
          לא מוכיחה אותה. בשביל זה יש את (4).
        misconception: MC-examples-are-proof
      - text: (3) עוזרת להבין את (2), אבל לא מוכיחה אותה
        correct: true
        feedback: >-
          נכון. דוגמה מראה מה הטענה אומרת ומאפשרת לבדוק שקראנו אותה נכון. ההוכחה היא (4).
      - text: 'המעבר "ולכן גם המכפלה זוגית" ב-(4) נשען על ההגדרה (1)'
        correct: true
        feedback: >-
          נכון. אם, למשל, $n=2k$, אז $n(n+1)=2\cdot k(n+1)$, ו-$k(n+1)$ שלם; לפי (1) המכפלה זוגית. (ואם $n+1$ הוא
          הזוגי, אותו חשבון עם $n+1$.)
      - text: (2) היא הגדרה נוספת של המילה "זוגי", בנוסף ל-(1)
        feedback: >-
          (2) אינה נותנת שם לשום דבר: היא אומרת שמספרים מסוימים זוגיים, וזה יכול להיות נכון או לא. לכן היא טענה,
          ולכן יש אחריה הוכחה.
        misconception: MC-text-roles-confused

  - id: Q-0.1-two-definitions
    type: twotier
    objectives: [OBJ-0.1-1]
    qualitative: true
    level: mid
    prompt: >-
      בספר אחד כתוב: "$n$ נקרא זוגי אם $n=2k$ עבור שלם $k$ כלשהו". בספר אחר: "$n$ נקרא זוגי אם השארית
      בחלוקה של $n$ ב-$2$ היא $0$". האם אפשר להוכיח שאחת ההגדרות נכונה והשנייה שגויה?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. הגדרות אינן נכונות או שגויות. מה שאפשר (וכדאי) להוכיח הוא ששתיהן **שקולות**: מספר מקיים את
          הראשונה אם ורק אם הוא מקיים את השנייה.
      - text: כן
        feedback: >-
          הגדרה קובעת משמעות של מילה, ולכן אין לה ערך אמת. אפשר רק לשאול אם שתי ההגדרות מתארות את אותם מספרים.
        misconception: MC-definition-is-claim
    reasons:
      - text: הגדרה קובעת מה פירוש מילה, ואין לה ערך אמת; מוכיחים רק טענות עליה
        correct: true
        feedback: >-
          בדיוק. ואכן הן שקולות: אם $n=2k$ השארית היא $0$, ואם השארית היא $0$ אז $n=2\cdot\frac n2$ עם
          $\frac n2$ שלם.
      - text: ההגדרה הנכונה היא זו שמופיעה בספר הלימוד של הקורס, והאחרת שגויה
        feedback: >-
          ספר הלימוד בוחר הגדרה אחת כדי שכולם ידברו על אותו דבר, אבל זה לא הופך את האחרת ל"שגויה". שתיהן
          לגיטימיות, ובמקרה הזה הן גם שקולות.
        misconception: MC-definition-is-claim
      - text: אפשר לבדוק את שתי ההגדרות על הרבה מספרים ולראות איזו מהן מתאימה
        feedback: >-
          בדיקה על הרבה מספרים לא מוכיחה דבר על כל המספרים, ובכל מקרה אין כאן "מתאימה" ו"לא מתאימה": זו שאלה
          של שקילות, ושקילות מוכיחים בטיעון כללי.
        misconception: MC-examples-are-proof

  - id: Q-0.1-justify-line
    type: mc
    objectives: [OBJ-0.1-2]
    level: basic
    prompt: >-
      מספר שלם $n$ נקרא **אי-זוגי** אם קיים שלם $k$ כך ש-$n=2k+1$. קראו את ההוכחה:

      (1) נניח ש-$a$ ו-$b$ אי-זוגיים.

      (2) לכן קיימים שלמים $k$ ו-$m$ כך ש-$a=2k+1$ ו-$b=2m+1$.

      (3) לכן $a+b=2k+2m+2=2(k+m+1)$.

      (4) $k+m+1$ שלם, ולכן $a+b$ זוגי.

      מה מצדיק את המעבר משורה (1) לשורה (2)?
    choices:
      - text: ההגדרה של מספר אי-זוגי
        correct: true
        feedback: >-
          נכון. "$a$ אי-זוגי" פירושו, לפי ההגדרה, שקיים שלם $k$ עם $a=2k+1$. כך מתרגמים הנחה במילים לנוסחה שאפשר
          לחשב איתה. (לשני המספרים יש שמות שונים, $k$ ו-$m$, כי הם לא חייבים להיות שווים.)
      - text: הטענה שאנחנו מוכיחים, ש-$a+b$ זוגי
        feedback: >-
          את מה שמוכיחים אסור להשתמש בו בדרך: הוא מופיע רק בסוף, בשורה (4). שורה (2) נובעת מההנחה שבשורה (1).
        misconception: MC-proof-backwards
      - text: 'דוגמה: $3=2\cdot1+1$ ו-$5=2\cdot2+1$'
        feedback: >-
          דוגמה מראה מקרה אחד. שורה (2) מדברת על $a$ ו-$b$ כלליים, ונובעת מההגדרה.
        misconception: MC-examples-are-proof
      - text: חשבון, הוצאת 2 כגורם משותף
        feedback: >-
          הוצאת גורם משותף מצדיקה את שורה (3), שבה $2k+2m+2$ נכתב כ-$2(k+m+1)$. במעבר ל-(2) אין שום חשבון.
        misconception: MC-step-justification-vague

  - id: Q-0.1-order-proof
    type: rank
    objectives: [OBJ-0.1-2]
    level: mid
    prompt: >-
      הוכיחו: אם $n$ שלם אי-זוגי, אז $n^2$ אי-זוגי. (מספר $n$ נקרא אי-זוגי אם $n=2k+1$ עבור שלם $k$ כלשהו.)
    help: 'סדרו את שלבי ההוכחה לפי הסדר הנכון.'
    items:
      - id: assume
        label: 'נניח ש-$n$ אי-זוגי.'
      - id: define
        label: 'לפי ההגדרה קיים שלם $k$ כך ש-$n=2k+1$.'
      - id: square
        label: 'נחשב: $n^2=(2k+1)^2=4k^2+4k+1$.'
      - id: rewrite
        label: 'נכתוב $n^2=2(2k^2+2k)+1$, ו-$2k^2+2k$ שלם.'
      - id: conclude
        label: 'לפי ההגדרה, $n^2$ אי-זוגי.'
    order: [assume, define, square, rewrite, conclude]
    correctFeedback: >-
      נכון. זה המבנה של הוכחה: מההנחה, דרך ההגדרה, לחשבון, ובחזרה להגדרה כדי לקרוא את התוצאה.
    wrongFeedback: >-
      הוכחה מתחילה במה שמניחים ומסתיימת במה שרוצים להוכיח. שאלו בכל שלב: מה צריך לדעת כבר כדי לכתוב אותו?

  - id: Q-0.1-divide-by-zero
    type: mc
    objectives: [OBJ-0.1-2]
    qualitative: true
    level: mid
    prompt: >-
      "הוכחה" ש-$2=1$. יהיו $a=b=1$.

      (1) $a=b$

      (2) $a^2=ab$

      (3) $a^2-b^2=ab-b^2$

      (4) $(a+b)(a-b)=b(a-b)$

      (5) $a+b=b$

      (6) $2=1$

      איזה מעבר אינו מוצדק?
    choices:
      - text: מ-(4) ל-(5)
        correct: true
        feedback: >-
          נכון. במעבר הזה חילקו את שני האגפים ב-$a-b$, אבל $a-b=0$, ובאפס אסור לחלק. מ-$0\cdot 2=0\cdot 1$ לא
          נובע $2=1$.
      - text: מ-(1) ל-(2)
        feedback: >-
          כאן כפלו את שני האגפים של שוויון ב-$a$. כפל של שני אגפים באותו מספר תמיד מותר: אם $a=b$ אז
          $a\cdot a=b\cdot a$.
        misconception: MC-step-justification-vague
      - text: מ-(3) ל-(4)
        feedback: >-
          זה פירוק: $a^2-b^2=(a+b)(a-b)$ ו-$ab-b^2=b(a-b)$. שתי הזהויות נכונות לכל $a$ ו-$b$.
        misconception: MC-step-justification-vague
      - text: מ-(5) ל-(6)
        feedback: >-
          כאן רק הציבו $a=b=1$: $1+1=2$ באגף שמאל ו-$1$ באגף ימין. ההצבה מוצדקת; השגיאה קרתה קודם.
        misconception: MC-step-justification-vague
    explanation: >-
      בכל חילוק בהוכחה שואלים: האם המחלק שונה מאפס? כמעט כל "הוכחה" ש-$2=1$ מסתירה חילוק באפס.

  - id: Q-0.1-backwards
    type: twotier
    objectives: [OBJ-0.1-2]
    qualitative: true
    level: exam
    prompt: >-
      סטודנט כתב: "רוצים להוכיח ש-$\sqrt2+\sqrt3<\sqrt{10}$. נעלה בריבוע: $5+2\sqrt6<10$, כלומר $2\sqrt6<5$.
      נעלה שוב בריבוע: $24<25$. זה נכון, ולכן הטענה נכונה." האם זו הוכחה תקינה כפי שנכתבה?
    choices:
      - text: לא, אבל אפשר לתקן אותה
        correct: true
        feedback: >-
          נכון. הטיעון התחיל מהטענה והגיע לדבר נכון, וזה לא מוכיח כלום כשלעצמו. כאן כל המעברים הפיכים, ולכן
          אפשר לכתוב אותם בכיוון ההפוך, מ-$24<25$ אל הטענה, וזו כבר הוכחה.
      - text: כן, היא תקינה כפי שנכתבה
        feedback: >-
          מטענה שקרית אפשר להגיע לדבר נכון: מ-$1=2$, אחרי כפל ב-$0$, מקבלים $0=0$. הגעה ל-$24<25$ מראה רק
          שהטענה **גוררת** משהו נכון.
        misconception: MC-proof-backwards
    reasons:
      - text: >-
          הגעה מהטענה לדבר נכון אינה הוכחה; אבל כאן כל הצדדים חיוביים, ולכן כל מעבר הפיך
        correct: true
        feedback: >-
          בדיוק. ההוכחה המתוקנת: $24<25$, ולכן (שני הצדדים חיוביים) $2\sqrt6<5$, ולכן $5+2\sqrt6<10$, כלומר
          $(\sqrt2+\sqrt3)^2<(\sqrt{10})^2$, ושוב משום ששני הבסיסים חיוביים, $\sqrt2+\sqrt3<\sqrt{10}$.
      - text: 'הגענו בסוף לאי-שוויון נכון, $24<25$, ולכן גם אי-השוויון שהתחלנו ממנו נכון, וזו הוכחה'
        feedback: >-
          זה בדיוק הכשל: מ-$1=2$ אפשר להגיע ל-$0=0$. השאלה היא אם אפשר ללכת **בחזרה**, ואת זה צריך לבדוק בכל
          מעבר.
        misconception: MC-proof-backwards
      - text: העלאה בריבוע שומרת תמיד על כיוון אי-השוויון, בכל מספר, ולכן כל המעברים כאן הפיכים
        feedback: >-
          לא תמיד: $-3<2$ אבל $9>4$. כאן זה עובד רק משום ששני הצדדים של כל אי-שוויון חיוביים, וזה מה שצריך
          לכתוב בהוכחה.
        misconception: MC-square-preserves-order

  - id: Q-0.1-assumed-conclusion
    type: mc
    objectives: [OBJ-0.1-2]
    qualitative: true
    level: exam
    prompt: >-
      טענה: לכל שני שלמים $a$ ו-$b$, אם $ab$ זוגי אז $a$ זוגי או $b$ זוגי. מישהי כתבה: "נניח ש-$a$ זוגי,
      כלומר $a=2k$. אז $ab=2(kb)$, ולכן $ab$ זוגי." מה הבעיה בהוכחה?
    choices:
      - text: היא הניחה את המסקנה והסיקה את ההנחה, כלומר הוכיחה טענה אחרת
        correct: true
        feedback: >-
          נכון. היא הניחה ש-$a$ זוגי, וזה חלק מהמסקנה, והגיעה ל-"$ab$ זוגי", שהוא ההנחה. מה שהוכח הוא "אם $a$
          זוגי אז $ab$ זוגי", טענה נכונה אבל אחרת. כדי להוכיח את הטענה צריך להתחיל מ-$ab$ זוגי. (בשיעור 0.4
          נלמד דרך נוחה לעשות זאת.)
      - text: 'אין בעיה: ההוכחה תקינה, כי כל שורה בה מוצדקת'
        feedback: >-
          ההוכחה התחילה ממה שהטענה רוצה להסיק והגיעה למה שהטענה מניחה. כך מוכיחים את הכיוון ההפוך, לא את
          הטענה.
        misconception: MC-proof-backwards
      - text: ההוכחה נכונה אבל חלקית, כי חסר בה המקרה ש-$b$ הוא הזוגי
        feedback: >-
          גם עם המקרה ש-$b$ זוגי ההוכחה הייתה מוכיחה רק "אם $a$ או $b$ זוגי אז $ab$ זוגי". הבעיה היא כיוון
          ההסקה, לא מקרה חסר.
        misconception: MC-step-justification-vague

  - id: Q-0.1-study-order
    type: rank
    objectives: [OBJ-0.1-3]
    level: basic
    prompt: >-
      כך בנוי כל פרק בקורס: שיעורים, שאלות הבנה אחרי כל שיעור, ובסוף הפרק שאלות חזרה ושאלות מבחן. באיזה סדר
      כדאי ללמוד פרק לבד?
    help: 'סדרו את שלבי הלימוד של פרק לפי הסדר.'
    items:
      - id: read
        label: קוראים שיעור ועוברים על הדוגמאות שבו
      - id: understand
        label: עונים על שאלות ההבנה של אותו שיעור, וקוראים את המשוב גם כשצדקתם
      - id: review
        label: אחרי כל שיעורי הפרק, עונים על שאלות החזרה
      - id: exam
        label: כותבים פתרון מלא לשאלות המבחן, בלי להציץ בפתרון
      - id: rubric
        label: משווים את מה שכתבתם לפתרון ולמחוון, ומסמנים מה היה חסר
    order: [read, understand, review, exam, rubric]
    correctFeedback: >-
      נכון. כל שלב בונה על הקודם: שאלות ההבנה בודקות שיעור אחד, החזרה מחברת שיעורים, ושאלות המבחן בודקות שאתם
      יודעים לכתוב הוכחה לבד.
    wrongFeedback: >-
      שאלות החזרה מניחות שכל השיעורים נלמדו, ושאלות המבחן שווה לנסות רק כשאפשר לכתוב פתרון בלי עזרה. ואת
      המחוון פותחים אחרי הכתיבה, לא לפניה.

  - id: Q-0.1-wrong-and-sure
    type: mc
    objectives: [OBJ-0.1-3]
    qualitative: true
    level: mid
    prompt: >-
      עניתם על שאלת הבנה, סימנתם "בטוחים", והתשובה הייתה שגויה. מה כדאי לעשות?
    choices:
      - text: לקרוא את המשוב, לחזור לחלק בשיעור, ולענות שוב בעוד כמה ימים
        correct: true
        feedback: >-
          נכון. טעות שסימנתם עליה "בטוחים" מראה תפיסה שגויה, לא רק חוסר ידע, ותפיסה שגויה לא נעלמת מעצמה. המשוב אומר מה
          הטעות ולמה.
      - text: לעבור לשאלה הבאה, כי זו כנראה טעות חד-פעמית של חוסר ריכוז
        feedback: >-
          דווקא טעות שעניתם עליה בביטחון היא הסימן שכדאי לעצור: חשבתם שאתם יודעים, ולכן תחזרו על אותה טעות גם
          במבחן.
        misconception: MC-wrong-and-sure-ignored
      - text: לענות שוב מיד על אותה שאלה, עכשיו כשהתשובה הנכונה ידועה
        feedback: >-
          תשובה נכונה מיד אחרי שראיתם אותה בודקת זיכרון לטווח קצר, לא הבנה. חזרה אחרי כמה ימים, אחרי שקראתם
          שוב את החלק בשיעור, בודקת את מה שחשוב.
        misconception: MC-study-passive-reading

  - id: Q-0.1-read-solution
    type: twotier
    objectives: [OBJ-0.1-3]
    qualitative: true
    level: mid
    prompt: >-
      סטודנטית קראה את הפתרון המלא של שאלת מבחן והבינה כל שורה בו. האם היא יכולה לסמן לעצמה שהיא "יודעת לפתור"
      את השאלה?
    choices:
      - text: עדיין לא
        correct: true
        feedback: >-
          נכון. היא יודעת לקרוא את הפתרון. במבחן צריך לכתוב אותו, ולבחור לבד מאיפה להתחיל.
      - text: כן, היא יודעת
        feedback: >-
          להבין פתרון ולכתוב פתרון הן שתי מיומנויות שונות. החלק הקשה, לבחור את הרעיון ואת הסדר, כבר נעשה
          בשבילה.
        misconception: MC-study-passive-reading
    reasons:
      - text: במבחן כותבים לבד; צריך לנסות בכתב בלי הפתרון, ואז להשוות למחוון
        correct: true
        feedback: >-
          בדיוק. ואם היא כבר קראה את הפתרון, כדאי לחזור לשאלה אחרי כמה ימים ולכתוב אותה מאפס.
      - text: הבנה של כל שורה בפתרון היא בדיוק מה שנבדק במבחן, ולכן היא מוכנה
        feedback: >-
          במבחן אין פתרון לקרוא. נבדקת היכולת לכתוב הוכחה שלמה ומוצדקת, וזה דורש תרגול של כתיבה.
        misconception: MC-study-passive-reading
      - text: שאלות מבחן חוזרות על הדוגמאות שבשיעור, ולכן מספיק לזכור את הפתרון
        feedback: >-
          שאלות מבחן משנות את הנתונים, את מה ששואלים או את סדר ההוכחה. מי שזוכר פתרון אחד ולא את הרעיון שלו,
          נתקע ברגע שמשהו משתנה.
        misconception: MC-study-passive-reading
