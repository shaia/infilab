# Lesson 1.5 — the completeness axiom.
# Objectives (src/course.ts):
#   OBJ-1.5-1  state the completeness axiom and explain why the rationals do not satisfy it
#   OBJ-1.5-2  compute sup and inf of sets and prove the answer in both directions
#   OBJ-1.5-3  prove properties of sup: of a sum of sets, of a constant multiple, of a subset
# Archimedes comes in 1.6, so the sets proved here are generated by a real parameter (x > 0, an interval),
# where the ε-step needs no natural number.
chapter: 1
questions:
  - id: Q-1.5-axiom
    type: mc
    objectives: [OBJ-1.5-1]
    qualitative: true
    level: basic
    prompt: איזה מהניסוחים הבאים הוא אקסיומת השלמות?
    choices:
      - text: 'לכל קבוצה לא ריקה $A\subseteq\mathbb{R}$ שחסומה מלעיל יש סופרמום ב-$\mathbb{R}$'
        correct: true
        feedback: >-
          נכון. שני התנאים, "לא ריקה" ו"חסומה מלעיל", הכרחיים, והמסקנה היא קיום **סופרמום**, לא מקסימום.
      - text: 'לכל קבוצה $A\subseteq\mathbb{R}$ יש סופרמום'
        feedback: >-
          ל-$[0,\infty)$ אין חסם מלעיל בכלל, ולכן אין לה סופרמום; וגם ל-$\varnothing$ אין (כל מספר חוסם אותה).
          לכן האקסיומה דורשת קבוצה לא ריקה וחסומה מלעיל.
        misconception: MC-completeness-no-hypotheses
      - text: 'לכל קבוצה לא ריקה $A\subseteq\mathbb{R}$ שחסומה מלעיל יש מקסימום'
        feedback: >-
          $(0,1)$ לא ריקה וחסומה, ואין לה מקסימום. השלמות מבטיחה רק סופרמום, שאולי אינו בקבוצה.
        misconception: MC-max-always-exists
      - text: 'לכל קבוצה לא ריקה $A\subseteq\mathbb{Q}$ שחסומה מלעיל יש סופרמום ב-$\mathbb{Q}$'
        feedback: >-
          זה לא נכון: $\{x\in\mathbb{Q}: x>0,\ x^2<2\}$ חסומה ואין לה סופרמום רציונלי (משפט 1.5.3). זה בדיוק ההבדל בין $\mathbb{Q}$
          ל-$\mathbb{R}$, ששניהם שדות סדורים.
        misconception: MC-dense-means-complete

  - id: Q-1.5-rationals-gap
    type: twotier
    objectives: [OBJ-1.5-1]
    qualitative: true
    level: mid
    prompt: >-
      נניח שקיימים רק הרציונליים. $A=\{x\in\mathbb{Q}: x>0,\ x^2<2\}$ חסומה מלעיל ב-$\mathbb{Q}$ (למשל
      ב-$2$). האם יש ל-$A$ סופרמום ב-$\mathbb{Q}$, כלומר חסם מלעיל רציונלי שקטן מכל חסם מלעיל רציונלי
      אחר?
    choices:
      - text: לא
        correct: true
        feedback: נכון. לכן $\mathbb{Q}$ אינו מקיים את אקסיומת השלמות.
      - text: כן
        feedback: >-
          הסופרמום היה צריך להיות רציונלי $r$ עם $r^2=2$, וכזה אין (שיעור 1.3). כל חסם מלעיל רציונלי אפשר
          להקטין ועדיין לקבל חסם.
        misconception: MC-dense-means-complete
    reasons:
      - text: >-
          כל חסם מלעיל רציונלי $r$ מקיים $r^2>2$ (שוויון אינו אפשרי, ו-$r^2<2$ היה מאפשר איבר של $A$ גדול
          מ-$r$), ולכל $r$ כזה יש חסם מלעיל רציונלי קטן ממנו
        correct: true
        feedback: >-
          בדיוק. לחסמים הרציונליים אין איבר קטן ביותר: הם "נעצרים" מעל הנקודה שבה $x^2=2$, נקודה שאינה
          ב-$\mathbb{Q}$.
      - text: 'לכל קבוצה חסומה של רציונליים יש מקסימום, ול-$A$ אין'
        feedback: >-
          גם בממשיים, ל-$(0,1)$ אין מקסימום ובכל זאת יש סופרמום. שאלת השלמות היא על הסופרמום, ואין שום כלל
          שלקבוצה חסומה יש מקסימום.
        misconception: MC-max-always-exists
      - text: 'בין כל שני רציונליים יש רציונלי נוסף, ולכן אין ב-$\mathbb{Q}$ "חורים" ויש סופרמום'
        feedback: >-
          הצפיפות נכונה, אבל אינה שלמות: בין כל שני רציונליים יש רציונלי, ובכל זאת אין רציונלי שריבועו $2$.
          זה ה"חור" שהשלמות סותמת.
        misconception: MC-dense-means-complete

  - id: Q-1.5-inf-exists
    type: mc
    objectives: [OBJ-1.5-1]
    qualitative: true
    level: mid
    prompt: >-
      אקסיומת השלמות מדברת רק על סופרמום. למה גם לכל קבוצה לא ריקה וחסומה מלרע יש אינפימום?
    choices:
      - text: >-
          כי $-A=\{-a : a\in A\}$ לא ריקה וחסומה מלעיל, ולכן יש לה סופרמום $s$; ו-$-s$ הוא האינפימום של $A$
        correct: true
        feedback: >-
          נכון. אם $m$ חסם מלרע של $A$, אז $-m$ חסם מלעיל של $-A$. היפוך הסימן מחליף בין חסמים מלעיל ומלרע,
          ובין הקטן ביותר לגדול ביותר.
      - text: 'כי יש אקסיומת שלמות נפרדת לאינפימום'
        feedback: >-
          אין צורך בה: קיום האינפימום הוא משפט שנובע מאקסיומת הסופרמום, בעזרת היפוך סימן.
        misconception: MC-field-fact-taken-as-axiom
      - text: 'כי האינפימום הוא האיבר הקטן ביותר של $A$, ולקבוצה חסומה מלרע יש איבר כזה'
        feedback: >-
          ל-$(0,1)$ אין איבר קטן ביותר, ובכל זאת יש לה אינפימום, $0$. האינפימום אינו חייב להיות בקבוצה.
        misconception: MC-sup-is-max

  - id: Q-1.5-smaller-bound
    type: rank
    objectives: [OBJ-1.5-1]
    level: exam
    prompt: >-
      בתוך $\mathbb{Q}$: $A=\{x\in\mathbb{Q}: x>0,\ x^2<2\}$, ו-$r>0$ רציונלי עם $r^2>2$. הראו ש-$r$ אינו
      הסופרמום של $A$ ב-$\mathbb{Q}$, בעזרת $$r'=r-\frac{r^2-2}{2r}.$$
    help: 'סדרו את שלבי ההוכחה לפי הסדר הנכון.'
    items:
      - id: s1
        label: '$r''$ רציונלי, כי הוא מתקבל מ-$r$ בחיבור, כפל וחילוק, ו-$\mathbb{Q}$ סגורה לפעולות האלה'
      - id: s2
        label: '$0<r''<r$, כי $\frac{r^2-2}{2r}>0$ ו-$r''=\frac{r^2+2}{2r}$'
      - id: s3
        label: '$r''^2=r^2-(r^2-2)+\left(\frac{r^2-2}{2r}\right)^2=2+\left(\frac{r^2-2}{2r}\right)^2>2$'
      - id: s4
        label: 'אילו היה $x\in A$ עם $x>r''$, אז (כי $r''>0$) $x^2>r''^2>2$, בסתירה ל-$x^2<2$; לכן $r''$ חסם מלעיל של $A$'
      - id: s5
        label: 'מצאנו חסם מלעיל רציונלי קטן מ-$r$, ולכן $r$ אינו החסם הקטן ביותר'
    order: [[s1, s2], s3, s4, s5]
    correctFeedback: >-
      נכון. $r'$ הוא צעד אחד של שיטת ניוטון: הוא מקטין את $r$, אבל לא מספיק כדי ש-$r'^2$ יירד אל מתחת ל-2.
    wrongFeedback: >-
      קודם בודקים מה $r'$ (רציונלי, חיובי, קטן מ-$r$), אחר כך מחשבים את ריבועו, ורק בעזרת $r'^2>2$ מראים
      שהוא חסם מלעיל.

  - id: Q-1.5-interval-sup
    type: numeric
    objectives: [OBJ-1.5-2]
    level: basic
    prompt: >-
      $A=\{x\in\mathbb{R}: |x-2|<5\}$. מהו $\sup A$?
    answer: 7
    tolerance: 0.001
    correctFeedback: >-
      נכון. $|x-2|<5 \iff -3<x<7$, ולכן $A=(-3,7)$ ו-$\sup A=7$, שאינו בקבוצה.
    wrongFeedback: >-
      תרגמו את $|x-2|<5$ לשני אי-שוויונות, $-5<x-2<5$, וכתבו את $A$ כקטע.
    commonWrong:
      - value: 5
        feedback: >-
          $5$ הוא הרדיוס של הקטע, לא הקצה שלו. הקטע מרוכז ב-$2$, ולכן הקצה הימני הוא $2+5$.
      - value: -3
        feedback: >-
          $-3$ הוא הקצה השמאלי, כלומר $\inf A$. הסופרמום הוא הקצה הימני.

  - id: Q-1.5-one-side
    type: twotier
    objectives: [OBJ-1.5-2]
    qualitative: true
    level: mid
    prompt: >-
      בהוכחה ש-$\sup(0,1)=1$ סטודנט הראה ש-$1$ חסם מלעיל של $(0,1)$, וסיים. האם ההוכחה שלמה?
    choices:
      - text: לא
        correct: true
        feedback: נכון. הוכחה של סופרמום יש לה תמיד שני צדדים.
      - text: כן
        feedback: >-
          גם $2$ חסם מלעיל של $(0,1)$. הוכחה שעוצרת אחרי "חסם מלעיל" לא מבדילה בין $1$ ל-$2$.
        misconception: MC-sup-proof-one-side
    reasons:
      - text: 'צריך גם להראות שאין חסם מלעיל קטן מ-1: לכל $\varepsilon>0$ יש איבר גדול מ-$1-\varepsilon$'
        correct: true
        feedback: >-
          בדיוק. למשל $a=\max\left(\frac12,1-\frac\varepsilon2\right)$ נמצא ב-$(0,1)$ וגדול מ-$1-\varepsilon$.
      - text: 'די בחסם מלעיל, כי $1$ הוא החסם הקרוב ביותר לקבוצה'
        feedback: >-
          "הקרוב ביותר" הוא בדיוק מה שצריך להוכיח, ולא מה שמותר להניח. בלי הצד השני גם $2$ היה עובר.
        misconception: MC-sup-proof-one-side
      - text: 'צריך גם להראות ש-$1\in(0,1)$'
        feedback: >-
          $1\notin(0,1)$, ובכל זאת $\sup(0,1)=1$. הסופרמום אינו חייב להיות בקבוצה; מה שחסר הוא אפיון האפסילון.
        misconception: MC-sup-is-max

  - id: Q-1.5-fraction-set
    type: multi
    objectives: [OBJ-1.5-2]
    qualitative: true
    level: mid
    prompt: >-
      $A=\left\{\frac{x}{1+x} : x>0\right\}$. אילו מהטענות נכונות? סמנו את כולן.
    choices:
      - text: '$\sup A=1$'
        correct: true
        feedback: >-
          נכון. $\frac{x}{1+x}=1-\frac{1}{1+x}<1$, וכש-$x$ גדל האיבר מתקרב ל-1 כרצוננו.
      - text: 'ל-$A$ אין מקסימום'
        correct: true
        feedback: >-
          נכון. כל איבר קטן ממש מ-1, ולכל $x$ האיבר המתאים ל-$x+1$ גדול ממנו.
      - text: '$\inf A=0$'
        correct: true
        feedback: >-
          נכון. כל איבר חיובי, ולכל $\varepsilon>0$ האיבר עם $x=\varepsilon$ הוא $\frac{\varepsilon}{1+\varepsilon}<\varepsilon$.
      - text: '$\min A=0$'
        feedback: >-
          $\frac{x}{1+x}=0$ רק כש-$x=0$, ו-$x=0$ אינו מותר. $0$ הוא האינפימום, לא המינימום.
        misconception: MC-sup-is-max
      - text: 'ל-$A$ אין חסם מלעיל, כי $x$ יכול להיות גדול כרצוננו'
        feedback: >-
          $x$ הוא רק הפרמטר שמייצר את האיבר; האיברים עצמם הם $\frac{x}{1+x}$, וכולם קטנים מ-1.
        misconception: MC-set-parameter-vs-element

  - id: Q-1.5-choose-x
    type: mc
    objectives: [OBJ-1.5-2]
    level: exam
    prompt: >-
      בהוכחה ש-$\sup\left\{\frac{x}{1+x} : x>0\right\}=1$ נתון $\varepsilon\in(0,1)$. איזו בחירה של $x>0$
      מבטיחה $\frac{x}{1+x}>1-\varepsilon$?
    choices:
      - text: '$x=\frac1\varepsilon$'
        correct: true
        feedback: >-
          נכון. $\frac{1/\varepsilon}{1+1/\varepsilon}=\frac1{1+\varepsilon}$, ו-$\frac1{1+\varepsilon}>1-\varepsilon$
          כי $(1-\varepsilon)(1+\varepsilon)=1-\varepsilon^2<1$.
      - text: '$x=1-\varepsilon$'
        feedback: >-
          כאן בחרו את הפרמטר $x$ קרוב ל-$1-\varepsilon$, אבל קרוב ל-1 צריך להיות **האיבר** $\frac{x}{1+x}$.
          עם $x=1-\varepsilon$ האיבר הוא $\frac{1-\varepsilon}{2-\varepsilon}<\frac12$.
        misconception: MC-set-parameter-vs-element
      - text: 'אין $x$ כזה, כי $1\notin A$ ולכן האיברים אינם מתקרבים ל-1'
        feedback: >-
          ש-$1\notin A$ פירושו רק שאין מקסימום. האיברים כן מתקרבים ל-1: $\frac{x}{1+x}=1-\frac1{1+x}$, והמרחק
          מ-1 קטן כרצוננו כש-$x$ גדל.
        misconception: MC-sup-is-max
    hints:
      - 'פתרו את $\frac{x}{1+x}>1-\varepsilon$ עבור $x$: כפלו ב-$1+x>0$.'

  - id: Q-1.5-sum-sets
    type: numeric
    objectives: [OBJ-1.5-3]
    level: basic
    prompt: >-
      $A,B$ לא ריקות וחסומות מלעיל, $\sup A=3$ ו-$\sup B=5$. מהו $\sup(A+B)$, כאשר
      $A+B=\{a+b : a\in A,\ b\in B\}$?
    answer: 8
    tolerance: 0.001
    correctFeedback: >-
      נכון. $\sup(A+B)=\sup A+\sup B$: הסכום חוסם כל $a+b$, ואיברים קרובים לשני הסופרמומים נותנים סכום קרוב
      לסכומם.
    wrongFeedback: >-
      כל איבר של $A+B$ הוא $a+b$ עם $a\le3$ ו-$b\le5$. מה החסם הטבעי, והאם אפשר להתקרב אליו?
    commonWrong:
      - value: 15
        feedback: >-
          $15$ הוא מכפלת הסופרמומים. $A+B$ היא קבוצת **סכומים**, ולכן גם הסופרמום שלה הוא סכום.
      - value: 5
        feedback: >-
          $5$ הוא הגדול מבין שני הסופרמומים, אבל בכל איבר של $A+B$ מחברים איבר מ-$A$ לאיבר מ-$B$, ושניהם
          תורמים.

  - id: Q-1.5-negative-scalar
    type: numeric
    objectives: [OBJ-1.5-3]
    level: mid
    prompt: >-
      $A$ חסומה, $\sup A=4$ ו-$\inf A=-1$. מהו $\sup(-2A)$, כאשר $-2A=\{-2a : a\in A\}$?
    answer: 2
    tolerance: 0.001
    correctFeedback: >-
      נכון. כפל במספר שלילי הופך את הסדר, ולכן הגדולים ב-$-2A$ באים מהקטנים ב-$A$:
      $\sup(-2A)=-2\inf A=-2\cdot(-1)=2$.
    wrongFeedback: >-
      $a\ge-1$ לכל $a\in A$. מה נובע מזה על $-2a$? כפל ב-$-2$ הופך את כיוון אי-השוויון.
    commonWrong:
      - value: -8
        feedback: >-
          $-2\sup A=-8$ הוא דווקא $\inf(-2A)$: האיבר הגדול ביותר של $A$ הופך לקטן ביותר. עבור $c<0$,
          $\sup(cA)=c\inf A$.
        misconception: MC-sup-negative-scalar
      - value: 8
        feedback: >-
          $8=2\cdot4$, כאילו מינוס "נעלם". כפל ב-$-2$ הופך את הסדר, ולכן הסופרמום של $-2A$ בא מהאינפימום
          של $A$.
        misconception: MC-sup-negative-scalar

  - id: Q-1.5-subset
    type: twotier
    objectives: [OBJ-1.5-3]
    qualitative: true
    level: mid
    prompt: >-
      $A\subsetneq B$ (הכלה ממש), ושתיהן לא ריקות וחסומות מלעיל. האם בהכרח $\sup A<\sup B$?
    choices:
      - text: לא
        correct: true
        feedback: נכון. בטוח רק $\sup A\le\sup B$.
      - text: כן
        feedback: >-
          $A=[0,1)$ מוכלת ממש ב-$B=[0,1]$, ולשתיהן אותו סופרמום, $1$.
        misconception: MC-sup-strict-inclusion
    reasons:
      - text: '$A=[0,1)$, $B=[0,1]$: הכלה ממש וסופרמום שווה. בטוח רק $\le$, כי $\sup B$ חוסם גם את $A$'
        correct: true
        feedback: >-
          בדיוק. כל חסם מלעיל של $B$ חוסם גם את $A$, ובפרט $\sup B$; לכן $\sup A$, הקטן מבין החסמים של $A$,
          קטן או שווה לו.
      - text: 'ב-$B$ יש איברים נוספים, ולכן הסופרמום שלה גדול יותר'
        feedback: >-
          האיברים הנוספים יכולים להיות קטנים, או שווים לסופרמום של $A$. הוספת $1$ ל-$[0,1)$ לא מגדילה את
          הסופרמום.
        misconception: MC-sup-strict-inclusion
      - text: 'לא, ואפילו ייתכן ש-$\sup A>\sup B$'
        feedback: >-
          זה בלתי אפשרי: $\sup B$ חסם מלעיל של $B$, ולכן גם של $A\subseteq B$, ו-$\sup A$ הוא החסם הקטן ביותר
          של $A$. לכן תמיד $\sup A\le\sup B$.
        misconception: MC-sup-strict-inclusion

  - id: Q-1.5-sum-proof
    type: rank
    objectives: [OBJ-1.5-3]
    level: exam
    prompt: >-
      $A,B$ לא ריקות וחסומות מלעיל. הוכיחו ש-$\sup(A+B)=\sup A+\sup B$.
    help: 'סדרו את שלבי ההוכחה לפי הסדר הנכון.'
    items:
      - id: s1
        label: 'לפי אקסיומת השלמות קיימים $\sup A$ ו-$\sup B$; נסמן $s=\sup A+\sup B$'
      - id: s2
        label: 'לכל $a\in A$ ו-$b\in B$: $a\le\sup A$ ו-$b\le\sup B$, ולכן $a+b\le s$. כלומר $s$ חסם מלעיל של $A+B$'
      - id: s3
        label: 'יהי $\varepsilon>0$. לפי אפיון האפסילון יש $a\in A$ עם $a>\sup A-\frac\varepsilon2$, ו-$b\in B$ עם $b>\sup B-\frac\varepsilon2$'
      - id: s4
        label: 'אז $a+b\in A+B$ ו-$a+b>s-\varepsilon$'
      - id: s5
        label: 'לפי אפיון האפסילון, $s=\sup(A+B)$'
    order: [s1, s2, s3, s4, s5]
    correctFeedback: >-
      נכון. שימו לב ל-$\frac\varepsilon2$: כל אחת מהקבוצות "תורמת" חצי מהמרחק המותר, וכך הסכום מפסיד לכל
      היותר $\varepsilon$.
    wrongFeedback: >-
      שני הצדדים של הוכחת סופרמום: קודם $s$ חסם מלעיל, אחר כך לכל $\varepsilon$ יש איבר מעל $s-\varepsilon$.
      ולפני הכול צריך לדעת ש-$\sup A$ ו-$\sup B$ קיימים.

  - id: Q-1.5-strict-separation
    type: twotier
    objectives: [OBJ-1.5-3]
    qualitative: true
    level: mid
    prompt: >-
      $A,B$ לא ריקות, ו-$a<b$ לכל $a\in A$ ולכל $b\in B$. האם בהכרח $\sup A<\inf B$?
    choices:
      - text: לא
        correct: true
        feedback: נכון. בטוח רק $\sup A\le\inf B$ (טענה 1.5.6).
      - text: כן
        feedback: >-
          $A=[0,1)$ ו-$B=[1,2]$: כל איבר של $A$ קטן ממש מכל איבר של $B$, ובכל זאת $\sup A=1=\inf B$.
        misconception: MC-sup-strict-separation
    reasons:
      - text: '$A=[0,1)$, $B=[1,2]$: $a<1\le b$ תמיד, ו-$\sup A=\inf B=1$'
        correct: true
        feedback: >-
          בדיוק. $\sup A$ אינו איבר של $A$, ולכן אי-השוויון הממש $a<b$ אינו חל עליו; מה שעובר לסופרמום הוא רק
          $\le$.
      - text: 'כל $b\in B$ חסם מלעיל של $A$, ולכן $\sup A<b$ לכל $b$'
        feedback: >-
          מכך ש-$b$ חסם מלעיל נובע $\sup A\le b$, לא $\sup A<b$: הסופרמום הוא החסם **הקטן ביותר**, והוא יכול
          להיות שווה ל-$b$. בדוגמה $[0,1)$, $[1,2]$ זה קורה עם $b=1$.
        misconception: MC-sup-strict-separation
      - text: 'בין שתי הקבוצות יש תמיד רווח, כי $a\ne b$ לכל זוג'
        feedback: >-
          $a\ne b$ לכל זוג לא נותן רווח קבוע: האיברים של $[0,1)$ מתקרבים ל-1 כרצוננו, ו-1 הוא איבר של $B$.
        misconception: MC-sup-strict-separation

  - id: Q-1.5-difference
    type: mc
    objectives: [OBJ-1.5-3]
    level: mid
    prompt: >-
      $A,B$ לא ריקות וחסומות. מהו $\sup(A-B)$, כאשר $A-B=\{a-b : a\in A,\ b\in B\}$?
    choices:
      - text: '$\sup A-\inf B$'
        correct: true
        feedback: >-
          נכון. $A-B=A+(-B)$, ו-$\sup(-B)=-\inf B$. ההפרש הגדול ביותר מתקבל מ-$a$ גדול ומ-$b$ **קטן**.
      - text: '$\sup A-\sup B$'
        feedback: >-
          מחסרים $b$, ולכן כדי שההפרש יהיה גדול צריך $b$ קטן. דוגמה: $A=B=[0,1]$; $A-B=[-1,1]$, וסופרמום $1$,
          לא $0$.
        misconception: MC-sup-negative-scalar
      - text: '$\inf A-\sup B$'
        feedback: >-
          זה $\inf(A-B)$, ההפרש הקטן ביותר: $a$ קטן ו-$b$ גדול. הסופרמום מתקבל בדיוק להפך.
        misconception: MC-sup-negative-scalar
