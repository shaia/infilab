# Lesson 4.3 — the intermediate value theorem.
# Objectives (src/course.ts):
#   OBJ-4.3-1  state and prove the intermediate value theorem (by bisection or by sup)
#   OBJ-4.3-2  use it to prove that an equation has a solution, and that a fixed point exists
#   OBJ-4.3-3  show by examples that it fails when f is not continuous or the domain is not an interval
chapter: 4
questions:
  - id: Q-4.3-statement
    type: mc
    objectives: [OBJ-4.3-1]
    qualitative: true
    level: basic
    prompt: >-
      איזה מהניסוחים הבאים הוא משפט ערך הביניים (בצורת "קיום שורש")?
    choices:
      - text: 'אם $f$ רציפה בקטע $[a,b]$ ו-$f(a)<0<f(b)$, אז קיים $c\in(a,b)$ כך ש-$f(c)=0$'
        correct: true
        feedback: >-
          נכון. בצורה הכללית: פונקציה רציפה על $[a,b]$ מקבלת כל ערך שבין $f(a)$ ל-$f(b)$. מפעילים את הצורה
          שכאן על $f-y$.
      - text: 'אם $f$ רציפה בקטע $[a,b]$ ו-$f(a)<0<f(b)$, אז קיים $c\in(a,b)$ **יחיד** כך ש-$f(c)=0$'
        feedback: >-
          המשפט מבטיח קיום, לא יחידות. $f(x)=x^3-x$ על $[-2,2]$ מקיימת $f(-2)=-6<0<6=f(2)$, ויש לה שלושה
          שורשים: $-1$, $0$ ו-$1$.
        misconception: MC-ivt-unique-root
      - text: 'אם $f$ רציפה בקטע הפתוח $(a,b)$, מוגדרת ב-$[a,b]$ ו-$f(a)<0<f(b)$, אז קיים $c\in(a,b)$ כך ש-$f(c)=0$'
        feedback: >-
          בלי רציפות בקצוות זה נכשל: $f(0)=-1$ ו-$f(x)=1$ לכל $x\in(0,1]$. $f$ רציפה ב-$(0,1)$, $f(0)<0<f(1)$,
          ואין לה שורש.
        misconception: MC-ivt-open-continuity-enough
      - text: 'אם $f$ רציפה בקטע $[a,b]$ ויש לה שורש ב-$(a,b)$, אז $f(a)$ ו-$f(b)$ בעלי סימנים הפוכים'
        feedback: >-
          זה הכיוון ההפוך, והוא שגוי: $f(x)=x^2$ על $[-1,1]$ מתאפסת ב-0, ו-$f(-1)=f(1)=1$. כשאין החלפת סימן,
          המשפט פשוט לא אומר דבר.
        misconception: MC-ivt-converse

  - id: Q-4.3-bisect
    type: numeric
    objectives: [OBJ-4.3-1]
    level: mid
    prompt: >-
      מפעילים את שיטת החציה על $f(x)=x^2-2$ בקטע $[1,2]$: בכל שלב מחשבים את $f$ באמצע הקטע $m$; אם
      $f(m)<0$ מחליפים את הקצה השמאלי ב-$m$, ואחרת את הקצה הימני. מהו הקצה **השמאלי** של הקטע אחרי שלושה
      שלבים?
    answer: 1.375
    tolerance: 0.001
    correctFeedback: >-
      נכון. $f(1.5)=0.25>0$ ולכן $[1,1.5]$; $f(1.25)=-0.4375<0$ ולכן $[1.25,1.5]$; $f(1.375)\approx-0.109<0$
      ולכן $[1.375,1.5]$. בכל שלב $f$ שלילית בקצה השמאלי ואי-שלילית בימני, ו-$\sqrt2\approx1.4142$ תמיד בפנים.
    wrongFeedback: >-
      עשו את שלושת השלבים אחד אחד ורשמו את הקטע אחרי כל שלב. שימו לב לסימן של $f(m)$: הוא קובע איזה קצה
      מוחלף.
    commonWrong:
      - value: 1.25
        feedback: זה הקצה השמאלי אחרי שני שלבים. בשלב השלישי $f(1.375)<0$, ולכן הקצה השמאלי זז שוב.
      - value: 1.5
        feedback: >-
          1.5 הוא הקצה הימני, שנקבע כבר בשלב הראשון ($f(1.5)>0$). השאלה היא על הקצה השמאלי.
      - value: 1.4375
        feedback: >-
          זה אמצע הקטע $[1.375,1.5]$, כלומר הנקודה שבודקים בשלב **הרביעי**. אחרי שלושה שלבים הקטע הוא
          $[1.375,1.5]$.

  - id: Q-4.3-bisect-continuity
    type: mc
    objectives: [OBJ-4.3-1]
    qualitative: true
    level: mid
    prompt: >-
      בהוכחת משפט ערך הביניים בשיטת החציה בונים קטעים $[a_n,b_n]$, כל אחד חצי מקודמו, עם $f(a_n)<0\le f(b_n)$.
      באיזה שלב של ההוכחה משתמשים ב**רציפות** של $f$?
    choices:
      - text: 'כשמסיקים מ-$a_n\to c$ ו-$b_n\to c$ ש-$f(a_n)\to f(c)$ ו-$f(b_n)\to f(c)$, ולכן $f(c)\le 0\le f(c)$'
        correct: true
        feedback: >-
          נכון. זו הגדרת היינה לרציפות, ואחריה שמירת אי-שוויון חלש בגבול (שיעור 2.5). בלי רציפות הגבולות של
          $f(a_n)$ ושל $f(b_n)$ לא קשורים ל-$f(c)$.
      - text: 'כשמסיקים ש-$a_n$ ו-$b_n$ מתכנסות'
        feedback: >-
          זה נובע מכך ש-$a_n$ עולה וחסומה ו-$b_n$ יורדת וחסומה (שיעור 2.7), כלומר מאקסיומת השלמות, בלי שום
          תכונה של $f$.
      - text: 'כשמראים ש-$b_n-a_n=\frac{b-a}{2^n}\to 0$'
        feedback: >-
          זה חשבון על הקטעים בלבד; הוא נותן ש-$a_n$ ו-$b_n$ שואפות לאותו גבול $c$, אבל לא אומר דבר על $f$.
      - text: 'כשבוחרים בכל שלב את החצי שבו $f$ מחליפה סימן'
        feedback: >-
          הבחירה דורשת רק לחשב את $f$ באמצע הקטע ולבדוק סימן. היא עובדת לכל פונקציה, גם לא רציפה; מה שנכשל
          בלי רציפות הוא הצעד האחרון.

  - id: Q-4.3-sup-proof
    type: rank
    objectives: [OBJ-4.3-1]
    level: exam
    help: 'סדרו את שלבי ההוכחה לפי הסדר הנכון.'
    prompt: >-
      הטענה: אם $f$ רציפה ב-$[a,b]$ ו-$f(a)<0<f(b)$, יש $c\in(a,b)$ עם $f(c)=0$. סדרו את שלבי ההוכחה
      בעזרת סופרמום.
    items:
      - id: s1
        label: 'נגדיר $S=\{x\in[a,b]:\ f(x)<0\}$. $a\in S$ ו-$b$ חסם מלעיל של $S$, ולכן לפי אקסיומת השלמות יש $c=\sup S$, ו-$a\le c\le b$.'
      - id: s2
        label: 'נניח $f(c)<0$. אז $c<b$, ומהרציפות $f<0$ גם בנקודות של $[a,b]$ קצת מימין ל-$c$; יש ב-$S$ נקודה גדולה מ-$c$, סתירה. לכן $f(c)\ge 0$.'
      - id: s3
        label: 'נניח עכשיו $f(c)>0$. אז $c>a$, ומהרציפות יש $\delta>0$ עם $f>0$ בכל $(c-\delta,\ c]$; אף נקודה שם אינה ב-$S$, ולכן $c-\delta$ חסם מלעיל של $S$, בסתירה לכך ש-$c$ החסם הקטן ביותר.'
      - id: s4
        label: 'לכן $f(c)=0$, ו-$c\ne a,b$ כי $f(a)<0<f(b)$.'
    order: [s1, s2, s3, s4]
    correctFeedback: >-
      נכון. אקסיומת השלמות נותנת את הנקודה $c$, והרציפות פוסלת את שתי האפשרויות $f(c)<0$ ו-$f(c)>0$ (בשני
      המקרים: אם $f(c)\ne0$, $f$ שומרת על הסימן שלה בסביבה של $c$).
    wrongFeedback: >-
      קודם צריך נקודה מועמדת, ורק אז אפשר לפסול אפשרויות לגביה. שימו לב גם לשלב שאומר "לכן $f(c)\ge0$": הוא
      צריך לבוא לפני השלב שמשתמש בזה.

  - id: Q-4.3-cos
    type: mc
    objectives: [OBJ-4.3-2]
    level: mid
    prompt: >-
      כדי להוכיח שלמשוואה $x=\cos x$ יש פתרון, מגדירים $g(x)=x-\cos x$. באיזה קטע משפט ערך הביניים מבטיח
      שורש של $g$?
    choices:
      - text: '$[0,\ \frac\pi2]$'
        correct: true
        feedback: >-
          נכון. $g(0)=-1<0$ ו-$g(\frac\pi2)=\frac\pi2>0$, ו-$g$ רציפה. (הפתרון הוא בערך $0.7391$; אפשר לבדוק
          בשיטת החציה.)
      - text: '$[\frac\pi2,\ \pi]$'
        feedback: >-
          $g(\frac\pi2)=\frac\pi2>0$ ו-$g(\pi)=\pi+1>0$: אין החלפת סימן, והמשפט לא אומר כאן דבר. (בקטע הזה
          $\cos$ מחליפה סימן, אבל צריך להפעיל את המשפט על $g$.)
        misconception: MC-ivt-sign-change-unchecked
      - text: '$[-1,\ 0]$'
        feedback: >-
          $g(-1)=-1-\cos1<0$ וגם $g(0)=-1<0$: אין החלפת סימן, ולכן אין מסקנה מהמשפט.
        misconception: MC-ivt-sign-change-unchecked
      - text: 'באף קטע, כי המשפט מבטיח שורשים רק לפולינומים'
        feedback: >-
          המשפט חל על כל פונקציה רציפה בקטע סגור. $g$ היא הפרש של $x$ ו-$\cos x$, ששתיהן רציפות (שיעור 4.1).
        misconception: MC-ivt-polynomials-only

  - id: Q-4.3-odd
    type: twotier
    objectives: [OBJ-4.3-2]
    qualitative: true
    level: mid
    prompt: >-
      האם לכל פולינום ממעלה אי-זוגית (למשל $x^5-3x^2+7$) יש שורש ממשי?
    choices:
      - text: כן
        correct: true
        feedback: נכון. זה אחד השימושים הקלאסיים של משפט ערך הביניים.
      - text: לא בהכרח
        feedback: >-
          למעלה זוגית זה נכון ($x^2+1$ אין לו שורש), אבל במעלה אי-זוגית הפולינום שואף לאינסופים **הפוכים** בשני
          הקצוות, ולכן מחליף סימן.
    reasons:
      - text: 'אם המקדם המוביל חיובי, $p(x)\to\infty$ כש-$x\to\infty$ ו-$p(x)\to-\infty$ כש-$x\to-\infty$; לכן יש $a<b$ עם $p(a)<0<p(b)$, ומפעילים את המשפט על $[a,b]$'
        correct: true
        feedback: >-
          בדיוק. ההוכחה לא מוצאת את הקטע במפורש: הגבולות באינסוף (שיעור 3.6) מבטיחים שקטע כזה קיים.
      - text: '$p(0)$ ו-$p(1)$ תמיד בסימנים הפוכים'
        feedback: >-
          לא נכון: עבור $p(x)=x^3+1$, $p(0)=1$ ו-$p(1)=2$. השורש שלו הוא $-1$. הקטע תלוי בפולינום.
        misconception: MC-ivt-sign-change-unchecked
      - text: 'יש לו בדיוק שורש ממשי אחד'
        feedback: >-
          לא בהכרח אחד: $x^3-x$ ממעלה 3 ויש לו שלושה שורשים. המשפט נותן קיום, לא מספר.
        misconception: MC-ivt-unique-root

  - id: Q-4.3-numroots
    type: numeric
    objectives: [OBJ-4.3-2]
    level: mid
    prompt: >-
      $p(x)=x^3-3x+1$. חשבו את $p$ בנקודות $-2,-1,0,1,2$, והשתמשו במשפט ערך הביניים: לכמה שורשים ממשיים
      שונים לפחות $p$ מבטיח המשפט? (לפולינום ממעלה 3 יש לכל היותר 3 שורשים, ולכן זה גם המספר המדויק.)
    answer: 3
    tolerance: 0.001
    correctFeedback: >-
      נכון. $p(-2)=-1$, $p(-1)=3$, $p(0)=1$, $p(1)=-1$, $p(2)=3$: שלוש החלפות סימן, בקטעים $(-2,-1)$, $(0,1)$
      ו-$(1,2)$, שזרים זה לזה. (השורשים בערך $-1.879$, $0.347$ ו-$1.532$.)
    wrongFeedback: >-
      ספרו את הקטעים הסמוכים $[-2,-1]$, $[-1,0]$, $[0,1]$, $[1,2]$ שבקצותיהם $p$ בסימנים הפוכים. קטעים זרים
      נותנים שורשים שונים.
    commonWrong:
      - value: 1
        feedback: >-
          ממעלה אי-זוגית נובע רק שורש **אחד לפחות**. כאן הערכים מראים יותר: יש שלוש החלפות סימן.
        misconception: MC-ivt-unique-root
      - value: 2
        feedback: >-
          פספסתם החלפת סימן. בדקו שוב כל זוג נקודות סמוכות: גם בין $-2$ ל-$-1$ הסימן מתחלף.

  - id: Q-4.3-fixed
    type: rank
    objectives: [OBJ-4.3-2]
    level: exam
    help: 'סדרו את שלבי ההוכחה לפי הסדר הנכון.'
    prompt: >-
      הטענה: לכל פונקציה רציפה $f:[0,1]\to[0,1]$ יש נקודת שבת, כלומר $c$ עם $f(c)=c$. סדרו את שלבי ההוכחה.
    items:
      - id: s1
        label: 'נגדיר $g(x)=f(x)-x$; היא רציפה ב-$[0,1]$ כהפרש של פונקציות רציפות.'
      - id: s2
        label: 'מכיוון ש-$0\le f(x)\le 1$: $g(0)=f(0)\ge 0$ ו-$g(1)=f(1)-1\le 0$.'
      - id: s3
        label: 'אם $g(0)=0$ או $g(1)=0$, הקצה המתאים הוא נקודת שבת.'
      - id: s4
        label: 'אחרת $g(0)>0>g(1)$, ולפי משפט ערך הביניים יש $c\in(0,1)$ עם $g(c)=0$, כלומר $f(c)=c$.'
    order: [s1, s2, s3, s4]
    correctFeedback: >-
      נכון. הרעיון הוא להפוך "$f(c)=c$" ל"$g(c)=0$", ואז להשתמש בכך שהתמונה של $f$ בתוך $[0,1]$ כדי לקבל את
      הסימנים בקצוות.
    wrongFeedback: >-
      מתחילים מהפונקציה שהשורש שלה הוא נקודת השבת, ורק אז בודקים סימנים בקצוות. שימו לב שאי-השוויונות שם
      חלשים, ולכן צריך לטפל בנפרד במקרה של שוויון.

  - id: Q-4.3-fixed-open
    type: twotier
    objectives: [OBJ-4.3-2, OBJ-4.3-3]
    qualitative: true
    level: mid
    prompt: >-
      האם לכל פונקציה רציפה $f:(0,1)\to(0,1)$ יש נקודת שבת?
    choices:
      - text: לא
        correct: true
        feedback: נכון. בקטע פתוח הטענה נכשלת.
      - text: כן, כמו ב-$[0,1]$
        feedback: >-
          ההוכחה ב-$[0,1]$ משתמשת ב-$g(0)\ge0$ וב-$g(1)\le0$, ובקטע פתוח הנקודות 0 ו-1 אינן בתחום. ואכן,
          $f(x)=\frac x2$ היא דוגמה נגדית.
        misconception: MC-ivt-domain-irrelevant
    reasons:
      - text: '$f(x)=\frac x2$ ממפה את $(0,1)$ לתוך $(0,1)$, ו-$\frac x2=x$ רק ב-$x=0$, שאינו בתחום'
        correct: true
        feedback: >-
          בדיוק. הפונקציה $g(x)=f(x)-x=-\frac x2$ שלילית בכל $(0,1)$: אין החלפת סימן, כי חסרות נקודות הקצה.
      - text: אותה הוכחה עובדת, עם $g(x)=f(x)-x$
        feedback: >-
          $g(0)$ ו-$g(1)$ אינם מוגדרים, ו-$g$ יכולה להיות בעלת סימן קבוע בכל הקטע הפתוח, כמו $-\frac x2$.
        misconception: MC-ivt-domain-irrelevant
      - text: '$f(x)-x$ תמיד מחליפה סימן ב-$(0,1)$, כי הערכים של $f$ בתוך $(0,1)$'
        feedback: >-
          אצל $f(x)=\frac x2$ ההפרש $f(x)-x=-\frac x2$ שלילי לכל $x\in(0,1)$. בלי הקצוות אין מאיפה לקבל ערך
          חיובי.
        misconception: MC-ivt-domain-irrelevant

  - id: Q-4.3-notcont
    type: twotier
    objectives: [OBJ-4.3-3]
    qualitative: true
    level: basic
    prompt: >-
      על $[-1,1]$: $f(x)=-1$ לכל $x<0$ ו-$f(x)=1$ לכל $x\ge 0$. מתקיים $f(-1)<0<f(1)$. האם יש $c$ עם $f(c)=0$?
    choices:
      - text: לא
        correct: true
        feedback: נכון. $f$ מקבלת רק את הערכים $-1$ ו-1.
      - text: כן, לפי משפט ערך הביניים
        feedback: >-
          המשפט דורש ש-$f$ תהיה רציפה בכל הקטע, ו-$f$ קופצת ב-0. בלי ההנחה הזו אין מסקנה, וכאן באמת אין שורש.
        misconception: MC-ivt-no-continuity-needed
    reasons:
      - text: '$f$ אינה רציפה ב-0, ולכן המשפט לא חל; ובפועל $f(x)\in\{-1,1\}$ לכל $x$'
        correct: true
        feedback: >-
          בדיוק. זו הדוגמה הבסיסית לכך שהרציפות הכרחית במשפט.
      - text: '$f(-1)<0<f(1)$, וזה כל מה שהמשפט דורש'
        feedback: >-
          המשפט דורש גם רציפות בכל $[-1,1]$. החלפת סימן בקצוות לבדה לא מספיקה.
        misconception: MC-ivt-no-continuity-needed
      - text: 'בנקודת הקפיצה $x=0$ הפונקציה "עוברת" דרך 0'
        feedback: >-
          $f(0)=1$, לא 0. פונקציה לא רציפה יכולה לדלג על ערכים: זו בדיוק המשמעות של קפיצה.
        misconception: MC-ivt-no-continuity-needed

  - id: Q-4.3-union
    type: mc
    objectives: [OBJ-4.3-3]
    qualitative: true
    level: basic
    prompt: >-
      $D=[0,1]\cup[2,3]$, ו-$f(x)=-1$ לכל $x\in[0,1]$, $f(x)=1$ לכל $x\in[2,3]$. $f$ רציפה בכל נקודה של $D$,
      $f(0)<0<f(3)$, ו-$f$ אינה מקבלת את הערך 0. איזו הנחה של משפט ערך הביניים אינה מתקיימת?
    choices:
      - text: התחום $D$ אינו קטע
        correct: true
        feedback: >-
          נכון. המשפט מדבר על פונקציה רציפה **על קטע**. ל-$D$ יש "חור" $(1,2)$, ושם אין נקודות שבהן $f$ יכולה
          לקבל את 0.
      - text: $f$ אינה רציפה
        feedback: >-
          $f$ רציפה בכל נקודה של התחום שלה: היא קבועה בסביבה של כל נקודה (בתוך $D$). הבעיה אינה ברציפות אלא
          בתחום.
        misconception: MC-cont-means-whole-line
      - text: 'התנאי $f(a)<0<f(b)$ אינו מתקיים'
        feedback: >-
          הוא מתקיים: $f(0)=-1<0<1=f(3)$.
      - text: כל ההנחות מתקיימות, ו-0 מתקבל באיזו נקודה ב-$(1,2)$
        feedback: >-
          הנקודות של $(1,2)$ אינן בתחום, ולכן $f$ לא מקבלת בהן ערך בכלל.
        misconception: MC-ivt-domain-irrelevant

  - id: Q-4.3-rationals
    type: twotier
    objectives: [OBJ-4.3-3]
    qualitative: true
    level: exam
    prompt: >-
      $f(x)=x^2-2$ מוגדרת רק על הרציונליים שבקטע $[1,2]$. היא רציפה בכל נקודה של התחום, ו-$f(1)<0<f(2)$. האם
      יש רציונלי $c\in[1,2]$ עם $f(c)=0$?
    choices:
      - text: לא
        correct: true
        feedback: נכון. השורש היחיד בקטע הוא $\sqrt2$, ואינו רציונלי.
      - text: כן, לפי משפט ערך הביניים
        feedback: >-
          התחום אינו קטע של ממשיים, ולכן המשפט לא חל. אילו היה $c$ רציונלי עם $c^2=2$, היה $\sqrt2$ רציונלי,
          בסתירה לשיעור 1.3.
        misconception: MC-ivt-domain-irrelevant
    reasons:
      - text: '$\sqrt2$ אינו רציונלי, וההוכחה של המשפט משתמשת בסופרמום, שלא תמיד קיים ברציונליים'
        correct: true
        feedback: >-
          בדיוק. הסופרמום של $\{x\in\mathbb{Q}\cap[1,2]: x^2<2\}$ הוא $\sqrt2$, שאינו בתחום. משפט ערך הביניים
          הוא ביטוי של אקסיומת השלמות.
      - text: $f$ היא פולינום, ופולינום רציף מקיים את המשפט בכל תחום
        feedback: >-
          המשפט תלוי בתחום, לא רק בנוסחה. אותו פולינום על הרציונליים מדלג על 0.
        misconception: MC-ivt-domain-irrelevant
      - text: $f$ אינה רציפה, כי ברציונליים יש "חורים"
        feedback: >-
          $f$ רציפה בכל נקודה של התחום: ההגדרה עם אפסילון ודלתא עובדת בדיוק כמו בממשיים, רק עם $x$ רציונליים.
          ה"חורים" פוגעים בתחום, לא ברציפות.
        misconception: MC-cont-means-whole-line

  - id: Q-4.3-ivp
    type: twotier
    objectives: [OBJ-4.3-3]
    qualitative: true
    level: exam
    prompt: >-
      ל-$f:\mathbb{R}\to\mathbb{R}$ יש "תכונת ערך הביניים": לכל $a<b$ ולכל $y$ שבין $f(a)$ ל-$f(b)$ יש $c$ בין
      $a$ ל-$b$ עם $f(c)=y$. האם $f$ בהכרח רציפה?
    choices:
      - text: לא
        correct: true
        feedback: נכון. המשפט הוא גרירה בכיוון אחד בלבד.
      - text: כן
        feedback: >-
          משפט ערך הביניים אומר שרציפות גוררת את התכונה, לא להפך. $f(x)=\sin\frac1x$ עם $f(0)=0$ מקיימת את
          התכונה ואינה רציפה ב-0.
        misconception: MC-ivt-property-implies-continuous
    reasons:
      - text: '$f(x)=\sin\frac1x$ לכל $x\ne0$ ו-$f(0)=0$: בכל קטע $(0,b)$ היא מקבלת כל ערך ב-$[-1,1]$, ולכן יש לה את התכונה, והיא אינה רציפה ב-0'
        correct: true
        feedback: >-
          בדיוק. בקטע שאינו מכיל את 0 היא רציפה, ובקטע שמכיל את 0 (או מתחיל בו) היא מקבלת את כל הערכים שבין
          $-1$ ל-1.
      - text: משפט ערך הביניים הוא "אם ורק אם"
        feedback: >-
          לא: הוא אומר "אם $f$ רציפה, אז יש לה את התכונה". ההפוכה של גרירה אינה שקולה לה (שיעור 0.2).
        misconception: MC-ivt-property-implies-continuous
      - text: לפונקציה עם התכונה אין קפיצות, ולכן היא רציפה
        feedback: >-
          נכון שאין לה קפיצות ואין לה אי-רציפות סליקה, אבל יכולה להיות לה אי-רציפות מסוג שני, כמו $\sin\frac1x$
          ב-0.
        misconception: MC-ivt-property-implies-continuous
