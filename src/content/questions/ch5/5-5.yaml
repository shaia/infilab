# Lesson 5.5 — Fermat's theorem and Rolle's theorem.
# Objectives (src/course.ts):
#   OBJ-5.5-1  prove Fermat's theorem: at an interior extremum of a differentiable function the derivative vanishes
#   OBJ-5.5-2  state and prove Rolle's theorem; use it to bound the number of roots of an equation
#   OBJ-5.5-3  show by examples that every hypothesis of Rolle's theorem is necessary
chapter: 5
questions:
  - id: Q-5.5-converse
    type: twotier
    objectives: [OBJ-5.5-1]
    qualitative: true
    level: basic
    prompt: >-
      טענה: אם $f$ גזירה ב-$x_0$ ו-$f'(x_0)=0$, אז $x_0$ היא נקודת קיצון מקומי של $f$. האם הטענה נכונה?
    choices:
      - text: הטענה לא נכונה
        correct: true
        feedback: >-
          נכון. משפט פרמה אומר "קיצון פנימי גורר נגזרת אפס", וזו הטענה ההפוכה לו. ההפוכה נכשלת.
      - text: הטענה נכונה
        feedback: >-
          $f(x)=x^3$ מקיימת $f'(0)=0$, ובכל זאת היא עולה ממש: משמאל ל-0 היא שלילית ומימין חיובית, ולכן 0 אינה
          נקודת קיצון.
        misconception: MC-critical-point-is-extremum
    reasons:
      - text: >-
          $x^3$ מקיימת $f'(0)=0$, אבל $x^3<0$ כש-$x<0$ ו-$x^3>0$ כש-$x>0$
        correct: true
        feedback: >-
          בדיוק. בכל סביבה של 0 יש ערכים גדולים מ-$f(0)$ וגם קטנים ממנו. נקודה שבה $f'=0$ היא רק **מועמדת**
          לקיצון.
      - text: זה בדיוק משפט פרמה
        feedback: >-
          פרמה הוא הכיוון ההפוך: אם יש קיצון פנימי והפונקציה גזירה שם, הנגזרת מתאפסת. גרירה אינה שקולה להפוכה
          שלה.
        misconception: MC-critical-point-is-extremum
      - text: כשהמשיק אופקי, הגרף מסתובב בנקודה, ולכן יש בה קיצון
        feedback: >-
          המשיק ל-$x^3$ ב-0 אופקי, והגרף חוצה אותו בלי להסתובב. משיק אופקי אינו מבטיח "פנייה".
        misconception: MC-critical-point-is-extremum

  - id: Q-5.5-endpoint
    type: mc
    objectives: [OBJ-5.5-1]
    qualitative: true
    level: mid
    prompt: >-
      $g(x)=x$ גזירה בכל הישר, והמקסימום שלה על הקטע $[0,1]$ מתקבל ב-$x=1$, אבל $g'(1)=1\neq0$. למה אין כאן
      סתירה למשפט פרמה?
    choices:
      - text: >-
          1 אינה נקודה פנימית של $[0,1]$: מימין לה אין נקודות של הקטע, ופרמה משתמש בנקודות משני הצדדים
        correct: true
        feedback: >-
          נכון. בהוכחה, מנת ההפרשים משמאל נותנת $g'(1)\ge0$, ובשביל $g'(1)\le0$ צריך נקודות של הקטע מימין ל-1,
          ואין כאלה. לכן בקטע סגור מועמדים לקיצון הם גם הקצוות.
      - text: >-
          יש כאן סתירה: בכל נקודת מקסימום של פונקציה גזירה הנגזרת מתאפסת
        feedback: >-
          זה נכון רק לנקודות **פנימיות**. בקצה של קטע הנגזרת יכולה להיות כל מספר, כמו כאן.
        misconception: MC-fermat-endpoint
      - text: >-
          המקסימום ב-1 הוא מקסימום מוחלט על הקטע ולא מקומי, ופרמה עוסק רק במקסימום מקומי
        feedback: >-
          מקסימום מוחלט בנקודה פנימית הוא גם מקומי, ושם פרמה כן חל. ההבדל כאן הוא שהנקודה היא קצה של הקטע: ביחס
          לכל הישר, 1 בכלל אינה מקסימום מקומי של $g$.
        misconception: MC-fermat-endpoint

  - id: Q-5.5-fermat-proof
    type: rank
    objectives: [OBJ-5.5-1]
    level: mid
    prompt: >-
      סדרו את שלבי ההוכחה של משפט פרמה: $x_0$ נקודת מקסימום מקומי פנימית של $f$, ו-$f$ גזירה ב-$x_0$; אז
      $f'(x_0)=0$.
    help: 'סדרו את שלבי ההוכחה לפי הסדר הנכון.'
    items:
      - id: a
        label: >-
          קיים $\delta>0$ כך ש-$f$ מוגדרת ב-$(x_0-\delta,x_0+\delta)$ ו-$f(x)\le f(x_0)$ לכל $x$ שם.
      - id: b
        label: >-
          כש-$h\in(0,\delta)$: $\frac{f(x_0+h)-f(x_0)}{h}\le0$, ולכן, כי גבולות שומרים על אי-שוויון חלש,
          $f'(x_0)=f'_+(x_0)\le0$.
      - id: c
        label: >-
          כש-$h\in(-\delta,0)$: המונה $\le0$ והמכנה שלילי, ולכן המנה $\ge0$ ו-$f'(x_0)=f'_-(x_0)\ge0$.
      - id: d
        label: >-
          לכן $f'(x_0)=0$.
    order: [a, b, c, d]
    correctFeedback: >-
      נכון. שני הצדדים נחוצים, ולכן הנקודה חייבת להיות פנימית. ושימו לב: אי-שוויון חזק לא נשמר בגבול, ולכן
      מקבלים $\le0$ ו-$\ge0$, לא $<0$ ו-$>0$.
    wrongFeedback: >-
      מתחילים מהסביבה שבה $f(x_0)$ גדול ביותר, בודקים את הסימן של מנת ההפרשים מכל צד בנפרד, ורק אז משווים את
      שני הגבולות.

  - id: Q-5.5-min
    type: multi
    objectives: [OBJ-5.5-1]
    qualitative: true
    level: mid
    prompt: >-
      $x_0$ היא נקודת מינימום מקומי של פונקציה $f$ המוגדרת על כל הישר. אילו מהטענות הבאות נובעות מזה בהכרח?
      סמנו את כולן.
    choices:
      - text: >-
          אם $f$ גזירה ב-$x_0$, אז $f'(x_0)=0$
        correct: true
        feedback: >-
          נכון, זה משפט פרמה: כל נקודה של הישר פנימית.
      - text: >-
          אם $f$ גזירה ב-$x_0$, המשיק לגרף ב-$x_0$ אופקי
        correct: true
        feedback: >-
          נכון: זה אותו דבר, כי שיפוע המשיק הוא $f'(x_0)=0$.
      - text: >-
          $f'(x_0)=0$
        feedback: >-
          לא בהכרח: $|x|$ מקבלת מינימום ב-0, ואין לה שם נגזרת בכלל. פרמה דורש שהפונקציה **גזירה** בנקודה.
        misconception: MC-extremum-only-where-derivative-zero
      - text: >-
          אם $f$ גזירה פעמיים ב-$x_0$, אז $f''(x_0)>0$
        feedback: >-
          לא: $x^4$ מקבלת מינימום ב-0, ו-$f''(0)=0$.
        misconception: MC-second-test-zero-no-extremum

  - id: Q-5.5-rolle-statement
    type: mc
    objectives: [OBJ-5.5-2]
    qualitative: true
    level: basic
    prompt: >-
      איזה מהניסוחים הבאים הוא משפט רול?
    choices:
      - text: >-
          אם $f$ רציפה ב-$[a,b]$, גזירה ב-$(a,b)$ ו-$f(a)=f(b)$, אז קיימת $c\in(a,b)$ עם $f'(c)=0$
        correct: true
        feedback: >-
          נכון. רציפות בקטע הסגור, גזירות בקטע הפתוח, ערכים שווים בקצוות: שלוש הנחות, ולכל אחת יש דוגמה שמראה
          שהיא נחוצה.
      - text: >-
          אם $f$ גזירה ב-$(a,b)$ ו-$f(a)=f(b)$, אז קיימת $c\in(a,b)$ עם $f'(c)=0$
        feedback: >-
          חסרה רציפות בקצוות. $f(x)=x$ ב-$[0,1)$ עם $f(1)=0$ גזירה ב-$(0,1)$, $f(0)=f(1)$, ו-$f'=1$ בכל נקודה
          פנימית.
        misconception: MC-rolle-open-continuity
      - text: >-
          אם $f$ רציפה ב-$[a,b]$, גזירה ב-$(a,b)$ ו-$f(a)=f(b)$, אז קיימת $c$ **יחידה** ב-$(a,b)$ עם $f'(c)=0$
        feedback: >-
          המשפט מבטיח קיום, לא יחידות: $\sin$ על $[0,4\pi]$ מקיימת את ההנחות, והנגזרת מתאפסת בארבע נקודות.
        misconception: MC-rolle-unique-c

  - id: Q-5.5-one-root
    type: twotier
    objectives: [OBJ-5.5-2]
    qualitative: true
    level: mid
    prompt: >-
      כמה שורשים ממשיים יש למשוואה $x^5+x-1=0$?
    choices:
      - text: בדיוק שורש אחד
        correct: true
        feedback: >-
          נכון. קיום ויחידות הם שתי טענות נפרדות, וכל אחת צריכה כלי משלה.
      - text: חמישה
        feedback: >-
          לפולינום ממעלה 5 יש **לכל היותר** חמישה שורשים ממשיים. כאן יש רק אחד: אילו היו שניים, הנגזרת
          $5x^4+1$ הייתה מתאפסת ביניהם, והיא תמיד חיובית.
        misconception: MC-poly-exactly-n-roots
    reasons:
      - text: >-
          $f(0)<0<f(1)$ נותן שורש לפי ערך הביניים; ואם היו שני שורשים $a<b$, לפי רול היה $c$ עם $5c^4+1=0$
        correct: true
        feedback: >-
          בדיוק: ערך הביניים לקיום, רול ליחידות. הנגזרת $5x^4+1\ge1$ אינה מתאפסת אף פעם.
      - text: $f(0)<0<f(1)$, ולכן לפי משפט ערך הביניים יש בדיוק שורש אחד
        feedback: >-
          ערך הביניים נותן **קיום** בלבד. $x^3-x$ מחליפה סימן בין מינוס 2 ל-2 ויש לה שלושה שורשים. ליחידות צריך
          את רול.
        misconception: MC-ivt-unique-root
      - text: לפולינום ממעלה אי-זוגית יש שורש ממשי אחד
        feedback: >-
          לפולינום ממעלה אי-זוגית יש **לפחות** שורש ממשי אחד. $x^3-x$ ממעלה 3 ויש לה שלושה.
        misconception: MC-ivt-unique-root

  - id: Q-5.5-count
    type: numeric
    objectives: [OBJ-5.5-2]
    level: exam
    prompt: >-
      כמה שורשים ממשיים יש למשוואה $x^4-4x+1=0$?
    answer: 2
    tolerance: 0.001
    correctFeedback: >-
      נכון. $f'(x)=4x^3-4$ מתאפסת רק ב-$x=1$. אילו היו ל-$f$ שלושה שורשים, לפי רול היו ל-$f'$ שני שורשים
      שונים (אחד בין כל שני שורשים סמוכים), ולכן ל-$f$ יש לכל היותר שניים. מצד שני $f(0)=1>0$, $f(1)=-2<0$
      ו-$f(2)=9>0$, ולפי ערך הביניים יש שורש ב-$(0,1)$ ושורש ב-$(1,2)$.
    wrongFeedback: >-
      חסמו מלמעלה בעזרת רול: כמה שורשים יש ל-$f'$? וחסמו מלמטה בעזרת ערך הביניים: חפשו החלפות סימן.
    commonWrong:
      - value: 4
        feedback: >-
          ארבעה הוא החסם שהמעלה נותנת, לא המספר. רול נותן חסם טוב יותר: ל-$f'$ שורש אחד, ולכן ל-$f$ לכל היותר
          שניים.
        misconception: MC-poly-exactly-n-roots
      - value: 1
        feedback: >-
          יש שתי החלפות סימן: בין 0 ל-1 ובין 1 ל-2. בדקו את $f(2)=16-8+1$.
    hints:
      - 'כמה פעמים מתאפסת $f''(x)=4x^3-4$? ומה זה אומר, לפי רול, על מספר השורשים של $f$?'

  - id: Q-5.5-deriv-roots
    type: multi
    objectives: [OBJ-5.5-2]
    qualitative: true
    level: mid
    prompt: >-
      $f$ גזירה פעמיים בכל הישר, ו-$f(1)=f(2)=f(3)=0$. אילו מהטענות הבאות נכונות בהכרח? סמנו את כולן.
    choices:
      - text: >-
          ל-$f'$ יש שורש ב-$(1,2)$ ושורש נוסף ב-$(2,3)$
        correct: true
        feedback: >-
          נכון: רול על $[1,2]$ ועל $[2,3]$. שני השורשים שונים כי הקטעים הפתוחים זרים.
      - text: >-
          ל-$f''$ יש שורש ב-$(1,3)$
        correct: true
        feedback: >-
          נכון: אם $f'(c_1)=f'(c_2)=0$ עם $1<c_1<2<c_2<3$, רול על $f'$ בקטע $[c_1,c_2]$ נותן שורש של $f''$.
      - text: >-
          ל-$f'$ יש בדיוק שני שורשים ב-$(1,3)$
        feedback: >-
          רול נותן **לפחות** שניים. עבור $f(x)=(x-1)(x-2)^2(x-3)$ הנגזרת מתאפסת גם ב-2 עצמו, ובסך הכול שלוש
          פעמים ב-$(1,3)$.
        misconception: MC-rolle-unique-c
      - text: >-
          $f'(1.5)=0$
        feedback: >-
          רול אומר שיש שורש, לא איפה. עבור $f(x)=(x-1)(x-2)(x-3)$, $f'(x)=3x^2-12x+11$ ו-$f'(1.5)=-0.25$: השורשים
          הם $2\pm\frac{1}{\sqrt3}$.
        misconception: MC-rolle-c-location

  - id: Q-5.5-injective
    type: twotier
    objectives: [OBJ-5.5-2]
    qualitative: true
    level: exam
    prompt: >-
      טענה: אם $f$ גזירה בכל הישר ו-$f'(x)\neq0$ לכל $x$, אז $f$ חד-חד-ערכית. האם הטענה נכונה?
    choices:
      - text: הטענה נכונה
        correct: true
        feedback: >-
          נכון. זו בדיוק הקונטרפוזיטיב של רול: ערכים שווים בשתי נקודות מכריחים נגזרת אפס ביניהן.
      - text: >-
          הטענה לא נכונה: $f'$ יכולה להיות חיובית בחלק מהישר ושלילית בחלק אחר, ואז $f$ עולה ויורדת
        feedback: >-
          בלי לעבור באפס $f'$ לא יכולה להחליף סימן (משפט דרבו, שיעור 5.7). אבל אין צורך בזה כאן: רול מוכיח את
          הטענה ישירות.
        misconception: MC-derivative-jump-possible
    reasons:
      - text: >-
          אם $f(a)=f(b)$ עם $a<b$, אז $f$ רציפה ב-$[a,b]$ וגזירה ב-$(a,b)$, ורול נותן $c$ עם $f'(c)=0$, בסתירה
        correct: true
        feedback: >-
          בדיוק. הוכחה בדרך השלילה. שימו לב שהרציפות בקטע הסגור באה מהגזירות.
      - text: >-
          $f'\neq0$ בכל נקודה, ולכן $f'$ חיובית בכל מקום או שלילית בכל מקום, ו-$f$ מונוטונית ממש
        feedback: >-
          המעבר מ-"$f'\neq0$" ל"סימן קבוע" דורש ערך ביניים ל-$f'$, ו-$f'$ אינה בהכרח רציפה. זה נכון (דרבו),
          אבל לא נובע מכלום שהוכח עד כאן, ומונוטוניות מסימן הנגזרת היא נושא של שיעור 5.7.
        misconception: MC-derivative-always-continuous
      - text: >-
          $x^3$ חד-חד-ערכית ו-$f'(0)=0$, ולכן הטענה לא יכולה להיות נכונה
        feedback: >-
          $x^3$ מראה שהטענה ההפוכה נכשלת (חד-חד-ערכית אינה גוררת $f'\neq0$). על הטענה עצמה היא לא אומרת דבר.
        misconception: MC-rolle-converse-injective

  - id: Q-5.5-abs
    type: twotier
    objectives: [OBJ-5.5-3]
    qualitative: true
    level: basic
    prompt: >-
      $f(x)=|x|$ רציפה ב-$[-1,1]$ ו-$f(-1)=f(1)$. האם קיימת $c\in(-1,1)$ עם $f'(c)=0$?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. עבור $x>0$, $f'(x)=1$; עבור $x<0$, $f'(x)=-1$; וב-0 אין נגזרת. רול לא חל, ומסקנתו באמת נכשלת.
      - text: כן, $c=0$
        feedback: >-
          ב-0 יש ל-$|x|$ מינימום, אבל אין לה שם נגזרת, ולכן אין $c$ שבו הנגזרת מתאפסת. פרמה ורול דורשים גזירות.
        misconception: MC-extremum-only-where-derivative-zero
    reasons:
      - text: הפונקציה אינה גזירה ב-0, ובשאר הנקודות הנגזרת היא 1 או מינוס 1
        correct: true
        feedback: >-
          בדיוק. ההנחה שנכשלת היא גזירות **בכל** נקודה של הקטע הפתוח. נקודה אחת בלי נגזרת מספיקה.
      - text: >-
          $|x|$ אינה רציפה ב-0, כי יש לגרף פינה
        feedback: >-
          פינה היא אי-גזירות, לא אי-רציפות: $|x|$ רציפה בכל הישר. רציפות אינה גוררת גזירות, ולכן אי-גזירות אינה
          גוררת אי-רציפות.
        misconception: MC-continuous-implies-differentiable
      - text: >-
          ב-0 יש מינימום, ולכן לפי פרמה $f'(0)=0$
        feedback: >-
          פרמה חל רק כשהפונקציה גזירה בנקודת הקיצון. $|x|$ אינה גזירה ב-0.
        misconception: MC-extremum-only-where-derivative-zero

  - id: Q-5.5-jump
    type: mc
    objectives: [OBJ-5.5-3]
    qualitative: true
    level: mid
    prompt: >-
      תהי $f(x)=x$ כש-$0\le x<1$, ו-$f(1)=0$. אז $f(0)=f(1)=0$ ו-$f'(x)=1$ לכל $x\in(0,1)$. איזו הנחה של
      משפט רול נכשלת?
    choices:
      - text: >-
          רציפות בקטע הסגור $[0,1]$: $f$ אינה רציפה ב-1
        correct: true
        feedback: >-
          נכון. $\lim_{x\to1^-}f(x)=1\neq0=f(1)$. הקפיצה בקצה מאפשרת לפונקציה "לחזור" לערך ההתחלתי בלי לעצור.
      - text: >-
          אף הנחה לא נכשלת: $f$ גזירה ב-$(0,1)$ ו-$f(0)=f(1)$, ולכן רול לא נכון כאן
        feedback: >-
          משפט רול דורש רציפות בקטע **הסגור**, כולל הקצוות. כאן $f$ אינה רציפה ב-1, ולכן המשפט לא חל, ואין
          סתירה.
        misconception: MC-rolle-open-continuity
      - text: גזירות בקטע הפתוח $(0,1)$, כי ליד 1 הפונקציה קופצת
        feedback: >-
          בקטע הפתוח $f(x)=x$, גזירה בכל נקודה. הקפיצה נמצאת בנקודה 1 עצמה, שאינה בקטע הפתוח, ולכן מה שנכשל הוא
          הרציפות בקטע הסגור.
        misconception: MC-rolle-open-continuity

  - id: Q-5.5-which
    type: multi
    objectives: [OBJ-5.5-3]
    qualitative: true
    level: mid
    prompt: >-
      אילו מהפונקציות הבאות מקיימות את **כל** ההנחות של משפט רול בקטע הנתון? סמנו את כולן.
    choices:
      - text: '$\sin x$ בקטע $[0,\pi]$'
        correct: true
        feedback: >-
          נכון: רציפה וגזירה, ו-$\sin0=\sin\pi=0$. הנקודה המובטחת היא $c=\frac\pi2$.
      - text: '$x^3-x$ בקטע $[-1,1]$'
        correct: true
        feedback: >-
          נכון: פולינום, וערכו 0 בשני הקצוות. הנגזרת $3x^2-1$ מתאפסת ב-$\pm\frac{1}{\sqrt3}$, שתי נקודות.
      - text: '$\sqrt[3]{x^2}$ בקטע $[-1,1]$'
        feedback: >-
          רציפה, וערכה 1 בשני הקצוות, אבל אינה גזירה ב-0: מנת ההפרשים היא $\frac{\sqrt[3]{h^2}}{h}$, שגודלה
          $|h|^{-1/3}\to\infty$. ובאמת $f'(x)=\frac{2}{3\sqrt[3]{x}}$ אינה מתאפסת באף נקודה.
        misconception: MC-continuous-implies-differentiable
      - text: '$\frac{1}{x^2}$ בקטע $[-1,1]$'
        feedback: >-
          הערכים בקצוות שווים, אבל הפונקציה אינה מוגדרת ב-0, ולכן בוודאי אינה רציפה ב-$[-1,1]$. גם כאן הנגזרת
          $\frac{-2}{x^3}$ אינה מתאפסת אף פעם.
        misconception: MC-rolle-open-continuity
      - text: '$x^2$ בקטע $[-1,2]$'
        feedback: >-
          $f(-1)=1\neq4=f(2)$, ולכן ההנחה של ערכים שווים נכשלת. העובדה ש-$f'(0)=0$ לא משנה את זה: המסקנה של
          משפט יכולה להתקיים גם כשההנחות שלו לא מתקיימות.
        misconception: MC-conclusion-implies-hypotheses
