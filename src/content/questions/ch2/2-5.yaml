# Lesson 2.5 — limits and inequalities.
# Objectives (src/course.ts):
#   OBJ-2.5-1  prove and use the squeeze theorem
#   OBJ-2.5-2  limits keep weak inequalities; an example where a strict one is lost
#   OBJ-2.5-3  a null sequence times a bounded sequence tends to 0, and its uses
# sin and cos are used only through |sin x| ≤ 1, |cos x| ≤ 1 (their rigorous treatment is lesson 3.2).
chapter: 2
questions:
  - id: Q-2.5-squeeze-hyp
    type: twotier
    objectives: [OBJ-2.5-1]
    qualitative: true
    level: basic
    prompt: >-
      לכל $n$ מתקיים $a_n\le b_n\le c_n$, וידוע ש-$a_n\to0$ ו-$c_n\to1$. האם $b_n$ חייבת להתכנס?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. $a_n = 0$, $c_n = 1$ ו-$b_n = \frac{1+(-1)^n}{2}$, שמתחלפת בין 0 ל-1: היא כלואה ביניהן ומתבדרת.
      - text: כן
        feedback: >-
          כלל הסנדוויץ' דורש ששתי הסדרות החוסמות ישאפו **לאותו** גבול. כאן $b_n = \frac{1+(-1)^n}{2}$ כלואה בין 0
          ל-1 ומתבדרת.
        misconception: MC-squeeze-unequal-limits
    reasons:
      - text: 'הסנדוויץ'' דורש גבולות שווים; עם גבולות שונים יש בין החסמים מקום לתנודה'
        correct: true
        feedback: >-
          בדיוק. מה שכן אפשר להסיק כאן הוא ש-$b_n$ חסומה. התכנסות לא נובעת.
      - text: '$b_n$ כלואה, ולכן מתכנסת למספר כלשהו בין 0 ל-1'
        feedback: >-
          "כלואה" נותן חסימות בלבד. כדי לכפות גבול, החסמים צריכים להיסגר על אותה נקודה.
        misconception: MC-squeeze-unequal-limits
      - text: '$b_n$ חסומה, וכל סדרה חסומה מתכנסת'
        feedback: >-
          $b_n$ אכן חסומה, אבל סדרה חסומה אינה בהכרח מתכנסת: $(-1)^n$ (שיעור 2.3).
        misconception: MC-bounded-implies-convergent

  - id: Q-2.5-floor
    type: mc
    objectives: [OBJ-2.5-1]
    qualitative: true
    level: mid
    prompt: >-
      $a_n = \frac{\lfloor n\sqrt2\rfloor}{n}$. איזה זוג אי-שוויונות, יחד עם כלל הסנדוויץ', מוכיח ש-$a_n\to\sqrt2$?
    choices:
      - text: '$\sqrt2-\frac1n<a_n\le\sqrt2$, כי $x-1<\lfloor x\rfloor\le x$'
        correct: true
        feedback: >-
          נכון. שני החסמים שואפים ל-$\sqrt2$: הימני קבוע, והשמאלי לפי חשבון הגבולות. לכן $a_n\to\sqrt2$.
      - text: '$0\le a_n\le2$'
        feedback: >-
          שני האי-שוויונות נכונים, אבל החסמים שואפים ל-0 ול-2, לא לאותו גבול. מזה נובעת רק חסימות.
        misconception: MC-squeeze-unequal-limits
      - text: '$a_n\le\sqrt2$, והחסם הזה הוא בדיוק הגבול'
        feedback: >-
          חסם מצד אחד לא מספיק: גם $\frac1n\le\sqrt2$, ו-$\frac1n\to0$. הסנדוויץ' צריך חסם מלמטה וחסם מלמעלה עם
          אותו גבול.
        misconception: MC-squeeze-one-side
      - text: '$a_n\approx\sqrt2$, כי הערך השלם משנה את $n\sqrt2$ בפחות מ-1'
        feedback: >-
          זה הרעיון הנכון אבל לא הוכחה: "בערך" צריך להפוך לשני אי-שוויונות מדויקים, ואז לסנדוויץ'.
        misconception: MC-estimate-by-approximation

  - id: Q-2.5-squeeze-rank
    type: rank
    objectives: [OBJ-2.5-1]
    level: mid
    prompt: >-
      הוכחת כלל הסנדוויץ': אם $a_n\le b_n\le c_n$ לכל $n$, ו-$a_n\to L$, $c_n\to L$, אז $b_n\to L$.
    help: 'סדרו את שלבי ההוכחה לפי הסדר הנכון.'
    items:
      - id: eps
        label: 'יהי $\varepsilon>0$.'
      - id: twoN
        label: 'יש $N_1$ כך ש-$a_n>L-\varepsilon$ לכל $n>N_1$, ו-$N_2$ כך ש-$c_n<L+\varepsilon$ לכל $n>N_2$.'
      - id: n
        label: 'יהי $n>\max(N_1,N_2)$.'
      - id: chain
        label: '$L-\varepsilon<a_n\le b_n\le c_n<L+\varepsilon$.'
      - id: conclude
        label: 'לכן $|b_n-L|<\varepsilon$ לכל $n>\max(N_1,N_2)$, כלומר $b_n\to L$.'
    order: [eps, twoN, n, chain, conclude]
    correctFeedback: >-
      נכון. מכל חסם צריך רק חצי מההגדרה: מ-$a_n$ את הצד התחתון של הסביבה, ומ-$c_n$ את הצד העליון.
    wrongFeedback: >-
      קודם $\varepsilon$, אחריו ה-$N$-ים שתלויים בו, אחריהם $n$, ורק אז השרשרת שמכניסה את $b_n$ לסביבה.

  - id: Q-2.5-sum
    type: numeric
    objectives: [OBJ-2.5-1]
    level: exam
    prompt: >-
      חשבו את הגבול של
      $$S_n = \frac{n}{n^2+1}+\frac{n}{n^2+2}+\dots+\frac{n}{n^2+n} = \sum_{k=1}^{n}\frac{n}{n^2+k}.$$
    answer: 1
    tolerance: 0.001
    correctFeedback: >-
      נכון. בסכום יש $n$ מחוברים. הקטן ביותר הוא $\frac{n}{n^2+n}$ והגדול ביותר $\frac{n}{n^2+1}$, ולכן
      $$\frac{n^2}{n^2+n}\le S_n\le\frac{n^2}{n^2+1}.$$
      שני החסמים שואפים ל-1, ולפי הסנדוויץ' $S_n\to1$.
    wrongFeedback: >-
      מספר המחוברים גדל עם $n$, ולכן אי אפשר להפעיל את כלל הסכום. חסמו כל מחובר בקטן ביותר ובגדול ביותר
      מביניהם, וכפלו במספר המחוברים.
    commonWrong:
      - value: 0
        feedback: >-
          כל מחובר אכן שואף ל-0, אבל מספר המחוברים גדל עם $n$. כלל הסכום מדבר על מספר **קבוע** של סדרות, ו-$n$
          מחוברים שכל אחד בערך $\frac1n$ נותנים בערך 1.
        misconception: MC-sum-of-null-terms
    hints:
      - כמה מחוברים יש ב-$S_n$? מה המחובר הקטן ביותר ומה הגדול ביותר?

  - id: Q-2.5-strict
    type: twotier
    objectives: [OBJ-2.5-2]
    qualitative: true
    level: basic
    prompt: >-
      $a_n>0$ לכל $n$ ו-$a_n\to L$. האם בהכרח $L>0$?
    choices:
      - text: לא
        correct: true
        feedback: 'נכון. $a_n = \frac1n>0$ לכל $n$, והגבול הוא 0.'
      - text: כן
        feedback: >-
          $\frac1n$ חיובית לכל $n$ ושואפת ל-0. גבול שומר על אי-שוויון חלש בלבד: מובטח רק $L\ge0$.
        misconception: MC-limit-keeps-strict
    reasons:
      - text: 'גבולות שומרים על אי-שוויון חלש: נובע $L\ge0$, ו-$\frac1n$ מראה ש-$L = 0$ אפשרי'
        correct: true
        feedback: >-
          בדיוק. ההוכחה של $L\ge0$ היא בשלילה: אם $L<0$, עם $\varepsilon = |L|$ האיברים היו שליליים מ-$N$ והלאה.
      - text: 'אם כל האיברים גדולים מ-0, גם הגבול גדול מ-0'
        feedback: >-
          האיברים יכולים להתקרב ל-0 כרצוננו בלי להגיע אליו, והגבול הוא בדיוק המספר שאליו הם מתקרבים.
        misconception: MC-limit-keeps-strict
      - text: 'אם $L = 0$, אז מ-$N$ והלאה האיברים היו שווים ל-0'
        feedback: >-
          גבול 0 פירושו שהאיברים **קרובים** ל-0 מ-$N$ והלאה, לא שווים לו. $\frac1n\ne0$ לכל $n$.
        misconception: MC-limit-keeps-strict

  - id: Q-2.5-interval
    type: mc
    objectives: [OBJ-2.5-2]
    qualitative: true
    level: mid
    prompt: >-
      $0<a_n<1$ לכל $n$, ו-$a_n\to L$. מהי קבוצת כל הערכים האפשריים של $L$?
    choices:
      - text: '$[0,1]$'
        correct: true
        feedback: >-
          נכון. משמירה על אי-שוויון חלש $0\le L\le1$, וכל ערך מתקבל: $\frac{1}{n+1}\to0$,
          $1-\frac{1}{n+1}\to1$, והקבועה $c$ לכל $0<c<1$.
      - text: '$(0,1)$'
        feedback: >-
          אי-שוויון חזק לא נשמר בגבול: $\frac{1}{n+1}$ נמצאת ב-$(0,1)$ ושואפת ל-0, ו-$1-\frac{1}{n+1}$ שואפת ל-1.
        misconception: MC-limit-keeps-strict
      - text: '$[0,1)$'
        feedback: >-
          גם 1 אפשרי: $1-\frac{1}{n+1}$ נמצאת ב-$(0,1)$ ושואפת ל-1. אי-שוויון חזק לא נשמר, משני הצדדים.
        misconception: MC-limit-keeps-strict
      - text: '$(0,1]$'
        feedback: >-
          גם 0 אפשרי: $\frac{1}{n+1}$ נמצאת ב-$(0,1)$ ושואפת ל-0. אי-שוויון חזק לא נשמר, משני הצדדים.
        misconception: MC-limit-keeps-strict

  - id: Q-2.5-eps-proof
    type: multi
    objectives: [OBJ-2.5-2]
    qualitative: true
    level: mid
    prompt: >-
      מוכיחים: אם $a_n\ge0$ לכל $n$ ו-$a_n\to L$, אז $L\ge0$. מניחים בשלילה ש-$L<0$, ובוחרים $\varepsilon$ כך שמ-$N$
      והלאה $a_n<L+\varepsilon\le0$, בסתירה ל-$a_n\ge0$. אילו בחירות עובדות **לכל** $L<0$? סמנו את כולן.
    choices:
      - text: '$\varepsilon = |L|$'
        correct: true
        feedback: 'נכון. $L+|L| = 0$, ולכן $a_n<0$ מ-$N$ והלאה: סתירה.'
      - text: '$\varepsilon = \frac{|L|}{2}$'
        correct: true
        feedback: 'נכון. $L+\frac{|L|}{2} = \frac L2<0$, ולכן $a_n<\frac L2<0$: סתירה.'
      - text: '$\varepsilon = 2|L|$'
        feedback: >-
          $L+2|L| = |L|>0$, ולכן מקבלים רק $a_n<|L|$, שאינו סותר את $a_n\ge0$. הסביבה רחבה מדי ומגיעה אל מעבר ל-0.
        misconception: MC-epsilon-too-wide
      - text: '$\varepsilon = 1$'
        feedback: >-
          זה עובד רק כש-$L\le-1$. עבור $L = -\frac12$ מקבלים $a_n<\frac12$, ואין סתירה. $\varepsilon$ צריך להיות
          תלוי ב-$L$.
        misconception: MC-epsilon-too-wide

  - id: Q-2.5-order
    type: multi
    objectives: [OBJ-2.5-2]
    qualitative: true
    level: exam
    prompt: >-
      $a_n\to a$ ו-$b_n\to b$. אילו מהטענות הבאות נכונות תמיד? סמנו את כולן.
    choices:
      - text: 'אם $a_n\le b_n$ לכל $n\ge100$, אז $a\le b$'
        correct: true
        feedback: >-
          נכון. זה משפט השמירה על אי-שוויון חלש, ומספיק שהאי-שוויון יתקיים מנקודה מסוימת: הגבול תלוי רק בזנב.
      - text: 'אם $a_n<b_n$ לכל $n$, אז $a<b$'
        feedback: >-
          $a_n = 0$ ו-$b_n = \frac1n$: $a_n<b_n$ לכל $n$, ושני הגבולות 0. מובטח רק $a\le b$.
        misconception: MC-limit-keeps-strict
      - text: 'אם $a<b$, אז $a_n<b_n$ מ-$N$ מסוים והלאה'
        correct: true
        feedback: >-
          נכון. עם $\varepsilon = \frac{b-a}{2}$, מ-$N$ מסוים $a_n<a+\varepsilon = \frac{a+b}{2} = b-\varepsilon<b_n$.
          כאן דווקא אי-שוויון חזק בין הגבולות עובר לאיברים.
      - text: 'אם $a\le b$, אז $a_n\le b_n$ מ-$N$ מסוים והלאה'
        feedback: >-
          $a_n = \frac1n$ ו-$b_n = 0$: הגבולות שווים, $0\le0$, אבל $a_n>b_n$ לכל $n$. כשהגבולות שווים, אין מה
          לומר על הסדר בין האיברים.
        misconception: MC-order-converse-weak

  - id: Q-2.5-sin
    type: twotier
    objectives: [OBJ-2.5-3]
    qualitative: true
    level: basic
    prompt: >-
      מה הגבול של $\frac{\sin n}{n}$?
    choices:
      - text: '0'
        correct: true
        feedback: 'נכון. $\frac{\sin n}{n} = \frac1n\cdot\sin n$, ו-$|\sin n|\le1$.'
      - text: 'אין גבול, כי ל-$\sin n$ אין גבול'
        feedback: >-
          כלל המכפלה לא חל, אבל זה לא אומר שאין גבול. גורם חסום כפול גורם ששואף ל-0 שואף ל-0:
          $\left|\frac{\sin n}{n}\right|\le\frac1n$.
        misconception: MC-bounded-factor-blocks-limit
    reasons:
      - text: '$\frac1n\to0$ ו-$\sin n$ חסומה (בערכה המוחלט לכל היותר 1), ומכפלה של סדרה ששואפת לאפס בסדרה חסומה שואפת לאפס'
        correct: true
        feedback: >-
          בדיוק. אין צורך לדעת אם ל-$\sin n$ יש גבול: מספיק שהיא חסומה.
      - text: 'לפי כלל המכפלה: $\lim\frac1n\cdot\lim\sin n = 0\cdot\lim\sin n = 0$'
        feedback: >-
          כלל המכפלה דורש ששני הגבולות יהיו קיימים, ו-$\lim\sin n$ אינו קיים. התשובה נכונה, אבל מסיבה אחרת:
          החסימות של $\sin n$.
        misconception: MC-limit-rules-on-divergent
      - text: '$\frac1n\to0$, וגורם ששואף לאפס מאפס כל מכפלה'
        feedback: >-
          לא כל מכפלה: $\frac1n\cdot n^2 = n$. כאן זה עובד רק כי $\sin n$ **חסומה**.
        misconception: MC-null-times-anything

  - id: Q-2.5-null-rank
    type: rank
    objectives: [OBJ-2.5-3]
    level: mid
    prompt: >-
      הוכחה שאם $a_n\to0$ ו-$b_n$ חסומה, אז $a_nb_n\to0$.
    help: 'סדרו את שלבי ההוכחה לפי הסדר הנכון.'
    items:
      - id: setup
        label: 'יהי $M>0$ כך ש-$|b_n|\le M$ לכל $n$, ויהי $\varepsilon>0$.'
      - id: chooseN
        label: 'כי $a_n\to0$, יש $N$ כך ש-$|a_n|<\frac{\varepsilon}{M}$ לכל $n>N$.'
      - id: n
        label: 'יהי $n>N$.'
      - id: estimate
        label: '$|a_nb_n-0| = |a_n|\,|b_n|\le M|a_n|<M\cdot\frac{\varepsilon}{M} = \varepsilon$.'
      - id: conclude
        label: 'לכן $a_nb_n\to0$.'
    order: [setup, chooseN, n, estimate, conclude]
    correctFeedback: >-
      נכון. החסם $M$ קבוע ולא תלוי ב-$n$, ולכן אפשר לבקש מ-$a_n$ מראש להיות קטנה מ-$\frac{\varepsilon}{M}$.
    wrongFeedback: >-
      את $N$ בוחרים לפי $\frac\varepsilon M$, ולכן $M$ ו-$\varepsilon$ צריכים להיות ידועים לפני כן.

  - id: Q-2.5-conditions
    type: multi
    objectives: [OBJ-2.5-3]
    qualitative: true
    level: mid
    prompt: >-
      ידוע ש-$a_n\to0$. אילו מהתנאים הבאים על $b_n$ **מבטיחים** ש-$a_nb_n\to0$? סמנו את כולם.
    choices:
      - text: '$b_n$ חסומה'
        correct: true
        feedback: נכון. זה המשפט על אפס כפול חסומה.
      - text: '$b_n$ מתכנסת'
        correct: true
        feedback: 'נכון. כל סדרה מתכנסת חסומה (שיעור 2.3). אפשר גם לפי כלל המכפלה: $0\cdot b = 0$.'
      - text: '$|b_n|\le100$ לכל $n\ge1000$'
        correct: true
        feedback: >-
          נכון. אז $b_n$ חסומה: חסם לכל האיברים הוא המקסימום של 100 ושל $|b_1|,\dots,|b_{999}|$.
      - text: '$b_n>0$ לכל $n$'
        feedback: >-
          חיוביות אינה חסימות. $a_n = \frac1n$ ו-$b_n = n^2$: המכפלה היא $n$.
        misconception: MC-null-times-anything
      - text: '$b_n$ עולה'
        feedback: >-
          $b_n = n$ עולה, ועם $a_n = \frac1n$ המכפלה היא 1 לכל $n$, ולא שואפת ל-0.
        misconception: MC-null-times-anything

  - id: Q-2.5-cos
    type: numeric
    objectives: [OBJ-2.5-3]
    level: mid
    prompt: >-
      חשבו את $\displaystyle\lim_{n\to\infty}\frac{5n^3+n^2\cos n}{2n^3+7}$. (אפשר לכתוב שבר.)
    answer: 2.5
    tolerance: 0.001
    correctFeedback: >-
      נכון. מחלקים ב-$n^3$: $\frac{5+\frac{\cos n}{n}}{2+\frac{7}{n^3}}$. $\frac{\cos n}{n}\to0$ כי זו סדרה ששואפת
      לאפס כפול סדרה חסומה, ולכן המונה שואף ל-5, המכנה ל-2, והגבול $\frac52$.
    wrongFeedback: >-
      חלקו ב-$n^3$, וטפלו ב-$\frac{\cos n}{n}$ בעזרת המשפט על אפס כפול חסומה.
    commonWrong:
      - value: 3
        feedback: >-
          $3 = \frac{5+1}{2}$: החלפתם את $\cos n$ ב-1. אבל $\cos n$ מוכפל ב-$n^2$, שקטן ביחס ל-$n^3$: אחרי החלוקה
          נשאר $\frac{\cos n}{n}$, ששואף ל-0.
      - value: 2
        feedback: >-
          $2 = \frac{5-1}{2}$: החלפתם את $\cos n$ ב-$-1$. אחרי החלוקה ב-$n^3$ נשאר $\frac{\cos n}{n}$, ששואף ל-0.
